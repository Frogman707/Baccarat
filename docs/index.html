 * -- this closes the case that was measured and reachable, and claims nothing
 * about the ones that are neither.
 */
function realign(entries, seq) {
  // Only entries the sequence still reaches. An entry past the end is the
  // ordinary undo -- the last coup taken back -- and letting one in here would
  // read it as a mismatch and, one time in three by luck, shift the whole
  // record to make a withdrawn coup line up.
  const settled = entries.filter((e) => e.r && e.i < seq.length);
  let first = -1;
  for (const e of settled) {
    if (seq[e.i] !== e.r) { first = e.i; break; }
  }
  if (first < 0) return 0;

  /** Does every settled entry from `first` on match, read `by` places over? */
  const holds = (by) => {
    let checked = 0;
    for (const e of settled) {
      if (e.i < first) continue;
      const at = e.i + by;
      if (at < 0 || at >= seq.length) return 0;      // nothing there to match
      if (seq[at] !== e.r) return 0;
      checked += 1;
    }
    return checked;
  };

  const forward = holds(1);                          // a coup arrived before here
  const back = holds(-1);                            // a coup went away
  if (!forward && !back) return 0;

  let by = forward ? 1 : -1;
  if (forward && back) {
    // Both readings fit, which happens when the coups on either side agree.
    // The shoe's own length says which way it went; without that it is a
    // guess, and a guess here is a rescored record.
    const was = Math.max(...settled.map((e) => e.i)) + 1;
    if (seq.length === was + 1) by = 1;
    else if (seq.length === was - 1) by = -1;
    else return 0;
  }

  let moved = 0;
  for (const e of entries) {
    if (e.i < first) continue;
    e.i += by;
    moved += 1;
  }
  return moved;
}

function settlePredictions(log, table, sequences) {
  const t = log.tables[table];
  if (!t) return 0;
  let done = 0;
  const keep = [];

  // Before reading anything at an index, make sure the indices still mean what
  // they meant. See `realign`.
  const byShoe = new Map();
  for (const e of t.entries) {
    if (!byShoe.has(e.s)) byShoe.set(e.s, []);
    byShoe.get(e.s).push(e);
  }
  for (const [id, entries] of byShoe) {
    const seq = sequences[id];
    if (typeof seq === "string") done += realign(entries, seq) ? 1 : 0;
  }

  for (const e of t.entries) {
    const seq = sequences[e.s];
    const known = typeof seq === "string";
    // A shoe the record no longer holds at all: an import replaced it, or it
    // was dropped. Nothing can be said about those predictions, either way.
    if (!known) { keep.push(e); continue; }

    // Still waiting, and the shoe up to its coup is not the shoe it was made
    // from: let go, for the prediction made from the shoe as it now stands
    // (see `basisOf`). A settled one stays as it was made -- that was the
    // call on screen when its coup came -- and only follows its outcome.
    if (!e.r && e.h && seq.length >= e.i && basisOf(seq.slice(0, e.i)) !== e.h) {
      done += 1;
      continue;
    }

    if (seq.length > e.i) {
      if (e.r !== seq[e.i]) { e.r = seq[e.i]; done += 1; }
      keep.push(e);
      continue;
    }
    // The record no longer reaches this coup. If it never did, the prediction
    // is simply still pending. If it did, the coup was undone, and the entry
    // goes with it.
    if (e.r) { done += 1; continue; }
    keep.push(e);
  }
  t.entries = keep;
  return done;
}

/**
 * Oldest first into the roll-up, so the totals survive the cap.
 *
 * Settled rows only. A prediction that has not had its coup yet has not been
 * counted anywhere, so evicting it would not shrink the list at the cost of a
 * row -- it would delete a prediction outright, and the coup that was about to
 * settle it would find nothing waiting. Measured: recording faster than the
 * coups arrive dropped five hundred predictions out of the score entirely.
 *
 * The ceiling below is for the case that leaves: a table left open, a shoe
 * abandoned, a backlog of predictions whose coups are never coming. Those are
 * given up rather than allowed to grow without end, and counted as having been
 * made and never scored.
 */
function trim(t, cap = LOG_CAP) {
  if (t.entries.length <= cap) return;
  let excess = t.entries.length - cap;
  const keep = [];
  for (const e of t.entries) {
    if (excess > 0 && e.r) { foldInto(t.rolled, e); excess -= 1; continue; }
    keep.push(e);
  }
  while (keep.length > cap * (LOG_CEILING / LOG_CAP)) { t.rolled.n += 1; keep.shift(); }
  t.entries = keep;
}

/**
 * Make room in the store: list at most `cap` entries on any table, rolling
 * the oldest into its totals as `LOG_CAP` does.
 *
 * Each table is capped on its own, at about two hundred kilobytes, and the
 * browser keeps about five million characters for the whole page -- so a
 * score of tables watched for a season fill it with the log alone, and then
 * the next coup cannot be kept. The coups come first: when the store is full
 * the log gives up its list, never its totals, until they fit. Returns how
 * many entries were rolled.
 */
function shrinkPredictions(log, cap) {
  let rolled = 0;
  for (const t of Object.values(log.tables)) {
    const before = t.entries.length;
    trim(t, cap);
    rolled += before - t.entries.length;
  }
  return rolled;
}

/** Add one settled entry to a roll-up. */
function foldInto(roll, e) {
  const [pP, pB, pT] = e.p;
  roll.n += 1;
  roll.settled += 1;
  if (e.b) roll.backed += 1;

  // Proper scoring rules take every coup, ties included: they are about the
  // whole distribution, not about the side that was named.
  const truth = { P: pP, B: pB, T: pT }[e.r];
  roll.logLoss += -Math.log(Math.max(1e-12, truth ?? 1e-12));
  roll.brier += (pP - (e.r === "P" ? 1 : 0)) ** 2
              + (pB - (e.r === "B" ? 1 : 0)) ** 2
              + (pT - (e.r === "T" ? 1 : 0)) ** 2;

  // Hit rate takes only the coups a side bet could settle. A tie pushes, so
  // counting it as a miss would understate every rule equally and mean
  // nothing; leaving it out is what the comparison below needs.
  if (e.r === "T") return;
  roll.decided += 1;
  const hit = e.k === e.r;
  if (hit) roll.hits += 1;
  if (e.r === "B") roll.baseHits += 1;        // always backing Banker
  // Where the two rules part company: only there can the gap between them
  // move, so its error is counted from these.
  if (e.k !== "B") roll.against += 1;
  if (e.b) {
    roll.backedDecided += 1;
    if (hit) roll.backedHits += 1;
  } else {
    roll.abstained += 1;
  }

  // Calibration: of the coups where the app gave the named side 51%, how many
  // came in? Its chance of winning a decided coup, because that is what a hit
  // is counted over. `p` shares a coup among Player, Banker and the tie, so
  // the named side's own share carries the tie's part too -- 45.86% for a
  // Banker that wins 50.68% of decided coups -- and held against a hit rate
  // that leaves ties out, the true probabilities read as five points out.
  const said = (e.k === "B" ? pB : pP) / ((pB + pP) || 1);
  const bin = Math.min(CALIBRATION_BINS - 1, Math.max(0, Math.floor(said * CALIBRATION_BINS)));
  const c = roll.cal[bin];
  c.n += 1;
  c.said += said;
  if (hit) c.hits += 1;
}

/**
 * Everything the panel reports, over one table's whole log.
 *
 * Accuracy is never quoted on its own. A rule that names the more common side
 * every time scores about 51% on decided coups and knows nothing, so the only
 * number that means anything is the gap to that rule on the same coups --
 * which is why `baseline` is computed here rather than left to be compared
 * against a figure from somewhere else.
 */
function scorePredictions(log, table) {
  const t = log.tables[table];
  const roll = emptyRoll();
  if (t) {
    // The roll-up already holds what was evicted.
    merge(roll, t.rolled);
    for (const e of t.entries) {
      if (e.r) foldInto(roll, e);
      else roll.n += 1;
    }
  }

  const rate = (a, b) => (b ? a / b : NaN);
  return {
    ...roll,
    pending: roll.n - roll.settled,
    accuracy: rate(roll.hits, roll.decided),
    baseline: rate(roll.baseHits, roll.decided),
    edge: roll.decided ? (roll.hits - roll.baseHits) / roll.decided : NaN,
    edgeError: edgeError(roll),
    ...lead(roll),
    backedAccuracy: rate(roll.backedHits, roll.backedDecided),
    meanLogLoss: rate(roll.logLoss, roll.settled),
    meanBrier: rate(roll.brier, roll.settled),
    calibration: roll.cal.map((b, i) => ({
      from: i / CALIBRATION_BINS,
      to: (i + 1) / CALIBRATION_BINS,
      n: b.n,
      stated: rate(b.said, b.n),
      observed: rate(b.hits, b.n),
    })),
    // How far the stated confidence sits from what happened, averaged over the
    // bins that have anything in them. This is the number that says whether a
    // probability on screen can be read as a probability.
    calibrationError: calibrationError(roll),
    // And what an honest one would show anyway at this count, since a gap
    // is never exactly zero: it is what the error is read against.
    calibrationNoise: calibrationNoise(roll),
  };
}

function merge(into, from) {
  if (!from) return;
  for (const key of ["n", "settled", "decided", "hits", "baseHits", "backed",
                     "backedDecided", "backedHits", "abstained", "logLoss", "brier"]) {
    into[key] += Number(from[key]) || 0;
  }
  // An older build did not count where the rules parted. Taking every one of
  // its decided coups as a parting can only widen the error, never narrow it.
  into.against += Number.isFinite(Number(from.against))
    ? Number(from.against) : Number(from.decided) || 0;
  const cal = Array.isArray(from.cal) ? from.cal : [];
  for (let i = 0; i < into.cal.length; i += 1) {
    into.cal[i].n += Number(cal[i]?.n) || 0;
    into.cal[i].hits += Number(cal[i]?.hits) || 0;
    into.cal[i].said += Number(cal[i]?.said) || 0;
  }
}

/**
 * The standard error of the gap to always-Banker, from the coups it was
 * measured on.
 *
 * The two rules are scored on the same coups, so the gap is a mean of
 * per-coup differences: nothing where both named Banker, and one either way
 * where the recommendation named Player. Its error follows from how often
 * that happened. The figure this replaces, the square root of 0.5/n, was
 * called a bound and is one only for a rule that parts from Banker half the
 * time: for one that names Player nine times in ten it is a quarter too
 * small, and a gap with no edge behind it was called larger than its error
 * 48% of the time rather than 33%. For one that rarely parts it was more
 * than twice too large.
 */
function edgeError(roll) {
  const n = roll.decided;
  if (!n) return NaN;
  const mean = (roll.hits - roll.baseHits) / n;
  return Math.sqrt(Math.max(0, roll.against / n - mean * mean) / n);
}

/**
 * What the gap to always-Banker can be called, read as often as it is read.
 *
 * The panel reads this record after every coup. It called a gap bigger than
 * one standard error "larger than its error", in green, and a recommendation
 * with no edge at all reaches that sooner or later: measured, at some point
 * in 62-77% of sessions within 200 decided coups and 76-82% by 3,000,
 * whichever share of the time it named Player. The first coup could do it
 * alone -- one lucky Player call, and the error of a single coup reads as
 * zero.
 *
 * The gap moves only where the recommendation named Player, by one either
 * way: exactly the walk the network's trust test holds to Robbins' boundary
 * in `learn.js`, so it is held to the same boundary here, with the same
 * floor. A recommendation with no edge, read after every coup to 3,000,
 * crossed it in none of 800 sessions.
 *
 *   ahead     beyond the boundary
 *   behind    more than one standard error behind -- which a recommendation
 *             with no edge that names Player is expected to be anyway, since
 *             Banker wins more of the coups that are decided
 *   tooFew    Player named on fewer decided coups than the floor
 *   noise     none of those
 */
function lead(roll) {
  if (!roll.decided) return { call: null, z: NaN, bar: NaN };
  const n = roll.against;
  const swing = roll.hits - roll.baseHits;
  const gap = swing / roll.decided;
  const call = n >= TRUST_FLOOR && swing >= trustBoundary(n) ? "ahead"
    : gap < -edgeError(roll) ? "behind"
    : n < TRUST_FLOOR ? "tooFew"
    : "noise";
  return {
    call,
    // How far ahead, and how far the boundary asks for, in standard errors
    // of the walk -- to say beside a gap that has not reached it.
    z: n > 0 ? swing / Math.sqrt(n) : 0,
    bar: n > 0 ? trustBoundary(n) / Math.sqrt(n) : NaN,
  };
}

/**
 * Expected calibration error: each bin's gap between what came in and what
 * was stated, weighted by how full the bin is -- the same figure as
 * `calibration_curve` in baccarat/eval/metrics.py. Held to the bin's
 * midpoint instead, as it once was, a model saying 50.7% into the 50-60%
 * bin was marked four points out for being right.
 */
function calibrationError(roll) {
  let seen = 0, sum = 0;
  for (const b of roll.cal) {
    if (!b.n) continue;
    sum += Math.abs(b.hits - b.said);       // n times |observed - stated|
    seen += b.n;
  }
  return seen ? sum / seen : NaN;
}

/**
 * The calibration error a perfectly stated probability shows anyway.
 *
 * A bin of n coups at stated p comes in at p give or take sqrt(p(1-p)/n),
 * and the mean size of that miss is sqrt(2/pi) of it. So a hundred decided
 * coups show about four points of "error" with nothing wrong, and it takes
 * thousands before the figure can say anything smaller.
 */
function calibrationNoise(roll) {
  let seen = 0, sum = 0;
  for (const b of roll.cal) {
    if (!b.n) continue;
    const p = Math.min(1, Math.max(0, b.said / b.n));
    sum += Math.sqrt((2 / Math.PI) * p * (1 - p) * b.n);
    seen += b.n;
  }
  return seen ? sum / seen : NaN;
}

/**
 * Read a stored log back, keeping only what is shaped like one.
 *
 * The same standard the corpus is held to: a store that has been hand-edited,
 * half-synced or written by an older build must not be able to put a string
 * where a probability goes and have every figure below quietly become NaN.
 */
function sanitiseLog(raw) {
  const out = emptyLog();
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return out;
  const tables = raw.tables && typeof raw.tables === "object" ? raw.tables : {};
  for (const [name, value] of Object.entries(tables)) {
    if (!name || !value || typeof value !== "object") continue;
    const t = tableLog(out, name);
    merge(t.rolled, value.rolled);
    const entries = Array.isArray(value.entries) ? value.entries : [];
    for (const e of entries) {
      const clean = sanitiseEntry(e);
      if (clean) t.entries.push(clean);
    }
    trim(t);
  }
  return out;
}

function sanitiseEntry(e) {
  if (!e || typeof e !== "object") return null;
  if (typeof e.s !== "string" || !e.s) return null;
  const i = Number(e.i);
  if (!Number.isInteger(i) || i < 0) return null;
  const p = Array.isArray(e.p) ? e.p.map((x) => (Number.isFinite(Number(x)) ? Number(x) : 0)) : [];
  if (p.length !== 3) return null;
  if (e.k !== "B" && e.k !== "P") return null;
  const r = e.r === "B" || e.r === "P" || e.r === "T" ? e.r : null;
  return {
    s: e.s, i, p, k: e.k,
    b: e.b ? 1 : 0,
    c: Number.isFinite(Number(e.c)) ? Math.round(Number(e.c)) : 0,
    m: typeof e.m === "string" ? e.m : "",
    f: typeof e.f === "string" ? e.f : "",
    t: Number.isFinite(Number(e.t)) ? Number(e.t) : 0,
    r,
    h: typeof e.h === "string" && /^[0-9a-z]{1,8}$/.test(e.h) ? e.h : "",
  };
}

/** The most recent settled and pending entries, newest first, for the table. */
function recentPredictions(log, table, limit = 20) {
  const t = log.tables[table];
  if (!t) return [];
  return t.entries.slice(-limit).reverse();
}

/** Drop one table's log, when its table is deleted. */
function forgetPredictions(log, table) {
  delete log.tables[table];
}

/** Follow a table through a rename, so its record is not orphaned. */
function renamePredictions(log, from, to) {
  if (!log.tables[from] || from === to) return;
  log.tables[to] = log.tables[from];
  delete log.tables[from];
}

/* ═══ live.js ═══ */
/* Watch the table's screen live.
 *
 * Two ways in, one pipeline. `getDisplayMedia` asks the browser for a stream
 * of a window or tab the viewer picks -- the same pixels they are already
 * looking at. `getUserMedia` asks for the camera, which is what a phone has
 * instead: point it at the table's screen and the frames read the same way.
 * Either stream feeds the bead-plate detector, so the board is read
 * continuously with no capture step, and still without touching the
 * operator's site, its markup or its credentials.
 *
 * Two things keep a live feed from writing nonsense into the corpus:
 *
 * 1. A frame caught mid-deal can show a half-drawn board, so a reading is only
 *    emitted once consecutive frames agree on it. Growth is confirmed quickly;
 *    a shoe change, which discards the shoe in progress, is held to a stricter
 *    count.
 * 2. Once the board is found its position is locked, and later frames are only
 *    searched there. That is faster, and it stops the detector wandering onto a
 *    different grid on the same screen between frames.
 *
 * The lock is taken from the roads themselves rather than from the coups in
 * them. A road is a ruled lattice of cells, printed on the page whether or not
 * anything has been dealt into it -- it is what the table clears *to* between
 * shoes -- so the region can be pinned to it before the first coup and held
 * through the wipe that ends a shoe. Finding the region by finding marks, which
 * is what this did, cannot work at exactly the moment it matters most: the
 * board is empty, the region goes with it, and the first coup of the new shoe
 * arrives with nowhere to be read.
 *
 * And where neither way of looking gets it right, the viewer can draw the
 * region themselves, which nothing here is allowed to move.
 */



/** Consecutive identical readings required before a change is accepted. */
const CONFIRM_GROWTH = 2;
const CONFIRM_RESET = 3;
/**
 * Empty samples inside the locked strip before the shoe is called finished.
 *
 * Every road on a table clears at the same moment when the shoe changes, so
 * "the locked strip has nothing in it" is what a shoe change looks like from
 * here -- and it is also what a window that moved looks like. The two are told
 * apart by evidence rather than by waiting: at this count the whole screen is
 * searched once, and a strip found elsewhere means the window moved.
 */
const CLEAR_PATIENCE = 3;

/**
 * How long a strip that has gone quiet is still the strip.
 *
 * A shoe change empties every road at once and the shuffle that follows runs
 * for minutes. For all of that time the watched strip reads nothing, and
 * anything else on screen with marks in it -- the table beside this one, a
 * second board in the lobby view -- outscores an empty strip trivially. Left
 * to a score comparison the reader walks off to that other board partway
 * through every shuffle and reads its coups as this table's.
 *
 * So an empty strip is not evidence for this long. Past it, a strip that has
 * stayed silent really has been left behind, and the search opens up again.
 *
 * Two minutes covers a shoe change and the shuffle after it with room to
 * spare, and is what a window that really did move costs to recover from --
 * or nothing at all, if the viewer presses the button the status bar offers.
 * The trade is deliberate: a wrong board read as this table's puts another
 * table's coups in the corpus, and that is worse than a wait.
 */
const MEMORY_HOLD_MS = 2 * 60 * 1000;
/**
 * How far below the best board on the frame the one being followed may fall
 * before the anchor stops protecting it.
 *
 * The anchor exists to stop the reading hopping between boards as a strip
 * fills in, not to defend a bad first choice. Without a floor it does the
 * latter: one frame where the bead plate was missed leaves the anchor on the
 * big road, and every frame after that hands the reading to a board scoring a
 * fifteenth as well -- which drops ties and folds runs past six rows.
 */
const PICK_TOLERANCE = 0.5;
/**
 * Marks a single column may hold and still be read before it has grown.
 *
 * A casino strip carries more than its roads. Beside them a table keeps a
 * legend -- a column of icons, Banker, Player, Tie and the two pairs, each
 * beside its count -- and the ask-road icons, a short column under each side.
 * To a reader looking for a board those are a young shoe's first column:
 * round marks, in the right colours, one under another. And they never
 * change, so a reader that took one stayed on it. Measured on an owner's own
 * table: started while the strip was empty between shoes, the reader read the
 * legend as a five-coup shoe, "BPTBP", and held it through every coup of the
 * next shoe, none of which it saw. Pressing "find the board again" during a
 * shuffle did the same.
 *
 * What a fixed column cannot do is grow. So a reader not yet following a
 * board that has shown itself to be a road takes a single column only once
 * it has watched that column gain a mark -- or where it is the only thing on
 * the strip and no longer than a shoe's first hand or two, which is what
 * reading a shoe from its first coup asks for, and what no legend is.
 */
const OPENING_MARKS = 2;
/**
 * Samples between full-screen re-checks, so a bad lock heals on its own.
 *
 * Twelve is about twenty seconds at the default interval -- long enough that
 * the extra full-frame search costs nothing, short enough that nobody sits
 * watching the wrong board for long. Inside a locked region a board is scored
 * against its own neighbours only, so a lock holding just the big road scores
 * a fraction of what the bead plate scores on the whole screen, and the
 * comparison below moves the lock back.
 */
const RECHECK_EVERY = 12;
/**
 * Re-checks that find no ruling before a grid pin is given up.
 *
 * One miss is a frame caught mid-repaint, or a dialog over the strip. Three in
 * a row, a minute apart at the usual sampling rate, is the panel really being
 * gone -- a different tab, a closed window -- and the mark-led search takes
 * over again.
 */
const GRID_PATIENCE = 3;
/**
 * Marks needed to call something a board: fewer once the strip is located, and
 * one is enough in a strip just watched go empty.
 *
 * A new shoe deals into the same place one mark at a time. Holding the strip's
 * usual bar of three would drop the opening coups on the floor, and the cold
 * bar of eight -- which is where losing the lock lands -- drops the first seven.
 */
const COLD_CELLS = 8, LOCKED_CELLS = 3, FRESH_CELLS = 1;

/**
 * The band along the bottom of the screen where a result strip actually lives,
 * and the bar that applies inside it.
 *
 * Every casino layout puts the roads under the table: the video fills the top
 * of the window, the betting panel sits under it, and the strip runs along the
 * bottom. Searching there first is worth far more than it looks, because the
 * cold bar of eight marks is not caution about boards -- it is caution about
 * everything else on a screen, and most of everything else is above this line.
 *
 * A fraction rather than a pixel count, so it means the same thing whether the
 * casino window is filling a monitor or shrunk into the corner of one.
 */
const BAND_FRACTION = 0.45;
/**
 * One mark. In the band, with the shape rule in `detect.js` keeping a row of
 * betting chips from passing as a road's opening, a single bead is a coup --
 * which is what "read it even if only one hand has been dealt" requires, and
 * what a shoe's first coup is.
 */
const BAND_CELLS = 1;

/**
 * Whether what was found runs off the edge of where we were looking.
 *
 * Only the edges the hint itself introduced matter -- the band spans the full
 * width and reaches the foot of the frame, so its top is the only side that
 * can cut anything. A mark's diameter of slack, because a board that merely
 * starts near the boundary is not cut by it.
 */
function clippedBy(bounds, region, diameter) {
  if (!bounds || !region) return false;
  return bounds.y <= region.y + Math.max(2, diameter);
}

/** Whether a box lies inside a region. */
function within(box, region) {
  if (!region) return false;
  return box.x >= region.x && box.x2 <= region.x + region.w
      && box.y >= region.y && box.y2 <= region.y + region.h;
}

/** The bottom band of a frame, as a region to search. */
function bottomBand(frameW, frameH, fraction = BAND_FRACTION) {
  const h = Math.round(frameH * fraction);
  return { x: 0, y: frameH - h, w: frameW, h };
}

/**
 * The region to lock once a strip has been found.
 *
 * Drawn across the full width of the frame rather than tight around the marks.
 * A shoe grows to the right and the derived roads appear one after another, so
 * a box fitted to the strip as it was at the second coup spends the rest of the
 * shoe being widened a cell at a time -- and detection is confined to the
 * region, so it cannot see what it is cutting off. Width costs nothing here:
 * the strip is the only thing in its band, which is what picked it.
 */
function bandLock(bounds, frameW, frameH) {
  const height = bounds.y2 - bounds.y;
  const pad = Math.max(60, height * 0.45);
  const y = Math.max(0, Math.round(bounds.y - pad));
  const y2 = Math.min(frameH, Math.round(bounds.y2 + pad));
  return { x: 0, y, w: frameW, h: y2 - y };
}

/**
 * Where the result strip is, found by its ruling rather than by its marks.
 *
 * The bottom band first, because that is where every casino layout puts the
 * roads and looking there costs a quarter of what looking everywhere costs.
 * Then the whole frame, for the two cases the band gets wrong: a window shrunk
 * until the strip fills most of it, where the band cuts the strip in half, and
 * an operator who puts the roads beside the table rather than under it.
 *
 * Whichever finds the taller panel wins, because a strip cut off by the band's
 * own edge is shorter than the same strip found whole.
 */
function findStrip(frame, frameW, frameH) {
  const band = bottomBand(frameW, frameH);
  const inBand = detectGrid(frame, { region: band });
  // A panel that starts exactly at the band's top edge is a panel the band may
  // have cut. One that starts below it was not cut, and there is nothing the
  // wider search can add.
  if (inBand && inBand.panel.y > band.y + 2) return inBand;
  const whole = detectGrid(frame);
  if (!whole) return inBand;
  if (!inBand) return whole;
  const tall = (g) => g.panel.y2 - g.panel.y;
  return tall(whole) > tall(inBand) ? whole : inBand;
}

/**
 * A lattice at least this full is made of marks rather than ruled.
 *
 * See `latticeFill`: the rulings measured were at most a third full and the
 * lattices of marks entirely full, so the line is drawn well clear of both.
 */
const MARK_LATTICE = 0.75;

/** Whether a strip was found by a ruling, rather than by marks with none. */
function isRuling(grid) {
  return !!grid && !(grid.filled >= MARK_LATTICE);
}

/**
 * The region to watch, given a strip found by its ruling.
 *
 * Full width, like every other lock here, and padded by a cell below so a
 * panel found a row short does not cut the bead plate's last row off.
 *
 * Above, it depends on what was found. A ruling is the panel's own edge, and
 * the roads sit under the table's video: on an owner's screen a cell above it
 * was the bottom of the video -- an orange-red felt, the red of a Banker mark,
 * which the region's edge cut into mark-sized pieces. Started on a shoe two
 * coups old, the reader took those pieces for a big road of twenty-four
 * Bankers; on the owner's own screen, six coups in, sixteen Bankers that
 * were never dealt went into the record. So a ruling gets a quarter of a
 * cell, for its own line: nothing mark-sized fits in it.
 *
 * Marks drawn with no ruling are found as a lattice too, and that lattice
 * lies between them -- its top edge runs under the top row of marks, not
 * over it. A quarter of a cell there cut the shoe's whole top row off, every
 * reading; such a lattice gets the cell it is short by.
 */
function gridLock(grid, frameW, frameH) {
  const above = isRuling(grid) ? Math.max(3, Math.round(grid.pitch * 0.25))
                               : Math.max(4, Math.round(grid.pitch));
  const below = Math.max(4, Math.round(grid.pitch));
  const y = Math.max(0, Math.round(grid.panel.y - above));
  return { x: 0, w: frameW, y, h: Math.min(frameH, Math.round(grid.panel.y2 + below)) - y };
}

/**
 * The ruling inside a box drawn around a strip, or null.
 *
 * Only a ruling. Marks with none make a lattice too, but it lies between
 * them, and the panel it grows to is whatever plain ground surrounds them --
 * reading a box down by that, rather than as drawn, took in a cell above it.
 */
function rulingIn(frame, box) {
  const grid = detectGrid(frame, { region: box });
  return grid && isRuling(grid) ? grid : null;
}

/**
 * Which table a reading belongs to.
 *
 * The reader watches one table's screen. Changing the table selector changes
 * what the page shows; it does not change what the camera sees, so a reading
 * belongs to the table the reader was started on for as long as that table
 * still exists. Filing it under whichever table happens to be selected put one
 * table's board into another's corpus as a new shoe, and every figure that
 * table reports -- its statistics, its integrity verdict, its ledger -- was
 * then computed over two tables mixed together.
 *
 * A table that has been deleted out from under the reader falls back to the
 * selected one, because writing into a table that is not there would lose the
 * reading entirely.
 *
 * A reader started with no table chosen -- `""`, the selector's blank entry --
 * reads onto the unsaved sheet, which is `null` here as it is in the page, and
 * stays there whatever is chosen afterwards, for the same reason.
 */
function readingTable(startedOn, tables, active) {
  if (startedOn === "") return null;
  return startedOn && tables && Object.prototype.hasOwnProperty.call(tables, startedOn)
    ? startedOn
    : active;
}

/**
 * Where to look for the board next, and how little will do.
 *
 * Three situations, and they want three different bars:
 *
 *   locked        the strip is known; three marks in it are coups, not
 *                 coincidence -- one, once it has been watched going empty,
 *                 because a shoe change is exactly when the next mark matters
 *   remembered    the lock was let go but a board was read here not long ago,
 *                 so it is still a known place and one mark is enough
 *   bottom band   nothing known, but the strip lives under the table on every
 *                 casino layout there is -- so the band along the bottom is
 *                 tried first, where three marks will do
 *   cold          the band had nothing either: the whole screen, and eight
 *                 marks before anything is called a board, because at this bar
 *                 a video feed and a betting panel are full of red and blue
 *
 * The remembered strip is what makes a new shoe readable. Without it, letting
 * go of the lock drops the search to the cold bar, and a shoe that has just
 * started is invisible until its eighth coup -- most of the way through the
 * first column, and every one of those coups lost.
 *
 * The band is what makes a new shoe *findable* in the first place. Returned as
 * a list because it is an attempt rather than an answer: if the strip is not
 * under the table on this screen, the whole-screen search still runs.
 */
function searchPlan(region, memory, cleared, frameW = 0, frameH = 0, trusted = false) {
  // A region pinned to the ruling is not a guess about where a board might be.
  // It is the roads panel, found as the roads panel, so one mark in it is a
  // coup and there is nothing to be cautious about. The three-mark bar exists
  // for a region inferred from marks, which can be inferred from the wrong
  // ones.
  if (region) {
    return [{ where: region, minCells: (cleared || trusted) ? FRESH_CELLS : LOCKED_CELLS }];
  }
  if (memory) return [{ where: memory, minCells: FRESH_CELLS }];
  const cold = { where: null, minCells: COLD_CELLS };
  if (!frameW || !frameH) return [cold];
  return [{ where: bottomBand(frameW, frameH), minCells: BAND_CELLS, hint: true }, cold];
}

class LiveWatcher {
  /**
   * @param {object} opts
   * @param {(seq: string, board: object) => void} opts.onRead   confirmed reading
   * @param {(state: object) => void} opts.onState               status for the UI
   * @param {number} opts.intervalMs                             sampling period
   */
  constructor({ onRead, onState, intervalMs = 2000 } = {}) {
    this.onRead = onRead || (() => {});
    this.onState = onState || (() => {});
    this.intervalMs = intervalMs;

    this.stream = null;
    this.video = null;
    this.canvas = null;
    this.timer = null;
    this.region = null;
    /**
     * Where the strip was, kept after the lock is let go.
     *
     * A new shoe deals one mark at a time into the place the last one filled.
     * With no lock the search is the cold one, which needs eight marks before
     * it will call anything a board -- so a shoe that has just started is
     * invisible until its eighth coup, which is most of the way through the
     * first column. Inside a strip a board has already been read in, one mark
     * is enough, and that is the same reasoning the locked bar rests on. So
     * the place is remembered, and it is looked at before the whole screen.
     *
     * Dropped the moment the evidence says the board is somewhere else, so a
     * remembered strip cannot keep the search away from where the board went.
     */
    this.memory = null;
    this.memoryAt = 0;       // when a board was last actually read in it
    /**
     * How the region came to be where it is, and the ruling it was pinned to.
     *
     *   "manual"  the viewer drew it. Nothing here ever moves it.
     *   "grid"    found by its own ruling, which is on screen whether or not a
     *             coup has been dealt -- so it is re-checked against the
     *             ruling rather than against the marks, and an empty strip is
     *             no reason at all to let go.
     *   "marks"   inferred from a board that was read. The old behaviour, and
     *             still the fallback where no ruling can be made out.
     */
    this.pinned = null;
    this.grid = null;        // the lattice the region was pinned to
    this.gridBox = null;     // and the lock it gave, before any widening
    this.gridMisses = 0;     // consecutive re-checks that could not find it
    this.boxLooks = 0;       // looks for the ruling inside a box the viewer drew
    this.bounds = null;      // the whole result strip, in frame pixels
    this.anchor = null;      // centre of the board being read, to keep the pick stable
    this.lastBox = null;     // and its box, so a neighbour is not mistaken for it
    this.lastSize = 0;       // and the size of its marks
    this.lastRead = null;    // and what it read last, through a shoe change too
    /**
     * Whether the board being followed has shown itself to be a road: two
     * columns or more, or a column watched gaining a mark. Only such a board
     * is protected from what else is in the strip -- see `OPENING_MARKS`.
     */
    this.proven = false;
    this.sightings = [];     // single columns seen last sample, and how long they held
    this.empties = 0;        // consecutive samples with nothing in the strip
    this.cleared = false;    // the strip went empty: the next reading is a new shoe
    this.candidate = null;
    this.repeats = 0;
    this.lastBoard = null;
    this.lastReadAt = 0;
    this.reads = 0;
    this.samples = 0;
    this.error = null;
    this.source = null;      // "screen" or "camera", for the error advice
    this.surface = null;     // what was shared: see `_readSurface`
    this.preview = null;     // canvas the feed is painted into
    this.previewSeen = null; // watches whether it is on screen: see `_watchPreview`
    this.previewVisible = true;
    this.previewHandle = null;
    this.previewOwner = null;
    /**
     * A source being brought up, and the number the attempt bringing it up
     * holds.
     *
     * Opening a camera or a screen share is asynchronous and slow -- a picker
     * the viewer has to answer, a camera that has to wake -- and the buttons
     * that ask for one stay pressable throughout. Two presses used to mean two
     * requests: both read `this.stream` as empty, both were granted, the
     * second overwrote the first, and `stop` then closed only what it could
     * see. Measured rather than reasoned about: two `startCamera` calls a tick
     * apart, and after `stop` the first stream's tracks were still live and
     * one sampling interval was still firing. On a phone that is the camera
     * light staying on with nothing left that could turn it off.
     *
     * So a start claims the slot before it waits, and carries a number that
     * `stop` invalidates. An attempt that comes back holding a stale number
     * closes whatever it was given instead of installing it.
     */
    this.starting = null;
    this.attempt = 0;
  }

  get active() { return !!this.stream; }

  /** Sharing a window or tab -- desktop browsers only. */
  static get screenSupported() {
    return typeof navigator !== "undefined" && !!navigator.mediaDevices?.getDisplayMedia;
  }

  /** The camera -- what a phone has instead of screen sharing. */
  static get cameraSupported() {
    return typeof navigator !== "undefined" && !!navigator.mediaDevices?.getUserMedia;
  }

  /** Is any live source available at all? */
  static get supported() {
    return LiveWatcher.screenSupported || LiveWatcher.cameraSupported;
  }

  /**
   * Share a window or tab. Desktop browsers only.
   *
   * Reports failure through `onState` rather than rejecting: what goes wrong
   * here is environmental -- a permissions policy, a cancelled picker -- and
   * the interface has to explain it, not catch it.
   */
  async start() {
    return this._begin("screen", () => navigator.mediaDevices.getDisplayMedia({
      // A cap, not a floor: screen capture sends a frame when the screen
      // changes, so a table sitting still costs nothing either way. Four was
      // enough when the preview only repainted once a reading; now that it
      // paints every frame, four is what a choppy preview looks like.
      //
      // And the picker opens on the tab list, which is what a viewer watching
      // a browser-based table almost always wants.
      video: { frameRate: { ideal: 15 }, displaySurface: "browser" },
      audio: false,
      preferCurrentTab: false,
      selfBrowserSurface: "exclude",
      surfaceSwitching: "include",
      // Not the whole screen. Shared whole, the screen holds this page as well
      // as the table, and this page draws a board the way a casino does --
      // the same beads, the same roads, the same coups -- so the reader had a
      // second, cleaner copy of the table to lock onto, one that only changes
      // when the reader itself does. Measured on an owner's desktop, casino
      // on one half and this page on the other: the whole-frame search ranked
      // this page's bead plate first. It also mirrors itself -- the preview
      // shows the screen, which shows the preview -- so the capture never
      // stops changing, and the casino window, a fraction of the screen,
      // arrives at a fraction of its size. A tab or a window is the table
      // alone, at its own resolution. Browsers that do not know the option
      // ignore it, and `surface` below says when that happened.
      monitorTypeSurfaces: "exclude",
    }));
  }

  /**
   * Point the camera at the table's screen.
   *
   * The rear camera at the highest resolution offered: the bead plate has to
   * survive being photographed, and detail is what the detector has to work
   * with. Everything downstream is identical to a shared screen.
   */
  async startCamera() {
    return this._begin("camera", () => navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        // Aiming a phone at a screen is a hand-eye task: the preview is what
        // you line the bead plate up with, so it has to move like a camera
        // and not like a slideshow. The detector still reads at its own much
        // slower interval -- these frames are for the person, not for it.
        frameRate: { ideal: 30 },
      },
      audio: false,
    }));
  }

  async _begin(source, request) {
    // Already watching, or already on the way up. Pressing both buttons, or
    // one of them twice, is one request as far as this is concerned. See
    // `this.starting`.
    if (this.stream || this.starting) return true;
    const available = source === "camera" ? LiveWatcher.cameraSupported : LiveWatcher.screenSupported;
    if (!available) {
      this.error = "unsupported";
      this.source = source;
      this._emit();
      return false;
    }

    const mine = this.attempt += 1;
    this.starting = source;

    let stream;
    try {
      stream = await request();
    } catch (e) {
      if (this.attempt !== mine) return false;     // stopped while the picker was up
      this.starting = null;
      // A permissions-policy block inside an iframe and an outright refusal
      // both arrive as NotAllowedError; they need different advice, and the
      // page cannot tell them apart, so the UI offers both.
      this.error = e?.name === "NotAllowedError" ? "denied"
        : e?.name === "NotFoundError" || e?.name === "OverconstrainedError" ? "nosource"
        : "failed";
      this.stream = null;
      this.source = source;
      this._emit();
      return false;
    }

    // Stopped while the picker was up. The watcher never took this stream, so
    // nothing else is holding it and nothing else can close it -- which is
    // exactly the leak this is here to stop.
    if (this.attempt !== mine) {
      for (const t of stream.getTracks()) t.stop();
      return false;
    }

    this.starting = null;
    this.stream = stream;
    this.error = null;
    this.source = source;
    this._readSurface();
    this.video = document.createElement("video");
    this.video.srcObject = this.stream;
    this.video.muted = true;
    this.video.playsInline = true;
    this.canvas = document.createElement("canvas");
    await this.video.play().catch(() => {});

    // Stopped during `play`. `stop` had the stream by then and has already
    // closed it, so there is nothing left to release here -- only a sampler
    // not to start for a source that is gone.
    if (this.attempt !== mine) return false;

    for (const track of stream.getVideoTracks()) {
      track.addEventListener("ended", () => this.stop());
    }

    this._reset();
    this._startPreview();
    // A timer, not a frame callback, and never stood down while this page is
    // hidden: the owner shares the casino's tab and goes there to watch, and
    // this page is then a tab behind it, where nothing is drawn at all. Its
    // timers are only slowed, and not by enough to matter -- measured in a
    // real window, hidden for seven and a half minutes, every coup was read
    // within two and a half seconds (see `tests/browser/test_hidden_tab.py`).
    this.timer = setInterval(() => this._sample(), this.intervalMs);
    this._sample();
    this._emit();
    return true;
  }

  stop() {
    // Any start still waiting on a picker is no longer wanted. Its number
    // stops matching, so when it is finally answered it closes what it was
    // given rather than installing it.
    this.attempt += 1;
    this.starting = null;
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
    this._stopPreview();
    if (this.stream) for (const t of this.stream.getTracks()) t.stop();
    this.stream = null;
    this.surface = null;
    if (this.video) { this.video.srcObject = null; this.video = null; }
    this._reset();
    this._emit();
  }

  /** Forget the locked position, e.g. after switching tables. */
  relock() {
    this.region = null;
    this.pinned = null;
    this.grid = null;
    this.gridBox = null;
    this.gridMisses = 0;
    this.boxLooks = 0;
    this.memory = null;              // being told the lock is wrong
    this.memoryAt = 0;
    this._unfollow();
    this.bounds = null;
    this.empties = 0;
    this.cleared = false;
    this.candidate = null;
    this.repeats = 0;
  }

  /**
   * Watch this box and nothing else, until told otherwise.
   *
   * The one thing that cannot fail. Everything else here is the reader working
   * out where the roads are -- from their marks, and now from their ruling --
   * and both are inferences about a screen it has never seen before. A box the
   * viewer drew around their own table's strip is not an inference, so nothing
   * in the sampler is allowed to move it, widen it, or hand it over to a
   * better-looking board somewhere else. Only its top and bottom edges are
   * read by the strip's own ruling when one is found inside it, because a
   * hand is not that exact (see `_readArea`).
   *
   * Given in frame pixels at working resolution, which is what the preview
   * canvas is drawn at, so the caller can pass a box read straight off it.
   */
  pinRegion(box) {
    if (!box || box.w < 8 || box.h < 8) return false;
    this.region = this.memory = { x: box.x, y: box.y, w: box.w, h: box.h };
    this.memoryAt = Date.now();
    this.pinned = "manual";
    this.grid = null;
    this.gridBox = null;
    this.gridMisses = 0;
    this.boxLooks = 0;
    this._unfollow();
    this.candidate = null;
    this.repeats = 0;
    this.empties = 0;
    this.cleared = false;
    this._emit();
    return true;
  }

  /**
   * What kind of thing is being shared: "browser" (a tab), "window", or
   * "monitor" -- the whole screen, with this page in it. A camera has none.
   * Read again every sample, because the browser's own bar can switch the
   * shared surface mid-session.
   */
  _readSurface() {
    const track = this.stream?.getVideoTracks?.()[0];
    const now = (this.source === "screen" && track?.getSettings?.()?.displaySurface) || null;
    const changed = now !== this.surface;
    this.surface = now;
    return changed;
  }

  /** Stop following the board being read: the next one has to show itself. */
  _unfollow() {
    this.lastBox = null;
    this.lastSize = 0;
    this.lastRead = null;
    this.anchor = null;
    this.proven = false;
    this.sightings = [];
  }

  /** Give the region back to the reader. */
  unpin() {
    this.relock();
    this._emit();
  }

  /** Named apart from the global `setInterval` it calls, to stay readable. */
  setSampleInterval(ms) {
    this.intervalMs = ms;
    if (this.timer) {
      clearInterval(this.timer);
      this.timer = setInterval(() => this._sample(), this.intervalMs);
    }
  }

  _reset() {
    this.relock();
    this.lastBoard = null;
    this.reads = 0;
    this.samples = 0;
  }

  _emit() {
    this.onState({
      active: this.active,
      error: this.error,
      board: this.lastBoard,
      source: this.source,
      surface: this.surface,
      bounds: this.bounds,
      locked: !!this.region,
      pinned: this.pinned,
      grid: this.grid && { cols: this.grid.cols, rows: this.grid.rows,
                           pitch: Math.round(this.grid.pitch) },
      cleared: this.cleared,
      lastReadAt: this.lastReadAt,
      reads: this.reads,
      candidate: this.candidate,
      repeats: this.repeats,
    });
  }

  /** Grab one frame, read it, and emit only once frames agree. */
  _sample() {
    const v = this.video;
    if (!v || !v.videoWidth) return;
    if (this._readSurface()) this._emit();

    const scale = Math.min(1, WORK_MAX / Math.max(v.videoWidth, v.videoHeight));
    const w = Math.round(v.videoWidth * scale), h = Math.round(v.videoHeight * scale);
    if (this.canvas.width !== w || this.canvas.height !== h) {
      this.canvas.width = w; this.canvas.height = h;
    }
    const ctx = this.canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(v, 0, 0, w, h);
    const frame = ctx.getImageData(0, 0, w, h);

    // Inside a located strip three marks are coups, not coincidence, so a shoe
    // is read from its opening hands instead of waiting for eight. A cold
    // full-screen search keeps the higher bar, where anything red or blue can
    // turn up.
    this.samples += 1;

    // Before looking for marks, look for the panel they are dealt into.
    //
    // This is the whole change. Everything below finds the board by finding
    // its marks, which cannot work at a shoe change, when there are none --
    // and a shoe change is when it matters most, because the region is the
    // only thing that tells the next coup apart from the table next door. The
    // ruling of the roads is on screen either way: it is what the operator
    // clears *to*. So the region is pinned to the ruling, and an empty strip
    // stops being a reason to go looking anywhere else.
    if (!this.region && this.pinned !== "manual") {
      const grid = findStrip(frame, w, h);
      if (grid) {
        this.grid = grid;
        this.gridMisses = 0;
        this.pinned = "grid";
        this.gridBox = gridLock(grid, w, h);
        this.region = this.memory = this.gridBox;
        this.memoryAt = Date.now();
      }
    }

    // A box the viewer drew is theirs: nothing here moves it, or hands it to
    // another board. But it is drawn by hand, on a preview a fraction of the
    // frame's size, around a strip that sits under the table's video. On an
    // owner's screen a box drawn fifteen pixels loose cut the felt above the
    // strip into a big road of twenty Bankers; one drawn two pixels into the
    // strip clipped its first row and lost the Tie in it; and a shoe of a few
    // coups was not read at all, its one column waiting to be seen growing.
    // So the ruling is looked for where the box was drawn, as it is
    // everywhere else, and with one the box is read the way a strip found by
    // its ruling is (see `_readArea`, `_opensThePanel`). Every sample until it
    // is found, for a while: a box is drawn on whatever the preview shows, and
    // that can be a frame with no strip in it.
    if (this.pinned === "manual" && !this.grid) {
      const look = this.boxLooks++;
      if (look < RECHECK_EVERY || look % RECHECK_EVERY === 0) {
        const grid = rulingIn(frame, this.region);
        if (grid) this.grid = grid;
      }
    }

    const trusted = this.pinned === "grid" || this.pinned === "manual";
    const remembering = !this.region && !!this.memory;
    const following = !!(this.region && this.lastBox && this.proven);
    // The board being followed is read as one, so a mark hidden inside it is
    // a hole in it rather than a seam between two boards (see `groupBlobs`).
    const whole = following ? { ...this.lastBox, d: this.lastSize } : null;
    let boards = [], bounds = null;
    for (const attempt of searchPlan(this._readArea(w, h), this.memory, this.cleared, w, h, trusted)) {
      const got = detectBoards(frame, { region: attempt.where, minCells: attempt.minCells, whole });
      if (!got.boards.length) continue;
      if (!boards.length || got.boards[0].cells.length > boards[0].cells.length) {
        boards = got.boards; bounds = got.bounds;
      }
      // The band says where strips usually are. It says nothing about where
      // this one ends, so a board running off its upper edge has been cut in
      // half by the guess rather than found by it -- and half a bead plate is
      // not a short shoe, it is the wrong rows of a long one. Whoever is
      // sharing a window rather than a whole desktop gets exactly that: the
      // strip fills the frame, the band takes the bottom of it, and five
      // columns of six read as five columns of three. Widen and keep whichever
      // reads more.
      if (!(attempt.hint && clippedBy(got.bounds, attempt.where, got.diameter))) break;
    }

    // Inside a lock, only what carries on from the board being read is this
    // table's. Filtered here rather than at the pick, so a strip holding
    // nothing but a neighbour reads as empty and takes the path an emptied
    // strip already takes.
    //
    // Once that board has shown itself to be a road. Until then nothing is
    // protected, and what is read is what has shown itself here: a fixed
    // column beside the roads -- a legend, the ask-road icons -- is in the
    // same strip and outscores a young shoe, and protecting it locked the
    // reader onto it for good. See `OPENING_MARKS`.
    //
    // Unless it has moved. The window scrolled, or was resized, or laid out
    // again: the board is elsewhere, and what is where it was is empty. Read as
    // a shoe change, the reader sat on the empty place waiting for a shoe that
    // was being dealt somewhere else -- measured in the page, a strip moved a
    // board's height down or across stayed "finished" for as long as it was
    // watched, the coups dealt meanwhile unread. Where nothing at all is left
    // where it was, a board elsewhere that reads as what was read last, and
    // goes on from it, is that board.
    if (following) {
      const carried = boardsCarryingOn(boards, this.lastBox);
      boards = carried.length ? carried : movedTo(boards, this.lastRead);
    } else {
      boards = this._roadsAmong(boards);
    }

    // A remembered strip is given up on time, not on emptiness: emptiness is
    // what a shoe change looks like, and it lasts for the whole shuffle.
    if (remembering && !boards.length && Date.now() - this.memoryAt > MEMORY_HOLD_MS) {
      this.memory = null;
    }

    // Every so often, look at the whole screen again. If the strip is clearly
    // elsewhere -- the window moved, or the first lock landed on the wrong
    // thing -- this is what lets go of it. Counted in samples rather than
    // readings: a strip reading nothing is exactly when this is needed, and
    // counting readings meant it never ran then.
    // While the remembered strip is still within its hold, an empty reading
    // there says "between shoes", not "wrong place", and nothing found
    // elsewhere is allowed to argue with it.
    const holding = this.memory && Date.now() - this.memoryAt <= MEMORY_HOLD_MS;

    // A region pinned to the ruling is re-checked against the ruling. That is
    // a question about the panel, which is always there, rather than about the
    // coups in it, which are not -- so the answer does not change at a shoe
    // change, and the lock does not move at one either.
    if (this.pinned === "grid" && this.samples % RECHECK_EVERY === 0) {
      const grid = findStrip(frame, w, h);
      if (grid) {
        const before = this.grid;
        this.gridMisses = 0;
        this.grid = grid;
        const want = gridLock(grid, w, h);
        // Measured against the lock the ruling last gave rather than against
        // the region in force, because the region in force has been widened
        // since -- a shoe growing to the right pushes its edges out. Comparing
        // with that would read the reader's own widening as the window having
        // moved, and re-pin every time, undoing it.
        const was = this.gridBox || want;
        // The ruling's own corner says when it has moved, too. The lock is
        // the panel grown out around it, and a dark panel on a dark page
        // grows to the whole frame, where it does not move however far the
        // ruling inside it does. Half a cell is enough to say so: the board
        // being followed is looked for where it was (see `boardsCarryingOn`),
        // and a young shoe's single column is one mark wide -- measured in a
        // long sitting, the window resized and moved thirty pixels at the
        // second coup of a shoe, short of a whole cell, and the reader sat on
        // the empty place for the rest of the shoe.
        const shifted = !!before && !!before.box
          && (Math.abs(grid.box.x - before.box.x) > grid.pitch / 2
              || Math.abs(grid.box.y - before.box.y) > grid.pitch / 2);
        if (shifted || Math.abs(want.y - was.y) > grid.pitch
            || Math.abs(want.h - was.h) > grid.pitch) {
          this.region = this.memory = want;
          this._unfollow();
        }
        this.gridBox = want;
        // A lattice that has never produced a coup is a lattice, not
        // necessarily *the* roads. Something else ruled into cells -- a
        // spreadsheet, a schedule, the wrong window entirely -- keeps
        // answering the re-check above, so the miss counter never fires and
        // the pin would sit there for the rest of the session. So while a grid
        // pin has read nothing at all, the screen outside it is still looked
        // at, and a real board found out there takes the pin away.
        //
        // Only while it has read nothing. Once a coup has come out of it the
        // pin has proved itself, and an empty strip is a shoe change rather
        // than a mistake -- which is the whole thing this was built to stop
        // being confused about.
        if (!this.reads) {
          const elsewhere = detectBoards(frame, { minCells: COLD_CELLS });
          const best = elsewhere.boards[0];
          if (best && !boards.length && !within(best.box, this.region)) {
            boards = elsewhere.boards;
            bounds = elsewhere.bounds;
            this.pinned = null;
            this.grid = null;
            this.gridBox = null;
            this.region = this.memory = null;
            this._unfollow();
          }
        }
      } else if ((this.gridMisses += 1) >= GRID_PATIENCE) {
        // The ruling is not there any more, several looks running. The panel
        // really has gone -- a different tab, a closed window -- so the pin
        // goes with it and the mark-led search takes over again.
        this.pinned = null;
        this.grid = null;
        this.gridMisses = 0;
      }
    }

    // A region the viewer drew is theirs, and neither re-check touches it.
    if (this.region && !this.pinned && this.samples % RECHECK_EVERY === 0) {
      const full = detectBoards(frame, { minCells: COLD_CELLS });
      const here = boards.length ? boards[0].score : 0;
      // The lock only moves off a strip that has been silent long enough to
      // have been left behind. A strip with marks in it has not been left
      // behind, however few those marks are -- and a strip that has just
      // turned over has exactly one. Comparing scores there is comparing one
      // coup against a neighbouring table's full board, which the neighbour
      // wins every time: measured, the reader read the new shoe's first coup
      // correctly, then handed the lock over and added seven of the
      // neighbour's coups to this table's shoe.
      //
      // `holding` is the memory's own window, and its whole purpose is this:
      // past it a quiet strip really has been abandoned, and the search opens
      // up again. Before it, quiet is what a shoe change sounds like.
      const abandoned = !boards.length && !holding;
      if (abandoned && full.boards.length && full.boards[0].score > here * 1.25) {
        boards = full.boards;
        bounds = full.bounds;
        this.region = null;
        this.memory = null;          // the board is over there, not here
        this._unfollow();
        this.cleared = false;
      } else if (full.bounds) {
        // Same strip, and it may have grown since the lock was taken -- the
        // derived roads arrive several columns into the shoe, and a lock taken
        // before them cuts them off for the rest of it.
        const grown = growToStrip(this.region, full.bounds, w, h);
        if (grown !== this.region) {
          this.region = grown;
          if (this.memory) this.memory = grown;
        }
      }
    }

    if (!boards.length && this.region) {
      // An empty strip is not a lost board. The table wipes every road at once
      // when the shoe changes, so falling back to a full search here searched
      // for eight marks the new shoe had not dealt yet -- and told the viewer
      // their screen sharing was broken while it did. The lock is kept and the
      // emptiness reported instead.
      if (this.empties === CLEAR_PATIENCE) {
        // The strip is empty and the lock stays on it.
        //
        // This used to search the whole screen here, and hand the lock over to
        // whatever it found. The reasoning was that something visible outside
        // the strip might mean the window had moved. On a casino screen it
        // almost never does: the betting panel and the neighbouring table were
        // there the whole time and are only *interesting* now because this
        // strip went quiet. An empty strip scores zero, so anything at all
        // beat it, and the lock went to the neighbour every shoe change.
        //
        // Measured on a screen carrying a second board: the first shoe read
        // 34 of 34, the table wiped, one coup of the new shoe was dealt -- and
        // the reader came back with 42, having adopted the neighbour's twelve
        // marks as this table's new shoe. Seven coups that were never dealt
        // here, filed under this table, permanently.
        //
        // A window that really did move is still recovered from, by the
        // periodic full-screen re-check above: it compares scores rather than
        // asking whether anything exists, and it resumes once the remembered
        // strip's hold expires. Slower, and right.
        this.cleared = true;
        // `lastBox` stays. A shoe refills where the last one was, so the box
        // just read is what tells the new shoe's first mark apart from the
        // neighbouring table's board -- and with the lock now spanning the
        // full width of the frame, that neighbour is inside the region.
        // Clearing it here let the neighbour's twelve marks in as this table's
        // new shoe; `boardsCarryingOn` is what keeps them out, and it has
        // nothing to work with once the box is gone.
        this.candidate = null;
        this.repeats = 0;
      }
      this.empties += 1;
      this.lastBoard = null;
      this._emit();
      return;
    }
    if (!boards.length) { this.lastBoard = null; this.empties += 1; this._emit(); return; }
    this.empties = 0;

    // Prefer the board this run has been reading, so a strip that gains a
    // derived road between frames does not move the reading somewhere else --
    // but only among boards still worth reading, so the preference cannot
    // outlive the reason for it.
    const board = pickBoard(boards, this.anchor);
    // A plate the frame cuts off is not one to start following (see the lock
    // below): followed, it was the one board the reader would accept once the
    // window was put right, and the whole plate, somewhere else, was not it.
    this.proven = following || (!!board.shown && !board.cut);
    this.anchor = centreOf(board.box);
    this.lastBox = board.box;
    this.lastSize = board.diameter;
    this.lastRead = board.sequence;
    this.bounds = bounds;
    this.lastBoard = { ...board, frameWidth: w, frameHeight: h };
    this.lastReadAt = Date.now();
    this.reads += 1;

    if (board.sequence === this.candidate) this.repeats += 1;
    else { this.candidate = board.sequence; this.repeats = 1; }

    // Lock on once a reading has held still. The locked region is the whole
    // strip, not just the board being read: the derived roads fill in as the
    // shoe goes on, and a box drawn tight around the bead plate would keep
    // cutting them off.
    //
    // Not on a plate the frame cuts off (see `markFrameCut`): it is where the
    // board is while the casino's window is too short for it, not where it
    // will be read. Locked there by its marks, with no ruling found to follow
    // it by, the reader held the place as a strip between shoes for the
    // memory's two minutes after the window had been put right, the whole
    // plate in view and the shoe going on unread.
    if (!this.region && this.repeats >= CONFIRM_GROWTH && !board.cut) {
      this.region = bandLock(bounds, w, h);
    }
    // Whatever strip is being read from, that is the place worth remembering.
    if (this.region) { this.memory = this.region; this.memoryAt = Date.now(); }

    // The flag rides with the reading and is dropped on the one that carries
    // it far enough to be acted on, so the caller sees it exactly once.
    const afterClear = this.cleared;
    // A shoe fills to the right, and the lock is drawn around the strip as it
    // was when it was found. Detection is confined to the region, so the lock
    // cannot see what it is cutting off -- it reads a clipped board and stays
    // that way. So a board that comes within a cell or two of its own edge
    // pushes that edge out, keeping headroom ahead of where the shoe is going.
    // Not a region the viewer drew: widening it would be the reader deciding
    // it knows better about the one thing it was told outright. And one pinned
    // to the ruling is not widened upwards: the bead plate opens on the
    // ruling's top row, so every reading pushed that edge another eighty
    // pixels up, into the table's video.
    if (this.region && this.pinned !== "manual") {
      this.region = this.memory = widenFor(this.region, board, w, h,
                                           { up: this.pinned !== "grid" });
    }

    this.onRead(board.sequence, this.lastBoard, this.repeats, { afterClear });
    if (afterClear && this.repeats >= CONFIRM_GROWTH) this.cleared = false;
    this._emit();
  }

  /**
   * What among `boards` has shown itself to be a road, for a reader not yet
   * following one. See `OPENING_MARKS`.
   *
   * Two columns or more is a road: nothing fixed on a casino screen fills a
   * column and starts the next. A single column has to be seen growing -- a
   * longer reading in the same place that starts with what stood there, which
   * had held still for two samples at least. A real column waits out a whole
   * coup between marks; a fixed one only ever flickers.
   */
  _roadsAmong(boards) {
    const before = this.sightings, now = [], shown = [];
    for (const b of boards) {
      if (b.nCols > 1 || this._opensThePanel(b)) { b.shown = true; shown.push(b); continue; }
      const was = before.find((s) => overlaps(s.box, b.box));
      now.push({ box: b.box, sequence: b.sequence,
                 held: was && was.sequence === b.sequence ? was.held + 1 : 1 });
      if (was && was.held >= 2 && b.sequence.length > was.sequence.length
          && b.sequence.startsWith(was.sequence)) {
        b.shown = true;
        shown.push(b);
      }
    }
    this.sightings = now;
    if (shown.length) return shown;
    return boards.length === 1 && boards[0].cells.length <= OPENING_MARKS ? boards : [];
  }

  /**
   * Whether a board is the first column of the ruled panel the reader is
   * pinned to: at its left edge and its top row, where every casino layout
   * opens the bead plate. A fixed column -- the counts, the ask roads -- sits
   * at the other end of the strip. So a shoe of a few coups is read the
   * moment the reader is started on it, rather than once its column has been
   * seen growing: an owner who started sharing six coups into a shoe was told
   * the shoe had finished and the next one was awaited, while the casino's
   * screen showed it being dealt. The same inside a box the viewer drew,
   * once the ruling has been found in it.
   *
   * Or at the first cell of the ruling itself. The panel is grown out from the
   * ruling by its colour, and a dark panel on a dark page grows past its own
   * edge into the page around it -- on the drawn screen the checks use, out to
   * the whole frame -- so a shoe of five coups, its column at the corner of
   * the ruling, was a fifth of the frame from the panel's corner: it waited to
   * be seen growing, and the reader said the shoe had finished. The ruling's
   * first cell is where the bead plate opens on every layout that rules it.
   */
  _opensThePanel(board) {
    const grid = (this.pinned === "grid" || this.pinned === "manual") && this.grid;
    if (!grid || !grid.panel) return false;
    const reach = 1.5 * (board.diameter || grid.pitch);
    const at = (corner) => !!corner && Math.abs(board.box.x - corner.x) <= reach
      && Math.abs(board.box.y - corner.y) <= reach;
    return at(grid.panel) || at(grid.box);
  }

  /**
   * Where marks are read from: the region -- except that a box the viewer
   * drew, with a ruling inside it, is read across as drawn and down as ruled:
   * from a quarter of a cell above the ruling to a cell below it, the same
   * rows the reader watches when it finds the strip on its own. None of the
   * video the box took in above that, and the whole of a row it clipped a
   * little of.
   */
  _readArea(w, h) {
    const box = this.region;
    if (!box || this.pinned !== "manual" || !this.grid) return box;
    const lock = gridLock(this.grid, w, h);
    return { x: box.x, y: lock.y, w: box.w, h: lock.h };
  }

  /**
   * Paint the feed into `target`, and keep painting it.
   *
   * The preview used to be drawn once per reading, from the frame the reader
   * had just analysed -- so a camera producing thirty frames a second was
   * shown at two thirds of one. That is fine for a shared tab, which barely
   * changes, and useless for a camera, where the preview is the thing you aim
   * with. So the two are separated: the reader keeps its slow interval, and
   * the picture runs at the rate the frames actually arrive.
   */
  drawPreview(target) {
    if (target !== this.preview) this._watchPreview(target);
    this.preview = target;
    return this._paintPreview();
  }

  /**
   * Whether the preview can be seen at all.
   *
   * It is painted every frame the capture delivers -- fifteen a second from a
   * shared screen -- and each paint scales the whole frame down into it.
   * Measured on a 2560-wide screen, that painting was a fifth of a core, and
   * it went on while the preview was scrolled off the page, which is where it
   * is whenever the board or the prediction is being read. The reading does
   * not depend on it, so it pauses while nobody can see it.
   */
  _watchPreview(target) {
    this.previewSeen?.disconnect();
    this.previewSeen = null;
    this.previewVisible = true;
    if (!target || typeof IntersectionObserver !== "function") return;
    this.previewSeen = new IntersectionObserver((entries) => {
      for (const e of entries) this.previewVisible = e.isIntersecting;
    });
    this.previewSeen.observe(target);
  }

  /**
   * Ask to be called back for the next frame.
   *
   * `requestVideoFrameCallback` fires once per decoded frame, which is exactly
   * the cadence wanted: a camera at thirty frames a second paints thirty
   * times, and a shared tab held at four paints four times instead of
   * repainting an unchanged picture sixty. Where it is missing, the animation
   * frame is the honest fallback.
   */
  _queuePreview(step) {
    const v = this.video;
    if (v && typeof v.requestVideoFrameCallback === "function") {
      this.previewOwner = v;
      this.previewHandle = v.requestVideoFrameCallback(step);
    } else {
      this.previewOwner = null;
      this.previewHandle = requestAnimationFrame(step);
    }
  }

  _startPreview() {
    this._stopPreview();
    const step = () => {
      this.previewHandle = null;
      if (!this.stream) return;
      if (this.previewVisible !== false && !document.hidden) this._paintPreview();
      this._queuePreview(step);
    };
    this._queuePreview(step);
  }

  _stopPreview() {
    if (this.previewHandle === null) return;
    if (this.previewOwner?.cancelVideoFrameCallback) {
      this.previewOwner.cancelVideoFrameCallback(this.previewHandle);
    } else {
      cancelAnimationFrame(this.previewHandle);
    }
    this.previewHandle = null;
    this.previewOwner = null;
  }

  /**
   * One frame: the live picture, then the strip lit and the board outlined.
   *
   * The overlay comes from the last reading rather than this frame, which is
   * what makes the separation work -- the region is locked, so the box belongs
   * where it was drawn until the reader moves it.
   */
  _paintPreview() {
    const v = this.video, target = this.preview;
    if (!target || !v || !v.videoWidth) return false;

    // Working resolution, so the overlay's coordinates land where they belong.
    const scale = Math.min(1, WORK_MAX / Math.max(v.videoWidth, v.videoHeight));
    const w = Math.round(v.videoWidth * scale), h = Math.round(v.videoHeight * scale);
    // Assigning width or height clears and reallocates the canvas, so it is
    // only worth doing when the frame size actually changed.
    if (target.width !== w || target.height !== h) { target.width = w; target.height = h; }

    const ctx = target.getContext("2d");
    ctx.drawImage(v, 0, 0, w, h);
    // The region first, so it is visible with nothing in it -- which is the
    // whole point of pinning to the ruling, and the only way to see that the
    // reader is watching the right place before a coup has been dealt.
    if (this.region && this.pinned) drawRegion(ctx, this.region, this.pinned);
    const board = this.lastBoard;
    if (board) drawStrip(ctx, target, this.bounds || board.box, board);
    return true;
  }
}

/**
 * How deep a shoe may already be the first time it is seen, when the strip was
 * never watched going empty.
 *
 * A new shoe starts at one coup and grows. So a reading that shares nothing
 * with the shoe in progress and arrives already dozens deep is not a new shoe
 * on this board -- it is a different board: the big road beside the bead
 * plate, or the table next door. Filing it as a shoe is how a record fills
 * with fragments.
 *
 * Measured from a real session's log: "new shoe -- 45 read", then "new shoe --
 * 36 read", a minute apart, on a table whose own counter said 37. Thirty-one
 * shoes averaging 18 coups came out of it, against a real 8-deck shoe's 80.
 *
 * A first column and a little, because the reader can miss the opening coups
 * of a shoe it was not looking at. Past that the viewer is asked rather than
 * obeyed -- switching the shared window to another table really does produce
 * a deep reading with nothing in common, and that is a click away.
 */
const RESTART_DEPTH = 8;

/**
 * How many looks running a whole bead plate with nothing in common with the
 * shoe in progress must hold, deep as it is, before it is taken for a change
 * of table and carried on as a new shoe.
 *
 * The owner changes tables in the casino and wants the record to go on: told
 * each time that the reader was looking at a different board, and left to
 * press a button before anything more was written, they asked for it to carry
 * on by itself. The question was there for the big road beside the bead
 * plate, read as a shoe of its own, and for a reader going back and forth
 * between two boards, filing a fragment of each in turn. The big road is no
 * bead plate, and is still only offered; a reading that comes and goes does
 * not hold for eight looks; and the board gone back to carries on the shoe
 * already filed from it, which is taken up again rather than filed a second
 * time (see `shoeReturnedTo` in the app).
 * A whole bead plate, the same for twelve seconds at the reader's usual
 * pace, is the table on screen now, and the warning shown meanwhile says it
 * is about to be carried on and offers that table a record of its own.
 */
const TABLE_CHANGE_LOOKS = 8;

/**
 * How long a first reading after a blank strip may be and still be a new shoe
 * that happens to open the way the last one did.
 *
 * A new shoe is first seen at a coup or two -- three, if samples were missed.
 * A prefix of the shoe in progress any longer than that is the same shoe
 * coming back half drawn after the strip went blank, not a new one.
 */
const SAME_OPENING_DEPTH = 3;

/**
 * How many coups a shoe must lose, to an opening of itself, to be the next
 * shoe opening the same way -- with no empty strip seen in between.
 *
 * The empty strip between shoes is easy to miss. Three empty looks call it,
 * four and a half seconds at the reader's usual pace, and a table that deals
 * the next shoe sooner never shows it for that long; a reader started on a
 * new shoe while the last one is still open in the record never sees it at
 * all. Then a new shoe whose first coup was the last shoe's first coup --
 * nearly half of them -- read as that shoe cropped: an owner's table sat on a
 * one-coup shoe under a warning about a cut-off bead plate, until a second
 * coup told the two apart. A shoe dropping to its own first coup or three is
 * a shoe change, once the drop is more than the newest mark blinking off.
 */
const REOPEN_DROP = 4;

/**
 * How much of the shoe in progress a filled bead plate must still show, in
 * order, to be read as that shoe moved along. Four columns: twenty-four coups
 * do not agree in order by chance.
 */
const SCROLL_OVERLAP = 24;

/**
 * The whole shoe a bead plate shows the end of, once it has filled -- or null.
 *
 * A bead plate is a fixed number of columns, eleven on an owner's table, so
 * sixty-six coups; a shoe runs to seventy or eighty. Past that the table drops
 * its oldest columns off the front, and what is on screen is the shoe with its
 * start missing. As a reading that shared nothing with the shoe in progress,
 * so every coup after the sixty-sixth would have stalled behind the warning
 * that some other board was being read. Where the screen shows the shoe in
 * progress from some point on, in order and at length, it is that shoe, and
 * the coups past its end are new. A bead plate's reading only: a big road
 * has no ties and folds its long runs, and lines up with nothing.
 */
function scrolledInto(shoe, reading, kind) {
  if (kind !== "bead" || !shoe || !reading || sharePrefix(shoe, reading)) return null;
  // The shoe's own last coup or three may be what the screen now has right
  // (see `differsAtTheEnd`) -- on the owner's table the misread end was the
  // bead plate's last column, the very one that moves along next -- so up to
  // `TAIL_FIX` of them are not asked for.
  for (let wrong = 0; wrong <= TAIL_FIX; wrong += 1) {
    const kept = shoe.slice(0, shoe.length - wrong);
    for (let from = 1; kept.length - from >= SCROLL_OVERLAP; from += 1) {
      if (reading.startsWith(kept.slice(from))) return shoe.slice(0, from) + reading;
    }
  }
  return null;
}

/** How many coups at the end of a shoe a steadier reading may correct. */
const TAIL_FIX = 3;

/**
 * Whether a reading is the shoe in progress read differently at its very end:
 * a long agreement from the first coup, then a difference no deeper than
 * `TAIL_FIX` coups at the end of the shoe -- the reading may have gone on
 * past it since, which is the table dealing.
 *
 * An owner's record held sixty-three coups agreeing with the casino and then
 * three the table never showed -- the last column filled to the bottom, where
 * the table's held four. Every reading after it, the casino's own, differed
 * from the record at the sixty-fourth coup, so it read as some other board
