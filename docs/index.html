 * and stalled behind the warning for one: the record and the table stayed
 * apart for the rest of the shoe. A difference only at the end is the end
 * misread, once or now, and the reading that holds is the one to keep -- a
 * bead plate's: a big road drops the ties, and would correct them away.
 *
 * A shoe still in its opening is held to the same rule on narrower terms.
 * There the end that differs is mostly a coup that was never dealt: a table's
 * ask buttons show the side asked about in the cell the next coup will take,
 * flashing, and a flash seen on two looks running is written down. The real
 * coup then differs from it, with fewer than `RESTART_DEPTH` coups agreeing
 * before it, and read as the next shoe. Measured in the page: an ask pressed
 * at the second or third coup of a shoe left a two- or three-coup shoe the
 * table never dealt in the record, and the shoe again from its first coup
 * beside it. So a young shoe is its own end misread too, on two conditions.
 * It is the shoe this run of the reader has been writing (`own`): a young
 * shoe left open by a reader stopped a few coups in is a shoe of its own when
 * a reader started later finds the next one, and the next one can open any
 * way at all -- three coups is all a shoe needs to differ from it only at its
 * end. And the reading has gone no more than a coup past it: a longer one
 * that differs from a few opening coups is another table as often as not,
 * and goes the way any other reading does. The first coup need not agree --
 * it is the one an ask at the first coup stands in for -- and an empty strip
 * in between does not make it the next shoe: shoes end seventy and eighty
 * coups in, not three, and a strip that goes blank a few coups into a shoe is
 * a panel being redrawn.
 */
function differsAtTheEnd(shoe, reading, kind, { own = false } = {}) {
  if (kind !== "bead" || !shoe || !reading || sharePrefix(shoe, reading)) return false;
  let same = 0;
  while (same < shoe.length && same < reading.length && shoe[same] === reading[same]) same += 1;
  if (shoe.length - same > TAIL_FIX) return false;
  return same >= RESTART_DEPTH || (own && reading.length <= shoe.length + 1);
}

/**
 * For how many readings after the reader adds a coup it takes it back, if
 * the strip drops it again and keeps it dropped.
 *
 * A mark that comes and goes is the ask preview again (see `differsAtTheEnd`):
 * flashing for a few seconds in the next coup's cell, written down if it was
 * caught lit on two looks running, and then gone -- the strip back to the shoe
 * as it was, while the table takes bets for the coup the preview stood in for.
 * Measured in the page with the ten seconds a table gives that, the record
 * held the coup that was never dealt the whole time, and the reader warned
 * that the bead plate looked cut off. The newest mark blinking does not do it:
 * a blink is back within a look, and taking the coup back needs it gone for
 * as many looks as a reset needs. Eight readings is the length of a preview
 * and its confirmation at the reader's pace, with room; a coup that has stood
 * for longer than that and then goes missing is something else covering it,
 * and is only warned about.
 */
const TAKE_BACK_READS = 8;

/**
 * Marks this small, in the pixels the reader works at, leave a gap between
 * them that shrinking a frame can close. Measured: a full-HD share of a bead
 * plate drawn fourteen pixels a mark, shrunk to be read, came out eleven
 * across, and two of them ran together and were lost; a plate drawn twelve
 * pixels a mark in a window half that width, read as it came, is read whole.
 * A plate this small with a hole in it is said to be small, not covered.
 */
const SMALL_MARKS = 12;

/**
 * Decide what a fresh reading means for the shoe in progress.
 *
 * Returns one of `same` (nothing changed), `grow` (the board gained coups),
 * `reset` (the board restarted -- a new shoe) or `hold` (a shorter reading
 * that shares a prefix, which is far more likely to be a half-drawn frame than
 * a real event, so it is ignored).
 */
function diagnose(current, incoming) {
  if (incoming === current) return "same";
  if (!current.length) return "grow";
  if (!sharePrefix(current, incoming)) return "reset";
  return incoming.length > current.length ? "grow" : "hold";
}


const centreOf = (box) => ({ x: (box.x + box.x2) / 2, y: (box.y + box.y2) / 2 });

/**
 * The locked strip, pushed outward wherever `board` has reached its edge.
 *
 * It only ever grows, and only up to the frame: a lock that could tighten
 * would chase a board that had already been clipped into a corner. Distances
 * are in marks rather than pixels, because a mark is the size the board grows
 * by and the only scale on screen that means anything here.
 */
/**
 * Grow a locked strip to the strip that is actually there.
 *
 * A result strip is not all present when the reader first sees it. The derived
 * roads have nothing to derive until the big road has the columns for them --
 * the cockroach road needs five -- so a lock taken in the opening coups is
 * drawn around a strip that is still half empty, and the roads that appear
 * later appear outside it. `widenFor` cannot fix that: it keeps headroom
 * around the board being read, and the board being read is the bead plate at
 * the other end. Nor can anything inside the lock, which by definition cannot
 * see what it excludes. It takes a look at the whole frame, which the reader
 * already takes every so often.
 *
 * Only a strip overlapping this one is this one; a board somewhere else on the
 * screen is another table, and is handled where it is found. The region never
 * shrinks here -- a strip that has grown does not ungrow -- so this can only
 * ever let more of the same band in.
 */
function growToStrip(region, bounds, frameW, frameH) {
  if (!region || !bounds) return region;
  const x2 = region.x + region.w, y2 = region.y + region.h;
  const touches = bounds.x < x2 && region.x < bounds.x2
               && bounds.y < y2 && region.y < bounds.y2;
  if (!touches) return region;

  const pad = Math.max(30, (bounds.x2 - bounds.x) * 0.04);
  const nx = Math.max(0, Math.min(region.x, bounds.x - pad));
  const ny = Math.max(0, Math.min(region.y, bounds.y - pad));
  const nx2 = Math.min(frameW, Math.max(x2, bounds.x2 + pad));
  const ny2 = Math.min(frameH, Math.max(y2, bounds.y2 + pad));
  return { x: nx, y: ny, w: nx2 - nx, h: ny2 - ny };
}

function widenFor(region, board, frameW, frameH, { up = true } = {}) {
  const d = board.diameter || 20;
  const margin = Math.max(48, d * 1.5);       // headroom kept ahead of the board
  const step = Math.max(80, d * 3);           // and how much is added when it runs out
  let x = region.x, y = region.y;
  let x2 = region.x + region.w, y2 = region.y + region.h;

  if (board.box.x - x < margin) x -= step;
  if (x2 - board.box.x2 < margin) x2 += step;
  if (up && board.box.y - y < margin) y -= step;
  if (y2 - board.box.y2 < margin) y2 += step;

  x = Math.max(0, x); y = Math.max(0, y);
  x2 = Math.min(frameW, x2); y2 = Math.min(frameH, y2);
  return { x, y, w: x2 - x, h: y2 - y };
}

/**
 * The board to read: the one being followed, as long as it is still credible.
 *
 * Boards arrive best-first. With no anchor the best one wins outright; with
 * one, the choice is made among those within `PICK_TOLERANCE` of the best, so
 * following a board survives it gaining a column but not it turning out to be
 * the wrong board.
 */
function pickBoard(boards, anchor) {
  if (!boards.length) return null;
  if (!anchor) return boards[0];
  const floor = boards[0].score * PICK_TOLERANCE;
  const credible = boards.filter((b) => b.score >= floor);
  const pool = credible.length ? credible : boards;

  return nearestTo(pool, anchor);
}

/**
 * The boards that could be the one last read in `lastBox`, still carrying on.
 *
 * A locked strip is the whole result band. Beside the roads a table screen
 * puts its video, and a lobby view puts other tables -- all in the same band,
 * all full of the same red and blue, so the strip can hold more than the board
 * being watched. While that board has marks in it, "nearest to where we were
 * reading" picks it and the rest are ignored. The moment it clears for a shoe
 * change, the neighbour is the only thing left, and nearest-to hands it over:
 * its coups are read as this table's, in a shoe of their own.
 *
 * A shoe refills where the last one was, so the board carrying on is the one
 * still overlapping the box just read. Sharing no ground with it makes it a
 * different board, and a strip holding only those is, from here, empty --
 * which is what a shoe change is, and is already handled as one.
 */
function boardsCarryingOn(found, lastBox) {
  if (!lastBox) return found;
  return found.filter((b) => overlaps(b.box, lastBox));
}

/**
 * How many coups a board elsewhere must read alike, from the first, to be
 * taken for the board last read moved. Ten in a row do not agree by chance:
 * a board that happens to open the way this shoe did is one in a thousand
 * or more at ten, and nothing a casino screen draws besides it reads as a
 * shoe at all.
 */
const MOVED_MIN = 10;

/** The boards in `found` that read as `last` and go on from it. */
function movedTo(found, last) {
  if (!last || last.length < MOVED_MIN) return [];
  return found.filter((b) => b.sequence.startsWith(last));
}

/** Whether two boxes share any ground. */
const overlaps = (a, b) => a.x < b.x2 && b.x < a.x2 && a.y < b.y2 && b.y < a.y2;

/** The board whose centre is closest to `point`, falling back to the best. */
function nearestTo(boards, point) {
  let best = boards[0], bestD = Infinity;
  for (const b of boards) {
    const cx = (b.box.x + b.box.x2) / 2, cy = (b.box.y + b.box.y2) / 2;
    const d = (cx - point.x) ** 2 + (cy - point.y) ** 2;
    if (d < bestD) { bestD = d; best = b; }
  }
  return best;
}

/**
 * Dim everything outside `bounds`, then mark `board` inside it.
 *
 * Shared by the live preview and the pasted-capture view so both show the same
 * thing: the strip being watched, and the board being counted.
 */
/**
 * Outline the region being watched.
 *
 * Dashed and unfilled, so it reads as "this is where I am looking" rather than
 * "this is what I found" -- the solid box `drawStrip` draws is the second. The
 * two are different claims and they need to look different, most of all when
 * there is no board yet and only this one is on screen.
 */
function drawRegion(ctx, region, how) {
  ctx.save();
  ctx.setLineDash(how === "manual" ? [] : [7, 5]);
  ctx.lineWidth = 2;
  ctx.strokeStyle = how === "manual" ? "rgba(120, 200, 255, 0.95)"
                                     : "rgba(120, 200, 255, 0.6)";
  ctx.strokeRect(region.x + 1, region.y + 1, region.w - 2, region.h - 2);
  ctx.restore();
}

function drawStrip(ctx, source, bounds, board) {
  const css = getComputedStyle(document.documentElement);
  const w = source.width, h = source.height;
  const pad = Math.max(12, (bounds.x2 - bounds.x) * 0.02);
  const bx = Math.max(0, bounds.x - pad), by = Math.max(0, bounds.y - pad);
  const bw = Math.min(w - bx, bounds.x2 - bounds.x + pad * 2);
  const bh = Math.min(h - by, bounds.y2 - bounds.y + pad * 2);

  ctx.save();
  // Dim everything outside the strip with four rectangles. Filling the whole
  // frame and painting the bright part back over it gives the same picture,
  // but costs a second upload of the source every frame -- which the preview
  // now pays thirty times a second rather than once a reading.
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(0, 0, w, by);
  ctx.fillRect(0, by + bh, w, h - by - bh);
  ctx.fillRect(0, by, bx, bh);
  ctx.fillRect(bx + bw, by, w - bx - bw, bh);

  ctx.strokeStyle = css.getPropertyValue("--accent").trim();
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, bw, bh);

  if (board) {
    const p = 6;
    ctx.setLineDash([5, 4]);
    ctx.lineWidth = 1.5;
    ctx.strokeRect(board.box.x - p, board.box.y - p,
                   board.box.x2 - board.box.x + p * 2, board.box.y2 - board.box.y + p * 2);
    ctx.setLineDash([]);
    ctx.strokeStyle = css.getPropertyValue("--mark-ring").trim() || "#fff";
    ctx.lineWidth = 1.6;
    for (const c of board.cells) {
      ctx.beginPath();
      ctx.arc(c.cx, c.cy, c.r * 1.12, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* ═══ store.js ═══ */
/* Where the collected shoes live.
 *
 * Two backends behind one interface. The artifact `db` capability is the real
 * store: it survives the browser, and the desktop pipeline can read it back
 * out. `localStorage` mirrors it so the page still works when the capability
 * is not granted, and so a reload is instant rather than waiting on a round
 * trip. Writes go to both; reads prefer db and fall back.
 */


const LS_KEY = "baccarat.corpus.v2";
/**
 * The prediction log, kept under a key of its own.
 *
 * Beside the corpus rather than inside it, because the two have different
 * lives: the corpus is what the table produced and syncs to the shared store,
 * while the log is what this build said about it and is local to whoever was
 * watching. Folding them together would also change the shape of a record
 * every older build knows how to read, for no gain.
 */
const LOG_KEY = "baccarat.verify.v1";
const SHOE_COLLECTION = "shoes";
const META_DOC = "meta/state";

/** What a table is called when its stored name was entirely formula prefix. */
const UNNAMED_TABLE = "?";

/** Debounce window for writes. Live entry produces a coup every few seconds;
 *  one write per coup would burn the call budget for nothing. */
const FLUSH_MS = 1800;

/** A storage write that failed for want of room, however the browser says it.
 *  Firefox and old WebKit each have their own name and number for it. */
function safeParse(raw) {
  try { return JSON.parse(raw); } catch { return null; }
}

function isQuota(e) {
  const name = String(e?.name || "");
  return name === "QuotaExceededError" || name === "NS_ERROR_DOM_QUOTA_REACHED"
      || e?.code === 22 || e?.code === 1014;
}

class Store {
  constructor() {
    this.db = null;
    this.status = "local";            // local | syncing | synced | error | full
    this.onStatus = () => {};
    /**
     * Asked for room when the shoes do not fit: frees some, and says whether
     * it did. The page sets it to shrink the prediction log; nothing else
     * here is worth a coup.
     */
    this.makeRoom = () => false;
    this._pending = new Map();        // shoeId -> record
    this._deletes = new Set();        // shoeIds emptied or undone away
    // What the shared store is believed to hold. A shoe is only worth deleting
    // if it was ever written: without this every new shoe -- which starts
    // empty -- would spend a round trip removing a document that never existed.
    this._remote = new Set();
    this._metaDirty = false;
    this._timer = null;
    this._retried = false;
  }

  /**
   * Adopt a corpus another tab of this browser wrote.
   *
   * Every commit writes the whole state, so two tabs open on the same table
   * overwrite each other: the one holding the older copy in memory saves it
   * over the newer one, and a coup entered in the other tab is gone without a
   * word. The `storage` event fires in every *other* document the moment a
   * write lands, and what it carries is by definition newer than what this
   * tab holds -- so taking it is always right, and it is what stops the next
   * commit here from writing the stale copy back.
   *
   * True of the record. Not of `active`, which travels in the same object and
   * is not a fact about the corpus but a choice this document made; the caller
   * decides what to keep of its own view. This only hands over what arrived.
   */
  watchOtherTabs(adopt, adoptLog = null) {
    if (typeof window === "undefined" || !window.addEventListener) return;
    window.addEventListener("storage", (e) => {
      if (!e.newValue) return;
      if (e.key === LS_KEY) {
        const state = sanitiseState(safeParse(e.newValue));
        if (state) adopt(state);
        return;
      }
      // The prediction log, for exactly the same reason as the corpus -- and it
      // was the half that got left out. Each tab read the log once at startup
      // and wrote its own copy back whole on every prediction, so a second tab
      // erased everything the first had predicted since it opened. Measured:
      // ten predictions on one table in one tab, one prediction on another
      // table in the second, and the stored log held the one. Those are the
      // predictions written before their coups were known, which is the only
      // thing that makes the log worth keeping.
      //
      // Taken whole, like the corpus, rather than merged. A merge would have to
      // know what the other tab deliberately removed -- an undone coup's
      // prediction, a cleared table -- and a union would bring those back.
      // Adopting is right for the same reason it is right above: each tab
      // writes synchronously and adopts before it next writes, so whatever
      // arrives here already holds everything this tab had.
      if (e.key === LOG_KEY && adoptLog) {
        const raw = safeParse(e.newValue);
        if (raw) adoptLog(raw);
      }
    });
  }

  /** Resolve the db capability if this view has it. Never throws. */
  async connect() {
    try {
      if (typeof window === "undefined" || !window.claude?.use) return;
      const db = await window.claude.use("db");
      if (!db) return;
      this.db = db;
      this._setStatus("synced");
    } catch {
      /* absence is normal: keep the local mirror */
    }
  }

  _setStatus(s) {
    if (this.status === s) return;
    this.status = s;
    this.onStatus(s);
  }

  /* ------------------------------------------------------------- reading */

  /* (sanitiseState is defined below the class, beside the shape it enforces.) */

  readLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      return raw ? sanitiseState(JSON.parse(raw)) : null;
    } catch {
      return null;
    }
  }

  /**
   * Load the corpus, preferring the shared store. Returns
   * `{tables, active, isExample}` or null when nothing has been collected.
   */
  async load() {
    const local = this.readLocal();
    if (!this.db) return local;

    try {
      const [snap, meta] = await Promise.all([
        this.db.collection(SHOE_COLLECTION).limit(1000).get(),
        this.db.doc(META_DOC).get(),
      ]);
      const tables = {};
      snap.docs.forEach((d) => {
        this._remote.add(d.id);
        const v = d.data();
        // An empty shoe carries nothing and would just accumulate; earlier
        // versions wrote them, so they are skipped on the way in as well.
        if (!v || typeof v.outcomes !== "string" || !v.outcomes.length) return;
        const t = String(v.table || "live");
        (tables[t] ||= { shoes: [] }).shoes.push({
          id: d.id, o: v.outcomes, closed: !!v.closed, t: Number(v.started) || 0,
        });
      });
      for (const t of Object.values(tables)) t.shoes.sort((a, b) => a.t - b.t || a.id.localeCompare(b.id));

      if (!Object.keys(tables).length) return local;
      const m = meta.exists ? meta.data() : {};
      // Through the same sieve as localStorage. The shared store is durable
      // state written by earlier versions of this page and readable by other
      // views; a document carrying a character that is not an outcome, or a
      // `active` naming a table that is no longer there, is exactly as likely
      // here as in the local mirror -- and a stray character is not harmless,
      // since anything that is neither a tie nor a Banker counts as a Player.
      const state = sanitiseState({ tables, active: m.active, isExample: false });
      if (!state) return local;
      this._setStatus("synced");
      return state;
    } catch {
      this._setStatus("error");
      return local;
    }
  }

  /**
   * The prediction log as it was left, or null when there is none.
   *
   * Returned raw. `sanitiseLog` in `verify.js` is what decides which of it is
   * readable, and it lives there because that is where the shape is defined.
   */
  readLog() {
    try {
      const raw = localStorage.getItem(LOG_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }

  /**
   * Keep the prediction log.
   *
   * Quietly on failure, and deliberately so: a full quota must cost the log
   * rather than the coups, and the header already reports the corpus's own
   * health. Losing a record of what was predicted is a loss; losing what was
   * dealt is the loss this app exists to prevent.
   */
  saveLog(log) {
    try {
      localStorage.setItem(LOG_KEY, JSON.stringify(log));
      return true;
    } catch {
      return false;
    }
  }

  /* ------------------------------------------------------------- writing */

  /** Mirror the whole state locally and queue the changed shoes for the db. */
  save(state, changedShoeIds = []) {
    const raw = JSON.stringify(state);
    let kept = false, failure = null;
    try {
      localStorage.setItem(LS_KEY, raw);
      kept = true;
    } catch (e) {
      failure = e;
      // Full: whatever else the page keeps here gives up room to the shoes,
      // a step at a time, for as long as it has room to give -- see
      // `makeRoom`. The shoes are what this app exists to keep.

    // private mode, blocked site data, a full quota -- used to fail in
    // silence, and a collector found out on the reload that lost the lot.
    if (!kept && !this.db) this._setStatus(isQuota(failure) ? "full" : "error");
    if (!this.db) return;

    for (const id of changedShoeIds) {
      let found = null;
      for (const [table, entry] of Object.entries(state.tables)) {
        const shoe = entry.shoes.find((s) => s.id === id);
        if (shoe) { found = { table, shoe }; break; }
      }
      // A shoe with no coups is not written: it says nothing, and an artifact's
      // database is capped at five thousand documents. But cancelling the write
      // is not enough once one has already gone out. Undo empties a shoe a coup
      // at a time, and each step flushes, so by the last one the store holds
      // the shoe one coup long -- and a reload brought those coups back. The
      // same is true of a shoe undone away entirely, which leaves the state
      // without ever being mentioned again. Both are deletions, so they are
      // sent as deletions.

  async _flush(state) {

    this._pending.clear();

    this._deletes.clear();

    // the same id must not have its removal applied on top of the new write.

      for (const [id, body] of writes) {
        await this.db.collection(SHOE_COLLECTION).doc(id).set(body);
        sentWrites.push(id);

      // gone out is now only here. Dropping it is how the bug this delete
      // queue exists for comes back: a removal lost to one failed round trip
      // leaves the document behind, and the next reload restores the coups the
      // person undid. Put back what did not land, skipping anything a later
      // save has already superseded.
      for (const id of removals) {
        if (!sentRemovals.includes(id) && !this._pending.has(id)) this._deletes.add(id);

      for (const [id, body] of writes) {

      this._setStatus(e?.code === "quota_exceeded" ? "full" : "error");
      // One retry, so a single dropped connection does not need another coup
      // to be entered before the queue moves again.
      if (e?.code !== "quota_exceeded" && !this._retried) {

/**
 * What came out of storage, made into something the views can render.
 *

 * a record, an import from an older version, a hand-edited entry, or simply
 * something that is not this shape at all. Handing that to the renderers threw
 * before anything was drawn -- a page with nothing on it, over an array where
 * an object was expected, or a shoe whose outcomes were a number.
 *
 * Anything unusable is dropped rather than repaired: a shoe whose outcomes are
 * not a string carries nothing to keep, and a character that is not one of the
 * three outcomes is not a coup. That last one matters more than it looks --
 * anything that is not a tie and not a Banker counted as a Player, so one
 * stray character moved the estimate.

 * empty store, or something that is not a record at all. A record that *is* a
 * record and holds no tables is a different answer: somebody deleted the last
 * one, and that is a decision to carry across a reload rather than an absence
 * to fill with the seeded example.

  const tables = {};

  // shoes carrying the same id are not a duplicate, they are one shoe about to
  // overwrite the other on the next sync, silently and for good. Nothing the
  // page writes can collide, but a hand-edited mirror or a half-finished sync
  // can, and this is where such a corpus is made safe. The second shoe keeps
  // its coups under an id of its own.
  const seen = new Set();

  const renamed = new Map();
  const source = raw.tables && typeof raw.tables === "object" && !Array.isArray(raw.tables)
    ? raw.tables : {};

    // Own keys only: a table called `__proto__` must not reach into anything.
    if (!Object.prototype.hasOwnProperty.call(source, name)) continue;
    if (name === "__proto__" || name === "constructor" || name === "prototype") continue;

        id,
        o: outcomes,
        closed: !!shoe.closed,
        // Both ends. The floor was here from the start; the ceiling is the
        // last instant a date can be rendered at, and without it a stored
        // timestamp past that point is a real date to every check that reads
        // one and an exception to the exporter that has to write it. `t` also
        // orders the shoes a sync brings back, so it has to be a number that
        // means something either way.

          ? Math.min(MAX_TIME, Math.max(0, Number(shoe.t))) : 0,
      });

    // the shoes themselves: a mark that did not survive a reload would put
    // every coup back into a tally the reader had already zeroed.
    //
    // And clamped here, where the corpus comes in, because a mark can arrive
    // past the end of the table it belongs to -- an older version's mirror, a
    // half-finished sync, another tab's copy landing shorter. Past the end it
    // settles nothing, for ever, while coups arrive and the tally sits at zero
    // saying nothing is wrong. Every way a corpus reaches the page comes
    // through here, so this is the one place that covers all of them.
    const coups = shoes.reduce((n, shoe) => n + shoe.o.length, 0);
    const from = Math.min(Math.floor(Number(table && table.from)) || 0, coups);

    // The name goes through the same rule the prompt applies. `cleanTableName`
    // exists because the CSV export is a file people open in a spreadsheet and
    // a leading `= + - @` is how a spreadsheet decides a cell is a formula --
    // but it only ever ran where somebody typed a name, and typing is not the
    // only way one arrives. Storage from an older version, a half-finished
    // sync and the shared db all land here instead, and the shared db is
    // written by everyone looking at the same corpus. Five names in eight went
    // out of the exporter as live formulas before this.
    let key = cleanTableName(name) || UNNAMED_TABLE;
    // Two stored names can clean to one, and keeping only the last would lose
    // a whole table's shoes without saying so.
    if (Object.prototype.hasOwnProperty.call(tables, key)) {
      let n = 2;
      while (Object.prototype.hasOwnProperty.call(tables, `${key} (${n})`)) n += 1;
      key = `${key} (${n})`;
    }
    renamed.set(name, key);
    tables[key] = from > 0 ? { shoes, from } : { shoes };
  }

  const names = Object.keys(tables);
  if (!names.length) {
    // Emptied on purpose, or never filled? The shape says which: a stored
    // record carries a `tables` object even once the last table is gone, and
    // an absent store carries nothing. Without the distinction, deleting every
    // table and reloading brought the demo corpus back, which reads as the
    // deletion not having worked.
    const emptied = raw.tables && typeof raw.tables === "object"
      && !Array.isArray(raw.tables);

  }

  // table this corpus was left looking at. Falling back to a direct hit covers
  // an `active` that was already written in its cleaned form while the table
  // beside it was not -- inconsistent, but it names a real table, and landing
  // on a different one would be the very thing this is here to prevent.
  // No table chosen is a choice too -- the blank entry at the top of the
  // selector, where a guest starts from -- and it survives a reload like any
  // other. Only a name that is missing or unreadable falls back to the first.
  const active = raw.active === null
    ? null
    : typeof raw.active === "string"
      ? (renamed.get(raw.active)
         ?? (Object.prototype.hasOwnProperty.call(tables, raw.active) ? raw.active : names[0]))
      : names[0];
  return { tables, active, isExample: !!raw.isExample };
}

/** A stand-in id for a shoe that arrived without one, or with one twice. */
function newId(taken) {
  for (let attempt = 0; ; attempt += 1) {
    const id = "S" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

    // million, which is rare enough to ignore and cheap enough not to.
    if (!taken || !taken.has(id)) return id;
    if (attempt > 20) return id + attempt;        // never spin
  }
}

 * nothing about the operator's site is touched.

  if (measuring) return;
  measuring = requestAnimationFrame(() => {
    measuring = 0;
    followRoads();
    measureFolds();
  });
}

function commit(changedIds, writtenTable = state.active) {
  clampMarks();
  lastWrite = writtenTable;
  invalidate();
  store.save(state, changedIds);
  // Before the render, so the panel that reports the record is drawn from a
  // log that already knows about the coup just committed.
  settleLog();
  render();
}

/**
 * Finish a write into `name`: a table's is kept and sent on by `commit`; the
 * unsaved sheet's (`null`) is drawn and goes nowhere -- see `unsaved`.
 */
function commitTo(name, changedIds) {
  if (name) { commit(changedIds, name); return; }
  clampMarks();
  lastWrite = null;
  invalidate();
  render();
}

/* ---------------------------------------------------------------- editing */

/**
 * The table a write goes into: the one chosen, or null for the unsaved sheet
 * when none is. Nothing is made here -- see `unsaved`.
 */
function chosenTable() {
  return state.active && state.tables[state.active] ? state.active : null;
}

function addOutcomes(seq) {
  if (!seq) return;
  const name = chosenTable();
  const shoe = currentShoe(name);
  shoe.o += seq;
  commitTo(name, [shoe.id]);
}

function undo() {
  const name = chosenTable();
  const list = shoes(name);
  for (let i = list.length - 1; i >= 0; i--) {
    if (list[i].o.length) {
      list[i].o = list[i].o.slice(0, -1);
      list[i].closed = false;
      commitTo(name, [list[i].id]);
      return;
    }
    if (i > 0) list.pop();          // drop an empty trailing shoe and try again
  }
  render();
}

function newShoe() {
  const name = chosenTable();
  const shoe = currentShoe(name);
  if (!shoe.o.length) return;       // already on a fresh one
  shoe.closed = true;
  const fresh = { id: newShoeId(), o: "", closed: false, t: Date.now() };
  shoes(name).push(fresh);
  commitTo(name, [shoe.id, fresh.id]);
}

/**
 * Replace the shoe in progress with what a reading says it contains.
 *
 * `boundTo` is what the live reader was started on -- a table, or `""` for
 * none -- or null for "whatever is being looked at". It is resolved here, when
 * the write happens, and not when the reading was taken: a warning's button
 * can be pressed long after, and writing to a name that is gone by then
 * recreates it, filing the coups into a table nothing shows.
 */
function replaceCurrentShoe(seq, boundTo = null) {
  const name = readingTable(boundTo, state.tables, chosenTable());
  const shoe = currentShoe(name);
  shoe.o = seq;
  commitTo(name, [shoe.id]);
}

function loadAsNewShoe(seq, boundTo = null) {
  const name = readingTable(boundTo, state.tables, chosenTable());
  const list = shoes(name);
  const last = list[list.length - 1];
  const changed = [];
  if (last && !last.o.length) list.pop();
  else if (last && !last.closed) { last.closed = true; changed.push(last.id); }
  const fresh = { id: newShoeId(), o: seq, closed: false, t: Date.now() };
  list.push(fresh);
  changed.push(fresh.id);
  commitTo(name, changed);
}

/* ------------------------------------------------------------ live read */

/* Reading the screen continuously means committing without a human confirming
   each change, so the rules for what a reading is allowed to do are strict:
   growth is applied once frames agree, a board reset needs more agreement
   because it discards the shoe in progress, and a reading shorter than the
   shoe in progress is never applied to it silently -- that is what a cropped
   or scrolled bead plate looks like, and it would truncate real data. Only
   one that has dropped to the shoe's own opening is taken, and as the next
   shoe, with the last kept whole (see `REOPEN_DROP`) -- and one that has lost
   just the coup the reader added a moment ago, which the table never dealt
   (see `TAKE_BACK_READS`), and the log says so. */

function liveLog(text, kind) {
  const box = $("liveLog");
  const row = el("div");
  const now = new Date();
  const stamp = el("time", null,
    `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}:${String(now.getSeconds()).padStart(2, "0")}`);
  row.appendChild(stamp);
  row.appendChild(el("b", kind || null, text));
  box.prepend(row);
  while (box.children.length > 40) box.lastChild.remove();
}

function onLiveRead(seq, board, repeats, { afterClear = false } = {}) {
  // Whatever the selector says now, this reading came off the table the
  // reader was started on -- or onto the unsaved sheet, if that was none. The
  // binding itself is handed to the writers, which resolve it when they write:
  // a warning's button can be pressed long after this reading.
  const into = liveTable;
  const table = readingTable(into, state.tables, chosenTable());
  const open = openShoe(table);
  const current = open.o;
  if (liveWrote) liveWrote.reads += 1;
  // The shoe in progress is empty because "new shoe" was pressed -- and the
  // shoe just closed is still on screen until the table clears it, or is
  // still being dealt. Measured: pressed with the board still up, the reader
  // copied all thirty of its coups into the fresh shoe, and the record held
  // the shoe twice; pressed two coups early, the two went into the copy and
  // the shoe itself stayed two short. So the reading is held against the
  // shoe just closed first: that shoe as it was, or going on, is that shoe,
  // and what it adds goes there, or puts its end right (see
  // `differsAtTheEnd`); the fresh shoe waits for the table's next. A short
  // opening of it is the next shoe opening the same way, as it is for any
  // shoe (see `REOPEN_DROP`), and so is anything after a blank strip -- but
  // not one cut short by a covered mark (see `beadPlaces`).
  const closed = current ? null : shoeBefore(table);
  if (closed && closed.o.length > SAME_OPENING_DEPTH) {
    const onScreen = scrolledInto(closed.o, seq, board.kind) || seq;
    const was = diagnose(closed.o, onScreen);
    const mend = was === "reset" && differsAtTheEnd(closed.o, onScreen, board.kind);
    const opening = was === "hold" && !board.holed && (afterClear
      || (onScreen.length <= SAME_OPENING_DEPTH && closed.o.length - onScreen.length >= REOPEN_DROP));
    if (was === "same" || was === "grow" || mend || (was === "hold" && !opening)) {
      liveHolds = 0;
      if ((was === "grow" && repeats >= CONFIRM_GROWTH) || (mend && repeats >= CONFIRM_RESET)) {
        const added = onScreen.length - closed.o.length;
        closed.o = onScreen;
        commitTo(table, [closed.id]);
        liveLog(mend ? t("live.logMended", { total: onScreen.length })
          : t("live.logClosedShoe", { n: added, total: onScreen.length }));
      }
      return;
    }
  }
  const own = !!liveWrote && liveWrote.id === open.id;
  const justAdded = own && liveWrote.added && liveWrote.o === current
    && liveWrote.reads <= TAKE_BACK_READS;
  // A bead plate that has filled and moved along shows the shoe in progress
  // with its start off screen: it is that shoe, and the coups past its end
  // are new (see `scrolledInto`).
  seq = scrolledInto(current, seq, board.kind) || seq;
  const verdict = diagnose(current, seq);
  // And one that differs from the shoe in progress only in its last coup or
  // three is that shoe with its end misread, once or now (see
  // `differsAtTheEnd`). The reading that holds is the one kept.
  const mended = verdict === "reset" && differsAtTheEnd(current, seq, board.kind, { own });
  // Reading the big road is not a failure -- it is the same coups -- but it
  // loses ties and folds long runs, so it must never pass unremarked.
  const road = board.kind === "bead" ? null : t("live.bigRoadWarn");

  // The strip was watched going empty, so a reading that is not the same board
  // carrying on is the next shoe. Saying so here is what lets a new shoe that
  // opens on the same two or three marks as the last one through: without it
  // the reading shares a prefix, reads as a truncated board, and stalls behind
  // the warning meant for a bead plate that has been cropped or scrolled.
  //
  // A new shoe is short when it is first seen, though: a coup or two, a few
  // if samples were missed. A strip can also go blank and come back -- a panel
  // the casino swaps out while the cards are dealt, an overlay that lifts --
  // and an owner's log shows one doing it mid-shoe. What comes back then is
  // the shoe in progress, perhaps half drawn: a long prefix of it, or, misread
  // once, something that differs. Taken as a new shoe, either closed the shoe
  // in progress and opened a copy of it. So only a short reading starts a new
  // shoe on the strength of the blank; anything longer goes the way any other
  // reading does, held if it is a prefix and asked about if it is deep.
  const restart = !mended && afterClear && (verdict === "reset" ? seq.length <= RESTART_DEPTH
    : verdict === "hold" && seq.length <= SAME_OPENING_DEPTH);
  // Without the blank, the same short opening is still the next shoe when the
  // shoe in progress has dropped to it from well past it (see `REOPEN_DROP`):
  // the strip was cleared and redealt between two looks, or the reader was
  // started on the new shoe. A cropped bead plate loses whole columns, and a
  // board coming back half drawn comes back a column or more at a time. It is
  // taken as what it is, a reset, on the agreement a reset needs.
  const reopened = verdict === "hold" && seq.length <= SAME_OPENING_DEPTH
    && current.length - seq.length >= REOPEN_DROP;
  // And the coup the reader has only just written, gone from the strip again,
  // is a mark that came and went -- an ask button's preview -- and not a bead
  // plate cut short (see `TAKE_BACK_READS`).
  const cameAndWent = verdict === "hold" && justAdded && seq === current.slice(0, -1);
  // And a bead plate carrying on a shoe this table left in the middle is the
  // owner back at the table they left: it is that shoe, taken up again (see
  // `shoeReturnedTo`). Asked only where the shoe in progress does not account
  // for the reading -- one that shares nothing with it, or one it is too short
  // to be the whole of. A table's next shoe of a coup or two opens the way the
  // shoe left behind did as often as not, and measured in the page, grown
  // into the whole of that shoe's plate, it held the shoe's first thirty
  // coups a second time and lost its own.
  const back = !mended && (verdict === "reset" || verdict === "grow")
    ? shoeReturnedTo(seq, table, board.kind, verdict === "grow" ? current.length : 0) : null;

  // And where it is the same shoe after all, the log -- which said the shoe
  // had ended -- says so.
  if (afterClear && current.length && !restart && !liveResumed && !back
      && (verdict === "same" || verdict === "grow" || verdict === "hold")) {
    liveResumed = true;
    liveLog(t("live.logResumed"));
  }

  // A bead plate with a hole in it -- a pointer resting on a mark, a pop-up
  // over a few -- is read only as far as the hole (see `beadPlaces`), and says
  // nothing about the coups it cannot see. Read whole, it "mended" a shoe
  // into one with a coup missing for as long as the mark was covered, or
  // asked whether some other board was on screen. It may still add the coups
  // before the hole; it rewrites none, takes none back and opens no shoe, and
  // while it holds the reader says the plate is covered -- or, where its marks
  // are this small, that they are: a full-HD share of a plate drawn fourteen
  // pixels a mark, shrunk to be read, ran its marks together and lost two,
  // with nothing over them, and a bigger window or the casino page zoomed in
  // is what reads it. A plate the shared window cuts off at its top or foot
  // is said to run off it (see `markFrameCut`).
  if (board.holed && verdict !== "grow") {
    liveHolds += 1;
    if (liveHolds >= 4) {
      setLiveWarn(t(board.cut ? "live.cutWarn"
        : board.diameter <= SMALL_MARKS ? "live.smallWarn" : "live.coveredWarn"));
    }
    return;
  }

  if (back) {
    // On the agreement a reset needs: it closes the shoe in progress.
    liveHolds = 0;
    setLiveWarn(null);
    if (repeats >= CONFIRM_RESET) {
      const was = back.shoe.o.length;
      resumeShoe(back.shoe, back.seq, into);
      noteWrite(into, back.seq.length > was);
      liveLog(t("live.logBackToShoe", { was, total: back.seq.length }), "new");
    }
    return;
  }

  if (verdict === "same") { liveHolds = 0; setLiveWarn(road); return; }

  if (cameAndWent) {
    // On the agreement a reset needs, since it takes back a coup that was
    // kept. Until then it is not a hold either: nothing is cut off.
    liveHolds = 0;
    if (repeats >= CONFIRM_RESET) {
      replaceCurrentShoe(seq, into);
      noteWrite(into, false);
      liveLog(t("live.logTakenBack", { n: current.length, total: seq.length }));
    }
    return;
  }

  if (verdict === "hold" && !restart && !reopened) {
    liveHolds += 1;
    if (liveHolds >= 4) {
      setLiveWarn(
        t("live.shortWarn", { read: seq.length, cur: current.length }),
        {
          label: t("live.shortSwap", { n: seq.length }),
          run: () => {
            replaceCurrentShoe(seq, into);
            liveHolds = 0;
            setLiveWarn(null);
            liveLog(t("live.logManual", { n: seq.length }));
          },
        });
    }
    return;
  }

  liveHolds = 0;
  setLiveWarn(road);

  if (mended) {
    // Seen three times running, as a reset is: it rewrites coups already kept.
    if (repeats >= CONFIRM_RESET) {
      replaceCurrentShoe(seq, into);
      noteWrite(into, false);
      liveLog(t("live.logMended", { total: seq.length }));
    }
    return;
  }

  // A reset costs the shoe in progress, so it normally has to be seen three
  // times running. Where the strip was watched going empty that agreement has
  // already been paid for -- the emptiness is the confirmation -- so the new
  // shoe registers on the same evidence as any other change.
  const enough = restart ? CONFIRM_GROWTH : CONFIRM_RESET;

  if (verdict === "grow" && repeats >= CONFIRM_GROWTH) {
    const added = seq.length - current.length;
    replaceCurrentShoe(seq, into);
    noteWrite(into, true);
    liveLog(t("live.logGrow", {
      n: added, total: seq.length,
      sides: [...seq.slice(current.length)].map(side).join(" "),
    }));
  } else if ((restart || reopened || verdict === "reset") && repeats >= enough) {
    // A new shoe starts at one coup. A reading that shares nothing with the
    // shoe in progress and arrives already dozens deep, on a strip nobody
    // watched go empty, is a different board rather than a new shoe -- the big
    // road beside the bead plate, or the table next door.
    //
    // This was silent, and it is what fills a record with fragments: one real
    // session logged "new shoe -- 45 read" and then "new shoe -- 36 read" a
    // minute apart, on a table whose own counter said 37, and left 31 shoes
    // averaging 18 coups where a real 8-deck shoe runs 80.
    //
    // Not refused, though. Pointing the shared window at another table really
    // does produce a deep reading with nothing in common, and that is a thing
    // people do. So it is offered instead of taken.
    //
    // And where it is another table, it is that table's first shoe, not this
    // one's next: filed here, one table's record carried another's shoe, and
    // every figure about it -- the shares, the bet results -- was a mix of two
    // tables. So the choice offered first is a table of its own, named by the
    // person who knows which table it is; the reader then fills that table.
    //
    // Unless nobody chooses. The owner changes tables in the casino and wants
    // the record to carry on: a whole bead plate, held long enough, is taken
    // for the new table's and carried on here as a new shoe (see
    // `TABLE_CHANGE_LOOKS`), and the warning shown meanwhile says that is what
    // will happen. A reading that is not a bead plate -- the big road -- is
    // only ever offered. (One with a hole in it, or cut off by the window,
    // never gets this far: see the hold above. Nor does one carrying on a
    // shoe this table left: that is the shoe, taken up again above.)
    if (!restart && seq.length > RESTART_DEPTH) {
      const tableChange = board.kind === "bead";
      if (tableChange && repeats >= TABLE_CHANGE_LOOKS) {
        loadAsNewShoe(seq, into);
        noteWrite(into, true);
        setLiveWarn(null);
        liveLog(t("live.logTableChange", { n: seq.length }), "new");
        return;
      }
      setLiveWarn(
        t(tableChange ? "live.tableChange" : "live.deepReset",
          { read: seq.length, cur: current.length }),
        [{
          id: "newTable",
          label: t("live.deepResetNewTable"),
          run: () => {
            const name = cleanTableName(prompt(t("header.newTablePrompt")));
            if (!name) return;
            state.tables[name] ||= { shoes: [] };
            state.active = name;
            liveTable = name;
            loadAsNewShoe(seq, name);
            setLiveWarn(null);
            liveLog(t("live.logNewTable", { table: name, n: seq.length }), "new");
          },
        }, {
          id: "sameTable",
          label: t("live.deepResetAccept"),
          run: () => {
            loadAsNewShoe(seq, into);
            setLiveWarn(null);
            liveLog(t("live.logNewShoe", { n: seq.length }), "new");
          },
        }]);
      return;
    }
    loadAsNewShoe(seq, into);
    noteWrite(into, true);
    liveLog(t("live.logNewShoe", { n: seq.length }), "new");
  }
}

/**
 * The shoe a bead plate is when it is one this table left in the middle --
 * the owner gone to another table and back while this one dealt on -- with
 * the reading as that shoe, or null.
 *
 * Told by the record. The plate carries on the shoe from its first coup, or
 * shows it only in part -- half drawn, or with its end still to come back --
 * or has moved along with its start off the plate (see `scrolledInto`), or
 * reads its last coup or three differently now (see `differsAtTheEnd`).
 * Deeper than a new shoe's opening, so that a new table opening the way a
 * short shoe left behind did is not taken for it, and deeper than the shoe in
 * progress agrees with the reading (`beyond`): as deep as that, the shoe in
 * progress is the one being dealt. Among the last few shoes closed: a table
 * left long ago has long since finished the shoe it was on.
 */
function shoeReturnedTo(seq, name, kind, beyond = 0) {
  if (kind !== "bead") return null;
  const list = shoes(name);
  let looked = 0;
  for (let i = list.length - 1; i >= 0 && looked < 5; i -= 1) {
    const s = list[i];
    if (!s.closed) continue;
    looked += 1;
    if (s.o.length <= Math.max(RESTART_DEPTH, beyond)) continue;
    if (seq.startsWith(s.o)) return { shoe: s, seq };
    if (seq.length > RESTART_DEPTH && s.o.startsWith(seq)) return { shoe: s, seq: s.o };
    const moved = scrolledInto(s.o, seq, kind);
    if (moved) return { shoe: s, seq: moved };
    if (differsAtTheEnd(s.o, seq, kind)) return { shoe: s, seq };
  }
  return null;
}

/**
 * Take up a shoe left in the middle again, as the shoe in progress, holding
 * `seq`.
 *
 * Back at a table they left while it was still dealing, the owner's record
 * already holds the coups of its shoe up to where they left. Filed again as
 * a new shoe, those were in twice -- counted twice in the shares and the bet
 * results -- and left alone, nothing more was written while they sat there.
 * So that shoe is the one in progress again, and the one that was is left in
 * its turn, as it stands.
 *
 * The shoe in progress is a table's last, so the shoe moves to the end. Its
 * coups keep their places in it, and the predictions made on them stay with
 * them: they are filed by shoe and place. Its time becomes now, which is what
 * orders a table's shoes when they come back from the shared store.
 *
 * And the tally's mark (see `ledgerFrom`) is a place in the table's coups,
 * which this reorders. At the end of the table it stays where it is, and
 * counts what comes next, the shoe's new coups among them. In or past the
 * shoe, it moves back with the coups that were after it, so every coup it
 * counted still counts -- and the shoe that moved counts whole, since a tally
 * cannot skip the part of it before the mark. The other way, the shoes it was
 * left for went uncounted.
 */
function resumeShoe(shoe, seq, boundTo = null) {
  const name = readingTable(boundTo, state.tables, chosenTable());
  const list = shoes(name);
  const at = list.indexOf(shoe);
  if (at < 0) return;
  const changed = [];
  const last = list[list.length - 1];
  if (last !== shoe) {
    if (!last.o.length) list.pop();
    else if (!last.closed) { last.closed = true; changed.push(last.id); }
  }
  const entry = name ? state.tables[name] : unsaved;
  const mark = entry && Number(entry.from);
  if (Number.isFinite(mark) && mark > 0) {
    const start = list.slice(0, at).reduce((n, s) => n + s.o.length, 0);
    const end = list.reduce((n, s) => n + s.o.length, 0);
    if (mark > start && mark < end) {
      const moved = Math.max(start, mark - shoe.o.length);
      if (moved > 0) entry.from = moved;
      else delete entry.from;
    }
  }
  list.splice(at, 1);
  shoe.o = seq;
  shoe.closed = false;
  shoe.t = list.reduce((t, s) => Math.max(t, (Number(s.t) || 0) + 1), Date.now());
  list.push(shoe);
  changed.push(shoe.id);
  commitTo(name, changed);
}

/**
 * The shoe before the one in progress, when the one in progress is empty or
 * there is none: the shoe "new shoe" just closed. Null otherwise.
 */
function shoeBefore(name) {
  const list = shoes(name);
  const last = list[list.length - 1];
  if (!last) return null;
  if (last.closed) return last;
  return last.o ? null : list[list.length - 2] || null;
}

/** Remember the shoe as the reader has just written it. See `liveWrote`. */
function noteWrite(into, added) {
  const shoe = openShoe(readingTable(into, state.tables, chosenTable()));
  liveWrote = { id: shoe.id, o: shoe.o, added, reads: 0 };
}

/**
 * Take back a shoe the reader opened on a single mark, when the strip has gone
 * empty again straight after: the mark was the new shoe's first cell showing
 * an ask, not its first coup. Kept, it closed as a shoe of one coup the table
 * never dealt the moment the real first coup arrived. True when it was taken.
 */
function takeBackOpening() {
  const into = liveTable;
  const shoe = openShoe(readingTable(into, state.tables, chosenTable()));
  if (!liveWrote || !liveWrote.added || liveWrote.id !== shoe.id || liveWrote.o !== shoe.o
      || shoe.o.length !== 1 || liveWrote.reads > TAKE_BACK_READS) return false;
  replaceCurrentShoe("", into);
  noteWrite(into, false);
  liveLog(t("live.logTakenBack", { n: 1, total: 0 }));
  return true;
}

/**
 * Say which table the reader is filling, whenever that is not the one on
 * screen. Without this the coups simply appear somewhere else, and the table
 * being looked at sits still for no visible reason.
 */
function renderLiveBinding() {
  const bar = $("liveBinding");
  if (!bar) return;
  // The unsaved sheet is elsewhere whenever a table is on screen instead.
  const sheet = liveTable === "";
  const elsewhere = sheet ? !!chosenTable()
    : !!liveTable && !!state.tables[liveTable] && liveTable !== state.active;
  bar.hidden = !elsewhere;
  if (!elsewhere) return;
  bar.innerHTML = "";
  const line = el("span");
  if (sheet) {
    line.textContent = t("live.otherSheet");
  } else {
    // In the bold the string gives it, and as text: the name is somebody's
    // typing. Set whole as text, the string's own tags showed as "<b>".
    const [before, after = ""] = t("live.otherTable", { table: "\u0000" })
      .replace(/<\/?b>/g, "").split("\u0000");
    line.append(before, el("b", null, liveTable), after);
  }
  bar.appendChild(line);
  const go = el("button", "btn ghost", t(sheet ? "live.goToSheet" : "live.goToTable"));
  go.style.marginLeft = "8px";
  go.onclick = () => {
    state.active = sheet ? null : liveTable;
    $("tableSel").value = liveTable;
    invalidate();
    store.save(state, []);
    render();
  };
  bar.appendChild(go);
}

/**
 * Say so when the whole screen is being shared, with the way out beside it.
 *
 * The page asks the browser for a tab or a window, and most browsers then do
 * not offer the screen at all -- see `LiveWatcher.start`. Where one does, and
 * the screen is what came back, this page is in the picture with its own
 * board on it, and the reader can lock onto that. Drawn once per language
 * rather than every sample, so the button is not replaced under a click.
 */
function renderLiveSurface(surface) {
  const box = $("liveSurface");
  if (surface !== "monitor") { box.hidden = true; box.innerHTML = ""; liveSurfaceDrawn = null; return; }
  box.hidden = false;
  if (liveSurfaceDrawn === currentLang()) return;
  liveSurfaceDrawn = currentLang();
  box.innerHTML = "";
  const line = el("span");
  line.innerHTML = t("live.monitorWarn");
  box.appendChild(line);
  const again = el("button", "btn", t("live.monitorReshare"));
  again.style.marginLeft = "8px";
  again.dataset.act = "reshare";
  again.onclick = () => { live.stop(); live.start(); };
  box.appendChild(again);
}

function setLiveWarn(text, action) {
  const box = $("liveWarn");
  if (!text) { box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  box.innerHTML = "";
  // The warnings are i18n strings from this build, and two of them mark the
  // control they are telling you to press, so they carry markup.
  const line = el("span");
  line.innerHTML = text;
  box.appendChild(line);
  // One way out, or a choice of them -- the first being the one the warning
  // points at.
  for (const [i, a] of (Array.isArray(action) ? action : action ? [action] : []).entries()) {
    const b = el("button", i === 0 && Array.isArray(action) ? "btn" : "btn ghost", a.label);
    b.style.marginLeft = "8px";
    if (a.id) b.dataset.act = a.id;
    b.onclick = a.run;
    box.appendChild(b);
  }
}

/**
 * Offer the sources this device actually has, and describe the one it will
 * use. A phone has no screen sharing, so telling it about a window picker it
 * will never show is worse than saying nothing.
 */
function renderLiveSources() {
  const screen = LiveWatcher.screenSupported, camera = LiveWatcher.cameraSupported;
  $("liveStart").hidden = !screen;
  $("liveCamera").hidden = !camera;
  $("liveStart").classList.toggle("primary", screen);
  $("liveCamera").classList.toggle("primary", !screen);

  $("liveIdleH").textContent = t(screen ? "live.idleH" : "live.idleHCamera");
  $("liveIdleBody").hidden = !screen;
  // Where both exist the camera note is the secondary explanation; where the
  // camera is the only way in it is the whole explanation. The aiming tip only
  // matters once the camera is the way in, so it rides with the note.
  $("liveCameraBody").hidden = !camera;
  $("liveCameraTip").hidden = !camera;
  // And where both exist the camera is the full view's. A guest at a computer
  // shares the screen, and a second button with two paragraphs about phones
  // and camera angles under it was most of what the box said to them.
  for (const id of ["liveCamera", "liveCameraBody", "liveCameraTip"]) {
    $(id).toggleAttribute("data-full-only", screen);
  }
  // The privacy line names what the browser is about to ask for.
  const privacy = $("livePrivacy");
  privacy.dataset.i18n = screen ? "live.privacy" : "live.privacyCamera";
  privacy.textContent = t(privacy.dataset.i18n);
}

/** The last pin reported, so the log says it once rather than every sample. */
let livePinned = null;
/** Whether the reader was running at the last report, so a change is seen once. */
let liveWasActive = false;
/** Whether the preview is waiting for a box to be dragged on it. */
let livePicking = false;

function onLiveState(st) {
  // Sharing is what starts the page, so starting or stopping it on a table
  // with nothing in it moves the panels between their zeros and their figures.
  // Only on the change, not on every sample; and not before the corpus is
  // loaded -- a browser with neither screen nor camera is told so while the
  // controls are being bound, before there is any state to read, and reading
  // it there stopped the whole page from drawing.
  const flipped = !!st.active !== liveWasActive;
  if (flipped) {
    liveWasActive = !!st.active;
    if (state && !tableCoups()) render();
  }
  $("liveIdle").hidden = st.active || !!st.error;
  $("liveActive").hidden = !st.active;
  $("liveError").hidden = !st.error;
  renderLiveSurface(st.active && !st.error ? st.surface : null);
  // The box that has just come back was measured while it was hidden, when
  // none of its paragraphs had anything to open.
  if (flipped) foldExplanations();

  if (st.error || !st.active) liveWrote = null;
  if (st.error) { liveTable = null; renderLiveBinding(); renderLiveError(st.error, st.source); return; }
  if (!st.active) { liveTable = null; renderLiveBinding(); renderLiveSources(); return; }

  // A reader that is running owns what it was started on: the table chosen
  // then, or the unsaved sheet ("") when there was none. One whose table has
  // gone from under it owns whatever is chosen now.
  if (liveTable === null || (liveTable && !state.tables[liveTable])) {
    liveTable = chosenTable() ?? "";
  }
  renderLiveBinding();

  live.drawPreview($("liveCanvas"));

  // An empty strip that is still locked is a shoe change, not a lost screen,
  // and it must not be reported as one: telling someone to check their screen
  // sharing while the table is simply between shoes sends them fixing what is
  // not broken.
  const dot = $("liveDot");
  const found = !!st.board;
  dot.className = "livedot " + (found ? "on" : st.cleared ? "waiting" : "searching");
  const ago = st.lastReadAt ? Math.round((Date.now() - st.lastReadAt) / 1000) : null;
  const via = t(st.source === "camera" ? "live.sourceCamera" : "live.sourceScreen");
  // What the status said before: "finding the region", whenever nothing had
  // been read. That was true of a reader with no idea where to look and of one
  // pinned to the right strip waiting for the first coup of a shoe -- and the
  // second is the ordinary state of a table between shoes. Being told the app
  // is still hunting, while it is not, is what "it is not recognising it" looks
  // like from the outside.
  const pinWord = st.pinned === "manual" ? "live.lockedManual"
    : st.pinned === "grid" ? "live.lockedGrid"
    : st.locked ? "live.locked" : "live.locking";
  const waiting = st.pinned === "manual" ? t("live.waitingManual")
    : st.pinned === "grid" && st.grid
      ? t("live.waitingGrid", { cols: st.grid.cols, rows: st.grid.rows })
      : null;
  $("liveStatus").textContent = found
    ? t("live.reading", { n: st.board.sequence.length, lock: t(pinWord), ago }) + " · " + via
    : st.cleared ? t("live.cleared") + " · " + via
    : waiting ? waiting + " · " + via
    : t("live.searching");

  // Said once, when it happens, because it is the answer to "is it looking at
  // the right place" and the preview outline alone is easy to miss.
  if (st.pinned !== livePinned) {
    if (st.pinned === "grid" && st.grid) {
      liveLog(t("live.logPinned", { cols: st.grid.cols, rows: st.grid.rows }));
    } else if (st.pinned === "manual") {
      liveLog(t("live.logPinnedManual"));
    }
    livePinned = st.pinned;
  }
  $("livePick").textContent = t(st.pinned === "manual" ? "live.unpin"
    : livePicking ? "live.picking" : "live.pick");

  // The gap between a shoe ending and the next one being readable can run to
  // minutes, so the moment itself goes in the log rather than only the status.
  if (st.cleared && !liveCleared) {
    if (!takeBackOpening()) liveLog(t("live.logCleared"), "new");
    liveResumed = false;
  }
  liveCleared = st.cleared;
}

function renderLiveError(code, source) {
  const box = $("liveError");
  const own = location.href;
  const camera = source === "camera";
  const bodies = {
    unsupported: `<h3>${t("live.errUnsupportedH")}</h3><p>${t("live.errUnsupportedBody")}</p>`,
    denied: camera
      ? `<h3>${t("live.errCameraDeniedH")}</h3><p>${t("live.errDeniedIntro")}</p>` +
        `<ol><li>${t("live.errCameraDenied1")}</li><li>${t("live.errCameraDenied2")}</li></ol>` +
        `<p style="margin-top:11px"><a href="${own}" target="_blank" rel="noopener">${t("live.errOpenTop")}</a></p>`
      : `<h3>${t("live.errDeniedH")}</h3><p>${t("live.errDeniedIntro")}</p>` +
        `<ol><li>${t("live.errDenied1")}</li><li>${t("live.errDenied2")}</li></ol>` +
        `<p style="margin-top:11px"><a href="${own}" target="_blank" rel="noopener">${t("live.errOpenTop")}</a></p>`,
    nosource: `<h3>${t("live.errNoSourceH")}</h3><p>${t("live.errNoSourceBody")}</p>`,
    failed: `<h3>${t("live.errFailedH")}</h3><p>${t("live.errFailedBody")}</p>`,
  };
  box.innerHTML = (bodies[code] || bodies.failed) +
    `<div class="actions"><button class="btn" id="liveRetry">${t("live.retry")}</button></div>`;
  $("liveRetry").onclick = () => {
    live.error = null;
    live._emit();
    if (camera) live.startCamera(); else live.start();
  };
}

/* --------------------------------------------------------------- analysis */

/**
 * Banker's share of decided coups at this table, with an honest interval.
 *
 * Memoised, because three panels read it and its dispersion term walks the
 * whole corpus. That corpus is meant to reach two thousand shoes -- the
 * collection panel says so -- and recomputing per panel put a keystroke at
 * a third of a second there.
 */
let revision = 0;
let observedCache = null;
let shoeCache = null;          // the per-shoe breakdown, invalidated with it

/** Called wherever the corpus or the selected table changes. */
function invalidate() {
  revision += 1;
  observedCache = null;
  shoeCache = null;
}

/**
 * The pick actually shown: the network's where it has earned it, and
 * otherwise the shoe's pattern -- the side named by whichever reading of it
 * has called the shoe being dealt best so far, the estimate's side where none
 * names one. The pattern is the owner's choice; see `PATTERNS` for what it
 * costs.
 */
function recommended(p) {
  const l = learned();
  if (l.trusted && l.nextPick) return l.nextPick;
  return shoePattern(openShoe().o).pick(p.pick);
}

/**
 * How sure the table's record is of the side named -- the side actually
 * named, which the run can make the other one from the estimate's. See
 * `sideConfidence`.
 */
function sureOf(p, chosen) {
  if (chosen === p.pick) return { level: p.confidence, score: confidenceScore(p) };
  const o = observed();
  const deff = o.n && Number.isFinite(o.inflate) ? Math.max(1, o.inflate ** 2) : 1;
  return sideConfidence(o.n, o.n ? o.q : 0, deff, chosen);
}

function observed() {
  if (observedCache && observedCache.revision === revision && observedCache.table === state.active) {
    return observedCache.value;
  }
  const value = measure();
  observedCache = { revision, table: state.active, value };
  return value;
}

function measure() {
  const list = shoes().filter((s) => s.o.length);
  let b = 0, n = 0, ties = 0, coups = 0;
  for (const s of list) {
    for (const ch of s.o) {
      coups++;
      if (ch === "T") { ties++; continue; }
      n++; if (ch === "B") b++;
    }
  }
  if (!n) return { n: 0, coups, ties, shoes: list.length, banker: 0, player: 0 };

  const q = b / n;
  // Within-shoe clustering inflates the true standard error above the
  // binomial one, and the dispersion statistic measures exactly that ratio.
  // Only that one statistic is computed: the rest of the battery costs a
  // hundred milliseconds a keystroke at collection scale and says nothing here.
  const disp = list.length >= 5 ? shoeShareDispersion(list.map((s) => s.o)) : NaN;
  const inflate = Number.isFinite(disp) ? Math.sqrt(Math.max(1, disp)) : 1;
  const se = Math.sqrt((q * (1 - q)) / n) * inflate;

  // The interval is Wilson's, on the sample size the clustering leaves.
  //
  // The textbook interval is q +- 1.96 se, and at q = 1 that standard error is
  // zero: a table that has gone Banker thirty times running is reported as
  // 100.00% +- 0.00pp, which reads as certainty and is the opposite of what
  // thirty coups support. It is the same collapse the per-shoe table already
  // avoids by putting the null share in its denominator, and the tile beside
  // it had it still.
  //
  // Wilson does not collapse: it is the set of shares the observed count would
  // not reject, so a run of thirty Bankers comes out at 88.6%-100% rather than
  // a point. It is also the better interval everywhere else -- at a 60/40
  // split over 120 coups the two differ by two hundredths of a point -- so
  // nothing that reads this loses anything by the change.
  //
  // Clustering enters as an effective sample size rather than as a multiplier
  // on the error, which is the same discount `posterior` applies and the only
  // way to apply one to an interval that is not built from a standard error.
  const Z = 1.96;
  const nEff = n / Math.max(1, inflate ** 2);
  const denom = 1 + (Z * Z) / nEff;
  const centre = (q + (Z * Z) / (2 * nEff)) / denom;
  const half = (Z * Math.sqrt((q * (1 - q)) / nEff + (Z * Z) / (4 * nEff * nEff))) / denom;

  return {
    n, coups, ties, shoes: list.length, q, se, inflate, nEff,
    banker: b, player: n - b,
    lo: Math.max(0, centre - half), hi: Math.min(1, centre + half),
  };
}

/* ------------------------------------------------- the prediction log */

/**
 * Write down the recommendation now on screen.
 *
 * The coup it is about is the next one: the shoe in progress holds `n` coups,
 * so this is the prediction for index `n`. A shoe that has not been given an
 * id yet -- the empty one the app shows before anything is entered -- has
 * nothing to key on and nothing to predict about, so it is skipped.
 *
 * Confidence is the distance from the crossover in standard errors, scaled to
 * the 0-100 the log stores. It is deliberately not the probability: a 51%
 * share over forty coups and the same share over four thousand are the same
 * probability and not remotely the same claim.
 */
function logPrediction(p, chosen, worthBacking) {
  const name = state.active;
  if (!name || !state.tables[name]) return;
  const shoe = openShoe(name);
  if (!shoe.id) return;

  const l = learned();
  const usingNet = l.trusted && !!l.nextPick;
  const wrote = recordPrediction(predictionLog, name, {
    shoe: shoe.id,
    index: shoe.o.length,
    player: (1 - p.tie) * (1 - p.q),
    banker: (1 - p.tie) * p.q,
    tie: p.tie,
    pick: chosen,
    backed: worthBacking,
    confidence: sureOf(p, chosen).score,
    model: usingNet ? NET_MODEL_VERSION : BASE_MODEL_VERSION,
    features: FEATURE_VERSION,
    basis: shoe.o,
  });
  if (wrote) store.saveLog(predictionLog);
}

/** The confidence as the 0-100 figure the log stores: see `sideConfidence`. */
function confidenceScore(p) {
  return Number.isFinite(p.confidenceScore) ? p.confidenceScore : 0;
}

/**
 * Fill in what happened, for every table.
 *
 * Every table rather than the one on screen: the live reader can be filling a
 * table nobody is looking at, and a prediction that is never settled is a
 * prediction that never counts. Cheap enough to do on each commit -- it walks
 * the entries that have no result yet, which after the first pass is a
 * handful.
 */
function settleLog() {
  let done = 0;
  for (const name of Object.keys(state.tables)) {
    const sequences = {};
    for (const s of shoes(name)) sequences[s.id] = s.o;
    done += settlePredictions(predictionLog, name, sequences);
  }
  if (done) store.saveLog(predictionLog);
  return done;
}

/* ------------------------------------------------------------ prediction */

/** Cards consumed per coup and by the burn, measured over 3,000 simulated shoes. */
const CARDS_PER_COUP = 4.9392;
const MEAN_BURN = 7.518;
const SHOE_CARDS = 416;

/** The estimate, plus the one figure that depends on the shoe on screen. */
function predict() {
  const p = posterior(observed());
  return {
    ...p,
    cardsLeft: Math.max(0, Math.round(
      SHOE_CARDS - MEAN_BURN - openShoe().o.length * CARDS_PER_COUP)),
  };
}

/** The three shares a fresh 8-deck shoe produces, for a table with no coups. */
const FRESH_SHARES = {
  T: BASE_TIE,
  B: (1 - BASE_TIE) * BASE_BANKER_SHARE,
  P: (1 - BASE_TIE) * (1 - BASE_BANKER_SHARE),
};

/**
 * What this table has actually produced, as three shares of every coup.
 *
 * These are counts, not an estimate: `banker / coups` and its two companions,
 * which is what "the results on screen" means. Before the first coup there is
 * nothing to count, and the fresh-shoe figures stand in.
 */
function observedShares(o) {
  if (!o.coups) return { ...FRESH_SHARES, measured: false };
  return {
    P: o.player / o.coups, B: o.banker / o.coups, T: o.ties / o.coups,
    measured: true,
  };
}

/**
 * Nothing read, and nothing being read: the page before anyone has started.
 *
 * Every figure is at zero then. Sharing the screen is what starts it, so the
 * prediction and the rest appear the moment the screen is being read -- the
 * first coup gets its call like every other -- and not a moment before.
 */
function notStarted() {
  return !tableCoups() && !(live && live.active);
}

/** The prediction panel before anything has started: zeros, and what starts it. */
function renderPredictionIdle() {
  const bars = $("aiBars");
  bars.innerHTML = "";
  for (const code of ["P", "B", "T"]) {
    const row = el("div", "aibar " + code);
    row.appendChild(el("span", "n", side(code)));
    const track = el("div", "track");
    const fill = el("i");
    fill.style.width = "0%";
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("span", "p", pct(0, 2)));
    row.appendChild(deltaChip(0));
    bars.appendChild(row);
  }
  const pick = $("aiSide");
  pick.textContent = "\u2014";
  pick.className = "v";
  $("aiBetBadge").hidden = true;
  for (const id of ["aiBetWhy", "aiRecord"]) $(id).hidden = true;
  $("aiFacts").innerHTML = "";
  $("aiWhy").innerHTML = "";
  // Worded for the way in this device has: a phone has no screen to share.
  const cameraOnly = !LiveWatcher.screenSupported && LiveWatcher.cameraSupported;
  $("aiEstimate").textContent = t(cameraOnly ? "ai.idleStartCamera" : "ai.idleStart");
}

function renderPrediction() {
  // Nothing started: no table chosen, or one with nothing in it and no screen
  // being read. Every figure is zero and no side is named. Named from the
  // fair-shoe prior then, the recommendation read as one about this table,
  // which a guest who has just arrived and pressed nothing has not got.
  // Nothing is logged either: the record holds what the panel showed.
  if (notStarted()) {
    renderPredictionIdle();
    renderBetOutcome();
    renderLearned();
    renderVerification();
    $("aiDisclaimer").textContent = t("ai.disclaimer");
    return;
  }
  const p = predict();
  const o = observed();
  const shares = observedShares(o);

  const { moves, fresh } = trackPrediction(shares);
  const bars = $("aiBars");
  bars.innerHTML = "";
  for (const code of ["P", "B", "T"]) {
    const row = el("div", "aibar " + code);
    row.appendChild(el("span", "n", side(code)));
    const track = el("div", "track");
    const fill = el("i");
    // Scaled against the largest share so the three bars stay readable.
    fill.style.width = Math.min(100, (shares[code] / 0.5) * 100) + "%";
    track.appendChild(fill);
    row.appendChild(track);
    // Two decimals: this is a count over the coups collected, and it moves by
    // a tenth of a point at five hundred of them. The estimate below moves by
    // thousandths, and says so in its own line.
    const d = moves ? moves[code] : 0;
    const value = el("span", "p" + (d && fresh ? " bump" : ""), pct(shares[code], 2));
    row.appendChild(value);
    row.appendChild(deltaChip(d));
    bars.appendChild(row);
  }

  // Whichever of the two is actually being followed -- the network only where
  // its lead over the estimate is bigger than the noise.
  const chosen = recommended(p);

  // And then: is it a bet at all?
  //
  // A recommendation is an instruction to put money on something, and this
  // panel was issuing one beside its own expected value of -1.28% a hand and
  // its own confidence of "low". That is the app arguing with itself, and of
  // the two voices the arithmetic is the one that is right. On a fair table
  // the commission puts both sides under water -- Banker by about 1.06%,
  // Player by about 1.24% -- so naming the shallower one is not advice, it is
  // a description of which way you lose more slowly.
  //
  // Two questions, and the panel used to collapse them into one. "Which side
  // does the estimate favour" is a fact about the estimate and is answerable at
  // every single coup -- there is always a larger of two numbers. "Is backing
  // it better than not playing" is a different question, and on a fair table
  // the answer is no, because the commission puts both sides under water.
  //
  // Hiding the side whenever the second answer was no meant the panel went
  // quiet on precisely the tables it had the most to say about. So the side is
  // named every hand, and the bet judgment sits beside it as its own claim --
  // a badge rather than a paragraph, with the expectation itself in the row of
  // figures below it. The paragraph that used to spell the same thing out in
  // words is gone: on every coup it said at length what the badge and a
  // negative expectation already say in two places.
  //
  // And a positive expectation is a fact about the estimate at this look,
  // while the badge is read after every coup: on its own it said "worth
  // backing" at some point on a fifth of fair tables. The table's share has
  // to have cleared the break-even line by more than luck gives an honest
  // table read that often -- see `backingCleared` -- and where the estimate
  // is positive and the share has not got there, the line under the badge
  // says how far it has to go, so the two figures do not seem to disagree.
  const evChosen = edges(p.q, p.tie)[chosen];
  const worthBacking = evChosen > 0 && p.cleared[chosen];
  const pick = $("aiSide");
  pick.textContent = side(chosen);
  pick.className = "v " + chosen;

  const badge = $("aiBetBadge");
  badge.hidden = false;
  badge.textContent = t(worthBacking ? "ai.betGo" : "ai.betHold");
  badge.className = "betbadge " + (worthBacking ? "go" : "hold");

  const betWhy = $("aiBetWhy");
  betWhy.hidden = worthBacking || !(evChosen > 0);
  if (betWhy.hidden) betWhy.innerHTML = "";
  else {
    // The chosen side's own share of the decided coups, and the share that
    // would clear its line at this count.
    const need = chosen === "B" ? p.cleared.bankerAbove : 1 - p.cleared.bankerBelow;
    const now = chosen === "B" ? o.q : 1 - o.q;
    betWhy.innerHTML = need > 1
      ? t("ai.betWhyFew", { n: o.n.toLocaleString() })
      : t("ai.betWhy", { side: side(chosen), need: pct(need, 2), now: pct(now, 2),
                         n: o.n.toLocaleString() });
  }

  // Written down here, where the recommendation is finished and before the
  // coup it is about has happened. That ordering is the whole guarantee: the
  // outcome is added later by `settleLog`, from the shoe, and nothing in this
  // function can see it. Re-renders are free -- `record` keys on the coup, so
  // a language change or a resize cannot log the same one twice.
  logPrediction(p, chosen, worthBacking);

  // Said where the recommendation is, because that is the thing it changes.
  const record = learned().record;
  const flag = $("aiRecord");
  flag.hidden = !record || !record.implausible;
  if (record && record.implausible) {
    flag.innerHTML = t("ai.notBaccarat", {
      rate: pct(record.rate, 2),
      coups: record.coups.toLocaleString(),
      z: Math.abs(record.z).toFixed(0),
    });
  }

  // The bars are counts; this is what they imply about the coup about to be
  // dealt, and it is a different number for a reason worth stating.
  $("aiEstimate").innerHTML = shares.measured
    ? t("ai.estimateLine", {
        b: pct(p.decided * p.q, 2), p: pct(p.decided * (1 - p.q), 2), t: pct(p.tie, 2),
        n: o.coups.toLocaleString(), share: (p.weight * 100).toFixed(1),
      })
    : t("ai.estimateFresh");

  const facts = [
    { k: t("ai.ev"), v: pct(evChosen, 3), sub: t("ai.perCoup"), neg: evChosen < 0 },
    // Confidence is `|q - crossover| / se`, and neither term is a setting: one
    // is what the table produced, the other is how much of it there is. So
    // "low" on its own is a dead end -- it says the reading is weak without
    // saying what would make it strong. The distance to "high" is the only
    // useful thing to put beside it, and on a fair table that distance is
    // honestly infinite, because there is nothing there to become sure of.
    { k: t("ai.confidence"), v: t("ai.conf." + sureOf(p, chosen).level), sub: confidenceDistance(o, chosen) },
    // These two are the full view's. The guest's keeps the expectation and the
    // confidence -- the two that answer whether this is a bet -- and the margin
    // is what the confidence is made of, in the plain word beside it.
    { k: t("ai.margin"), v: "±" + (1.96 * p.se * 100).toFixed(3) + "%p", full: true },
    { k: t("ai.cardsLeft"), v: String(p.cardsLeft), sub: t("ai.estimated"), full: true },
  ];
  const grid = $("aiFacts");
  grid.innerHTML = "";
  for (const f of facts) {
    const row = el("div", "aifact");
    if (f.full) row.setAttribute("data-full-only", "");
    row.appendChild(el("span", "k", f.k));
    const v = el("span", "v" + (f.neg ? " neg" : ""), f.v);
    if (f.sub) v.appendChild(el("small", null, f.sub));
    row.appendChild(v);
    grid.appendChild(row);
  }

  renderBetOutcome();
  renderLearned();
  renderVerification();

  const why = [t("ai.whyBase")];
  if (!p.informed || p.moved < 0.0002) why.push(t("ai.whyThin", { n: p.n }));
