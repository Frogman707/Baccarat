 * put coup 7 in position 5 and silently rewrite the shoe. Stopping at the gap
 * gives a shorter shoe that is *true*, which is the only kind worth keeping.
 *
 * Returns the outcomes, how many coups are waiting behind the gap, and where
 * the gap is, so the page can say "3 coups are held back, waiting on coup 5"
 * rather than showing a shoe that quietly lost them.
 */
function outcomesFromHands(hands) {
  const byNumber = new Map();
  for (const h of hands || []) {
    const n = Number(h?.handNumber);
    const code = CODE_OF[String(h?.result)];
    if (!Number.isInteger(n) || n < 1 || n > MAX_HAND || !code) continue;
    byNumber.set(n, code);
  }
  let outcomes = "";
  let n = 1;
  while (byNumber.has(n)) { outcomes += byNumber.get(n); n += 1; }
  const held = [...byNumber.keys()].filter((k) => k > n).length;
  return { outcomes, held, missing: held ? n : 0 };
}

/**
 * What this device holds against what the room holds.
 *
 * Reports rather than decides. Where both have a coup and they disagree, one
 * of the two readers misread the table, and no rule about which copy wins can
 * tell you which -- so this names the disagreement and leaves it to be
 * resolved by somebody who can look at the board. The room's copy is taken for
 * positions it has, because it is the copy everybody else is already seeing;
 * anything this device holds beyond the room's end is kept, because it is
 * simply not written yet.
 */
/**
 * Whether two copies disagree about coups, or about where the coups are.
 *
 * `mergeOutcomes` compares position against position, which is right when the
 * two copies are lined up and badly wrong when they are not. A reader that
 * dropped one coup -- a sample that landed between frames, a mark not yet
 * drawn -- has everything after it shifted by one, and every position from
 * there on is compared against its neighbour. Measured on an eighty-coup
 * shoe with one coup missing from position twelve: forty-four disagreements,
 * out of sixty-eight coups that could have disagreed. The other twenty-four
 * matched by luck, because there are only three outcomes.
 *
 * So the count was never a count of mistakes. It was one mistake, counted
 * once per coup after it, and the advice that went with it -- whoever entered
 * the wrong one should correct it -- cannot be followed forty-four times.
 *
 * This says which of the two it is. Where the first disagreement is at coup
 * `n`, there are exactly two ways a single dropped or doubled coup could
 * explain the rest, and both are cheap to test: take one out of this copy at
 * `n`, or take one out of the room's. If either lines the remainder up
 * exactly, that is what happened, and there is one thing wrong rather than
 * forty-four.
 *
 * It does not guess beyond that. Two shifts, or a shift plus a genuine
 * misread, comes back as `scattered` and is reported coup by coup as before
 * -- an alignment that needs several corrections to hold is not evidence, it
 * is a story that fits.
 */
function alignment(mine, theirs) {
  const a = String(mine || "");
  const b = String(theirs || "");
  const shared = Math.min(a.length, b.length);

  let first = -1;
  for (let i = 0; i < shared; i += 1) {
    if (a[i] !== b[i]) { first = i; break; }
  }
  if (first < 0) return { kind: "same", from: 0, side: "", conflicts: [] };

  /** Do these two agree everywhere they overlap? */
  const linesUp = (x, y) => {
    const n = Math.min(x.length, y.length);
    if (!n) return false;                      // nothing left to agree about
    for (let i = 0; i < n; i += 1) if (x[i] !== y[i]) return false;
    return true;
  };

  // One coup too many in this copy, or one too few. Both are ordinary for a
  // reader watching a screen, and they are the same shift in opposite
  // directions.
  const extraHere = linesUp(a.slice(first + 1), b.slice(first));
  const extraThere = linesUp(a.slice(first), b.slice(first + 1));

  if (extraHere || extraThere) {
    return {
      kind: "drift",
      from: first + 1,
      // Where both readings fit, the direction is not established, and saying
      // one would be saying more than is known.
      side: extraHere && extraThere ? "either" : extraHere ? "mine" : "theirs",
      conflicts: [],
    };
  }

  const conflicts = [];
  for (let i = first; i < shared; i += 1) {
    if (a[i] !== b[i]) conflicts.push({ handNumber: i + 1, mine: a[i], theirs: b[i] });
  }
  return { kind: "scattered", from: first + 1, side: "", conflicts };
}

function mergeOutcomes(mine, theirs) {
  const a = String(mine || "");
  const b = String(theirs || "");
  const conflicts = [];
  const shared = Math.min(a.length, b.length);
  for (let i = 0; i < shared; i += 1) {
    if (a[i] !== b[i]) conflicts.push({ handNumber: i + 1, mine: a[i], theirs: b[i] });
  }
  const merged = b + (a.length > b.length ? a.slice(b.length) : "");
  return { outcomes: merged, conflicts, added: Math.max(0, b.length - a.length) };
}

/* ------------------------------------------------------------ the SDK ---- */

/**
 * Load the Firebase SDK, on demand and never before.
 *
 * A dynamic import, not a static one, for two reasons. The page is one
 * concatenated bundle with no package manager, so a static import would have
 * to be resolved at build time by machinery that does not exist here. And the
 * published page must keep working with no network and no Firebase at all --
 * it did for its whole life before this module -- so nothing is fetched until
 * somebody actually opens a room.
 */
async function loadFirebase(load = (url) => import(url)) {
  const at = (mod) => `${FIREBASE_CDN}/${FIREBASE_VERSION}/firebase-${mod}.js`;
  const [app, auth, firestore] = await Promise.all([
    load(at("app")), load(at("auth")), load(at("firestore")),
  ]);
  return { app, auth, firestore };
}

/**
 * The narrow set of operations a room needs, over whichever SDK it is given.
 *
 * Everything Firebase-shaped lives in this one function. The browser hands it
 * the modules from the CDN; `firebase/tests/room.test.mjs` hands it the same
 * modules from node_modules pointed at the emulator. Both run the code below
 * it unchanged, which is what makes the emulator test evidence about the
 * browser rather than about a parallel implementation.
 */
function facadeFor(sdk, db, uid) {
  const {
    doc, collection, setDoc, updateDoc, getDoc, onSnapshot, serverTimestamp,
    query, orderBy,
  } = sdk;
  return {
    uid,
    now: () => serverTimestamp(),
    ref: (...path) => doc(db, ...path),
    async write(path, data) { await setDoc(doc(db, ...path), data); },
    // A merge, not a replace: the room's `createdBy` and `createdAt` may not
    // move, and a set would carry whatever the caller happened to hold.
    async update(path, data) { await updateDoc(doc(db, ...path), data); },
    async read(path) {
      const snap = await getDoc(doc(db, ...path));
      return snap.exists() ? snap.data() : null;
    },
    watch(path, onRows) {
      const q = query(collection(db, ...path), orderBy("handNumber"));
      // The document's own name, carried alongside its contents. Without it a
      // watched row cannot be written back to: the page held every field of a
      // disagreement except the one thing needed to address it, which is half
      // of why nothing ever settled one. Last, so the name of the document
      // wins over a field that happens to be called the same thing.
      return onSnapshot(q, (snap) =>
        onRows(snap.docs.map((d) => ({ ...d.data(), id: d.id }))));
    },
  };
}

/**
 * Sign in and open a handle on the project's Firestore.
 *
 * Anonymous sign-in, because a uid is the whole of what the rules use: they
 * ask which account is writing, never who the person is. Asking a reader
 * standing at a table to make an account before they can record a coup would
 * buy nothing and cost the feature.
 *
 * `load` is injectable so this can be exercised without a network; the default
 * fetches the SDK from Firebase's own CDN the first time somebody opens a room.
 */
async function connectFirebase({ load = loadFirebase, config = FIREBASE_CONFIG } = {}) {
  if (!configured(config)) throw new Error("no Firebase project is configured");
  const { app, auth, firestore } = await load();

  // initializeApp twice is an error, and opening a second room in one session
  // would do exactly that.
  const existing = app.getApps?.() || [];
  const fbApp = existing.length ? app.getApp() : app.initializeApp(config);

  const fbAuth = auth.getAuth(fbApp);
  const user = fbAuth.currentUser || (await auth.signInAnonymously(fbAuth)).user;
  const db = firestore.getFirestore(fbApp);
  return { facade: facadeFor(firestore, db, user.uid), uid: user.uid };
}

/* --------------------------------------------------------------- errors -- */

/**
 * A refused write is not always a security problem, and the difference matters.
 *
 * Hands are create-only for everybody but their author, so a second reader
 * writing a coup that already exists is refused with exactly the same
 * `permission-denied` the rules use to turn away a stranger. One is a
 * duplicate and is ordinary; the other means somebody is somewhere they should
 * not be. Telling the user "access denied" for the first would be wrong, and
 * treating the second as a duplicate would be worse.
 */
function classifyWriteError(err, { existed = false } = {}) {
  const code = String(err?.code || "");
  if (code === "permission-denied" || code === "PERMISSION_DENIED") {
    return existed ? "duplicate" : "denied";
  }
  if (code === "unavailable" || code === "deadline-exceeded") return "offline";
  return "failed";
}

/* ---------------------------------------------------------- the queue ---- */

/** How many coups may wait. A shoe is at most 200; this is several shoes. */
const QUEUE_LIMIT = 1000;

/** The states a room connection can be in, as the brief names them. */
function syncState({ joined, online, queued, sending }) {
  if (!joined) return "off";
  if (sending) return "syncing";
  if (!online) return "offline";
  // Online, joined, and still holding coups: the connection is back but the
  // backlog has not gone yet. That is a different thing to say than "offline",
  // and a different thing to say than "everything is sent".
  return queued ? "reconnecting" : "online";
}

/**
 * Coups waiting to reach the room.
 *
 * **In order, and stopping at the first one that will not go.** This is the
 * whole design, and the reason is `outcomesFromHands`: the room's record stops
 * at its first gap, so a queue that skipped coup 5 and delivered 6 through 20
 * would leave every one of those fifteen invisible to everybody in the room --
 * present in the database, absent from every screen. Draining in order and
 * halting on failure keeps the record short and true rather than long and
 * wrong.
 *
 * Storage is injected. The page hands it localStorage so a queue survives the
 * reload that a phone going to sleep at a table will cause; the tests hand it
 * an object.
 */
class CoupQueue {
  constructor({ read = () => [], write = () => {}, limit = QUEUE_LIMIT } = {}) {
    this._read = read;
    this._write = write;
    this.limit = limit;
    this.full = false;
    const stored = read();
    this.items = Array.isArray(stored) ? stored.filter(isCoupEntry) : [];
  }

  /**
   * Take whatever is in storage now, before changing anything.
   *
   * Every change here is a read-modify-write for one reason: two tabs share
   * one storage key, each holds its own copy of the whole list, and each
   * writes all of it -- so without this, whichever tab saves last erases the
   * other's coups. That is not a hypothetical. `store.js` grew
   * `watchOtherTabs` because the corpus had exactly this bug, and two tabs is
   * a thing this project tells people to do: two tables in front of you is the
   * reason to open one. Two tables also means two shoes, so the queues are
   * disjoint and neither list is a superset that hides the loss.
   *
   * Storage first, then ours: storage holds what the other tab queued, ours
   * may hold what this tab queued a moment ago, and a coup is kept once.
   */
  _adopt() {
    let stored;
    try { stored = this._read(); } catch { return; }
    if (!Array.isArray(stored)) return;
    const seen = new Set();
    const merged = [];
    for (const e of [...stored.filter(isCoupEntry), ...this.items]) {
      const key = `${e.shoe}\u0000${e.n}`;
      if (seen.has(key)) continue;
      seen.add(key);
      merged.push(e);
    }
    this.items = merged;
  }

  get length() { return this.items.length; }

  /**
   * Add a coup, unless it is already waiting.
   *
   * Refuses rather than making room when full. Dropping the oldest would put a
   * hole at the front of the record, which is the one thing this class exists
   * to prevent; dropping the newest would lose what is happening now. Neither
   * is a decision to take quietly, so it stops and says so instead.
   */
  add(shoe, handNumber, code) {
    if (!shoe || !OUTCOME_OF[String(code)]) return false;
    if (!Number.isInteger(handNumber) || handNumber < 1 || handNumber > MAX_HAND) {
      return false;
    }
    this._adopt();
    if (this.items.some((e) => e.shoe === shoe && e.n === handNumber)) return false;
    if (this.items.length >= this.limit) { this.full = true; return false; }
    this.items.push({ shoe, n: handNumber, code });
    this.full = false;
    this.save();
    return true;
  }

  save() { try { this._write(this.items); } catch { /* storage is a courtesy */ } }

  /** Forget a shoe's coups -- it was undone, or its table was deleted. */
  forget(shoe) {
    this._adopt();
    const before = this.items.length;
    this.items = this.items.filter((e) => e.shoe !== shoe);
    if (this.items.length !== before) this.save();
  }

  /**
   * Send what is waiting, oldest first, stopping at the first refusal.
   *
   * `send(shoe, n, code)` returns what `RoomSync.recordCoup` returns. Written,
   * duplicate and conflict all mean the coup has reached the room and its fate
   * is decided, so it leaves the queue; conflicts are handed back so the page
   * can show them. Anything else means the coup is still owed and the run
   * stops there, with it still at the front.
   */
  async drain(send) {
    const conflicts = [];
    let sent = 0;
    let why = null;
    while (this.items.length) {
      const e = this.items[0];
      let answer;
      try {
        answer = await send(e.shoe, e.n, e.code);
      } catch {
        answer = "failed";
      }
      if (answer === "conflict") conflicts.push(e);
      if (answer !== "written" && answer !== "duplicate" && answer !== "conflict") {
        why = answer;
        break;
      }
      // Remove the one that went, and only that one. Shifting a stale copy of
      // the list and saving it would take another tab's additions with it --
      // the same lost update `_adopt` exists to prevent, arriving by the back
      // door after a successful send.
      this._adopt();
      this.items = this.items.filter((x) => !(x.shoe === e.shoe && x.n === e.n));
      this.save();
      sent += 1;
    }
    if (sent) { this.full = false; }
    return { sent, conflicts, left: this.items.length, why };
  }
}

function isCoupEntry(e) {
  return !!e && typeof e.shoe === "string" && Number.isInteger(e.n)
    && typeof e.code === "string" && !!OUTCOME_OF[e.code];
}

/* ------------------------------------------------------------- the room -- */

class RoomSync {
  /**
   * @param {object} opts
   * @param {function} opts.connect  builds `{facade, uid}`; injected so the
   *                                 emulator test and the browser share a path
   * @param {string}   opts.source   LIVE or FREE_GAME -- kept apart because a
   *                                 corpus mixing them measures neither
   */
  constructor({ connect, source = "LIVE" } = {}) {
    this._connect = connect;
    this.source = source;
    this.facade = null;
    this.roomId = "";
    this.ownedByMe = false;
    this.shoeId = "";
    this.status = "off";        // off | connecting | joined | error
    this.onStatus = () => {};
    this._shoeStop = null;
    this._conflictStop = null;
  }

  _setStatus(s, detail = null) {
    if (this.status === s) return;
    this.status = s;
    this.onStatus(s, detail);
  }

  /** Sign in and take the room. Never throws; the status carries the answer. */
  async join(roomId, { name = "" } = {}) {
    const id = cleanRoomId(roomId);
    if (!id) { this._setStatus("error", "that is not a room id"); return false; }
    if (!configured(FIREBASE_CONFIG)) {
      this._setStatus("error", "no Firebase project is configured");
      return false;
    }
    this._setStatus("connecting");
    try {
      const { facade } = await this._connect();
      this.facade = facade;
      this.roomId = id;

      // The order here is forced, and getting it wrong locks every reader out
      // of every room.
      //
      // A room is readable only by its members, so a reader who is not one yet
      // cannot look to see whether the room already exists -- reading it is
      // precisely what membership grants. So the room is *created* first: that
      // rule asks only for a signed-in writer, because it is the one move
      // somebody outside a room has to have. If the room is already there the
      // write lands on an existing document, which the rules refuse, and that
      // refusal is the answer to the question we were not allowed to ask.
      let opened = false;
      try {
        await facade.write(["rooms", id], {
          roomId: id,
          name: String(name || id).slice(0, 96),
          status: "OPEN",
          createdBy: facade.uid,
          createdAt: facade.now(),
        });
        opened = true;
      } catch {
        // Already open, or opened by somebody else a moment ago. Either way
        // this reader is joining rather than starting it.
      }

      // Now the membership, which is what makes everything else readable. The
      // document's id is what the rules check -- `isMember()` never looks at
      // the field inside it -- so this is the write that actually lets us in.
      //
      // And it is allowed to fail. Coming back to a room you are already in --
      // which is every page reload -- writes this document again with a fresh
      // server timestamp, and the rules refuse an edit that moves `joinedAt`,
      // because a join time somebody can rewrite is not a record of anything.
      // Being refused for that reason means the membership is already there,
      // which is the thing we wanted. So the write is attempted and the
      // read-back below is what decides, rather than this.
      try {
        await facade.write(["rooms", id, "members", facade.uid], {
          uid: facade.uid,
          role: opened ? "owner" : "member",
          joinedAt: facade.now(),
        });
      } catch {
        /* already a member, or genuinely refused -- the read-back tells which */
      }

      // And confirm it took, by doing the thing membership is for. Without
      // this, a reader whose membership was refused would go on believing it
      // had joined until the first coup failed in front of them at a table.
      const room = await facade.read(["rooms", id]);
      if (!room) {
        this._setStatus("error", "joined a room that cannot be read back");
        return false;
      }
      this.ownedByMe = room.createdBy === facade.uid;
      this.shoeId = String(room.currentShoeId || "");
      this._setStatus("joined");
      return true;
    } catch (err) {
      this._setStatus("error", String(err?.code || err?.message || err));
      return false;
    }
  }

  /**
   * Point the room at the shoe everybody should be recording into.
   *
   * Two devices have different local ids for the same physical shoe, so the
   * room needs one name for it that both can reach. The room document carries
   * it; whoever starts a shoe sets it and the others follow. Without this each
   * device would write its coups into a shoe of its own and the room would
   * hold two half-records of one table.
   */
  async useShoe(shoeId, { deckCount = 8 } = {}) {
    const f = this.facade;
    if (!f || !this.roomId) return false;
    try {
      await this.openShoe(shoeId, { deckCount });
      await f.update(["rooms", this.roomId], {
        currentShoeId: shoeId, updatedAt: f.now(),
      });
    } catch {
      // Naming a shoe is best effort, and has to be: it is two writes, and a
      // write fails when the connection is down. Letting that throw took the
      // caller's coups with it -- they were never queued, because the failure
      // happened first -- and being down is exactly when the queue is the only
      // thing keeping them. Losing the race to somebody else naming the same
      // shoe lands here too, and is harmless.
    }
    this.shoeId = shoeId;
    return true;
  }

  /** Follow a shoe. `onShoe` gets `{outcomes, held, missing}` on every change. */
  watchShoe(shoeId, onShoe) {
    if (!this.facade || !this.roomId) return () => {};
    this._stopShoe();
    this._shoeStop = this.facade.watch(
      ["rooms", this.roomId, "shoes", shoeId, "hands"],
      (rows) => onShoe(outcomesFromHands(rows)),
    );
    return () => this._stopShoe();
  }

  /**
   * Follow the room's disagreements.
   *
   * Without this the `conflicts` collection is write-only, and that is not a
   * tidiness problem: a disagreement is only ever *detected* by the device
   * that holds a different result, so this collection is the only way anybody
   * else learns about it. A reader who joined afterwards adopts the room's
   * copy, sees no disagreement, and has no reason to suspect one -- which is
   * exactly the reader most likely to act on it.
   */
  watchConflicts(onRows) {
    if (!this.facade || !this.roomId) return () => {};
    this._stopConflicts();
    this._conflictStop = this.facade.watch(
      ["rooms", this.roomId, "conflicts"],
      (rows) => onRows((rows || []).filter((r) => !r.resolved)),
    );
    return () => this._stopConflicts();
  }

  _stopShoe() {
    if (this._shoeStop) { try { this._shoeStop(); } catch { /* already gone */ } }
    this._shoeStop = null;
  }

  _stopConflicts() {
    if (this._conflictStop) {
      try { this._conflictStop(); } catch { /* already gone */ }
    }
    this._conflictStop = null;
  }

  /** Open a shoe in the room, if it is not open already. */
  async openShoe(shoeId, { deckCount = 8 } = {}) {
    const f = this.facade;
    if (!f || !this.roomId) return false;
    const path = ["rooms", this.roomId, "shoes", shoeId];
    if (await f.read(path)) return true;
    await f.write(path, {
      shoeId, roomId: this.roomId, deckCount, status: "OPEN",
      createdBy: f.uid, createdAt: f.now(),
    });
    return true;
  }

  /**
   * Record one coup.
   *
   * Returns "written", "duplicate", "denied", "offline" or "failed" rather
   * than throwing, because every one of those is an ordinary thing that
   * happens at a table and the caller has something different to do about
   * each. A duplicate in particular is not an error: it is the other reader
   * having got there first, which is the system working.
   */
  async recordCoup(shoeId, handNumber, code) {
    const f = this.facade;
    if (!f || !this.roomId) return "offline";
    const result = OUTCOME_OF[String(code)];
    if (!result) return "failed";
    if (!Number.isInteger(handNumber) || handNumber < 1 || handNumber > MAX_HAND) {
      return "failed";
    }
    const path = ["rooms", this.roomId, "shoes", shoeId, "hands", handId(handNumber)];
    try {
      await f.write(path, {
        handId: handId(handNumber),
        handNumber,
        result,
        source: this.source,
        sequence: handNumber,
        timestamp: f.now(),
        createdBy: f.uid,
      });
      return "written";
    } catch (err) {
      // Ask the database what is actually there before deciding what happened.
      // Three different things arrive here as the same `permission-denied`, and
      // they need three different answers:
      //
      //   nothing there      -- a real access problem, and the reader is
      //                         somewhere they should not be
      //   the same result    -- the other reader got there first. Not an error:
      //                         it is two people agreeing, which is the system
      //                         working exactly as intended
      //   a different result -- one of the two misread the board, and that has
      //                         to be seen. It is the only case here that
      //                         anybody needs to do anything about
      //
      // Collapsing the last two into "duplicate" would throw away the only
      // disagreement the record can detect, and it would do it silently.
      let there = null;
      try { there = await f.read(path); } catch { /* leave it null */ }
      if (!there) return classifyWriteError(err, { existed: false });
      return there.result === result ? "duplicate" : "conflict";
    }
  }

  /**
   * Write a disagreement down where the room can see it.
   *
   * Nothing here picks a winner, and that is deliberate: no rule about which
   * copy wins can tell you which reader misread the board. It records that the
   * two do not agree, and which coup, so a person who can look at the table
   * can settle it. A conflict that resolves itself is a conflict that was
   * decided by whoever happened to write second.
   */
  async reportConflict(shoeId, handNumber, mine, theirs) {
    const f = this.facade;
    if (!f || !this.roomId) return false;
    try {
      await f.write(["rooms", this.roomId, "conflicts", `${shoeId}-${handId(handNumber)}`], {
        shoeId,
        handNumber,
        mine: OUTCOME_OF[String(mine)] || String(mine),
        theirs: OUTCOME_OF[String(theirs)] || String(theirs),
        resolved: false,
        reportedBy: f.uid,
        reportedAt: f.now(),
      });
      return true;
    } catch {
      // Already reported by the other reader, which is the same conflict.
      return false;
    }
  }

  /**
   * Mark a disagreement settled, so the room stops showing it.
   *
   * The collection was write-only in practice. `reportConflict` wrote
   * `resolved: false`, `watchConflicts` filtered on it, the rules allowed the
   * update and an emulator test proved the filter worked -- by calling
   * `update` on the facade itself. Nothing a person could press ever set it,
   * so the count only went up, and a room that had been read for a few
   * sessions carried a banner nobody could clear. A test that reaches past
   * the thing it is testing proves the rule and not the path.
   *
   * Settling is not deciding. It says somebody looked, not that the record
   * has been corrected -- the coup itself is corrected the ordinary way, by
   * the person who entered the wrong one, and that is a separate act. The row
   * stays in the collection with `reportedBy` and `reportedAt` intact,
   * because the rules refuse to let it be deleted and because a disagreement
   * that happened is part of what happened.
   */
  async settleConflict(conflictId) {
    const f = this.facade;
    if (!f || !this.roomId || !conflictId) return false;
    try {
      await f.update(["rooms", this.roomId, "conflicts", String(conflictId)],
                     { resolved: true, settledBy: f.uid, settledAt: f.now() });
      return true;
    } catch {
      return false;
    }
  }

  /** Settle several, reporting how many went through. Failures are not fatal. */
  async settleConflicts(ids) {
    let done = 0;
    for (const id of ids || []) {
      if (await this.settleConflict(id)) done += 1;
    }
    return done;
  }

  /**
   * Write down that the two copies are out of step, rather than that dozens of
   * coups disagree.
   *
   * It goes in the same collection, because it is the same kind of thing --
   * something the room has to be told, that only the device holding the other
   * copy can detect. It is one row because it is one mistake. `handNumber` is
   * where they start to differ, which is not necessarily where the coup went
   * missing: outcomes repeat, so a drop can sit unnoticed behind several
   * coups that happen to match. The row says what is known.
   */
  async reportDrift(shoeId, from, side) {
    const f = this.facade;
    if (!f || !this.roomId) return false;
    try {
      await f.write(["rooms", this.roomId, "conflicts", `${shoeId}-drift-${handId(from)}`], {
        shoeId,
        handNumber: from,
        drift: true,
        side: String(side || "either"),
        resolved: false,
        reportedBy: f.uid,
        reportedAt: f.now(),
      });
      return true;
    } catch {
      return false;                      // already reported by the other reader
    }
  }

  close() {
    this._stopShoe();
    this._stopConflicts();
  }
}

/* ═══ live.js ═══ */
/* Watch the table's screen live.
 *
 * Two ways in, one pipeline. `getDisplayMedia` asks the browser for a stream
 * of a window or tab the viewer picks -- the same pixels they are already
 * looking at. `getUserMedia` asks for the camera, which is what a phone has
 * instead: point it at the table's screen and the frames read the same way.
 * Either stream feeds the bead-plate detector, so the board is read
 * continuously with no capture step, and still without touching the
 * operator's site, its markup or its credentials.
 *
 * Two things keep a live feed from writing nonsense into the corpus:
 *
 * 1. A frame caught mid-deal can show a half-drawn board, so a reading is only
 *    emitted once consecutive frames agree on it. Growth is confirmed quickly;
 *    a shoe change, which discards the shoe in progress, is held to a stricter
 *    count.
 * 2. Once the board is found its position is locked, and later frames are only
 *    searched there. That is faster, and it stops the detector wandering onto a
 *    different grid on the same screen between frames.
 *
 * The lock is taken from the roads themselves rather than from the coups in
 * them. A road is a ruled lattice of cells, printed on the page whether or not
 * anything has been dealt into it -- it is what the table clears *to* between
 * shoes -- so the region can be pinned to it before the first coup and held
 * through the wipe that ends a shoe. Finding the region by finding marks, which
 * is what this did, cannot work at exactly the moment it matters most: the
 * board is empty, the region goes with it, and the first coup of the new shoe
 * arrives with nowhere to be read.
 *
 * And where neither way of looking gets it right, the viewer can draw the
 * region themselves, which nothing here is allowed to move.
 */



/** Consecutive identical readings required before a change is accepted. */
const CONFIRM_GROWTH = 2;
const CONFIRM_RESET = 3;
/**
 * Empty samples inside the locked strip before the shoe is called finished.
 *
 * Every road on a table clears at the same moment when the shoe changes, so
 * "the locked strip has nothing in it" is what a shoe change looks like from
 * here -- and it is also what a window that moved looks like. The two are told
 * apart by evidence rather than by waiting: at this count the whole screen is
 * searched once, and a strip found elsewhere means the window moved.
 */
const CLEAR_PATIENCE = 3;

/**
 * How long a strip that has gone quiet is still the strip.
 *
 * A shoe change empties every road at once and the shuffle that follows runs
 * for minutes. For all of that time the watched strip reads nothing, and
 * anything else on screen with marks in it -- the table beside this one, a
 * second board in the lobby view -- outscores an empty strip trivially. Left
 * to a score comparison the reader walks off to that other board partway
 * through every shuffle and reads its coups as this table's.
 *
 * So an empty strip is not evidence for this long. Past it, a strip that has
 * stayed silent really has been left behind, and the search opens up again.
 *
 * Two minutes covers a shoe change and the shuffle after it with room to
 * spare, and is what a window that really did move costs to recover from --
 * or nothing at all, if the viewer presses the button the status bar offers.
 * The trade is deliberate: a wrong board read as this table's puts another
 * table's coups in the corpus, and that is worse than a wait.
 */
const MEMORY_HOLD_MS = 2 * 60 * 1000;
/**
 * How far below the best board on the frame the one being followed may fall
 * before the anchor stops protecting it.
 *
 * The anchor exists to stop the reading hopping between boards as a strip
 * fills in, not to defend a bad first choice. Without a floor it does the
 * latter: one frame where the bead plate was missed leaves the anchor on the
 * big road, and every frame after that hands the reading to a board scoring a
 * fifteenth as well -- which drops ties and folds runs past six rows.
 */
const PICK_TOLERANCE = 0.5;
/**
 * Samples between full-screen re-checks, so a bad lock heals on its own.
 *
 * Twelve is about twenty seconds at the default interval -- long enough that
 * the extra full-frame search costs nothing, short enough that nobody sits
 * watching the wrong board for long. Inside a locked region a board is scored
 * against its own neighbours only, so a lock holding just the big road scores
 * a fraction of what the bead plate scores on the whole screen, and the
 * comparison below moves the lock back.
 */
const RECHECK_EVERY = 12;
/**
 * Re-checks that find no ruling before a grid pin is given up.
 *
 * One miss is a frame caught mid-repaint, or a dialog over the strip. Three in
 * a row, a minute apart at the usual sampling rate, is the panel really being
 * gone -- a different tab, a closed window -- and the mark-led search takes
 * over again.
 */
const GRID_PATIENCE = 3;
/**
 * Marks needed to call something a board: fewer once the strip is located, and
 * one is enough in a strip just watched go empty.
 *
 * A new shoe deals into the same place one mark at a time. Holding the strip's
 * usual bar of three would drop the opening coups on the floor, and the cold
 * bar of eight -- which is where losing the lock lands -- drops the first seven.
 */
const COLD_CELLS = 8, LOCKED_CELLS = 3, FRESH_CELLS = 1;

/**
 * The band along the bottom of the screen where a result strip actually lives,
 * and the bar that applies inside it.
 *
 * Every casino layout puts the roads under the table: the video fills the top
 * of the window, the betting panel sits under it, and the strip runs along the
 * bottom. Searching there first is worth far more than it looks, because the
 * cold bar of eight marks is not caution about boards -- it is caution about
 * everything else on a screen, and most of everything else is above this line.
 *
 * A fraction rather than a pixel count, so it means the same thing whether the
 * casino window is filling a monitor or shrunk into the corner of one.
 */
const BAND_FRACTION = 0.45;
/**
 * One mark. In the band, with the shape rule in `detect.js` keeping a row of
 * betting chips from passing as a road's opening, a single bead is a coup --
 * which is what "read it even if only one hand has been dealt" requires, and
 * what a shoe's first coup is.
 */
const BAND_CELLS = 1;

/**
 * Whether what was found runs off the edge of where we were looking.
 *
 * Only the edges the hint itself introduced matter -- the band spans the full
 * width and reaches the foot of the frame, so its top is the only side that
 * can cut anything. A mark's diameter of slack, because a board that merely
 * starts near the boundary is not cut by it.
 */
function clippedBy(bounds, region, diameter) {
  if (!bounds || !region) return false;
  return bounds.y <= region.y + Math.max(2, diameter);
}

/** Whether a box lies inside a region. */
function within(box, region) {
  if (!region) return false;
  return box.x >= region.x && box.x2 <= region.x + region.w
      && box.y >= region.y && box.y2 <= region.y + region.h;
}

/** The bottom band of a frame, as a region to search. */
function bottomBand(frameW, frameH, fraction = BAND_FRACTION) {
  const h = Math.round(frameH * fraction);
  return { x: 0, y: frameH - h, w: frameW, h };
}

/**
 * The region to lock once a strip has been found.
 *
 * Drawn across the full width of the frame rather than tight around the marks.
 * A shoe grows to the right and the derived roads appear one after another, so
 * a box fitted to the strip as it was at the second coup spends the rest of the
 * shoe being widened a cell at a time -- and detection is confined to the
 * region, so it cannot see what it is cutting off. Width costs nothing here:
 * the strip is the only thing in its band, which is what picked it.
 */
function bandLock(bounds, frameW, frameH) {
  const height = bounds.y2 - bounds.y;
  const pad = Math.max(60, height * 0.45);
  const y = Math.max(0, Math.round(bounds.y - pad));
  const y2 = Math.min(frameH, Math.round(bounds.y2 + pad));
  return { x: 0, y, w: frameW, h: y2 - y };
}

/**
 * Where the result strip is, found by its ruling rather than by its marks.
 *
 * The bottom band first, because that is where every casino layout puts the
 * roads and looking there costs a quarter of what looking everywhere costs.
 * Then the whole frame, for the two cases the band gets wrong: a window shrunk
 * until the strip fills most of it, where the band cuts the strip in half, and
 * an operator who puts the roads beside the table rather than under it.
 *
 * Whichever finds the taller panel wins, because a strip cut off by the band's
 * own edge is shorter than the same strip found whole.
 */
function findStrip(frame, frameW, frameH) {
  const band = bottomBand(frameW, frameH);
  const inBand = detectGrid(frame, { region: band });
  // A panel that starts exactly at the band's top edge is a panel the band may
  // have cut. One that starts below it was not cut, and there is nothing the
  // wider search can add.
  if (inBand && inBand.panel.y > band.y + 2) return inBand;
  const whole = detectGrid(frame);
  if (!whole) return inBand;
  if (!inBand) return whole;
  const tall = (g) => g.panel.y2 - g.panel.y;
  return tall(whole) > tall(inBand) ? whole : inBand;
}

/**
 * The region to watch, given a strip found by its ruling.
 *
 * Full width, like every other lock here, and padded by a cell so a road that
 * grows a row -- the derived roads appear a few columns into a shoe -- is not
 * cut off by a box drawn before it arrived.
 */
function gridLock(grid, frameW, frameH) {
  const pad = Math.max(4, Math.round(grid.pitch));
  return {
    x: 0, w: frameW,
    y: Math.max(0, Math.round(grid.panel.y - pad)),
    h: Math.min(frameH, Math.round(grid.panel.y2 + pad))
       - Math.max(0, Math.round(grid.panel.y - pad)),
  };
}

/**
 * Which table a reading belongs to.
 *
 * The reader watches one table's screen. Changing the table selector changes
 * what the page shows; it does not change what the camera sees, so a reading
 * belongs to the table the reader was started on for as long as that table
 * still exists. Filing it under whichever table happens to be selected put one
 * table's board into another's corpus as a new shoe, and every figure that
 * table reports -- its statistics, its integrity verdict, its ledger -- was
 * then computed over two tables mixed together.
 *
 * A table that has been deleted out from under the reader falls back to the
 * selected one, because writing into a table that is not there would lose the
 * reading entirely.
 */
function readingTable(startedOn, tables, active) {
  return startedOn && tables && Object.prototype.hasOwnProperty.call(tables, startedOn)
    ? startedOn
    : active;
}

/**
 * Where to look for the board next, and how little will do.
 *
 * Three situations, and they want three different bars:
 *
 *   locked        the strip is known; three marks in it are coups, not
 *                 coincidence -- one, once it has been watched going empty,
 *                 because a shoe change is exactly when the next mark matters
 *   remembered    the lock was let go but a board was read here not long ago,
 *                 so it is still a known place and one mark is enough
 *   bottom band   nothing known, but the strip lives under the table on every
 *                 casino layout there is -- so the band along the bottom is
 *                 tried first, where three marks will do
 *   cold          the band had nothing either: the whole screen, and eight
 *                 marks before anything is called a board, because at this bar
 *                 a video feed and a betting panel are full of red and blue
 *
 * The remembered strip is what makes a new shoe readable. Without it, letting
 * go of the lock drops the search to the cold bar, and a shoe that has just
 * started is invisible until its eighth coup -- most of the way through the
 * first column, and every one of those coups lost.
 *
 * The band is what makes a new shoe *findable* in the first place. Returned as
 * a list because it is an attempt rather than an answer: if the strip is not
 * under the table on this screen, the whole-screen search still runs.
 */
function searchPlan(region, memory, cleared, frameW = 0, frameH = 0, trusted = false) {
  // A region pinned to the ruling is not a guess about where a board might be.
  // It is the roads panel, found as the roads panel, so one mark in it is a
  // coup and there is nothing to be cautious about. The three-mark bar exists
  // for a region inferred from marks, which can be inferred from the wrong
  // ones.
  if (region) {
    return [{ where: region, minCells: (cleared || trusted) ? FRESH_CELLS : LOCKED_CELLS }];
  }
  if (memory) return [{ where: memory, minCells: FRESH_CELLS }];
  const cold = { where: null, minCells: COLD_CELLS };
  if (!frameW || !frameH) return [cold];
  return [{ where: bottomBand(frameW, frameH), minCells: BAND_CELLS, hint: true }, cold];
}

class LiveWatcher {
  /**
   * @param {object} opts
   * @param {(seq: string, board: object) => void} opts.onRead   confirmed reading
   * @param {(state: object) => void} opts.onState               status for the UI
   * @param {number} opts.intervalMs                             sampling period
   */
  constructor({ onRead, onState, intervalMs = 2000 } = {}) {
    this.onRead = onRead || (() => {});
    this.onState = onState || (() => {});
    this.intervalMs = intervalMs;

    this.stream = null;
    this.video = null;
    this.canvas = null;
    this.timer = null;
    this.region = null;
    /**
     * Where the strip was, kept after the lock is let go.
     *
     * A new shoe deals one mark at a time into the place the last one filled.
     * With no lock the search is the cold one, which needs eight marks before
     * it will call anything a board -- so a shoe that has just started is
     * invisible until its eighth coup, which is most of the way through the
     * first column. Inside a strip a board has already been read in, one mark
     * is enough, and that is the same reasoning the locked bar rests on. So
     * the place is remembered, and it is looked at before the whole screen.
     *
     * Dropped the moment the evidence says the board is somewhere else, so a
     * remembered strip cannot keep the search away from where the board went.
     */
    this.memory = null;
    this.memoryAt = 0;       // when a board was last actually read in it
    /**
     * How the region came to be where it is, and the ruling it was pinned to.
     *
     *   "manual"  the viewer drew it. Nothing here ever moves it.
     *   "grid"    found by its own ruling, which is on screen whether or not a
     *             coup has been dealt -- so it is re-checked against the
     *             ruling rather than against the marks, and an empty strip is
     *             no reason at all to let go.
     *   "marks"   inferred from a board that was read. The old behaviour, and
     *             still the fallback where no ruling can be made out.
     */
    this.pinned = null;
    this.grid = null;        // the lattice the region was pinned to
    this.gridBox = null;     // and the lock it gave, before any widening
    this.gridMisses = 0;     // consecutive re-checks that could not find it
    this.bounds = null;      // the whole result strip, in frame pixels
    this.anchor = null;      // centre of the board being read, to keep the pick stable
    this.lastBox = null;     // and its box, so a neighbour is not mistaken for it
    this.empties = 0;        // consecutive samples with nothing in the strip
    this.cleared = false;    // the strip went empty: the next reading is a new shoe
    this.candidate = null;
    this.repeats = 0;
    this.lastBoard = null;
    this.lastReadAt = 0;
    this.reads = 0;
    this.samples = 0;
    this.error = null;
    this.source = null;      // "screen" or "camera", for the error advice
    this.preview = null;     // canvas the feed is painted into
    this.previewHandle = null;
    this.previewOwner = null;
    /**
     * A source being brought up, and the number the attempt bringing it up
     * holds.
     *
     * Opening a camera or a screen share is asynchronous and slow -- a picker
     * the viewer has to answer, a camera that has to wake -- and the buttons
     * that ask for one stay pressable throughout. Two presses used to mean two
     * requests: both read `this.stream` as empty, both were granted, the
     * second overwrote the first, and `stop` then closed only what it could
     * see. Measured rather than reasoned about: two `startCamera` calls a tick
     * apart, and after `stop` the first stream's tracks were still live and
     * one sampling interval was still firing. On a phone that is the camera
     * light staying on with nothing left that could turn it off.
     *
     * So a start claims the slot before it waits, and carries a number that
     * `stop` invalidates. An attempt that comes back holding a stale number
     * closes whatever it was given instead of installing it.
     */
    this.starting = null;
    this.attempt = 0;
  }

  get active() { return !!this.stream; }

  /** Sharing a window or tab -- desktop browsers only. */
  static get screenSupported() {
    return typeof navigator !== "undefined" && !!navigator.mediaDevices?.getDisplayMedia;
  }

  /** The camera -- what a phone has instead of screen sharing. */
  static get cameraSupported() {
    return typeof navigator !== "undefined" && !!navigator.mediaDevices?.getUserMedia;
  }

  /** Is any live source available at all? */
  static get supported() {
    return LiveWatcher.screenSupported || LiveWatcher.cameraSupported;
  }

  /**
   * Share a window or tab. Desktop browsers only.
   *
   * Reports failure through `onState` rather than rejecting: what goes wrong
   * here is environmental -- a permissions policy, a cancelled picker -- and
   * the interface has to explain it, not catch it.
   */
  async start() {
    return this._begin("screen", () => navigator.mediaDevices.getDisplayMedia({
      // A cap, not a floor: screen capture sends a frame when the screen
      // changes, so a table sitting still costs nothing either way. Four was
      // enough when the preview only repainted once a reading; now that it
      // paints every frame, four is what a choppy preview looks like.
      video: { frameRate: { ideal: 15 } },
      audio: false,
      // Nudges Chrome's picker toward the tab list, which is what a viewer
      // watching a browser-based table almost always wants.
      preferCurrentTab: false,
      selfBrowserSurface: "exclude",
      surfaceSwitching: "include",
    }));
  }

  /**
   * Point the camera at the table's screen.
   *
   * The rear camera at the highest resolution offered: the bead plate has to
   * survive being photographed, and detail is what the detector has to work
   * with. Everything downstream is identical to a shared screen.
   */
  async startCamera() {
    return this._begin("camera", () => navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        // Aiming a phone at a screen is a hand-eye task: the preview is what
        // you line the bead plate up with, so it has to move like a camera
        // and not like a slideshow. The detector still reads at its own much
        // slower interval -- these frames are for the person, not for it.
        frameRate: { ideal: 30 },
      },
      audio: false,
    }));
  }

  async _begin(source, request) {
    // Already watching, or already on the way up. Pressing both buttons, or
    // one of them twice, is one request as far as this is concerned. See
    // `this.starting`.
    if (this.stream || this.starting) return true;
    const available = source === "camera" ? LiveWatcher.cameraSupported : LiveWatcher.screenSupported;
    if (!available) {
      this.error = "unsupported";
      this.source = source;
      this._emit();
      return false;
    }

    const mine = this.attempt += 1;
    this.starting = source;

    let stream;
    try {
      stream = await request();
    } catch (e) {
      if (this.attempt !== mine) return false;     // stopped while the picker was up
      this.starting = null;
      // A permissions-policy block inside an iframe and an outright refusal
      // both arrive as NotAllowedError; they need different advice, and the
      // page cannot tell them apart, so the UI offers both.
      this.error = e?.name === "NotAllowedError" ? "denied"
        : e?.name === "NotFoundError" || e?.name === "OverconstrainedError" ? "nosource"
        : "failed";
      this.stream = null;
      this.source = source;
      this._emit();
      return false;
    }

    // Stopped while the picker was up. The watcher never took this stream, so
    // nothing else is holding it and nothing else can close it -- which is
    // exactly the leak this is here to stop.
    if (this.attempt !== mine) {
      for (const t of stream.getTracks()) t.stop();
      return false;
    }

    this.starting = null;
    this.stream = stream;
    this.error = null;
    this.source = source;
    this.video = document.createElement("video");
    this.video.srcObject = this.stream;
    this.video.muted = true;
    this.video.playsInline = true;
    this.canvas = document.createElement("canvas");
    await this.video.play().catch(() => {});

    // Stopped during `play`. `stop` had the stream by then and has already
    // closed it, so there is nothing left to release here -- only a sampler
    // not to start for a source that is gone.
    if (this.attempt !== mine) return false;

    for (const track of stream.getVideoTracks()) {
      track.addEventListener("ended", () => this.stop());
    }

    this._reset();
    this._startPreview();
    this.timer = setInterval(() => this._sample(), this.intervalMs);
    this._sample();
    this._emit();
    return true;
  }

  stop() {
    // Any start still waiting on a picker is no longer wanted. Its number
    // stops matching, so when it is finally answered it closes what it was
    // given rather than installing it.
    this.attempt += 1;
    this.starting = null;
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
    this._stopPreview();
    if (this.stream) for (const t of this.stream.getTracks()) t.stop();
    this.stream = null;
    if (this.video) { this.video.srcObject = null; this.video = null; }
    this._reset();
    this._emit();
  }

  /** Forget the locked position, e.g. after switching tables. */
  relock() {
    this.region = null;
    this.pinned = null;
    this.grid = null;
    this.gridBox = null;
    this.gridMisses = 0;
    this.memory = null;              // being told the lock is wrong
    this.memoryAt = 0;
    this.lastBox = null;
    this.bounds = null;
    this.anchor = null;
    this.empties = 0;
    this.cleared = false;
    this.candidate = null;
    this.repeats = 0;
  }

  /**
   * Watch this box and nothing else, until told otherwise.
   *
   * The one thing that cannot fail. Everything else here is the reader working
   * out where the roads are -- from their marks, and now from their ruling --
   * and both are inferences about a screen it has never seen before. A box the
   * viewer drew around their own table's strip is not an inference, so nothing
   * in the sampler is allowed to move it, widen it, or hand it over to a
   * better-looking board somewhere else.
   *
   * Given in frame pixels at working resolution, which is what the preview
   * canvas is drawn at, so the caller can pass a box read straight off it.
   */
  pinRegion(box) {
    if (!box || box.w < 8 || box.h < 8) return false;
    this.region = this.memory = { x: box.x, y: box.y, w: box.w, h: box.h };
    this.memoryAt = Date.now();
    this.pinned = "manual";
    this.grid = null;
    this.gridBox = null;
    this.gridMisses = 0;
    this.lastBox = null;
    this.anchor = null;
    this.candidate = null;
    this.repeats = 0;
    this.empties = 0;
    this.cleared = false;
    this._emit();
    return true;
  }

  /** Give the region back to the reader. */
  unpin() {
    this.relock();
    this._emit();
  }

  /** Named apart from the global `setInterval` it calls, to stay readable. */
  setSampleInterval(ms) {
    this.intervalMs = ms;
    if (this.timer) {
      clearInterval(this.timer);
      this.timer = setInterval(() => this._sample(), this.intervalMs);
    }
  }

  _reset() {
    this.relock();
    this.lastBoard = null;
    this.reads = 0;
    this.samples = 0;
  }

  _emit() {
    this.onState({
      active: this.active,
      error: this.error,
      board: this.lastBoard,
      source: this.source,
      bounds: this.bounds,
      locked: !!this.region,
      pinned: this.pinned,
      grid: this.grid && { cols: this.grid.cols, rows: this.grid.rows,
                           pitch: Math.round(this.grid.pitch) },
      cleared: this.cleared,
      lastReadAt: this.lastReadAt,
      reads: this.reads,
      candidate: this.candidate,
      repeats: this.repeats,
    });
  }

  /** Grab one frame, read it, and emit only once frames agree. */
  _sample() {
    const v = this.video;
    if (!v || !v.videoWidth) return;

    const scale = Math.min(1, WORK_MAX / Math.max(v.videoWidth, v.videoHeight));
    const w = Math.round(v.videoWidth * scale), h = Math.round(v.videoHeight * scale);
    if (this.canvas.width !== w || this.canvas.height !== h) {
      this.canvas.width = w; this.canvas.height = h;
    }
    const ctx = this.canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(v, 0, 0, w, h);
    const frame = ctx.getImageData(0, 0, w, h);

    // Inside a located strip three marks are coups, not coincidence, so a shoe
    // is read from its opening hands instead of waiting for eight. A cold
    // full-screen search keeps the higher bar, where anything red or blue can
    // turn up.
    this.samples += 1;

    // Before looking for marks, look for the panel they are dealt into.
    //
    // This is the whole change. Everything below finds the board by finding
    // its marks, which cannot work at a shoe change, when there are none --
    // and a shoe change is when it matters most, because the region is the
    // only thing that tells the next coup apart from the table next door. The
    // ruling of the roads is on screen either way: it is what the operator
    // clears *to*. So the region is pinned to the ruling, and an empty strip
    // stops being a reason to go looking anywhere else.
    if (!this.region && this.pinned !== "manual") {
      const grid = findStrip(frame, w, h);
      if (grid) {
        this.grid = grid;
        this.gridMisses = 0;
        this.pinned = "grid";
        this.gridBox = gridLock(grid, w, h);
        this.region = this.memory = this.gridBox;
        this.memoryAt = Date.now();
      }
    }

    const trusted = this.pinned === "grid" || this.pinned === "manual";
    const remembering = !this.region && !!this.memory;
    let boards = [], bounds = null;
    for (const attempt of searchPlan(this.region, this.memory, this.cleared, w, h, trusted)) {
      const got = detectBoards(frame, { region: attempt.where, minCells: attempt.minCells });
      if (!got.boards.length) continue;
      if (!boards.length || got.boards[0].cells.length > boards[0].cells.length) {
        boards = got.boards; bounds = got.bounds;
      }
      // The band says where strips usually are. It says nothing about where
      // this one ends, so a board running off its upper edge has been cut in
      // half by the guess rather than found by it -- and half a bead plate is
      // not a short shoe, it is the wrong rows of a long one. Whoever is
      // sharing a window rather than a whole desktop gets exactly that: the
      // strip fills the frame, the band takes the bottom of it, and five
      // columns of six read as five columns of three. Widen and keep whichever
      // reads more.
      if (!(attempt.hint && clippedBy(got.bounds, attempt.where, got.diameter))) break;
    }

    // Inside a lock, only what carries on from the board being read is this
    // table's. Filtered here rather than at the pick, so a strip holding
    // nothing but a neighbour reads as empty and takes the path an emptied
    // strip already takes.
    if (this.region && this.lastBox) boards = boardsCarryingOn(boards, this.lastBox);

    // A remembered strip is given up on time, not on emptiness: emptiness is
    // what a shoe change looks like, and it lasts for the whole shuffle.
    if (remembering && !boards.length && Date.now() - this.memoryAt > MEMORY_HOLD_MS) {
      this.memory = null;
    }

    // Every so often, look at the whole screen again. If the strip is clearly
    // elsewhere -- the window moved, or the first lock landed on the wrong
    // thing -- this is what lets go of it. Counted in samples rather than
    // readings: a strip reading nothing is exactly when this is needed, and
    // counting readings meant it never ran then.
    // While the remembered strip is still within its hold, an empty reading
    // there says "between shoes", not "wrong place", and nothing found
    // elsewhere is allowed to argue with it.
    const holding = this.memory && Date.now() - this.memoryAt <= MEMORY_HOLD_MS;

    // A region pinned to the ruling is re-checked against the ruling. That is
    // a question about the panel, which is always there, rather than about the
    // coups in it, which are not -- so the answer does not change at a shoe
    // change, and the lock does not move at one either.
    if (this.pinned === "grid" && this.samples % RECHECK_EVERY === 0) {
      const grid = findStrip(frame, w, h);
      if (grid) {
        this.gridMisses = 0;
        this.grid = grid;
        const want = gridLock(grid, w, h);
        // Measured against the lock the ruling last gave rather than against
        // the region in force, because the region in force has been widened
        // since -- a shoe growing to the right pushes its edges out. Comparing
        // with that would read the reader's own widening as the window having
        // moved, and re-pin every time, undoing it.
        const was = this.gridBox || want;
        if (Math.abs(want.y - was.y) > grid.pitch || Math.abs(want.h - was.h) > grid.pitch) {
          this.region = this.memory = want;
          this.lastBox = null;
          this.anchor = null;
        }
        this.gridBox = want;
        // A lattice that has never produced a coup is a lattice, not
        // necessarily *the* roads. Something else ruled into cells -- a
        // spreadsheet, a schedule, the wrong window entirely -- keeps
        // answering the re-check above, so the miss counter never fires and
        // the pin would sit there for the rest of the session. So while a grid
        // pin has read nothing at all, the screen outside it is still looked
        // at, and a real board found out there takes the pin away.
        //
        // Only while it has read nothing. Once a coup has come out of it the
        // pin has proved itself, and an empty strip is a shoe change rather
        // than a mistake -- which is the whole thing this was built to stop
        // being confused about.
        if (!this.reads) {
          const elsewhere = detectBoards(frame, { minCells: COLD_CELLS });
          const best = elsewhere.boards[0];
          if (best && !boards.length && !within(best.box, this.region)) {
            boards = elsewhere.boards;
            bounds = elsewhere.bounds;
            this.pinned = null;
            this.grid = null;
            this.gridBox = null;
            this.region = this.memory = null;
            this.lastBox = null;
            this.anchor = null;
          }
        }
      } else if ((this.gridMisses += 1) >= GRID_PATIENCE) {
        // The ruling is not there any more, several looks running. The panel
        // really has gone -- a different tab, a closed window -- so the pin
        // goes with it and the mark-led search takes over again.
        this.pinned = null;
        this.grid = null;
        this.gridMisses = 0;
      }
    }

    // A region the viewer drew is theirs, and neither re-check touches it.
    if (this.region && !this.pinned && this.samples % RECHECK_EVERY === 0) {
      const full = detectBoards(frame, { minCells: COLD_CELLS });
      const here = boards.length ? boards[0].score : 0;
      // The lock only moves off a strip that has been silent long enough to
      // have been left behind. A strip with marks in it has not been left
      // behind, however few those marks are -- and a strip that has just
      // turned over has exactly one. Comparing scores there is comparing one
      // coup against a neighbouring table's full board, which the neighbour
      // wins every time: measured, the reader read the new shoe's first coup
      // correctly, then handed the lock over and added seven of the
      // neighbour's coups to this table's shoe.
      //
      // `holding` is the memory's own window, and its whole purpose is this:
      // past it a quiet strip really has been abandoned, and the search opens
      // up again. Before it, quiet is what a shoe change sounds like.
      const abandoned = !boards.length && !holding;
      if (abandoned && full.boards.length && full.boards[0].score > here * 1.25) {
        boards = full.boards;
        bounds = full.bounds;
        this.region = null;
        this.memory = null;          // the board is over there, not here
        this.anchor = null;
        this.lastBox = null;
        this.cleared = false;
      } else if (full.bounds) {
        // Same strip, and it may have grown since the lock was taken -- the
        // derived roads arrive several columns into the shoe, and a lock taken
        // before them cuts them off for the rest of it.
        const grown = growToStrip(this.region, full.bounds, w, h);
        if (grown !== this.region) {
          this.region = grown;
          if (this.memory) this.memory = grown;
        }
      }
    }

    if (!boards.length && this.region) {
      // An empty strip is not a lost board. The table wipes every road at once
      // when the shoe changes, so falling back to a full search here searched
      // for eight marks the new shoe had not dealt yet -- and told the viewer
      // their screen sharing was broken while it did. The lock is kept and the
      // emptiness reported instead.
      if (this.empties === CLEAR_PATIENCE) {
        // The strip is empty and the lock stays on it.
        //
        // This used to search the whole screen here, and hand the lock over to
        // whatever it found. The reasoning was that something visible outside
        // the strip might mean the window had moved. On a casino screen it
        // almost never does: the betting panel and the neighbouring table were
        // there the whole time and are only *interesting* now because this
        // strip went quiet. An empty strip scores zero, so anything at all
        // beat it, and the lock went to the neighbour every shoe change.
        //
        // Measured on a screen carrying a second board: the first shoe read
        // 34 of 34, the table wiped, one coup of the new shoe was dealt -- and
        // the reader came back with 42, having adopted the neighbour's twelve
        // marks as this table's new shoe. Seven coups that were never dealt
        // here, filed under this table, permanently.
        //
        // A window that really did move is still recovered from, by the
        // periodic full-screen re-check above: it compares scores rather than
        // asking whether anything exists, and it resumes once the remembered
        // strip's hold expires. Slower, and right.
        this.cleared = true;
        // `lastBox` stays. A shoe refills where the last one was, so the box
        // just read is what tells the new shoe's first mark apart from the
        // neighbouring table's board -- and with the lock now spanning the
        // full width of the frame, that neighbour is inside the region.
        // Clearing it here let the neighbour's twelve marks in as this table's
        // new shoe; `boardsCarryingOn` is what keeps them out, and it has
        // nothing to work with once the box is gone.
        this.candidate = null;
        this.repeats = 0;
      }
      this.empties += 1;
      this.lastBoard = null;
      this._emit();
      return;
    }
    if (!boards.length) { this.lastBoard = null; this.empties += 1; this._emit(); return; }
    this.empties = 0;

    // Prefer the board this run has been reading, so a strip that gains a
    // derived road between frames does not move the reading somewhere else --
    // but only among boards still worth reading, so the preference cannot
    // outlive the reason for it.
    const board = pickBoard(boards, this.anchor);
    this.anchor = centreOf(board.box);
    this.lastBox = board.box;
    this.bounds = bounds;
    this.lastBoard = { ...board, frameWidth: w, frameHeight: h };
    this.lastReadAt = Date.now();
    this.reads += 1;

    if (board.sequence === this.candidate) this.repeats += 1;
    else { this.candidate = board.sequence; this.repeats = 1; }

    // Lock on once a reading has held still. The locked region is the whole
    // strip, not just the board being read: the derived roads fill in as the
    // shoe goes on, and a box drawn tight around the bead plate would keep
    // cutting them off.
    if (!this.region && this.repeats >= CONFIRM_GROWTH) {
      this.region = bandLock(bounds, w, h);
    }
    // Whatever strip is being read from, that is the place worth remembering.
    if (this.region) { this.memory = this.region; this.memoryAt = Date.now(); }

    // The flag rides with the reading and is dropped on the one that carries
    // it far enough to be acted on, so the caller sees it exactly once.
    const afterClear = this.cleared;
    // A shoe fills to the right, and the lock is drawn around the strip as it
    // was when it was found. Detection is confined to the region, so the lock
    // cannot see what it is cutting off -- it reads a clipped board and stays
    // that way. So a board that comes within a cell or two of its own edge
    // pushes that edge out, keeping headroom ahead of where the shoe is going.
    // Not a region the viewer drew. Widening it would be the reader deciding
    // it knows better about the one thing it was told outright.
    if (this.region && this.pinned !== "manual") {
      this.region = this.memory = widenFor(this.region, board, w, h);
    }

    this.onRead(board.sequence, this.lastBoard, this.repeats, { afterClear });
    if (afterClear && this.repeats >= CONFIRM_GROWTH) this.cleared = false;
    this._emit();
  }

  /**
   * Paint the feed into `target`, and keep painting it.
   *
   * The preview used to be drawn once per reading, from the frame the reader
   * had just analysed -- so a camera producing thirty frames a second was
   * shown at two thirds of one. That is fine for a shared tab, which barely
   * changes, and useless for a camera, where the preview is the thing you aim
   * with. So the two are separated: the reader keeps its slow interval, and
   * the picture runs at the rate the frames actually arrive.
   */
  drawPreview(target) {
    this.preview = target;
    return this._paintPreview();
  }

  /**
   * Ask to be called back for the next frame.
   *
   * `requestVideoFrameCallback` fires once per decoded frame, which is exactly
   * the cadence wanted: a camera at thirty frames a second paints thirty
   * times, and a shared tab held at four paints four times instead of
   * repainting an unchanged picture sixty. Where it is missing, the animation
   * frame is the honest fallback.
   */
  _queuePreview(step) {
    const v = this.video;
    if (v && typeof v.requestVideoFrameCallback === "function") {
      this.previewOwner = v;
      this.previewHandle = v.requestVideoFrameCallback(step);
    } else {
      this.previewOwner = null;
      this.previewHandle = requestAnimationFrame(step);
    }
  }

  _startPreview() {
    this._stopPreview();
    const step = () => {
      this.previewHandle = null;
      if (!this.stream) return;
      this._paintPreview();
      this._queuePreview(step);
    };
    this._queuePreview(step);
  }

  _stopPreview() {
    if (this.previewHandle === null) return;
    if (this.previewOwner?.cancelVideoFrameCallback) {
      this.previewOwner.cancelVideoFrameCallback(this.previewHandle);
    } else {
      cancelAnimationFrame(this.previewHandle);
    }
    this.previewHandle = null;
    this.previewOwner = null;
  }

  /**
   * One frame: the live picture, then the strip lit and the board outlined.
   *
   * The overlay comes from the last reading rather than this frame, which is
   * what makes the separation work -- the region is locked, so the box belongs
   * where it was drawn until the reader moves it.
   */
  _paintPreview() {
    const v = this.video, target = this.preview;
    if (!target || !v || !v.videoWidth) return false;

    // Working resolution, so the overlay's coordinates land where they belong.
    const scale = Math.min(1, WORK_MAX / Math.max(v.videoWidth, v.videoHeight));
    const w = Math.round(v.videoWidth * scale), h = Math.round(v.videoHeight * scale);
    // Assigning width or height clears and reallocates the canvas, so it is
    // only worth doing when the frame size actually changed.
    if (target.width !== w || target.height !== h) { target.width = w; target.height = h; }

    const ctx = target.getContext("2d");
    ctx.drawImage(v, 0, 0, w, h);
    // The region first, so it is visible with nothing in it -- which is the
    // whole point of pinning to the ruling, and the only way to see that the
    // reader is watching the right place before a coup has been dealt.
    if (this.region && this.pinned) drawRegion(ctx, this.region, this.pinned);
    const board = this.lastBoard;
    if (board) drawStrip(ctx, target, this.bounds || board.box, board);
    return true;
  }
}

/**
 * How deep a shoe may already be the first time it is seen, when the strip was
 * never watched going empty.
 *
 * A new shoe starts at one coup and grows. So a reading that shares nothing
 * with the shoe in progress and arrives already dozens deep is not a new shoe
 * on this board -- it is a different board: the big road beside the bead
 * plate, or the table next door. Filing it as a shoe is how a record fills
 * with fragments.
 *
 * Measured from a real session's log: "new shoe -- 45 read", then "new shoe --
 * 36 read", a minute apart, on a table whose own counter said 37. Thirty-one
 * shoes averaging 18 coups came out of it, against a real 8-deck shoe's 80.
 *
 * A first column and a little, because the reader can miss the opening coups
 * of a shoe it was not looking at. Past that the viewer is asked rather than
 * obeyed -- switching the shared window to another table really does produce
 * a deep reading with nothing in common, and that is a click away.
 */
const RESTART_DEPTH = 8;

/**
 * Decide what a fresh reading means for the shoe in progress.
 *
 * Returns one of `same` (nothing changed), `grow` (the board gained coups),
 * `reset` (the board restarted -- a new shoe) or `hold` (a shorter reading
 * that shares a prefix, which is far more likely to be a half-drawn frame than
 * a real event, so it is ignored).
 */
function diagnose(current, incoming) {
  if (incoming === current) return "same";
  if (!current.length) return "grow";
  if (!sharePrefix(current, incoming)) return "reset";
  return incoming.length > current.length ? "grow" : "hold";
}


const centreOf = (box) => ({ x: (box.x + box.x2) / 2, y: (box.y + box.y2) / 2 });

/**
 * The locked strip, pushed outward wherever `board` has reached its edge.
 *
 * It only ever grows, and only up to the frame: a lock that could tighten
 * would chase a board that had already been clipped into a corner. Distances
 * are in marks rather than pixels, because a mark is the size the board grows
 * by and the only scale on screen that means anything here.
 */
/**
 * Grow a locked strip to the strip that is actually there.
 *
 * A result strip is not all present when the reader first sees it. The derived
 * roads have nothing to derive until the big road has the columns for them --
 * the cockroach road needs five -- so a lock taken in the opening coups is
 * drawn around a strip that is still half empty, and the roads that appear
 * later appear outside it. `widenFor` cannot fix that: it keeps headroom
 * around the board being read, and the board being read is the bead plate at
 * the other end. Nor can anything inside the lock, which by definition cannot
 * see what it excludes. It takes a look at the whole frame, which the reader
 * already takes every so often.
 *
 * Only a strip overlapping this one is this one; a board somewhere else on the
 * screen is another table, and is handled where it is found. The region never
 * shrinks here -- a strip that has grown does not ungrow -- so this can only
 * ever let more of the same band in.
 */
function growToStrip(region, bounds, frameW, frameH) {
  if (!region || !bounds) return region;
  const x2 = region.x + region.w, y2 = region.y + region.h;
  const touches = bounds.x < x2 && region.x < bounds.x2
               && bounds.y < y2 && region.y < bounds.y2;
  if (!touches) return region;

  const pad = Math.max(30, (bounds.x2 - bounds.x) * 0.04);
  const nx = Math.max(0, Math.min(region.x, bounds.x - pad));
  const ny = Math.max(0, Math.min(region.y, bounds.y - pad));
  const nx2 = Math.min(frameW, Math.max(x2, bounds.x2 + pad));
  const ny2 = Math.min(frameH, Math.max(y2, bounds.y2 + pad));
  return { x: nx, y: ny, w: nx2 - nx, h: ny2 - ny };
}

function widenFor(region, board, frameW, frameH) {
  const d = board.diameter || 20;
  const margin = Math.max(48, d * 1.5);       // headroom kept ahead of the board
  const step = Math.max(80, d * 3);           // and how much is added when it runs out
  let x = region.x, y = region.y;
  let x2 = region.x + region.w, y2 = region.y + region.h;

  if (board.box.x - x < margin) x -= step;
  if (x2 - board.box.x2 < margin) x2 += step;
  if (board.box.y - y < margin) y -= step;
  if (y2 - board.box.y2 < margin) y2 += step;

  x = Math.max(0, x); y = Math.max(0, y);
  x2 = Math.min(frameW, x2); y2 = Math.min(frameH, y2);
  return { x, y, w: x2 - x, h: y2 - y };
}

/**
 * The board to read: the one being followed, as long as it is still credible.
 *
 * Boards arrive best-first. With no anchor the best one wins outright; with
 * one, the choice is made among those within `PICK_TOLERANCE` of the best, so
 * following a board survives it gaining a column but not it turning out to be
 * the wrong board.
 */
function pickBoard(boards, anchor) {
  if (!boards.length) return null;
  if (!anchor) return boards[0];
  const floor = boards[0].score * PICK_TOLERANCE;
  const credible = boards.filter((b) => b.score >= floor);
  const pool = credible.length ? credible : boards;

  return nearestTo(pool, anchor);
}

/**
 * The boards that could be the one last read in `lastBox`, still carrying on.
 *
 * A locked strip is the whole result band. Beside the roads a table screen
 * puts its video, and a lobby view puts other tables -- all in the same band,
 * all full of the same red and blue, so the strip can hold more than the board
 * being watched. While that board has marks in it, "nearest to where we were
 * reading" picks it and the rest are ignored. The moment it clears for a shoe
 * change, the neighbour is the only thing left, and nearest-to hands it over:
 * its coups are read as this table's, in a shoe of their own.
 *
 * A shoe refills where the last one was, so the board carrying on is the one
 * still overlapping the box just read. Sharing no ground with it makes it a
 * different board, and a strip holding only those is, from here, empty --
 * which is what a shoe change is, and is already handled as one.
 */
function boardsCarryingOn(found, lastBox) {
  if (!lastBox) return found;
  return found.filter((b) => b.box.x < lastBox.x2 && lastBox.x < b.box.x2
                          && b.box.y < lastBox.y2 && lastBox.y < b.box.y2);
}

/** The board whose centre is closest to `point`, falling back to the best. */
function nearestTo(boards, point) {
  let best = boards[0], bestD = Infinity;
  for (const b of boards) {
    const cx = (b.box.x + b.box.x2) / 2, cy = (b.box.y + b.box.y2) / 2;
    const d = (cx - point.x) ** 2 + (cy - point.y) ** 2;
    if (d < bestD) { bestD = d; best = b; }
  }
  return best;
}

/**
 * Dim everything outside `bounds`, then mark `board` inside it.
 *
 * Shared by the live preview and the pasted-capture view so both show the same
 * thing: the strip being watched, and the board being counted.
 */
/**
 * Outline the region being watched.
 *
 * Dashed and unfilled, so it reads as "this is where I am looking" rather than
 * "this is what I found" -- the solid box `drawStrip` draws is the second. The
 * two are different claims and they need to look different, most of all when
 * there is no board yet and only this one is on screen.
 */
function drawRegion(ctx, region, how) {
  ctx.save();
  ctx.setLineDash(how === "manual" ? [] : [7, 5]);
  ctx.lineWidth = 2;
  ctx.strokeStyle = how === "manual" ? "rgba(120, 200, 255, 0.95)"
                                     : "rgba(120, 200, 255, 0.6)";
  ctx.strokeRect(region.x + 1, region.y + 1, region.w - 2, region.h - 2);
  ctx.restore();
}

function drawStrip(ctx, source, bounds, board) {
  const css = getComputedStyle(document.documentElement);
  const w = source.width, h = source.height;
  const pad = Math.max(12, (bounds.x2 - bounds.x) * 0.02);
  const bx = Math.max(0, bounds.x - pad), by = Math.max(0, bounds.y - pad);
  const bw = Math.min(w - bx, bounds.x2 - bounds.x + pad * 2);
  const bh = Math.min(h - by, bounds.y2 - bounds.y + pad * 2);

  ctx.save();
  // Dim everything outside the strip with four rectangles. Filling the whole
  // frame and painting the bright part back over it gives the same picture,
  // but costs a second upload of the source every frame -- which the preview
  // now pays thirty times a second rather than once a reading.
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(0, 0, w, by);
  ctx.fillRect(0, by + bh, w, h - by - bh);
  ctx.fillRect(0, by, bx, bh);
  ctx.fillRect(bx + bw, by, w - bx - bw, bh);

  ctx.strokeStyle = css.getPropertyValue("--accent").trim();
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, bw, bh);

  if (board) {
    const p = 6;
