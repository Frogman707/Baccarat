  else why.push(t("ai.whyMoved", { n: p.n, delta: (p.moved * 100).toFixed(2) }));

  why.push(t("ai.patternRule"));
  // Which reading of the pattern the side came from, where it came from one:
  // its name, and no count -- the reading followed is the one that has been
  // luckiest in this shoe, and its record there would read as an accuracy.
  const l = learned();
  const following = l.trusted && l.nextPick ? null : shoePattern(openShoe().o).following;
  if (following) why.push(t("ai.patternNow", { pattern: t("pattern." + following) }));
  // The last line carries emphasis on the two figures the rule turns on.
  $("aiWhy").innerHTML = why.join(" ");
  $("aiDisclaimer").textContent = t("ai.disclaimer");
}

/** Rendered change since the previous coup, or nothing on the first render. */
let predHistory = null;

/**
 * How far each share moved when the last result landed.
 *
 * Keyed on the corpus revision, so switching language or re-rendering for any
 * other reason keeps showing the move that a coup actually caused rather than
 * blanking it or inventing a new one. A different table starts over: its
 * estimate has nothing to do with the one on screen a moment ago.
 */
function trackPrediction(shares) {
  const same = predHistory
    && predHistory.revision === revision
    && predHistory.table === state.active;
  // `moves` survives a re-render, because the arrows are the state of the
  // estimate and belong on screen until the next coup replaces them. `fresh`
  // does not: it drives the flash, and a flash means "a result just landed" --
  // replaying it when the language or theme changed says that when nothing did.
  if (same) return { moves: predHistory.moves, fresh: false };

  const prior = predHistory && predHistory.table === state.active
    ? predHistory.shares : null;
  const moves = prior
    ? { P: shares.P - prior.P, B: shares.B - prior.B, T: shares.T - prior.T }
    : null;
  predHistory = { revision, table: state.active, shares: { ...shares }, moves };
  return { moves, fresh: !!prior };
}

/** The arrow and size of one move, in points, or an empty cell for no move. */
function deltaChip(delta) {
  const points = (delta || 0) * 100;
  if (!points || Math.abs(points) < 0.0005) return el("span", "d");
  const chip = el("span", "d " + (points > 0 ? "up" : "dn"),
    (points > 0 ? "▲" : "▼") + Math.abs(points).toFixed(3));
  chip.title = t("ai.deltaTitle", { n: (points > 0 ? "+" : "−") + Math.abs(points).toFixed(3) });
  return chip;
}

/**
 * What backing the recommendation actually came to at this table.
 *
 * This block used to show the wager's three outcomes -- wins, loses, push --
 * which are the prediction's own three probabilities relabelled. Printing the
 * same numbers twice under a different heading tells a reader nothing they did
 * not already have two inches higher up.
 *
 * A result is a different thing from a probability. `replayPicks` settles a
 * wager on every coup this table has produced, recomputing the pick each time
 * from the coups before it only, and this shows what that adds up to: units
 * won or lost, how many coups were actually bet, the record, the worst the
 * running total ever got, and which way the picks fell -- which is also the
 * answer to why the recommendation can look stuck on one side.
 */
let ledgerCache = null;
/** The revision this block last flashed for, so a re-render does not re-flash. */
let ledgerFlash = null;
let learnCache = null;
/** The walk itself, kept across coups so it is continued and not re-run. */
const learners = new LearnerShelf();

/**
 * The network's walk through this table, and whether it earned the wheel.
 *
 * Memoised on the corpus the same way the ledger is: it is one pass over every
 * coup the table has, and it only changes when they do.
 */
function learned() {
  if (learnCache && learnCache.revision === revision && learnCache.table === state.active) {
    return learnCache.value;
  }
  const o = observed();
  const deff = Number.isFinite(o.inflate) ? Math.max(1, o.inflate ** 2) : 1;
  // The next coup extends the shoe on the table, which may be an empty one --
  // so it is named rather than taken as "the last sequence walked", which
  // would give the network the wrong shoe's context to answer from.
  // Kept between coups rather than re-trained from scratch each time: the pass
  // only ever moves forward, so a corpus that has gained a coup is continued.
  // Re-training cost three quarters of a second per coup at eight hundred
  // shoes, and got worse with every shoe collected.
  const value = learners.for(state.active ?? "").update(shoes().map((s) => s.o).filter(Boolean),
                               { deff, next: openShoe().o, from: ledgerFrom() });
  // A model is worth following only if what trained it was baccarat. Where the
  // record cannot be one -- a tie rate whole points off what the pack itself
  // fixes -- the network is being rewarded for learning a misreading, and it
  // will look brilliant doing it: a strip counted twice is the most
  // predictable sequence there is. So the trust is withdrawn at the source
  // rather than at the pick, and every panel that reads it agrees.
  const record = tiePlausibility(o.coups, o.ties, deff);
  // And the same withdrawal for a closed shoe longer than a shoe can be. The
  // cut card caps an 8-deck shoe at 86 coups -- 4,000 dealt here, none longer
  // -- so a record holding a longer one is a strip counted twice or two shoes
  // stitched into one, and a network trained on it is learning the join.
  const shape = shoeShape(shoes().filter((s) => s.o.length).map((s) => s.o.length));
  if (record.implausible || shape.long) {
    value.trusted = false;
    value.reason = "record";
  }
  value.record = record;
  value.shape = shape;
  learnCache = { revision, table: state.active, value };
  return value;
}

function ledger() {
  const from = shownFrom();
  if (ledgerCache && ledgerCache.revision === revision && ledgerCache.table === state.active
      && ledgerCache.from === from) {
    return ledgerCache.value;
  }
  // The block is the record of backing the recommendation, so it has to settle
  // whichever pick the recommendation is actually made of. Settling the base
  // rule while the panel above recommended the network's pick put two
  // different wagers on one screen: it would say Banker, Banker would win, and
  // the coup would be recorded as a loss because the rule being settled had
  // picked Player.
  const l = learned();
  const o = observed();
  const deff = Number.isFinite(o.inflate) ? Math.max(1, o.inflate ** 2) : 1;
  const sequences = shoes().map((s) => s.o).filter(Boolean);
  let value;
  if (l.trusted) {
    // The network is judged from the mark; the screen may count less of it.
    value = from === ledgerFrom() ? l.model
      : learners.for(state.active ?? "").settle(sequences, { deff, from }).model;
  } else {
    value = replayPicks(sequences, { deff, from });
  }
  ledgerCache = { revision, table: state.active, from, value };
  return value;
}

function renderBetOutcome() {
  const o = observed();
  const r = ledger();
  // A flash marks a coup landing, so it fires when this table's corpus moved
  // -- not on a re-render for a language or theme change, and not on arriving
  // at a table whose last coup happened an hour ago.
  const moved = ledgerFlash !== null
    && ledgerFlash.table === state.active
    && ledgerFlash.revision !== revision
    // A coup the reader filed on the table it is watching moves that table,
    // not this one; the revision is global, so it has to be asked whose. The
    // unsaved sheet's name is null, so undefined is "nothing written yet".
    && (lastWrite === undefined || lastWrite === state.active);
  ledgerFlash = { revision, table: state.active };
  const grid = $("aiLedger"), note = $("aiOverallNote"), sub = $("aiOverallSub");
  grid.innerHTML = "";
  $("aiOverallH").textContent = t("ai.betH");

  // Each control says what pressing it would do, which is the opposite of the
  // state it is in: a table already counting from a mark offers to stop, and
  // a block counting the shoe offers the table. The mark is the whole table's
  // business, so it is offered only there; and where the table is nothing but
  // this shoe the two counts are one, and the choice is not offered at all.
  const byShoe = ledgerScope === "shoe";
  const before = shoeStart();
  const mark = ledgerFrom();
  const marked = mark > 0;
  $("ledgerScope").textContent = byShoe ? t("ai.scopeTable") : t("ai.scopeShoe");
  $("ledgerScope").hidden = byShoe && !before;
  $("ledgerFrom").textContent = marked ? t("ai.countFromAll") : t("ai.countFromHere");
  $("ledgerFrom").hidden = byShoe || (!marked && !tableCoups());

  // Nothing counted, rather than nothing bet: a shoe that opens on a tie has
  // a coup the casino's screen counts, and its stake came back -- which is a
  // row of this block, not an empty one.
  if (!r.coups) {
    $("aiOutcomes").innerHTML = "";
    // Cleared as well as hidden: leaving the previous table's coup in the DOM
    // is a stale value waiting to be read by something that does not check.
    $("aiLast").hidden = true;
    $("aiLast").innerHTML = "";
    // Empty because the table is, because the shoe has only just begun, or
    // because the tally was just zeroed: those are different states and the
    // reader cannot tell them apart from a blank block.
    if (byShoe) {
      sub.textContent = t("ai.betSubShoeEmpty");
      note.innerHTML = t("ai.betNoteEmpty");
      return;
    }
    sub.textContent = marked
      ? t("ai.betSubEmptyFrom", { n: (mark + 1).toLocaleString() })
      : t("ai.betSubEmpty");
    note.innerHTML = marked
      ? t("ai.betNoteEmptyFrom", { n: (mark + 1).toLocaleString(),
                                   before: mark.toLocaleString() })
      : t("ai.betNoteEmpty");
    return;
  }
  sub.textContent = byShoe
    ? t("ai.betSubShoe", { coups: r.coups.toLocaleString() })
    : marked
    ? t("ai.betSubFrom", { n: (mark + 1).toLocaleString(), coups: r.coups.toLocaleString() })
    : t("ai.betSub", { shoes: o.shoes, coups: o.coups.toLocaleString() });

  // How the replay's coups actually fell, with what each one paid. These are
  // counts of real coups, not the prediction's probabilities relabelled: the
  // three shares partition every coup, ties included, so they sum to one.
  const outcomes = $("aiOutcomes");
  outcomes.innerHTML = "";
  // Coloured by what the bet did, not by which side won it: the replay backs
  // Banker on some coups and Player on others, so a row here is a mix of both
  // and cannot carry either side's colour honestly.
  const bars = [
    { kind: "win", n: r.wins, pay: "+" + (1 - BANKER_COMMISSION).toFixed(2) },
    { kind: "lose", n: r.losses, pay: "\u22121.00" },
    { kind: "push", n: r.pushes, pay: t("ai.betReturned") },
  ];
  // The row this coup landed on is lit, the same way the estimate above is:
  // the block is a running total, and a total that moves without saying which
  // way it moved leaves a reader counting digits to find out.
  for (const bar of bars) {
    const landed = moved && r.last && r.last.kind === bar.kind;
    const row = el("div", "aibar bet " + bar.kind + (landed ? " landed" : ""));
    const name = el("span", "n", t("ai.bet." + bar.kind));
    name.appendChild(el("small", null, bar.pay));
    row.appendChild(name);
    const track = el("div", "track");
    const fill = el("i");
    // The same 0.5 full-scale the prediction uses, so a bar here can be read
    // against the one above it -- which is the comparison worth making now
    // that these are outcomes rather than a copy of that forecast.
    fill.style.width = Math.min(100, (bar.n / r.coups / 0.5) * 100) + "%";
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("span", "p" + (landed ? " bump" : ""), pct(bar.n / r.coups, 2)));
    row.appendChild(el("span", "c", t("ai.ledgerCoups", { n: bar.n.toLocaleString() })));
    outcomes.appendChild(row);
  }

  const signed = (x, d = 2) => (x >= 0 ? "+" : "\u2212") + Math.abs(x).toFixed(d);

  // The coup just settled, spelled out. Everything else in this block is a
  // total over the shoe or the table, so none of it answers the one question
  // a reader has when a result lands: what did that do?
  const lastRow = $("aiLast");
  if (r.last) {
    lastRow.hidden = false;
    lastRow.className = "ailast " + r.last.kind;
    lastRow.innerHTML = "";
    lastRow.appendChild(el("span", "k", t("ai.lastH")));
    const v = el("span", "v");
    v.appendChild(el("b", null, t("ai.lastPlay", {
      pick: side(r.last.pick), came: side(r.last.outcome),
    })));
    // Two coups running can settle identically, and then the line reads the
    // same twice over -- so what says a result landed is the flash, not the
    // text. The element is rebuilt each render, which is what restarts it.
    v.appendChild(el("i", moved ? "bump" : null, r.last.kind === "push"
      ? t("ai.betReturned")
      : signed(r.last.paid) + t("ai.unit")));
    lastRow.appendChild(v);
  } else {
    lastRow.hidden = true;
  }

  const rows = [
    { k: t("ai.ledgerUnits"), v: signed(r.units) + t("ai.unit"), good: r.units >= 0,
      sub: t("ai.ledgerPerBet", { n: signed(r.perBet * 100) + "%",
                                  bets: r.bets.toLocaleString(), rate: pct(r.winRate, 2) }) },
    // The high-water mark, not the low one: paired with the deepest fall from a
    // peak it says how far the run swung, where the running low is often just
    // zero and repeats the drawdown besides.
    //
    // It and the split are the full view's: the guest's keeps the total, which
    // is the one that says what backing the pick has come to.
    { k: t("ai.ledgerDrawdown"), v: signed(r.drawdown) + t("ai.unit"),
      good: r.drawdown >= 0, full: true,
      sub: t("ai.ledgerPeak", { n: signed(r.best) }) },
    { k: t("ai.ledgerSplit"),
      v: t("ai.ledgerSplitValue", { b: r.bankerBets.toLocaleString(),
                                    p: r.playerBets.toLocaleString() }),
      sub: t("ai.ledgerSplitSub"), full: true },
  ];
  for (const row of rows) {
    const line = el("div", "aifact");
    if (row.full) line.setAttribute("data-full-only", "");
    line.appendChild(el("span", "k", row.k));
    const v = el("span", "v" + (row.good === false ? " neg" : ""), row.v);
    if (row.sub) v.appendChild(el("small", null, row.sub));
    line.appendChild(v);
    grid.appendChild(line);
  }

  note.innerHTML = byShoe
    ? t("ai.betNoteShoe", { coups: r.coups.toLocaleString() })
      + (before ? t("ai.betNoteEarlier", { before: before.toLocaleString() }) : "")
    : marked
    ? t("ai.betNoteFrom", { n: (mark + 1).toLocaleString(),
                            before: mark.toLocaleString() })
      + " " + t("ai.betNote", { coups: r.coups.toLocaleString() })
    : t("ai.betNote", { coups: r.coups.toLocaleString() });
}

/* ---------------------------------------------------------------- render */

/**
 * The network's record, beside the estimate's, on the same coups.
 *
 * Both numbers are walk-forward: every pick was made from the coups before the
 * one it was settled on. Printing them side by side is the point -- a win rate
 * on its own says nothing here, because always backing Banker wins about half
 * of everything without looking at the board at all.
 */
/**
 * The record of what was actually recommended, scored.
 *
 * Four figures and a sentence, and the sentence is the one that matters: a hit
 * rate on its own is unreadable here, because always naming the more common
 * side scores about 51% and knows nothing. So the gap to that rule, on exactly
 * the same coups, is what is put in bold -- with its own standard error beside
 * it, because a gap smaller than its error is a run of luck being read as a
 * finding, and that is the single most common way a record like this is
 * misread.
 */
function renderVerification() {
  const name = state.active;
  const s = scorePredictions(predictionLog, name);
  const grid = $("verifyKpis"), verdict = $("verifyVerdict"), rows = $("verifyRecent");

  $("verifyCount").textContent = s.n
    ? t("verify.count", { n: s.settled.toLocaleString(), pending: s.pending.toLocaleString() })
    : "";

  grid.innerHTML = "";
  rows.innerHTML = "";
  if (!s.decided) {
    verdict.className = "aiverdict";
    verdict.textContent = t("verify.none");
    return;
  }

  // The gap's error, from the coups it was measured on: see `edgeError`.
  const se = s.edgeError;
  const gap = s.edge;

  const tile = (k, v, sub, cls) => {
    const d = el("div", "vt");
    d.appendChild(el("div", "k", k));
    d.appendChild(el("div", "v" + (cls ? " " + cls : ""), v));
    if (sub) d.appendChild(el("div", "s", sub));
    grid.appendChild(d);
  };
  tile(t("verify.hitRate"), pct(s.accuracy, 2), t("verify.decided", { n: s.decided.toLocaleString() }));
  // Coloured by the call below, not by the error alone: a gap one error up is
  // where a recommendation with no edge spends a tenth of its looks.
  tile(t("verify.vsBanker"), (gap >= 0 ? "+" : "−") + pct(Math.abs(gap), 2),
       "±" + pct(se, 2), s.call === "ahead" ? "up" : s.call === "behind" ? "down" : "");
  tile(t("verify.logLoss"), s.meanLogLoss.toFixed(4), t("verify.lower"));
  tile(t("verify.brier"), s.meanBrier.toFixed(4), t("verify.lower"));
  if (Number.isFinite(s.calibrationError)) {
    // With what luck alone would show beside it: a hundred coups of perfectly
    // stated probabilities read about four points out.
    tile(t("verify.calib"), pct(s.calibrationError, 1),
         t("verify.calibSub", { noise: pct(s.calibrationNoise, 1) }));
  }

  verdict.className = "aiverdict";
  verdict.innerHTML = t("verify.verdict", {
    n: s.decided.toLocaleString(),
    acc: pct(s.accuracy, 2),
    base: pct(s.baseline, 2),
    gap: (gap >= 0 ? "+" : "−") + pct(Math.abs(gap), 2),
    se: pct(se, 2),
    call: t({ ahead: "verify.callAhead", behind: "verify.callBehind",
              tooFew: "verify.callFew", noise: "verify.callNoise" }[s.call], {
      n: s.against.toLocaleString(), z: s.z.toFixed(2), bar: s.bar.toFixed(2),
    }),
  });

  const table = el("table");
  const head = el("tr");
  for (const key of ["verify.colHand", "verify.colPick", "verify.colActual",
                     "verify.colConf", "verify.colModel"]) {
    head.appendChild(el("th", null, t(key)));
  }
  table.appendChild(head);
  for (const e of recentPredictions(predictionLog, name, 24)) {
    const tr = el("tr");
    tr.appendChild(el("td", null, String(e.i + 1)));
    tr.appendChild(el("td", null, side(e.k)));
    const settled = !!e.r;
    const hit = settled && e.r === e.k;
    tr.appendChild(el("td", settled ? (e.r === "T" ? "wait" : hit ? "hit" : "miss") : "wait",
                      settled ? side(e.r) : t("verify.pendingRow")));
    // The panel's own words for it, not the stored 0-100: a column of "67"
    // beside a pick reads as a 67% chance of winning, where it means the
    // estimate sat two standard errors from the crossover -- for a side that
    // comes in about half the time. The cut-offs are the panel's, z 1 and 2.
    tr.appendChild(el("td", null,
      t("ai.conf." + (e.c >= 67 ? "high" : e.c >= 33 ? "medium" : "low"))));
    tr.appendChild(el("td", null, e.m));
    table.appendChild(tr);
  }
  rows.appendChild(table);
}

function renderLearned() {
  const l = learned();
  const rows = $("learnRows"), verdict = $("learnVerdict");
  $("learnTrained").textContent = l.decided
    ? t("learn.trained", { n: l.decided.toLocaleString() }) : "";
  rows.innerHTML = "";

  if (!l.model.bets) {
    verdict.className = "aiverdict";
    verdict.textContent = t("learn.waiting");
    return;
  }

  const signed = (x) => (x >= 0 ? "+" : "\u2212") + Math.abs(x).toFixed(2);
  for (const [key, book, picked] of [
    [t("learn.model"), l.model, l.trusted],
    [t("learn.base"), l.base, !l.trusted],
  ]) {
    const row = el("div", "aifact" + (picked ? " picked" : ""));
    row.appendChild(el("span", "k", key));
    const v = el("span", "v" + (book.units < 0 ? " neg" : ""),
      pct(book.winRate, 2));
    v.appendChild(el("small", null, signed(book.units) + t("ai.unit")));
    row.appendChild(v);
    rows.appendChild(row);
  }
  const split = el("div", "aifact");
  split.appendChild(el("span", "k", t("learn.split")));
  split.appendChild(el("span", "v", l.split.toLocaleString()));
  rows.appendChild(split);

  const z = l.z.toFixed(2);
  verdict.className = "aiverdict" + (l.trusted ? " on" : "");
  verdict.innerHTML =
    l.reason === "record" ? t("learn.record")
    : l.reason === "ahead" ? t("learn.usingModel", { lead: signed(l.lead), z })
    : l.reason === "noise" ? t("learn.noise", { z, bar: l.bar.toFixed(2) })
    : l.reason === "tooFew" ? t("learn.tooFew", { n: l.split.toLocaleString() })
    : t("learn.behind");
}

/** The interval options carry a number, so their labels are built not stored. */
function renderLiveIntervals() {
  for (const option of $("liveInterval").options) {
    option.textContent = t("live.every", { n: Number(option.value) / 1000 });
  }
}

/** Everything a language change has to redraw. `applyDom` handles the markup;
 *  these are the views this file renders itself. */
function renderAll() {
  renderLiveIntervals();
  renderLiveSources();
  render();
  if (live) live._emit();
  if (lastReport) renderIntegrityResult(lastReport);
  applyView();
}

function render() {
  renderHeader();
  renderLiveBinding();
  renderPrediction();
  renderKpis();
  renderScale();
  renderStake();
  renderLastResult();
  renderBoard();
  renderShoes();
  renderMilestones();
  renderIntegrityAvailability();
  // Some of the folded paragraphs are written by the renders above, and a
  // paragraph that fitted before this coup may not after it.
  foldExplanations();
}

function renderHeader() {
  const sel = $("tableSel");
  sel.innerHTML = "";
  // A blank entry, always. It is what is shown while there is no table -- a
  // name nobody chose would be worse -- and it is also the way back out of one:
  // offering it only when nothing was selected meant a table could be entered
  // and never left, so putting a phone down on a table you are no longer at
  // left its name standing over an empty board.
  // Empty rather than a word. "No table" was the only entry that described
  // itself instead of naming something, which made it read as a table called
  // that -- and a blank line is what "none of these" looks like in a list of
  // names. The select carries its own label for a screen reader.
  const blank = el("option", null, "");
  blank.value = "";
  blank.selected = !state.active || !state.tables[state.active];
  sel.appendChild(blank);
  for (const name of Object.keys(state.tables)) {
    const o = el("option", null, name);
    o.value = name;
    if (name === state.active) o.selected = true;
    sel.appendChild(o);
  }
  const shoe = openShoe();
  // With the tally beside it, because that is the one figure the table itself
  // also puts on screen. Reading "37" against the casino's "#37 B18 P16 T3"
  // says the count agrees and nothing more; reading the whole tally against it
  // says the reader is looking at the right board.
  const tally = { b: 0, p: 0, t: 0 };
  for (const o of shoe.o) tally[o === "B" ? "b" : o === "P" ? "p" : "t"] += 1;
  // The guest's view leaves out how many shoes the device has collected: that
  // is a question about the record, and the tally is the one about the table.
  $("shoeMeta").textContent = (viewNow === "full"
    ? t("header.shoeMeta", {
        shoes: shoes().filter((s) => s.o.length).length, coups: shoe.o.length,
      })
    : t("header.shoeMetaShort", { coups: shoe.o.length }))
    + (shoe.o.length ? " · " + t("header.shoeTally", tally) : "")
    // The blank entry keeps nothing, which is worth saying once it holds
    // something or is being read onto -- not on a page nobody has started, and
    // not while the reader is filling a table (that one is kept).
    + (!chosenTable() && (tableCoups() > 0 || (live && live.active && !liveTable))
      ? " · " + t("header.unsaved") : "");
}

/**
 * The uncertainty on the Banker share: the interval itself, both ends printed.
 *
 * It used to be a half-width, `q +- 1.96 se`, which had to go because at q = 1
 * that standard error is zero -- a table thirty Bankers into a run was quoted
 * as "100.00% +-0.00pp", a claim of certainty from thirty coups. The interval
 * behind it is Wilson's now and does not collapse.
 *
 * A half-width cannot express that interval, though, because Wilson's is not
 * centred on the share: those same thirty coups give 88.65%-100.00%, whose
 * half-width of 5.68pp sits about a centre of 94.32%. Printing "100.00%
 * +-5.68pp" asks the reader to reconstruct bounds that run past 100% at one
 * end and stop six points short of the observation at the other -- neither of
 * which is what the scale below draws.
 *
 * Quoting the half-width only where it happens to be exact was tried and is
 * worse: the two forms cross over wherever the skew rounds to the last digit
 * printed, and a table watched through that band changed form nineteen times
 * in nine hundred coups, twice inside three. So both ends, always. It is the
 * form the verdict below the scale already uses, and now the tile and that
 * sentence quote one interval in one set of words.
 */
function shareSub(o) {
  return t("state.bankerShareRange", {
    lo: pct(o.lo, 2), hi: pct(o.hi, 2), n: o.n.toLocaleString(),
  });
}

function renderKpis() {
  const o = observed();
  const held = shoes().filter((s) => s.o.length).map((s) => s.o);
  // What these coups can detect, not what as many whole shoes could.
  const bias = detectableBias(wholeShoes(held));
  const shape = shoeShape(held.map((s) => s.length));
  const tiles = [
    {
      k: t("state.shoes"), v: o.shoes.toLocaleString(),
      // With the length beside the count, because the length is the one figure
      // that says whether these are shoes. A full 8-deck shoe is 75 to 86
      // coups and almost nothing else; a table reporting eighteen is reporting
      // fragments, and the count alone hides that behind a bigger number.
      s: shape.counted
        ? t("state.coupsPerShoe", { n: o.coups.toLocaleString(), avg: shape.mean.toFixed(0) })
        : t("state.coups", { n: o.coups.toLocaleString() }),
    },
    {
      k: t("state.bankerShare"), v: o.n ? pct(o.q, 2) : "—",
      s: o.n ? shareSub(o) : t("state.noCoups"),
    },
    {
      k: t("state.detectable"), v: o.shoes ? pct(bias, 2) : "—",
      s: !o.shoes ? t("state.pending")
        : bias <= BANKER_BREAKEVEN_GAP ? t("state.detectableTight")
        : t("state.detectableLoose", { gap: pct(BANKER_BREAKEVEN_GAP, 2) }),
    },
    (() => {
      const gap = (BANKER_BREAKEVEN - (o.q ?? 0)) * 100;
      return {
        k: t("state.toBreakeven"), v: o.n ? `${gap >= 0 ? "+" : ""}${gap.toFixed(2)}%p` : "—",
        s: !o.n ? t("state.pendingCoups")
          : gap >= 0 ? t("state.toBreakevenShort") : t("state.toBreakevenPast"),
      };
    })(),
  ];
  const box = $("kpis");
  box.innerHTML = "";
  for (const t of tiles) {
    const d = el("div", "tile");
    d.appendChild(el("div", "k", t.k));
    d.appendChild(el("div", "v", t.v));
    d.appendChild(el("div", "s", t.s));
    box.appendChild(d);
  }

  // A shoe longer than a shoe first, because that one is not a judgement call:
  // the cut card caps an 8-deck shoe at 86 coups, so a longer record is one
  // strip counted twice. Then the fragments, said rather than adjudicated --
  // joining a table mid-shoe shortens a record honestly, and only the person
  // collecting it knows which of the two it was.
  const note = $("shoeShape");
  const fragmentary = shape.counted >= 5 && shape.mean < SHOE_MIN * 0.6;
  note.hidden = !(shape.long || fragmentary);
  note.innerHTML = shape.long
    ? t("state.overlong", { n: shape.long })
    : fragmentary
      ? t("state.fragments", {
          closed: shape.counted, avg: shape.mean.toFixed(0), whole: shape.whole,
        })
      : "";
}

/**
 * The break-even scale: two lines a wager has to clear, the dead band between
 * them, where a fresh shoe sits, and where this table's own measurement sits
 * with its interval. Everything this project measured is legible here at once.
 */
/**
 * Is there enough here to draw an interval that means anything?
 *
 * The scale plots the raw observed share and its confidence interval, not the
 * shrunk estimate -- shrinking toward a fair shoe is exactly what would stop
 * this drawing from ever flagging a table, which is its job. Raw intervals
 * need guarding instead: the standard error is zero while every coup has gone
 * the same way, which would draw a point with no width at all.
 *
 * So: both sides seen, and enough coups that the arithmetic is not a joke.
 * Ten is early -- the interval spans most of the axis and gets clamped -- but
 * a wide bar visibly narrowing as coups arrive is the honest picture, and it
 * cannot flag anything while it is that wide.
 */
const MIN_INTERVAL_COUPS = 10;
const hasInterval = (o) => o.n >= MIN_INTERVAL_COUPS && o.banker > 0 && o.player > 0;

/* ------------------------------------------------------- stake and horizon */

/** What the form is set to, kept per browser rather than per table. */
const STAKE_KEY = "baccarat.stake";
const STAKE_FIELDS = {
  stakeBankroll: { def: 1000000, min: 0 },
  stakeUnit: { def: 10000, min: 0 },
  stakeRate: { def: 120, min: 1 },          // hands an hour on a speed table
  stakeHours: { def: 4, min: 0 },
  stakeDays: { def: 20, min: 0 },
};

function stakeSettings() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STAKE_KEY) || "{}") || {}; } catch { /* none */ }
  const out = {};
  for (const [id, spec] of Object.entries(STAKE_FIELDS)) {
    const v = Number(saved[id]);
    out[id] = Number.isFinite(v) && v >= spec.min ? v : spec.def;
  }
  return out;
}

function saveStakeSettings(s) {
  try { localStorage.setItem(STAKE_KEY, JSON.stringify(s)); } catch { /* private mode */ }
}

/**
 * The projection, in money and in time.
 *
 * Reads the same posterior the recommendation reads, so the two cannot drift:
 * the side is whichever this table's estimate favours, and the per-hand figure
 * is that side's edge rather than a number typed in here.
 */
/** What it would take to move the confidence, in coups. */
function confidenceDistance(o, pick) {
  if (!o.n) return "";
  const need = coupsForConfidence(o, pick);
  if (need === null) return t("ai.confNever");
  if (need === 0) return t("ai.confReached");
  return t("ai.confNeed", { n: need.toLocaleString() });
}

function renderStake() {
  // Before the first coup there is no estimate of this table to put money
  // against. The settings stay, so a plan can be written first; the sums wait.
  const idle = notStarted();
  $("stakeTable").hidden = idle;
  if (idle) {
    const v = $("stakeVerdict");
    v.className = "aiverdict";
    v.textContent = t("stake.idle");
    $("stakeNote").textContent = t("stake.note");
    return;
  }
  const p = predict();
  const cfg = stakeSettings();
  const side_ = edges(p.q, p.tie).B >= edges(p.q, p.tie).P ? "B" : "P";
  const perDay = cfg.stakeRate * cfg.stakeHours;
  const proj = projectStake({
    q: p.q, tieP: p.tie, side: side_, unit: cfg.stakeUnit,
    bankroll: cfg.stakeBankroll, handsPerDay: perDay, daysPerMonth: cfg.stakeDays,
  });

  const money = (x) => (x >= 0 ? "+" : "\u2212") + Math.round(Math.abs(x)).toLocaleString();
  const head = $("stakeTable").tHead;
  head.innerHTML = "";
  const hr = el("tr");
  for (const k of ["stake.colWhen", "stake.colHands", "stake.colMean",
                   "stake.colRange", "stake.colOf"]) hr.appendChild(el("th", null, t(k)));
  head.appendChild(hr);

  const body = $("stakeTable").tBodies[0];
  body.innerHTML = "";
  for (const [key, row] of [["stake.rowHand", proj.hand], ["stake.rowDay", proj.day],
                            ["stake.rowMonth", proj.month]]) {
    const tr = el("tr");
    tr.appendChild(el("td", null, t(key)));
    tr.appendChild(el("td", "m", row.hands.toLocaleString()));
    tr.appendChild(el("td", "m" + (row.mean < 0 ? " neg" : ""), money(row.mean)));
    tr.appendChild(el("td", "m", `${money(row.lo)} \u2026 ${money(row.hi)}`));
    tr.appendChild(el("td", "m" + (row.ofBankroll < 0 ? " neg" : ""),
      row.ofBankroll === null ? "\u2014" : pct(row.ofBankroll, 1)));
    body.appendChild(tr);
  }

  const needDays = perDay > 0 ? Math.ceil(proj.breakEvenHands / perDay) : 0;
  const v = $("stakeVerdict");
  v.className = "aiverdict" + (proj.perHand > 0 ? " flag" : "");
  v.innerHTML = t(proj.perHand > 0 ? "stake.verdictWin" : "stake.verdictLose", {
    side: side(side_), unit: Math.round(cfg.stakeUnit).toLocaleString(),
    hands: proj.month.hands.toLocaleString(), mean: money(proj.month.mean),
    lo: money(proj.month.lo), hi: money(proj.month.hi),
    need: proj.breakEvenHands.toLocaleString(), needDays: needDays.toLocaleString(),
  });
  $("stakeNote").textContent = t("stake.note");
}

/**
 * Let the viewer draw the region themselves.
 *
 * The reader has two ways of finding the roads on its own -- by their marks,
 * and by the ruling they are printed on -- and both are inferences about a
 * screen neither the code nor its author has ever seen. This is the one that
 * is not an inference. Drag a box around the strip and that is the region,
 * permanently: no search, no re-check, nothing to lose at a shoe change.
 *
 * The preview is a canvas painted at the reader's own working resolution and
 * then scaled by CSS to fit the page, so a box drawn in page pixels has to be
 * carried back through that scale. Getting it wrong is invisible on a screen
 * shared at the same size as the canvas and badly wrong on any other, which is
 * why the ratio is taken from the canvas itself every time rather than cached.
 */
function bindRegionPicker() {
  const canvas = $("liveCanvas"), hint = $("livePickHint"), button = $("livePick");
  let from = null;

  const toFrame = (event) => {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    return {
      x: (event.clientX - rect.left) * (canvas.width / rect.width),
      y: (event.clientY - rect.top) * (canvas.height / rect.height),
    };
  };

  const setPicking = (on) => {
    livePicking = on;
    from = null;
    canvas.classList.toggle("picking", on);
    hint.hidden = !on;
    button.textContent = t(on ? "live.picking" : "live.pick");
  };

  button.onclick = () => {
    if (live.pinned === "manual") { live.unpin(); livePinned = null; setPicking(false); return; }
    setPicking(!livePicking);
  };

  canvas.addEventListener("pointerdown", (e) => {
    if (!livePicking) return;
    from = toFrame(e);
    if (from) { canvas.setPointerCapture(e.pointerId); e.preventDefault(); }
  });

  canvas.addEventListener("pointerup", (e) => {
    if (!livePicking || !from) return;
    const start = from, to = toFrame(e);
    from = null;
    if (!to) return;
    // Drawn from any corner, kept as a box. A stray click is not a region, so
    // anything smaller than a mark is treated as a miss rather than obeyed --
    // `pinRegion` says no and the picker stays open for another try.
    const box = {
      x: Math.round(Math.min(start.x, to.x)), y: Math.round(Math.min(start.y, to.y)),
      w: Math.round(Math.abs(to.x - start.x)), h: Math.round(Math.abs(to.y - start.y)),
    };
    if (live.pinRegion(box)) setPicking(false);
  });
}

function bindStake() {
  const cfg = stakeSettings();
  for (const id of Object.keys(STAKE_FIELDS)) {
    const input = $(id);
    input.value = String(cfg[id]);
    input.oninput = () => {
      const spec = STAKE_FIELDS[id];
      const v = Number(input.value);
      const next = { ...stakeSettings(), [id]: Number.isFinite(v) && v >= spec.min ? v : spec.def };
      saveStakeSettings(next);
      renderStake();
    };
  }
}

/**
 * The theme's colours, as the drawings bake them into their markup.
 *
 * Read off the root's computed style, which the browser has to bring up to
 * date before it can answer -- after a render's changes, a style pass over the
 * whole page, twice a coup. They change only with the theme, so each is read
 * once per theme and kept, and let go when the theme changes, or the system's
 * light or dark that the automatic theme follows.
 */
const themeColours = new Map();
function themeColour(name) {
  let v = themeColours.get(name);
  if (v === undefined) {
    v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    themeColours.set(name, v);
  }
  return v;
}

function renderScale() {
  const LO = 0.488, HI = 0.532, W = 720, H = 168;
  const x = (q) => ((q - LO) / (HI - LO)) * (W - 90) + 45;
  const o = observed();
  const svg = $("scale");
  const C = themeColour;

  // One row of the drawing per thing being said, top to bottom: this table,
  // the fresh-shoe reference, the zones, then the two break-even lines.
  const yObsLabel = 15, yObs = 30, yFreshLabel = 53, yBand = 64, hBand = 26;
  const yTickTop = 60, yTickBottom = 108, yTickLabel = 123, ySubLabel = 137;

  const p = [];
  p.push(`<rect x="${x(LO)}" y="${yBand}" width="${x(PLAYER_BREAKEVEN) - x(LO)}" height="${hBand}" fill="${C("--zone")}" rx="2"/>`);
  p.push(`<rect x="${x(BANKER_BREAKEVEN)}" y="${yBand}" width="${x(HI) - x(BANKER_BREAKEVEN)}" height="${hBand}" fill="${C("--zone")}" rx="2"/>`);
  p.push(`<rect x="${x(PLAYER_BREAKEVEN)}" y="${yBand}" width="${x(BANKER_BREAKEVEN) - x(PLAYER_BREAKEVEN)}" height="${hBand}" fill="${C("--dead")}" stroke="${C("--line-2")}"/>`);
  p.push(`<text x="${(x(PLAYER_BREAKEVEN) + x(BANKER_BREAKEVEN)) / 2}" y="${yBand + 17}" text-anchor="middle" font-size="11.5" fill="${C("--ink-2")}">${t("scale.deadBand")}</text>`);
  p.push(`<text x="${x(LO) + 4}" y="${yBand + 17}" font-size="11" fill="${C("--ink-3")}">${t("scale.playerProfit")}</text>`);
  p.push(`<text x="${x(HI) - 4}" y="${yBand + 17}" font-size="11" text-anchor="end" fill="${C("--ink-3")}">${t("scale.bankerProfit")}</text>`);

  for (const [q, label, sub] of [[PLAYER_BREAKEVEN, "50.000%", t("scale.playerBreakeven")],
                                 [BANKER_BREAKEVEN, "51.282%", t("scale.bankerBreakeven")]]) {
    p.push(`<line x1="${x(q)}" y1="${yTickTop}" x2="${x(q)}" y2="${yTickBottom}" stroke="${C("--ink-2")}" stroke-width="1.2"/>`);
    p.push(`<text x="${x(q)}" y="${yTickLabel}" text-anchor="middle" font-size="11.5" class="m" fill="${C("--ink")}">${label}</text>`);
    p.push(`<text x="${x(q)}" y="${ySubLabel}" text-anchor="middle" font-size="10.5" fill="${C("--ink-3")}">${sub}</text>`);
  }

  p.push(`<line x1="${x(BASE_BANKER_SHARE)}" y1="${yBand - 3}" x2="${x(BASE_BANKER_SHARE)}" y2="${yBand + hBand + 3}" stroke="${C("--ink-3")}" stroke-width="1" stroke-dasharray="3 3"/>`);
  p.push(`<text x="${x(BASE_BANKER_SHARE)}" y="${yFreshLabel}" text-anchor="middle" font-size="10.5" fill="${C("--ink-3")}">${t("scale.freshShoe")}</text>`);

  // The same test the badge beside the pick is held to, so the two never say
  // different things about one table: past a break-even line counting every
  // reading, not only this one. See `backingCleared`.
  const cleared = backingCleared(o.n, o.q, Math.max(1, (o.inflate ?? 1) ** 2));

  if (hasInterval(o)) {
    const clears = cleared.B || cleared.P;
    const col = clears ? C("--accent") : C("--ink");
    const clamp = (q) => Math.min(HI, Math.max(LO, q));
    const off = o.q > HI || o.q < LO;

    p.push(`<line x1="${x(clamp(o.lo))}" y1="${yObs}" x2="${x(clamp(o.hi))}" y2="${yObs}" stroke="${col}" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>`);
    for (const q of [o.lo, o.hi]) {
      if (q < LO || q > HI) continue;                      // a whisker end past the axis has no tick
      p.push(`<line x1="${x(q)}" y1="${yObs - 5}" x2="${x(q)}" y2="${yObs + 5}" stroke="${col}" stroke-width="2"/>`);
    }
    const cx = x(clamp(o.q));
    p.push(off
      ? `<path d="${o.q > HI ? `M${cx - 6} ${yObs - 5.5} L${cx + 2} ${yObs} L${cx - 6} ${yObs + 5.5} Z`
                             : `M${cx + 6} ${yObs - 5.5} L${cx - 2} ${yObs} L${cx + 6} ${yObs + 5.5} Z`}" fill="${col}"/>`
      : `<circle cx="${cx}" cy="${yObs}" r="5.5" fill="${col}" stroke="${C("--surface")}" stroke-width="2"/>`);

    // Keep the label inside the drawing whichever end the value sits at.
    const lx = Math.min(W - 10, Math.max(10, cx));
    const anchor = lx > W - 110 ? "end" : lx < 110 ? "start" : "middle";
    const text = t("scale.thisTable", { q: pct(o.q, 2) }) + (off ? t("scale.offAxis") : "");
    p.push(`<text x="${lx}" y="${yObsLabel}" text-anchor="${anchor}" font-size="11.5" class="m" fill="${col}">${text}</text>`);
  } else {
    p.push(`<text x="${W / 2}" y="${yObsLabel}" text-anchor="middle" font-size="11.5" fill="${C("--ink-3")}">${t("scale.waiting")}</text>`);
  }
  p.push(`<text x="${W / 2}" y="${H - 5}" text-anchor="middle" font-size="10.5" fill="${C("--ink-3")}">${t("scale.axis")}</text>`);

  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = p.join("");

  const e = edges(BASE_BANKER_SHARE, BASE_TIE);
  const note = $("scaleNote");
  if (notStarted()) {
    note.className = "verdict neutral";
    note.textContent = t("scale.idle");
  } else if (!hasInterval(o)) {
    note.className = "verdict neutral";
    note.innerHTML = t("scale.verdictWaiting", { eb: pct(e.B, 3), ep: pct(e.P, 3), n: o.n });
  } else if (cleared.B) {
    note.className = "verdict flag";
    note.innerHTML = t("scale.verdictBanker", { lo: pct(o.lo, 2), hi: pct(o.hi, 2) });
  } else if (cleared.P) {
    note.className = "verdict flag";
    note.innerHTML = t("scale.verdictPlayer", { lo: pct(o.lo, 2), hi: pct(o.hi, 2) });
  } else if (o.lo > BANKER_BREAKEVEN || o.hi < PLAYER_BREAKEVEN) {
    // The interval clears a line at this reading and the share has not
    // cleared it counting every reading: measured, the case an honest table
    // was called "unusual" in at some point four times in ten.
    const up = o.lo > BANKER_BREAKEVEN;
    const need = up ? cleared.bankerAbove : cleared.bankerBelow;
    note.className = "verdict neutral";
    note.innerHTML = t(need > 1 || need < 0 ? "scale.verdictRelookFew" : "scale.verdictRelook", {
      q: pct(o.q, 2), lo: pct(o.lo, 2), hi: pct(o.hi, 2), n: o.n.toLocaleString(),
      line: up ? t("side.B") : t("side.P"),
      need: pct(need, 2), dir: t(up ? "scale.above" : "scale.below"),
    });
  } else if (o.q >= PLAYER_BREAKEVEN && o.q <= BANKER_BREAKEVEN) {
    note.className = "verdict neutral";
    note.innerHTML = t("scale.verdictDead", { q: pct(o.q, 2), lo: pct(o.lo, 2), hi: pct(o.hi, 2) });
  } else {
    // The share itself has cleared a break-even line but the interval around
    // it has not. Saying "inside the dead band" here was simply false -- and
    // it contradicted the tile above, which reports the share and correctly
    // says it is past the line. Both readings are of the same number; what
    // separates them is the interval, so that is what this says.
    note.className = "verdict neutral";
    note.innerHTML = t("scale.verdictStraddle", {
      q: pct(o.q, 2), lo: pct(o.lo, 2), hi: pct(o.hi, 2), n: o.n.toLocaleString(),
      line: o.q > BANKER_BREAKEVEN ? t("side.B") : t("side.P"),
    });
  }
}

/**
 * The coup the banner is currently showing, so a new one can announce itself.
 *
 * Held as the table it belongs to and how many coups that table's open shoe
 * had, because "a coup arrived" is the only thing that should flash: switching
 * tables, undoing, opening a new shoe and the first paint all change what the
 * banner says without anything having been dealt.
 */
let bannerAt = null;
/** Counts the banner's draws, so a flash queued for one is not put on the next. */
let bannerDraws = 0;

/**
 * What just landed, in the words the table's own screen uses.
 *
 * Somebody at an Avatar Speed table is reading this page and that screen
 * together, so the three outcomes are written in English here whatever
 * language the rest of the page is in. The figures beside them -- which coup,
 * how long the run -- are this page talking, and follow the language.
 */
function renderLastResult() {
  const host = $("lastResult");
  const shoe = openShoe();
  const outcomes = [...shoe.o];
  const latest = outcomes[outcomes.length - 1] || null;

  const was = bannerAt;
  const now = { table: state.active, coups: outcomes.length };
  bannerAt = now;
  // Only a coup arriving on the table already being shown is new. The first
  // paint has nothing to compare against, so it never flashes either.
  const arrived = !!was && was.table === now.table && now.coups > was.coups;

  host.className = "result " + (latest || "waiting");
  host.setAttribute("aria-label", t("result.aria"));
  host.innerHTML = "";

  const dot = el("span", "rdot");
  const word = el("span", "rword", latest ? t("result." + latest) : t("result.waiting"));
  host.append(dot, word);

  if (latest) {
    const road = new BigRoad();
    for (const o of outcomes) road.add(o);
    const meta = el("span", "rmeta");
    meta.appendChild(el("b", null, t("result.coup", { n: outcomes.length })));
    // A tie opens no column, so there is no run to speak of on one.
    if (latest !== "T" && road.currentStreak > 1) {
      meta.appendChild(el("span", null, t("result.streak", { n: road.currentStreak })));
    }
    host.appendChild(meta);
  }

  // Restarting an animation takes the class off, a frame drawn without it,
  // and the class back on; the element is rebuilt above, so it is already
  // off. Waiting out a frame, rather than forcing a layout to stand in for
  // one, is what keeps a coup from laying the whole page out once more. A
  // banner drawn again before then -- an undo, another table -- cancels it.
  const draw = ++bannerDraws;
  if (arrived) {
    requestAnimationFrame(() => requestAnimationFrame(() => {
      if (draw === bannerDraws) host.classList.add("fresh");
    }));
  }
}

/* A road wider than its box scrolls, and it used to sit on its first column --
   so on a phone the newest coups, the ones being watched for, were off the
   right-hand edge. Each road keeps to its newest column now: after a coup, and
   after its box changes width, which is what the guest's view does to the
   board at a desk and what turning a phone does. Scrolled back to look at
   older coups it is left there; scrolled back to the end, or showing another
   table, it follows again. */

/** Whether each road's box is keeping to its newest column. */
const roadFollowing = new WeakMap();
/** The table the roads were last drawn for. */
let roadsAt;

function followRoads() {
  for (const box of document.querySelectorAll(".roadscroll")) {
    if (roadFollowing.get(box) !== false) box.scrollLeft = box.scrollWidth;
  }
}

/* Each road is drawn on ruled paper, the way a table's scoreboard is ruled
   whether or not anything has been dealt -- as many columns of it as the
   owner's table rules, so that each road shows what the table's does: the
   same marks, and once it is longer than its paper, the same newest ones.
   The squares are sized to the board's box (see the page's style), so a box
   that changes width changes their size and not their number, and a road
   keeping to its newest column is put back there. In the next frame:
   scrolling inside the observer that saw the change is a loop the browser
   reports. */

/** Rows on every road, as on a table's. */
const ROAD_ROWS = 6;
/** The columns of paper each road is ruled with, as the owner's table rules
    its scoreboard: the bead plate eleven, sixty-six coups; the big road forty;
    and the derived roads, two of their columns to one of the big road's,
    eighty under it and forty each at its foot. */
const ROAD_PAPER = { bead: 11, big: 40, beb: 80, small: 40, roach: 40 };
let roadRefollow = 0;
/** Each road's box's width as the watch on its size last saw it laid out. */
const roadWidth = new WeakMap();

/* A box made narrower has its scroll pulled back to its new end as it is laid
   out, and the browser reports that scroll in the next frame -- by when a
   window dragged narrower and back has made the box wider again, so the road
   reads as scrolled back from its newest column and would stop following it
   for good, every coup after drawn off its edge. A scroll reported against a
   width the watch has not seen yet is the browser's, not the owner's: it
   leaves the road following as it was, and the watch, seeing the new width,
   puts a following road back at its end. */
function bindRoads() {
  const boxes = document.querySelectorAll(".roadscroll");
  for (const box of boxes) {
    box.addEventListener("scroll", () => {
      const seen = roadWidth.get(box);
      if (seen !== undefined && seen !== box.clientWidth) return;
      roadFollowing.set(box, box.scrollLeft + box.clientWidth >= box.scrollWidth - 2);
    }, { passive: true });
  }
  if (typeof ResizeObserver === "function") {
    const watch = new ResizeObserver((entries) => {
      for (const entry of entries) roadWidth.set(entry.target, entry.target.clientWidth);
      if (roadRefollow) return;
      roadRefollow = requestAnimationFrame(() => {
        roadRefollow = 0;
        followRoads();
      });
    });
    for (const box of boxes) watch.observe(box);
  }
}

/**
 * What each derived road would gain from one more coup of `side` -- the ask
 * roads a table shows beside its counts: the colour of the mark the big eye
 * boy, the small road and the cockroach road would each get, or null where
 * one would get nothing, as a road too young to have a mark does. A road that
 * has begun gains a mark from every coup but a tie, and only at its end, so
 * its last mark with that coup is the one the coup gave it.
 */
function askRoads(outcomes, side) {
  const next = new BigRoad();
  for (const o of outcomes) next.add(o);
  next.add(side);
  const will = allDerivedRoads(next.columns);
  return ["big_eye_boy", "small_road", "cockroach_road"].map((k) =>
    will[k].length ? will[k][will[k].length - 1] : null);
}

/**
 * One road on its paper. `paint(cell, row, col)` draws what that square of
 * `used` columns holds, saying whether it held anything; squares go in
 * column by column, and the paper runs on past the last mark to `columns`.
 */
function drawRoad(host, used, columns, paint) {
  const step = host.classList.contains("sm") ? 2 : 1;
  let total = Math.max(used, columns);
  total += total % step;
  const paper = document.createDocumentFragment();
  for (let c = 0; c < total; c++) {
    for (let r = 0; r < ROAD_ROWS; r++) {
      const cell = el("span", "cell");
      if (!(c < used && paint(cell, r, c))) cell.classList.add("empty");
      paper.appendChild(cell);
    }
  }
  host.replaceChildren(paper);
}

function renderBoard() {
  const shoe = openShoe();
  const outcomes = [...shoe.o];
  const road = new BigRoad();
  for (const o of outcomes) road.add(o);

  if (roadsAt !== state.active) {
    roadsAt = state.active;
    for (const box of document.querySelectorAll(".roadscroll")) roadFollowing.set(box, true);
  }

  // The bead plate: every coup in order, a disc with its letter -- B, P or
  // T, as the table's own screen writes them, whatever language the page is
  // in: the two are read side by side.
  const bead = beadPlate(outcomes, ROAD_ROWS);
  drawRoad($("bead"), bead[0].length, ROAD_PAPER.bead, (cell, r, c) => {
    const o = bead[r][c];
    if (o) cell.appendChild(el("i", "mk " + o, o));
    return Boolean(o);
  });

  // The big road: rings, and a tie as a green stroke across the coup before
  // it -- with how many, when it is more than one.
  const big = road.grid(ROAD_ROWS);
  const ties = new Map(road.tieCells(ROAD_ROWS).map(([r, c, n]) => [`${r},${c}`, n]));
  drawRoad($("big"), big[0].length, ROAD_PAPER.big, (cell, r, c) => {
    const o = big[r][c], n = ties.get(`${r},${c}`) || 0;
    if (o) cell.appendChild(el("i", "mk " + o));
    if (n) cell.appendChild(el("i", "tie"));
    if (n > 1) cell.appendChild(el("b", "tn", String(n)));
    return Boolean(o || n);
  });

  // The derived roads, each in columns of one colour as the big road is in
  // columns of one side: rings, dots and strokes.
  const derived = allDerivedRoads(road.columns);
  for (const [id, marks] of [["beb", derived.big_eye_boy], ["small", derived.small_road],
                             ["roach", derived.cockroach_road]]) {
    const grid = wrapColumns(derivedColumns(marks), ROAD_ROWS);
    drawRoad($(id), grid[0].length, ROAD_PAPER[id], (cell, r, c) => {
      const m = grid[r][c];
      if (m) cell.appendChild(el("i", "mk " + (m === RED ? "red" : "blue")));
      return Boolean(m);
    });
  }
  measureAfterLayout();

  const c = { P: 0, B: 0, T: 0 };
  for (const o of outcomes) c[o]++;

  // The counts, as the table's column of them reads: Banker, Player, Tie.
  const counts = $("boardCounts");
  counts.innerHTML = "";
  for (const o of ["B", "P", "T"]) {
    const row = el("div", "sbcount " + o);
    row.dataset.side = o;
    row.append(el("i", "mk " + o, o), el("b", null, String(c[o])));
    counts.appendChild(row);
  }

  // The ask roads: under each side's letter, the mark each derived road would
  // get if that side came next -- a ring, a dot and a stroke, or a gap where
  // a road would get none.
  const ask = $("boardAsk");
  ask.innerHTML = "";
  for (const s of ["B", "P"]) {
    const box = el("div", "sbask " + s);
    box.dataset.side = s;
    box.setAttribute("role", "img");
    box.setAttribute("aria-label", t(s === "B" ? "board.askB" : "board.askP"));
    box.appendChild(el("i", "hd " + s, s));
    askRoads(outcomes, s).forEach((m, i) => {
      const kind = ["beb", "small", "roach"][i];
      box.appendChild(el("i", "m " + kind + (m ? (m === RED ? " red" : " blue") : "")));
    });
    ask.appendChild(box);
  }
  $("boardMeta").textContent = outcomes.length
    ? t("board.meta", {
        n: outcomes.length, p: c.P, b: c.B, t: c.T,
        streak: road.currentStreak,
        side: road.currentSide ? ` (${side(road.currentSide)})` : "",
      })
    : t("board.empty");
}

/* ------------------------------------------------------------- per shoe */

/**
 * The per-shoe view's own state: which column orders the table and how many
 * rows are on screen. Both are view state, not data -- they survive a coup
 * arriving and are reset when the table changes, because 'the fortieth row'
 * means a different shoe on a different table.
 */
let shoeSort = "order";
let shoeLimit = 40;
const SHOE_PAGE = 40;

/** Every shoe of the active table, computed once per change. */
function shoeStats() {
  if (shoeCache && shoeCache.revision === revision && shoeCache.table === state.active) {
    return shoeCache.value;
  }
  const value = shoeTable(shoes().filter((s) => s.o.length).map((s) => s.o));
  shoeCache = { revision, table: state.active, value };
  return value;
}

/** The columns, in the order they are drawn. `opt` ones fold away on a phone. */
const SHOE_COLUMNS = [
  { key: "order", label: "shoe.colShoe", opt: false },
  { key: "coups", label: "shoe.colCoups", opt: false },
  { key: "share", label: "shoe.colShare", opt: false },
  { key: "far", label: "shoe.colZ", opt: false },
  { key: "streak", label: "shoe.colStreak", opt: true },
  { key: "chop", label: "shoe.colChop", opt: true },
];

/**
 * How far the spread ratio may sit from 1 before it is worth remarking on.
 *
 * The ratio is a variance ratio, so its sampling variance is 2/(m-1) over m
 * shoes; two of those is the band drawn here. It is an approximation and it
 * is deliberately not called a verdict -- the battery below this panel is the
 * test, with all seventeen statistics and a correction across them.
 */
function spreadTolerance(shoesUsed) {
  return shoesUsed > 1 ? 2 * Math.sqrt(2 / (shoesUsed - 1)) : Infinity;
}

/**
 * Every shoe's Banker share as one dot, over the width an honest table would
 * have put them in.
 *
 * The dead band is drawn to the same scale, which is the point of the picture:
 * the band a wager has to clear is 1.28 percentage points wide, and honest
 * shoes scatter across thirty. Anyone reading a single shoe is reading that
 * scatter.
 */
function renderShoeStrip(rows, summary) {
  const LO = 0.25, HI = 0.75, W = 720, H = 150;
  const x = (q) => ((q - LO) / (HI - LO)) * (W - 90) + 45;
  const svg = $("shoeStrip");
  const C = themeColour;

  const yBand = 26, hBand = 56, yBottom = yBand + hBand;
  const yAxis = 116, yTick = 131, yCaption = H - 4;
  const p = [];

  const half = Z_FLAG * summary.bandSe;
  const bandLo = Math.max(LO, BASE_BANKER_SHARE - half);
  const bandHi = Math.min(HI, BASE_BANKER_SHARE + half);
  p.push(`<rect x="${x(bandLo)}" y="${yBand}" width="${x(bandHi) - x(bandLo)}" height="${hBand}" fill="${C("--band")}" rx="3"/>`);
  p.push(`<text x="${x(bandLo) + 7}" y="${yBottom - 7}" font-size="10.5" fill="${C("--ink-2")}">${t("shoe.stripBand")}</text>`);

  // The dead band, drawn to the same scale as the scatter. That is the whole
  // picture: the width a wager has to clear is this notch, and honest shoes
  // land anywhere in the grey.
  const xDead = x(PLAYER_BREAKEVEN), wDead = Math.max(2, x(BANKER_BREAKEVEN) - xDead);
  p.push(`<rect x="${xDead}" y="${yBand}" width="${wDead}" height="${hBand}" fill="${C("--surface")}" stroke="${C("--ink-3")}" stroke-width="0.9"/>`);
  const xMid = xDead + wDead / 2;
  p.push(`<line x1="${xMid}" y1="${yBottom}" x2="${xMid}" y2="${yBottom + 9}" stroke="${C("--ink-3")}" stroke-width="0.9"/>`);
  p.push(`<text x="${xMid}" y="${yBottom + 21}" text-anchor="middle" font-size="10.5" fill="${C("--ink-2")}">${t("shoe.stripDead")} ${pct(BANKER_BREAKEVEN - PLAYER_BREAKEVEN, 2)}p</text>`);

  p.push(`<line x1="${x(BASE_BANKER_SHARE)}" y1="${yBand - 4}" x2="${x(BASE_BANKER_SHARE)}" y2="${yBottom}" stroke="${C("--accent")}" stroke-width="1" stroke-dasharray="3 3"/>`);
  p.push(`<text x="${x(BASE_BANKER_SHARE)}" y="${yBand - 9}" text-anchor="middle" font-size="10" class="m" fill="${C("--accent")}">${t("shoe.stripFair")} ${pct(BASE_BANKER_SHARE, 2)}</text>`);

  // One dot per shoe, spread down the band so equal shares do not hide, and
  // clear of the label sitting along its floor.
  const clamp = (q) => Math.min(HI, Math.max(LO, q));
  for (const r of rows) {
    if (!Number.isFinite(r.q)) continue;
    const far = Math.abs(r.z) >= Z_FLAG;
    const cx = x(clamp(r.q));
    const cy = yBand + 7 + ((r.index * 37) % (hBand - 27));
    const col = r.q > BANKER_BREAKEVEN ? C("--banker")
              : r.q < PLAYER_BREAKEVEN ? C("--player") : C("--ink-3");
    p.push(`<circle cx="${cx}" cy="${cy.toFixed(1)}" r="${far ? 3.4 : 2.6}" fill="${col}" fill-opacity="${far ? 0.95 : 0.55}"${far ? ` stroke="${C("--surface")}" stroke-width="1"` : ""}/>`);
  }

  p.push(`<line x1="${x(LO)}" y1="${yAxis}" x2="${x(HI)}" y2="${yAxis}" stroke="${C("--line-2")}" stroke-width="1"/>`);
  for (const q of [0.3, 0.4, 0.5, 0.6, 0.7]) {
    p.push(`<line x1="${x(q)}" y1="${yAxis}" x2="${x(q)}" y2="${yAxis + 4}" stroke="${C("--line-2")}"/>`);
    p.push(`<text x="${x(q)}" y="${yTick}" text-anchor="middle" font-size="10" class="m" fill="${C("--ink-3")}">${(q * 100).toFixed(0)}%</text>`);
  }
  p.push(`<text x="${W / 2}" y="${yCaption}" text-anchor="middle" font-size="10.5" fill="${C("--ink-3")}">${t("shoe.stripAxis")}</text>`);

  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = p.join("");
}

function renderShoeFacts(summary) {
  const box = $("shoeFacts");
  box.innerHTML = "";
  const sp = summary.spread;
  const tiles = [
    {
      k: t("shoe.factShoes"), v: summary.shoes.toLocaleString(),
      s: t("shoe.factShoesSub", {
        coups: summary.coups.toLocaleString(), decided: summary.decided.toLocaleString(),
      }),
    },
    {
      k: t("shoe.factBand"),
      v: Number.isFinite(summary.bandSe) ? "±" + pct(Z_FLAG * summary.bandSe, 2) : "—",
      s: Number.isFinite(summary.bandSe)
        ? t("shoe.factBandSub", { n: summary.meanDecided.toFixed(0) })
        : t("state.pending"),
    },
    {
      k: t("shoe.factOutside"), v: summary.scored ? String(summary.outside) : "—",
      s: summary.scored
        ? t("shoe.factOutsideSub", { expected: summary.expectedOutside.toFixed(1) })
        : t("state.pending"),
    },
    {
      k: t("shoe.factSpread"),
      v: Number.isFinite(sp.ratio) ? sp.ratio.toFixed(2) + "×" : "—",
      s: Number.isFinite(sp.ratio)
        ? t("shoe.factSpreadSub", { sd: pct(sp.sd, 2), expected: pct(sp.expected, 2) })
        : t("state.pending"),
    },
  ];
  for (const tile of tiles) {
    const d = el("div", "tile");
    d.appendChild(el("div", "k", tile.k));
    d.appendChild(el("div", "v", tile.v));
    d.appendChild(el("div", "s", tile.s));
    box.appendChild(d);
  }
}

function renderShoeVerdict(summary) {
  const note = $("shoeVerdict");
  const sp = summary.spread;
  if (!Number.isFinite(sp.ratio)) {
    note.className = "verdict neutral";
    note.innerHTML = t("shoe.verdictThin", { n: summary.shoes.toLocaleString() });
    return;
  }
  const tol = spreadTolerance(sp.shoes);
  const off = sp.ratio - 1;
  if (Math.abs(off) <= tol) {
    note.className = "verdict neutral";
    note.innerHTML = t("shoe.verdictClean", {
      outside: summary.outside, expected: summary.expectedOutside.toFixed(1),
    });
    return;
  }
  note.className = "verdict flag";
  note.innerHTML = t(off > 0 ? "shoe.verdictWide" : "shoe.verdictTight", {
    ratio: sp.ratio.toFixed(2), tol: tol.toFixed(2),
  });
}

function renderShoeRows(rows, openIndex) {
  const head = $("shoeTable").tHead;
  head.innerHTML = "";
  const tr = el("tr");
  for (const col of SHOE_COLUMNS) {
    const th = el("th", col.opt ? "opt" : null);
    if (shoeSort === col.key) th.setAttribute("aria-sort", "descending");
    const label = t(col.label);
    const button = el("button", null, label);
    button.type = "button";
    button.setAttribute("aria-label", t("shoe.sortAria", { col: label }));
    if (shoeSort === col.key) button.appendChild(el("span", "caret", "▾"));
    button.onclick = () => { shoeSort = col.key; render(); };
    th.appendChild(button);
    tr.appendChild(th);
  }
  head.appendChild(tr);

  const body = $("shoeTable").tBodies[0];
  body.innerHTML = "";
  for (const r of rows) {
    const far = Math.abs(r.z) >= Z_FLAG;
    const thin = r.n < MIN_SHOE_COUPS;
    const row = el("tr", [r.index === openIndex ? "open" : "", far && !thin ? "far" : ""]
      .filter(Boolean).join(" ") || null);

    const name = el("td", null, "#" + (r.index + 1));
    if (r.index === openIndex) name.append(" " + t("shoe.open"));
    row.appendChild(name);

    const counts = el("td");
    counts.appendChild(el("small", null,
      `${mark("B")}${r.banker} ${mark("P")}${r.player} ${mark("T")}${r.ties}`));
    counts.appendChild(el("span", "n", String(r.coups)));
    row.appendChild(counts);

    const lean = r.q > BANKER_BREAKEVEN ? "q b" : r.q < PLAYER_BREAKEVEN ? "q p" : "q";
    row.appendChild(el("td", lean, Number.isFinite(r.q) ? pct(r.q, 1) : "—"));

    row.appendChild(el("td", thin ? "z mut" : "z",
      thin ? t("shoe.thinRow")
      : Number.isFinite(r.z) ? `${r.z >= 0 ? "+" : "−"}${Math.abs(r.z).toFixed(2)}σ` : "—"));

    row.appendChild(el("td", "opt", r.longest ? String(r.longest) : "—"));
    row.appendChild(el("td", "opt", Number.isFinite(r.chop) ? pct(r.chop, 0) : "—"));
    body.appendChild(row);
  }
}

function renderShoes() {
  const { rows, summary } = shoeStats();
  // The shoe still being dealt is the last one, and only while it is open.
  const list = shoes();
  const last = list[list.length - 1];
  const openIndex = last && !last.closed && last.o.length ? rows.length - 1 : -1;

  $("shoeEmpty").hidden = rows.length > 0;
  $("shoePanel").querySelector(".shoescroll").hidden = rows.length === 0;
  // `hidden` is an HTMLElement property; on an SVG element it sets a plain
  // JavaScript field that reflects to no attribute, so CSS never sees it and
  // the drawing stays on screen. The attribute has to be set directly.
  $("shoeStrip").toggleAttribute("hidden", summary.scored < MIN_SHOES);

  renderShoeFacts(summary);
  renderShoeVerdict(summary);
  if (summary.scored >= MIN_SHOES) renderShoeStrip(rows, summary);

  if (!rows.length) {
    $("shoeTable").tHead.innerHTML = "";
    $("shoeTable").tBodies[0].innerHTML = "";
    $("shoeShown").textContent = "";
    $("shoeMore").hidden = true;
    return;
  }

  const ordered = sortRows(rows, shoeSort);
  const shown = Math.min(shoeLimit, ordered.length);
  renderShoeRows(ordered.slice(0, shown), openIndex);

  $("shoeShown").textContent = t("shoe.shown", {
    shown: shown.toLocaleString(), total: ordered.length.toLocaleString(),
    sort: t((SHOE_COLUMNS.find((c) => c.key === shoeSort) || SHOE_COLUMNS[0]).label),
  });
  $("shoeMore").hidden = shown >= ordered.length;
}

function renderMilestones() {
  // Counted in whole shoes' worth, the unit the milestones were measured in.
  // A shoe caught part-way through is part of one, and says so underneath.
  const held = shoes().filter((s) => s.o.length).map((s) => s.o);
  const worth = wholeShoes(held);
  const n = Math.floor(worth + 1e-9);
  const pieces = held.filter((s) => s.length < SHOE_MIN).length;
  const note = $("collectPieces");
  note.hidden = !pieces;
  if (pieces) {
    note.textContent = t("collect.pieces", {
      n: pieces, total: held.length, worth: n.toLocaleString(),
    });
  }
  const box = $("milestones");
  box.innerHTML = "";
  for (const m of MILESTONES) {
    const done = n >= m.shoes;
    const row = el("div", "ms" + (done ? " done" : ""));
    const head = el("div", "msrow");
    head.appendChild(el("span", "msname",
      t("collect.msLabel", { label: t("collect." + m.key), bias: pct(m.bias, 2) })));
    head.appendChild(el("span", "msnum",
      t("collect.msCount", { have: n.toLocaleString(), need: m.shoes.toLocaleString() })));
    row.appendChild(head);
    const track = el("div", "track");
    const fill = el("i");
    fill.style.width = Math.min(100, (n / m.shoes) * 100) + "%";
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("div", "msnote", t("collect." + m.key + "note")));
    box.appendChild(row);
  }
}

/* ------------------------------------------------------------- integrity */

/** Keep a verdict only where it still describes what is on screen. */
function renderIntegrityStanding() {
  const stale = $("intStale");
  const panel = $("intResult");
  const now = shoes().reduce((a, sh) => a + sh.o.length, 0);
  const standing = verdictStanding(integrityShown, state.active, now, !!integrityRun);

  if (standing === "none" || standing === "running") { stale.hidden = true; return; }
  if (standing === "other") { panel.hidden = true; stale.hidden = true; return; }

  // Back on the table it was measured for, so it is worth seeing again.
  panel.hidden = false;
  stale.hidden = standing !== "stale";
  if (standing === "stale") {
    stale.innerHTML = t("int.stale", {
      shoes: integrityShown.shoes.toLocaleString(),
      coups: integrityShown.coups.toLocaleString(),
      now: now.toLocaleString(),
    });
  }
}

function renderIntegrityAvailability() {
  renderIntegrityStanding();
  const n = shoes().filter((s) => s.o.length).length;
  const btn = $("runIntegrity");
  btn.disabled = n < 3 || !!integrityRun;
  $("intHint").textContent = n < 3
    ? t("int.needShoes", { n })
    : t("int.ready", { n, reps: $("reps").value });
}

async function runIntegrity() {
  const list = shoes().filter((s) => s.o.length).map((s) => s.o);
  if (list.length < 3) return;

  const reps = Number($("reps").value);
  integrityRun = { cancelled: false };
  renderIntegrityAvailability();
  $("intProgress").hidden = false;
  $("intResult").hidden = true;

  const bar = $("intBar"), label = $("intProgressLabel");
  const key = nullKey(list, reps);
  let samples = nullCache.get(key);

  if (!samples) {
    label.textContent = t("int.building");
    samples = await simulatedNull(nullShape(list), {
      nReplicates: reps,
      onProgress: (done, total) => {
        bar.style.width = (done / total) * 100 + "%";
        label.textContent = t("int.progress", {
          done, total, shoes: (done * list.length).toLocaleString(),
        });
      },
      shouldStop: () => integrityRun?.cancelled,
    });
    if (!samples) { integrityRun = null; $("intProgress").hidden = true; renderIntegrityAvailability(); return; }
    nullCache.set(key, samples);
    while (nullCache.size > NULLS_KEPT) nullCache.delete(nullCache.keys().next().value);
  }

  lastReport = integrityReport(list, samples, { nReplicates: reps });
  const report = lastReport;
  integrityRun = null;
  $("intProgress").hidden = true;
  renderIntegrityResult(report);
  renderIntegrityAvailability();
}

/**
 * The corpus a verdict on screen was measured over.
 *
 * The panel prints a verdict, a findings table and the shoes it covered, and
 * none of it says which table. So a result left up after the selector moved
 * read as a verdict about the table now on screen -- a run over nine shoes
 * sat above a table with four. A different table gets it cleared; the same
 * table that has since collected more coups keeps it, with a line saying what
 * it was actually measured over.
 */
let integrityShown = null;

/** The seventeen statistics, each against the band an honest shoe stays inside. */
function renderFindings(host, rep) {
  host.innerHTML = "";
  const Z = 4.2, W = 200, MID = 11;
  const zx = (z) => ((Math.max(-Z, Math.min(Z, z)) + Z) / (2 * Z)) * W;

  const legend = el("div", "flegend");
  legend.innerHTML =
    `<span><i class="swatch band"></i>${t("int.legendBand")}</span>` +
    `<span><i class="swatch dot"></i>${t("int.legendDot")}</span>` +
    `<span class="m">${t("int.legendAxis", { z: Z })}</span>`;
  host.appendChild(legend);

  for (const f of rep.findings) {
    const adj = rep.corrections[f.statistic] || {};
    const flagged = !!adj.significant_bh;
    const row = el("div", "find" + (flagged ? " flagged" : ""));

    const name = el("div", "fname");
    name.appendChild(el("span", "t", statLabel(f.statistic)));
    name.title = statWhy(f.statistic);
    row.appendChild(name);

    const offScale = Math.abs(f.z) > Z;
    const cx = zx(f.z);
    const mark = offScale
      ? `<path d="${f.z > 0 ? `M${W - 11} ${MID - 5.5} L${W - 1.5} ${MID} L${W - 11} ${MID + 5.5} Z`
                            : `M11 ${MID - 5.5} L1.5 ${MID} L11 ${MID + 5.5} Z`}" fill="var(--accent)"/>`
      : `<circle cx="${cx}" cy="${MID}" r="4.5" fill="${flagged ? "var(--accent)" : "var(--ink-2)"}" stroke="var(--surface)" stroke-width="1.5"/>`;
    const plot = el("div", "fplot");
    plot.innerHTML =
      `<svg viewBox="0 0 ${W} 22" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
         <rect x="${zx(-1.96)}" y="7" width="${zx(1.96) - zx(-1.96)}" height="8" rx="4" fill="var(--band)"/>
         <line x1="${zx(0)}" y1="4" x2="${zx(0)}" y2="18" stroke="var(--line-2)" stroke-width="1"/>
         ${mark}
       </svg>`;
    plot.title = offScale ? t("int.offAxis", { z: f.z.toFixed(2) }) : `z = ${f.z.toFixed(2)}`;
    row.appendChild(plot);

    const num = el("div", "fnum");
    num.appendChild(el("span", "z", (f.z >= 0 ? "+" : "") + f.z.toFixed(2)));
    num.appendChild(el("span", "p", "p " + adj.p_bh?.toFixed(3)));
    row.appendChild(num);

    row.appendChild(el("div", "fstate", t(flagged ? "int.abnormal" : "int.normal")));
    host.appendChild(row);
  }

}

function renderIntegrityResult(rep) {
  integrityShown = { table: state.active, shoes: rep.n_shoes, coups: rep.n_games };
  $("intResult").hidden = false;
  const v = $("intVerdict");
  v.className = "verdict " + (rep.verdict_kind === "flag" ? "flag" : rep.verdict_kind === "clean" ? "ok" : "neutral");
  const kind = rep.verdict_kind;
  const headline = t({ flag: "int.headFlag", clean: "int.headClean", insufficient: "int.headInsufficient" }[kind]);
  const body = {
    // With what re-asking does to it: a verdict run again after every shoe
    // gives an honest table its turn now and then. See `int.relook`.
    flag: () => t("int.verdictFlag", {
      n: rep.flagged.length, total: rep.findings.length,
      names: rep.flagged.map(statLabel).join(", "),
    }) + " " + t("int.relook"),
    clean: () => t("int.verdictClean", {
      total: rep.findings.length, shoes: rep.n_shoes.toLocaleString(),
      gap: pct(rep.breakeven_gap, 2),
    }),
    insufficient: () => t("int.verdictInsufficient", {
      total: rep.findings.length, shoes: rep.n_shoes.toLocaleString(),
      bias: pct(rep.detectable_bias, 2), gap: pct(rep.breakeven_gap, 2),
      need: rep.shoes_needed.toLocaleString(),
    }),
  }[kind]();
  v.innerHTML = `<b>${headline}.</b> ${body}`;

  renderFindings($("intFindings"), rep);

  $("intMeta").textContent = t("int.meta", {
    shoes: rep.n_shoes.toLocaleString(), coups: rep.n_games.toLocaleString(),
    stats: rep.findings.length, reps: rep.n_replicates,
  });
}

/* ------------------------------------------------------------ import/out */

/**
 * Hand the file to the viewer, by whichever route this page has.
 *
 * Inside the artifact viewer a page cannot start its own download, so the
 * platform capability is the only way; served as an ordinary page -- from
 * GitHub Pages or from the desktop server -- a plain download link works and
 * is one step shorter. The textarea is the last resort, so the data is never
 * simply unreachable.
 */
async function download(filename, data) {
  const note = $("exportNote");
  const ingest = `python -m baccarat ingest ${filename} --save mydata`;

  try {
    const dl = await window.claude?.use?.("downloads");
    if (dl) {
      await dl.save({ filename, data });
      note.textContent = t("tools.exportRequested", { file: filename, cmd: ingest });
      return;
    }
  } catch (e) {
    note.textContent = e?.code === "declined"
      ? t("tools.exportDeclined")
      : t("tools.exportFailed", { code: e?.code || t("tools.error") });
    return;
  }

  try {
    const blob = new Blob([data], { type: filename.endsWith(".csv") ? "text/csv" : "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    note.textContent = t("tools.exportSaved", { file: filename, cmd: ingest });
  } catch {
    note.textContent = t("tools.exportBlocked");
    $("exportDump").hidden = false;
    $("exportDump").value = data;
  }
}

/* ------------------------------------------------------------------ boot */

/**
 * Coups pasted as text anywhere on the page go to the box that takes them.
 */
function bindTextPaste() {
  document.addEventListener("paste", (e) => {
    const text = e.clipboardData?.getData("text");
    const tag = (e.target.tagName || "").toLowerCase();
    // The box it goes into is in the tools panel, which the guest's view does
    // not show: taking the paste there put it where nobody could see it.
    if (text && tag !== "input" && tag !== "textarea" && viewNow === "full") {
      const { sequence } = parseSequenceText(text);
      if (sequence.length >= 4) { e.preventDefault(); $("textIn").value = text; $("textIn").focus(); }
    }
  });
}


function bindControls() {
  $("shoeMore").onclick = () => { shoeLimit += SHOE_PAGE; render(); };

  $("tableSel").onchange = (e) => {
    // The blank option is a value, not a gap: choosing it means no table, and
    // the panels go empty until something is started.
    state.active = e.target.value || null;
    shoeLimit = SHOE_PAGE;          // row 40 is a different shoe on another table
    invalidate();
    store.save(state, []);
    render();
  };
  $("addTable").onclick = () => {
    const name = cleanTableName(prompt(t("header.newTablePrompt")));
    if (!name) return;
    state.tables[name] ||= { shoes: [] };
    state.active = name;
    invalidate();
    store.save(state, []);
    render();
  };

  /**
   * Rename the table being shown.
   *
   * Everything a table owns is keyed by its name -- the shoes, the ledger mark,
   * the selector, and the reader's note of which table it started on -- so a
   * rename is a move of all of it at once. Rebuilt in order rather than
   * deleted-and-added, because the selector is drawn in insertion order and a
   * renamed table jumping to the bottom of the list reads as a different one.
   */
  $("renameTable").onclick = () => {
    const from = state.active;
    if (!from || !state.tables[from]) return;      // nothing selected to rename
    // Through the same rule a typed name goes through anywhere else: the CSV
    // export is a file people open in a spreadsheet.
    const to = cleanTableName(prompt(t("header.renamePrompt", { table: from }), from));
    if (!to || to === from) return;
    if (Object.prototype.hasOwnProperty.call(state.tables, to)) {
      flashNote(t("header.renameTaken", { name: to }));
      return;
    }
    state.tables = Object.fromEntries(Object.entries(state.tables)
      .map(([name, table]) => [name === from ? to : name, table]));
    state.active = to;
    // The reader is watching a screen, not a name. It has to come along, or
    // the next coup it reads is filed under a table that no longer exists and
    // falls back to whichever one is selected.
    if (liveTable === from) liveTable = to;
    // And so does its record, or the table arrives at its new name having
    // predicted nothing.
    renamePredictions(predictionLog, from, to);
    store.saveLog(predictionLog);
    learners.rename(from, to);
    invalidate();
    store.save(state, []);
    render();
  };

  for (const side of ["P", "B", "T"]) $("key" + side).onclick = () => addOutcomes(side);
  $("keyUndo").onclick = undo;
  $("keyNew").onclick = newShoe;

  $("textAdd").onclick = () => {
    const { sequence, skipped } = parseSequenceText($("textIn").value);
    if (!sequence) { $("textNote").textContent = t("tools.textNone"); return; }
    addOutcomes(sequence);
    $("textNote").textContent = t("tools.textAdded", {
      n: sequence.length, skip: skipped ? t("tools.textSkipped", { n: skipped }) : "",
    });
    $("textIn").value = "";
  };
  $("textNew").onclick = () => {
    const { sequence } = parseSequenceText($("textIn").value);
    if (!sequence) { $("textNote").textContent = t("tools.textNone"); return; }
    loadAsNewShoe(sequence);
    $("textNote").textContent = t("tools.textLoaded", { n: sequence.length });
    $("textIn").value = "";
  };

  const langSel = $("langSel");
  for (const { code, label } of LANGS) {
    const option = el("option", null, label);
    option.value = code;
    langSel.appendChild(option);
  }
  langSel.value = currentLang();
  langSel.onchange = (e) => setLang(e.target.value);

  const themeButtons = { auto: $("themeAuto"), light: $("themeLight"), dark: $("themeDark") };
  for (const [name, button] of Object.entries(themeButtons)) button.onclick = () => setTheme(name);

  onChange(() => {
    themeColours.clear();
    for (const [name, button] of Object.entries(themeButtons)) {
      button.classList.toggle("on", currentTheme() === name);
    }
    langSel.value = currentLang();
    store.onStatus(store.status);
    renderAll();
  });

  // The automatic theme follows the system's light or dark as it changes, and
  // the drawings, which carry their colours in their markup, follow it too.
  window.matchMedia?.("(prefers-color-scheme: dark)")?.addEventListener?.("change", () => {
    themeColours.clear();
    if (state) render();
  });
