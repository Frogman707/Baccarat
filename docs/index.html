  v.innerHTML = t(proj.perHand > 0 ? "stake.verdictWin" : "stake.verdictLose", {
    side: side(side_), unit: Math.round(cfg.stakeUnit).toLocaleString(),
    hands: proj.month.hands.toLocaleString(), mean: money(proj.month.mean),
    lo: money(proj.month.lo), hi: money(proj.month.hi),
    need: proj.breakEvenHands.toLocaleString(), needDays: needDays.toLocaleString(),
  });
  $("stakeNote").textContent = t("stake.note");
}

/**
 * Let the viewer draw the region themselves.
 *
 * The reader has two ways of finding the roads on its own -- by their marks,
 * and by the ruling they are printed on -- and both are inferences about a
 * screen neither the code nor its author has ever seen. This is the one that
 * is not an inference. Drag a box around the strip and that is the region,
 * permanently: no search, no re-check, nothing to lose at a shoe change.
 *
 * The preview is a canvas painted at the reader's own working resolution and
 * then scaled by CSS to fit the page, so a box drawn in page pixels has to be
 * carried back through that scale. Getting it wrong is invisible on a screen
 * shared at the same size as the canvas and badly wrong on any other, which is
 * why the ratio is taken from the canvas itself every time rather than cached.
 */
function bindRegionPicker() {
  const canvas = $("liveCanvas"), hint = $("livePickHint"), button = $("livePick");
  let from = null;

  const toFrame = (event) => {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return null;
    return {
      x: (event.clientX - rect.left) * (canvas.width / rect.width),
      y: (event.clientY - rect.top) * (canvas.height / rect.height),
    };
  };

  const setPicking = (on) => {
    livePicking = on;
    from = null;
    canvas.classList.toggle("picking", on);
    hint.hidden = !on;
    button.textContent = t(on ? "live.picking" : "live.pick");
  };

  button.onclick = () => {
    if (live.pinned === "manual") { live.unpin(); livePinned = null; setPicking(false); return; }
    setPicking(!livePicking);
  };

  canvas.addEventListener("pointerdown", (e) => {
    if (!livePicking) return;
    from = toFrame(e);
    if (from) { canvas.setPointerCapture(e.pointerId); e.preventDefault(); }
  });

  canvas.addEventListener("pointerup", (e) => {
    if (!livePicking || !from) return;
    const start = from, to = toFrame(e);
    from = null;
    if (!to) return;
    // Drawn from any corner, kept as a box. A stray click is not a region, so
    // anything smaller than a mark is treated as a miss rather than obeyed --
    // `pinRegion` says no and the picker stays open for another try.
    const box = {
      x: Math.round(Math.min(start.x, to.x)), y: Math.round(Math.min(start.y, to.y)),
      w: Math.round(Math.abs(to.x - start.x)), h: Math.round(Math.abs(to.y - start.y)),
    };
    if (live.pinRegion(box)) setPicking(false);
  });
}

function bindStake() {
  const cfg = stakeSettings();
  for (const id of Object.keys(STAKE_FIELDS)) {
    const input = $(id);
    input.value = String(cfg[id]);
    input.oninput = () => {
      const spec = STAKE_FIELDS[id];
      const v = Number(input.value);
      const next = { ...stakeSettings(), [id]: Number.isFinite(v) && v >= spec.min ? v : spec.def };
      saveStakeSettings(next);
      renderStake();
    };
  }
}

function renderScale() {
  const LO = 0.488, HI = 0.532, W = 720, H = 168;
  const x = (q) => ((q - LO) / (HI - LO)) * (W - 90) + 45;
  const o = observed();
  const svg = $("scale");
  const css = getComputedStyle(document.documentElement);
  const C = (n) => css.getPropertyValue(n).trim();

  // One row of the drawing per thing being said, top to bottom: this table,
  // the fresh-shoe reference, the zones, then the two break-even lines.
  const yObsLabel = 15, yObs = 30, yFreshLabel = 53, yBand = 64, hBand = 26;
  const yTickTop = 60, yTickBottom = 108, yTickLabel = 123, ySubLabel = 137;

  const p = [];
  p.push(`<rect x="${x(LO)}" y="${yBand}" width="${x(PLAYER_BREAKEVEN) - x(LO)}" height="${hBand}" fill="${C("--zone")}" rx="2"/>`);
  p.push(`<rect x="${x(BANKER_BREAKEVEN)}" y="${yBand}" width="${x(HI) - x(BANKER_BREAKEVEN)}" height="${hBand}" fill="${C("--zone")}" rx="2"/>`);
  p.push(`<rect x="${x(PLAYER_BREAKEVEN)}" y="${yBand}" width="${x(BANKER_BREAKEVEN) - x(PLAYER_BREAKEVEN)}" height="${hBand}" fill="${C("--dead")}" stroke="${C("--line-2")}"/>`);
  p.push(`<text x="${(x(PLAYER_BREAKEVEN) + x(BANKER_BREAKEVEN)) / 2}" y="${yBand + 17}" text-anchor="middle" font-size="11.5" fill="${C("--ink-2")}">${t("scale.deadBand")}</text>`);
  p.push(`<text x="${x(LO) + 4}" y="${yBand + 17}" font-size="11" fill="${C("--ink-3")}">${t("scale.playerProfit")}</text>`);
  p.push(`<text x="${x(HI) - 4}" y="${yBand + 17}" font-size="11" text-anchor="end" fill="${C("--ink-3")}">${t("scale.bankerProfit")}</text>`);

  for (const [q, label, sub] of [[PLAYER_BREAKEVEN, "50.000%", t("scale.playerBreakeven")],
                                 [BANKER_BREAKEVEN, "51.282%", t("scale.bankerBreakeven")]]) {
    p.push(`<line x1="${x(q)}" y1="${yTickTop}" x2="${x(q)}" y2="${yTickBottom}" stroke="${C("--ink-2")}" stroke-width="1.2"/>`);
    p.push(`<text x="${x(q)}" y="${yTickLabel}" text-anchor="middle" font-size="11.5" class="m" fill="${C("--ink")}">${label}</text>`);
    p.push(`<text x="${x(q)}" y="${ySubLabel}" text-anchor="middle" font-size="10.5" fill="${C("--ink-3")}">${sub}</text>`);
  }

  p.push(`<line x1="${x(BASE_BANKER_SHARE)}" y1="${yBand - 3}" x2="${x(BASE_BANKER_SHARE)}" y2="${yBand + hBand + 3}" stroke="${C("--ink-3")}" stroke-width="1" stroke-dasharray="3 3"/>`);
  p.push(`<text x="${x(BASE_BANKER_SHARE)}" y="${yFreshLabel}" text-anchor="middle" font-size="10.5" fill="${C("--ink-3")}">${t("scale.freshShoe")}</text>`);

  if (hasInterval(o)) {
    const clears = o.lo > BANKER_BREAKEVEN || o.hi < PLAYER_BREAKEVEN;
    const col = clears ? C("--accent") : C("--ink");
    const clamp = (q) => Math.min(HI, Math.max(LO, q));
    const off = o.q > HI || o.q < LO;

    p.push(`<line x1="${x(clamp(o.lo))}" y1="${yObs}" x2="${x(clamp(o.hi))}" y2="${yObs}" stroke="${col}" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>`);
    for (const q of [o.lo, o.hi]) {
      if (q < LO || q > HI) continue;                      // a whisker end past the axis has no tick
      p.push(`<line x1="${x(q)}" y1="${yObs - 5}" x2="${x(q)}" y2="${yObs + 5}" stroke="${col}" stroke-width="2"/>`);
    }
    const cx = x(clamp(o.q));
    p.push(off
      ? `<path d="${o.q > HI ? `M${cx - 6} ${yObs - 5.5} L${cx + 2} ${yObs} L${cx - 6} ${yObs + 5.5} Z`
                             : `M${cx + 6} ${yObs - 5.5} L${cx - 2} ${yObs} L${cx + 6} ${yObs + 5.5} Z`}" fill="${col}"/>`
      : `<circle cx="${cx}" cy="${yObs}" r="5.5" fill="${col}" stroke="${C("--surface")}" stroke-width="2"/>`);

    // Keep the label inside the drawing whichever end the value sits at.
    const lx = Math.min(W - 10, Math.max(10, cx));
    const anchor = lx > W - 110 ? "end" : lx < 110 ? "start" : "middle";
    const text = t("scale.thisTable", { q: pct(o.q, 2) }) + (off ? t("scale.offAxis") : "");
    p.push(`<text x="${lx}" y="${yObsLabel}" text-anchor="${anchor}" font-size="11.5" class="m" fill="${col}">${text}</text>`);
  } else {
    p.push(`<text x="${W / 2}" y="${yObsLabel}" text-anchor="middle" font-size="11.5" fill="${C("--ink-3")}">${t("scale.waiting")}</text>`);
  }
  p.push(`<text x="${W / 2}" y="${H - 5}" text-anchor="middle" font-size="10.5" fill="${C("--ink-3")}">${t("scale.axis")}</text>`);

  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = p.join("");

  const e = edges(BASE_BANKER_SHARE, BASE_TIE);
  const note = $("scaleNote");
  if (!hasInterval(o)) {
    note.className = "verdict neutral";
    note.innerHTML = t("scale.verdictWaiting", { eb: pct(e.B, 3), ep: pct(e.P, 3), n: o.n });
  } else if (o.lo > BANKER_BREAKEVEN) {
    note.className = "verdict flag";
    note.innerHTML = t("scale.verdictBanker", { lo: pct(o.lo, 2), hi: pct(o.hi, 2) });
  } else if (o.hi < PLAYER_BREAKEVEN) {
    note.className = "verdict flag";
    note.innerHTML = t("scale.verdictPlayer", { lo: pct(o.lo, 2), hi: pct(o.hi, 2) });
  } else if (o.q >= PLAYER_BREAKEVEN && o.q <= BANKER_BREAKEVEN) {
    note.className = "verdict neutral";
    note.innerHTML = t("scale.verdictDead", { q: pct(o.q, 2), lo: pct(o.lo, 2), hi: pct(o.hi, 2) });
  } else {
    // The share itself has cleared a break-even line but the interval around
    // it has not. Saying "inside the dead band" here was simply false -- and
    // it contradicted the tile above, which reports the share and correctly
    // says it is past the line. Both readings are of the same number; what
    // separates them is the interval, so that is what this says.
    note.className = "verdict neutral";
    note.innerHTML = t("scale.verdictStraddle", {
      q: pct(o.q, 2), lo: pct(o.lo, 2), hi: pct(o.hi, 2), n: o.n.toLocaleString(),
      line: o.q > BANKER_BREAKEVEN ? t("side.B") : t("side.P"),
    });
  }
}

/**
 * The coup the banner is currently showing, so a new one can announce itself.
 *
 * Held as the table it belongs to and how many coups that table's open shoe
 * had, because "a coup arrived" is the only thing that should flash: switching
 * tables, undoing, opening a new shoe and the first paint all change what the
 * banner says without anything having been dealt.
 */
let bannerAt = null;

/**
 * What just landed, in the words the table's own screen uses.
 *
 * Somebody at an Avatar Speed table is reading this page and that screen
 * together, so the three outcomes are written in English here whatever
 * language the rest of the page is in. The figures beside them -- which coup,
 * how long the run -- are this page talking, and follow the language.
 */
function renderLastResult() {
  const host = $("lastResult");
  const shoe = openShoe();
  const outcomes = [...shoe.o];
  const latest = outcomes[outcomes.length - 1] || null;

  const was = bannerAt;
  const now = { table: state.active, coups: outcomes.length };
  bannerAt = now;
  // Only a coup arriving on the table already being shown is new. The first
  // paint has nothing to compare against, so it never flashes either.
  const arrived = !!was && was.table === now.table && now.coups > was.coups;

  host.className = "result " + (latest || "waiting");
  host.setAttribute("aria-label", t("result.aria"));
  host.innerHTML = "";

  const dot = el("span", "rdot");
  const word = el("span", "rword", latest ? t("result." + latest) : t("result.waiting"));
  host.append(dot, word);

  if (latest) {
    const road = new BigRoad();
    for (const o of outcomes) road.add(o);
    const meta = el("span", "rmeta");
    meta.appendChild(el("b", null, t("result.coup", { n: outcomes.length })));
    // A tie opens no column, so there is no run to speak of on one.
    if (latest !== "T" && road.currentStreak > 1) {
      meta.appendChild(el("span", null, t("result.streak", { n: road.currentStreak })));
    }
    host.appendChild(meta);
  }

  if (arrived) {
    // Restarting an animation takes the class off, a reflow, and the class
    // back on; the element is rebuilt above, so it is already off.
    void host.offsetWidth;
    host.classList.add("fresh");
  }
}

function renderBoard() {
  const shoe = openShoe();
  const outcomes = [...shoe.o];
  const road = new BigRoad();
  for (const o of outcomes) road.add(o);

  drawGrid($("bead"), beadPlate(outcomes), "outcome");
  drawGrid($("big"), road.grid(6), "outcome");
  const derived = allDerivedRoads(road.columns);
  drawFlat($("beb"), derived.big_eye_boy);
  drawFlat($("small"), derived.small_road);
  drawFlat($("roach"), derived.cockroach_road);

  const c = { P: 0, B: 0, T: 0 };
  for (const o of outcomes) c[o]++;
  $("boardMeta").textContent = outcomes.length
    ? t("board.meta", {
        n: outcomes.length, p: c.P, b: c.B, t: c.T,
        streak: road.currentStreak,
        side: road.currentSide ? ` (${side(road.currentSide)})` : "",
      })
    : t("board.empty");
}

function drawGrid(host, rows, kind) {
  host.innerHTML = "";
  for (const row of rows) {
    const line = el("div", "gridrow");
    for (const cell of row) {
      const c = el("span", "cell" + (cell ? " " + cell : " empty"));
      if (cell) c.textContent = mark(cell);
      line.appendChild(c);
    }
    host.appendChild(line);
  }
}

function drawFlat(host, marks) {
  const rows = 6, width = Math.max(1, Math.ceil(marks.length / rows));
  const grid = Array.from({ length: rows }, () => new Array(width).fill(null));
  marks.forEach((m, i) => { grid[i % rows][Math.floor(i / rows)] = m; });
  host.innerHTML = "";
  for (const row of grid) {
    const line = el("div", "gridrow");
    for (const cell of row) line.appendChild(el("span", "cell sm" + (cell ? " d" + cell : " empty")));
    host.appendChild(line);
  }
}

/* ------------------------------------------------------------- per shoe */

/**
 * The per-shoe view's own state: which column orders the table and how many
 * rows are on screen. Both are view state, not data -- they survive a coup
 * arriving and are reset when the table changes, because 'the fortieth row'
 * means a different shoe on a different table.
 */
let shoeSort = "order";
let shoeLimit = 40;
const SHOE_PAGE = 40;

/** Every shoe of the active table, computed once per change. */
function shoeStats() {
  if (shoeCache && shoeCache.revision === revision && shoeCache.table === state.active) {
    return shoeCache.value;
  }
  const value = shoeTable(shoes().filter((s) => s.o.length).map((s) => s.o));
  shoeCache = { revision, table: state.active, value };
  return value;
}

/** The columns, in the order they are drawn. `opt` ones fold away on a phone. */
const SHOE_COLUMNS = [
  { key: "order", label: "shoe.colShoe", opt: false },
  { key: "coups", label: "shoe.colCoups", opt: false },
  { key: "share", label: "shoe.colShare", opt: false },
  { key: "far", label: "shoe.colZ", opt: false },
  { key: "streak", label: "shoe.colStreak", opt: true },
  { key: "chop", label: "shoe.colChop", opt: true },
];

/**
 * How far the spread ratio may sit from 1 before it is worth remarking on.
 *
 * The ratio is a variance ratio, so its sampling variance is 2/(m-1) over m
 * shoes; two of those is the band drawn here. It is an approximation and it
 * is deliberately not called a verdict -- the battery below this panel is the
 * test, with all seventeen statistics and a correction across them.
 */
function spreadTolerance(shoesUsed) {
  return shoesUsed > 1 ? 2 * Math.sqrt(2 / (shoesUsed - 1)) : Infinity;
}

/**
 * Every shoe's Banker share as one dot, over the width an honest table would
 * have put them in.
 *
 * The dead band is drawn to the same scale, which is the point of the picture:
 * the band a wager has to clear is 1.28 percentage points wide, and honest
 * shoes scatter across thirty. Anyone reading a single shoe is reading that
 * scatter.
 */
function renderShoeStrip(rows, summary) {
  const LO = 0.25, HI = 0.75, W = 720, H = 150;
  const x = (q) => ((q - LO) / (HI - LO)) * (W - 90) + 45;
  const svg = $("shoeStrip");
  const css = getComputedStyle(document.documentElement);
  const C = (n) => css.getPropertyValue(n).trim();

  const yBand = 26, hBand = 56, yBottom = yBand + hBand;
  const yAxis = 116, yTick = 131, yCaption = H - 4;
  const p = [];

  const half = Z_FLAG * summary.bandSe;
  const bandLo = Math.max(LO, BASE_BANKER_SHARE - half);
  const bandHi = Math.min(HI, BASE_BANKER_SHARE + half);
  p.push(`<rect x="${x(bandLo)}" y="${yBand}" width="${x(bandHi) - x(bandLo)}" height="${hBand}" fill="${C("--band")}" rx="3"/>`);
  p.push(`<text x="${x(bandLo) + 7}" y="${yBottom - 7}" font-size="10.5" fill="${C("--ink-2")}">${t("shoe.stripBand")}</text>`);

  // The dead band, drawn to the same scale as the scatter. That is the whole
  // picture: the width a wager has to clear is this notch, and honest shoes
  // land anywhere in the grey.
  const xDead = x(PLAYER_BREAKEVEN), wDead = Math.max(2, x(BANKER_BREAKEVEN) - xDead);
  p.push(`<rect x="${xDead}" y="${yBand}" width="${wDead}" height="${hBand}" fill="${C("--surface")}" stroke="${C("--ink-3")}" stroke-width="0.9"/>`);
  const xMid = xDead + wDead / 2;
  p.push(`<line x1="${xMid}" y1="${yBottom}" x2="${xMid}" y2="${yBottom + 9}" stroke="${C("--ink-3")}" stroke-width="0.9"/>`);
  p.push(`<text x="${xMid}" y="${yBottom + 21}" text-anchor="middle" font-size="10.5" fill="${C("--ink-2")}">${t("shoe.stripDead")} ${pct(BANKER_BREAKEVEN - PLAYER_BREAKEVEN, 2)}p</text>`);

  p.push(`<line x1="${x(BASE_BANKER_SHARE)}" y1="${yBand - 4}" x2="${x(BASE_BANKER_SHARE)}" y2="${yBottom}" stroke="${C("--accent")}" stroke-width="1" stroke-dasharray="3 3"/>`);
  p.push(`<text x="${x(BASE_BANKER_SHARE)}" y="${yBand - 9}" text-anchor="middle" font-size="10" class="m" fill="${C("--accent")}">${t("shoe.stripFair")} ${pct(BASE_BANKER_SHARE, 2)}</text>`);

  // One dot per shoe, spread down the band so equal shares do not hide, and
  // clear of the label sitting along its floor.
  const clamp = (q) => Math.min(HI, Math.max(LO, q));
  for (const r of rows) {
    if (!Number.isFinite(r.q)) continue;
    const far = Math.abs(r.z) >= Z_FLAG;
    const cx = x(clamp(r.q));
    const cy = yBand + 7 + ((r.index * 37) % (hBand - 27));
    const col = r.q > BANKER_BREAKEVEN ? C("--banker")
              : r.q < PLAYER_BREAKEVEN ? C("--player") : C("--ink-3");
    p.push(`<circle cx="${cx}" cy="${cy.toFixed(1)}" r="${far ? 3.4 : 2.6}" fill="${col}" fill-opacity="${far ? 0.95 : 0.55}"${far ? ` stroke="${C("--surface")}" stroke-width="1"` : ""}/>`);
  }

  p.push(`<line x1="${x(LO)}" y1="${yAxis}" x2="${x(HI)}" y2="${yAxis}" stroke="${C("--line-2")}" stroke-width="1"/>`);
  for (const q of [0.3, 0.4, 0.5, 0.6, 0.7]) {
    p.push(`<line x1="${x(q)}" y1="${yAxis}" x2="${x(q)}" y2="${yAxis + 4}" stroke="${C("--line-2")}"/>`);
    p.push(`<text x="${x(q)}" y="${yTick}" text-anchor="middle" font-size="10" class="m" fill="${C("--ink-3")}">${(q * 100).toFixed(0)}%</text>`);
  }
  p.push(`<text x="${W / 2}" y="${yCaption}" text-anchor="middle" font-size="10.5" fill="${C("--ink-3")}">${t("shoe.stripAxis")}</text>`);

  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = p.join("");
}

function renderShoeFacts(summary) {
  const box = $("shoeFacts");
  box.innerHTML = "";
  const sp = summary.spread;
  const tiles = [
    {
      k: t("shoe.factShoes"), v: summary.shoes.toLocaleString(),
      s: t("shoe.factShoesSub", {
        coups: summary.coups.toLocaleString(), decided: summary.decided.toLocaleString(),
      }),
    },
    {
      k: t("shoe.factBand"),
      v: Number.isFinite(summary.bandSe) ? "±" + pct(Z_FLAG * summary.bandSe, 2) : "—",
      s: Number.isFinite(summary.bandSe)
        ? t("shoe.factBandSub", { n: summary.meanDecided.toFixed(0) })
        : t("state.pending"),
    },
    {
      k: t("shoe.factOutside"), v: summary.scored ? String(summary.outside) : "—",
      s: summary.scored
        ? t("shoe.factOutsideSub", { expected: summary.expectedOutside.toFixed(1) })
        : t("state.pending"),
    },
    {
      k: t("shoe.factSpread"),
      v: Number.isFinite(sp.ratio) ? sp.ratio.toFixed(2) + "×" : "—",
      s: Number.isFinite(sp.ratio)
        ? t("shoe.factSpreadSub", { sd: pct(sp.sd, 2), expected: pct(sp.expected, 2) })
        : t("state.pending"),
    },
  ];
  for (const tile of tiles) {
    const d = el("div", "tile");
    d.appendChild(el("div", "k", tile.k));
    d.appendChild(el("div", "v", tile.v));
    d.appendChild(el("div", "s", tile.s));
    box.appendChild(d);
  }
}

function renderShoeVerdict(summary) {
  const note = $("shoeVerdict");
  const sp = summary.spread;
  if (!Number.isFinite(sp.ratio)) {
    note.className = "verdict neutral";
    note.innerHTML = t("shoe.verdictThin", { n: summary.shoes.toLocaleString() });
    return;
  }
  const tol = spreadTolerance(sp.shoes);
  const off = sp.ratio - 1;
  if (Math.abs(off) <= tol) {
    note.className = "verdict neutral";
    note.innerHTML = t("shoe.verdictClean", {
      outside: summary.outside, expected: summary.expectedOutside.toFixed(1),
    });
    return;
  }
  note.className = "verdict flag";
  note.innerHTML = t(off > 0 ? "shoe.verdictWide" : "shoe.verdictTight", {
    ratio: sp.ratio.toFixed(2), tol: tol.toFixed(2),
  });
}

function renderShoeRows(rows, openIndex) {
  const head = $("shoeTable").tHead;
  head.innerHTML = "";
  const tr = el("tr");
  for (const col of SHOE_COLUMNS) {
    const th = el("th", col.opt ? "opt" : null);
    if (shoeSort === col.key) th.setAttribute("aria-sort", "descending");
    const label = t(col.label);
    const button = el("button", null, label);
    button.type = "button";
    button.setAttribute("aria-label", t("shoe.sortAria", { col: label }));
    if (shoeSort === col.key) button.appendChild(el("span", "caret", "▾"));
    button.onclick = () => { shoeSort = col.key; render(); };
    th.appendChild(button);
    tr.appendChild(th);
  }
  head.appendChild(tr);

  const body = $("shoeTable").tBodies[0];
  body.innerHTML = "";
  for (const r of rows) {
    const far = Math.abs(r.z) >= Z_FLAG;
    const thin = r.n < MIN_SHOE_COUPS;
    const row = el("tr", [r.index === openIndex ? "open" : "", far && !thin ? "far" : ""]
      .filter(Boolean).join(" ") || null);

    const name = el("td", null, "#" + (r.index + 1));
    if (r.index === openIndex) name.append(" " + t("shoe.open"));
    row.appendChild(name);

    const counts = el("td");
    counts.appendChild(el("small", null,
      `${mark("B")}${r.banker} ${mark("P")}${r.player} ${mark("T")}${r.ties}`));
    counts.appendChild(el("span", "n", String(r.coups)));
    row.appendChild(counts);

    const lean = r.q > BANKER_BREAKEVEN ? "q b" : r.q < PLAYER_BREAKEVEN ? "q p" : "q";
    row.appendChild(el("td", lean, Number.isFinite(r.q) ? pct(r.q, 1) : "—"));

    row.appendChild(el("td", thin ? "z mut" : "z",
      thin ? t("shoe.thinRow")
      : Number.isFinite(r.z) ? `${r.z >= 0 ? "+" : "−"}${Math.abs(r.z).toFixed(2)}σ` : "—"));

    row.appendChild(el("td", "opt", r.longest ? String(r.longest) : "—"));
    row.appendChild(el("td", "opt", Number.isFinite(r.chop) ? pct(r.chop, 0) : "—"));
    body.appendChild(row);
  }
}

function renderShoes() {
  const { rows, summary } = shoeStats();
  // The shoe still being dealt is the last one, and only while it is open.
  const list = shoes();
  const last = list[list.length - 1];
  const openIndex = last && !last.closed && last.o.length ? rows.length - 1 : -1;

  $("shoeEmpty").hidden = rows.length > 0;
  $("shoePanel").querySelector(".shoescroll").hidden = rows.length === 0;
  // `hidden` is an HTMLElement property; on an SVG element it sets a plain
  // JavaScript field that reflects to no attribute, so CSS never sees it and
  // the drawing stays on screen. The attribute has to be set directly.
  $("shoeStrip").toggleAttribute("hidden", summary.scored < MIN_SHOES);

  renderShoeFacts(summary);
  renderShoeVerdict(summary);
  if (summary.scored >= MIN_SHOES) renderShoeStrip(rows, summary);

  if (!rows.length) {
    $("shoeTable").tHead.innerHTML = "";
    $("shoeTable").tBodies[0].innerHTML = "";
    $("shoeShown").textContent = "";
    $("shoeMore").hidden = true;
    return;
  }

  const ordered = sortRows(rows, shoeSort);
  const shown = Math.min(shoeLimit, ordered.length);
  renderShoeRows(ordered.slice(0, shown), openIndex);

  $("shoeShown").textContent = t("shoe.shown", {
    shown: shown.toLocaleString(), total: ordered.length.toLocaleString(),
    sort: t((SHOE_COLUMNS.find((c) => c.key === shoeSort) || SHOE_COLUMNS[0]).label),
  });
  $("shoeMore").hidden = shown >= ordered.length;
}

function renderMilestones() {
  // Counted in whole shoes' worth, the unit the milestones were measured in.
  // A shoe caught part-way through is part of one, and says so underneath.
  const held = shoes().filter((s) => s.o.length).map((s) => s.o);
  const worth = wholeShoes(held);
  const n = Math.floor(worth + 1e-9);
  const pieces = held.filter((s) => s.length < SHOE_MIN).length;
  const note = $("collectPieces");
  note.hidden = !pieces;
  if (pieces) {
    note.textContent = t("collect.pieces", {
      n: pieces, total: held.length, worth: n.toLocaleString(),
    });
  }
  const box = $("milestones");
  box.innerHTML = "";
  for (const m of MILESTONES) {
    const done = n >= m.shoes;
    const row = el("div", "ms" + (done ? " done" : ""));
    const head = el("div", "msrow");
    head.appendChild(el("span", "msname",
      t("collect.msLabel", { label: t("collect." + m.key), bias: pct(m.bias, 2) })));
    head.appendChild(el("span", "msnum",
      t("collect.msCount", { have: n.toLocaleString(), need: m.shoes.toLocaleString() })));
    row.appendChild(head);
    const track = el("div", "track");
    const fill = el("i");
    fill.style.width = Math.min(100, (n / m.shoes) * 100) + "%";
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("div", "msnote", t("collect." + m.key + "note")));
    box.appendChild(row);
  }
}

/* ------------------------------------------------------------- integrity */

/** Keep a verdict only where it still describes what is on screen. */
function renderIntegrityStanding() {
  const stale = $("intStale");
  const panel = $("intResult");
  const now = shoes().reduce((a, sh) => a + sh.o.length, 0);
  const standing = verdictStanding(integrityShown, state.active, now, !!integrityRun);

  if (standing === "none" || standing === "running") { stale.hidden = true; return; }
  if (standing === "other") { panel.hidden = true; stale.hidden = true; return; }

  // Back on the table it was measured for, so it is worth seeing again.
  panel.hidden = false;
  stale.hidden = standing !== "stale";
  if (standing === "stale") {
    stale.innerHTML = t("int.stale", {
      shoes: integrityShown.shoes.toLocaleString(),
      coups: integrityShown.coups.toLocaleString(),
      now: now.toLocaleString(),
    });
  }
}

function renderIntegrityAvailability() {
  renderIntegrityStanding();
  const n = shoes().filter((s) => s.o.length).length;
  const btn = $("runIntegrity");
  btn.disabled = n < 3 || !!integrityRun;
  $("intHint").textContent = n < 3
    ? t("int.needShoes", { n })
    : t("int.ready", { n, reps: $("reps").value });
}

async function runIntegrity() {
  const list = shoes().filter((s) => s.o.length).map((s) => s.o);
  if (list.length < 3) return;

  const reps = Number($("reps").value);
  integrityRun = { cancelled: false };
  renderIntegrityAvailability();
  $("intProgress").hidden = false;
  $("intResult").hidden = true;

  const bar = $("intBar"), label = $("intProgressLabel");
  const key = nullKey(list, reps);
  let samples = nullCache.get(key);

  if (!samples) {
    label.textContent = t("int.building");
    samples = await simulatedNull(nullShape(list), {
      nReplicates: reps,
      onProgress: (done, total) => {
        bar.style.width = (done / total) * 100 + "%";
        label.textContent = t("int.progress", {
          done, total, shoes: (done * list.length).toLocaleString(),
        });
      },
      shouldStop: () => integrityRun?.cancelled,
    });
    if (!samples) { integrityRun = null; $("intProgress").hidden = true; renderIntegrityAvailability(); return; }
    nullCache.set(key, samples);
    while (nullCache.size > NULLS_KEPT) nullCache.delete(nullCache.keys().next().value);
  }

  lastReport = integrityReport(list, samples, { nReplicates: reps });
  const report = lastReport;
  integrityRun = null;
  $("intProgress").hidden = true;
  renderIntegrityResult(report);
  renderIntegrityAvailability();
}

/**
 * The corpus a verdict on screen was measured over.
 *
 * The panel prints a verdict, a findings table and the shoes it covered, and
 * none of it says which table. So a result left up after the selector moved
 * read as a verdict about the table now on screen -- a run over nine shoes
 * sat above a table with four. A different table gets it cleared; the same
 * table that has since collected more coups keeps it, with a line saying what
 * it was actually measured over.
 */
let integrityShown = null;

/**
 * The seventeen statistics, each against the band an honest shoe stays inside.
 *
 * Shared by the verdict for this device and the one for the shared record:
 * they are the same battery over different corpora, and a reader comparing two
 * charts drawn by two functions would be reading the difference between the
 * functions as a difference between the tables.
 */
function renderFindings(host, rep) {
  host.innerHTML = "";
  const Z = 4.2, W = 200, MID = 11;
  const zx = (z) => ((Math.max(-Z, Math.min(Z, z)) + Z) / (2 * Z)) * W;

  const legend = el("div", "flegend");
  legend.innerHTML =
    `<span><i class="swatch band"></i>${t("int.legendBand")}</span>` +
    `<span><i class="swatch dot"></i>${t("int.legendDot")}</span>` +
    `<span class="m">${t("int.legendAxis", { z: Z })}</span>`;
  host.appendChild(legend);

  for (const f of rep.findings) {
    const adj = rep.corrections[f.statistic] || {};
    const flagged = !!adj.significant_bh;
    const row = el("div", "find" + (flagged ? " flagged" : ""));

    const name = el("div", "fname");
    name.appendChild(el("span", "t", statLabel(f.statistic)));
    name.title = statWhy(f.statistic);
    row.appendChild(name);

    const offScale = Math.abs(f.z) > Z;
    const cx = zx(f.z);
    const mark = offScale
      ? `<path d="${f.z > 0 ? `M${W - 11} ${MID - 5.5} L${W - 1.5} ${MID} L${W - 11} ${MID + 5.5} Z`
                            : `M11 ${MID - 5.5} L1.5 ${MID} L11 ${MID + 5.5} Z`}" fill="var(--accent)"/>`
      : `<circle cx="${cx}" cy="${MID}" r="4.5" fill="${flagged ? "var(--accent)" : "var(--ink-2)"}" stroke="var(--surface)" stroke-width="1.5"/>`;
    const plot = el("div", "fplot");
    plot.innerHTML =
      `<svg viewBox="0 0 ${W} 22" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
         <rect x="${zx(-1.96)}" y="7" width="${zx(1.96) - zx(-1.96)}" height="8" rx="4" fill="var(--band)"/>
         <line x1="${zx(0)}" y1="4" x2="${zx(0)}" y2="18" stroke="var(--line-2)" stroke-width="1"/>
         ${mark}
       </svg>`;
    plot.title = offScale ? t("int.offAxis", { z: f.z.toFixed(2) }) : `z = ${f.z.toFixed(2)}`;
    row.appendChild(plot);

    const num = el("div", "fnum");
    num.appendChild(el("span", "z", (f.z >= 0 ? "+" : "") + f.z.toFixed(2)));
    num.appendChild(el("span", "p", "p " + adj.p_bh?.toFixed(3)));
    row.appendChild(num);

    row.appendChild(el("div", "fstate", t(flagged ? "int.abnormal" : "int.normal")));
    host.appendChild(row);
  }

}

function renderIntegrityResult(rep) {
  integrityShown = { table: state.active, shoes: rep.n_shoes, coups: rep.n_games };
  $("intResult").hidden = false;
  const v = $("intVerdict");
  v.className = "verdict " + (rep.verdict_kind === "flag" ? "flag" : rep.verdict_kind === "clean" ? "ok" : "neutral");
  const kind = rep.verdict_kind;
  const headline = t({ flag: "int.headFlag", clean: "int.headClean", insufficient: "int.headInsufficient" }[kind]);
  const body = {
    flag: () => t("int.verdictFlag", {
      n: rep.flagged.length, total: rep.findings.length,
      names: rep.flagged.map(statLabel).join(", "),
    }),
    clean: () => t("int.verdictClean", {
      total: rep.findings.length, shoes: rep.n_shoes.toLocaleString(),
      gap: pct(rep.breakeven_gap, 2),
    }),
    insufficient: () => t("int.verdictInsufficient", {
      total: rep.findings.length, shoes: rep.n_shoes.toLocaleString(),
      bias: pct(rep.detectable_bias, 2), gap: pct(rep.breakeven_gap, 2),
      need: rep.shoes_needed.toLocaleString(),
    }),
  }[kind]();
  v.innerHTML = `<b>${headline}.</b> ${body}`;

  renderFindings($("intFindings"), rep);

  $("intMeta").textContent = t("int.meta", {
    shoes: rep.n_shoes.toLocaleString(), coups: rep.n_games.toLocaleString(),
    stats: rep.findings.length, reps: rep.n_replicates,
  });
}

/**
 * What the server's copy of the forward record says.
 *
 * Asked rather than streamed, because it is a thing somebody looks at between
 * sessions and not a number that has to move while they watch. Scoped to no
 * shoe: the question is how the app has done over everything it ever called at
 * this address, which is the only scale at which the answer could mean
 * anything -- and it takes tens of thousands of settled calls before it does.
 */
function bindSharedScore() {
  const button = $("sharedScoreAsk");
  if (!button) return;
  button.onclick = async () => {
    const base = readServer();
    const note = $("sharedScoreNote");
    if (!base) { note.textContent = t("calls.needAddress"); return; }

    button.disabled = true;
    note.textContent = t("calls.asking");
    try {
      renderSharedScore(await fetchScore(base));
      note.textContent = "";
    } catch (e) {
      note.innerHTML = e instanceof ShareError && e.kind === "auth"
        ? t(authKey())
        : t("pooled.server", { why: String((e && e.message) || e) });
    } finally {
      button.disabled = false;
    }
  };
}

function renderSharedScore(score) {
  const rows = $("sharedScoreRows");
  const count = $("sharedScoreCount");
  rows.innerHTML = "";
  const models = score.models || [];
  const settled = models.reduce((n, m) => n + (m.settled || 0), 0);

  count.textContent = score.unsettled
    ? t("calls.pending", { n: score.unsettled.toLocaleString() })
    : "";

  if (!settled) {
    rows.innerHTML = `<p class="ainote">${t("calls.none")}</p>`;
    return;
  }

  for (const book of models) {
    const row = el("div", "verifyrow");
    row.appendChild(el("span", "", t("calls.row", {
      model: `${book.model} ${book.version}`,
      settled: (book.settled || 0).toLocaleString(),
      called: (book.called || 0).toLocaleString(),
      hits: (book.hits || 0).toLocaleString(),
    })));
    // A rate over no calls is nothing, not zero -- the same rule the panel
    // above this one follows, and the reason `/score` sends null for it.
    row.appendChild(el("span", "", book.hit_rate === null || book.hit_rate === undefined
      ? "—" : t("calls.rate", { rate: pct(book.hit_rate, 2) })));
    rows.appendChild(row);
  }

  // Said with the number every time, because a hit rate over a few hundred
  // calls is the most convincing meaningless figure this app can produce.
  rows.appendChild(el("p", "aiwarn", t("calls.tooFew", { n: settled.toLocaleString() })));
}

/* ------------------------------------------------------ the shared record */

/**
 * Asking the pooled record the same question, over everybody's coups.
 *
 * The verdict above it is this device's, and for one person it is almost
 * always "nothing found, and not enough to mean anything" -- a few hundred
 * coups rules almost nothing in or out. Pooling is the answer to that, and a
 * record you can push to but never ask is a record nobody can act on. So this
 * asks, and shows the answer *beside* the local one rather than instead of it:
 * they are two different corpora and merging them into one number would hide
 * which is which.
 *
 * The cheap call goes first. `/tables` says how much the record holds and
 * answers at once; the battery simulates a null from scratch and takes about
 * half a minute. A reader whose table has two shoes pooled should be told that
 * immediately, not after thirty seconds of work that was always going to end
 * in a refusal.
 */
let pooledRun = null;
let pooledShown = null;

/** The minimum both batteries take. Said here because the note names it. */
const POOLED_MIN_SHOES = 3;

/** "Not signed in", or the reason signing in will not help. */
function authKey() {
  return needsTls(readServer()) ? "pooled.authTls" : "pooled.auth";
}

function pooledSay(key, vars) {
  $("pooledNote").innerHTML = key ? t(key, vars) : "";
}

/**
 * A pooled verdict is about one table, and nothing on it says which.
 *
 * Same trap as the local one: left up after the selector moved, a verdict over
 * two hundred shoes sits above a table with four and reads as that table's.
 * A different table hides it rather than restating it, because unlike the
 * local verdict this one cannot be recomputed from anything in the browser.
 */
function renderPooledStanding() {
  if (pooledShown && pooledShown.table !== state.active) {
    $("pooledResult").hidden = true;
    pooledSay(null);
    pooledShown = null;
  }
  $("runPooled").disabled = !!pooledRun || !state.active;
  $("pooledHint").textContent = readServer() ? "" : t("pooled.noServer");
}

async function runPooledIntegrity() {
  if (pooledRun) return;

  const table = state.active;
  const base = readServer();
  if (!base) { pooledSay("pooled.noServer"); return; }
  if (!table) return;

  const reps = Number($("reps").value);
  const control = typeof AbortController === "function" ? new AbortController() : null;
  pooledRun = control;
  $("cancelPooled").hidden = false;
  $("pooledResult").hidden = true;
  pooledSay("pooled.asking");
  renderPooledStanding();

  try {
    const tables = await fetchTables(base, { signal: control?.signal });
    const row = tables.find((r) => r.table === table);
    if (!row || !row.shoes) { pooledSay("pooled.absent", { table }); return; }
    if (!row.testable) {
      pooledSay("pooled.tooFew", {
        table, shoes: row.shoes, coups: row.coups, need: POOLED_MIN_SHOES,
      });
      return;
    }

    pooledSay("pooled.running", { table });
    const body = await fetchIntegrity(base, table, { replicates: reps, signal: control?.signal });
    if (control?.signal.aborted) return;
    renderPooledResult(adoptReport(body), table);
    pooledSay(null);
  } catch (e) {
    if (e && e.name === "AbortError") { pooledSay(null); return; }
    if (e instanceof ShareError) {
      if (e.kind === "auth") pooledSay(authKey());
      else if (e.kind === "network") pooledSay("pooled.network", { why: e.message });
      // The battery refuses below three shoes with a 422. `/tables` above
      // should have caught that already; this is here for the case where
      // somebody deleted shoes between the two calls, which is exactly the
      // sort of thing a shared record does.
      else if (e.status === 422) {
        pooledSay("pooled.tooFew", { table, shoes: 0, coups: 0, need: POOLED_MIN_SHOES });
      } else pooledSay("pooled.server", { why: e.message });
    } else {
      pooledSay("pooled.server", { why: String((e && e.message) || e) });
    }
  } finally {
    pooledRun = null;
    $("cancelPooled").hidden = true;
    renderPooledStanding();
  }
}

function renderPooledResult(rep, table) {
  pooledShown = { table };
  $("pooledResult").hidden = false;

  const v = $("pooledVerdict");
  const kind = rep.verdict_kind;
  v.className = "verdict " + (kind === "flag" ? "flag" : kind === "clean" ? "ok" : "neutral");
  const shoes = rep.n_shoes, coups = rep.n_games;
  const headline = t({ flag: "int.headFlag", clean: "int.headClean",
                       insufficient: "int.headInsufficient" }[kind]);
  const body = kind === "flag"
    ? t("pooled.verdictFlag", {
        shoes, coups, n: rep.flagged.length, total: rep.findings.length,
        names: rep.flagged.map(statLabel).join(", "),
      })
    : kind === "clean"
    ? t("pooled.verdictClean", {
        shoes, coups, total: rep.findings.length, gap: pct(rep.breakeven_gap, 2),
      })
    // Measured power that reaches 80% against nothing at all is a different
    // statement from "it would take about this many more", and saying the
    // second when the server said the first would invent a number.
    : rep.detectable_bias === null || rep.shoes_needed === null
    ? t("pooled.verdictUnpowered", { shoes, coups, total: rep.findings.length })
    : t("pooled.verdictInsufficient", {
        shoes, coups, total: rep.findings.length,
        bias: pct(rep.detectable_bias, 2), gap: pct(rep.breakeven_gap, 2),
        need: rep.shoes_needed,
      });
  v.innerHTML = `<b>${headline}.</b> ${body}`;

  // Shoes much shorter than a shoe are the ordinary way a pooled corpus is
  // uneven -- several people each starting to watch part-way through. A server
  // that deals its null to the record's shape says so, and then the pieces were
  // measured against pieces; one that does not measured them against whole
  // shoes, which moves the shape statistics with nothing wrong in the shuffle.
  const shape = $("pooledShape");
  const uneven = rep.shape && rep.shape.coups_per_shoe_min < 60;
  shape.hidden = !uneven;
  if (uneven) {
    shape.textContent = t(rep.shape.null_matched ? "pooled.shapeMatched" : "pooled.shape", {
      mean: rep.shape.coups_per_shoe_mean,
      min: rep.shape.coups_per_shoe_min,
      max: rep.shape.coups_per_shoe_max,
    });
  }

  renderFindings($("pooledFindings"), rep);
  $("pooledMeta").textContent = t("pooled.meta", {
    shoes, coups, stats: rep.findings.length, reps: rep.n_replicates,
  });
}

/**
 * Hand the file to the viewer, by whichever route this page has.
 *
 * Inside the artifact viewer a page cannot start its own download, so the
 * platform capability is the only way; served as an ordinary page -- from
 * GitHub Pages or from the desktop server -- a plain download link works and
 * is one step shorter. The textarea is the last resort, so the data is never
 * simply unreachable.
 */
async function download(filename, data) {
  const note = $("exportNote");
  const ingest = `python -m baccarat ingest ${filename} --save mydata`;

  try {
    const dl = await window.claude?.use?.("downloads");
    if (dl) {
      await dl.save({ filename, data });
      note.textContent = t("tools.exportRequested", { file: filename, cmd: ingest });
      return;
    }
  } catch (e) {
    note.textContent = e?.code === "declined"
      ? t("tools.exportDeclined")
      : t("tools.exportFailed", { code: e?.code || t("tools.error") });
    return;
  }

  try {
    const blob = new Blob([data], { type: filename.endsWith(".csv") ? "text/csv" : "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    note.textContent = t("tools.exportSaved", { file: filename, cmd: ingest });
  } catch {
    note.textContent = t("tools.exportBlocked");
    $("exportDump").hidden = false;
    $("exportDump").value = data;
  }
}

function bindPaste() {
  const zone = $("drop");

  const readImageFile = (file) => {
    if (!file || !file.type.startsWith("image/")) return false;
    // A pasted image is an unambiguous request for the paste surface -- unless
    // a live feed is running, which is the more current source of truth.
    if (!live?.active) setMode("paste");
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { handleImage(img); URL.revokeObjectURL(url); };
    img.src = url;
    return true;
  };

  document.addEventListener("paste", (e) => {
    const items = [...(e.clipboardData?.items || [])];
    const image = items.find((i) => i.type.startsWith("image/"));
    if (image) { e.preventDefault(); readImageFile(image.getAsFile()); return; }
    const text = e.clipboardData?.getData("text");
    const tag = (e.target.tagName || "").toLowerCase();
    if (text && tag !== "input" && tag !== "textarea") {
      const { sequence } = parseSequenceText(text);
      if (sequence.length >= 4) { e.preventDefault(); $("textIn").value = text; $("textIn").focus(); }
    }
  });

  zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave", () => zone.classList.remove("over"));
  zone.addEventListener("drop", (e) => {
    e.preventDefault(); zone.classList.remove("over");
    const dropped = e.dataTransfer?.files || [];
    if (dropped.length > 1) importPhotos(dropped); else readImageFile(dropped[0]);
  });
  $("pickFile").addEventListener("click", () => $("filePick").click());
  $("filePick").addEventListener("change", (e) => {
    readImageFile(e.target.files?.[0]);
    e.target.value = "";            // so picking the same photo twice still fires
  });
  $("pickMulti").addEventListener("click", () => $("filePickMulti").click());
  $("filePickMulti").addEventListener("change", (e) => {
    importPhotos(e.target.files || []);
    e.target.value = "";
  });
  $("pickClipboard").hidden = !navigator.clipboard?.read;
  $("pickClipboard").addEventListener("click", importClipboard);

  // Drag a box on the capture to tell the detector where to look.
  const view = $("shotCanvas");
  let start = null;
  view.addEventListener("pointerdown", (e) => {
    if (!shot) return;
    const r = view.getBoundingClientRect();
    start = { x: (e.clientX - r.left) * (shot.width / r.width), y: (e.clientY - r.top) * (shot.height / r.height) };
    view.setPointerCapture(e.pointerId);
  });
  view.addEventListener("pointerup", (e) => {
    if (!shot || !start) return;
    const r = view.getBoundingClientRect();
    const end = { x: (e.clientX - r.left) * (shot.width / r.width), y: (e.clientY - r.top) * (shot.height / r.height) };
    const region = {
      x: Math.min(start.x, end.x), y: Math.min(start.y, end.y),
      w: Math.abs(end.x - start.x), h: Math.abs(end.y - start.y),
    };
    start = null;
    if (region.w > 30 && region.h > 30) rerunDetection(region);
  });
}


/**
 * The button that sends this browser's corpus to a shared record.
 *
 * Explicit and one-way. Nothing is read back and nothing local changes, so the
 * worst a failed send costs is a sentence -- the corpus is still here, and the
 * page still works with no server at all, which is the version that runs at a
 * table on one phone.
 */
function bindShare() {
  const field = $("shareServer");
  const button = $("sharePush");
  const note = $("shareNote");
  if (!field || !button || !note) return;

  field.value = readServer();
  field.onchange = () => {
    try {
      const clean = normaliseServer(field.value);
      field.value = clean;
      saveServer(clean);
      note.textContent = "";
    } catch {
      note.textContent = t("share.badAddress");
    }
    renderCallsNote();
  };

  const calls = $("shareCalls");
  if (calls) {
    recordingCalls = readCallsFlag();
    calls.checked = recordingCalls;
    calls.onchange = () => {
      recordingCalls = calls.checked;
      saveCallsFlag(recordingCalls);
      renderCallsNote();
    };
  }
  renderCallsNote();
  bindSharedScore();

  button.onclick = async () => {
    // The example corpus is there to show the page working, and it is nobody's
    // table. Putting it in a record several people measure a shuffle from is
    // the one way this button could do real harm.
    if (state.isExample) { note.textContent = t("share.example"); return; }

    let base;
    try {
      base = normaliseServer(field.value);
    } catch {
      note.textContent = t("share.badAddress");
      return;
    }
    if (!base) { note.textContent = t("share.noAddress"); return; }
    saveServer(base);

    const jobs = shoesToSend(state.tables);
    if (!jobs.length) { note.textContent = t("share.nothing"); return; }

    button.disabled = true;
    note.textContent = t("share.sending", { done: 0, total: jobs.length });
    try {
      const report = await pushCorpus(base, state.tables, {
        onProgress: (done, total) => {
          note.textContent = t("share.sending", { done, total });
        },
      });
      note.textContent = shareSummary(report, base);
    } catch (e) {
      note.textContent = e instanceof ShareError && e.kind === "auth"
        ? t("share.auth", { url: base })
        : t("share.unreachable");
    } finally {
      button.disabled = false;
    }
  };
}

/** What a push did, in the terms somebody would ask about it. */
function shareSummary(report, base) {
  if (report.stopped === "auth") return t("share.auth", { url: base });
  if (report.stopped === "address") return t("share.badAddress");
  if (report.stopped === "network" && !report.sent) return t("share.unreachable");

  let text = t("share.done", {
    sent: report.sent, shoes: report.shoes,
    added: report.added, same: report.alreadyThere,
  });
  if (report.conflicts.length) {
    // Named, not merely counted: "coup 4 of HANN, the record says P and this
    // device says B" is something a person can go and check, and a number on
    // its own is not.
    const c = report.conflicts[0];
    text += t("share.conflicts", {
      n: report.conflicts.length, table: c.table, coup: c.hand_number,
      stored: c.stored, sent: c.sent,
    });
  }
  if (report.failures.length) {
    text += t("share.failed", {
      n: report.failures.length,
      // One reason, not a list of the same reason repeated. Whatever stopped
      // the first shoe stopped the rest.
      why: report.failures[0].why,
    });
  }
  if (report.stopped === "cancelled" || report.stopped === "network") {
    text += t("share.cancelled");
  }
  return text;
}

function bindControls() {
  $("shoeMore").onclick = () => { shoeLimit += SHOE_PAGE; render(); };

  $("tableSel").onchange = (e) => {
    // The blank option is a value, not a gap: choosing it means no table, and
    // the panels go empty until something is started.
    state.active = e.target.value || null;
    discardPendingReadings();
    shoeLimit = SHOE_PAGE;          // row 40 is a different shoe on another table
    invalidate();
    store.save(state, []);
    render();
  };
  $("addTable").onclick = () => {
    const name = cleanTableName(prompt(t("header.newTablePrompt")));
    if (!name) return;
    beforeWriting();
    state.tables[name] ||= { shoes: [] };
    state.active = name;
    invalidate();
    store.save(state, []);
    render();
  };

  /**
   * Rename the table being shown.
   *
   * Everything a table owns is keyed by its name -- the shoes, the ledger mark,
   * the selector, and the reader's note of which table it started on -- so a
   * rename is a move of all of it at once. Rebuilt in order rather than
   * deleted-and-added, because the selector is drawn in insertion order and a
   * renamed table jumping to the bottom of the list reads as a different one.
   */
  $("renameTable").onclick = () => {
    const from = state.active;
    if (!from || !state.tables[from]) return;      // nothing selected to rename
    // Through the same rule a typed name goes through anywhere else: the CSV
    // export is a file people open in a spreadsheet.
    const to = cleanTableName(prompt(t("header.renamePrompt", { table: from }), from));
    if (!to || to === from) return;
    if (Object.prototype.hasOwnProperty.call(state.tables, to)) {
      flashNote(t("header.renameTaken", { name: to }));
      return;
    }
    state.tables = Object.fromEntries(Object.entries(state.tables)
      .map(([name, table]) => [name === from ? to : name, table]));
    state.active = to;
    // The reader is watching a screen, not a name. It has to come along, or
    // the next coup it reads is filed under a table that no longer exists and
    // falls back to whichever one is selected.
    if (liveTable === from) liveTable = to;
    // And so does its record, or the table arrives at its new name having
    // predicted nothing.
    renamePredictions(predictionLog, from, to);
    store.saveLog(predictionLog);
    learners.rename(from, to);
    beforeWriting();
    invalidate();
    store.save(state, []);
    render();
  };

  for (const side of ["P", "B", "T"]) $("key" + side).onclick = () => addOutcomes(side);
  $("keyUndo").onclick = undo;
  $("keyNew").onclick = newShoe;

  $("textAdd").onclick = () => {
    const { sequence, skipped } = parseSequenceText($("textIn").value);
    if (!sequence) { $("textNote").textContent = t("tools.textNone"); return; }
    addOutcomes(sequence);
    $("textNote").textContent = t("tools.textAdded", {
      n: sequence.length, skip: skipped ? t("tools.textSkipped", { n: skipped }) : "",
    });
    $("textIn").value = "";
  };
  $("textNew").onclick = () => {
    const { sequence } = parseSequenceText($("textIn").value);
    if (!sequence) { $("textNote").textContent = t("tools.textNone"); return; }
    loadAsNewShoe(sequence);
    $("textNote").textContent = t("tools.textLoaded", { n: sequence.length });
    $("textIn").value = "";
  };

  const langSel = $("langSel");
  for (const { code, label } of LANGS) {
    const option = el("option", null, label);
    option.value = code;
    langSel.appendChild(option);
  }
  langSel.value = currentLang();
  langSel.onchange = (e) => setLang(e.target.value);

  const themeButtons = { auto: $("themeAuto"), light: $("themeLight"), dark: $("themeDark") };
  for (const [name, button] of Object.entries(themeButtons)) button.onclick = () => setTheme(name);

  onChange(() => {
    for (const [name, button] of Object.entries(themeButtons)) {
      button.classList.toggle("on", currentTheme() === name);
    }
    langSel.value = currentLang();
    store.onStatus(store.status);
    renderAll();
  });

  $("modeLive").onclick = () => setMode("live");
  $("modePaste").onclick = () => setMode("paste");
  for (const id of ["modeLive", "modePaste"]) {
    $(id).addEventListener("keydown", (e) => {
      const next = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
      if (next === undefined && e.key !== "Home" && e.key !== "End") return;
      e.preventDefault();
      const order = ["live", "paste"];
      const at = order.indexOf(id === "modeLive" ? "live" : "paste");
      const to = e.key === "Home" ? 0
               : e.key === "End" ? order.length - 1
               : (at + next + order.length) % order.length;
      setMode(order[to], true);
    });
  }

  live = new LiveWatcher({
    onRead: onLiveRead,
    onState: onLiveState,
    intervalMs: Number($("liveInterval").value),
  });
  // A table first, so the header shows what is being filled from the moment
  // the reader starts -- which is what "press start and it begins a new one"
  // means. `beforeWriting` is the same door every other writer goes through.
  const startInto = (go) => () => {
    const made = !state.active || !state.tables[state.active];
    beforeWriting();
    if (made) { invalidate(); store.save(state, []); render(); }
    go();
  };
  $("liveStart").onclick = startInto(() => live.start());
  $("liveCamera").onclick = startInto(() => live.startCamera());
  renderLiveSources();
  $("liveStop").onclick = () => { live.stop(); liveLog(t("live.logStopped")); };
  $("liveRelock").onclick = () => {
    live.relock(); liveHolds = 0; livePinned = null; setLiveWarn(null);
    liveLog(t("live.logRelock"));
  };
  bindRegionPicker();
  $("liveInterval").onchange = (e) => live.setSampleInterval(Number(e.target.value));
  if (!LiveWatcher.supported) { live.error = "unsupported"; live._emit(); }

  // The same five actions as the manual panel, kept within thumb reach.
  for (const [id, run] of [["qbP", () => addOutcomes("P")], ["qbB", () => addOutcomes("B")],
                           ["qbT", () => addOutcomes("T")], ["qbUndo", undo], ["qbNew", newShoe]]) {
    $(id).onclick = run;
  }

  // Zeroing the tally is not deleting anything: every coup stays, and the ones
  // before the mark go on making the pick. Pressing it again counts them all
  // once more.
  $("ledgerFrom").onclick = () => {
    const entry = state.tables[state.active];
    if (!entry) return;
    if (ledgerFrom()) delete entry.from;
    else entry.from = tableCoups();
    commit([]);
  };

  $("runIntegrity").onclick = runIntegrity;
  $("reps").onchange = renderIntegrityAvailability;
  $("cancelIntegrity").onclick = () => { if (integrityRun) integrityRun.cancelled = true; };
  $("runPooled").onclick = runPooledIntegrity;
  $("cancelPooled").onclick = () => { if (pooledRun) pooledRun.abort(); };

  $("exportCsv").onclick = () => {
    const rows = corpusRows(state.tables);
    if (!rows.length) { $("exportNote").textContent = t("tools.exportEmpty"); return; }
    download(`baccarat-${new Date().toISOString().slice(0, 10)}.csv`, toCsv(rows));
  };
  $("exportJson").onclick = () => {
    const rows = corpusRows(state.tables);
    if (!rows.length) { $("exportNote").textContent = t("tools.exportEmpty"); return; }
    download(`baccarat-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(rows, null, 1));
  };

  bindShare();
  // On request only. A prediction fetched on every coup would put a network
  // round trip in front of somebody entering results at a live table, and the
  // page's own recommendation is already there without one.
  $("srvAsk").onclick = () => { askServerAI().catch(() => {}); };

  // A room id is a capability, so handing somebody the address is how a second
  // reader at the same table gets in. Without this they have to be told to
  // edit a URL by hand, which is how a room id becomes a typo and a second
  // room nobody else is in.
  // Leaving has to be possible, or being in a room is a one-way door -- and it
  // is a door this device now walks through on its own on every visit.
  $("roomLeave").onclick = () => {
    if (!room) return;
    if (!confirm(t("room.leaveConfirm", { id: room.roomId }))) return;
    // The coups already recorded stay where they are, here and in the room.
    // Leaving is about this device, not about the record.
    room.close();
    room = null;
    roomShoe = "";
    roomLocalShoe = "";
    roomHave = "";
    roomConflictRows = [];
    rememberRoom("");
    if (typeof history !== "undefined" && history.replaceState) {
      try {
        const url = new URL(location.href);
        url.searchParams.delete("room");
        history.replaceState(null, "", url.toString());
      } catch { /* nothing to rewrite */ }
    }
    renderRoom();
    renderRoomConflicts();
    flashNote(t("room.left"));
  };

  $("roomInvite").onclick = async () => {
    if (!room || !room.roomId) return;
    const link = roomUrl(location.href, room.roomId);
    try {
      await navigator.clipboard.writeText(link);
      flashNote(t("room.invited"));
    } catch {
      // No clipboard permission, or an insecure context. Showing the address
      // beats failing silently: it can still be copied by hand.
      flashNote(link);
    }
  };

  // Emptying a table is not deleting it. A table that went wrong -- a shoe read
  // off the wrong board, a session that turned out to be free play -- wants its
  // record gone and itself kept, because it is still the table in front of you
  // and it is about to be recorded again. Deleting and retyping the name gets
  // there too, and loses the name's history on the way.
  $("clearTable").onclick = async () => {
    const name = state.active;
    if (!name || !state.tables[name]) return;
    const coups = tableCoups(name);
    if (!coups) return;                       // nothing to clear
    if (!confirm(t("tools.clearConfirm", { table: name, coups: coups.toLocaleString() }))) {
      return;
    }
    const ids = shoes(name).map((s) => s.id);
    if (liveTable === name) { live.stop(); liveLog(t("live.logStopped")); }
    // The same reasoning as deleting: a prediction log whose coups are gone
    // holds figures nothing can be checked against.
    forgetPredictions(predictionLog, name);
    store.saveLog(predictionLog);
    learners.forget(name);
    state.tables[name] = { shoes: [] };
    // Coups still owed to the room are owed no longer -- they belong to shoes
    // that no longer exist here, and sending them would put this device's
    // deleted record into everybody else's.
    for (const id of ids) roomQueue?.forget(roomShoeIdFor(id));
    roomHave = "";
    // An example is not a table anybody collected, so clearing it means
    // leaving the example behind rather than emptying it in place.
    state.isExample = false;
    await store.deleteShoes(ids);
    commit([]);
  };

  $("resetBtn").onclick = async () => {
    if (!state.active || !state.tables[state.active]) return;   // nothing to delete
    if (!confirm(t("tools.resetConfirm", { table: state.active }))) return;
    const ids = shoes().map((s) => s.id);
    if (liveTable === state.active) { live.stop(); liveLog(t("live.logStopped")); }
    // Its record of what was predicted goes with it. Keeping the log of a
    // table whose coups are gone would leave figures nothing can be checked
    // against, and would quietly re-attach to the next table given that name.
    forgetPredictions(predictionLog, state.active);
    store.saveLog(predictionLog);
    learners.forget(state.active);
    for (const id of ids) roomQueue?.forget(roomShoeIdFor(id));
    roomHave = "";
    delete state.tables[state.active];
    // Nothing invented in its place. Deleting the last table leaves the
    // selector blank, and whatever is started next brings a table with it.
    state.active = Object.keys(state.tables)[0] || null;
    state.isExample = false;
    await store.deleteShoes(ids);
    commit([]);
  };

  // Clearing one table leaves the others, which is right for a table that went
  // wrong and wrong for a corpus that did. Nothing here is recoverable, so it
  // counts what it is about to destroy and says so.
  $("resetAllBtn").onclick = async () => {
    const names = Object.keys(state.tables);
    const coups = names.reduce((n, name) => n + tableCoups(name), 0);
    if (!coups && names.length <= 1) return;
    if (!confirm(t("tools.resetAllConfirm", { tables: names.length, coups: coups.toLocaleString() }))) {
      return;
    }
    const ids = names.flatMap((name) => shoes(name).map((s) => s.id));
    for (const id of ids) roomQueue?.forget(roomShoeIdFor(id));
    roomHave = "";
    live.stop();
    liveLog(t("live.logStopped"));
    state = { tables: {}, active: null, isExample: false };
    predictionLog = emptyLog();
    store.saveLog(predictionLog);
    await store.deleteShoes(ids);
    commit([]);
  };

  /*
   * No context menu on the page.
   *
   * Two carve-outs, because blocking those would take away a way in rather
   * than a menu nobody asked for. A text field keeps its menu: paste is what
   * that menu is for, and the results box is meant to be pasted into. And a
   * long press on a touch screen is left alone -- on a phone that gesture *is*
   * the paste, and the hint under the drop zone says so in as many words.
   *
   * Which pointer opened it is not on the event, so the last one down is
   * remembered. A keyboard menu key never touches a pointer, so it inherits
   * whatever came last, which is the harmless way round.
   */
  let lastPointerWasMouse = true;
  document.addEventListener("pointerdown", (e) => {
    lastPointerWasMouse = e.pointerType === "mouse";
  }, true);

  document.addEventListener("contextmenu", (e) => {
    if (!lastPointerWasMouse) return;
    const el = e.target;
    if (el && typeof el.closest === "function" && el.closest("input, textarea")) return;
    e.preventDefault();
  });

  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    const act = { p: () => addOutcomes("P"), b: () => addOutcomes("B"), t: () => addOutcomes("T"),
                  u: undo, n: newShoe }[e.key.toLowerCase()];
    if (act) { e.preventDefault(); act(); flash(e.key.toLowerCase()); }
  });
}

/* Fast entry needs to confirm the keystroke landed, and say what it did --
   "U 기록됨" would read as if an undo had been recorded as a coup. */
const flashText = (key) => ({
  p: () => t("flash.recorded", { side: side("P") }),
  b: () => t("flash.recorded", { side: side("B") }),
  t: () => t("flash.recorded", { side: side("T") }),
  u: () => t("flash.undo"),
  n: () => t("flash.newShoe"),
}[key] || (() => key))();

function flash(key) {
  flashNote("✓ " + flashText(key));
}

/** A line in the header that says itself and then gets out of the way. */
function flashNote(msg, ms = 400) {
  const node = $("shoeMeta");
  node.textContent = msg;
  setTimeout(() => { if (node.textContent === msg) renderHeader(); }, ms);
}

async function boot() {
  store.onStatus = (s) => {
    $("storeLabel").textContent = t("store." + s);
    $("storeDot").className = "sdot " + s;
  };
  // A second tab of the same browser used to be a way to lose coups: both
  // hold the whole corpus and both write all of it, so whichever saved last
  // erased the other's. Taking the newer copy the moment it lands keeps this
  // tab from writing a stale one back over it.
  //
  // The shoes, yes. Not which table this document is looking at -- `active`
  // rides along in the same object, and adopting it meant a tab showing HANN
  // switched to OTHER the instant a second tab chose OTHER. Whoever was
  // standing at HANN then entered their next result against OTHER, and a coup
  // filed under the wrong table is worse than one not filed at all, because
  // the record still looks whole. Two tables in front of you is the reason to
  // open a second tab in the first place.
  store.watchOtherTabs((incoming) => {
    const here = state.active;
    state = incoming;
    // Unless that table is what the other tab deleted.
    if (here && state.tables[here]) state.active = here;
    discardPendingReadings();
    invalidate();
    render();
    flashNote(t("store.elsewhere"));
  }, (raw) => {
    // Not settled here. The other tab settled it against its own corpus, and
    // the corpus event for that write arrives first -- storage events are
    // delivered in the order the writes were made -- but settling against a
    // corpus that is somehow still behind would read every coup it lacks as
    // undone and delete those predictions. The next coup here settles it.
    predictionLog = sanitiseLog(raw);
    // Only what the log is drawn into. A whole `render()` here lands a few
    // milliseconds after the corpus adoption above, whose note -- this view
    // just changed under you -- is the one thing the person needs to see, and
    // redrawing the header erased it before it could be read. Caught by
    // `tests/browser/test_storage.py`, in a real browser with two real tabs.
    renderVerification();
  });
  // Who is signed in, when this page is being served rather than opened as a
  // saved file. A standalone copy has no server to ask, so the whole box stays
  // hidden there rather than offering a sign-out that cannot work.
  showSignedInAs();
  initPreferences();
  bindPaste();
  bindControls();
  bindStake();
  // The handler only fires on a change, so without this the header sits blank
  // until something goes wrong -- and where the shoes are being kept is worth
  // saying before, not only after. It has to come after the language is
  // settled and after the control that re-labels on a change is bound, or
  // three of the four languages carry a Korean badge until someone switches.
  store.onStatus(store.status);
  renderLiveIntervals();
  renderInputHints();

  // Reflect the restored theme on the control now that it exists.
  for (const [name, id] of [["auto", "themeAuto"], ["light", "themeLight"], ["dark", "themeDark"]]) {
    $(id).classList.toggle("on", currentTheme() === name);
  }

  state = store.readLocal() || exampleState();
  predictionLog = sanitiseLog(store.readLog());
  settleLog();
  invalidate();
  render();
  renderShot();

  await store.connect();
  const loaded = await store.load();
  if (loaded && Object.keys(loaded.tables || {}).length) {
    state = loaded;
    // Coups that arrived from the shared store settle predictions this view
    // made before it had them.
    settleLog();
    invalidate();
    render();
  }

  // Last, and only if the address asks for it. Everything above is the page as
  // it has always been, and a room that never loads leaves it that way.
  joinRoomFromUrl().catch(() => {});
}

boot();
</script>
</body></html>
