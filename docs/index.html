<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- A stylesheet blocks the first paint until it answers, and this one is a
     third party's. On a slow connection, or where fonts.googleapis.com is not
     reachable at all, that is a blank page for as long as the request takes to
     give up -- measured at twelve seconds behind a proxy that drops it. Asking
     for it as print and promoting it on load keeps it off that path: the page
     draws immediately in the fallback stack and takes the faces when they
     arrive. The `noscript` copy keeps the fonts for a reader without script,
     who has nothing to promote it. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">

<style>
/* ── tokens ─────────────────────────────────────────────────────────────
   Cool blue-biased neutrals, the shade of a dealer terminal. The data triad
   is fixed by the domain (player blue / banker red / tie green) and re-stepped
   per surface; the amber accent does exactly one job — "the page found
   something, look here". The third ink, the small print — every panel's
   explanation, the figures' labels — reads at 4.5:1 or better on the panels
   and the insets it is set on, in both themes: it was 3.0 to 3.6, measured
   across the page at every size, under the line small text needs. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --surface-3:#eaeef3;
  --line:#dce2ea; --line-2:#c6cfda;
  --ink:#0e1620; --ink-2:#53617a; --ink-3:#637289;
  --player:#1e6fd9; --banker:#cf3b34; --tie:#0a8f70;
  --player-soft:#e9f1fd; --banker-soft:#fcecea; --tie-soft:#e3f5ef;
  --accent:#a8641a; --accent-soft:#f4e7d4;
  --zone:#e2eae4; --dead:#f0f2f5; --band:#dfe5ed; --mark-ring:#ffffff;
  --road-bg:#ffffff; --road-line:#d3dae3; --road-wm:#c5cdd7;
  --shadow:0 1px 2px rgba(16,26,40,.06), 0 6px 18px -10px rgba(16,26,40,.18);
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans:"IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans KR", "PingFang TC", "PingFang SC", "Microsoft JhengHei",
        "Microsoft YaHei", "Noto Sans TC", "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1017; --surface:#131b26; --surface-2:#18222f; --surface-3:#1e2937;
    --line:#26323f; --line-2:#37475a;
    --ink:#e3eaf3; --ink-2:#93a3b8; --ink-3:#79899f;
    --player:#3d93f0; --banker:#ee5a55; --tie:#00ab93;
    --player-soft:#111f31; --banker-soft:#2a1614; --tie-soft:#06231e;
    --accent:#e29a3c; --accent-soft:#33291a;
    --zone:#1f3a33; --dead:#1c2634; --band:#2c3c50; --mark-ring:#0b1017;
    --road-bg:#0e151e; --road-line:#2a3646; --road-wm:#334255;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1017; --surface:#131b26; --surface-2:#18222f; --surface-3:#1e2937;
  --line:#26323f; --line-2:#37475a;
  --ink:#e3eaf3; --ink-2:#93a3b8; --ink-3:#79899f;
  --player:#3d93f0; --banker:#ee5a55; --tie:#00ab93;
  --player-soft:#111f31; --banker-soft:#2a1614; --tie-soft:#06231e;
  --accent:#e29a3c; --accent-soft:#33291a;
  --zone:#1b2c28; --dead:#161f2b; --band:#233040; --mark-ring:#0b1017;
  --road-bg:#0e151e; --road-line:#2a3646; --road-wm:#334255;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
     font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased}
/* Korean wraps between words, not inside them: "결과" broken over two lines
   as "결 / 과" reads as two words, and a narrow column did it to every label.
   A word too long for its line still breaks. Korean only -- Chinese has no
   spaces to break at, and would then wrap only at its punctuation. */
html:lang(ko){word-break:keep-all; overflow-wrap:break-word}
.m{font-family:var(--mono); font-variant-numeric:tabular-nums}
/* An author display rule outranks the UA's, so without this a styled
   element keeps drawing after the code sets `hidden` on it. */
[hidden]{display:none !important}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

/* ── header ─────────────────────────────────────────────────────────────
   Two rows. The top one -- the app's name, the table, who is signed in --
   stays at the top of the screen; the tools under it scroll away with the
   page. Everything was one sticky block before, and on a phone it wrapped to
   five rows and stayed there, half the screen. The header is `display:
   contents` so that its top row sticks against the page rather than inside
   the header's own box, which it would leave as soon as the tools scrolled. */
header{display:contents}
.hin{position:sticky; top:0; z-index:20; background:var(--surface);
     border-bottom:1px solid var(--line)}
.htools{background:var(--surface-2); border-bottom:1px solid var(--line)}
.hrow{max-width:1220px; margin:0 auto; padding:10px 20px;
      display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap}
.htools .hrow{padding:6px 20px; gap:6px 10px}
/* The top row is one row in every language: signed in on a phone in English
   the name, the table and the account wrapped to two, and the bar that stays
   at the top of the screen was twice as tall. The name gives way -- it is the
   one thing on the row that is decoration -- and the table and the account
   keep their width. */
.hin .hrow{flex-wrap:nowrap}
.brand{min-width:0; flex:0 1 auto}
.brand > span:last-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#tableSel{flex:0 0 auto}
/* The account bar may give way to its note, which then wraps: on a phone the
   offline note is longer than the row has room for. */
.acct{flex:0 1 auto; min-width:0}
.hgroup{display:inline-flex; align-items:center; gap:2px; flex-wrap:wrap}
.htools .btn.ghost{padding:5px 10px; font-size:12.5px}
#tableSel{max-width:40vw; font-weight:500}
#acctName{max-width:14ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
/* The page's one top-level heading. It is the app's name in the header rather
   than a title block, so it takes the header's size and no margin -- but it has
   to be an h1: with only h2s below it the document had no top-level heading at
   all, and heading order is how a screen reader's user moves around a page. */
.brand{display:flex; align-items:center; gap:9px; font-weight:600; letter-spacing:-.01em;
       font-size:inherit; margin:0}
.pips{display:flex; gap:4px}
.pips i{width:9px; height:9px; border-radius:50%}
.pips i:nth-child(1){background:var(--player)}
.pips i:nth-child(2){background:var(--banker)}
.pips i:nth-child(3){background:var(--tie)}
.spacer{flex:1}
select,input[type=text],textarea{
  font:inherit; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--line-2); border-radius:7px; padding:5px 9px}
#shoeMeta{font-family:var(--mono); font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.badge{font-size:11px; padding:2px 8px; border-radius:20px; background:var(--accent-soft);
       color:var(--accent); border:1px solid var(--accent); font-weight:500}
.store{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-3)}
#langSel{font-size:12.5px; padding:4px 8px}
.themeseg{display:inline-flex; padding:2px; gap:2px; border-radius:8px; background:var(--surface-3)}
.themebtn{width:28px; height:24px; display:grid; place-items:center; border:none; border-radius:6px;
          background:none; color:var(--ink-3); cursor:pointer; padding:0}
.themebtn svg{width:15px; height:15px; display:block}
.themebtn:hover{color:var(--ink-2)}
.themebtn.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.sdot{width:7px; height:7px; border-radius:50%; background:var(--ink-3)}
.sdot.synced{background:var(--tie)} .sdot.syncing{background:var(--accent)}
.sdot.error,.sdot.full{background:var(--banker)}

/* ── grid ───────────────────────────────────────────────────────────── */
main{max-width:1220px; margin:0 auto; padding:20px; display:grid;
     grid-template-columns:repeat(12,1fr); gap:16px; align-items:start}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px;
       padding:16px 18px; box-shadow:var(--shadow); min-width:0}
.c12{grid-column:span 12} .c7{grid-column:span 7} .c5{grid-column:span 5}
.col{display:flex; flex-direction:column; gap:16px; min-width:0}
@media (max-width:940px){
  .c7,.c5{grid-column:span 12}
  main{padding:14px; gap:13px}
  .col{gap:13px}
}
h2{font-size:15px; font-weight:600; margin:0 0 3px; letter-spacing:-.01em}
.sub{font-size:12px; color:var(--ink-3); margin:0 0 14px; line-height:1.5}
.panel > .sub:last-child{margin-bottom:0}
/* The explanations, two lines each until opened: they were most of a phone's
   page, in front of the figures they explain. */
.fold{display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2;
  overflow:hidden}
.fold.open{display:block; -webkit-line-clamp:unset; line-clamp:unset; overflow:visible}
.subtoggle{display:block; margin:-10px 0 12px; padding:2px 0; border:0; background:none;
  color:var(--accent); font:inherit; font-size:11.5px; font-weight:600; cursor:pointer}
.subtoggle:hover{text-decoration:underline}
.subtoggle:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.livebox .subtoggle{display:block; margin:4px auto 0}
.foldable + .subtoggle{margin:2px 0 0}
.livebox .foldable + .subtoggle{margin:4px auto 0}
/* The guest's view: the reader, the prediction and the board. Everything else
   waits behind the button at the foot of the page. Marked with an attribute,
   not a class: the renders rewrite the class of several of these on every
   coup, and a class marker went with it. */
body.simple [data-full-only]{display:none !important}
/* A copy that has stopped being saved shows even in the simple view
   (renderSyncStatus marks it failing): Firebase's line, the local server's. */
body.simple .store.failing[data-full-only]{display:flex !important}
/* The guest's one button besides the reader's: clearing the table, drawn as
   a button rather than a link so it reads as the action it is. */
body.simple #clearTable{border-color:var(--line-2); background:var(--surface); color:var(--ink); font-weight:600}
body.simple #aiLedger .aifact{border-bottom:none}
/* The guest's view at a desk: the board under the reader and beside the
   prediction, so the two are on one screen. Without the full view's panels
   the left column was the reader alone, over an empty band as tall as the
   prediction, and the board was pushed below both. The second row is the
   flexible one, so the prediction's height goes there and the board sits
   straight under the reader. */
@media (min-width:941px){
  body.simple main{grid-template-rows:auto 1fr}
  body.simple #aiPanel{grid-column:8 / span 5; grid-row:1 / span 2}
  body.simple #boardPanel{grid-column:1 / span 7; grid-row:2}
}
/* The same two columns in a narrower window, drawn smaller (`fitToWindow`
   lays the page out at 960px and zooms it to the window). The media
   queries still see the window, so what they do to a narrow one -- one
   column, tighter spacing, the steps one under another -- is undone here. */
body.simple.fit main{padding:20px; gap:16px; grid-template-rows:auto 1fr}
body.simple.fit .col{gap:16px}
body.simple.fit .c7{grid-column:span 7}
body.simple.fit #aiPanel{grid-column:8 / span 5; grid-row:1 / span 2}
body.simple.fit #boardPanel{grid-column:1 / span 7; grid-row:2}
body.simple.fit .steps{grid-auto-flow:column; grid-auto-columns:1fr; max-width:none; gap:12px}
body.simple.fit .steps li{align-items:flex-start}
body.simple.fit .steps li i{margin-top:1px}
.viewtoggle{display:flex; justify-content:center; padding:4px 0 10px}
.viewtoggle .btn{padding:9px 18px; font-size:13.5px; border:1px solid var(--line-2);
  background:var(--surface)}

/* ── buttons ────────────────────────────────────────────────────────── */
.actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:13px}
.btn{padding:7px 14px; border-radius:8px; border:1px solid var(--line-2);
     background:var(--surface); cursor:pointer; font-size:13px; font-weight:500}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:transparent; background:none; color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.4; cursor:not-allowed}
/* A notice from the reader -- the table it is filling is not the one on
   screen, the whole screen is being shared, the board it read does not match
   the shoe -- with the way out under its words rather than run into them. */
.warn{font-size:12.5px; color:var(--accent); margin:10px 0 0; line-height:1.5;
      padding:10px 12px; border-radius:9px; background:var(--accent-soft);
      border:1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      display:flex; flex-wrap:wrap; align-items:center; gap:8px 10px}
.warn > span{flex:1 1 100%}
.warn .btn{padding:5px 12px; font-size:12.5px}
.warn .btn.ghost{color:var(--ink-2)}
/* A reading held for the person (see `review.js` and `admitReading`): what it
   would write, why it is held, and the two ways out. */
.warn.review > div{flex:1 1 100%}
.warn.review .small{font-size:12px; color:var(--ink-2)}
.livehealth{margin:8px 0 0; font-size:11.5px; color:var(--ink-3); line-height:1.5}

/* ── live surface ───────────────────────────────────────────────────── */
.livebox{border:2px dashed var(--line-2); border-radius:12px; background:var(--surface-2);
         padding:26px 24px 22px; text-align:center}
.livebox .big{font-size:16.5px; font-weight:600; margin-bottom:14px; letter-spacing:-.01em;
              text-wrap:balance}
.livebox .small,#liveIdle .small{font-size:12.5px; color:var(--ink-3); line-height:1.55;
        max-width:52ch; margin:0 auto}
/* The three steps in, numbered because they are an order: press, choose, and
   the rest happens by itself. Side by side where there is room for the three
   of them, one under another where there is not. */
.steps{list-style:none; margin:0 auto 16px; padding:0; display:grid; gap:8px 18px;
       max-width:440px; text-align:left}
.steps li{display:flex; align-items:center; gap:10px; font-size:13.5px; line-height:1.4;
          color:var(--ink-2); min-width:0}
.steps li i{flex:0 0 auto; width:24px; height:24px; border-radius:50%; display:grid;
            place-items:center; font:600 12px/1 var(--mono); font-style:normal;
            background:var(--ink); color:var(--surface)}
@media (min-width:720px){
  .steps{grid-auto-flow:column; grid-auto-columns:1fr; max-width:none; gap:12px}
  .steps li{align-items:flex-start}
  .steps li i{margin-top:1px}
}
.livebox .btn.primary{padding:11px 26px; font-size:15px; border-radius:10px}
.livebox .actions{margin-top:0}
/* The shared screen, as a glance at what is being read: no taller than about
   a third of the window, so the board under it is on the same screen. A
   whole browser window shared beside the page is taller than it is wide, and
   drawn the column's width it pushed the board out of sight. Width and height
   both follow the picture, so it is never stretched -- the box drawn on it is
   carried back through its size either way (`bindRegionPicker`). Drawing a
   box by hand wants the picture at full size, and gets it until the box is
   drawn. */
/* Beside it, the reader's console: what it is doing, as a headline with its
   particulars under it, and the three things that can be done about it at the
   foot -- the height of the picture, so the two read as one instrument. Under
   a wide picture, where the console has the column's width, it is one row:
   the status at the left, the controls at the right. */
.liveview{display:flex; flex-wrap:wrap; align-items:stretch; gap:12px}
.liveview .livebar{flex:1 1 220px; display:flex; min-width:0; container-type:inline-size}
#liveCanvas{width:auto; max-width:100%; height:auto; max-height:clamp(150px, 27vh, 400px);
            flex:0 1 auto; align-self:flex-start; min-width:0; display:block; border-radius:10px;
            background:var(--surface-3); border:1px solid var(--line); touch-action:none}
#liveCanvas.picking{cursor:crosshair; border-color:var(--accent); max-height:none}
#livePickHint{margin-top:8px; color:var(--accent); font-size:12px}
.livectl{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:space-between;
         gap:14px; padding:13px 14px; border-radius:10px;
         background:var(--surface-2); border:1px solid var(--line)}
.livestate{display:flex; align-items:flex-start; gap:10px; min-width:0}
#liveStatus{display:flex; flex-direction:column; gap:3px; min-width:0}
#liveStatus .lead{font-size:15px; font-weight:600; line-height:1.35; color:var(--ink);
                  font-variant-numeric:tabular-nums}
#liveStatus .rest{font-size:12px; line-height:1.5; color:var(--ink-3);
                  font-variant-numeric:tabular-nums}
/* In the console's column the two ways of finding the board share a row where
   their names fit on it, and take a row each where they do not: a name is
   never broken over two lines, which a narrower window, a longer language or
   a wider system font all did to "영역 직접 / 지정". Stopping always has the
   row under them to itself. */
.liveacts{display:flex; flex-wrap:wrap; gap:6px}
.liveacts select{font-size:12.5px; padding:4px 8px}
.liveacts .btn{flex:1 1 auto; white-space:nowrap; padding:6px 10px; font-size:12.5px;
               line-height:1.3; background:var(--surface)}
.liveacts .btn:hover{background:var(--surface-3)}
.liveacts select,.liveacts .btn.stop{flex:1 1 100%}
/* Stop is the one way out, and looks like it: the square every player uses. */
.liveacts .btn.stop{display:flex; align-items:center; justify-content:center; gap:7px; font-weight:600}
.liveacts .btn.stop::before{content:""; width:8px; height:8px; border-radius:2px; background:currentColor}
/* One row where the status keeps a readable width beside the controls; where
   it would not -- the full view's interval select, or English, in a window of
   about a thousand pixels squeezed it to a column 52px wide -- the controls
   go to a line of their own under it, on the right. */
@container (min-width:540px){
  .livectl{flex-direction:row; flex-wrap:wrap; align-items:center; padding:10px 12px; row-gap:10px}
  .liveacts{margin-left:auto; flex-wrap:nowrap}
  .liveacts select,.liveacts .btn,.liveacts .btn.stop{flex:0 0 auto}
  .liveacts .btn{padding:6px 12px}
}
.btn.tiny{padding:3px 9px; font-size:11.5px; margin-left:auto; flex:0 0 auto}
/* The dot sits on the headline's first line, and has a halo of its own colour. */
.livedot{width:9px; height:9px; margin-top:6px; border-radius:50%; background:var(--ink-3); flex:0 0 auto}
.livedot.on{background:var(--tie); box-shadow:0 0 0 3px color-mix(in srgb, var(--tie) 22%, transparent);
            animation:pulse 2s ease-in-out infinite}
.livedot.searching{background:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent)}
/* Between shoes the reader is holding its place, not hunting for one. */
.livedot.waiting{background:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
                 animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1} 50%{opacity:.35}}
.livelog{margin-top:11px; max-height:104px; overflow-y:auto; font-family:var(--mono);
         font-size:11.5px; color:var(--ink-3); line-height:1.75}
.livelog div{display:flex; gap:10px}
.livelog time{color:var(--ink-3); opacity:.7; flex:0 0 auto}
.livelog b{color:var(--ink-2); font-weight:500}
#liveError{border:1px solid var(--accent); background:var(--accent-soft);
           border-radius:10px; padding:15px 17px; font-size:13px; line-height:1.65}
#liveError h3{margin:0 0 7px; font-size:13.5px; font-weight:600}
#liveError ol{margin:9px 0 0; padding-left:19px}
#liveError li{margin-bottom:5px}

/* ── prediction ─────────────────────────────────────────────────────── */
.aibar{display:grid; grid-template-columns:58px 1fr 70px 60px; align-items:center;
       gap:9px; margin-bottom:9px}
.aibar .n{font-size:13px; color:var(--ink-2)}
.aibar .track{height:10px; border-radius:5px; background:var(--surface-3); overflow:hidden}
.aibar .track i{display:block; height:100%; border-radius:5px}
.aibar.P .track i{background:var(--player)}
.aibar.B .track i{background:var(--banker)}
.aibar.T .track i{background:var(--tie)}
/* The figures a plan is made of, in a grid: a phone put each under the last
   in a column a screen tall, and now two share a row. */
.stakeform{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
  gap:10px 14px; margin:12px 0 4px}
.stakeform label{display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--ink-2);
  max-width:100%; min-width:0}
.stakeform label:has(select){grid-column:span 2}
.stakeform input{width:100%; padding:7px 9px; border:1px solid var(--line-2); border-radius:7px;
  background:var(--surface); color:var(--ink); font-family:var(--mono); font-size:13px;
  font-variant-numeric:tabular-nums}
.stakeform input:focus{outline:2px solid var(--accent); outline-offset:1px}
.tablewrap{overflow-x:auto}
table.stake{width:100%; border-collapse:collapse; margin-top:10px; font-size:12.5px}
table.stake th,table.stake td{padding:7px 10px; text-align:right; white-space:nowrap;
  border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
table.stake th{color:var(--ink-3); font-weight:500; font-size:11px; text-align:right}
table.stake th:first-child,table.stake td:first-child{text-align:left; font-variant-numeric:normal}
table.stake td.m{font-family:var(--mono)}
table.stake td.neg{color:var(--p-ink,#c0392b)}
.stakeform select{width:100%; padding:7px 9px; border:1px solid var(--line-2); border-radius:7px;
  background:var(--surface); color:var(--ink); font:inherit; font-size:13px; max-width:100%}
.plannext{margin:12px 0 2px; padding:10px 12px; border:1px solid var(--line-2); border-radius:9px;
  background:var(--surface-2); font-size:13px; line-height:1.5}
.plannext p{margin:0}
.plannext .ps,.plannext .pw{margin-top:4px; font-size:12px; color:var(--ink-2)}
.plannext.win,.plannext.loss,.plannext.broke{border-color:var(--p-ink,#c0392b)}
table.plancmp tr.on td{background:var(--surface-2); font-weight:600}
table.plancmp .pshort{display:none}
@media (max-width:820px){ table.plancmp .plong{display:none} table.plancmp .pshort{display:inline} }
.plannow{margin:6px 0 0; font-size:12.5px; color:var(--ink-2)}
table.stake tr:last-child td{border-bottom:none}
.betbadge{margin-left:10px; padding:3px 9px; border-radius:999px; font-size:11px;
  font-weight:500; letter-spacing:.01em; white-space:nowrap; vertical-align:2px}
.betbadge.hold{background:var(--surface-3); color:var(--ink-2); border:1px solid var(--line-2)}
.betbadge.go{background:var(--accent); color:#fff}
.aibar .p{font-family:var(--mono); font-size:14px; text-align:right;
          font-variant-numeric:tabular-nums; font-weight:500;
          padding:1px 3px; border-radius:4px}
/* The estimate moves by thousandths of a point per coup. The number carries
   that; the arrow and the flash are what make it impossible to miss. */
.aibar .d{font-family:var(--mono); font-size:10px; text-align:right; color:var(--ink-3);
          font-variant-numeric:tabular-nums; white-space:nowrap; letter-spacing:-.02em}
.aibar .d.up{color:var(--tie)}
.aibar .d.dn{color:var(--accent)}
@keyframes bump{from{background:var(--accent-soft)} to{background:transparent}}
.aibar .p.bump{animation:bump 1.1s ease-out}
.predhead{display:flex; align-items:baseline; justify-content:space-between;
          gap:10px; margin-bottom:8px}
.aibar.P .p{color:var(--player)} .aibar.B .p{color:var(--banker)} .aibar.T .p{color:var(--tie)}
/* The pick, as a card at the head of the panel: the side in large type in its
   own colour, the judgment beside it. The card takes the side's tint where
   the browser can read which side is in it. */
.airec{display:flex; align-items:center; gap:10px 14px;
       margin:2px 0 10px; padding:13px 16px; border-radius:12px;
       border:1px solid var(--line-2); background:var(--surface-2)}
.airec .k{font-size:12.5px; font-weight:600; color:var(--ink-2); white-space:nowrap}
/* Where the label, the side and the judgment do not fit on one line -- English
   on a phone -- the judgment goes under them, rather than the label being
   broken over two lines to make room for it. */
.airec{flex-wrap:wrap; row-gap:8px}
.airec .v{font-size:26px; font-weight:700; letter-spacing:-.015em; line-height:1.1}
.airec .v.P{color:var(--player)} .airec .v.B{color:var(--banker)} .airec .v.T{color:var(--tie)}
.airec .betbadge{margin-left:auto}
.airec:has(.v.P){border-color:var(--player); background:var(--player-soft)}
.airec:has(.v.B){border-color:var(--banker); background:var(--banker-soft)}
.airec:has(.v.T){border-color:var(--tie); background:var(--tie-soft)}
.predhead{margin-top:14px; padding-top:14px; border-top:1px solid var(--line)}
.aigrid{display:grid; grid-template-columns:1fr 1fr; gap:9px 16px}
.aifact{display:flex; align-items:baseline; justify-content:space-between; gap:8px;
        padding-bottom:7px; border-bottom:1px solid var(--line)}
.aifact .k{font-size:11.5px; color:var(--ink-3)}
.aifact .v{font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums}
.aifact .v.neg{color:var(--banker)}
.aifact .v small{font-family:var(--sans); font-size:10.5px; color:var(--ink-3); margin-left:3px}
.obshead{display:flex; align-items:baseline; justify-content:space-between; gap:10px;
         margin:17px 0 8px; padding-top:14px; border-top:1px solid var(--line)}
.obssub{font-size:11px; color:var(--ink-3); font-family:var(--mono);
        font-variant-numeric:tabular-nums; text-align:right}
/* The ledger's heading carries its controls -- which coups it counts, and
   from where. Where they do not fit beside what it counts, they go under it
   rather than squeezing the words into a column. */
.ledgerhead{flex-wrap:wrap; row-gap:6px}
.obsactions{display:flex; gap:6px; margin-left:auto; flex:0 0 auto}
.obsactions .btn.tiny{margin-left:0}
/* The replay's three outcomes, each carrying what it paid: the commission on
   a Banker win is the term that decides the whole question, so it sits on the
   row rather than in a footnote. The figures are what actually happened, not
   what was predicted -- the counts on the right are the count of real coups. */
.aibar.bet{grid-template-columns:82px 1fr 62px 44px; margin-bottom:6px}
.aibar.bet .track{height:7px; background:var(--surface-2)}
.aibar.bet .track i{opacity:.55}
.aibar.bet .n{display:flex; align-items:baseline; gap:5px; font-size:12.5px}
.aibar.bet .n small{font-family:var(--mono); font-size:10px; color:var(--ink-3);
                    font-variant-numeric:tabular-nums}
.aibar.bet .p{font-size:12.5px; font-weight:400}
.aibar.bet .c{font-family:var(--mono); font-size:10.5px; color:var(--ink-3);
              text-align:right; font-variant-numeric:tabular-nums}
.aibar.bet.win .track i{background:var(--tie)}
.aibar.bet.lose .track i{background:var(--banker)}
.aibar.bet.push .track i{background:var(--ink-3)}
/* The coup just settled. It carries the outcome's own colour because it is one
   event rather than a total, and it is the only line in the block that answers
   "what did the last result do" -- so it sits above the running totals and is
   given the weight of an answer. */
.ailast{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
        margin:12px 0 11px; padding:9px 13px; border-radius:9px;
        border:1px solid var(--line-2); background:var(--surface-2)}
.ailast .k{font-size:11.5px; color:var(--ink-3)}
.ailast .v{display:flex; align-items:baseline; gap:9px}
.ailast .v b{font-size:13px; font-weight:600}
.ailast .v i{font-family:var(--mono); font-style:normal; font-size:14px; font-weight:500;
             font-variant-numeric:tabular-nums}
.ailast.win{border-color:var(--tie); background:color-mix(in srgb, var(--tie) 8%, transparent)}
.ailast.win .v i{color:var(--tie)}
.ailast.lose{border-color:var(--banker); background:color-mix(in srgb, var(--banker) 8%, transparent)}
.ailast.lose .v i{color:var(--banker)}
.ailast.push .v i{color:var(--ink-3)}
.ailast .v i.bump{animation:bump 1.1s ease-out; border-radius:5px; padding:1px 5px; margin:0 -5px}
/* And the running row it landed on is lit for a moment, so the total and the
   event read as the same thing happening. */
.aibar.bet.landed .p{animation:bump 1.1s ease-out}
.aibar.bet.landed .track i{opacity:1}

/* One row each, full width: these are figures with captions, not a chart, and
   a half-width cell wraps the caption into the label beside it. */
#aiLedger{grid-template-columns:1fr; gap:0; margin-top:12px; margin-bottom:12px}
#aiLedger .aifact{padding:6px 0}
#aiLedger .aifact:last-child{border-bottom:none}
#aiLedger .aifact .k{flex:0 0 auto}
.ainote{font-size:11.5px; color:var(--ink-3); line-height:1.55; margin:13px 0 0}
.verifygrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(108px,1fr)); gap:9px;
            margin-top:10px}
.verifygrid .vt{background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
                padding:8px 10px}
.verifygrid .vt .k{font-size:10.5px; color:var(--ink-3); letter-spacing:.01em}
.verifygrid .vt .v{font-family:var(--mono); font-size:15px; font-variant-numeric:tabular-nums;
                   margin-top:2px}
.verifygrid .vt .v.up{color:var(--tie)} .verifygrid .vt .v.down{color:var(--banker)}
.verifygrid .vt .s{font-size:10.5px; color:var(--ink-3); margin-top:1px}
.verifyrows{margin-top:10px; max-height:186px; overflow-y:auto; font-family:var(--mono);
            font-size:11.5px; font-variant-numeric:tabular-nums}
.verifyrows table{width:100%; border-collapse:collapse}
.verifyrows th{text-align:right; font-weight:500; color:var(--ink-3); font-size:10.5px;
               padding:2px 6px; position:sticky; top:0; background:var(--surface)}
.verifyrows th:first-child,.verifyrows td:first-child{text-align:left}
.verifyrows td{padding:2px 6px; text-align:right; border-top:1px solid var(--line)}
.verifyrows .hit{color:var(--tie)} .verifyrows .miss{color:var(--banker)}
.verifyrows .wait{color:var(--ink-3)}
/* The one line that says which of the two is actually being used. */
.aiverdict{font-size:12.5px; line-height:1.55; margin:11px 0 0; padding:9px 12px;
           border-radius:8px; border:1px solid var(--line-2); background:var(--surface-2)}
.aiverdict.on{border-color:var(--accent); background:var(--accent-soft)}
.aiverdict b{color:var(--ink)}
#learnRows{grid-template-columns:1fr; gap:0; margin-top:10px}
#learnRows .aifact{padding:6px 0}
#learnRows .aifact:last-child{border-bottom:none}
#learnRows .aifact.picked .k{color:var(--ink); font-weight:600}
.aiwarn{font-size:11.5px; line-height:1.55; margin:10px 0 0; padding:9px 11px;
        border-radius:8px; border:1px solid var(--banker); color:var(--ink-2);
        background:color-mix(in srgb, var(--banker) 7%, transparent)}

/* ── stat tiles ─────────────────────────────────────────────────────── */
#kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
@media (max-width:1100px){ #kpis{grid-template-columns:1fr 1fr} }
.tile{background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:11px 12px}
.tile .k{font-size:11px; color:var(--ink-3); letter-spacing:.02em}
.tile .v{font-family:var(--mono); font-size:21px; font-weight:500; letter-spacing:-.02em;
         margin:3px 0 2px; font-variant-numeric:tabular-nums}
.tile .s{font-size:11px; color:var(--ink-3); line-height:1.4}

/* ── break-even scale ───────────────────────────────────────────────── */
#scale{width:100%; height:auto; display:block; max-width:760px; margin:0 auto}
#scale .m{font-family:var(--mono)}
.verdict{font-size:13px; line-height:1.6; padding:12px 14px; border-radius:9px;
         border:1px solid var(--line); background:var(--surface-2); margin:12px 0 0}
.verdict.flag{border-color:var(--accent); background:var(--accent-soft)}
.verdict.ok{border-color:var(--tie)}

/* ── boards ─────────────────────────────────────────────────────────── */
/* ── the latest result ─────────────────────────────────────────────────
   The one thing somebody standing at a table looks up for: what just landed.
   It is written in English whatever the interface language is, because those
   are the words on the table's own screen -- reading the two together should
   not be a translation exercise. */
.result{display:flex; align-items:center; gap:10px; margin-bottom:11px;
        padding:7px 14px; border-radius:10px; min-height:42px;
        border:1px solid var(--line); background:var(--surface-2)}
.result .rdot{width:20px; height:20px; border-radius:50%; flex:0 0 auto;
              background:var(--ink-3); box-shadow:inset 0 0 0 2px var(--mark-ring)}
.result .rword{font-size:16.5px; font-weight:600; letter-spacing:.045em;
               line-height:1.15; min-width:0}
.result .rmeta{margin-left:auto; padding-left:12px; text-align:right; flex:0 0 auto;
               font-family:var(--mono); font-size:11px; color:var(--ink-3);
               font-variant-numeric:tabular-nums; line-height:1.4}
.result .rmeta b{display:block; font-size:12px; font-weight:500; color:var(--ink-2)}
.result.B{border-color:var(--banker); background:var(--banker-soft)}
.result.B .rdot{background:var(--banker)}
.result.B .rword{color:var(--banker)}
.result.P{border-color:var(--player); background:var(--player-soft)}
.result.P .rdot{background:var(--player)}
.result.P .rword{color:var(--player)}
.result.T{border-color:var(--tie); background:var(--tie-soft)}
.result.T .rdot{background:var(--tie)}
.result.T .rword{color:var(--tie)}
/* Before the first coup it says so, rather than sitting there as an empty box. */
.result.waiting .rword{font-size:13.5px; font-weight:500; letter-spacing:0;
                       color:var(--ink-3)}
/* The coup that just landed announces itself once and then holds still. */
@keyframes resultIn{from{opacity:0; transform:translateY(-5px) scale(.99)}
                    to{opacity:1; transform:none}}
.result.fresh{animation:resultIn .34s cubic-bezier(.2,.72,.3,1)}
@media (prefers-reduced-motion:reduce){.result.fresh{animation:none}}

/* The board is drawn the way the owner's table draws its scoreboard: one
   ruled field, the bead plate down the left in squares twice the size of the
   rest -- six deep, eleven across, its lettered discs B, P and T -- and beside
   it the big road six squares deep and forty across with a tie's green
   stroke, the big eye boy under it, and the small road and the cockroach pig
   side by side at the foot, each three squares deep with four of their marks
   to a square, as rings, dots and strokes. Each named by a faint word in its
   middle, as the table names them. Then the shoe's counts, and the ask roads:
   what the three derived roads would get from a Banker, and from a Player.

   As many columns as the table's, so that a road shows what the table's does
   -- the same marks, and once it is longer than that, the same newest ones.
   The squares are sized to the board's box instead: the table's whole width
   on one line where that leaves a square of 11px or more, and otherwise the
   bead plate above the roads, which then take the box's width. In whole
   pixels, so the ruling stays sharp, and in steps rather than round(): the
   steps work in every browser that knows container queries, and one that
   does not keeps the one-line board at 11px and scrolls it in its box. */
.sbwrap{container-type:inline-size; overflow-x:auto}
.scoreboard{--f:11px; --f2:calc(2 * var(--f)); --fh:calc(var(--f) / 2);
  min-width:calc(71 * var(--f) + 2px);
  display:grid; grid-template-columns:calc(11 * var(--f2)) calc(40 * var(--f)) minmax(0, 1fr);
  grid-template-areas:"bead roads side"; border:1px solid var(--road-line);
  border-radius:6px; overflow:hidden; background:var(--road-bg)}
/* One line is 71 squares and the border: 22 of bead plate, 40 of roads, 9 or
   more of counts. */
@container (width >= 854px){ .scoreboard{--f:12px} }
@container (width >= 925px){ .scoreboard{--f:13px} }
@container (width >= 996px){ .scoreboard{--f:14px} }
@container (width >= 1067px){ .scoreboard{--f:15px} }
@container (width >= 1138px){ .scoreboard{--f:16px} }
/* Narrower, the roads take the width, forty squares of it, and the bead
   plate sits above them with the counts beside it. On a phone its square is
   larger than twice the roads', where the counts leave it room: nine of the
   roads' squares. */
@container (width < 783px){
  .scoreboard{--f:6px; --f2:16px; width:calc(40 * var(--f) + 2px); min-width:0; margin-inline:auto;
    grid-template-columns:calc(11 * var(--f2)) minmax(0, 1fr);
    grid-template-areas:"bead side" "roads roads"}
  .sbroads{border-top:1px solid var(--road-line)}
}
@container (282px <= width < 783px){ .scoreboard{--f:7px; --f2:19px} }
@container (322px <= width < 783px){ .scoreboard{--f:8px; --f2:22px} }
@container (362px <= width < 783px){ .scoreboard{--f:9px; --f2:22px} }
@container (402px <= width < 783px){ .scoreboard{--f:10px; --f2:22px} }
@container (442px <= width < 783px){ .scoreboard{--f:11px; --f2:22px} }
@container (482px <= width < 783px){ .scoreboard{--f:12px; --f2:24px} }
@container (522px <= width < 783px){ .scoreboard{--f:13px; --f2:26px} }
@container (562px <= width < 783px){ .scoreboard{--f:14px; --f2:28px} }
@container (602px <= width < 783px){ .scoreboard{--f:15px; --f2:30px} }
@container (642px <= width < 783px){ .scoreboard{--f:16px; --f2:32px} }
@container (682px <= width < 783px){ .scoreboard{--f:17px; --f2:34px} }
@container (722px <= width < 783px){ .scoreboard{--f:18px; --f2:36px} }
.sbbead{grid-area:bead}
.sbroads{grid-area:roads; min-width:0}
.sblow{display:grid; grid-template-columns:1fr 1fr}
.sbarea{position:relative; min-width:0; background:var(--road-bg)}
.sbarea .roadscroll{position:relative; z-index:1; overflow-x:auto; overflow-y:hidden;
  scrollbar-width:none}
.sbarea .roadscroll::-webkit-scrollbar{display:none}
.sbarea .wm{position:absolute; inset:0; z-index:0; display:grid; place-items:center;
  pointer-events:none; font:700 calc(var(--f) * .78)/1 var(--sans); letter-spacing:.05em;
  color:var(--road-wm); white-space:nowrap; overflow:hidden}
.scoreboard .road{display:grid; grid-auto-flow:column; grid-template-rows:repeat(6, var(--pitch));
  grid-auto-columns:var(--pitch); width:max-content;
  background-image:linear-gradient(90deg, var(--road-line) 1px, transparent 1px),
                   linear-gradient(var(--road-line) 1px, transparent 1px);
  background-size:var(--square) var(--square)}
#bead{--pitch:var(--f2); --square:var(--f2)}
#big{--pitch:var(--f); --square:var(--f)}
.scoreboard .road.sm{--pitch:var(--fh); --square:var(--f)}
.road .cell{position:relative; display:grid; place-items:center; padding:1px 0 0 1px}
.road .mk{--c:var(--ink-3); display:block; box-sizing:border-box; border-radius:50%;
          font-style:normal}
.mk.B,.mk.red{--c:var(--banker)} .mk.P,.mk.blue{--c:var(--player)} .mk.T{--c:var(--tie)}
#bead .mk{width:calc(var(--f2) - 3px); height:calc(var(--f2) - 3px); background:var(--c);
          color:#fff; display:grid; place-items:center; font:700 calc(var(--f2) * .46)/1 var(--sans)}
#big .mk{width:calc(var(--f) - 2px); height:calc(var(--f) - 2px);
         border:calc(var(--f) * .13) solid var(--c)}
#big .tie{position:absolute; left:50%; top:50%; width:2px; height:calc(var(--f) + 1px);
          border-radius:1px; background:var(--tie); transform:translate(-50%, -50%) rotate(45deg)}
#big .tn{position:absolute; inset:1px 0 0 1px; display:grid; place-items:center;
         font:700 calc(var(--f) * .6)/1 var(--mono); color:var(--tie);
         text-shadow:0 0 2px var(--road-bg), 0 0 2px var(--road-bg), 0 0 1px var(--road-bg)}
#beb .mk{width:calc(var(--fh) - 1px); height:calc(var(--fh) - 1px); border:1.3px solid var(--c)}
#small .mk{width:calc(var(--fh) - 1px); height:calc(var(--fh) - 1px); background:var(--c)}
#roach .mk{width:1.6px; height:calc(var(--fh) + 1px); border-radius:1px; background:var(--c);
           transform:rotate(45deg)}
/* The counts down one column, each in its side's colour, and the ask roads
   in a column beside them: a box for each side, its letter over the marks.
   Sized to the bead plate they stand beside: half its square, which is the
   roads' square except on a phone. */
.sbside{--fs:calc(var(--f2) / 2); grid-area:side; display:flex; align-items:flex-start; justify-content:center;
  gap:calc(var(--fs) * .9); padding:calc(var(--fs) * .5) calc(var(--fs) * .6);
  border-left:1px solid var(--road-line); background:var(--surface-2)}
.sbcounts{display:flex; flex-direction:column; gap:calc(var(--fs) * .55)}
.sbcount{display:flex; align-items:center; gap:calc(var(--fs) * .45)}
.sbcount .mk, .sbask .hd{display:grid; place-items:center; border-radius:50%;
  background:var(--c); color:#fff; font-style:normal; font-weight:700; line-height:1;
  font-family:var(--sans)}
.sbcount .mk{width:calc(var(--fs) * 1.5); height:calc(var(--fs) * 1.5); font-size:calc(var(--fs) * .82)}
.sbcount b{min-width:2ch; font:500 calc(var(--fs) * .9)/1 var(--mono); color:var(--c);
  font-variant-numeric:tabular-nums}
.sbcount.B{--c:var(--banker)} .sbcount.P{--c:var(--player)} .sbcount.T{--c:var(--tie)}
/* Under the three counts, what the AI's picks did on the plate: won in red
   and lost in blue, the page's own two colours. The first of them keeps a
   little more room above, as a group of its own. */
.sbtally{--c:var(--ink); display:flex; align-items:center; gap:calc(var(--fs) * .45)}
.sbtally.win{--c:var(--banker); margin-top:calc(var(--fs) * .3)}
.sbtally.lose{--c:var(--player)}
.sbtally .tk{display:grid; place-items:center; border-radius:50%; background:var(--c); color:var(--surface);
  font-style:normal; font-weight:700; line-height:1; font-family:var(--sans);
  width:calc(var(--fs) * 1.5); height:calc(var(--fs) * 1.5); font-size:calc(var(--fs) * .72)}
.sbtally b{min-width:2ch; font:500 calc(var(--fs) * .9)/1 var(--mono); color:var(--c);
  font-variant-numeric:tabular-nums}
.sbasks{display:flex; flex-direction:column; gap:calc(var(--fs) * .45)}
.sbask{--c:var(--ink-3); display:flex; flex-direction:column; align-items:center;
  gap:calc(var(--fs) * .22); padding:calc(var(--fs) * .25); border:1px solid var(--c);
  border-radius:3px; background:var(--road-bg)}
.sbask.B{--c:var(--banker)} .sbask.P{--c:var(--player)}
.sbask .hd{width:calc(var(--fs) * 1.1); height:calc(var(--fs) * 1.1); font-size:calc(var(--fs) * .62)}
.sbask .m{--c:transparent; display:block; box-sizing:border-box; font-style:normal}
.sbask .m.red{--c:var(--banker)} .sbask .m.blue{--c:var(--player)}
.sbask .m.beb{width:calc(var(--fs) * .75); height:calc(var(--fs) * .75); border-radius:50%;
  border:calc(var(--fs) * .14) solid var(--c)}
.sbask .m.small{width:calc(var(--fs) * .75); height:calc(var(--fs) * .75); border-radius:50%;
  background:var(--c)}
.sbask .m.roach{width:calc(var(--fs) * .14); height:calc(var(--fs) * .85); border-radius:1px;
  background:var(--c); transform:rotate(45deg)}
.blabel{font-size:11px; color:var(--ink-3); margin-bottom:6px; letter-spacing:.02em}
#boardMeta{font-family:var(--mono); font-size:12px; color:var(--ink-2); margin-top:10px}

.beadkey{font-size:12px; color:var(--ink-3); line-height:1.5; margin:8px 0 0}

/* ── per-shoe table ─────────────────────────────────────────────────── */
#shoeStrip{width:100%; height:auto; display:block; max-width:760px; margin:4px auto 14px}
#shoeStrip .m{font-family:var(--mono)}
#shoeFacts{display:grid; grid-template-columns:repeat(auto-fit, minmax(168px, 1fr));
           gap:10px; margin-bottom:12px}
#shoeVerdict{margin-bottom:14px}
.shoescroll{max-height:396px; overflow:auto; border:1px solid var(--line);
            border-radius:9px; background:var(--surface-2)}
#shoeTable{width:100%; border-collapse:collapse; font-size:12.5px}
#shoeTable th{position:sticky; top:0; z-index:1; background:var(--surface-3);
              border-bottom:1px solid var(--line-2); padding:0;
              font-weight:500; white-space:nowrap}
#shoeTable th button{width:100%; font:inherit; color:var(--ink-2); background:none;
                     border:0; padding:8px 10px; cursor:pointer; text-align:right;
                     white-space:nowrap}
#shoeTable th:first-child button{text-align:left}
#shoeTable th button:hover{color:var(--ink)}
#shoeTable th[aria-sort] button{color:var(--ink); font-weight:600}
#shoeTable th button .caret{color:var(--accent); margin-left:4px}
#shoeTable td{padding:6px 10px; text-align:right; border-bottom:1px solid var(--line);
              font-family:var(--mono); font-variant-numeric:tabular-nums;
              color:var(--ink-2); white-space:nowrap}
#shoeTable td:first-child{text-align:left; color:var(--ink-3)}
#shoeTable td small{font-family:var(--mono); font-size:10.5px; color:var(--ink-3);
                    margin-right:10px; white-space:pre}
#shoeTable tr:last-child td{border-bottom:none}
#shoeTable tr.open td:first-child{color:var(--accent); font-weight:600}
#shoeTable td.q{color:var(--ink); font-weight:600}
#shoeTable td.q.b{color:var(--banker)} #shoeTable td.q.p{color:var(--player)}
#shoeTable tr.far td.z{color:var(--accent); font-weight:600}
#shoeTable td.mut{color:var(--ink-3)}
.shoefoot{display:flex; align-items:center; gap:12px; margin-top:11px}
.shoefoot .note{margin:0}
@media (max-width:560px){
  #shoeTable .opt{display:none}
  .shoescroll{max-height:330px}
  /* A sort header is a control, and a thumb needs more of it than the text
     alone gives -- 35px is under every touch-target guideline there is. */
  #shoeTable th button{padding:12px 10px}
}

/* ── milestones ─────────────────────────────────────────────────────── */
.ms{margin-bottom:14px}
.ms:last-child{margin-bottom:0}
.msrow{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; margin-bottom:5px}
.msname{color:var(--ink-2)}
.msnum{font-family:var(--mono); color:var(--ink-3); font-variant-numeric:tabular-nums}
.track{height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden}
.track i{display:block; height:100%; background:var(--ink-2); border-radius:3px}
.ms.done .track i{background:var(--tie)}
.ms.done .msname{color:var(--ink)}
.msnote{font-size:11.5px; color:var(--ink-3); margin-top:5px}

/* ── integrity ──────────────────────────────────────────────────────── */
.introw{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:11px}
#intProgress{margin:10px 0}
#intProgressLabel{font-size:12px; color:var(--ink-3); margin-bottom:6px}
#intBar{display:block; height:5px; background:var(--accent); border-radius:3px; width:0; transition:width .2s}
.bartrack{height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden}
.flegend{display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; font-size:11px;
         color:var(--ink-3); padding-bottom:9px; border-bottom:1px solid var(--line); margin-bottom:4px}
.flegend span{display:flex; align-items:center; gap:6px}
.swatch{display:inline-block; border-radius:20px}
.swatch.band{width:22px; height:7px; background:var(--band)}
.swatch.dot{width:9px; height:9px; background:var(--ink-2)}
.find{display:grid; grid-template-columns:minmax(92px,1.1fr) minmax(150px,1.5fr) auto 34px;
      gap:11px; align-items:center; padding:5px 0; border-bottom:1px solid var(--line)}
.find:last-child{border-bottom:none}
.fname .t{font-size:12.5px; color:var(--ink-2)}
.fplot svg{width:100%; height:22px; display:block; overflow:visible}
.fnum{display:flex; gap:9px; justify-content:flex-end; font-family:var(--mono); font-size:11.5px}
.fnum .z{color:var(--ink); font-variant-numeric:tabular-nums}
.fnum .p{color:var(--ink-3)}
.fstate{font-size:11px; color:var(--ink-3); text-align:right}
.find.flagged .fstate{color:var(--accent); font-weight:600}
.find.flagged .fname .t{color:var(--ink); font-weight:500}
#intMeta{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); margin-top:11px}

/* ── data tools ─────────────────────────────────────────────────────── */
.tools{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
@media (max-width:820px){ .tools{grid-template-columns:1fr} }
.keys{display:flex; gap:7px; flex-wrap:wrap}
.keys .btn{min-width:52px; justify-content:center}
.keys .btn b{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-left:5px; font-weight:400}
textarea{width:100%; min-height:64px; resize:vertical; font-family:var(--mono); font-size:12.5px}
.note{font-size:11.5px; color:var(--ink-3); margin-top:8px; line-height:1.5}
code{font-family:var(--mono); font-size:12px; background:var(--surface-3);
     padding:1px 5px; border-radius:4px}
footer{max-width:1220px; margin:0 auto; padding:4px 20px 40px; font-size:11.5px;
       color:var(--ink-3); line-height:1.6}

/* ── touch and small screens ────────────────────────────────────────────
   A finger is not a cursor: every control that is tapped gets a 44px box,
   and the findings table, which is four columns of numbers, folds rather
   than pushing the page sideways. */
@media (pointer: coarse){
  .btn{min-height:44px; padding-top:11px; padding-bottom:11px}
  select,#langSel,#reps,#liveInterval{min-height:44px; padding:10px 12px; font-size:14px}
  .themebtn{width:40px; height:40px}
  .themebtn svg{width:18px; height:18px}
  textarea{min-height:88px; font-size:16px}      /* 16px stops iOS zooming on focus */
  /* The staking plan's figures are typed on a phone too: they were 31px tall
     and 13px type, under a finger and under the size iOS zooms the page for. */
  .stakeform input{min-height:44px; font-size:16px}
  /* "More" under each explanation is a line of small type, 22px tall. Its
     box reaches past the line on every side, so a finger finds it, and the
     page around it does not move. */
  .subtoggle{position:relative}
  .subtoggle::after{content:""; position:absolute; inset:-11px -10px}
  /* And the door's "sign up" link, a line of type 26px tall on a phone. */
  .glink{position:relative}
  .glink::after{content:""; position:absolute; inset:-9px -8px}
}
@media (max-width:620px){
  main{padding:12px; gap:12px}
  .panel{padding:14px 15px; border-radius:11px}
  .hrow{padding:8px 12px; gap:8px}
  .htools .hrow{padding:6px 12px}
  h1,.brand{font-size:13.5px}
  .brand .pips{gap:3px}
  #shoeMeta{font-size:12px}
  #tableSel{max-width:32vw; padding-left:7px; padding-right:4px}
  .acctbtn{padding:3px 6px}
  #acctName{max-width:8ch}
  .find{grid-template-columns:1fr auto; grid-template-areas:"name state" "plot nums";
        gap:5px 10px; padding:8px 0}
  .fname{grid-area:name} .fstate{grid-area:state}
  .fplot{grid-area:plot} .fnum{grid-area:nums}
  .flegend{font-size:10.5px; gap:4px 12px}
  #kpis{grid-template-columns:1fr 1fr; gap:8px}
  .tile .v{font-size:19px}
  .aigrid{grid-template-columns:1fr}
  .result{padding:7px 12px}
  .livebox{padding:20px 14px}
  .actions{gap:7px}
  footer{padding-bottom:96px}          /* clear of the entry bar */
  body.simple footer{padding-bottom:40px}   /* which the guest's view does not have */
}

/* ── the quick entry bar ────────────────────────────────────────────────
   On a phone the manual controls sit at the bottom of a very long page. The
   same five actions ride above the fold instead, within thumb reach. */
#quickbar{display:none}
@media (pointer: coarse) and (max-width:820px){
  #quickbar{
    display:grid; grid-template-columns:repeat(5,1fr); gap:6px;
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
  }
  .qb{
    min-height:46px; border-radius:10px; border:1px solid var(--line-2);
    background:var(--surface-2); color:var(--ink); font-size:13px; font-weight:600;
    cursor:pointer; padding:0 4px;
  }
  .qb.P{border-color:var(--player); color:var(--player)}
  .qb.B{border-color:var(--banker); color:var(--banker)}
  .qb.T{border-color:var(--tie); color:var(--tie)}
  .qb.ghost{font-weight:500; font-size:12px; color:var(--ink-2)}
  .qb:active{transform:scale(.97)}
}

/* ── the door ───────────────────────────────────────────────────────────
   Until somebody is let in, the page is the door and nothing else: the reader
   behind it is not drawn. Laid out like the sign-in card the owner pointed
   at -- the name in the accent, the language under it, two fields, one
   button, the way to ask -- in the reader's own type and colours, so the dark
   theme is the navy and amber of that card and the light one is the page's
   daytime self. */
:root{
  --gate-edge:rgba(168,100,26,.38); --gate-stripe:rgba(14,22,32,.035);
  --gate-field:var(--surface-2); --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --gate-edge:rgba(226,154,60,.55); --gate-stripe:rgba(255,255,255,.022);
    --gate-field:#0b1017; --on-accent:#1a1206;
  }
}
:root[data-theme="dark"]{
  --gate-edge:rgba(226,154,60,.55); --gate-stripe:rgba(255,255,255,.022);
  --gate-field:#0b1017; --on-accent:#1a1206;
}
body:not(.open) > :not(#gate){display:none !important}
body.open > #gate{display:none}
#gate{min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:32px 16px;
  background:repeating-linear-gradient(135deg, var(--gate-stripe) 0 1px, transparent 1px 14px), var(--bg)}
.gcard{position:relative; width:min(420px, 100%); padding:34px 28px 28px;
  background:linear-gradient(165deg, var(--surface-2), var(--surface) 55%);
  border:1px solid var(--gate-edge); border-radius:20px; box-shadow:var(--shadow)}
.gtheme{position:absolute; top:16px; right:16px; width:40px; height:40px; display:grid; place-items:center;
  border:1px solid var(--line); border-radius:11px; background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.gtheme:hover{color:var(--ink)}
.gtheme svg{width:19px; height:19px; display:block}
.gbrand{margin:6px 0 0; text-align:center; font-size:26px; line-height:1.25; font-weight:600;
  letter-spacing:-.01em; color:var(--accent); text-wrap:balance}
.gbrand .pips{justify-content:center; margin-bottom:12px}
.gbrand .pips i{width:10px; height:10px}
.gsub{margin:6px 0 0; text-align:center; font-family:var(--mono); font-size:12.5px;
  letter-spacing:.14em; color:var(--ink-3)}
.glang{display:flex; justify-content:center; margin:16px 0 22px}
.glang select{font-size:13px; padding:6px 12px; border-radius:20px; min-height:36px}
.gform{display:flex; flex-direction:column; gap:14px}
.gfield{display:flex; flex-direction:column; gap:6px}
.gfield > span{font-size:13px; font-weight:500; color:var(--ink-2)}
.gfield input{font:inherit; font-size:16px; color:var(--ink); background:var(--gate-field);
  border:1px solid var(--line-2); border-radius:10px; padding:0 14px; height:48px; width:100%}
.gfield input::placeholder{color:var(--ink-3)}
.gfield input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.gfield small{font-size:12px; color:var(--ink-3)}
.gmsg{margin:0; min-height:1.4em; font-size:13px; line-height:1.45; color:var(--ink-2)}
.gmsg.err{color:var(--banker)} .gmsg.ok{color:var(--tie)}
.gbtn{height:50px; margin-top:4px; border:none; border-radius:10px; background:var(--accent);
  color:var(--on-accent); font:inherit; font-size:16px; font-weight:600; cursor:pointer}
.gbtn:hover{filter:brightness(1.06)}
.gbtn:disabled{opacity:.6; cursor:progress}
.gswitch{margin:6px 0 0; text-align:center; font-size:14px; color:var(--ink-2)}
.glink{border:none; background:none; padding:2px 4px; font:inherit; font-weight:600; color:var(--accent); cursor:pointer}
.glink:hover{text-decoration:underline}
.gnote{margin:4px 0 0; text-align:center; font-size:12.5px; line-height:1.55; color:var(--ink-3); text-wrap:balance}

/* ── the account: who is in, and the master's desk ─────────────────────── */
.acct{display:inline-flex; align-items:center; gap:4px}
.acctbtn{display:inline-flex; align-items:center; gap:6px; font-weight:500; padding:3px 10px; line-height:1.3; font-size:13px}
.acctbtn svg{width:15px; height:15px; display:block}
.acctbadge{min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--banker);
  color:#fff; font-size:11px; line-height:18px; text-align:center; font-weight:600}
.acctnote{font-size:11.5px; color:var(--accent); min-width:0; line-height:1.3; text-align:right}
.acctbtn{flex:0 0 auto}
/* One column no wider than the screen: sized to its content, the sheet took
   the width of its widest table on a phone, and its own buttons -- log out,
   close -- were off the right-hand edge where nothing scrolls to. */
#acctSheet{position:fixed; inset:0; z-index:60; display:grid; place-items:start center;
  grid-template-columns:minmax(0, 1fr);
  padding:6vh 14px 20px; background:rgba(8,12,18,.55); overflow-y:auto}
.sheetbox{width:min(760px, 100%); min-width:0; background:var(--surface); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--shadow); padding:18px 18px 20px}
.sheethead{display:flex; align-items:center; flex-wrap:wrap; gap:8px 10px; margin-bottom:12px}
.sheethead h2{margin:0; flex:1; font-size:16px}
@media (max-width:560px){
  .sheetbox{padding:14px 14px 16px}
  .sheethead h2{flex-basis:100%}
}
.tabs{display:inline-flex; gap:2px; padding:3px; border-radius:9px; background:var(--surface-3); margin-bottom:14px; flex-wrap:wrap}
.tabs button{border:none; background:none; padding:6px 12px; border-radius:7px; color:var(--ink-2); cursor:pointer; font:inherit}
.tabs button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.sheetsec{margin:0 0 18px}
.sheetsec h3{font-size:13.5px; margin:0 0 8px; font-weight:600}
.sheetsec .sub{margin:-4px 0 10px}
#loginsFor{margin:0 0 10px} #loginsFor + .sub{margin-top:0}
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px}
.acctable{width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums}
.acctable th{text-align:left; font-weight:500; font-size:12px; color:var(--ink-3); background:var(--surface-2);
  padding:7px 10px; white-space:nowrap}
.acctable td{padding:8px 10px; border-top:1px solid var(--line); white-space:nowrap}
.acctable td.when{font-family:var(--mono); font-size:12.5px}
.acctable td.act{text-align:right}
.acctable td.act .btn{padding:4px 10px; font-size:12.5px}
.chip{display:inline-block; padding:1px 8px; border-radius:10px; font-size:11.5px; font-weight:500;
  border:1px solid currentColor}
.chip.pending{color:var(--accent)} .chip.approved{color:var(--tie)}
.chip.rejected,.chip.suspended{color:var(--banker)}
.chip.cloud-go{color:var(--tie)} .chip.cloud-nogo{color:var(--ink-2)}
.chip.cloud-skip{color:var(--accent)} .chip.cloud-error{color:var(--banker)}
.cloudhead{margin:4px 0 8px; font-size:14.5px; line-height:1.5; white-space:normal}
.sheetform{display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end}
.sheetform .gfield input{height:42px; font-size:15px}
.sheetform .btn{height:42px}
@media (max-width:560px){ .sheetform{grid-template-columns:1fr} }
.sheetmsg{margin:10px 0 0; font-size:13px; min-height:1.2em}
.sheetmsg.err{color:var(--banker)} .sheetmsg.ok{color:var(--tie)}
.empty{margin:0; font-size:13px; color:var(--ink-3)}
</style>
</head><body>

<div id="gate">
  <div class="gcard">
    <button type="button" class="gtheme" id="gateTheme" data-i18n-aria="gate.themeAria" data-i18n-title="gate.themeAria"></button>
    <h1 class="gbrand"><span class="pips"><i></i><i></i><i></i></span><span data-i18n="app.title"></span></h1>
    <p class="gsub" id="gateSub" data-i18n="gate.sub"></p>
    <div class="glang"><select id="gateLang" data-i18n-aria="header.langAria"></select></div>

    <form class="gform" id="loginForm" novalidate>
      <label class="gfield"><span data-i18n="gate.id"></span>
        <input id="loginId" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ID"></label>
      <label class="gfield"><span data-i18n="gate.pw"></span>
        <input id="loginPw" name="password" type="password" autocomplete="current-password" placeholder="••••••"></label>
      <p class="gmsg" id="loginMsg" role="status" aria-live="polite"></p>
      <button type="submit" class="gbtn" id="loginBtn" data-i18n="gate.login"></button>
      <p class="gswitch"><span data-i18n="gate.noAccount"></span> <button type="button" class="glink" id="toSignup" data-i18n="gate.toSignup"></button></p>
      <p class="gnote" data-i18n="gate.note"></p>
    </form>

    <form class="gform" id="signupForm" novalidate hidden>
      <label class="gfield"><span data-i18n="gate.id"></span>
        <input id="signupId" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ID">
        <small data-i18n="gate.idHint"></small></label>
      <label class="gfield"><span data-i18n="gate.pw"></span>
        <input id="signupPw" name="new-password" type="password" autocomplete="new-password">
        <small data-i18n="gate.pwHint"></small></label>
      <label class="gfield"><span data-i18n="gate.pw2"></span>
        <input id="signupPw2" name="new-password-2" type="password" autocomplete="new-password"></label>
      <p class="gmsg" id="signupMsg" role="status" aria-live="polite"></p>
      <button type="submit" class="gbtn" id="signupBtn" data-i18n="gate.request"></button>
      <p class="gswitch"><span data-i18n="gate.haveAccount"></span> <button type="button" class="glink" id="toLogin" data-i18n="gate.login"></button></p>
    </form>
  </div>
</div>

<header>
  <div class="hin"><div class="hrow">
    <h1 class="brand"><span class="pips"><i></i><i></i><i></i></span><span data-i18n="app.title"></span></h1>
    <select id="tableSel" data-i18n-aria="header.tableAria"></select>
    <span class="spacer"></span>
    <span class="acct" id="acctBar" hidden>
      <span class="acctnote" id="acctNote" hidden data-i18n="gate.offline"></span>

<main>

        </div></div>
        </div>

  </div>
