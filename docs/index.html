  $("viewToggle").onclick = () => setView(viewNow === "full" ? "simple" : "full");
  live = new LiveWatcher({
    onRead: onLiveRead,
    onState: onLiveState,
    intervalMs: Number($("liveInterval").value),
  });
  // Nothing is made first. With a table chosen the reader fills it; with none,
  // it reads onto the unsaved sheet -- see `unsaved`.
  $("liveStart").onclick = () => live.start();
  $("liveCamera").onclick = () => live.startCamera();
  renderLiveSources();
  $("liveStop").onclick = () => { live.stop(); liveLog(t("live.logStopped")); };
  $("liveRelock").onclick = () => {
    live.relock(); liveHolds = 0; livePinned = null; setLiveWarn(null);
    liveLog(t("live.logRelock"));
  };
  bindRegionPicker();
  $("liveInterval").onchange = (e) => live.setSampleInterval(Number(e.target.value));
  if (!LiveWatcher.supported) { live.error = "unsupported"; live._emit(); }

  // The same five actions as the manual panel, kept within thumb reach.
  for (const [id, run] of [["qbP", () => addOutcomes("P")], ["qbB", () => addOutcomes("B")],
                           ["qbT", () => addOutcomes("T")], ["qbUndo", undo], ["qbNew", newShoe]]) {
    $(id).onclick = run;
  }

  // Zeroing the tally is not deleting anything: every coup stays, and the ones
  // before the mark go on making the pick. Pressing it again counts them all
  // once more.
  $("ledgerFrom").onclick = () => {
    const name = chosenTable();
    const entry = name ? state.tables[name] : unsaved;
    if (ledgerFrom(name)) delete entry.from;
    else entry.from = tableCoups(name);
    commitTo(name, []);
  };
  // The shoe, or the whole table: which coups the tally on screen counts. It
  // changes nothing but that, so it redraws the block and nothing else.
  $("ledgerScope").onclick = () => {
    ledgerScope = ledgerScope === "shoe" ? "table" : "shoe";
    try { localStorage.setItem(LEDGER_SCOPE_KEY, ledgerScope); } catch { /* this visit only */ }
    renderBetOutcome();
    foldExplanations();                       // the note under it was rewritten
  };

  $("runIntegrity").onclick = runIntegrity;
  $("reps").onchange = renderIntegrityAvailability;
  $("cancelIntegrity").onclick = () => { if (integrityRun) integrityRun.cancelled = true; };

  $("exportCsv").onclick = () => {
    const rows = corpusRows(state.tables);
    if (!rows.length) { $("exportNote").textContent = t("tools.exportEmpty"); return; }
    download(`baccarat-${new Date().toISOString().slice(0, 10)}.csv`, toCsv(rows));
  };
  $("exportJson").onclick = () => {
    const rows = corpusRows(state.tables);
    if (!rows.length) { $("exportNote").textContent = t("tools.exportEmpty"); return; }
    download(`baccarat-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(rows, null, 1));
  };

  // Emptying a table is not deleting it. A table that went wrong -- a shoe read
  // off the wrong board, a session that turned out to be free play -- wants its
  // record gone and itself kept, because it is still the table in front of you
  // and it is about to be recorded again. Deleting and retyping the name gets
  // there too, and loses the name's history on the way.
  $("clearTable").onclick = async () => {
    const name = state.active;
    if (!name || !state.tables[name]) return;
    const coups = tableCoups(name);
    if (!coups) return;                       // nothing to clear
    if (!confirm(t("tools.clearConfirm", { table: name, coups: coups.toLocaleString() }))) {
      return;
    }
    const ids = shoes(name).map((s) => s.id);
    if (liveTable === name) { live.stop(); liveLog(t("live.logStopped")); }
    // The same reasoning as deleting: a prediction log whose coups are gone
    // holds figures nothing can be checked against.
    forgetPredictions(predictionLog, name);
    store.saveLog(predictionLog);
    learners.forget(name);
    state.tables[name] = { shoes: [] };
    await store.deleteShoes(ids);
    commit([]);
  };

  $("resetBtn").onclick = async () => {
    if (!state.active || !state.tables[state.active]) return;   // nothing to delete
    if (!confirm(t("tools.resetConfirm", { table: state.active }))) return;
    const ids = shoes().map((s) => s.id);
    if (liveTable === state.active) { live.stop(); liveLog(t("live.logStopped")); }
    // Its record of what was predicted goes with it. Keeping the log of a
    // table whose coups are gone would leave figures nothing can be checked
    // against, and would quietly re-attach to the next table given that name.
    forgetPredictions(predictionLog, state.active);
    store.saveLog(predictionLog);
    learners.forget(state.active);
    delete state.tables[state.active];
    // Nothing invented in its place. Deleting the last table leaves the
    // selector blank, and whatever is started next brings a table with it.
    state.active = Object.keys(state.tables)[0] || null;
    await store.deleteShoes(ids);
    commit([]);
  };

  // Clearing one table leaves the others, which is right for a table that went
  // wrong and wrong for a corpus that did. Nothing here is recoverable, so it
  // counts what it is about to destroy and says so.
  $("resetAllBtn").onclick = async () => {
    const names = Object.keys(state.tables);
    const coups = names.reduce((n, name) => n + tableCoups(name), 0);
    if (!coups && names.length <= 1) return;
    if (!confirm(t("tools.resetAllConfirm", { tables: names.length, coups: coups.toLocaleString() }))) {
      return;
    }
    const ids = names.flatMap((name) => shoes(name).map((s) => s.id));
    live.stop();
    liveLog(t("live.logStopped"));
    state = { tables: {}, active: null };
    unsaved = { shoes: [] };          // everything is everything on screen too
    predictionLog = emptyLog();
    store.saveLog(predictionLog);
    await store.deleteShoes(ids);
    commit([]);
  };

  /*
   * No context menu on the page.
   *
   * Two carve-outs, because blocking those would take away a way in rather
   * than a menu nobody asked for. A text field keeps its menu: paste is what
   * that menu is for, and the results box is meant to be pasted into. And a
   * long press on a touch screen is left alone -- on a phone that gesture *is*
   * the paste.
   *
   * Which pointer opened it is not on the event, so the last one down is
   * remembered. A keyboard menu key never touches a pointer, so it inherits
   * whatever came last, which is the harmless way round.
   */
  let lastPointerWasMouse = true;
  document.addEventListener("pointerdown", (e) => {
    lastPointerWasMouse = e.pointerType === "mouse";
  }, true);

  document.addEventListener("contextmenu", (e) => {
    if (!lastPointerWasMouse) return;
    const el = e.target;
    if (el && typeof el.closest === "function" && el.closest("input, textarea")) return;
    e.preventDefault();
  });

  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    // The guest's view reads its coups off the screen, and has no keypad and
    // no undo. A stray P or N there wrote a coup the table never dealt, or
    // closed the shoe being read -- and nothing on screen offered it back.
    if (viewNow !== "full") return;
    const tag = (e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea" || tag === "select") return;
    const act = { p: () => addOutcomes("P"), b: () => addOutcomes("B"), t: () => addOutcomes("T"),
                  u: undo, n: newShoe }[e.key.toLowerCase()];
    if (act) { e.preventDefault(); act(); flash(e.key.toLowerCase()); }
  });
}

/* Fast entry needs to confirm the keystroke landed, and say what it did --
   "U 기록됨" would read as if an undo had been recorded as a coup. */
const flashText = (key) => ({
  p: () => t("flash.recorded", { side: side("P") }),
  b: () => t("flash.recorded", { side: side("B") }),
  t: () => t("flash.recorded", { side: side("T") }),
  u: () => t("flash.undo"),
  n: () => t("flash.newShoe"),
}[key] || (() => key))();

function flash(key) {
  flashNote("✓ " + flashText(key));
}

/** A line in the header that says itself and then gets out of the way. */
function flashNote(msg, ms = 400) {
  const node = $("shoeMeta");
  node.textContent = msg;
  setTimeout(() => { if (node.textContent === msg) renderHeader(); }, ms);
}

/**
 * What removed features left in this browser.
 *
 * Rooms, the shared record and signing in to it are gone from the page, but a
 * browser that used them still holds their keys: the room it was in and the
 * coups it owed that room, the record's address -- and a session token for
 * it, which is a credential and has no business outliving the feature that
 * needed it. Nothing reads them any more; they are removed on the first visit
 * after.
 */
const RETIRED_KEYS = [
  "baccarat.room.v1", "baccarat.room.table.v1", "baccarat.room.pairs.v1",
  "baccarat.room.queue.v1", "baccarat.share.v1", "baccarat.share.session.v1",
  "baccarat.share.calls.v1",
];

function forgetRetired() {
  for (const key of RETIRED_KEYS) {
    try { localStorage.removeItem(key); } catch { /* storage refused: it kept nothing either */ }
  }
}

async function boot() {
  forgetRetired();
  store.onStatus = (s) => {
    $("storeLabel").textContent = t("store." + s);
    $("storeDot").className = "sdot " + s;
  };
  // A second tab of the same browser used to be a way to lose coups: both
  // hold the whole corpus and both write all of it, so whichever saved last
  // erased the other's. Taking the newer copy the moment it lands keeps this
  // tab from writing a stale one back over it.
  //
  // The shoes, yes. Not which table this document is looking at -- `active`
  // rides along in the same object, and adopting it meant a tab showing HANN
  // switched to OTHER the instant a second tab chose OTHER. Whoever was
  // standing at HANN then entered their next result against OTHER, and a coup
  // filed under the wrong table is worse than one not filed at all, because
  // the record still looks whole. Two tables in front of you is the reason to
  // open a second tab in the first place.
  store.watchOtherTabs((incoming) => {
    const here = state.active;
    state = startingState(incoming);
    // Unless that table is what the other tab deleted. And no table chosen here
    // stays no table chosen, for the same reason.
    if (here && state.tables[here]) state.active = here;
    else if (!here) state.active = null;
    invalidate();
    render();
    flashNote(t("store.elsewhere"));
  }, (raw) => {
    // Not settled here. The other tab settled it against its own corpus, and
    // the corpus event for that write arrives first -- storage events are
    // delivered in the order the writes were made -- but settling against a
    // corpus that is somehow still behind would read every coup it lacks as
    // undone and delete those predictions. The next coup here settles it.
    predictionLog = sanitiseLog(raw);
    // Only what the log is drawn into. A whole `render()` here lands a few
    // milliseconds after the corpus adoption above, whose note -- this view
    // just changed under you -- is the one thing the person needs to see, and
    // redrawing the header erased it before it could be read. Caught by
    // `tests/browser/test_storage.py`, in a real browser with two real tabs.
    renderVerification();
  });
  initPreferences();
  bindTextPaste();
  bindControls();
  bindRoads();
  bindStake();
  // The handler only fires on a change, so without this the header sits blank
  // until something goes wrong -- and where the shoes are being kept is worth
  // saying before, not only after. It has to come after the language is
  // settled and after the control that re-labels on a change is bound, or
  // three of the four languages carry a Korean badge until someone switches.
  store.onStatus(store.status);
  renderLiveIntervals();

  // Reflect the restored theme on the control now that it exists.
  for (const [name, id] of [["auto", "themeAuto"], ["light", "themeLight"], ["dark", "themeDark"]]) {
    $(id).classList.toggle("on", currentTheme() === name);
  }

  state = startingState(store.readLocal());
  predictionLog = sanitiseLog(store.readLog());
  settleLog();
  invalidate();
  render();
  applyView();
  // A paragraph that fitted in two lines at one width may not at another.
  let refold = null;
  window.addEventListener("resize", () => {
    clearTimeout(refold);
    refold = setTimeout(foldExplanations, 150);
  });

  await store.connect();
  const loaded = await store.load();
  if (loaded && !loaded.isExample && Object.keys(loaded.tables || {}).length) {
    state = loaded;
    // Coups that arrived from the shared store settle predictions this view
    // made before it had them.
    settleLog();
    invalidate();
    render();
  }
}

boot();
</script>
