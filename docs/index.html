 * One, and the value is measured rather than chosen. Swept over 600 tables of
 * 3,000 coups each, every rule walking the table coup by coup and predicting
 * from what came before -- hit rate on decided coups, against always backing
 * Banker, at a noise floor of +-0.039pp:
 *
 *     threshold   fair   clustered   B 52%   P 49%   P 47%   P 45%
 *     0 SE       -0.58      +0.03    -0.49   +1.56   +5.57   +9.63
 *     0.5 SE     -0.09      +0.10    -0.02   +0.73   +4.20   +8.21
 *     1 SE       -0.01      +0.05    -0.00   +0.24   +2.80   +6.72
 *     2 SE       +0.00      +0.01    +0.00   +0.00   +0.50   +3.52
 *     3 SE       +0.00      +0.00    +0.00   +0.00   +0.01   +0.73
 *
 * One standard error dominates two: indistinguishable from it on a fair table
 * and on a Banker-leaning one -- both inside the noise -- and better by 2.3
 * points of hit rate on a table genuinely biased to Player, 3.2 on a strongly
 * biased one. There is no column where it is measurably worse, so the old
 * threshold was buying nothing with the coups it spent waiting.
 *
 * Going further is not free. At half a standard error the fair-table cost
 * becomes real (-0.09pp, over twice the noise) and at zero it is severe
 * (-0.58pp, and -0.49 on a Banker-leaning table) -- which is the measurement
 * that put the threshold at two in the first place. What that measurement
 * never tested was the ground in between.
 *
 * Worth being exact about what this improves. On a fair table it changes
 * nothing, because there is nothing to change: the commission still puts both
 * sides under water and the panel still says so. The whole gain is on tables
 * that really are biased -- which is the only kind this project exists to
 * find, and the only kind where being right matters.
 */
const SWITCH_EVIDENCE = 1;

/**
 * Which side to back.
 *
 * Backing whichever side the estimate says has the better expectation is the
 * obvious rule and it is worse at everything. The crossover sits 0.05pp above
 * a fresh shoe, while the estimate's own error runs to tenths of a point for
 * thousands of coups -- so the comparison is decided by noise, and the two
 * sides it is deciding between differ by almost nothing in expectation anyway.
 * Chasing it means changing sides over and over on evidence that is not there.
 *
 * Measured over six fair tables of 49,000 coups: picking by expectation won
 * 45.44% of coups and lost 540 units; holding Banker unless the estimate has
 * cleared the crossover won 45.98% and lost 416. Better on both counts,
 * because on a fair table Banker is simply the side that wins more often, and
 * nothing short of real evidence should give that up.
 *
 * What the gate costs is speed on a table that is genuinely biased to Player.
 * How much it costs depends entirely on how wide it is set, which is why
 * `SWITCH_EVIDENCE` above is a swept value and not a round number.
 */
function sidePick(q, se) {
  return SIDE_CROSSOVER - q > SWITCH_EVIDENCE * se ? "P" : "B";
}

/**
 * The next coup's estimate from what this table has produced so far.
 *
 * `sample` is what `measure()` counts: `n` decided coups of which the Banker
 * share is `q`, `ties` out of `coups` in total, and `inflate` the square root
 * of the shoe-share dispersion. Coups inside one shoe are not independent
 * draws, so each carries less information than a fresh one; dividing the
 * counts by the design effect is what keeps the posterior from believing a
 * clustered sample more than it deserves.
 */
function posterior(sample = {}) {
  const { n = 0, coups = 0, ties = 0, q: qObserved, inflate } = sample;
  const deff = n && Number.isFinite(inflate) ? Math.max(1, inflate ** 2) : 1;

  const nEff = n ? n / deff : 0;
  const qObs = n ? qObserved : 0;              // undefined until a coup decides
  const a = PRIOR_A + qObs * nEff;
  const b = PRIOR_B + (1 - qObs) * nEff;
  const q = a / (a + b);
  const se = Math.sqrt((q * (1 - q)) / (a + b + 1));

  // Ties are counted over every coup, not just the decided ones. The same
  // clustering discount applies: it is measured on the Banker share, but what
  // it measures -- that coups in one shoe are not independent draws -- is a
  // property of the shoe, not of that one rate.
  const coupsEff = coups ? coups / deff : 0;
  const tieObs = coups ? ties / coups : 0;
  const tieA = TIE_PRIOR_A + tieObs * coupsEff;
  const tieB = TIE_PRIOR_B + (1 - tieObs) * coupsEff;
  const tie = tieA / (tieA + tieB);
  const decided = 1 - tie;

  const e = edges(q, tie);
  const pick = sidePick(q, se);
  const z = se > 0 ? Math.abs(q - SIDE_CROSSOVER) / se : 0;

  return {
    q, se, tie, decided, z, pick, edge: e[pick],
    informed: n > 0,
    // How much of the estimate is this table's own data rather than the prior.
    // The prior is deliberately heavy -- it is worth about seven thousand
    // coups -- which is why one result moves the number by thousandths of a
    // point. That is the estimate behaving as designed, but on screen it reads
    // as a stuck figure unless the weight behind it is stated.
    weight: nEff / (PRIOR_STRENGTH + nEff),
    n, coups,
    probability: { P: decided * (1 - q), B: decided * q, T: tie },
    confidence: z >= 2 ? "high" : z >= 1 ? "medium" : "low",
    moved: Math.abs(q - BASE_BANKER_SHARE),
  };
}

/**
 * What backing the recommendation would actually have come to.
 *
 * Not the probabilities again -- those are the prediction, and showing them a
 * second time relabelled says nothing new. This walks the corpus one coup at a
 * time and settles a wager on each: at every coup the pick is recomputed from
 * the coups *before* it only, a unit goes on that side, and the result is
 * added up. Nothing here sees a coup before betting on it, which is the whole
 * point -- scoring a pick against the data that produced it flatters it.
 *
 * A tie returns the stake, so it is neither a win nor a loss and does not
 * count as a bet. A Banker win pays 0.95 after commission; everything else
 * pays or costs one.
 *
 * `deff` is the clustering discount. It is estimated once over the whole
 * corpus rather than re-estimated at each coup: it says how much a shoe's
 * coups repeat each other, not which side is going to win, so it cannot leak
 * the answer -- and using it keeps this replay on the same footing as the
 * estimate the panel shows live.
 */
function replayPicks(sequences, { deff = 1, commission = 0.05, from = 0 } = {}) {
  const step = 1 / Math.max(1, deff);
  let a = PRIOR_A, b = PRIOR_B;

  // Coups before `from` still train the estimate -- they are what the pick is
  // made of -- but they are not settled. That is the difference between the
  // record of a wager somebody could have placed from a moment onwards and a
  // figure attached to everything a table ever did, and the two are not the
  // same evidence. Because the pick at each coup is computed from the coups
  // before it either way, settling only the tail gives exactly the numbers
  // somebody following the pick from that moment would have.
  let seen = 0;
  let bets = 0, wins = 0, losses = 0, pushes = 0, coups = 0;
  // The coup this replay settled last, so a reader can see what the pick just
  // did rather than only what every pick before it added up to.
  let last = null;
  let units = 0, peak = 0, drawdown = 0, best = 0, worst = 0;
  let bankerBets = 0, playerBets = 0;

  for (const seq of sequences) {
    for (const outcome of seq) {
      // decide on what was knowable at the time, by the rule the panel uses
      const q = a / (a + b);
      const se = Math.sqrt((q * (1 - q)) / (a + b + 1));
      const pick = sidePick(q, se);
      const settling = seen >= from;
      seen += 1;
      if (settling) coups += 1;

      if (!settling) {
        // not ours to settle, but still ours to learn from
      } else if (outcome === "T") {
        pushes += 1;
        last = { pick, outcome, kind: "push", paid: 0, units };
      } else {
        bets += 1;
        if (pick === "B") bankerBets += 1; else playerBets += 1;
        let paid;
        if (outcome === pick) {
          wins += 1;
          paid = pick === "B" ? 1 - commission : 1;
          units += paid;
        } else {
          losses += 1;
          paid = -1;
          units -= 1;
        }
        last = { pick, outcome, kind: paid > 0 ? "win" : "lose", paid, units };
        peak = Math.max(peak, units);
        drawdown = Math.min(drawdown, units - peak);
        best = Math.max(best, units);
        worst = Math.min(worst, units);
      }

      // and only then learn from it
      // A tie decides nothing, so it moves neither side of the Banker share.
      if (outcome !== "T") {
        if (outcome === "B") a += step; else b += step;
      }
    }
  }

  return {
    last,
    from, trained: Math.min(from, seen), faced: seen,
    coups, bets, wins, losses, pushes, units, drawdown, best, worst,
    bankerBets, playerBets,
    winRate: bets ? wins / bets : 0,
    perBet: bets ? units / bets : 0,
  };
}

/**
 * What a stake actually comes to, per hand, per day, per month.
 *
 * The panel above this one reports an edge of a percent or so a hand, and a
 * percent of a hand is not a number anybody can plan against. This turns it
 * into the two things that are: money, and time.
 *
 * The interval is the point of it. A hand of baccarat has an expectation near
 * -0.011 units and a standard deviation near 0.93 -- eighty-seven times the
 * size -- so a day's play is almost entirely noise and a month's is still
 * mostly noise. Quoting the mean alone would turn that into a forecast, and
 * the forecast would be wrong in both directions: it would promise a steady
 * drip of losses to somebody who is about to have a good week, and it would
 * hide that the good week means nothing. The spread is what says how long it
 * takes before the edge is what you are actually seeing.
 *
 * `q` is the Banker share among decided coups and `tieP` the tie rate, both
 * from `posterior`. `side` is what a unit would be going on.
 */
function wagerMoments(q, tieP, side) {
  const decided = 1 - tieP;
  const pB = decided * q, pP = decided * (1 - q);
  // A tie returns the stake: neither a win nor a loss, and no variance either.
  const win = side === "B" ? 1 - BANKER_COMMISSION : 1;
  const pWin = side === "B" ? pB : pP;
  const pLose = side === "B" ? pP : pB;
  const mean = win * pWin - pLose;
  const second = win * win * pWin + pLose;
  return { mean, sd: Math.sqrt(Math.max(0, second - mean * mean)) };
}

/** 1.96 sigma, the same coverage every other interval in this app quotes. */
const Z95 = 1.96;

/**
 * The projection itself, one row per horizon.
 *
 * Hands compound the mean linearly and the spread as a square root, which is
 * the whole reason a losing game can look like a winning one for a month: over
 * n hands the edge grows as n and the noise as sqrt(n), so the noise leads
 * until n is large enough for the edge to overtake it. `breakEvenHands` is
 * where that happens -- where the 95% band finally stops containing zero, and
 * so the first honest answer to "how long until I know".
 */
function projectStake({ q, tieP, side = "B", unit = 1, bankroll = 0,
                               handsPerDay = 0, daysPerMonth = 0 } = {}) {
  const { mean, sd } = wagerMoments(q, tieP, side);
  const row = (hands) => {
    const m = mean * hands * unit;
    const half = Z95 * sd * Math.sqrt(hands) * unit;
    return {
      hands, mean: m, lo: m - half, hi: m + half,
      ofBankroll: bankroll > 0 ? m / bankroll : null,
    };
  };
  const perDay = Math.max(0, Math.round(handsPerDay));
  const perMonth = perDay * Math.max(0, Math.round(daysPerMonth));
  // Where the band stops straddling zero: |mean| n = 1.96 sd sqrt(n).
  const breakEvenHands = mean === 0 ? Infinity
    : Math.ceil((Z95 * sd / Math.abs(mean)) ** 2);
  return {
    perHand: mean * unit, sdPerHand: sd * unit, side, breakEvenHands,
    hand: row(1), day: row(perDay), month: row(perMonth),
  };
}

/**
 * How many more decided coups it would take to reach a given confidence.
 *
 * Confidence here is `z = |q - crossover| / se`, and neither term is a setting:
 * the first is what the table has produced, the second is how much of it there
 * is. So "raise the confidence" has exactly one answer -- collect more -- and
 * the only useful thing the app can add is *how much* more.
 *
 * Solved by search rather than algebra because the posterior's standard error
 * moves with the estimate, which moves with the sample. The search is over the
 * effective sample size, so a clustered record is told the truth about what its
 * own coups are worth.
 *
 * Returns null where the question has no answer: before anything has been
 * decided, and for a table sitting so near the crossover that no amount of
 * collecting separates it from one (the sample grows, the estimate stays put,
 * and z climbs so slowly that the honest answer is "not in any session").
 */
const CONFIDENCE_Z = { medium: 1, high: 2 };

/**
 * Past this, the answer is "no" rather than a number.
 *
 * The search will happily report that a share sitting a fifteenth of a point
 * off the crossover reaches high confidence in 2,215,028 coups. That is true
 * and it is useless: nobody plays two million hands, and printing the figure
 * dresses "never" up as a plan. The app's own collection panel tops out at
 * 1,178 shoes -- about 95,000 coups -- which is the most it asks anybody to
 * gather, so a count past that horizon is not a count worth quoting.
 */
const PRACTICAL_HORIZON = 100_000;
const SEARCH_CAP = 8_000_000;

function coupsForConfidence(sample = {}, targetZ = 2) {
  const { n = 0, q: qObserved, inflate } = sample;
  if (!n || !Number.isFinite(qObserved)) return null;
  const deff = Number.isFinite(inflate) ? Math.max(1, inflate ** 2) : 1;

  const zAt = (nEff) => {
    const a = PRIOR_A + qObserved * nEff;
    const b = PRIOR_B + (1 - qObserved) * nEff;
    const q = a / (a + b);
    const se = Math.sqrt((q * (1 - q)) / (a + b + 1));
    return se > 0 ? Math.abs(q - SIDE_CROSSOVER) / se : 0;
  };

  const have = n / deff;
  if (zAt(have) >= targetZ) return 0;
  if (zAt(SEARCH_CAP) < targetZ) return null;          // never, at this share

  let lo = have, hi = SEARCH_CAP;
  for (let i = 0; i < 60; i += 1) {
    const mid = (lo + hi) / 2;
    if (zAt(mid) >= targetZ) hi = mid; else lo = mid;
  }
  // Back out of effective coups into real ones: clustering means a real coup
  // is worth less than one, so more of them are needed.
  const need = Math.ceil((hi - have) * deff);
  return need > PRACTICAL_HORIZON ? null : need;
}

/* ═══ learn.js ═══ */
/* A network that learns from the table in front of it.
 *
 * The estimate this app recommends from is a conjugate posterior over one
 * number: how often this table's Banker side wins. It cannot express "Banker
 * after four Players", because it does not look at order at all. A network
 * can. Whether there is anything in the order to find is a different question,
 * and this file is built so that the answer it gives is trustworthy either way.
 *
 * Three properties make it trustworthy.
 *
 * Every prediction is made before the coup it predicts. The pass below walks
 * the table's coups in order and, at each one, predicts from what came before
 * and only then learns from what happened. Nothing it reports was scored with
 * knowledge of its own answer, which is the failure that makes most published
 * baccarat models look profitable.
 *
 * It is scored against the alternative, not against a coin. Beating 50% means
 * nothing here: always backing Banker wins about 50.7% of decided coups
 * without looking at anything. The pass therefore settles both wagers on the
 * same coups and reports both, so "better" means better than the thing it
 * would replace.
 *
 * And it is only believed when the margin is bigger than the noise. Over a few
 * hundred coups a worthless model beats a good one about half the time. The
 * gate at the bottom asks for a lead that a fair table would produce less than
 * about one time in forty, and for enough coups to ask the question at all.
 *
 * This repository's own backtest of 38 models over 1.6M coups returned no
 * model with positive ROI and none significant after correction, and the best
 * win rate of all of them belonged to always betting Banker. The honest
 * expectation is that the gate below stays shut.
 */



/** Coups of order the network is shown. */
/**
 * The network's own version, for the prediction log.
 *
 * Separate from the estimate's: the two are different rules and a record has
 * to say which one named the side, or a stretch where the network was trusted
 * is indistinguishable from a stretch where it was not.
 */
const NET_MODEL_VERSION = "net-1";

const CONTEXT = 6;
/** Inputs: the context one-hot, then the summaries, then a bias. */
const INPUTS = CONTEXT * 3 + 7;
/** Hidden units. Small on purpose: a few hundred coups cannot train more. */
const HIDDEN = 12;

const OUTCOMES = "PBT";

/**
 * The network's view of the coups before position `i`.
 *
 * Order first -- the last six outcomes, as they came -- then what the shoe has
 * looked like so far. The summaries are centred near zero and scaled to about
 * a unit, which is what keeps a small network's gradients well behaved.
 */
function features(seq, i, out = new Float64Array(INPUTS)) {
  out.fill(0);
  for (let k = 0; k < CONTEXT; k += 1) {
    const at = i - 1 - k;
    if (at < 0) continue;
    const code = OUTCOMES.indexOf(seq[at]);
    if (code >= 0) out[k * 3 + code] = 1;
  }

  let bankers = 0, decided = 0, ties = 0, alternations = 0;
  let last = null, streak = 0, streakSide = 0;
  for (let at = 0; at < i; at += 1) {
    const o = seq[at];
    if (o === "T") { ties += 1; continue; }
    decided += 1;
    if (o === "B") bankers += 1;
    if (last !== null && o !== last) alternations += 1;
    if (o === last) streak += 1; else streak = 1;
    last = o;
    streakSide = o === "B" ? 1 : -1;
  }

  const base = CONTEXT * 3;
  out[base] = Math.min(streak, 8) / 8;                       // how long the run is
  out[base + 1] = streakSide;                                // and whose it is
  out[base + 2] = decided ? (bankers / decided - 0.5) * 4 : 0;
  out[base + 3] = i ? (ties / i - 0.095) * 8 : 0;
  out[base + 4] = decided > 1 ? alternations / (decided - 1) - 0.5 : 0;
  out[base + 5] = Math.min(i, 80) / 80;                      // how deep the shoe is
  out[base + 6] = 1;                                         // bias
  return out;
}

/**
 * One hidden layer, trained by backpropagation, predicting Player or Banker.
 *
 * Ties are not predicted: the wager is settled on the decided coups and a tie
 * returns the stake, so a tie is not a class to choose between -- it is a coup
 * the bet sits out. It still enters the network as context, because the order
 * it appears in is part of what the network is being asked to read.
 */
class Net {
  constructor(seed = 1, { hidden = HIDDEN, decay = 1e-4 } = {}) {
    const rng = makeRng(seed);
    this.hidden = hidden;
    this.decay = decay;
    // Small symmetric weights, scaled by fan-in so the first outputs are near
    // even and the network is not saturated before it has seen anything.
    const spread = (n) => 1 / Math.sqrt(n);
    this.w1 = new Float64Array(INPUTS * hidden);
    this.w2 = new Float64Array(hidden * 2);
    for (let i = 0; i < this.w1.length; i += 1) this.w1[i] = (rng() * 2 - 1) * spread(INPUTS);
    for (let i = 0; i < this.w2.length; i += 1) this.w2[i] = (rng() * 2 - 1) * spread(hidden);
    this.b1 = new Float64Array(hidden);
    this.b2 = new Float64Array(2);
    this.h = new Float64Array(hidden);
    this.p = new Float64Array(2);
  }

  /** P(Player), P(Banker) for one feature vector, remembered for the update. */
  predict(x) {
    const { hidden, w1, w2, b1, b2, h, p } = this;
    for (let j = 0; j < hidden; j += 1) {
      let sum = b1[j];
      for (let i = 0; i < INPUTS; i += 1) sum += x[i] * w1[i * hidden + j];
      h[j] = Math.tanh(sum);
    }
    let a = b2[0], b = b2[1];
    for (let j = 0; j < hidden; j += 1) { a += h[j] * w2[j * 2]; b += h[j] * w2[j * 2 + 1]; }
    // Softmax over two, written as a logistic on the difference so a large
    // logit cannot overflow.
    const pb = 1 / (1 + Math.exp(a - b));
    p[0] = 1 - pb; p[1] = pb;
    return p;
  }

  /** One gradient step on the coup that just happened. `side` is 0 P, 1 B. */
  learn(x, side, lr) {
    const { hidden, w1, w2, b1, b2, h, p, decay } = this;
    const d2 = [p[0] - (side === 0 ? 1 : 0), p[1] - (side === 1 ? 1 : 0)];
    const dh = new Float64Array(hidden);
    for (let j = 0; j < hidden; j += 1) {
      dh[j] = (d2[0] * w2[j * 2] + d2[1] * w2[j * 2 + 1]) * (1 - h[j] * h[j]);
      w2[j * 2] -= lr * (d2[0] * h[j] + decay * w2[j * 2]);
      w2[j * 2 + 1] -= lr * (d2[1] * h[j] + decay * w2[j * 2 + 1]);
    }
    b2[0] -= lr * d2[0];
    b2[1] -= lr * d2[1];
    for (let i = 0; i < INPUTS; i += 1) {
      const xi = x[i];
      if (!xi) continue;
      for (let j = 0; j < hidden; j += 1) {
        const at = i * hidden + j;
        w1[at] -= lr * (dh[j] * xi + decay * w1[at]);
      }
    }
    for (let j = 0; j < hidden; j += 1) b1[j] -= lr * dh[j];
  }
}

/**
 * What one wager did, settled the way the table settles it.
 *
 * The same shape `replayPicks` keeps, because the panel reads whichever of the
 * two is being followed and must not care which one that is.
 */
function settleInto(book, pick, outcome, commission) {
  book.coups += 1;
  if (outcome === "T") {
    book.pushes += 1;
    book.last = { pick, outcome, kind: "push", paid: 0, units: book.units };
    return;
  }
  book.bets += 1;
  if (pick === "B") book.bankerBets += 1; else book.playerBets += 1;
  let paid;
  if (outcome === pick) {
    book.wins += 1;
    paid = pick === "B" ? 1 - commission : 1;
    book.units += paid;
  } else {
    book.losses += 1;
    paid = -1;
    book.units -= 1;
  }
  book.last = { pick, outcome, kind: paid > 0 ? "win" : "lose", paid, units: book.units };
  book.peak = Math.max(book.peak, book.units);
  book.drawdown = Math.min(book.drawdown, book.units - book.peak);
  book.best = Math.max(book.best, book.units);
  book.worst = Math.min(book.worst, book.units);
}

const empty = () => ({
  coups: 0, bets: 0, wins: 0, losses: 0, pushes: 0, units: 0,
  bankerBets: 0, playerBets: 0,
  peak: 0, drawdown: 0, best: 0, worst: 0, last: null,
});
const rate = (b) => (b.bets ? b.wins / b.bets : 0);
const perBet = (b) => (b.bets ? b.units / b.bets : 0);
const finish = (b) => ({ ...b, winRate: rate(b), perBet: perBet(b) });

/**
 * The training half of a walk-forward pass, kept resumable.
 *
 * Every value the loop carries -- the network, its replay buffer, the random
 * stream -- moves forward only, and `features(seq, i)` reads nothing past `i`.
 * So the state after coup n is exactly the state coup n+1 needs, and a corpus
 * that has only gained coups can be continued rather than replayed. That
 * matters because the alternative is what the panel used to do: re-train the
 * whole network on every single coup, which at eight hundred shoes cost three
 * quarters of a second per coup and grew from there without bound.
 *
 * What it produces is the network's pick for each coup, in order, decided
 * before that coup was learned from. The books are settled from that
 * separately, in `settleAll`, because the estimate they are compared against
 * depends on a clustering discount that moves as the corpus grows -- cheap to
 * redo in full, and wrong to freeze into a resumed run.
 */
function newRun({ seed = 7, lr = 0.05, replay = 4 } = {}) {
  return {
    opts: { seed, lr, replay },
    net: new Net(seed),
    rng: makeRng(seed ^ 0x5f3759df),
    past: [],                            // features and answers already seen
    picks: [],                           // the network's pick for each coup, in order
    seen: [],                            // the sequences consumed, as consumed
    lastProbability: null,
    x: new Float64Array(INPUTS),
    mark: null,                          // the run as it stood before the open shoe
  };
}

/**
 * The run as it stands, before the shoe at index `s` is walked.
 *
 * What an undone coup costs is the question this answers. Continuing a run is
 * cheap because the pass only moves forward; anything that is not a pure
 * append -- a coup taken back, a coup corrected, a room handing back a shoe
 * shifted by one -- used to start the network again from nothing and retrain
 * it over the whole record. Measured at the collection panel's own target of
 * 1,178 shoes: 1,605ms for one undo, on a desktop, on the thread that draws
 * the page. A phone is several times slower, and an undo is the most ordinary
 * thing anyone does at a table.
 *
 * Nearly all of those changes land in the shoe being dealt, so one mark is
 * kept, taken as that shoe begins: the weights, where the generator had got
 * to, and how long the append-only lists were. Going back to it and walking
 * forward again touches one shoe instead of the record. About three
 * kilobytes, because the network is small; the lists are cut back rather than
 * copied, since nothing before the mark is ever changed.
 */
function checkpoint(run, s) {
  const { net } = run;
  return {
    s,
    w1: Float64Array.from(net.w1), w2: Float64Array.from(net.w2),
    b1: Float64Array.from(net.b1), b2: Float64Array.from(net.b2),
    rng: run.rng.state(),
    past: run.past.length,
    picks: run.picks.length,
    lastProbability: run.lastProbability,
  };
}

/**
 * Put the run back where `mark` found it, if the record allows.
 *
 * Only when every shoe before the mark is exactly the shoe the run walked:
 * the mark is a promise about everything before it, and a change further back
 * breaks it. Returns whether it went back; the caller starts again from
 * nothing when it did not.
 */
function rewind(run, sequences) {
  const m = run.mark;
  if (!m || sequences.length < m.s) return false;
  for (let i = 0; i < m.s; i += 1) {
    if (sequences[i] !== run.seen[i]) return false;
  }
  const { net } = run;
  net.w1.set(m.w1); net.w2.set(m.w2); net.b1.set(m.b1); net.b2.set(m.b2);
  run.rng.restore(m.rng);
  run.past.length = m.past;
  run.picks.length = m.picks;
  run.seen.length = m.s;
  run.lastProbability = m.lastProbability;
  return true;
}

/** True when `sequences` only adds coups to what `run` has already consumed. */
function extendsRun(run, sequences) {
  if (sequences.length < run.seen.length) return false;
  for (let i = 0; i < run.seen.length; i += 1) {
    const had = run.seen[i];
    const now = sequences[i];
    if (typeof now !== "string") return false;
    // Every shoe but the last is finished and must match exactly; the last one
    // is the open one, and may have grown.
    if (i < run.seen.length - 1 ? now !== had : !now.startsWith(had)) return false;
  }
  return true;
}

/** Walk `run` forward over whatever `sequences` has that it has not seen. */
function advance(run, sequences) {
  const { lr, replay } = run.opts;
  const x = run.x;
  for (let s = 0; s < sequences.length; s += 1) {
    const seq = sequences[s];
    const from = s < run.seen.length ? run.seen[s].length : 0;
    // The open shoe, starting: this is where an undo will want to come back to.
    if (s === sequences.length - 1 && from === 0) run.mark = checkpoint(run, s);
    for (let i = from; i < seq.length; i += 1) {
      features(seq, i, x);
      const p = run.net.predict(x);
      run.picks.push(p[1] >= p[0] ? "B" : "P");
      run.lastProbability = { P: p[0], B: p[1] };

      // Only now may the coup be learned from.
      const outcome = seq[i];
      if (outcome !== "T") {
        const side = outcome === "B" ? 1 : 0;
        const snapshot = Float64Array.from(x);
        run.net.learn(x, side, lr);
        run.past.push({ x: snapshot, side });
        for (let r = 0; r < replay && run.past.length > 1; r += 1) {
          const drawn = run.past[(run.rng() * run.past.length) | 0];
          run.net.predict(drawn.x);
          run.net.learn(drawn.x, drawn.side, lr);
        }
      }
    }
    run.seen[s] = seq;
  }
  return run;
}

/**
 * Settle both books over the record, given the picks the network made.
 *
 * The estimate's own pick is recomputed here rather than carried, because the
 * clustering discount it counts with moves as the corpus grows.
 */
function settleAll(sequences, picks, { commission = BANKER_COMMISSION, deff = 1, from = 0 } = {}) {
  const step = 1 / Math.max(1, deff);
  const model = empty(), base = empty();
  let a = PRIOR_A, b = PRIOR_B;
  let coups = 0, agree = 0, decided = 0, split = 0, seen = 0;

  for (const seq of sequences) {
    for (let i = 0; i < seq.length; i += 1) {
      const modelPick = picks[seen];
      // Coups before the mark are what the two are made of, not what either is
      // judged on. Settling only the tail is the record of following the pick
      // from that moment, which is a different claim from a figure attached to
      // everything the table ever did -- and the stronger one, because nobody
      // was there for the rest of it.
      const settling = seen >= from;
      seen += 1;
      if (settling) coups += 1;

      const q = a / (a + b);
      const se = Math.sqrt((q * (1 - q)) / (a + b + 1));
      const basePick = sidePick(q, se);

      const outcome = seq[i];
      if (settling) {
        if (modelPick === basePick) agree += 1;
        // Only a settled coup separates them: on a tie both stakes come back
        // whoever picked what, so it carries no evidence either way.
        else if (outcome !== "T") split += 1;

        settleInto(model, modelPick, outcome, commission);
        settleInto(base, basePick, outcome, commission);
      }

      if (outcome !== "T") {
        // Every decided coup trains, mark or no mark, and `decided` is what
        // the panel means by "trained on". Counting only the settled ones told
        // a table that had just been marked that the network had learned from
        // nothing, while it had in fact learned from all of it.
        decided += 1;
        if (outcome === "B") a += step; else b += step;
      }
    }
  }
  return { model, base, coups, agree, decided, split, from, faced: seen };
}

/** What the panel reads: both books, the comparison, and the coup to come. */
function report(run, sequences,
                { commission = BANKER_COMMISSION, deff = 1, next = null, from = 0 } = {}) {
  const { model, base, coups, agree, decided, split, faced } =
    settleAll(sequences, run.picks, { commission, deff, from });

  // The coup that has not happened yet, which is what the panel recommends on.
  // The last pick in the record is the pick that was made for the coup at the
  // end of it -- a different question, and the one the panel was accidentally
  // asking.
  const upcoming = next === null ? (run.seen[run.seen.length - 1] || "") : next;
  let nextPick = null, nextProbability = null;
  if (coups) {
    features(upcoming, upcoming.length, run.x);
    const p = run.net.predict(run.x);
    nextPick = p[1] >= p[0] ? "B" : "P";
    nextProbability = { P: p[0], B: p[1] };
  }

  return {
    coups, decided, from, faced,
    nextPick, nextProbability,
    model: finish(model),
    base: finish(base),
    agree, agreement: coups ? agree / coups : 0,
    split,
    lastPick: run.picks.length ? run.picks[run.picks.length - 1] : null,
    lastProbability: run.lastProbability,
    ...verdict(model, base, split),
  };
}

/**
 * Walk the table's coups once, learning as it goes, and score the network
 * against the estimate it would replace.
 *
 * At every coup the network predicts from the coups before it, that prediction
 * is settled, and only then does the coup become training data. The posterior
 * it is compared against is advanced on exactly the same coups, so the two
 * books are the same wager placed two ways.
 *
 * `replay` extra gradient steps are taken per coup on coups drawn from the
 * past. A few hundred examples seen once each teach a network almost nothing;
 * drawing from what has already happened is how it gets to see them enough
 * times without ever seeing what has not happened yet.
 */
function walkForward(sequences, {
  seed = 7, lr = 0.05, replay = 4, commission = BANKER_COMMISSION, deff = 1,
  next = null,
} = {}) {
  const run = advance(newRun({ seed, lr, replay }), sequences);
  return report(run, sequences, { commission, deff, next });
}

/**
 * A walk-forward pass that is kept between calls.
 *
 * `update` continues the run when the corpus has only gained coups, and starts
 * over when it has not -- a coup undone, a table switched to, a pile of
 * screenshots imported. The result is the same object `walkForward` returns,
 * because it is built by the same two functions; the test suite pins that by
 * feeding a `Learner` one coup at a time and comparing.
 */
class Learner {
  constructor(options = {}) {
    this.options = options;
    this.run = newRun(options);
    this.restarts = 0;
    this.resumes = 0;
    this.rewinds = 0;
  }

  update(sequences, { commission = BANKER_COMMISSION, deff = 1, next = null, from = 0 } = {}) {
    if (extendsRun(this.run, sequences)) this.resumes += 1;
    // A successful rewind leaves exactly the shoes before the mark, and those
    // are what it checked -- so the run extends to `sequences` by construction
    // and asking `extendsRun` again would only repeat the question.
    else if (rewind(this.run, sequences)) this.rewinds += 1;
    else { this.run = newRun(this.options); this.restarts += 1; }
    advance(this.run, sequences);
    return report(this.run, sequences, { commission, deff, next, from });
  }
}


/**
 * A learner per table, the most recent few kept.
 *
 * The page kept one learner for whichever table was on screen, so every
 * switch was a record that had not merely grown -- a different record -- and
 * the network was retrained over the whole of it, both ways. Measured at 600
 * shoes a table: 865ms to switch, 743ms to switch back, on a desktop, on the
 * thread that draws the page. Two tables in front of you is the reason the
 * page names for opening a second tab, and one tab with a selector is the
 * other way of doing the same thing.
 *
 * Keeping a learner per table makes a switch back cost nothing, and it is
 * always safe to keep one: `update` compares the record it is given with the
 * record it walked, so a table that changed while it was not on screen -- a
 * live reader bound to it, a room, another tab -- is resumed, rewound or
 * rebuilt exactly as it would be on screen.
 *
 * Two by default, because each carries its replay buffer -- about 19 KB a
 * shoe -- and the collection target is over a thousand shoes a table. The
 * least recently used goes first, and a table it lets go of is simply
 * rebuilt the next time it is shown.
 */
class LearnerShelf {
  constructor(kept = 2, options = {}) {
    this.kept = Math.max(1, kept | 0);
    this.options = options;
    this.byTable = new Map();              // insertion order is recency
  }

  /** The learner for `table`, made if it is not held, and now the most recent. */
  for(table) {
    const key = String(table);
    let held = this.byTable.get(key);
    if (held) this.byTable.delete(key);
    else held = new Learner(this.options);
    this.byTable.set(key, held);
    while (this.byTable.size > this.kept) {
      this.byTable.delete(this.byTable.keys().next().value);
    }
    return held;
  }

  /** A table renamed keeps what it learned; nothing about it changed but a label. */
  rename(from, to) {
    const held = this.byTable.get(String(from));
    if (!held) return;
    this.byTable.delete(String(from));
    this.byTable.set(String(to), held);
  }

  /** A table cleared or deleted takes its learner with it. */
  forget(table) {
    this.byTable.delete(String(table));
  }
}

/**
 * Whether the network's lead is bigger than the noise it would show anyway.
 *
 * The two bet on the same coups, so the comparison is paired: where they agree
 * they win and lose together and nothing is learned, and where they disagree
 * exactly one of them wins. So the evidence is entirely in the `split` coups
 * they picked differently, and under "the two are equally good" the number the
 * network takes of those is a fair coin.
 *
 * Its win count minus the estimate's is the same thing as heads minus tails
 * over those coups, which makes the test a plain sign test: divide by the root
 * of the split. Two and a half is about one time in eighty in the direction
 * being asked about.
 *
 * The floor of 200 is there because below it the test has almost no power, and
 * a decision made on less is a coin flip wearing a number.
 */
function verdict(model, base, split = 0) {
  const swing = model.wins - base.wins;
  const z = split > 0 ? swing / Math.sqrt(split) : 0;
  const ahead = model.units > base.units && z >= 2.5 && split >= 200;
  return {
    lead: model.units - base.units,
    z,
    trusted: ahead,
    reason: ahead ? "ahead"
      : split < 200 ? "tooFew"
      : model.units <= base.units ? "behind"
      : "noise",
  };
}

/* ═══ verify.js ═══ */
/* What the app actually said, and whether it was right.
 *
 * The panel above this one already reports a record: it replays the pick rule
 * over the stored sequence, walk-forward, and counts. That is honest and it is
 * not the same thing. A replay is computed by today's code from today's
 * thresholds, so it answers "what would this build have said", and it changes
 * underneath you whenever the build does. It cannot answer "was the thing on
 * my screen last Tuesday right", because nothing on screen last Tuesday was
 * written down.
 *
 * This writes it down. Every recommendation is logged at the moment it is
 * made -- the three probabilities, the side, whether backing it was judged
 * worthwhile, and the versions of the code that produced it -- and it is
 * settled later, when the coup it was about actually arrives. The two events
 * are separate by construction, which is the only structural guarantee against
 * scoring a prediction with the answer already in hand.
 *
 * Nothing here decides anything. It records, it settles, and it counts; the
 * counting is done with proper scoring rules rather than hit rate alone,
 * because hit rate on its own cannot tell a confident model from a lucky one.
 */

/** Storage format. Bumped only when a stored entry would be read wrongly. */
const LOG_VERSION = 1;

/**
 * Entries kept per table before the oldest are rolled into a total.
 *
 * A coup is about a hundred bytes here, so this is a couple of hundred
 * kilobytes at the cap -- room for a season of play in a store that also has
 * to hold the shoes themselves. What is evicted is not lost: its contribution
 * to every figure below is added to `rolled` first, so the totals stay exact
 * and only the coup-by-coup list is finite.
 */
const LOG_CAP = 2000;

/**
 * And the hard limit, past which even unsettled predictions are given up.
 *
 * Twice the cap, which is a backlog no table watched by a person produces:
 * coups arrive, predictions settle, and the list stays at the cap. Reaching
 * this means the coups stopped coming, and the predictions waiting on them are
 * never going to be scored.
 */
const LOG_CEILING = LOG_CAP * 2;

/** Calibration bins: the share assigned to the side that was named. */
const CALIBRATION_BINS = 10;

/** An empty log, which is also the shape `sanitiseLog` returns for rubbish. */
function emptyLog() {
  return { v: LOG_VERSION, tables: {} };
}

/** An empty roll-up: every figure the scorer needs, and nothing else. */
function emptyRoll() {
  return {
    n: 0, settled: 0, decided: 0, hits: 0, baseHits: 0,
    backed: 0, backedDecided: 0, backedHits: 0, abstained: 0,
    logLoss: 0, brier: 0,
    bins: Array.from({ length: CALIBRATION_BINS }, () => ({ n: 0, hits: 0 })),
  };
}

const tableLog = (log, table) => (log.tables[table] ||= { entries: [], rolled: emptyRoll() });

/**
 * Write down a recommendation, once.
 *
 * Keyed by the coup it is about -- the shoe it belongs to and how many coups
 * that shoe held when it was made -- so the same coup cannot be predicted
 * twice. That matters more than it looks: the panel re-renders on every
 * sample, on every language change, on every window resize, and a log that
 * appended each time would report the same coup dozens of times and weight it
 * accordingly.
 *
 * Returns true when something was written, false when this coup already had a
 * prediction, which is the ordinary case.
 *
 * The name is long because the built page is one concatenated scope: a plain
 * `record`, `settle` or `score` here collides with a module that already has
 * one, and the build refuses rather than let the survivor win silently.
 */
function recordPrediction(log, table, entry) {
  if (!table || !entry || !entry.shoe) return false;
  const t = tableLog(log, table);
  const at = entry.index | 0;
  // Backwards: a re-render is about the coup at the end, which is the one
  // written last.
  for (let i = t.entries.length - 1; i >= 0; i -= 1) {
    const e = t.entries[i];
    if (e.s === entry.shoe && e.i === at) return false;
    // The list is in the order the coups arrived, so once it is behind this
    // shoe there is nothing left to find.
    if (e.s !== entry.shoe) break;
  }
  t.entries.push({
    s: entry.shoe,
    i: at,
    p: [round6(entry.player), round6(entry.banker), round6(entry.tie)],
    k: entry.pick,                    // "B" | "P"
    b: entry.backed ? 1 : 0,          // was backing it judged worth it
    c: Math.round(entry.confidence ?? 0),
    m: String(entry.model || ""),
    f: String(entry.features || ""),
    t: entry.at || Date.now(),
    r: null,                          // the outcome, once it is known
  });
  trim(t);
  return true;
}

/** Six places is finer than any figure this shows and keeps the store small. */
const round6 = (x) => (Number.isFinite(x) ? Math.round(x * 1e6) / 1e6 : 0);

/**
 * Bring the log into line with the record: settle what has happened, and let
 * go of what has been taken back.
 *
 * Driven from the shoes rather than from an event, so a reload, a sync from
 * another tab, or an import all settle what they brought with them.
 *
 * The taking-back half is not a nicety. Undo exists because a coup was
 * mistyped or was never dealt, and a prediction settled against a coup that
 * has since been withdrawn is scored against something that did not happen --
 * so it goes, and so does its contribution. Correcting a coup rather than
 * removing it re-settles instead: the prediction was still made before that
 * coup either way, and the outcome it should be scored on is the one that is
 * now in the record.
 *
 * What is never touched is the prediction itself. Only its outcome moves, and
 * only to follow the record.
 *
 * Returns how many entries changed.
 */
/**
 * Move entries back into line when a shoe gains or loses a coup in the middle.
 *
 * A prediction is anchored to a position in a string, and a position is not an
 * identity. While a shoe only ever grows at its end, the two are the same
 * thing; the moment a coup arrives in the middle, every anchor after it points
 * at the coup next door, and `settlePredictions` quietly rescores each of them
 * against a coup it was never about.
 *
 * Measured, on a sixty-coup shoe whose reader later found a coup it had missed
 * at position twelve: thirty-one of the sixty settled predictions had their
 * recorded outcome rewritten, the function reported thirty-one settled, and
 * nothing anywhere said that the score had just changed meaning. The live
 * reader cannot do this -- `diagnose` refuses a reading that does not share a
 * prefix -- but a room can, and does: `mergeOutcomes` takes the room's copy
 * whole, and a room whose other reader dropped a coup hands back a shoe
 * shifted by one. That is the same drift the room panel now reports, arriving
 * where it does real damage.
 *
 * What the log already holds is enough to detect it. Every settled entry
 * records the outcome it was settled to, so the entries *are* the shoe as this
 * device believed it. Where the first settled entry stops matching the
 * sequence at its own index, exactly two single-coup explanations exist, and
 * each is checked against every settled entry rather than the first few: one
 * coup arrived before here, or one went away. If exactly one holds for all of
 * them, the anchors are moved and every prediction stays attached to the coup
 * it was about.
 *
 * It does not guess past that. Two shifts, or a shift tangled with a genuine
 * correction, leaves the entries where they are and the old behaviour applies
 * -- this closes the case that was measured and reachable, and claims nothing
 * about the ones that are neither.
 */
function realign(entries, seq) {
  // Only entries the sequence still reaches. An entry past the end is the
  // ordinary undo -- the last coup taken back -- and letting one in here would
  // read it as a mismatch and, one time in three by luck, shift the whole
  // record to make a withdrawn coup line up.
  const settled = entries.filter((e) => e.r && e.i < seq.length);
  let first = -1;
  for (const e of settled) {
    if (seq[e.i] !== e.r) { first = e.i; break; }
  }
  if (first < 0) return 0;

  /** Does every settled entry from `first` on match, read `by` places over? */
  const holds = (by) => {
    let checked = 0;
    for (const e of settled) {
      if (e.i < first) continue;
      const at = e.i + by;
      if (at < 0 || at >= seq.length) return 0;      // nothing there to match
      if (seq[at] !== e.r) return 0;
      checked += 1;
    }
    return checked;
  };

  const forward = holds(1);                          // a coup arrived before here
  const back = holds(-1);                            // a coup went away
  if (!forward && !back) return 0;

  let by = forward ? 1 : -1;
  if (forward && back) {
    // Both readings fit, which happens when the coups on either side agree.
    // The shoe's own length says which way it went; without that it is a
    // guess, and a guess here is a rescored record.
    const was = Math.max(...settled.map((e) => e.i)) + 1;
    if (seq.length === was + 1) by = 1;
    else if (seq.length === was - 1) by = -1;
    else return 0;
  }

  let moved = 0;
  for (const e of entries) {
    if (e.i < first) continue;
    e.i += by;
    moved += 1;
  }
  return moved;
}

function settlePredictions(log, table, sequences) {
  const t = log.tables[table];
  if (!t) return 0;
  let done = 0;
  const keep = [];

  // Before reading anything at an index, make sure the indices still mean what
  // they meant. See `realign`.
  const byShoe = new Map();
  for (const e of t.entries) {
    if (!byShoe.has(e.s)) byShoe.set(e.s, []);
    byShoe.get(e.s).push(e);
  }
  for (const [id, entries] of byShoe) {
    const seq = sequences[id];
    if (typeof seq === "string") done += realign(entries, seq) ? 1 : 0;
  }

  for (const e of t.entries) {
    const seq = sequences[e.s];
    const known = typeof seq === "string";
    // A shoe the record no longer holds at all: an import replaced it, or it
    // was dropped. Nothing can be said about those predictions, either way.
    if (!known) { keep.push(e); continue; }

    if (seq.length > e.i) {
      if (e.r !== seq[e.i]) { e.r = seq[e.i]; done += 1; }
      keep.push(e);
      continue;
    }
    // The record no longer reaches this coup. If it never did, the prediction
    // is simply still pending. If it did, the coup was undone, and the entry
    // goes with it.
    if (e.r) { done += 1; continue; }
    keep.push(e);
  }
  t.entries = keep;
  return done;
}

/**
 * Oldest first into the roll-up, so the totals survive the cap.
 *
 * Settled rows only. A prediction that has not had its coup yet has not been
 * counted anywhere, so evicting it would not shrink the list at the cost of a
 * row -- it would delete a prediction outright, and the coup that was about to
 * settle it would find nothing waiting. Measured: recording faster than the
 * coups arrive dropped five hundred predictions out of the score entirely.
 *
 * The ceiling below is for the case that leaves: a table left open, a shoe
 * abandoned, a backlog of predictions whose coups are never coming. Those are
 * given up rather than allowed to grow without end, and counted as having been
 * made and never scored.
 */
function trim(t) {
  if (t.entries.length <= LOG_CAP) return;
  let excess = t.entries.length - LOG_CAP;
  const keep = [];
  for (const e of t.entries) {
    if (excess > 0 && e.r) { foldInto(t.rolled, e); excess -= 1; continue; }
    keep.push(e);
  }
  while (keep.length > LOG_CEILING) { t.rolled.n += 1; keep.shift(); }
  t.entries = keep;
}

/** Add one settled entry to a roll-up. */
function foldInto(roll, e) {
  const [pP, pB, pT] = e.p;
  roll.n += 1;
  roll.settled += 1;
  if (e.b) roll.backed += 1;

  // Proper scoring rules take every coup, ties included: they are about the
  // whole distribution, not about the side that was named.
  const truth = { P: pP, B: pB, T: pT }[e.r];
  roll.logLoss += -Math.log(Math.max(1e-12, truth ?? 1e-12));
  roll.brier += (pP - (e.r === "P" ? 1 : 0)) ** 2
              + (pB - (e.r === "B" ? 1 : 0)) ** 2
              + (pT - (e.r === "T" ? 1 : 0)) ** 2;

  // Hit rate takes only the coups a side bet could settle. A tie pushes, so
  // counting it as a miss would understate every rule equally and mean
  // nothing; leaving it out is what the comparison below needs.
  if (e.r === "T") return;
  roll.decided += 1;
  const hit = e.k === e.r;
  if (hit) roll.hits += 1;
  if (e.r === "B") roll.baseHits += 1;        // always backing Banker
  if (e.b) {
    roll.backedDecided += 1;
    if (hit) roll.backedHits += 1;
  } else {
    roll.abstained += 1;
  }

  // Calibration on the share given to the side that was named: of the coups
  // where the app said 52%, how many came in?
  const said = e.k === "B" ? pB : pP;
  const bin = Math.min(CALIBRATION_BINS - 1, Math.max(0, Math.floor(said * CALIBRATION_BINS)));
  roll.bins[bin].n += 1;
  if (hit) roll.bins[bin].hits += 1;
}

/**
 * Everything the panel reports, over one table's whole log.
 *
 * Accuracy is never quoted on its own. A rule that names the more common side
 * every time scores about 51% on decided coups and knows nothing, so the only
 * number that means anything is the gap to that rule on the same coups --
 * which is why `baseline` is computed here rather than left to be compared
 * against a figure from somewhere else.
 */
function scorePredictions(log, table) {
  const t = log.tables[table];
  const roll = emptyRoll();
  if (t) {
    // The roll-up already holds what was evicted.
    merge(roll, t.rolled);
    for (const e of t.entries) {
      if (e.r) foldInto(roll, e);
      else roll.n += 1;
    }
  }

  const rate = (a, b) => (b ? a / b : NaN);
  return {
    ...roll,
    pending: roll.n - roll.settled,
    accuracy: rate(roll.hits, roll.decided),
    baseline: rate(roll.baseHits, roll.decided),
    edge: roll.decided ? (roll.hits - roll.baseHits) / roll.decided : NaN,
    backedAccuracy: rate(roll.backedHits, roll.backedDecided),
    meanLogLoss: rate(roll.logLoss, roll.settled),
    meanBrier: rate(roll.brier, roll.settled),
    calibration: roll.bins.map((b, i) => ({
      from: i / CALIBRATION_BINS,
      to: (i + 1) / CALIBRATION_BINS,
      n: b.n,
      observed: rate(b.hits, b.n),
    })),
    // How far the stated confidence sits from what happened, averaged over the
    // bins that have anything in them. This is the number that says whether a
    // probability on screen can be read as a probability.
    calibrationError: calibrationError(roll),
  };
}

function merge(into, from) {
  if (!from) return;
  for (const key of ["n", "settled", "decided", "hits", "baseHits", "backed",
                     "backedDecided", "backedHits", "abstained", "logLoss", "brier"]) {
    into[key] += Number(from[key]) || 0;
  }
  const bins = Array.isArray(from.bins) ? from.bins : [];
  for (let i = 0; i < into.bins.length; i += 1) {
    into.bins[i].n += Number(bins[i]?.n) || 0;
    into.bins[i].hits += Number(bins[i]?.hits) || 0;
  }
}

/** Expected calibration error: each bin's gap, weighted by how full it is. */
function calibrationError(roll) {
  let seen = 0, sum = 0;
  roll.bins.forEach((b, i) => {
    if (!b.n) return;
    const mid = (i + 0.5) / CALIBRATION_BINS;
    sum += b.n * Math.abs(b.hits / b.n - mid);
    seen += b.n;
  });
  return seen ? sum / seen : NaN;
}

/**
 * Read a stored log back, keeping only what is shaped like one.
 *
 * The same standard the corpus is held to: a store that has been hand-edited,
 * half-synced or written by an older build must not be able to put a string
 * where a probability goes and have every figure below quietly become NaN.
 */
function sanitiseLog(raw) {
  const out = emptyLog();
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return out;
  const tables = raw.tables && typeof raw.tables === "object" ? raw.tables : {};
  for (const [name, value] of Object.entries(tables)) {
    if (!name || !value || typeof value !== "object") continue;
    const t = tableLog(out, name);
    merge(t.rolled, value.rolled);
    const entries = Array.isArray(value.entries) ? value.entries : [];
    for (const e of entries) {
      const clean = sanitiseEntry(e);
      if (clean) t.entries.push(clean);
    }
    trim(t);
  }
  return out;
}

function sanitiseEntry(e) {
  if (!e || typeof e !== "object") return null;
  if (typeof e.s !== "string" || !e.s) return null;
  const i = Number(e.i);
  if (!Number.isInteger(i) || i < 0) return null;
  const p = Array.isArray(e.p) ? e.p.map((x) => (Number.isFinite(Number(x)) ? Number(x) : 0)) : [];
  if (p.length !== 3) return null;
  if (e.k !== "B" && e.k !== "P") return null;
  const r = e.r === "B" || e.r === "P" || e.r === "T" ? e.r : null;
  return {
    s: e.s, i, p, k: e.k,
    b: e.b ? 1 : 0,
    c: Number.isFinite(Number(e.c)) ? Math.round(Number(e.c)) : 0,
    m: typeof e.m === "string" ? e.m : "",
    f: typeof e.f === "string" ? e.f : "",
    t: Number.isFinite(Number(e.t)) ? Number(e.t) : 0,
    r,
  };
}

/** The most recent settled and pending entries, newest first, for the table. */
function recentPredictions(log, table, limit = 20) {
  const t = log.tables[table];
  if (!t) return [];
  return t.entries.slice(-limit).reverse();
}

/** Drop one table's log, when its table is deleted. */
function forgetPredictions(log, table) {
  delete log.tables[table];
}

/** Follow a table through a rename, so its record is not orphaned. */
function renamePredictions(log, from, to) {
  if (!log.tables[from] || from === to) return;
  log.tables[to] = log.tables[from];
  delete log.tables[from];
}

/* ═══ share.js ═══ */
/* Sending the collected shoes to a shared record.
 *
 * The corpus lives in this browser, which is the right answer for one person
 * and the wrong one for two: two phones make two corpora, and whether a
 * table's shuffle is biased is a question you can only ask of one. So this
 * pushes what has been collected here into the `/api/v1` record several people
 * can collect into.
 *
 * Coups only ever travel one way. Nothing here reads coups back or changes
 * anything locally, so a failed request costs a message and never a coup, and
 * the page goes on working with no server at all -- which it has to, since that
 * is the version that runs at a table on one phone.
 *
 * What does come back is verdicts: how much the record holds for a table, and
 * what the battery says over all of it. That is the reason for pooling in the
 * first place -- one person's phone holds a few hundred coups and can rule
 * almost nothing in or out -- and a record you can push to but never ask is a
 * record nobody can use. It stays a read of an answer and never a read of the
 * corpus: no shoe in this browser is created, altered or removed by any of it.
 *
 * Explicit, too: it happens when somebody presses the button. An automatic
 * sync would put a table's history somewhere the person watching had not
 * looked at that moment, and the address is theirs to choose.
 *
 * Sending the same thing twice is safe, and the point. The record keys a coup
 * by the shoe it belongs to and its number within it, so a second send adds
 * what is new and reports the rest as already there. That means there is no
 * bookkeeping here about what was sent before -- which is deliberate, because
 * such a note goes stale silently and the failure is a shoe that never arrives
 * and is never mentioned again.
 */


/** Where the address is remembered. */
const SHARE_KEY = "baccarat.share.v1";

/** What went wrong, in a form the page can say something useful about. */
class ShareError extends Error {
  constructor(kind, message) {
    super(message);
    this.name = "ShareError";
    /** "address" | "auth" | "network" | "server" */
    this.kind = kind;
  }
}

/**
 * An address to send to, or "" for none.
 *
 * Only http and https, and never a bare host: "example.com/api" would resolve
 * against this page and quietly post a corpus to wherever the page is served
 * from, which on the published build is a static host that would answer 404
 * and on a server is a different API than the one meant.
 */
function normaliseServer(raw) {
  const text = String(raw ?? "").trim();
  if (!text) return "";
  let url;
  try {
    url = new URL(text);
  } catch {
    throw new ShareError("address", "not an address");
  }
  if (url.protocol !== "http:" && url.protocol !== "https:") {
    throw new ShareError("address", "not http or https");
  }
  return (url.origin + url.pathname).replace(/\/+$/, "");
}

/**
 * Whether a session could even reach this address from this page.
 *
 * A session cookie is not sent to another *site*, and a record on plain HTTP
 * cannot hold the relaxed cookie that would be -- browsers discard it. So an
 * address like `http://my-box:8000` opened from the published page is a dead
 * end that looks exactly like being signed out: the reader signs in, comes
 * back, and is a stranger again, for ever, with nothing to say why.
 *
 * Same-machine addresses are fine over plain HTTP and are the ordinary way to
 * try this out, so they are not warned about.
 */
function needsTls(base) {
  if (!base || !base.startsWith("http://")) return false;
  let host;
  try {
    host = new URL(base).hostname;
  } catch {
    return false;
  }
  return !(host === "localhost" || host === "127.0.0.1" || host === "[::1]"
           || host.endsWith(".localhost"));
}

function readServer() {
  try {
    return normaliseServer(localStorage.getItem(SHARE_KEY) || "");
  } catch {
    return "";
  }
}

function saveServer(base) {
  try {
    if (base) localStorage.setItem(SHARE_KEY, base);
    else localStorage.removeItem(SHARE_KEY);
  } catch {
    /* a browser with no storage still sends, it just forgets the address */
  }
}

/**
 * Every shoe worth sending, flattened.
 *
 * A shoe with no coups in it is not a record of anything -- it is the shoe
 * about to be dealt -- so it is left here rather than creating an empty shoe
 * in the shared record for every table anybody has ever opened.
 */
function shoesToSend(tables) {
  const out = [];
  for (const name of Object.keys(tables || {})) {
    const entry = tables[name];
    for (const shoe of (entry && entry.shoes) || []) {
      if (!shoe || !shoe.o || !shoe.o.length) continue;
      out.push({ table: name, shoe });
    }
  }
  return out;
}

/** The coups of one shoe, as the record wants them. */
function handsOf(shoe) {
  return [...shoe.o].map((result, i) => ({
    hand_number: i + 1,
    result,
    // The same spacing the CSV export writes and the importer reads, so a
    // corpus that reaches the record through a file and one pushed straight
    // there land on the same rows.
    played_at: new Date(
      Math.min(MAX_TIME, shoe.t + i * SECONDS_PER_COUP * 1000)).toISOString(),
  }));
}

async function send(base, path, body, fetchImpl, signal) {
  let answer;
  try {
    answer = await fetchImpl(base + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // The session is a cookie, and this is usually a different origin from
      // the page -- without this the request arrives as a stranger and the
      // whole push fails on the first shoe with a 401 nobody can explain.
      credentials: "include",
      mode: "cors",
      body: JSON.stringify(body),
      signal,
    });
  } catch (e) {
    if (e && e.name === "AbortError") throw e;
    throw new ShareError("network", String((e && e.message) || e));
  }
  if (answer.status === 401 || answer.status === 403) {
    throw new ShareError("auth", "not signed in");
  }
  if (answer.status === 404) {
    // The address answered and has no such route. Usually the shared record is
    // not configured on that server at all, which is a different problem from
    // a wrong address and has a different fix.
    throw new ShareError("server", "no shared record at that address");
  }
  if (!answer.ok) {
    let detail = "";
    try {
      detail = (await answer.json()).detail || "";
    } catch { /* not every failure is JSON */ }
    // Carried for the same reason the read side carries it: 409 here is not a
    // fault but an answer -- either this call is already in the record, or it
    // arrived after its coup was dealt and is refused on purpose. A caller
    // counting how complete its forward record is needs to tell those from a
    // server that is simply broken.
    const failed = new ShareError("server", detail || `the server said ${answer.status}`);
    failed.status = answer.status;
    throw failed;
  }
  return answer.json();
}

async function get(base, path, fetchImpl, signal) {
  let answer;
  try {
    answer = await fetchImpl(base + path, {
      method: "GET",
      // As with the push: the session is a cookie and this is usually a
      // different origin from the page.
      credentials: "include",
      mode: "cors",
      signal,
    });
  } catch (e) {
    if (e && e.name === "AbortError") throw e;
    throw new ShareError("network", String((e && e.message) || e));
  }
  if (answer.status === 401 || answer.status === 403) {
    throw new ShareError("auth", "not signed in");
  }
  if (answer.status === 404) {
    throw new ShareError("server", "no shared record at that address");
  }
  if (!answer.ok) {
    let detail = "";
    try {
      detail = (await answer.json()).detail || "";
    } catch { /* not every failure is JSON */ }
    // The status is kept because the caller can say more about some of these
    // than the server's own sentence can: a 422 from the battery means "not
    // enough collected yet", which this page can put in the reader's language
    // and with their own numbers beside it.
    const failed = new ShareError("server", detail || `the server said ${answer.status}`);
    failed.status = answer.status;
    throw failed;
  }
  return answer.json();
}

/**
 * What the shared record holds, per table.
 *
 * Cheap, and asked first for that reason: the verdict below takes half a
 * minute of simulation, and most of the time what a reader needs to know is
 * that the record has four shoes of their table and the battery needs three.
 * Finding that out should not cost thirty seconds.
 */
async function fetchTables(base, options = {}) {
  const {
    fetchImpl = typeof fetch === "function" ? fetch.bind(globalThis) : null,
    sessionType = "LIVE",
    signal = null,
  } = options;

  if (!base) throw new ShareError("address", "no address");
  if (!fetchImpl) throw new ShareError("network", "this browser cannot ask");

  const answer = await get(
    base, `/api/v1/tables?session_type=${encodeURIComponent(sessionType)}`,
    fetchImpl, signal);
  return answer.tables || [];
}

/**
 * The battery's verdict over everything everyone collected at one table.
 *
 * The table name is whatever the reader typed -- spaces, Korean, a slash
 * somebody put in a casino's name -- so it is encoded rather than pasted into
 * the path. Without that a table called "Hann Speed 03" asks about a different
 * route than the one it was pushed to, and the answer is a 404 that reads as
 * "nothing collected".
 */
async function fetchIntegrity(base, table, options = {}) {
  const {
    fetchImpl = typeof fetch === "function" ? fetch.bind(globalThis) : null,
    replicates = 200,
    sessionType = "LIVE",
    signal = null,
  } = options;

  if (!base) throw new ShareError("address", "no address");
  if (!table) throw new ShareError("address", "no table");
  if (!fetchImpl) throw new ShareError("network", "this browser cannot ask");

  return get(base, `/api/v1/tables/${encodeURIComponent(table)}/integrity`
    + `?session_type=${encodeURIComponent(sessionType)}`
    + `&replicates=${encodeURIComponent(replicates)}`, fetchImpl, signal);
}

/* ------------------------------------------------- the forward record */

/**
 * The app's own call, written down before the coup it is about.
 *
 * This is the one thing in the project that could ever justify any of it.
 * `docs/VALIDATION.md` is blunt about why: a backtest can be re-run until it
 * looks good, and a forward record cannot. But "made in advance" has to be
 * something the record can show rather than something the writer promises,
 * which is why the route refuses a prediction about a coup it already holds.
 *
 * So this cannot be batched. A call collected on a phone and pushed at the end
 * of the evening is a call whose answer was already on disk when it arrived,
 * and the server is right to turn it away. It goes now or it does not go, and
 * a call that did not go is *reported* rather than retried -- by the time a
 * retry succeeded the coup would have been dealt, and quietly filling the gap
 * later is exactly the thing the refusal exists to prevent.
 *
 * The shoe is created first because a prediction has to name one, and creating
 * it twice is safe by design.
 */
async function recordCall(base, table, shoe, entry, options = {}) {
  const {
    fetchImpl = typeof fetch === "function" ? fetch.bind(globalThis) : null,
    signal = null,
  } = options;

  if (!base) throw new ShareError("address", "no address");
  if (!fetchImpl) throw new ShareError("network", "this browser cannot send");

  await send(base, "/api/v1/shoes", {
    shoe_uuid: shoe.id,
    table_name: table,
    source: "reader",
    session_type: "LIVE",
    started_at: new Date(Math.min(MAX_TIME, shoe.t || 0)).toISOString(),
  }, fetchImpl, signal);

  return send(base, "/api/v1/predictions", callBody(shoe, entry), fetchImpl, signal);
}

/**
 * One logged call, in the shape the record wants.
 *
 * `index` is how many coups the shoe already held when the call was made, so
 * the coup it is about is the next one -- `index + 1` in the record's
 * one-based numbering, and by construction one that has not been dealt.
 *
 * The side is always sent as the side, even where backing it was judged not
 * worth it. The app names a side every coup and separately judges whether
 * there is money in it; collapsing the second into the first would throw away
 * which of those two things the record is measuring. `signal` carries that
 * instead, so the hit rate `/predictions/score` reports is the rate over every
 * coup -- the honest headline for a model that always speaks -- and the
 * backed-only rate stays recoverable from the rows.
 */
function callBody(shoe, entry) {
  const [player, banker, tie] = entry.p || [0, 0, 0];
  return {
    shoe_uuid: shoe.id,
    hand_number: (entry.i | 0) + 1,
    model_name: "browser",
    model_version: String(entry.m || "unknown"),
    feature_version: String(entry.f || "unknown"),
    player_probability: player,
    banker_probability: banker,
    tie_probability: tie,
    prediction: entry.k === "B" ? "BANKER" : entry.k === "P" ? "PLAYER" : "NO_SIGNAL",
    confidence: entry.c ?? 0,
    signal: entry.b ? bandOf(entry.c ?? 0) : "NO_SIGNAL",
    prediction_source: "browser",
  };
}

/** Where a 0-100 confidence sits, in the words the schema uses. */
function bandOf(confidence) {
  if (confidence >= 66) return "STRONG";
  if (confidence >= 33) return "LEAN";
  return "WEAK";
}

/**
 * Send what has been dealt, then let the record settle what it can.
 *
 * Settling is a separate call from recording and only ever *adds* the outcome,
 * which is the second half of the same guarantee: there is no route that
 * rewrites a prediction and no column to rewrite it into.
 *
 * The whole shoe goes rather than the last coup alone. Re-sending is free --
 * the record keys a coup by its shoe and its number and reports the rest as
 * already there -- and a coup that failed to send earlier gets another chance,
 * which matters here because a coup missing from the record is a prediction
 * that can never be settled.
 */
async function settleAgainst(base, shoe, options = {}) {
  const {
    fetchImpl = typeof fetch === "function" ? fetch.bind(globalThis) : null,
    signal = null,
  } = options;

  if (!base) throw new ShareError("address", "no address");
  if (!fetchImpl) throw new ShareError("network", "this browser cannot send");
  if (!shoe.o || !shoe.o.length) return { settled: 0, waiting: 0, already_settled: 0 };

  await send(base, `/api/v1/shoes/${encodeURIComponent(shoe.id)}/hands`,
             { hands: handsOf(shoe) }, fetchImpl, signal);
  return send(base, "/api/v1/predictions/settle"
    + `?shoe_uuid=${encodeURIComponent(shoe.id)}`, {}, fetchImpl, signal);
}

/** How the calls that have been settled actually did, per model. */
async function fetchScore(base, options = {}) {
  const {
    fetchImpl = typeof fetch === "function" ? fetch.bind(globalThis) : null,
    shoeUuid = null,
    signal = null,
  } = options;

  if (!base) throw new ShareError("address", "no address");
  if (!fetchImpl) throw new ShareError("network", "this browser cannot ask");

  return get(base, "/api/v1/predictions/score"
    + (shoeUuid ? `?shoe_uuid=${encodeURIComponent(shoeUuid)}` : ""), fetchImpl, signal);
}

/**
 * Push a corpus to the shared record.
 *
 * Returns what happened rather than throwing: a send that got eight tables in
 * and lost the ninth has done eight tables of good, and saying so is more use
 * than an exception that loses the count. The one thing that stops it early is
 * a login failure, because every later request would fail the same way and a
 * hundred identical errors say less than one.
 */
async function pushCorpus(base, tables, options = {}) {
  const {
    fetchImpl = typeof fetch === "function" ? fetch.bind(globalThis) : null,
    onProgress = () => {},
    signal = null,
  } = options;

  if (!base) throw new ShareError("address", "no address");
  if (!fetchImpl) throw new ShareError("network", "this browser cannot send");

  const jobs = shoesToSend(tables);
  const report = {
    shoes: jobs.length,
    coups: jobs.reduce((n, j) => n + j.shoe.o.length, 0),
    sent: 0,
    added: 0,
    alreadyThere: 0,
    // Coups the record already holds with a different result. Not written,
    // and not a failure: the record refuses to pick between two readings of
    // one coup, and this is where the person who can look at the board hears
    // that there are two. Kept per coup so the page can name one.
    conflicts: [],
    failures: [],
    stopped: null,
  };

  let done = 0;
  for (const job of jobs) {
    if (signal && signal.aborted) { report.stopped = "cancelled"; break; }
    try {
      await send(base, "/api/v1/shoes", {
        shoe_uuid: job.shoe.id,
        table_name: job.table,
        source: "reader",
        session_type: "LIVE",
        started_at: new Date(Math.min(MAX_TIME, job.shoe.t || 0)).toISOString(),
      }, fetchImpl, signal);

      const landed = await send(base, `/api/v1/shoes/${encodeURIComponent(job.shoe.id)}/hands`,
        { hands: handsOf(job.shoe) }, fetchImpl, signal);

      report.sent += 1;
      report.added += (landed.added || []).length;
      report.alreadyThere += (landed.already_there || []).length;
      for (const c of landed.conflicts || []) {
        report.conflicts.push({ table: job.table, shoe: job.shoe.id, ...c });
      }
    } catch (e) {
      if (e && e.name === "AbortError") { report.stopped = "cancelled"; break; }
      if (e instanceof ShareError && (e.kind === "auth" || e.kind === "address")) {
        report.stopped = e.kind;
        break;
      }
      report.failures.push({
        table: job.table,
        shoe: job.shoe.id,
        why: String((e && e.message) || e),
      });
      // A server that has stopped answering will not start again within this
      // push, and trying every remaining shoe against it wastes the reader's
      // time to arrive at the same place.
      if (e instanceof ShareError && e.kind === "network"
          && report.failures.length >= 3) {
        report.stopped = "network";
        break;
      }
    }
    onProgress(++done, jobs.length);
  }
  return report;
}

/**
 * Ask the server what it says about the coup that has not been dealt.
 *
 * Nothing is stored by this call, on either side. It is a second opinion
 * standing beside the one this browser already computed, never a replacement
 * for it -- the page has to keep working at a table with no network, which it
 * did for its whole life before any server existed.
 *
 * The answer carries more than numbers. `/api/v1/predict` reports which model
 * actually answered, whether it is analytic, fitted or unfitted, and -- when
 * it has been measured not to -- that it is not reading your table at all.
 * Those fields are the point of showing anything: a probability displayed
 * without them would be the page claiming an analysis the server explicitly
 * says it did not perform.
 */
async function askPrediction(base, outcomes, options = {}) {
  const {
    fetchImpl = typeof fetch === "function" ? fetch.bind(globalThis) : null,
    table = null,
    signal = null,
  } = options;

  if (!base) throw new ShareError("address", "no address");
  if (!fetchImpl) throw new ShareError("network", "this browser cannot ask");

  // Not sanitised on the way out, deliberately. The server refuses a coup it
  // cannot read rather than dropping it, because dropping one renumbers every
  // coup after it -- and a client that quietly dropped it first would defeat
  // that from this side, arriving with a shorter shoe the server has no way to
  // know was ever wrong.
  const seen = String(outcomes || "");
  const bad = [...new Set(seen)].filter((c) => !"PBT".includes(c));
  if (bad.length) {
    throw new ShareError("shape", `a coup is P, B or T; found ${bad.join("")}`);
  }
  // The same reasoning about length. Sending the last 200 would make
  // `next_hand_number` describe a different coup than the reader is watching.
  if (seen.length > 200) {
    throw new ShareError("shape", `${seen.length} coups is longer than a shoe`);
  }

  const body = { outcomes: seen };
  if (table) body.table = String(table).slice(0, 96);
  return send(base, "/api/v1/predict", body, fetchImpl, signal);
}

/* ═══ room.js ═══ */
/* Shared rooms: several readers at one table, recording into one record.
 *
 * The corpus this app has always kept stores a shoe as one string, one
 * character per coup -- "PBTPB..." -- because a bead plate shows which side
 * won and nothing else. A shared room needs something else: a document per
 * coup, carrying who entered it and when, so that two people watching the same
 * table produce one record rather than two, and so a disagreement between them
 * is visible instead of silent.
 *
 * So this module is mostly a bridge between those two shapes, and the bridge
 * is where the danger is. `store.js` sanitises a shoe with
 * `o.replace(/[^PBT]/g, "")`: any character that is not an outcome is deleted,
 * and deleting one *closes the gap*. Fill a missing coup 5 with a placeholder
 * and coup 6 slides into position 5, taking every road, every streak and every
 * statistic after it with it -- quietly, and in a form that still looks like a
 * valid shoe. That is why `outcomesFromHands` stops at a gap rather than
 * filling it, and why it reports what it held back instead of pretending the
 * shoe is complete.
 *
 * Nothing here talks to Firebase directly. The SDK arrives through `sdk`, so
 * the same code runs against the real service in a browser and against the
 * emulator in `firebase/tests/room.test.mjs` -- and the pure functions run
 * under plain node with no network at all.
 */


/** One character per coup, as the corpus has always stored it. */
const CODE_OF = { PLAYER: "P", BANKER: "B", TIE: "T" };
/** And back. These are the only three results the rules accept. */
const OUTCOME_OF = { P: "PLAYER", B: "BANKER", T: "TIE" };

/** A shoe runs out long before this; the rules refuse anything above it. */
const MAX_HAND = 200;

/**
 * The document id for a coup, derived from its number and nothing else.
 *
 * This is load-bearing, not cosmetic. Because the id comes from the coup
 * number, two readers entering the same coup address the same document, and
 * the second write lands on one that already exists -- which the security
 * rules refuse. That refusal is the entire duplicate-detection mechanism: it
 * happens in the database, at the moment of the write, rather than in a
 * comparison somebody has to remember to run afterwards.
 *
 * Zero-padded so the ids sort in coup order as strings, which is how Firestore
 * returns them.
 */
function handId(n) {
  return String(n).padStart(4, "0");
}

/**
 * A room id that is safe as a Firestore document id and legible to a person.
 *
 * Firestore refuses "." and "..", refuses a leading "__", and treats "/" as a
 * path separator, so an unfiltered room id from a URL can address a document
 * nobody meant. Returns "" for anything that cannot be made into a room id,
 * which callers treat as "no room".
 */
function cleanRoomId(raw) {
  const id = String(raw ?? "").trim().replace(/[^A-Za-z0-9_-]/g, "").slice(0, 48);
  if (!id || /^_{2}/.test(id) || /^\.+$/.test(id)) return "";
  return id;
}

/** The room named in a query string, or "" when none is. */
function roomIdFromUrl(search) {
  try {
    const params = new URLSearchParams(String(search || "").replace(/^\?/, ""));
    return cleanRoomId(params.get("room"));
  } catch {
    return "";
  }
}

/** The address to send somebody so they arrive in the same room. */
function roomUrl(base, roomId) {
  const id = cleanRoomId(roomId);
  if (!id) return String(base || "");
  try {
    const url = new URL(String(base));
    url.searchParams.set("room", id);
    return url.toString();
  } catch {
    return `${base}?room=${encodeURIComponent(id)}`;
  }
}

/**
 * The coups of a stored shoe, as the documents a room holds.
 *
 * `timestamp` is deliberately absent: it is the server's to set, and the rules
 * refuse a document whose timestamp is anything else. The caller adds the
 * sentinel at the moment of writing.
 */
function handsFromOutcomes(outcomes, { uid, source = "LIVE", from = 1 } = {}) {
  const text = String(outcomes || "");
  const hands = [];
  for (let i = from - 1; i < text.length && i < MAX_HAND; i += 1) {
    const result = OUTCOME_OF[text[i]];
    if (!result) continue;                       // sanitised corpora have none
    const number = i + 1;
    hands.push({
      handId: handId(number),
      handNumber: number,
      result,
      source,
      sequence: number,
      createdBy: uid,
    });
  }
  return hands;
}

/**
 * The stored string for a room's coups -- up to the first gap.
 *
 * A room is several people writing at once over a connection that drops, so
 * coup 7 can arrive before coup 5 exists. Concatenating what has arrived would
