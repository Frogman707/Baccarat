<link rel="preconnect" href="https://fonts.googleapis.com">

     third party's. On a slow connection, or where fonts.googleapis.com is not
     reachable at all, that is a blank page for as long as the request takes to
     give up -- measured at twelve seconds behind a proxy that drops it. Asking
     for it as print and promoting it on load keeps it off that path: the page
     draws immediately in the fallback stack and takes the faces when they
     arrive. The `noscript` copy keeps the fonts for a reader without script,
     who has nothing to promote it. -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap">

<style>
/* ── tokens ─────────────────────────────────────────────────────────────
   Cool blue-biased neutrals, the shade of a dealer terminal. The data triad
   is fixed by the domain (player blue / banker red / tie green) and re-stepped
   per surface; the amber accent does exactly one job — "the page found
   something, look here". */
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f5f7fa; --surface-3:#eaeef3;
  --line:#dce2ea; --line-2:#c6cfda;
  --ink:#0e1620; --ink-2:#53617a; --ink-3:#8391a6;
  --player:#1e6fd9; --banker:#cf3b34; --tie:#0a8f70;
  --player-soft:#e9f1fd; --banker-soft:#fcecea; --tie-soft:#e3f5ef;
  --accent:#a8641a; --accent-soft:#f4e7d4;
  --zone:#e2eae4; --dead:#f0f2f5; --band:#dfe5ed; --mark-ring:#ffffff;
  --shadow:0 1px 2px rgba(16,26,40,.06), 0 6px 18px -10px rgba(16,26,40,.18);
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans:"IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans KR", "PingFang TC", "PingFang SC", "Microsoft JhengHei",
        "Microsoft YaHei", "Noto Sans TC", "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1017; --surface:#131b26; --surface-2:#18222f; --surface-3:#1e2937;
    --line:#26323f; --line-2:#37475a;
    --ink:#e3eaf3; --ink-2:#93a3b8; --ink-3:#64748b;
    --player:#3d93f0; --banker:#ee5a55; --tie:#00ab93;
    --player-soft:#111f31; --banker-soft:#2a1614; --tie-soft:#06231e;
    --accent:#e29a3c; --accent-soft:#33291a;
    --zone:#1f3a33; --dead:#1c2634; --band:#2c3c50; --mark-ring:#0b1017;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0b1017; --surface:#131b26; --surface-2:#18222f; --surface-3:#1e2937;
  --line:#26323f; --line-2:#37475a;
  --ink:#e3eaf3; --ink-2:#93a3b8; --ink-3:#64748b;
  --player:#3d93f0; --banker:#ee5a55; --tie:#00ab93;
  --player-soft:#111f31; --banker-soft:#2a1614; --tie-soft:#06231e;
  --accent:#e29a3c; --accent-soft:#33291a;
  --zone:#1b2c28; --dead:#161f2b; --band:#233040; --mark-ring:#0b1017;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
     font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased}
.m{font-family:var(--mono); font-variant-numeric:tabular-nums}
/* An author display rule outranks the UA's, so without this a styled
   element keeps drawing after the code sets `hidden` on it. */
[hidden]{display:none !important}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

/* ── header ─────────────────────────────────────────────────────────── */
header{position:sticky; top:0; z-index:20; background:var(--surface);
       border-bottom:1px solid var(--line)}
.hin{max-width:1220px; margin:0 auto; padding:11px 20px;
     display:flex; align-items:center; gap:16px; flex-wrap:wrap}
/* The page's one top-level heading. It is the app's name in the header rather
   than a title block, so it takes the header's size and no margin -- but it has
   to be an h1: with only h2s below it the document had no top-level heading at
   all, and heading order is how a screen reader's user moves around a page. */
.brand{display:flex; align-items:center; gap:9px; font-weight:600; letter-spacing:-.01em;
       font-size:inherit; margin:0}
.pips{display:flex; gap:4px}
.pips i{width:9px; height:9px; border-radius:50%}
.pips i:nth-child(1){background:var(--player)}
.pips i:nth-child(2){background:var(--banker)}
.pips i:nth-child(3){background:var(--tie)}
.spacer{flex:1}
select,input[type=text],textarea{
  font:inherit; color:var(--ink); background:var(--surface-2);
  border:1px solid var(--line-2); border-radius:7px; padding:5px 9px}
#shoeMeta{font-family:var(--mono); font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.badge{font-size:11px; padding:2px 8px; border-radius:20px; background:var(--accent-soft);
       color:var(--accent); border:1px solid var(--accent); font-weight:500}
.store{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-3)}
#langSel{font-size:12.5px; padding:4px 8px}
.themeseg{display:inline-flex; padding:2px; gap:2px; border-radius:8px; background:var(--surface-3)}
.themebtn{width:28px; height:24px; display:grid; place-items:center; border:none; border-radius:6px;
          background:none; color:var(--ink-3); cursor:pointer; padding:0}
.themebtn svg{width:15px; height:15px; display:block}
.themebtn:hover{color:var(--ink-2)}
.themebtn.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.sdot{width:7px; height:7px; border-radius:50%; background:var(--ink-3)}
.sdot.synced{background:var(--tie)} .sdot.syncing{background:var(--accent)}
.sdot.error,.sdot.full{background:var(--banker)}

/* ── grid ───────────────────────────────────────────────────────────── */
main{max-width:1220px; margin:0 auto; padding:20px; display:grid;
     grid-template-columns:repeat(12,1fr); gap:16px; align-items:start}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px;
       padding:16px 18px; box-shadow:var(--shadow); min-width:0}
.c12{grid-column:span 12} .c7{grid-column:span 7} .c5{grid-column:span 5}
.col{display:flex; flex-direction:column; gap:16px; min-width:0}
@media (max-width:940px){
  .c7,.c5{grid-column:span 12}
  main{padding:14px; gap:13px}
  .col{gap:13px}
}
h2{font-size:14px; font-weight:600; margin:0 0 3px; letter-spacing:-.005em}
.sub{font-size:12px; color:var(--ink-3); margin:0 0 14px; line-height:1.5}
.panel > .sub:last-child{margin-bottom:0}

/* ── paste zone: the hero ───────────────────────────────────────────── */
#drop{border:2px dashed var(--line-2); border-radius:10px; background:var(--surface-2);
      transition:border-color .15s, background .15s}
#drop.over{border-color:var(--accent); background:var(--accent-soft)}
#dropIdle{padding:34px 22px; text-align:center}
.kbd{display:inline-flex; gap:5px; margin:12px 0 6px}
.kbd b{font-family:var(--mono); font-size:13px; font-weight:500; padding:5px 11px;
       border-radius:7px; background:var(--surface); border:1px solid var(--line-2);
       box-shadow:0 2px 0 var(--line-2)}
#dropIdle .big{font-size:15.5px; font-weight:500}
#dropIdle .small{font-size:12.5px; color:var(--ink-3); margin-top:6px}
#shotWrap{padding:10px}
#shotCanvas{width:100%; height:auto; display:block; border-radius:7px;
            background:var(--surface-3); cursor:crosshair; touch-action:none}
#readout{margin-top:12px}
.readhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:9px}
.chip{font-size:11.5px; padding:2px 9px; border-radius:20px; font-weight:500;
      border:1px solid var(--line-2); background:var(--surface-2); color:var(--ink-2)}
.chip.ok{border-color:var(--tie); color:var(--tie)}
.chip.warn{border-color:var(--accent); color:var(--accent)}
.readnum{font-family:var(--mono); font-size:12.5px; color:var(--ink-2)}
.tally{display:flex; align-items:center; gap:4px; margin-left:auto}
.tally .dot{width:9px; height:9px; border-radius:50%; display:inline-block}
.tally .dot.P{background:var(--player)} .tally .dot.B{background:var(--banker)} .tally .dot.T{background:var(--tie)}
.tally .n{font-family:var(--mono); font-size:12px; color:var(--ink-2); margin-right:8px}
.seqstrip{display:flex; flex-wrap:wrap; gap:3px; max-height:96px; overflow-y:auto; padding:2px 0}
.sq{width:19px; height:19px; border-radius:4px; display:grid; place-items:center;
    font-size:10px; font-style:normal; color:#fff; font-weight:500}
.sq.P{background:var(--player)} .sq.B{background:var(--banker)} .sq.T{background:var(--tie)}
.actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:13px}
.btn{padding:7px 14px; border-radius:8px; border:1px solid var(--line-2);
     background:var(--surface); cursor:pointer; font-size:13px; font-weight:500}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:transparent; background:none; color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.hint{font-size:12px; color:var(--ink-3); margin:10px 0 0; line-height:1.5}
.warn{font-size:12.5px; color:var(--accent); margin:8px 0 0; line-height:1.5}

/* ── mode switch + live surface ─────────────────────────────────────── */
.seg{display:inline-flex; padding:3px; gap:3px; border-radius:9px;
     background:var(--surface-3); margin-bottom:13px}
.segbtn{padding:5px 14px; border-radius:7px; border:none; background:none;
        color:var(--ink-2); cursor:pointer; font-size:13px; font-weight:500}
.segbtn.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.livebox{border:2px dashed var(--line-2); border-radius:10px; background:var(--surface-2);
         padding:28px 24px; text-align:center}
.livebox .big{font-size:15.5px; font-weight:500; margin-bottom:8px}
.livebox .small,#liveIdle .small{font-size:12.5px; color:var(--ink-3); line-height:1.55;
        max-width:46ch; margin:0 auto}
#liveCanvas{width:100%; height:auto; display:block; border-radius:9px;
            background:var(--surface-3); border:1px solid var(--line); touch-action:none}
#liveCanvas.picking{cursor:crosshair; border-color:var(--accent)}
#livePickHint{margin-top:8px; color:var(--accent); font-size:12px}
.livebar{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:11px}
.livebar select{font-size:12.5px; padding:4px 8px}
.livebar .btn{padding:5px 12px; font-size:12.5px}
.btn.tiny{padding:3px 9px; font-size:11.5px; margin-left:auto; flex:0 0 auto}
#liveStatus{font-family:var(--mono); font-size:12px; color:var(--ink-2);
            font-variant-numeric:tabular-nums}
.livedot{width:8px; height:8px; border-radius:50%; background:var(--ink-3); flex:0 0 auto}
.livedot.on{background:var(--tie); animation:pulse 2s ease-in-out infinite}
.livedot.searching{background:var(--accent)}
/* Between shoes the reader is holding its place, not hunting for one. */
.livedot.waiting{background:var(--accent); animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1} 50%{opacity:.35}}
.livelog{margin-top:11px; max-height:104px; overflow-y:auto; font-family:var(--mono);
         font-size:11.5px; color:var(--ink-3); line-height:1.75}
.livelog div{display:flex; gap:10px}
.livelog time{color:var(--ink-3); opacity:.7; flex:0 0 auto}
.livelog b{color:var(--ink-2); font-weight:500}
#liveError{border:1px solid var(--accent); background:var(--accent-soft);
           border-radius:10px; padding:15px 17px; font-size:13px; line-height:1.65}
#liveError h3{margin:0 0 7px; font-size:13.5px; font-weight:600}
#liveError ol{margin:9px 0 0; padding-left:19px}
#liveError li{margin-bottom:5px}

/* ── batch import ───────────────────────────────────────────────────── */
.onephone{margin-top:14px; padding:12px 14px; border-radius:9px;
          background:var(--surface-2); border:1px solid var(--line)}
.onephone .k{font-size:11.5px; font-weight:600; color:var(--ink-2); margin-bottom:5px}
.onephone p{margin:0; font-size:12px; color:var(--ink-3); line-height:1.6}
#batch{margin-top:14px}
.bsum{font-size:13px; font-weight:500; margin-bottom:4px}
.bnote{font-size:11.5px; color:var(--ink-3); margin:0 0 11px}
.blist{display:flex; flex-direction:column; gap:7px; max-height:210px; overflow-y:auto}
.brow{display:flex; align-items:center; gap:10px; padding:8px 11px; border-radius:8px;
      border:1px solid var(--line); background:var(--surface-2)}
.brow .n{font-family:var(--mono); font-size:12px; color:var(--ink-2);
         font-variant-numeric:tabular-nums; flex:0 0 auto}
.brow .strip{display:flex; gap:2px; overflow-x:auto; flex:1; min-width:0;
             scrollbar-width:none; -webkit-overflow-scrolling:touch}
.brow .strip::-webkit-scrollbar{display:none}
.brow .strip i{width:8px; height:14px; border-radius:2px; flex:0 0 auto}
.brow .strip i.P{background:var(--player)} .brow .strip i.B{background:var(--banker)}
.brow .strip i.T{background:var(--tie)}
#batchBar{height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden; margin:9px 0}
#batchBar i{display:block; height:100%; background:var(--accent); width:0; transition:width .15s}

/* ── prediction ─────────────────────────────────────────────────────── */
.aibar{display:grid; grid-template-columns:58px 1fr 68px 60px; align-items:center;
       gap:9px; margin-bottom:8px}
.aibar .n{font-size:12.5px; color:var(--ink-2)}
.aibar .track{height:9px; border-radius:5px; background:var(--surface-3); overflow:hidden}
.aibar .track i{display:block; height:100%; border-radius:5px}
.aibar.P .track i{background:var(--player)}
.aibar.B .track i{background:var(--banker)}
.aibar.T .track i{background:var(--tie)}
.stakeform{display:flex; flex-wrap:wrap; gap:10px 16px; margin:12px 0 4px}
.stakeform label{display:flex; flex-direction:column; gap:4px; font-size:11.5px; color:var(--ink-2)}
.stakeform input{width:118px; padding:7px 9px; border:1px solid var(--line-2); border-radius:7px;
  background:var(--surface); color:var(--ink); font-family:var(--mono); font-size:13px;
  font-variant-numeric:tabular-nums}
.stakeform input:focus{outline:2px solid var(--accent); outline-offset:1px}
.tablewrap{overflow-x:auto}
table.stake{width:100%; border-collapse:collapse; margin-top:10px; font-size:12.5px}
table.stake th,table.stake td{padding:7px 10px; text-align:right; white-space:nowrap;
  border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
table.stake th{color:var(--ink-3); font-weight:500; font-size:11px; text-align:right}
table.stake th:first-child,table.stake td:first-child{text-align:left; font-variant-numeric:normal}
table.stake td.m{font-family:var(--mono)}
table.stake td.neg{color:var(--p-ink,#c0392b)}
table.stake tr:last-child td{border-bottom:none}
.whobox{display:inline-flex; align-items:center; gap:9px; font-size:11.5px; color:var(--ink-3)}
.whobox #whoName{font-family:var(--mono); color:var(--ink-2)}
.wholink{border:none; background:none; padding:0; color:var(--ink-3); font-size:11.5px;
  font-family:var(--sans); cursor:pointer; text-decoration:underline; text-underline-offset:2px}
.wholink:hover{color:var(--ink)}
.betbadge{margin-left:10px; padding:3px 9px; border-radius:999px; font-size:11px;
  font-weight:500; letter-spacing:.01em; white-space:nowrap; vertical-align:2px}
.betbadge.hold{background:var(--surface-3); color:var(--ink-2); border:1px solid var(--line-2)}
.betbadge.go{background:var(--accent); color:#fff}
.aibar .p{font-family:var(--mono); font-size:13px; text-align:right;
          font-variant-numeric:tabular-nums; font-weight:500;
          padding:1px 3px; border-radius:4px}
/* The estimate moves by thousandths of a point per coup. The number carries
   that; the arrow and the flash are what make it impossible to miss. */
.aibar .d{font-family:var(--mono); font-size:10px; text-align:right; color:var(--ink-3);
          font-variant-numeric:tabular-nums; white-space:nowrap; letter-spacing:-.02em}
.aibar .d.up{color:var(--tie)}
.aibar .d.dn{color:var(--accent)}
@keyframes bump{from{background:var(--accent-soft)} to{background:transparent}}
.aibar .p.bump{animation:bump 1.1s ease-out}
.predhead{display:flex; align-items:baseline; justify-content:space-between;
          gap:10px; margin-bottom:8px}
.aibar.P .p{color:var(--player)} .aibar.B .p{color:var(--banker)} .aibar.T .p{color:var(--tie)}
.airec{display:flex; align-items:center; justify-content:space-between; gap:12px;
       margin:15px 0 13px; padding:11px 14px; border-radius:9px;
       border:1px solid var(--line-2); background:var(--surface-2)}
.airec .k{font-size:12.5px; font-weight:600; color:var(--ink-2)}
.airec .v{font-size:17px; font-weight:600; letter-spacing:-.01em}
.airec .v.P{color:var(--player)} .airec .v.B{color:var(--banker)} .airec .v.T{color:var(--tie)}
.aigrid{display:grid; grid-template-columns:1fr 1fr; gap:9px 16px}
.aifact{display:flex; align-items:baseline; justify-content:space-between; gap:8px;
        padding-bottom:7px; border-bottom:1px solid var(--line)}
.aifact .k{font-size:11.5px; color:var(--ink-3)}
.aifact .v{font-family:var(--mono); font-size:13px; font-variant-numeric:tabular-nums}
.aifact .v.neg{color:var(--banker)}
.aifact .v small{font-family:var(--sans); font-size:10.5px; color:var(--ink-3); margin-left:3px}
.obshead{display:flex; align-items:baseline; justify-content:space-between; gap:10px;
         margin:17px 0 8px; padding-top:14px; border-top:1px solid var(--line)}
.obssub{font-size:11px; color:var(--ink-3); font-family:var(--mono);
        font-variant-numeric:tabular-nums; text-align:right}
/* The replay's three outcomes, each carrying what it paid: the commission on
   a Banker win is the term that decides the whole question, so it sits on the
   row rather than in a footnote. The figures are what actually happened, not
   what was predicted -- the counts on the right are the count of real coups. */
.aibar.bet{grid-template-columns:82px 1fr 62px 44px; margin-bottom:6px}
.aibar.bet .track{height:7px; background:var(--surface-2)}
.aibar.bet .track i{opacity:.55}
.aibar.bet .n{display:flex; align-items:baseline; gap:5px; font-size:12.5px}
.aibar.bet .n small{font-family:var(--mono); font-size:10px; color:var(--ink-3);
                    font-variant-numeric:tabular-nums}
.aibar.bet .p{font-size:12.5px; font-weight:400}
.aibar.bet .c{font-family:var(--mono); font-size:10.5px; color:var(--ink-3);
              text-align:right; font-variant-numeric:tabular-nums}
.aibar.bet.win .track i{background:var(--tie)}
.aibar.bet.lose .track i{background:var(--banker)}
.aibar.bet.push .track i{background:var(--ink-3)}
/* The coup just settled. It carries the outcome's own colour because it is one
   event rather than a total, and it is the only line in the block that answers
   "what did the last result do" -- so it sits above the running totals and is
   given the weight of an answer. */
.ailast{display:flex; align-items:baseline; justify-content:space-between; gap:12px;
        margin:12px 0 11px; padding:9px 13px; border-radius:9px;
        border:1px solid var(--line-2); background:var(--surface-2)}
.ailast .k{font-size:11.5px; color:var(--ink-3)}
.ailast .v{display:flex; align-items:baseline; gap:9px}
.ailast .v b{font-size:13px; font-weight:600}
.ailast .v i{font-family:var(--mono); font-style:normal; font-size:14px; font-weight:500;
             font-variant-numeric:tabular-nums}
.ailast.win{border-color:var(--tie); background:color-mix(in srgb, var(--tie) 8%, transparent)}
.ailast.win .v i{color:var(--tie)}
.ailast.lose{border-color:var(--banker); background:color-mix(in srgb, var(--banker) 8%, transparent)}
.ailast.lose .v i{color:var(--banker)}
.ailast.push .v i{color:var(--ink-3)}
.ailast .v i.bump{animation:bump 1.1s ease-out; border-radius:5px; padding:1px 5px; margin:0 -5px}
/* And the running row it landed on is lit for a moment, so the total and the
   event read as the same thing happening. */
.aibar.bet.landed .p{animation:bump 1.1s ease-out}
.aibar.bet.landed .track i{opacity:1}

/* One row each, full width: these are figures with captions, not a chart, and
   a half-width cell wraps the caption into the label beside it. */
#aiLedger{grid-template-columns:1fr; gap:0; margin-top:12px; margin-bottom:12px}
#aiLedger .aifact{padding:6px 0}
#aiLedger .aifact:last-child{border-bottom:none}
.ainote{font-size:11.5px; color:var(--ink-3); line-height:1.55; margin:13px 0 0}
.verifygrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(108px,1fr)); gap:9px;
            margin-top:10px}
.verifygrid .vt{background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
                padding:8px 10px}
.verifygrid .vt .k{font-size:10.5px; color:var(--ink-3); letter-spacing:.01em}
.verifygrid .vt .v{font-family:var(--mono); font-size:15px; font-variant-numeric:tabular-nums;
                   margin-top:2px}
.verifygrid .vt .v.up{color:var(--tie)} .verifygrid .vt .v.down{color:var(--banker)}
.verifygrid .vt .s{font-size:10.5px; color:var(--ink-3); margin-top:1px}
.verifyrows{margin-top:10px; max-height:186px; overflow-y:auto; font-family:var(--mono);
            font-size:11.5px; font-variant-numeric:tabular-nums}
.verifyrows table{width:100%; border-collapse:collapse}
.verifyrows th{text-align:right; font-weight:500; color:var(--ink-3); font-size:10.5px;
               padding:2px 6px; position:sticky; top:0; background:var(--surface)}
.verifyrows th:first-child,.verifyrows td:first-child{text-align:left}
.verifyrows td{padding:2px 6px; text-align:right; border-top:1px solid var(--line)}
.verifyrows .hit{color:var(--tie)} .verifyrows .miss{color:var(--banker)}
.verifyrows .wait{color:var(--ink-3)}
/* The server's copy of the record is a short list rather than a table: one
   line per model, the figures at one end and the rate at the other. Wraps
   instead of colliding, because a model name is whatever it is. */
.verifyrows .verifyrow{display:flex; justify-content:space-between; gap:6px 14px;
                       flex-wrap:wrap; padding:4px 0; border-top:1px solid var(--line)}
.verifyrows .verifyrow:first-child{border-top:none}
.verifyrows .aiwarn{font-family:var(--sans); font-size:11.5px; margin:8px 0 0}
/* The one line that says which of the two is actually being used. */
.aiverdict{font-size:12.5px; line-height:1.55; margin:11px 0 0; padding:9px 12px;
           border-radius:8px; border:1px solid var(--line-2); background:var(--surface-2)}
.aiverdict.on{border-color:var(--accent); background:var(--accent-soft)}
.aiverdict b{color:var(--ink)}
#learnRows{grid-template-columns:1fr; gap:0; margin-top:10px}
#learnRows .aifact{padding:6px 0}
#learnRows .aifact:last-child{border-bottom:none}
#learnRows .aifact.picked .k{color:var(--ink); font-weight:600}
.aiwarn{font-size:11.5px; line-height:1.55; margin:10px 0 0; padding:9px 11px;
        border-radius:8px; border:1px solid var(--banker); color:var(--ink-2);
        background:color-mix(in srgb, var(--banker) 7%, transparent)}

/* ── stat tiles ─────────────────────────────────────────────────────── */
#kpis{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
@media (max-width:1100px){ #kpis{grid-template-columns:1fr 1fr} }
.tile{background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:11px 12px}
.tile .k{font-size:11px; color:var(--ink-3); letter-spacing:.02em}
.tile .v{font-family:var(--mono); font-size:21px; font-weight:500; letter-spacing:-.02em;
         margin:3px 0 2px; font-variant-numeric:tabular-nums}
.tile .s{font-size:11px; color:var(--ink-3); line-height:1.4}

/* ── break-even scale ───────────────────────────────────────────────── */
#scale{width:100%; height:auto; display:block; max-width:760px; margin:0 auto}
#scale .m{font-family:var(--mono)}
.verdict{font-size:13px; line-height:1.6; padding:12px 14px; border-radius:9px;
         border:1px solid var(--line); background:var(--surface-2); margin:12px 0 0}
.verdict.flag{border-color:var(--accent); background:var(--accent-soft)}
.verdict.ok{border-color:var(--tie)}

/* ── boards ─────────────────────────────────────────────────────────── */
/* ── the latest result ─────────────────────────────────────────────────
   The one thing somebody standing at a table looks up for: what just landed.
   It is written in English whatever the interface language is, because those
   are the words on the table's own screen -- reading the two together should
   not be a translation exercise. */
.result{display:flex; align-items:center; gap:15px; margin-bottom:17px;
        padding:14px 18px; border-radius:12px; min-height:66px;
        border:1px solid var(--line); background:var(--surface-2)}
.result .rdot{width:34px; height:34px; border-radius:50%; flex:0 0 auto;
              background:var(--ink-3); box-shadow:inset 0 0 0 3px var(--mark-ring)}
.result .rword{font-size:23px; font-weight:600; letter-spacing:.045em;
               line-height:1.15; min-width:0}
.result .rmeta{margin-left:auto; padding-left:12px; text-align:right; flex:0 0 auto;
               font-family:var(--mono); font-size:11.5px; color:var(--ink-3);
               font-variant-numeric:tabular-nums; line-height:1.5}
.result .rmeta b{display:block; font-size:12.5px; font-weight:500; color:var(--ink-2)}
.result.B{border-color:var(--banker); background:var(--banker-soft)}
.result.B .rdot{background:var(--banker)}
.result.B .rword{color:var(--banker)}
.result.P{border-color:var(--player); background:var(--player-soft)}
.result.P .rdot{background:var(--player)}
.result.P .rword{color:var(--player)}
.result.T{border-color:var(--tie); background:var(--tie-soft)}
.result.T .rdot{background:var(--tie)}
.result.T .rword{color:var(--tie)}
/* Before the first coup it says so, rather than sitting there as an empty box. */
.result.waiting .rword{font-size:14.5px; font-weight:500; letter-spacing:0;
                       color:var(--ink-3)}
/* The coup that just landed announces itself once and then holds still. */
@keyframes resultIn{from{opacity:0; transform:translateY(-5px) scale(.99)}
                    to{opacity:1; transform:none}}
.result.fresh{animation:resultIn .34s cubic-bezier(.2,.72,.3,1)}
@media (prefers-reduced-motion:reduce){.result.fresh{animation:none}}

.boards{display:flex; gap:22px; flex-wrap:wrap}
.boardbox{min-width:0}
.blabel{font-size:11px; color:var(--ink-3); margin-bottom:6px; letter-spacing:.02em}
.roadscroll{overflow-x:auto; padding-bottom:4px}
.gridrow{display:flex; gap:2px; margin-bottom:2px}
.cell{width:21px; height:21px; border-radius:5px; flex:0 0 auto; display:grid;
      place-items:center; font-size:10px; color:#fff; font-weight:500}
.cell.empty{background:var(--surface-3)}
.cell.P{background:var(--player)} .cell.B{background:var(--banker)} .cell.T{background:var(--tie)}
.cell.sm{width:11px; height:11px; border-radius:50%}
.cell.sm.dR{background:var(--banker)} .cell.sm.dB{background:var(--player)}
#boardMeta{font-family:var(--mono); font-size:12px; color:var(--ink-2); margin-top:10px}

/* ── per-shoe table ─────────────────────────────────────────────────── */
#shoeStrip{width:100%; height:auto; display:block; max-width:760px; margin:4px auto 14px}
#shoeStrip .m{font-family:var(--mono)}
#shoeFacts{display:grid; grid-template-columns:repeat(auto-fit, minmax(168px, 1fr));
           gap:10px; margin-bottom:12px}
#shoeVerdict{margin-bottom:14px}
.shoescroll{max-height:396px; overflow:auto; border:1px solid var(--line);
            border-radius:9px; background:var(--surface-2)}
#shoeTable{width:100%; border-collapse:collapse; font-size:12.5px}
#shoeTable th{position:sticky; top:0; z-index:1; background:var(--surface-3);
              border-bottom:1px solid var(--line-2); padding:0;
              font-weight:500; white-space:nowrap}
#shoeTable th button{width:100%; font:inherit; color:var(--ink-2); background:none;
                     border:0; padding:8px 10px; cursor:pointer; text-align:right;
                     white-space:nowrap}
#shoeTable th:first-child button{text-align:left}
#shoeTable th button:hover{color:var(--ink)}
#shoeTable th[aria-sort] button{color:var(--ink); font-weight:600}
#shoeTable th button .caret{color:var(--accent); margin-left:4px}
#shoeTable td{padding:6px 10px; text-align:right; border-bottom:1px solid var(--line);
              font-family:var(--mono); font-variant-numeric:tabular-nums;
              color:var(--ink-2); white-space:nowrap}
#shoeTable td:first-child{text-align:left; color:var(--ink-3)}
#shoeTable td small{font-family:var(--mono); font-size:10.5px; color:var(--ink-3);
                    margin-right:10px; white-space:pre}
#shoeTable tr:last-child td{border-bottom:none}
#shoeTable tr.open td:first-child{color:var(--accent); font-weight:600}
#shoeTable td.q{color:var(--ink); font-weight:600}
#shoeTable td.q.b{color:var(--banker)} #shoeTable td.q.p{color:var(--player)}
#shoeTable tr.far td.z{color:var(--accent); font-weight:600}
#shoeTable td.mut{color:var(--ink-3)}
.shoefoot{display:flex; align-items:center; gap:12px; margin-top:11px}
.shoefoot .note{margin:0}
@media (max-width:560px){
  #shoeTable .opt{display:none}
  .shoescroll{max-height:330px}
  /* A sort header is a control, and a thumb needs more of it than the text
     alone gives -- 35px is under every touch-target guideline there is. */
  #shoeTable th button{padding:12px 10px}
}

/* ── milestones ─────────────────────────────────────────────────────── */
.ms{margin-bottom:14px}
.ms:last-child{margin-bottom:0}
.msrow{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; margin-bottom:5px}
.msname{color:var(--ink-2)}
.msnum{font-family:var(--mono); color:var(--ink-3); font-variant-numeric:tabular-nums}
.track{height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden}
.track i{display:block; height:100%; background:var(--ink-2); border-radius:3px}
.ms.done .track i{background:var(--tie)}
.ms.done .msname{color:var(--ink)}
.msnote{font-size:11.5px; color:var(--ink-3); margin-top:5px}

/* ── integrity ──────────────────────────────────────────────────────── */
.introw{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:11px}
#intProgress{margin:10px 0}
#intProgressLabel{font-size:12px; color:var(--ink-3); margin-bottom:6px}
#intBar{display:block; height:5px; background:var(--accent); border-radius:3px; width:0; transition:width .2s}
.bartrack{height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden}
.flegend{display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center; font-size:11px;
         color:var(--ink-3); padding-bottom:9px; border-bottom:1px solid var(--line); margin-bottom:4px}
.flegend span{display:flex; align-items:center; gap:6px}
.swatch{display:inline-block; border-radius:20px}
.swatch.band{width:22px; height:7px; background:var(--band)}
.swatch.dot{width:9px; height:9px; background:var(--ink-2)}
.find{display:grid; grid-template-columns:minmax(92px,1.1fr) minmax(150px,1.5fr) auto 34px;
      gap:11px; align-items:center; padding:5px 0; border-bottom:1px solid var(--line)}
.find:last-child{border-bottom:none}
.fname .t{font-size:12.5px; color:var(--ink-2)}
.fplot svg{width:100%; height:22px; display:block; overflow:visible}
.fnum{display:flex; gap:9px; justify-content:flex-end; font-family:var(--mono); font-size:11.5px}
.fnum .z{color:var(--ink); font-variant-numeric:tabular-nums}
.fnum .p{color:var(--ink-3)}
.fstate{font-size:11px; color:var(--ink-3); text-align:right}
.find.flagged .fstate{color:var(--accent); font-weight:600}
.find.flagged .fname .t{color:var(--ink); font-weight:500}
#intMeta{font-family:var(--mono); font-size:11.5px; color:var(--ink-3); margin-top:11px}

/* ── data tools ─────────────────────────────────────────────────────── */
.tools{display:grid; grid-template-columns:repeat(3,1fr); gap:20px}
@media (max-width:820px){ .tools{grid-template-columns:1fr} }
.keys{display:flex; gap:7px; flex-wrap:wrap}
.keys .btn{min-width:52px; justify-content:center}
.keys .btn b{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-left:5px; font-weight:400}
textarea{width:100%; min-height:64px; resize:vertical; font-family:var(--mono); font-size:12.5px}
.note{font-size:11.5px; color:var(--ink-3); margin-top:8px; line-height:1.5}
code{font-family:var(--mono); font-size:12px; background:var(--surface-3);
     padding:1px 5px; border-radius:4px}
footer{max-width:1220px; margin:0 auto; padding:4px 20px 40px; font-size:11.5px;
       color:var(--ink-3); line-height:1.6}

/* ── touch and small screens ────────────────────────────────────────────
   A finger is not a cursor: every control that is tapped gets a 44px box,
   and the findings table, which is four columns of numbers, folds rather
   than pushing the page sideways. */
@media (pointer: coarse){
  .btn,.segbtn{min-height:44px; padding-top:11px; padding-bottom:11px}
  select,#langSel,#reps,#liveInterval{min-height:44px; padding:10px 12px; font-size:14px}
  .themebtn{width:40px; height:40px}
  .themebtn svg{width:18px; height:18px}
  textarea{min-height:88px; font-size:16px}      /* 16px stops iOS zooming on focus */
}
@media (max-width:620px){
  main{padding:12px; gap:12px}
  .panel{padding:14px 15px; border-radius:11px}
  .hin{padding:9px 14px; gap:9px 12px}
  h1,.brand{font-size:14px}
  #shoeMeta{order:5; flex-basis:100%; font-size:12px}
  .find{grid-template-columns:1fr auto; grid-template-areas:"name state" "plot nums";
        gap:5px 10px; padding:8px 0}
  .fname{grid-area:name} .fstate{grid-area:state}
  .fplot{grid-area:plot} .fnum{grid-area:nums}
  .flegend{font-size:10.5px; gap:4px 12px}
  #kpis{grid-template-columns:1fr 1fr; gap:8px}
  .tile .v{font-size:19px}
  .aigrid{grid-template-columns:1fr}
  .boards{gap:16px}
  .result{gap:12px; padding:12px 14px; min-height:58px}
  .result .rdot{width:28px; height:28px}
  .result .rword{font-size:19px}
  .result .rmeta{font-size:11px}
  .seqstrip{max-height:132px}
  .livebox{padding:20px 14px}
  .actions{gap:7px}
  footer{padding-bottom:96px}          /* clear of the entry bar */
}

/* ── the quick entry bar ────────────────────────────────────────────────
   On a phone the manual controls sit at the bottom of a very long page. The
   same five actions ride above the fold instead, within thumb reach. */
#quickbar{display:none}
@media (pointer: coarse) and (max-width:820px){
  #quickbar{
    display:grid; grid-template-columns:repeat(5,1fr); gap:6px;
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
  }
  .qb{
    min-height:46px; border-radius:10px; border:1px solid var(--line-2);
    background:var(--surface-2); color:var(--ink); font-size:13px; font-weight:600;
    cursor:pointer; padding:0 4px;
  }
  .qb.P{border-color:var(--player); color:var(--player)}
  .qb.B{border-color:var(--banker); color:var(--banker)}
  .qb.T{border-color:var(--tie); color:var(--tie)}
  .qb.ghost{font-weight:500; font-size:12px; color:var(--ink-2)}
  .qb:active{transform:scale(.97)}
}
</style>
</head><body>

<header>
  <div class="hin">
    <h1 class="brand"><span class="pips"><i></i><i></i><i></i></span><span data-i18n="app.title"></span></h1>
    <select id="tableSel" data-i18n-aria="header.tableAria"></select>
    <button class="btn ghost" id="addTable" data-i18n="header.addTable"></button>
    <button class="btn ghost" id="renameTable" data-i18n="header.renameTable"></button>
    <button class="btn ghost" id="clearTable" data-i18n="header.clearTable"></button>
    <button class="btn ghost" id="resetBtn" data-i18n="header.deleteTable"></button>
    <span id="exampleBadge" class="badge" data-i18n="header.example" hidden></span>
    <span class="spacer"></span>
    <span id="shoeMeta"></span>
    <span id="whoBox" class="whobox" hidden>
      <span id="whoName"></span>
      <a class="wholink" id="whoAccounts" href="/accounts" hidden data-i18n="header.accounts"></a>
      <button class="wholink" id="whoOut" type="button" data-i18n="header.signOut"></button>
    </span>
    <select id="langSel" data-i18n-aria="header.langAria"></select>
    <span class="themeseg" role="group" data-i18n-aria="theme.auto">
      <button class="themebtn" id="themeAuto" data-i18n-title="theme.auto" data-i18n-aria="theme.auto">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="5.6" stroke="currentColor" stroke-width="1.5"/><path d="M8 2.4a5.6 5.6 0 0 1 0 11.2z" fill="currentColor"/></svg>
      </button>
      <button class="themebtn" id="themeLight" data-i18n-title="theme.light" data-i18n-aria="theme.light">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.5"/><path d="M8 .9v1.8M8 13.3v1.8M15.1 8h-1.8M2.7 8H.9M13 3l-1.3 1.3M4.3 11.7 3 13M13 13l-1.3-1.3M4.3 4.3 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button class="themebtn" id="themeDark" data-i18n-title="theme.dark" data-i18n-aria="theme.dark">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.4 9.6A5.9 5.9 0 0 1 6.4 2.6a5.9 5.9 0 1 0 7 7z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
      </button>
    </span>
    <span class="store"><i class="sdot" id="storeDot"></i><span id="storeLabel"></span></span>
    <span class="store" id="roomBox" hidden><i class="sdot" id="roomDot"></i><span id="roomLabel"></span></span>
    <button class="btn ghost tiny" id="roomInvite" data-i18n="room.invite" hidden></button>
    <button class="btn ghost tiny" id="roomLeave" data-i18n="room.leave" hidden></button>
  </div>
</header>

<main>
  <!-- Left column: what you point at the table, and what it has collected.
       They stack in one column rather than each taking a row of the page, so
       the prediction's height is absorbed beside them instead of leaving a
       band of empty ground under one of them. -->
  <div class="col c7">
  <section class="panel">
    <h2 data-i18n="capture.h"></h2>
    <p class="sub" data-i18n="capture.sub"></p>

    <div class="seg" role="tablist">
      <button class="segbtn on" id="modeLive" role="tab" aria-selected="true"
              aria-controls="livePane" tabindex="0" data-i18n="capture.modeLive"></button>
      <button class="segbtn" id="modePaste" role="tab" aria-selected="false"
              aria-controls="pastePane" tabindex="-1" data-i18n="capture.modePaste"></button>
    </div>

    <!-- ── live ────────────────────────────────────────────────────── -->
    <div id="livePane" role="tabpanel" aria-labelledby="modeLive" tabindex="0">
      <div id="liveIdle">
        <div class="livebox">
          <div class="big" id="liveIdleH"></div>
          <p class="small" id="liveIdleBody" data-i18n-html="live.idleBody"></p>
          <div class="actions" style="justify-content:center">
            <button class="btn primary" id="liveStart" data-i18n="live.start"></button>
            <button class="btn primary" id="liveCamera" data-i18n="live.startCamera" hidden></button>
          </div>
          <p class="small" id="liveCameraBody" style="margin-top:12px" data-i18n="live.cameraBody" hidden></p>
          <p class="small" id="liveCameraTip" style="margin-top:8px" data-i18n="live.cameraTip" hidden></p>
          <p class="small" style="margin-top:12px" data-i18n="live.privacy"></p>
        </div>
      </div>

      <div id="liveActive" hidden>
        <canvas id="liveCanvas"></canvas>
        <p class="small" id="livePickHint" hidden data-i18n="live.pickHint"></p>
        <div class="livebar">
          <span class="livedot" id="liveDot"></span>
          <span id="liveStatus"></span>
          <span class="spacer"></span>
          <select id="liveInterval" data-i18n-aria="live.intervalAria">
            <option value="1000"></option>
            <option value="1500" selected></option>
            <option value="3000"></option>
            <option value="6000"></option>
          </select>
          <button class="btn ghost" id="livePick" data-i18n="live.pick"></button>
          <button class="btn ghost" id="liveRelock" data-i18n="live.relock"></button>
          <button class="btn" id="liveStop" data-i18n="live.stop"></button>
        </div>
        <div id="liveBinding" class="warn" hidden></div>
        <div id="liveWarn" class="warn" hidden></div>

  "ai.crossover": {
    ko: "뱅커와 플레이어의 우열은 P(뱅커 | 타이 제외) {q}에서 뒤집히고, 현재 추정치는 그 선에서 {z}표준오차 떨어져 있습니다. 선을 <b>1표준오차 넘게</b> 내려가기 전까지는 뱅커를 유지합니다 — 그 선은 새 슈에서 0.05%p밖에 안 떨어져 있어, 추정 오차만으로도 수천 판 동안 넘나들기 때문입니다. 각 49,000판인 공정한 테이블 6개에서, 그때그때 나은 쪽을 따라가면 이김 45.44%·테이블당 −540유닛이었고, 이 기준을 두면 <b>45.91%·테이블당 −452유닛</b>이었습니다. 문턱의 크기는 재서 골랐습니다 — 실제로 돌린 슈 290만 판에서 1표준오차는 항상 뱅커와 차이가 없었고(잡음 이하), 진짜로 플레이어 쪽으로 치우친 테이블에서는 전에 쓰던 더 넓은 문턱보다 적중률이 2~3%p 높았습니다.",
    en: "Banker stops being the better bet below P(Banker | not tie) of {q}, and the estimate sits {z} standard errors from that line. The pick holds Banker until the estimate is <b>a standard error below</b> it: the line is only 0.05pp from a fresh shoe, so estimation error alone crosses it for thousands of coups. Over six fair tables of 49,000 coups each, following whichever side looked better won 45.44% of coups and lost 540 units a table; requiring the evidence won <b>45.91% and lost 452 a table</b>. The size of the bar is measured: over 2.9 million dealt coups one standard error is indistinguishable from never switching, and on a table genuinely biased to Player it is 2 to 3 points of hit rate better than the wider bar it replaced.",
    "zh-Hant": "當 P(莊 | 排除和局) 低於 {q} 時莊就不再較優，目前估計值距該線 {z} 個標準誤。在估計值低於該線<b>一個標準誤</b>之前維持押莊 — 該線距全新牌靴僅 0.05%p，單憑估計誤差就會來回穿越數千局。在六張各 49,000 局的公正牌桌上，跟著當下較優的一邊贏 45.44%、每桌虧 540 單位；要求證據則贏 <b>45.91%、每桌虧 452</b>。門檻大小是量出來的：在 290 萬局實際發牌中，一個標準誤與從不換邊無法區分，而在真正偏向閒家的桌上，命中率比先前較寬的門檻高 2 至 3 個百分點。",
    "zh-Hans": "当 P(庄 | 排除和局) 低于 {q} 时庄就不再较优，当前估计值距该线 {z} 个标准误。在估计值低于该线<b>一个标准误</b>之前维持押庄 — 该线距全新牌靴仅 0.05%p，单凭估计误差就会来回穿越数千局。在六张各 49,000 局的公正牌桌上，跟着当下较优的一边赢 45.44%、每桌亏 540 单位；要求证据则赢 <b>45.91%、每桌亏 452</b>。门槛大小是量出来的：在 290 万局实际发牌中，一个标准误与从不换边无法区分，而在真正偏向闲家的桌上，命中率比先前较宽的门槛高 2 至 3 个百分点。",
  },
  "ai.notBaccarat": {
    ko: "<b>이 기록은 8덱 바카라의 모양이 아닙니다.</b> 타이가 <b>{rate}</b>인데 공정한 슈는 <b>9.52%</b>이고, {coups}판에서 그 차이는 <b>{z}표준오차</b>입니다. 타이 비율은 셔플이 아니라 덱 구성이 정하는 값이라, 이만큼 벗어났다면 셔플이 아니라 <b>판독</b>을 먼저 의심해야 합니다 — 화면 인식이 판을 빠뜨렸거나, 같은 슈를 두 번 세었거나, 조각난 슈를 이어 붙였을 수 있습니다. 그 전까지 추천은 학습 모델이 아니라 기본 추정을 씁니다.",

  "shoe.sub": {
    ko: "각 슈가 혼자서 낸 결과입니다. 슈 하나가 결정하는 판은 70판 남짓이라 뱅커 비율의 표준오차가 <b>약 6%p</b>입니다 — 두 손익분기선 사이 죽은 구간 전체(1.28%p)보다 다섯 배 가까이 넓습니다. 슈 하나는 그 자체로 아무것도 말해 주지 않습니다. 그래서 각 슈가 공정값에서 몇 표준오차 떨어져 있는지와, 정직한 테이블이라면 그중 몇 슈가 그 밖으로 나갔을지를 같이 봅니다.",
    en: "What each shoe produced on its own. A shoe decides only about seventy coups, so its Banker share carries a standard error near <b>6 percentage points</b> — close to five times the whole dead band between the two break-even lines. One shoe, by itself, says nothing. So each shoe is given with its distance from fair in standard errors, and with how many an honest table would have put past that line anyway.",

    "zh-Hans": "每一靴自己跑出的结果。一靴只决定约七十局，庄家占比的标准误差因此接近 <b>6 个百分点</b> — 几乎是两条损益平衡线之间整个死区（1.28%p）的五倍。单独一靴什么也说明不了。因此每一靴都附上它距离公平值几个标准误差，以及诚实的桌子本来就会有多少靴落在那条线之外。",

  "int.sub": {
    ko: "결과만 있는 데이터가 답할 수 있는 가장 값진 질문입니다. 정직한 8덱 슈에는 이용할 수 있는 신호가 없으므로, 패턴이 통하려면 이 테이블의 셔플이 제대로 되지 않았어야 합니다. 17개 순서 통계를 <b>같은 크기의 시뮬레이션 슈</b>와 비교합니다 — \"50.68%의 독립시행\"이 아니라 진짜 슈와 비교해야 정직한 테이블을 오탐하지 않습니다.",
    en: "The most valuable question a result-only corpus can answer. An honest 8-deck shoe carries no usable signal, so a pattern can only work if this table's shuffle is broken. Seventeen order statistics are compared against <b>simulated shoes of the same size</b> — comparing against \"independent draws at 50.68%\" would flag an honest table, because dealing without replacement is not independent.",

    "zh-Hans": "只有结果的数据所能回答的最有价值问题。诚实的八副牌靴不存在可利用的信号，因此路数要能成立，这张桌台的洗牌必须有问题。本检验将 17 项顺序统计量与<b>相同规模的模拟牌靴</b>比较 — 若拿“50.68% 的独立试验”当基准，连诚实的桌台也会被误判，因为无放回发牌本就不独立。",

/* ------------------------------------------------------------------ state */

const DEFAULT_LANG = "ko";
let lang = DEFAULT_LANG;
let theme = "auto";
const listeners = new Set();

const read = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
const write = (key, value) => { try { localStorage.setItem(key, value); } catch { /* private mode */ } };

/** The stored choice, else the closest match to the browser's own language. */
function detectLang() {
  const stored = read(LANG_KEY);
  if (stored && LANGS.some((l) => l.code === stored)) return stored;

  for (const tag of (typeof navigator !== "undefined" ? navigator.languages || [navigator.language] : [])) {
    if (!tag) continue;
    const lower = String(tag).toLowerCase();
    if (lower.startsWith("ko")) return "ko";
    if (lower.startsWith("zh")) {
      // Script beats region, but region decides when no script is given:
      // zh-TW, zh-HK and zh-MO are traditional, everything else simplified.
      if (lower.includes("hant") || /-(tw|hk|mo)\b/.test(lower)) return "zh-Hant";
      return "zh-Hans";
    }
    if (lower.startsWith("en")) return "en";
  }
  return DEFAULT_LANG;
}

function currentLang() { return lang; }
function currentTheme() { return theme; }

/** `[n|shoe|shoes]` -- the form to use for the count named before the first bar. */
const PLURAL = /\[(\w+)\|([^|\]]*)\|([^\]]*)\]/g;

/**
 * Look up `key` in the current language and fill in `{placeholders}`.
 * A missing key returns the key itself, which shows up on screen rather than
 * failing silently -- the point being that it is meant to be noticed.
 *
 * English is the only one of the four languages here that inflects for number,
 * and "Only 1 shoes so far" is the first line a new table shows, so a string
 * may carry both forms as `[n|shoe|shoes]` and let the count choose. The
 * choice is made before the substitution so it reads the number and not the
 * text that replaced it; an absent count takes the plural, which is the form
 * that reads correctly for zero as well.
 */
function t(key, vars) {
  const entry = S[key];
  let text = entry ? (entry[lang] ?? entry[DEFAULT_LANG] ?? key) : key;
  if (vars) {
    text = text.replace(PLURAL, (_, name, one, many) =>
      (String(vars[name]) === "1" ? one : many));
    for (const [name, value] of Object.entries(vars)) {
      text = text.split(`{${name}}`).join(String(value));
    }
  }
  return text;
}

/** The label for one outcome code, e.g. "뱅커" / "Banker" / "莊". */
const side = (code) => t("side." + code);
/** The short glyph a board cell carries. */
const mark = (code) => t("mark." + code);

function onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); }
const notify = () => { for (const fn of listeners) fn(); };

/* ------------------------------------------------------------------- DOM */

/**
 * Re-label the static markup.
 *
 * `data-i18n` sets text, `data-i18n-html` sets markup (the strings carrying
 * `<b>` emphasis are authored here, never user input), and the rest set the
 * attributes that also reach a reader.
 */
function applyDom(root = document) {
  for (const node of root.querySelectorAll("[data-i18n]")) {
    node.textContent = t(node.dataset.i18n);
  }
  for (const node of root.querySelectorAll("[data-i18n-html]")) {
    node.innerHTML = t(node.dataset.i18nHtml);
  }
  for (const node of root.querySelectorAll("[data-i18n-ph]")) {
    node.placeholder = t(node.dataset.i18nPh);
  }
  for (const node of root.querySelectorAll("[data-i18n-aria]")) {
    node.setAttribute("aria-label", t(node.dataset.i18nAria));
  }
  for (const node of root.querySelectorAll("[data-i18n-title]")) {
    node.title = t(node.dataset.i18nTitle);
  }
  document.documentElement.lang = lang;
  document.title = t("app.title");
}

function setLang(code) {
  if (!LANGS.some((l) => l.code === code)) return;
  lang = code;
  write(LANG_KEY, code);
  applyDom();
  notify();
}

/* ----------------------------------------------------------------- theme */

/**
 * `auto` leaves the root unstamped so `prefers-color-scheme` decides, which is
 * also how an artifact viewer's own theme reaches the page; `light` and `dark`
 * stamp an explicit choice that overrides it in both directions.
 */
function setTheme(next) {
  if (!THEMES.includes(next)) return;
  theme = next;
  write(THEME_KEY, next);
  const root = document.documentElement;
  if (next === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", next);
  notify();
}

/** Restore both choices. Call once, before the first render. */
function initPreferences() {
  lang = detectLang();
  const storedTheme = read(THEME_KEY);
  // An artifact viewer stamps the root itself; honour that when nothing is stored.
  const stamped = document.documentElement.getAttribute("data-theme");
  theme = THEMES.includes(storedTheme) ? storedTheme : (stamped === "light" || stamped === "dark" ? stamped : "auto");
  setTheme(theme);
  applyDom();
}

/** The whole table, for the tests that read the copy against the code. */
function allStrings() { return S; }

/** The English of every key, for the test that renders them all. */
function englishStrings() {
  return Object.fromEntries(Object.entries(S).map(([key, entry]) => [key, entry.en]));
}

/** Every key that is missing a translation, for the port test to assert on. */
function missingTranslations() {
  const gaps = [];
  for (const [key, entry] of Object.entries(S)) {
    for (const { code } of LANGS) {
      if (typeof entry[code] !== "string" || !entry[code].length) gaps.push(`${key}:${code}`);
    }
  }
  return gaps;
}

/**
 * Plural forms whose count is not a placeholder of the same string.
 *
 * `[n|shoe|shoes]` in a string that never receives `n` silently takes the
 * plural forever, which looks like working code and reads wrong at one.
 */
function pluralProblems() {
  const bad = [];
  for (const [key, entry] of Object.entries(S)) {
    for (const { code } of LANGS) {
      const text = entry[code];
      if (typeof text !== "string") continue;
      const names = new Set([...text.matchAll(/\{(\w+)\}/g)].map((m) => m[1]));
      for (const m of text.matchAll(PLURAL)) {
        if (!names.has(m[1])) bad.push(`${key}:${code}:${m[1]}`);
      }
    }
  }
  return bad;
}

/** Placeholders that do not appear in every language of the same key. */
function placeholderMismatches() {
  const bad = [];
  const names = (s) => [...s.matchAll(/\{(\w+)\}/g)].map((m) => m[1]).sort().join(",");
  for (const [key, entry] of Object.entries(S)) {
    const want = names(entry[DEFAULT_LANG] || "");
    for (const { code } of LANGS) {
      if (typeof entry[code] === "string" && names(entry[code]) !== want) bad.push(`${key}:${code}`);
    }
  }
  return bad;
}

/* ═══ core.js ═══ */
/* Punto Banco core, ported from the Python package.
 *
 * This is a faithful transcription of baccarat/core/{rules,shoe,simulator}.py
 * and baccarat/features/roads.py. It exists so the browser build can compute
 * the same numbers as the desktop pipeline without a Python install, and
 * tests/test_js_port.py pins the two against each other on fixed sequences.
 *
 * The simulator's shuffle uses a different PRNG from numpy's, so simulated
 * corpora are not coup-for-coup identical to Python's. Nothing depends on
 * that: the null is a distribution, and every deterministic function of a
 * given outcome sequence -- roads, order statistics, corrections -- is
 * identical, which is what the cross-check asserts.
 */

/* ------------------------------------------------------------------ rules */

const PAYOUT_BANKER = 1.0;
const PAYOUT_PLAYER = 1.0;
const PAYOUT_TIE = 8.0;
const BANKER_COMMISSION = 0.05;

/** P(Banker | not tie) a Banker bet must exceed to break even at 5% commission. */
const BANKER_BREAKEVEN = 1.0 / 1.95;          // 0.5128205128
/** P(Banker | not tie) a Player bet must fall below to break even. */
const PLAYER_BREAKEVEN = 0.5;
/** Banker's share of decided coups in a fresh 8-deck shoe. */
const BASE_BANKER_SHARE = 0.5068248295;
/** Tie probability for a fresh 8-deck shoe. */
const BASE_TIE = 0.095156;
/** Distance from a fresh shoe to the Banker break-even: the yardstick for
 *  "a bias big enough to be worth money". */
const BANKER_BREAKEVEN_GAP = BANKER_BREAKEVEN - BASE_BANKER_SHARE;

/** Point values per rank: 10/J/Q/K are four ranks worth 0, A-9 one each. */
const RANKS_PER_VALUE = [4, 1, 1, 1, 1, 1, 1, 1, 1, 1];
const N_VALUES = 10;

/** Composition of a fresh n-deck shoe as counts per point value. */
function valueVector(nDecks = 8) {
  return RANKS_PER_VALUE.map((ranks) => 4 * nDecks * ranks);
}

/** Player draws a third card on 0-5 and stands on 6-7. Naturals resolve first. */
function playerDraws(total) {
  return total <= 5;
}

/** Banker third-card chart, consulted only when the player drew. */
function bankerDraws(bankerTotal, playerThird) {
  if (playerThird === null || playerThird === undefined) return bankerTotal <= 5;
  switch (bankerTotal) {
    case 0: case 1: case 2: return true;
    case 3: return playerThird !== 8;
    case 4: return playerThird >= 2 && playerThird <= 7;
    case 5: return playerThird >= 4 && playerThird <= 7;
    case 6: return playerThird >= 6 && playerThird <= 7;
    default: return false;                      // 7, 8, 9 stand
  }
}

function isNatural(total) {
  return total >= 8;
}

function settle(playerTotal, bankerTotal) {
  if (playerTotal > bankerTotal) return "P";
  if (bankerTotal > playerTotal) return "B";
  return "T";
}

/** Net profit on a `stake` wagered on `side` given `result`. Ties push. */
function profit(side, result, stake = 1.0, commission = BANKER_COMMISSION) {
  if (result === "T") return side === "T" ? stake * PAYOUT_TIE : 0.0;
  if (side === "T") return -stake;
  if (side !== result) return -stake;
  if (side === "B") return stake * PAYOUT_BANKER * (1.0 - commission);
  return stake * PAYOUT_PLAYER;
}

/**
 * Deal a coup from the front of `values` (point values, dealt in order).
 * Returns {player, banker, outcome}. Throws if fewer than four cards.
 */
function playOut(values) {
  if (values.length < 4) throw new Error("a coup needs at least four cards");

  const player = [values[0], values[2]];
  const banker = [values[1], values[3]];
  let idx = 4;

  let pTotal = (player[0] + player[1]) % 10;
  let bTotal = (banker[0] + banker[1]) % 10;

  if (isNatural(pTotal) || isNatural(bTotal)) {
    return { player, banker, outcome: settle(pTotal, bTotal) };
  }

  let playerThird = null;
  if (playerDraws(pTotal)) {
    if (values.length <= idx) throw new Error("shoe exhausted before the player's third card");
    playerThird = values[idx++];
    player.push(playerThird);
    pTotal = (pTotal + playerThird) % 10;
  }

  if (bankerDraws(bTotal, playerThird)) {
    if (values.length <= idx) throw new Error("shoe exhausted before the banker's third card");
    const third = values[idx++];
    banker.push(third);
    bTotal = (bTotal + third) % 10;
  }

  return { player, banker, outcome: settle(pTotal, bTotal) };
}

/* -------------------------------------------------------------------- rng */

/**
 * Fisher-Yates, in place.
 *
 * Extracted so it can be checked on its own. Every permutation has to be
 * reachable and equally likely: this is what stands between the simulated
 * corpus and the table it is the null hypothesis for, and a shuffle that is
 * merely *nearly* uniform produces a corpus that is subtly not random -- which
 * is the exact property the seventeen statistics are looking for. `i + 1` is
 * the whole of it. `i` alone can never leave an element where it started, and
 * anything smaller cannot reach the top of the range at all.
 */
function shuffleInPlace(array, rng) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    const t = array[i]; array[i] = array[j]; array[j] = t;
  }
  return array;
}

/** sfc32: small, fast, and statistically adequate for shuffling a shoe. */
function makeRng(seed) {
  let a = 0x9e3779b9, b = seed >>> 0, c = 0x243f6a88, d = 0x0b7285ff;
  for (let i = 0; i < 12; i++) {
    const t = (a + b | 0) + d | 0;
    d = d + 1 | 0; a = b ^ b >>> 9; b = c + (c << 3) | 0;
    c = (c << 21 | c >>> 11); c = c + t | 0;
  }
  const rng = function rng() {
    const t = (a + b | 0) + d | 0;
    d = d + 1 | 0; a = b ^ b >>> 9; b = c + (c << 3) | 0;
    c = (c << 21 | c >>> 11); c = c + t | 0;
    return (t >>> 0) / 4294967296;
  };
  // Where the generator has got to, and a way back there. For the learner,
  // which checkpoints its training so an undone coup can be replayed from the
  // start of its shoe instead of from the start of the record -- and a replay
  // is only the same replay if the draws it makes are the same draws. Neither
  // changes a single number the generator produces.
  rng.state = () => [a, b, c, d];
  rng.restore = (s) => { [a, b, c, d] = s; };
  return rng;
}

/* ------------------------------------------------------------------- shoe */

/**
 * One shuffled 8-deck shoe, dealt from the front.
 *
 * Tracks the same two vectors the Python `Shoe` does. `composition` is what is
 * actually left (oracle); `unseen` is the pack minus what anyone at the table
 * has seen, so the burned-but-unexposed cards stay in it. Only `unseen` is
 * legal information.
 */
class Shoe {
  constructor({ nDecks = 8, cutCardDepth = 14, burn = true, seed = 1 } = {}) {
    this.nDecks = nDecks;
    this.cutCardDepth = cutCardDepth;
    const rng = makeRng(seed);

    const pack = [];
    for (let v = 0; v < N_VALUES; v++) {
      const n = 4 * nDecks * RANKS_PER_VALUE[v];
      for (let i = 0; i < n; i++) pack.push(v);
    }
    shuffleInPlace(pack, rng);

    this.cards = pack;
    this.pos = 0;
    this.true_ = valueVector(nDecks);
    this.unseen = valueVector(nDecks);
    this.cutReached = false;
    if (burn) this._burn();
  }

  get totalCards() { return this.cards.length; }
  get remaining() { return this.totalCards - this.pos; }
  get unseenTotal() { return this.unseen.reduce((a, b) => a + b, 0); }
  get cutCardReached() { return this.pos >= this.totalCards - this.cutCardDepth; }
  get finished() { return this.cutReached || this.remaining < 6; }

  _take(n, observed) {
    if (n > this.remaining) throw new Error(`cannot take ${n} cards, only ${this.remaining} remain`);
    for (let i = 0; i < n; i++) {
      const v = this.cards[this.pos + i];
      this.true_[v] -= 1;
      if (observed) this.unseen[v] -= 1;
    }
    this.pos += n;
  }

  /** Expose one card, then discard that many more face-down (a 0 burns ten). */
  _burn() {
    const exposed = this.cards[this.pos];
    this._take(1, true);
    const count = Math.min(exposed === 0 ? 10 : exposed, this.remaining);
    this._take(count, false);
  }

  /** Deal one coup. The unseen vector is snapshotted before a card moves. */
  dealCoup() {
    if (this.finished) throw new Error("shoe is finished");
    const unseenBefore = this.unseen.slice();
    const window = this.cards.slice(this.pos, this.pos + 6);
    const { player, banker, outcome } = playOut(window);
    this._take(player.length + banker.length, true);
    if (this.cutCardReached) this.cutReached = true;
    return { player, banker, outcome, unseenBefore };
  }
}

/** Deal one complete shoe and return its outcomes as a "PBT" string. */
function simulateShoe(seed, { nDecks = 8, cutCardDepth = 14, burn = true } = {}) {
  const shoe = new Shoe({ nDecks, cutCardDepth, burn, seed });
  const out = [];
  while (!shoe.finished) {
    let coup;
    try { coup = shoe.dealCoup(); } catch { break; }
    out.push(coup.outcome);
  }
  return out.join("");
}

/** `nShoes` independent shoes as an array of "PBT" strings. */
function simulate(nShoes, seed = 20240101, opts = {}) {
  const shoes = new Array(nShoes);
  for (let i = 0; i < nShoes; i++) shoes[i] = simulateShoe((seed + 2654435761 * (i + 1)) | 0, opts);
  return shoes;
}

/* ------------------------------------------------------------------ roads */

const RED = "R", BLUE = "B";

/**
 * Incremental Big Road. Columns are kept logically -- a run of nine Bankers is
 * one column of nine, not a six-cell column plus a tail -- because that is the
 * form the derived-road rules are defined on. `grid()` renders the wrapped
 * display board with dragon tails.
 */
class BigRoad {
  constructor() {
    this.columns = [];
    this.tieCounts = new Map();
    this.nEntries = 0;
  }

  /** Record one coup. Returns [column, row], or null for a tie. */
  add(outcome) {
    if (outcome === "T") {
      if (this.columns.length) {
        const key = `${this.columns.length - 1},${this.columns[this.columns.length - 1].length - 1}`;
        this.tieCounts.set(key, (this.tieCounts.get(key) || 0) + 1);
      }
      return null;
    }
    const last = this.columns[this.columns.length - 1];
    if (last && last[last.length - 1] === outcome) last.push(outcome);
    else this.columns.push([outcome]);
    this.nEntries += 1;
    const col = this.columns[this.columns.length - 1];
    return [this.columns.length - 1, col.length - 1];
  }

  get columnLengths() { return this.columns.map((c) => c.length); }
  get currentStreak() { return this.columns.length ? this.columns[this.columns.length - 1].length : 0; }
  get currentSide() { return this.columns.length ? this.columns[this.columns.length - 1][0] : null; }

  /** The wrapped display board: a column deeper than `rows` turns right. */
  grid(rows = 6) {
    const cells = new Map();
    const has = (r, c) => cells.has(`${r},${c}`);
    for (let colIdx = 0; colIdx < this.columns.length; colIdx++) {
      let r = 0, c = colIdx;
      const column = this.columns[colIdx];
      for (let depth = 0; depth < column.length; depth++) {
        if (depth === 0) {
          while (has(r, c)) c += 1;
        } else {
          let nr = r + 1, nc = c;
          if (nr >= rows || has(nr, nc)) {
            nr = r; nc = c + 1;
            while (has(nr, nc)) nc += 1;
          }
          r = nr; c = nc;
        }
        cells.set(`${r},${c}`, column[depth]);
      }
    }
    if (!cells.size) return Array.from({ length: rows }, () => [null]);
    let width = 0;
    for (const key of cells.keys()) width = Math.max(width, Number(key.split(",")[1]) + 1);
    return Array.from({ length: rows }, (_, r) =>
      Array.from({ length: width }, (_, c) => cells.get(`${r},${c}`) ?? null));
  }
}

/**
 * Derive one road from the Big Road's logical columns.
 *
 * An entry opening column `c` compares the lengths of columns `c-offset` and
 * `c-offset-1`: equal means the board is repeating itself (Red), unequal Blue.
 * An entry extending a column at row `r` asks whether column `c-offset` also
 * reached `r`: yes or never reached `r-1` is Red, stopped exactly one short is
 * Blue. Entries too near the left edge produce nothing.
 */
function derivedRoad(columns, offset) {
  if (offset < 1) throw new Error("offset must be at least 1");
  const out = [];
  for (let c = 0; c < columns.length; c++) {
    for (let r = 0; r < columns[c].length; r++) {
      if (r === 0) {
        const a = c - offset, b = c - offset - 1;
        if (b < 0) continue;
        out.push(columns[a].length === columns[b].length ? RED : BLUE);
      } else {
        const a = c - offset;
        if (a < 0) continue;
        out.push(columns[a].length === r ? BLUE : RED);
      }
    }
  }
  return out;
}

function allDerivedRoads(columns) {
  return {
    big_eye_boy: derivedRoad(columns, 1),
    small_road: derivedRoad(columns, 2),
    cockroach_road: derivedRoad(columns, 3),
  };
}

/** The bead plate: every coup in order, ties included, filled top-to-bottom. */
function beadPlate(outcomes, rows = 6) {
  const width = Math.max(1, Math.ceil(outcomes.length / rows));
  const grid = Array.from({ length: rows }, () => new Array(width).fill(null));
  for (let i = 0; i < outcomes.length; i++) grid[i % rows][Math.floor(i / rows)] = outcomes[i];
  return grid;
}

/* ═══ integrity.js ═══ */
/* Shuffle-integrity battery, ported from baccarat/backtest/integrity.py.
 *
 * The highest-value question a result-only corpus can answer, and the reason
 * it is worth collecting one by hand. Under honest 8-deck rules there is no
 * exploitable signal -- the ceiling on perfect card knowledge is +0.0008% per
 * coup -- so a pattern system can only work if the shoes at a particular table
 * are not properly randomised. That is a testable claim, and this is the test.
 *
 * The null matters more than the statistics. A real baccarat sequence is not
 * i.i.d.: dealing without replacement induces a small genuine dependence
 * within a shoe, so testing against "independent draws at 50.68%" would flag
 * an honest table. The null used here is the simulator itself -- corpora of
 * the same shape, same rules -- so anything the simulator reproduces is what
 * an honest shoe does, and only a deviation from that is evidence.
 */



/** Lags at which serial correlation is measured. */
const LAGS = [1, 2, 3, 4, 5, 6, 8, 10];
/** History depths for the conditional-frequency test. */
const CONDITION_DEPTHS = [1, 2, 3];

/**
 * Streak bias detectable at 80% power with 80 shoes.
 *
 * Measured against a 200-replicate null over 80 trials per strength: the
 * threshold sits between 2.2% (73.8% power) and 2.4% (85.0%), interpolating
 * to 2.3%. Python and this port were swept independently and agree.
 */
const MEASURED_ANCHOR = [80, 0.023];

/** Smallest streak bias `nShoes` can detect at 80% power. */
function detectableBias(nShoes) {
  if (nShoes <= 0) return Infinity;
  const [n0, b0] = MEASURED_ANCHOR;
  return b0 * Math.sqrt(n0 / nShoes);
}

/**
 * How many whole shoes' worth of coups these are.
 *
 * What the battery can detect is set by the coups it has to look at, and
 * `detectableBias` is anchored on eighty whole shoes. Counted by its shoes, a
 * record caught part-way through claims the power of shoes it does not have:
 * a hundred twenty-coup pieces are twenty-five shoes' worth, and were counted
 * as a hundred. A shoe long enough to be whole counts as one, as in the
 * anchor; a piece counts for the coups it holds.
 */
function wholeShoes(shoes) {
  let worth = 0;
  for (const shoe of shoes) worth += shoe.length >= SHOE_MIN ? 1 : shoe.length / SHOE_MEAN;
  return worth;
}

/** Shoes needed to detect `bias` at 80% power. Inverse of the above. */
function shoesForBias(bias) {
  if (bias <= 0) return -1;
  const [n0, b0] = MEASURED_ANCHOR;
  return Math.ceil(n0 * (b0 / bias) ** 2);
}

/* ------------------------------------------------------------- statistics */

/**
 * Non-tie outcomes as +1 (Banker) / -1 (Player) with their shoe indices.
 * Ties are dropped rather than encoded: they push, carry no directional
 * information, and would blur every order statistic below.
 */
function pbSequence(shoes) {
  const signs = [], idx = [];
  for (let s = 0; s < shoes.length; s++) {
    for (const ch of shoes[s]) {
      if (ch === "T") continue;
      signs.push(ch === "B" ? 1 : -1);
      idx.push(s);
    }
  }
  return { signs, idx };
}

const mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;

/** Lag-`lag` correlation, computed only within shoes. */
function autocorrelation(signs, idx, lag) {
  if (signs.length <= lag) return NaN;
  const a = [], b = [];
  for (let i = 0; i + lag < signs.length; i++) {
    if (idx[i] !== idx[i + lag]) continue;      // pairs straddling a shuffle
    a.push(signs[i]); b.push(signs[i + lag]);
  }
  if (a.length < 2) return NaN;
  const prod = a.map((x, i) => x * b[i]);
  return mean(prod) - mean(a) * mean(b);
}

/** Runs per decided coup: Wald-Wolfowitz, normalised. */
function runCount(signs, idx) {
  if (signs.length < 2) return NaN;
  let changes = 0, within = 0;
  for (let i = 1; i < signs.length; i++) {
    if (idx[i] !== idx[i - 1]) continue;
    within += 1;
    if (signs[i] !== signs[i - 1]) changes += 1;
  }
  return within ? changes / within : NaN;
}

/** Chi-square of P(next) against the 2**depth preceding histories. */
function conditionalChi2(signs, idx, depth) {
  const n = signs.length;
  if (n <= depth + 1) return NaN;

  const nStates = 2 ** depth;
  const table = new Float64Array(nStates * 2);
  let used = 0;

  for (let i = depth; i < n; i++) {
    let ok = true, key = 0;
    for (let k = 1; k <= depth; k++) {
      if (idx[i - k] !== idx[i]) { ok = false; break; }
      key = key * 2 + (signs[i - k] > 0 ? 1 : 0);
    }
    if (!ok) continue;
    table[key * 2 + (signs[i] > 0 ? 1 : 0)] += 1;
    used += 1;
  }
  if (used < 50) return NaN;

  const row = new Float64Array(nStates);
  const col = new Float64Array(2);
  let total = 0;
  for (let s = 0; s < nStates; s++) {
    for (let t = 0; t < 2; t++) {
      const v = table[s * 2 + t];
      row[s] += v; col[t] += v; total += v;
    }
  }
  let chi2 = 0;
  for (let s = 0; s < nStates; s++) {
    for (let t = 0; t < 2; t++) {
      const expected = (row[s] * col[t]) / total;
      if (expected > 0) chi2 += (table[s * 2 + t] - expected) ** 2 / expected;
    }
  }
  return chi2;
}

/**
 * Variance of the per-shoe Banker share, relative to the binomial value.
 * A ratio near 1 is what independent-within-shoe sampling produces; above 1
 * means shoes cluster, which is what a poorly shuffled pack looks like from
 * the outside.
 *
 * Exported because the interface wants this one statistic on every render, to
 * widen its confidence interval honestly. Running the whole battery for it
 * costs a hundred milliseconds a keystroke at two thousand shoes.
 */
function shoeShareDispersion(shoes) {
  const shares = [], weights = [];
  for (const shoe of shoes) {
    let n = 0, b = 0;
    for (const ch of shoe) {
      if (ch === "T") continue;
      n += 1; if (ch === "B") b += 1;
    }
    if (n < 20) continue;
    shares.push(b / n); weights.push(n);
  }
  if (shares.length < 5) return NaN;

  const wTotal = weights.reduce((a, b) => a + b, 0);
  const m = shares.reduce((acc, s, i) => acc + s * weights[i], 0) / wTotal;
  const observed = shares.reduce((acc, s, i) => acc + (s - m) ** 2 * weights[i], 0) / wTotal;
  const expected = (m * (1 - m)) / (wTotal / weights.length);
  return expected > 0 ? observed / expected : NaN;
}

/** Mean longest Big Road column per shoe -- the 'dragon' statistic. */
function maxColumnLength(shoes) {
  const longest = [];
  for (const shoe of shoes) {
    const road = new BigRoad();
    for (const ch of shoe) road.add(ch);
    const lengths = road.columnLengths;
    if (lengths.length) longest.push(Math.max(...lengths));
  }
  return longest.length ? mean(longest) : NaN;
}

/** Every order statistic the battery tests, from result-only data. */
function computeStatistics(shoes) {
  const { signs, idx } = pbSequence(shoes);
  const nCoups = shoes.reduce((a, s) => a + s.length, 0);
  let ties = 0;
  for (const s of shoes) for (const ch of s) if (ch === "T") ties += 1;

  const stats = {
    banker_share: signs.length ? signs.filter((x) => x > 0).length / signs.length : NaN,
    tie_rate: nCoups ? ties / nCoups : NaN,
    runs_per_coup: runCount(signs, idx),
    shoe_share_dispersion: shoeShareDispersion(shoes),
    mean_longest_streak: maxColumnLength(shoes),
    coups_per_shoe: shoes.length ? nCoups / shoes.length : NaN,
  };
  for (const lag of LAGS) stats[`autocorr_lag${lag}`] = autocorrelation(signs, idx, lag);
  for (const d of CONDITION_DEPTHS) stats[`conditional_chi2_d${d}`] = conditionalChi2(signs, idx, d);
  return stats;
}

/* ------------------------------------------------------------------- null */

/**
 * The shape a null must have to be a null for these shoes: for each shoe, how
 * many coups its simulated counterpart is cut to, or null to deal it whole.
 *
 * A collected shoe is often part of one -- the shoe still being dealt, a table
 * joined or left part-way through -- and every statistic here moves with
 * length: a forty-coup shoe has shorter streaks than an eighty-coup one, fewer
 * pairs to measure a correlation over, and forty coups where a whole shoe has
 * eighty. Measured against whole simulated shoes, an honest record full of
 * them read as a deviation: at the default 200 replicates, 2-19% of honest
 * tables of 5 to 40 shoes with only the shoe still being dealt left open, and
 * 17-62% of those watched from part-way through every shoe. A test whose whole
 * job is not to accuse an honest table cannot be wrong that often.
 *
 * So a shoe too short to be whole (under SHOE_MIN, which no honest 8-deck
 * shoe falls below) is matched by the first that-many coups of an honest one,
 * and its shortness stops being evidence of anything. A shoe long enough to be
 * whole is dealt whole, and its length stays evidence: `coups_per_shoe` is how
 * a record running past the cut card, or a different game, shows up. The
 * Python battery's `null_shape` is the same rule; a test holds them together.
 */
function nullShape(shoes) {
  return shoes.map((shoe) => (shoe.length < SHOE_MIN ? shoe.length : null));
}

/**
 * What a null is kept under: the replicates and the shape it was built for.
 * A key on the number of shoes alone hands back a null of another shape as
 * soon as a coup lands in a shoe still open.
 */
function nullKey(shoes, nReplicates) {
  return `${nReplicates}|${nullShape(shoes).map((cap) => cap ?? "").join(",")}`;
}

/**
 * Null distribution of every statistic, from honest simulated shoes.
 *
 * Each replicate is an independent corpus of the tested corpus's shape -- as
 * many shoes, each as long -- so the spread reflects the sample actually being
 * tested rather than an asymptotic approximation. That is what makes the
 * battery valid on 20 hand-entered shoes as well as on 20,000 collected ones,
 * and on a record that caught most of its shoes part-way through. `shape`
 * comes from `nullShape`; a number is that many whole shoes, and draws exactly
 * what it always drew.
 *
 * Yields to the caller every `chunk` replicates so a browser can run this
 * without freezing; `onProgress` receives (done, total).
 */
async function simulatedNull(shape, {
  nReplicates = 200, seed = 20240101, onProgress = null, chunk = 5, shouldStop = null,
} = {}) {
  const cuts = typeof shape === "number" ? new Array(shape).fill(null) : shape;
  const samples = {};
  for (let i = 0; i < nReplicates; i++) {
    const corpus = simulate(cuts.length, (seed + 1000 * i + 1) | 0)
      .map((shoe, j) => (cuts[j] == null ? shoe : shoe.slice(0, cuts[j])));
    const stats = computeStatistics(corpus);
    for (const [k, v] of Object.entries(stats)) (samples[k] ||= []).push(v);
    if ((i + 1) % chunk === 0 || i === nReplicates - 1) {
      if (onProgress) onProgress(i + 1, nReplicates);
      await new Promise((r) => setTimeout(r, 0));
      if (shouldStop && shouldStop()) return null;
    }
  }
  return samples;
}

/* ------------------------------------------------------------ corrections */

/**
 * Holm-Bonferroni (FWER) and Benjamini-Hochberg (FDR) corrections.
 *
 * With seventeen statistics in the battery, an uncorrected 5% threshold is
 * expected to produce roughly one "significant" result from noise alone.
 * Reporting only the uncorrected figure would be the easiest way to
 * manufacture a false finding.
 */
function adjustPvalues(pvalues, alpha = 0.05) {
  const names = Object.keys(pvalues).filter((k) => Number.isFinite(pvalues[k]));
  const out = {};
  if (!names.length) return out;

  const raw = names.map((k) => pvalues[k]);
  const m = raw.length;
  const order = raw.map((_, i) => i).sort((a, b) => raw[a] - raw[b]);

  const holm = new Array(m);
  let running = 0;
  order.forEach((idx, rank) => {
    running = Math.max(running, (m - rank) * raw[idx]);
    holm[idx] = Math.min(running, 1);
  });

  const bh = new Array(m);
  running = 1;
  for (let rank = m - 1; rank >= 0; rank--) {
    const idx = order[rank];
    running = Math.min(running, (m * raw[idx]) / (rank + 1));
    bh[idx] = Math.min(running, 1);
  }

  names.forEach((name, i) => {
    out[name] = {
      p_raw: raw[i], p_holm: holm[i], p_bh: bh[i],
      significant_holm: holm[i] < alpha, significant_bh: bh[i] < alpha,
    };
  });
  return out;
}

/* ----------------------------------------------------------------- report */

function quantile(sorted, q) {
  if (!sorted.length) return NaN;
  const pos = (sorted.length - 1) * q;
  const lo = Math.floor(pos), hi = Math.ceil(pos);
  return lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
}

/**
 * Whether a verdict already on screen still describes what is on screen.
 *
 * A verdict is about one table's corpus at one moment, and the panel that
 * prints it -- the wording, the seventeen findings, the shoes it covered --
 * names neither. So the question has four answers, not two:
 *
 *   "none"     nothing has been measured yet
 *   "running"  a run is in progress and owns the panel; putting the previous
 *              verdict back would answer the question being asked right now
 *   "other"    measured on a different table: not stale, just not about this
 *              one, and it comes back if that table is selected again
 *   "stale"    this table, further along -- still true of the corpus it
 *              covered, so it is kept and labelled rather than thrown away
 *   "current"  this table, unchanged since
 *
 * Staleness is measured against the table's own corpus, not against a counter
 * of everything the page has done. Those are not the same question: looking at
 * another table and coming back changes the second and not the first, and a
 * verdict marked stale on the way back is telling the viewer their table has
 * moved on when it has not.
 */
function verdictStanding(shown, activeTable, coups, running) {
  if (!shown) return "none";
  if (running) return "running";
  if (shown.table !== activeTable) return "other";
  return shown.coups === coups ? "current" : "stale";
}

/**
 * A report from the shared record, in the shape this page renders.
 *
 * The server sends the same findings and the same corrections -- it is the
 * same battery, which is what the port exists to guarantee -- but its verdict
 * arrives as an English sentence, and this page is read in four languages. So
 * the sentence is dropped and the verdict is rebuilt here from the structured
 * fields, by the same rule `integrityReport` uses: a deviation was found; or
 * none was and the sample is large enough for that to mean something; or none
 * was and it is not.
 *
 * One number is deliberately the server's rather than this file's.
 * `detectableBias` here is an analytic estimate anchored to one measurement;
 * the server simulates detection power at the corpus's actual size, which is
 * the better number and the one its own wording is based on. A server that
 * could not reach 80% power against any tested bias sends null for it, and
 * that is a real answer -- "how much more" is unknown, not large -- so it is
 * passed through as null rather than turned into a figure.
 */
function adoptReport(body) {
  const power = body.power || {};
  const corrections = body.corrections || {};
  const findings = (body.findings || []).slice()
    .sort((a, b) => Math.abs(b.z || 0) - Math.abs(a.z || 0));
  const flagged = findings
    .filter((f) => corrections[f.statistic]?.significant_bh)
    .map((f) => f.statistic);

  const gap = typeof power.banker_breakeven_gap === "number"
    ? power.banker_breakeven_gap : BANKER_BREAKEVEN_GAP;
  const bias = typeof power.min_detectable_strength === "number"
    ? power.min_detectable_strength : null;

  return {
    n_games: body.n_games, n_shoes: body.n_shoes, n_replicates: body.n_replicates,
    findings,
    corrections,
