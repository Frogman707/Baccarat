    ctx.setLineDash([5, 4]);
    ctx.lineWidth = 1.5;
    ctx.strokeRect(board.box.x - p, board.box.y - p,
                   board.box.x2 - board.box.x + p * 2, board.box.y2 - board.box.y + p * 2);
    ctx.setLineDash([]);
    ctx.strokeStyle = css.getPropertyValue("--mark-ring").trim() || "#fff";
    ctx.lineWidth = 1.6;
    for (const c of board.cells) {
      ctx.beginPath();
      ctx.arc(c.cx, c.cy, c.r * 1.12, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* ═══ store.js ═══ */
/* Where the collected shoes live.
 *
 * Two backends behind one interface. The artifact `db` capability is the real
 * store: it survives the browser, and the desktop pipeline can read it back
 * out. `localStorage` mirrors it so the page still works when the capability
 * is not granted, and so a reload is instant rather than waiting on a round
 * trip. Writes go to both; reads prefer db and fall back.
 */


const LS_KEY = "baccarat.corpus.v2";
/**
 * The prediction log, kept under a key of its own.
 *
 * Beside the corpus rather than inside it, because the two have different
 * lives: the corpus is what the table produced and syncs to the shared store,
 * while the log is what this build said about it and is local to whoever was
 * watching. Folding them together would also change the shape of a record
 * every older build knows how to read, for no gain.
 */
const LOG_KEY = "baccarat.verify.v1";
const SHOE_COLLECTION = "shoes";
const META_DOC = "meta/state";

/** What a table is called when its stored name was entirely formula prefix. */
const UNNAMED_TABLE = "?";

/** Debounce window for writes. Live entry produces a coup every few seconds;
 *  one write per coup would burn the call budget for nothing. */
const FLUSH_MS = 1800;

/** A storage write that failed for want of room, however the browser says it.
 *  Firefox and old WebKit each have their own name and number for it. */
function safeParse(raw) {
  try { return JSON.parse(raw); } catch { return null; }
}

function isQuota(e) {
  const name = String(e?.name || "");
  return name === "QuotaExceededError" || name === "NS_ERROR_DOM_QUOTA_REACHED"
      || e?.code === 22 || e?.code === 1014;
}

class Store {
  constructor() {
    this.db = null;
    this.status = "local";            // local | syncing | synced | error | full
    this.onStatus = () => {};
    this._pending = new Map();        // shoeId -> record
    this._deletes = new Set();        // shoeIds emptied or undone away
    // What the shared store is believed to hold. A shoe is only worth deleting
    // if it was ever written: without this every new shoe -- which starts
    // empty -- would spend a round trip removing a document that never existed.
    this._remote = new Set();
    this._metaDirty = false;
    this._timer = null;
    this._retried = false;
  }

  /**
   * Adopt a corpus another tab of this browser wrote.
   *
   * Every commit writes the whole state, so two tabs open on the same table
   * overwrite each other: the one holding the older copy in memory saves it
   * over the newer one, and a coup entered in the other tab is gone without a
   * word. The `storage` event fires in every *other* document the moment a
   * write lands, and what it carries is by definition newer than what this
   * tab holds -- so taking it is always right, and it is what stops the next
   * commit here from writing the stale copy back.
   *
   * True of the record. Not of `active`, which travels in the same object and
   * is not a fact about the corpus but a choice this document made; the caller
   * decides what to keep of its own view. This only hands over what arrived.
   */
  watchOtherTabs(adopt, adoptLog = null) {
    if (typeof window === "undefined" || !window.addEventListener) return;
    window.addEventListener("storage", (e) => {
      if (!e.newValue) return;
      if (e.key === LS_KEY) {
        const state = sanitiseState(safeParse(e.newValue));
        if (state) adopt(state);
        return;
      }
      // The prediction log, for exactly the same reason as the corpus -- and it
      // was the half that got left out. Each tab read the log once at startup
      // and wrote its own copy back whole on every prediction, so a second tab
      // erased everything the first had predicted since it opened. Measured:
      // ten predictions on one table in one tab, one prediction on another
      // table in the second, and the stored log held the one. Those are the
      // predictions written before their coups were known, which is the only
      // thing that makes the log worth keeping.
      //
      // Taken whole, like the corpus, rather than merged. A merge would have to
      // know what the other tab deliberately removed -- an undone coup's
      // prediction, a cleared table -- and a union would bring those back.
      // Adopting is right for the same reason it is right above: each tab
      // writes synchronously and adopts before it next writes, so whatever
      // arrives here already holds everything this tab had.
      if (e.key === LOG_KEY && adoptLog) {
        const raw = safeParse(e.newValue);
        if (raw) adoptLog(raw);
      }
    });
  }

  /** Resolve the db capability if this view has it. Never throws. */
  async connect() {
    try {
      if (typeof window === "undefined" || !window.claude?.use) return;
      const db = await window.claude.use("db");
      if (!db) return;
      this.db = db;
      this._setStatus("synced");
    } catch {
      /* absence is normal: keep the local mirror */
    }
  }

  _setStatus(s) {
    if (this.status === s) return;
    this.status = s;
    this.onStatus(s);
  }

  /* ------------------------------------------------------------- reading */

  /* (sanitiseState is defined below the class, beside the shape it enforces.) */

  readLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      return raw ? sanitiseState(JSON.parse(raw)) : null;
    } catch {
      return null;
    }
  }

  /**
   * Load the corpus, preferring the shared store. Returns
   * `{tables, active, isExample}` or null when nothing has been collected.
   */
  async load() {
    const local = this.readLocal();
    if (!this.db) return local;

    try {
      const [snap, meta] = await Promise.all([
        this.db.collection(SHOE_COLLECTION).limit(1000).get(),
        this.db.doc(META_DOC).get(),
      ]);
      const tables = {};
      snap.docs.forEach((d) => {
        this._remote.add(d.id);
        const v = d.data();
        // An empty shoe carries nothing and would just accumulate; earlier
        // versions wrote them, so they are skipped on the way in as well.
        if (!v || typeof v.outcomes !== "string" || !v.outcomes.length) return;
        const t = String(v.table || "live");
        (tables[t] ||= { shoes: [] }).shoes.push({
          id: d.id, o: v.outcomes, closed: !!v.closed, t: Number(v.started) || 0,
        });
      });
      for (const t of Object.values(tables)) t.shoes.sort((a, b) => a.t - b.t || a.id.localeCompare(b.id));

      if (!Object.keys(tables).length) return local;
      const m = meta.exists ? meta.data() : {};
      // Through the same sieve as localStorage. The shared store is durable
      // state written by earlier versions of this page and readable by other
      // views; a document carrying a character that is not an outcome, or a
      // `active` naming a table that is no longer there, is exactly as likely
      // here as in the local mirror -- and a stray character is not harmless,
      // since anything that is neither a tie nor a Banker counts as a Player.
      const state = sanitiseState({ tables, active: m.active, isExample: false });
      if (!state) return local;
      this._setStatus("synced");
      return state;
    } catch {
      this._setStatus("error");
      return local;
    }
  }

  /**
   * The prediction log as it was left, or null when there is none.
   *
   * Returned raw. `sanitiseLog` in `verify.js` is what decides which of it is
   * readable, and it lives there because that is where the shape is defined.
   */
  readLog() {
    try {
      const raw = localStorage.getItem(LOG_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }

  /**
   * Keep the prediction log.
   *
   * Quietly on failure, and deliberately so: a full quota must cost the log
   * rather than the coups, and the header already reports the corpus's own
   * health. Losing a record of what was predicted is a loss; losing what was
   * dealt is the loss this app exists to prevent.
   */
  saveLog(log) {
    try {
      localStorage.setItem(LOG_KEY, JSON.stringify(log));
      return true;
    } catch {
      return false;
    }
  }

  /* ------------------------------------------------------------- writing */

  /** Mirror the whole state locally and queue the changed shoes for the db. */
  save(state, changedShoeIds = []) {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      // Back to normal after a failure: the header is the only place a person
      // can see whether their evening is being kept.
      if (!this.db && this.status !== "local") this._setStatus("local");
    } catch (e) {
      // With no db this was the only copy. A browser that will not keep it --
      // private mode, blocked site data, a full quota -- used to fail in
      // silence, and a collector found out on the reload that lost the lot.
      if (!this.db) this._setStatus(isQuota(e) ? "full" : "error");
    }
    if (!this.db) return;

    for (const id of changedShoeIds) {
      let found = null;
      for (const [table, entry] of Object.entries(state.tables)) {
        const shoe = entry.shoes.find((s) => s.id === id);
        if (shoe) { found = { table, shoe }; break; }
      }
      // A shoe with no coups is not written: it says nothing, and an artifact's
      // database is capped at five thousand documents. But cancelling the write
      // is not enough once one has already gone out. Undo empties a shoe a coup
      // at a time, and each step flushes, so by the last one the store holds
      // the shoe one coup long -- and a reload brought those coups back. The
      // same is true of a shoe undone away entirely, which leaves the state
      // without ever being mentioned again. Both are deletions, so they are
      // sent as deletions.
      if (found && found.shoe.o.length) {
        this._deletes.delete(id);
        this._pending.set(id, {
          table: found.table, outcomes: found.shoe.o,
          closed: found.shoe.closed, started: found.shoe.t,
        });
      } else {
        this._pending.delete(id);
        if (this._remote.has(id)) this._deletes.add(id);
      }
    }
    this._metaDirty = true;
    this._schedule(state);
  }

  _schedule(state) {
    if (this._timer) clearTimeout(this._timer);
    this._timer = setTimeout(() => this._flush(state), FLUSH_MS);
  }

  async _flush(state) {
    if (!this.db) return;
    const writes = [...this._pending.entries()];
    this._pending.clear();
    const removals = [...this._deletes];
    this._deletes.clear();
    const metaDirty = this._metaDirty;
    this._metaDirty = false;
    if (!writes.length && !removals.length && !metaDirty) return;

    this._setStatus("syncing");
    // Deletions go first: a shoe that was emptied and then started again under
    // the same id must not have its removal applied on top of the new write.
    const sentRemovals = [];
    const sentWrites = [];
    try {
      for (const id of removals) {
        await this.db.collection(SHOE_COLLECTION).doc(id).delete();
        sentRemovals.push(id);
      }
      for (const [id, body] of writes) {
        await this.db.collection(SHOE_COLLECTION).doc(id).set(body);
        sentWrites.push(id);
      }
      if (metaDirty) await this.db.doc(META_DOC).set({ active: state.active, updated: Date.now() });
      this._retried = false;
      this._setStatus("synced");
    } catch (e) {
      // The queues were drained before the first call, so whatever had not
      // gone out is now only here. Dropping it is how the bug this delete
      // queue exists for comes back: a removal lost to one failed round trip
      // leaves the document behind, and the next reload restores the coups the
      // person undid. Put back what did not land, skipping anything a later
      // save has already superseded.
      for (const id of removals) {
        if (!sentRemovals.includes(id) && !this._pending.has(id)) this._deletes.add(id);
      }
      for (const [id, body] of writes) {
        if (!sentWrites.includes(id) && !this._pending.has(id) && !this._deletes.has(id)) {
          this._pending.set(id, body);
        }
      }
      this._metaDirty = this._metaDirty || metaDirty;
      // quota_exceeded is not transient: surface it rather than retrying.
      this._setStatus(e?.code === "quota_exceeded" ? "full" : "error");
      // One retry, so a single dropped connection does not need another coup
      // to be entered before the queue moves again.
      if (e?.code !== "quota_exceeded" && !this._retried) {
        this._retried = true;
        this._schedule(state);
      }
    } finally {
      for (const id of sentRemovals) this._remote.delete(id);
      for (const id of sentWrites) this._remote.add(id);
    }
  }

  /** Remove a table's shoes from the shared store. */
  async deleteShoes(ids) {
    if (!this.db) return;
    try {
      for (const id of ids) {
        await this.db.collection(SHOE_COLLECTION).doc(id).delete();
        this._remote.delete(id);
      }
    } catch {
      this._setStatus("error");
    }
  }
}

/**
 * What came out of storage, made into something the views can render.
 *
 * The value here is whatever `JSON.parse` returned: a browser that wrote half
 * a record, an import from an older version, a hand-edited entry, or simply
 * something that is not this shape at all. Handing that to the renderers threw
 * before anything was drawn -- a page with nothing on it, over an array where
 * an object was expected, or a shoe whose outcomes were a number.
 *
 * Anything unusable is dropped rather than repaired: a shoe whose outcomes are
 * not a string carries nothing to keep, and a character that is not one of the
 * three outcomes is not a coup. That last one matters more than it looks --
 * anything that is not a tie and not a Banker counted as a Player, so one
 * stray character moved the estimate.
 *
 * Returns null when there is nothing worth loading and nothing to say -- an
 * empty store, or something that is not a record at all. A record that *is* a
 * record and holds no tables is a different answer: somebody deleted the last
 * one, and that is a decision to carry across a reload rather than an absence
 * to fill with the seeded example.
 */
function sanitiseState(raw) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) return null;

  const tables = {};
  // Ids are the shared store's keys, and one key holds one document -- so two
  // shoes carrying the same id are not a duplicate, they are one shoe about to
  // overwrite the other on the next sync, silently and for good. Nothing the
  // page writes can collide, but a hand-edited mirror or a half-finished sync
  // can, and this is where such a corpus is made safe. The second shoe keeps
  // its coups under an id of its own.
  const seen = new Set();
  // What each stored name is kept under, so `active` can follow a rename.
  const renamed = new Map();
  const source = raw.tables && typeof raw.tables === "object" && !Array.isArray(raw.tables)
    ? raw.tables : {};
  for (const name of Object.keys(source)) {
    // Own keys only: a table called `__proto__` must not reach into anything.
    if (!Object.prototype.hasOwnProperty.call(source, name)) continue;
    if (name === "__proto__" || name === "constructor" || name === "prototype") continue;
    const table = source[name];
    const list = table && Array.isArray(table.shoes) ? table.shoes : [];
    const shoes = [];
    for (const shoe of list) {
      if (!shoe || typeof shoe !== "object") continue;
      const outcomes = typeof shoe.o === "string" ? shoe.o.replace(/[^PBT]/g, "") : "";
      let id = typeof shoe.id === "string" && shoe.id ? shoe.id : newId(seen);
      if (seen.has(id)) id = newId(seen);
      seen.add(id);
      shoes.push({
        id,
        o: outcomes,
        closed: !!shoe.closed,
        // Both ends. The floor was here from the start; the ceiling is the
        // last instant a date can be rendered at, and without it a stored
        // timestamp past that point is a real date to every check that reads
        // one and an exception to the exporter that has to write it. `t` also
        // orders the shoes a sync brings back, so it has to be a number that
        // means something either way.
        t: Number.isFinite(Number(shoe.t))
          ? Math.min(MAX_TIME, Math.max(0, Number(shoe.t))) : 0,
      });
    }
    // Where this table's ledger starts counting. Kept through the sieve like
    // the shoes themselves: a mark that did not survive a reload would put
    // every coup back into a tally the reader had already zeroed.
    //
    // And clamped here, where the corpus comes in, because a mark can arrive
    // past the end of the table it belongs to -- an older version's mirror, a
    // half-finished sync, another tab's copy landing shorter. Past the end it
    // settles nothing, for ever, while coups arrive and the tally sits at zero
    // saying nothing is wrong. Every way a corpus reaches the page comes
    // through here, so this is the one place that covers all of them.
    const coups = shoes.reduce((n, shoe) => n + shoe.o.length, 0);
    const from = Math.min(Math.floor(Number(table && table.from)) || 0, coups);

    // The name goes through the same rule the prompt applies. `cleanTableName`
    // exists because the CSV export is a file people open in a spreadsheet and
    // a leading `= + - @` is how a spreadsheet decides a cell is a formula --
    // but it only ever ran where somebody typed a name, and typing is not the
    // only way one arrives. Storage from an older version, a half-finished
    // sync and the shared db all land here instead, and the shared db is
    // written by everyone looking at the same corpus. Five names in eight went
    // out of the exporter as live formulas before this.
    let key = cleanTableName(name) || UNNAMED_TABLE;
    // Two stored names can clean to one, and keeping only the last would lose
    // a whole table's shoes without saying so.
    if (Object.prototype.hasOwnProperty.call(tables, key)) {
      let n = 2;
      while (Object.prototype.hasOwnProperty.call(tables, `${key} (${n})`)) n += 1;
      key = `${key} (${n})`;
    }
    renamed.set(name, key);
    tables[key] = from > 0 ? { shoes, from } : { shoes };
  }

  const names = Object.keys(tables);
  if (!names.length) {
    // Emptied on purpose, or never filled? The shape says which: a stored
    // record carries a `tables` object even once the last table is gone, and
    // an absent store carries nothing. Without the distinction, deleting every
    // table and reloading brought the demo corpus back, which reads as the
    // deletion not having worked.
    const emptied = raw.tables && typeof raw.tables === "object"
      && !Array.isArray(raw.tables);
    return emptied ? { tables: {}, active: null, isExample: false } : null;
  }
  // Through `renamed`, so a table whose name the rule changed is still the
  // table this corpus was left looking at. Falling back to a direct hit covers
  // an `active` that was already written in its cleaned form while the table
  // beside it was not -- inconsistent, but it names a real table, and landing
  // on a different one would be the very thing this is here to prevent.
  const active = typeof raw.active === "string"
    ? (renamed.get(raw.active)
       ?? (Object.prototype.hasOwnProperty.call(tables, raw.active) ? raw.active : names[0]))
    : names[0];
  return { tables, active, isExample: !!raw.isExample };
}

/** A stand-in id for a shoe that arrived without one, or with one twice. */
function newId(taken) {
  for (let attempt = 0; ; attempt += 1) {
    const id = "S" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    // Four random characters inside one millisecond collide about once in a
    // million, which is rare enough to ignore and cheap enough not to.
    if (!taken || !taken.has(id)) return id;
    if (attempt > 20) return id + attempt;        // never spin
  }
}

/* The install-free console.
 *
 * One loop drives this page: capture the table's screen, paste it, and the
 * bead plate becomes data. Everything else -- the roads, the break-even
 * scale, the integrity battery -- is computed from that data in the browser,
 * with the same code the desktop package runs, so no install is needed and
 * nothing about the operator's site is touched.
 */












// Named, and spelled out: the page is served as one concatenated scope, where
// a namespace import has nothing to be a namespace of.


const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;

};
const pct = (x, d = 1) => (x * 100).toFixed(d) + "%";

/* Sample sizes worth aiming at, from the measured detection power. */
const MILESTONES = [
  { bias: 0.03, key: "ms1" },
  { bias: 0.012, key: "ms2" },
  { bias: BANKER_BREAKEVEN_GAP, key: "ms3" },
].map((m) => ({ ...m, shoes: shoesForBias(m.bias) }));

/** The label and the tooltip for one order statistic, in the current language. */
function statLabel(key) {
  const lag = key.match(/^autocorr_lag(\d+)$/);
  if (lag) return t("stat.autocorr", { lag: lag[1] });
  const d = key.match(/^conditional_chi2_d(\d+)$/);
  if (d) return t("stat.chi2", { d: d[1] });
  return t("stat." + key);
}

function statWhy(key) {
  const lag = key.match(/^autocorr_lag(\d+)$/);
  if (lag) return t("why.autocorr", { lag: lag[1] });
  const d = key.match(/^conditional_chi2_d(\d+)$/);
  if (d) return d[1] === "1" ? t("why.chi2_1") : t("why.chi2_n", { d: d[1] });

/* ------------------------------------------------------------------ state */

const store = new Store();
let state = null;
let shot = null;            // {imageData, width, height, boards, pick, region}
// Nulls by `nullKey` -- the replicates and the shape they were built for. A
// coup landing in a shoe still open is a new shape, so the few most recent are
// kept rather than every one this page has ever built.
let nullCache = new Map();
const NULLS_KEPT = 4;
let integrityRun = null;
let live = null;            // LiveWatcher, created on first use
let lastReport = null;      // kept so a language change can redraw the verdict
let liveHolds = 0;          // consecutive readings shorter than the shoe in progress
let liveCleared = false;    // the strip was last seen empty, so the log says so once

/**
 * What the app has actually recommended, and how it turned out.
 *
 * Loaded once and kept in memory because it is written on every coup and read
 * on every render. `verify.js` owns the shape; this owns when it is written.
 */
let predictionLog = emptyLog();

const newShoeId = () => "S" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function exampleState() {
  const shoes = simulate(4, 20240101).map((o, i) => ({
    id: `EXAMPLE-${i + 1}`, o, closed: i < 3, t: Date.now() - (4 - i) * 3.6e6,
  }));

/**
 * A table that is not there: readable, empty, and never stored.
 *
 * Reading used to create. Every accessor below goes through `tableNamed`, so
 * merely drawing the page with no table selected conjured one -- which is why
 * deleting the last table had to invent "Table 1" on the spot rather than
 * leave the selector empty. Frozen, so a writer that skipped `beforeWriting`
 * fails loudly here instead of dropping coups into an object nothing stores.
 */
const NO_TABLE = Object.freeze({ shoes: Object.freeze([]) });

const tableNamed = (name) => (name
  ? (state.tables[name] || (state.tables[name] = { shoes: [] }))
  : NO_TABLE);
const table = () => tableNamed(state.active);
const shoes = (name = state.active) => tableNamed(name).shoes;

/**
 * The table the live reader was started on, or null when it is not running.
 *

 * which table the page *shows*; it does not change what the camera sees. So
 * every write out of the reader belongs to the table it was started on, not
 * to whichever one is being looked at -- without this, glancing at another
 * table mid-session filed the watched board there as a new shoe, and that
 * table's statistics, integrity verdict and ledger were all computed from a
 * corpus that mixed two tables together.
 */
let liveTable = null;

/** The table the last commit wrote to, so a flash can tell whose coup it was. */
let lastWrite = null;

/** The shoe in progress, opening one if the last is closed. Mutates. */
function currentShoe(name = state.active) {
  const list = shoes(name);
  let last = list[list.length - 1];
  if (!last || last.closed) {
    last = { id: newShoeId(), o: "", closed: false, t: Date.now() };
    list.push(last);
  }
  return last;
}

/**
 * The coup this table's ledger starts counting from.
 *
 * A ledger is the record of a wager somebody could have placed. Attaching one
 * to everything a table ever did says something different -- nobody was there
 * for the rest of it -- and switching tables then swaps in a stranger's
 * accumulated figure as though it were yours. So the tally runs from a mark,
 * and every coup before it is what the pick is made of rather than something
 * the pick is judged on.
 *
 * Zero for a table that has never been marked, which is a table whose whole
 * record was collected while somebody was watching it. That is the honest
 * default and the common one.
 */
function ledgerFrom(name = state.active) {
  const entry = state.tables[name];
  const from = entry && Number(entry.from);
  return Number.isFinite(from) && from > 0 ? Math.floor(from) : 0;
}

/**
 * Bring any mark its table has shrunk under back to the end of that table.
 *
 * A table can shrink under its own mark -- a coup taken back, a shoe dropped,
 * another tab's copy landing shorter -- and a mark past the end settles
 * nothing, for ever, while coups arrive and the tally sits at zero saying
 * nothing is wrong. The mark means "start counting from here", so where the
 * table no longer reaches it, here is the end of the table.
 *
 * Run where the corpus changes, which covers every way a table shrinks inside
 * this page. A corpus arriving already wrong is straightened by the sieve it
 * comes through instead, in `sanitiseState`, so neither case depends on the
 * other having run.
 */
function clampMarks() {
  for (const [name, entry] of Object.entries(state.tables)) {
    const from = entry && Number(entry.from);
    if (!Number.isFinite(from) || from <= 0) continue;
    const coups = tableCoups(name);
    if (from <= coups) continue;
    if (coups > 0) entry.from = coups;
    else delete entry.from;          // an emptied table counts from its first coup
  }

/** Total coups a table holds, which is where a fresh tally starts from. */
function tableCoups(name = state.active) {
  return shoes(name).reduce((n, s) => n + s.o.length, 0);
}

/** The same shoe for reading only -- render paths must not open one. */
function openShoe(name = state.active) {
  const list = shoes(name);
  const last = list[list.length - 1];
  return !last || last.closed ? { id: null, o: "", closed: false, t: 0 } : last;
}

/* ------------------------------------------------------------ the room --
 *
 * Several people at one table, recording into one record. Everything about how
 * a room is shaped lives in `room.js`; this is the join, what to do with coups
 * that arrive, and what to say about it in the header.
 *
 * The rule the whole block is written around: **the reader in front of the
 * table is never interrupted.** A room that is unreachable, refused, or simply
 * not asked for leaves the page exactly as it was before any of this existed
 * -- which is how it has to be, because the page works at a table with no
 * network and that must keep being true.
 */

let room = null;
/** The shoe the room is on, and which shoe here corresponds to it. */
let roomShoe = "";
let roomLocalShoe = "";

/** Coups owed to the room, across reloads. */
const ROOM_QUEUE_KEY = "baccarat.room.queue.v1";
/**
 * The room this device is in, remembered across visits.
 *
 * Without this there were two addresses that behaved differently -- the one
 * carrying `?room=` synced and the bare one did not -- and which one you had
 * was an accident of how you last opened the page. A room is something you are
 * in, not something a link does, so it is remembered and the address is only
 * how you first get there.
 *
 * Deliberately unchanged: a reader who has *never* joined a room loads no
 * Firebase, signs nobody in, and sees no badge. That was the point of the
 * original design and it still holds for everybody who has not opted in.
 */
const ROOM_KEY = "baccarat.room.v1";

function rememberedRoom() {
  try { return cleanRoomId(localStorage.getItem(ROOM_KEY) || ""); }
  catch { return ""; }
}

function rememberRoom(id) {
  try {
    if (id) localStorage.setItem(ROOM_KEY, id);
    else localStorage.removeItem(ROOM_KEY);
  } catch { /* storage is a courtesy; the session still works without it */ }
}
let roomQueue = null;
let roomSending = false;
let roomRetry = null;
/** Why the last run stopped, which is how "offline" is told from "idle". */
let roomLastWhy = null;
/** Disagreements already written to the room, so a listener does not resend. */
const roomReported = new Set();
/** What the room's last snapshot showed it holding, as an outcomes string. */
let roomHave = "";
/** Resolved by the first snapshot, so the catch-up push can wait for it. */
let roomFirstSnapshot = null;

function roomStorage() {
  return {
    read: () => {
      try { return JSON.parse(localStorage.getItem(ROOM_QUEUE_KEY) || "[]"); }
      catch { return []; }
    },
    write: (items) => {
      try { localStorage.setItem(ROOM_QUEUE_KEY, JSON.stringify(items)); }
      catch { /* a full disk must not stop the table being recorded */ }
    },
  };
}

/** What the header should say, from the four facts that decide it. */
function roomStateNow() {
  return syncState({
    joined: !!room && room.status === "joined",
    // Two different ways to be offline, and both count: the browser saying so,
    // and a write that came back saying so while the browser still believed it
    // was connected. The second is the common one on a casino floor.
    online: (typeof navigator === "undefined" || navigator.onLine !== false)
            && roomLastWhy !== "offline",
    queued: roomQueue ? roomQueue.length : 0,
    sending: roomSending,
  });
}

/** A local shoe id in the form a Firestore document id can take. */
function roomShoeIdFor(localId) {
  const clean = String(localId || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 32);
  return clean ? `s-${clean}` : "";
}

/** Disagreements the room holds, this device's own and everybody else's. */
let roomConflictRows = [];

function renderRoomConflicts() {
  const box = $("roomConflicts");
  if (!box) return;
  box.hidden = !room || !roomConflictRows.length;
  box.innerHTML = "";
  if (box.hidden) return;

  // Two different things end up here and they need different words. A coup
  // two people read differently is a question only somebody at the table can
  // answer. Copies that are out of step is one reader having dropped or
  // doubled a coup, which is not a question about the board at all.
  const drifts = roomConflictRows.filter((r) => r.drift);
  const differ = roomConflictRows.filter((r) => !r.drift);

  const head = el("p", "aiverdict");
  head.textContent = differ.length
    ? t("room.conflicts", { n: differ.length })
    : t("room.driftsOnly", { n: drifts.length });
  box.appendChild(head);

  for (const row of drifts.slice(0, 4)) {
    const line = el("p", "ainote");
    line.textContent = t("room.driftRow", { n: row.handNumber });
    box.appendChild(line);
  }
  // Shown, never settled for you. Which reading is right is not a question the
  // record can answer, and a room that quietly picked one would be deciding it
  // by whoever happened to write second.
  for (const row of differ.slice(0, 8)) {
    const line = el("p", "ainote");
    line.textContent = t("room.conflictRow", {
      n: row.handNumber, mine: row.mine, theirs: row.theirs });
    box.appendChild(line);
  }
  const how = el("p", "ainote");
  how.textContent = drifts.length && !differ.length
    ? t("room.driftHow") : t("room.conflictHow");
  box.appendChild(how);

  // corrected. Without it the collection only ever grew: every one of these
  // was written `resolved: false` and nothing in the app could write
  // `resolved: true`, so a room read over a few sessions carried a banner
  // that could not be cleared.
  const settle = el("button", "btn ghost");
  settle.id = "roomSettle";
  settle.textContent = t("room.settle", { n: roomConflictRows.length });
  settle.onclick = async () => {
    if (!room || !confirm(t("room.settleConfirm", { n: roomConflictRows.length }))) return;
    settle.disabled = true;
    const ids = roomConflictRows.map((r) => r.id).filter(Boolean);
    const done = await room.settleConflicts(ids);
    settle.disabled = false;
    flashNote(t(done === ids.length ? "room.settled" : "room.settledSome",
                { n: done, all: ids.length }));
  };

  actions.appendChild(settle);
  box.appendChild(actions);
}

function renderRoom() {
  const box = $("roomBox");
  if (!box) return;
  box.hidden = !room;
  const joined = !!room && room.status === "joined";
  for (const id of ["roomInvite", "roomLeave"]) {
    if ($(id)) $(id).hidden = !joined;
  }
  if (!room) return;
  if (room.status !== "joined") {
    $("roomDot").className = "sdot " + (room.status === "error" ? "error" : "syncing");
    $("roomLabel").textContent = t("room." + room.status);
    return;
  }
  // Joined, and then the four states the connection can actually be in. A
  // badge that said only "in the room" while twenty coups sat unsent would be
  // telling somebody their table is recorded when it is not.
  const s = roomStateNow();
  $("roomDot").className = "sdot " + ({
    online: "synced", syncing: "syncing", reconnecting: "syncing", offline: "error",

/**
 * Put the room and this device on the same shoe, and follow it.
 *
 * Two devices have different local ids for one physical shoe, so the room

 * failure: each device writes into a shoe of its own and each sees a record
 * that appears complete, while the room holds two halves of one table.
 */
async function useRoomShoe(id, localId) {
  if (!room || !id || id === roomShoe) return;
  roomShoe = id;

  roomHave = "";

}

/**
 * Take what the room holds and fold it into the shoe on screen.
 *
 * `mergeOutcomes` reports disagreements rather than settling them, because no
 * rule about which copy wins can tell you which reader misread the board. The
 * room's copy is adopted for the coups it has -- it is what everybody else is
 * already looking at -- and anything this device holds beyond its end is kept,
 * because that is simply not written yet rather than contradicted.
 */
function adoptFromRoom(seen) {
  // Before anything else, and before any early return below: whoever is
  // waiting to hear what the room holds has now heard it.
  if (roomFirstSnapshot) {
    const resolve = roomFirstSnapshot;
    roomFirstSnapshot = null;
    resolve();
  }
  roomHave = seen.outcomes;
  if (state.isExample) { renderRoom(); return; }
  // A device arriving at a table already in progress has no shoe open, and
  // that is exactly when the room's coups matter most -- so a shoe is started
  // to receive them. Only when there is something to receive: an empty room
  // must not leave an empty shoe behind on every join.
  if (!seen.outcomes && !openShoe().id) { renderRoom(); return; }
  const shoe = currentShoe();
  const { outcomes } = mergeOutcomes(shoe.o, seen.outcomes);
  // Which of the two it is, before writing anything down. A reader that
  // dropped one coup has every position after it compared against its
  // neighbour, and reporting that coup by coup files one mistake dozens of
  // times -- forty-four of them, measured, for one missing coup in an
  // eighty-coup shoe. One thing is wrong there, and it is the alignment.
  const lined = alignment(shoe.o, seen.outcomes);
  const conflicts = lined.conflicts;
  roomLocalShoe = shoe.id;
  // Write the disagreement down where the room can see it. Here rather than in
  // the queue, because this is the one place that holds both readings -- the
  // queue only learns that a write was refused, not what the other reader saw.
  // Nothing settles it: no rule about which copy wins can say who misread the
  // board.
  if (lined.kind === "drift") {
    const key = `${roomShoe}-drift-${lined.from}`;
    if (!roomReported.has(key)) {
      roomReported.add(key);
      room.reportDrift(roomShoe, lined.from, lined.side).catch(() => {});
    }
  }
  for (const c of conflicts) {
    const key = `${roomShoe}-${c.handNumber}`;
    if (roomReported.has(key)) continue;
    roomReported.add(key);
    room.reportConflict(roomShoe, c.handNumber, c.mine, c.theirs).catch(() => {});
  }
  if (outcomes === shoe.o) { renderRoom(); return; }
  shoe.o = outcomes;
  clampMarks();
  invalidate();
  store.save(state, [shoe.id]);
  settleLog();
  render();
  renderRoom();
  if (lined.kind === "drift") {
    flashNote(t("room.drift", { n: lined.from }));
  } else if (conflicts.length) {
    const c = conflicts[0];
    flashNote(t("room.conflict", { n: c.handNumber, mine: c.mine, theirs: c.theirs }));
  } else if (seen.held) {
    flashNote(t("room.held", { n: seen.held, miss: seen.missing }));
  }
}

/** Send coups this device recorded to the room. Never blocks the page. */
async function pushToRoom(shoe) {
  if (!room || room.status !== "joined" || !shoe?.id || state.isExample) return;
  // A shoe started here after the room was already on another one takes the
  // room with it -- a new shoe at the table is a new shoe for everybody.
  const id = roomShoeIdFor(shoe.id);
  if (!id) return;
  // A different shoe than the room was last told about: what this device
  // believes the room holds was about the other one.
  if (roomLocalShoe !== shoe.id) roomHave = "";

  // Queue first, and always. Telling the room which shoe this is comes after,
  // because that is a pair of writes and writes fail -- and a coup that never
  // got queued because an announcement failed is a coup lost for exactly the
  // reason the queue exists.
  //
  // Only what the room has not got. Re-offering coups it already holds would
  // be harmless -- they come back as duplicates -- but it would fill the queue
  // with work that is already done, and on a connection that is down it would
  // put a whole shoe in front of the coup that was just dealt. Anything that
  // failed is still in the queue and stays there; `add` will not take a coup
  // twice.
  const wasFull = roomQueue.full;
  for (let i = roomHave.length; i < shoe.o.length && i < 200; i += 1) {
    roomQueue.add(id, i + 1, shoe.o[i]);
  }
  if (roomQueue.full && !wasFull) flashNote(t("room.full"));

  if (!roomShoe || roomLocalShoe !== shoe.id) await useRoomShoe(id, shoe.id);
  await drainRoom();
}

/**
 * Send what is owed, oldest first, and stop at the first one that will not go.
 *
 * Never more than one run at a time: two draining at once would take the same
 * coup off the front twice and send it twice, and the second send would come
 * back as a duplicate of itself.
 */
async function drainRoom() {
  if (!room || roomSending || room.status !== "joined") return;
  if (!roomQueue || !roomQueue.length) { renderRoom(); return; }
  roomSending = true;
  renderRoom();
  try {
    const out = await roomQueue.drain((s, n, c) => room.recordCoup(s, n, c));
    roomLastWhy = out.why;
  } catch {
    roomLastWhy = "failed";
  } finally {
    roomSending = false;
    renderRoom();
    scheduleRoomRetry();
  }
}

/** Come back to it. A casino floor drops a connection and gets it back. */
function scheduleRoomRetry(ms = 15000) {
  if (roomRetry || !roomQueue || !roomQueue.length) return;
  roomRetry = setTimeout(() => {
    roomRetry = null;
    drainRoom().catch(() => {});
  }, ms);
}

/**
 * Join the room named in the address, if one is.
 *
 * No room in the URL means no Firebase: nothing is loaded, nothing is signed
 * in, and the page is the page it has always been. `window.__roomConnect` is
 * the seam the browser checks use to stand in for the real service -- named so
 * it reads as what it is rather than as something to rely on.
 */
async function joinRoomFromUrl() {
  // The address first, then what this device remembers. A link always wins:
  // being handed one is how you join a room that is not the one you were in.
  const fromUrl = roomIdFromUrl(typeof location === "undefined" ? "" : location.search);
  const id = fromUrl || rememberedRoom();
  if (!id) return;
  rememberRoom(id);
  // And put it in the address, so from here the two are one address and
  // copying what is in the bar hands somebody the room.
  if (!fromUrl && typeof history !== "undefined" && history.replaceState) {
    try { history.replaceState(null, "", roomUrl(location.href, id)); }
    catch { /* a file:// page has no history to rewrite */ }
  }
  const connect = (typeof window !== "undefined" && window.__roomConnect)
    || (() => connectFirebase());
  room = new RoomSync({ connect });
  roomQueue = new CoupQueue(roomStorage());
  room.onStatus = () => renderRoom();
  if (typeof window !== "undefined" && window.addEventListener) {
    // The browser noticing before a write does saves a round trip and a wait.
    window.addEventListener("online", () => {
      roomLastWhy = null;
      renderRoom();
      drainRoom().catch(() => {});
    });
    window.addEventListener("offline", renderRoom);
  }
  renderRoom();
  if (!await room.join(id)) { renderRoom(); return; }

  // Follow the shoe the room is on. Only propose one of our own when the room
  // has none, so two devices joining at once do not split the table.
  // Everybody's disagreements, not only the ones this device noticed. A
  // conflict is detected only by the device holding the other result, so
  // without this the reader who joined afterwards -- who adopted the room's
  // copy and saw nothing wrong -- never learns of it.
  room.watchConflicts((rows) => {
    roomConflictRows = rows;
    renderRoomConflicts();
  });

  if (room.shoeId) {
    await useRoomShoe(room.shoeId, "");
  } else {
    const local = openShoe();
    if (local.id) await useRoomShoe(roomShoeIdFor(local.id), local.id);
  }
  renderRoom();

  // Let the room say what it holds before offering it anything.
  //
  // `onSnapshot` answers asynchronously, so without this the catch-up push
  // runs while this device still believes the room is empty -- and offers
  // every coup it has. Each one is correctly refused as a duplicate, and each
  // refusal is a round trip. A second device joining a shoe in progress spent
  // one per coup already recorded, every join, to establish what a single
  // snapshot says.
  //
  // Bounded, because a room that never answers must not hold the coups
  // hostage: after this the push happens anyway and the queue keeps them.
  await new Promise((resolve) => {
    roomFirstSnapshot = resolve;
    setTimeout(() => {
      if (roomFirstSnapshot === resolve) { roomFirstSnapshot = null; resolve(); }
    }, 2500);
  });

  await pushToRoom(openShoe());
  // Coups owed from a previous visit, which is the whole point of keeping them.
  await drainRoom();
}

/* ---------------------------------------------------------- the server AI --
 *
 * A second opinion, shown above this device's own and never in place of it.
 *
 * The rule, from `docs/CURRENT_ARCHITECTURE.md` §9 and worth repeating where
 * the code is: the recommendation below this panel is computed in the browser
 * and must keep working when the API is unreachable, because that is how the
 * page is used at a table. Nothing here may touch it.
 *
 * And what the server sends back is more than numbers. `/api/v1/predict`
 * reports which model actually answered, whether it is analytic, fitted or
 * unfitted, and -- where it has been measured not to -- that it is not reading
 * your table at all. Showing a probability without those would be this page
 * claiming an analysis the server explicitly says it did not perform, which is
 * the one thing the whole surface was built to avoid.
 */

let srvAsking = false;
/** The last answer, and the last failure, so a re-render does not lose them. */
let srvAnswer = null;
let srvError = null;

function renderServerAI(answer = srvAnswer, error = srvError) {
  const box = $("srvBox");
  const body = $("srvBody");
  if (!box || !body) return;
  box.hidden = !readServer();
  body.innerHTML = "";

  const line = (text, cls) => {
    const el2 = el("p", cls || "ainote");
    el2.textContent = text;
    body.appendChild(el2);
    return el2;
  };

  if (srvAsking) { line(t("srv.asking")); return; }
  if (error) {
    // The failure is said plainly, and then the reader is told the thing that
    // actually matters: nothing below it changed.
    line(t("srv.failed", { why: error }), "aiverdict");
    line(t("srv.beside"));
    return;
  }
  if (!answer) return;

  const rec = answer.recommendation || {};
  const kind = t("srv.kind." + (answer.model_kind || "analytic"));
  line(`${t("srv.model")}: ${answer.model_version || "?"} (${kind})`);
  // A probability the server did not send renders as a dash, never as NaN%.
  // The shared `pct` multiplies whatever it is given, and a panel whose job is
  // honest display must not be the place that prints arithmetic on undefined.
  const share = (v) => (typeof v === "number" && Number.isFinite(v) ? pct(v) : "—");
  line(`${t("side.B")} ${share(rec.banker_probability)} · `
     + `${t("side.P")} ${share(rec.player_probability)} · `
     + `${t("side.T")} ${share(rec.tie_probability)}`);

  // The server's own warnings, rendered because they are true, not because
  // there was room. A panel that dropped these would be the overclaim.
  if (answer.does_not_depend_on_your_coups) line(t("srv.flat"), "aiverdict");
  if (answer.substituted_model) line(t("srv.substituted"), "aiverdict");
  if (answer.not_a_prediction) line(String(answer.not_a_prediction), "aiverdict");
  line(t("srv.beside"));
}

/** Ask, once, on request. Never on a timer and never during entry. */
async function askServerAI() {
  const base = readServer();
  if (!base) { srvAnswer = null; srvError = t("srv.needAddress"); renderServerAI(); return; }
  if (srvAsking) return;
  const shoe = openShoe();
  srvAsking = true;
  renderServerAI();
  try {
    srvAnswer = await askPrediction(base, shoe.o || "",
                                    { table: state.active || null });
    srvError = null;
  } catch (e) {
    srvAnswer = null;
    srvError = String((e && e.kind) || (e && e.message) || e);
  } finally {
    srvAsking = false;
    renderServerAI();
  }
}

function commit(changedIds, writtenTable = state.active) {
  clampMarks();
  lastWrite = writtenTable;
  invalidate();
  store.save(state, changedIds);
  // Before the render, so the panel that reports the record is drawn from a
  // log that already knows about the coup just committed.
  settleLog();
  settleShared(writtenTable);
  // Fire and forget: a room that is slow, refused or gone must not hold up the
  // render in front of somebody waiting to enter the next coup.
  //
  // `openShoe`, never `currentShoe`: the latter *creates* a shoe when none is
  // open, and calling it from here resurrected a table that had just been
  // deleted -- a commit is the last thing that runs on the way out, and it
  // must not bring anything back. Nothing is computed at all without a room,
  // so a page that never joined one follows exactly the path it always did.
  if (room) pushToRoom(openShoe(writtenTable)).catch(() => {});
  render();
}

/* ---------------------------------------------------------------- editing */

function addOutcomes(seq) {
  if (!seq) return;
  beforeWriting();
  const shoe = currentShoe();
  shoe.o += seq;
  commit([shoe.id]);
}

function undo() {
  beforeWriting();
  const list = shoes();
  for (let i = list.length - 1; i >= 0; i--) {
    if (list[i].o.length) {
      list[i].o = list[i].o.slice(0, -1);
      list[i].closed = false;
      commit([list[i].id]);
      return;
    }
    if (i > 0) list.pop();          // drop an empty trailing shoe and try again
  }
  render();
}

function newShoe() {
  beforeWriting();
  const shoe = currentShoe();
  if (!shoe.o.length) return;       // already on a fresh one
  shoe.closed = true;
  const fresh = { id: newShoeId(), o: "", closed: false, t: Date.now() };
  shoes().push(fresh);
  commit([shoe.id, fresh.id]);
}

/**
 * Replace the shoe in progress with what a screenshot says it contains.
 *
 * `boundTo` is the table the live reader was started on, or null for "the one
 * being looked at". It is resolved *after* `beforeWriting`, never as a default
 * argument: a default is evaluated before the body runs, so it would capture
 * the example table that `beforeWriting` is about to remove -- and writing to a
 * name that is gone recreates it, filing the coups into a table nothing shows.
 */
function replaceCurrentShoe(seq, boundTo = null) {
  beforeWriting();
  const name = readingTable(boundTo, state.tables, state.active);
  const shoe = currentShoe(name);
  shoe.o = seq;
  commit([shoe.id], name);
}

function loadAsNewShoe(seq, boundTo = null) {
  beforeWriting();
  const name = readingTable(boundTo, state.tables, state.active);
  const list = shoes(name);
  const last = list[list.length - 1];
  const changed = [];
  if (last && !last.o.length) list.pop();
  else if (last && !last.closed) { last.closed = true; changed.push(last.id); }
  const fresh = { id: newShoeId(), o: seq, closed: false, t: Date.now() };
  list.push(fresh);
  changed.push(fresh.id);
  commit(changed, name);
}

/**
 * Make the state ready to be written into, and return the table to write to.
 *
 * Two things have to be true before a coup can be stored, and every writer
 * needs both, so they are settled in one place.
 *
 * The seeded example exists so the page opens showing what it does; the first
 * real entry replaces it rather than mixing with it. And there has to be a
 * table at all -- deleting the last one now leaves none, because a selector
 * showing a table nobody asked for is worse than a selector showing nothing.
 * Whatever writes first is what brings one into being, which is what "press
 * start and it begins a new one" means.
 */
function beforeWriting() {
  if (state.isExample) {
    state = { tables: {}, active: null, isExample: false };
  }
  if (!state.active || !state.tables[state.active]) state.active = freshTableName();
  state.tables[state.active] ||= { shoes: [] };
  return state.active;
}

/** The next unused default table name: "Table 1", then "Table 2", and so on. */
function freshTableName() {
  for (let n = 1; ; n += 1) {
    const name = `Table ${n}`;
    if (!state.tables[name]) return name;
  }
}

/* ------------------------------------------------------------ screenshots */

async function handleImage(source) {
  const canvas = document.createElement("canvas");
  const work = toWorkingImage(source, canvas);
  const { boards, bounds } = detectBoards(work.imageData);
  shot = { ...work, canvas, boards, bounds, pick: 0, region: null };
  renderShot();
}

function rerunDetection(region) {
  if (!shot) return;
  const { boards, bounds } = detectBoards(shot.imageData, { region });
  shot.boards = boards;
  shot.bounds = bounds;
  shot.pick = 0;
  shot.region = region;
  renderShot();
}

/**
 * Throw away a capture that has been read but not applied.
 *
 * A reading sits on screen with its Apply buttons live and a line saying how
 * it lines up with the shoe in progress -- both worked out against the table
 * it was read on. Left there across a table change, the buttons would file one
 * table's board into another, and the line would be describing a shoe that is
 * no longer on screen. The image is gone from nowhere but the page: pasting it
 * again takes a moment, and applying it to the wrong table does not.
 */
function discardPendingReadings() {
  shot = null;
  renderShot();
  if (batchShoes) {
    batchShoes = null;
    batchRun += 1;                 // an import still decoding stands down
    $("batch").hidden = true;
  }
}

function renderShot() {
  const wrap = $("shotWrap"), idle = $("dropIdle");
  if (!shot) { wrap.hidden = true; idle.hidden = false; $("readout").hidden = true; return; }
  idle.hidden = true; wrap.hidden = false; $("readout").hidden = false;

  const view = $("shotCanvas");
  view.width = shot.width; view.height = shot.height;
  const ctx = view.getContext("2d");
  ctx.drawImage(shot.canvas, 0, 0);

  const board = shot.boards[shot.pick];
  if (board) {
    // Light the whole strip of results, outline the board being counted.
    // `shot.bounds` is the strip; the union of every board found is not, and
    // drew the lit box up over the video panel and the clock on the felt --
    // which is exactly what the detector strips out before reporting bounds.
    drawStrip(ctx, shot.canvas, shot.bounds || board.box, board);
  }

  const readout = $("readout");
  readout.innerHTML = "";
  if (!board) {
    readout.appendChild(el("p", "warn", t("paste.notFound")));
    return;
  }

  const seq = board.sequence;
  // The same comparison the live feed uses: a reading that shares a prefix
  // with the shoe in progress is that shoe seen later, not a new one.
  const mode = diagnose(openShoe().o, seq) === "reset" ? "new" : "same";
  const head = el("div", "readhead");
  head.appendChild(el("span", "chip " + (board.kind === "bead" ? "ok" : "warn"),
    t(board.kind === "bead" ? "paste.kindBead" : "paste.kindBigRoad")));
  head.appendChild(el("span", "readnum",
    t("paste.readMeta", { n: seq.length, rows: board.nRows, cols: board.nCols })));
  const counts = { P: 0, B: 0, T: 0 };
  for (const c of seq) counts[c]++;
  const tally = el("span", "tally");
  for (const k of ["P", "B", "T"]) {
    tally.appendChild(el("i", "dot " + k));
    tally.appendChild(el("span", "n", String(counts[k])));
  }
  head.appendChild(tally);
  readout.appendChild(head);

  const strip = el("div", "seqstrip");
  for (const c of seq) strip.appendChild(el("i", "sq " + c, mark(c)));
  readout.appendChild(strip);

  if (board.kind !== "bead") {
    readout.appendChild(el("p", "warn", t("paste.bigRoadWarn")));
  }

  const actions = el("div", "actions");
  const primary = el("button", "btn primary",
    t(mode === "same" ? "paste.applyCurrent" : "paste.applyNew"));
  primary.onclick = () => {
    if (mode === "same") replaceCurrentShoe(seq); else loadAsNewShoe(seq);
    shot = null; renderShot();
  };
  actions.appendChild(primary);

  const other = el("button", "btn",
    t(mode === "same" ? "paste.applyNew" : "paste.applyCurrent"));
  other.onclick = () => {
    if (mode === "same") loadAsNewShoe(seq); else replaceCurrentShoe(seq);
    shot = null; renderShot();
  };
  actions.appendChild(other);

  if (shot.boards.length > 1) {
    const swap = el("button", "btn ghost", t("paste.otherRegion", { i: shot.pick + 1, n: shot.boards.length }));
    swap.onclick = () => { shot.pick = (shot.pick + 1) % shot.boards.length; renderShot(); };
    actions.appendChild(swap);
  }
  if (shot.region) {
    const reset = el("button", "btn ghost", t("paste.resetRegion"));
    reset.onclick = () => rerunDetection(null);
    actions.appendChild(reset);
  }
  const drop = el("button", "btn ghost", t("paste.cancel"));
  drop.onclick = () => { shot = null; renderShot(); };
  actions.appendChild(drop);
  readout.appendChild(actions);

  readout.appendChild(el("p", "hint", t(mode === "same" ? "paste.sameHint" : "paste.newHint")));
}

/* ------------------------------------------------------------ live read */

/* Reading the screen continuously means committing without a human confirming
   each change, so the rules for what a reading is allowed to do are strict:
   growth is applied once frames agree, a board reset needs more agreement
   because it discards the shoe in progress, and a reading shorter than the
   shoe in progress is never applied silently -- that is what a cropped or
   scrolled bead plate looks like, and it would truncate real data. */

function liveLog(text, kind) {
  const box = $("liveLog");
  const row = el("div");
  const now = new Date();
  const stamp = el("time", null,
    `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}:${String(now.getSeconds()).padStart(2, "0")}`);
  row.appendChild(stamp);
  row.appendChild(el("b", kind || null, text));
  box.prepend(row);
  while (box.children.length > 40) box.lastChild.remove();
}

function onLiveRead(seq, board, repeats, { afterClear = false } = {}) {
  // Whatever the selector says now, this reading came off the table the
  // reader was started on. The binding itself is handed to the writers, which
  // resolve it after the example has been cleared out of the way.
  const into = liveTable;
  const current = openShoe(readingTable(into, state.tables, state.active)).o;
  const verdict = diagnose(current, seq);
  // Reading the big road is not a failure -- it is the same coups -- but it
  // loses ties and folds long runs, so it must never pass unremarked.
  const road = board.kind === "bead" ? null : t("live.bigRoadWarn");

  // The strip was watched going empty, so a reading that is not the same board
  // carrying on is the next shoe. Saying so here is what lets a new shoe that
  // opens on the same two or three marks as the last one through: without it
  // the reading shares a prefix, reads as a truncated board, and stalls behind
  // the warning meant for a bead plate that has been cropped or scrolled.
  const restart = afterClear && (verdict === "hold" || verdict === "reset");

  if (verdict === "same") { liveHolds = 0; setLiveWarn(road); return; }

  if (verdict === "hold" && !restart) {
    liveHolds += 1;
    if (liveHolds >= 4) {
      setLiveWarn(
        t("live.shortWarn", { read: seq.length, cur: current.length }),
        {
          label: t("live.shortSwap", { n: seq.length }),
          run: () => {
            replaceCurrentShoe(seq, into);
            liveHolds = 0;
            setLiveWarn(null);
            liveLog(t("live.logManual", { n: seq.length }));
          },
        });
    }
    return;
  }

  liveHolds = 0;
  setLiveWarn(road);

  // A reset costs the shoe in progress, so it normally has to be seen three
  // times running. Where the strip was watched going empty that agreement has
  // already been paid for -- the emptiness is the confirmation -- so the new
  // shoe registers on the same evidence as any other change.
  const enough = restart ? CONFIRM_GROWTH : CONFIRM_RESET;

  if (verdict === "grow" && repeats >= CONFIRM_GROWTH) {
    const added = seq.length - current.length;
    replaceCurrentShoe(seq, into);
    liveLog(t("live.logGrow", {
      n: added, total: seq.length,
      sides: [...seq.slice(current.length)].map(side).join(" "),
    }));
  } else if ((restart || verdict === "reset") && repeats >= enough) {
    // A new shoe starts at one coup. A reading that shares nothing with the
    // shoe in progress and arrives already dozens deep, on a strip nobody
    // watched go empty, is a different board rather than a new shoe -- the big
    // road beside the bead plate, or the table next door.
    //
    // This was silent, and it is what fills a record with fragments: one real
    // session logged "new shoe -- 45 read" and then "new shoe -- 36 read" a
    // minute apart, on a table whose own counter said 37, and left 31 shoes
    // averaging 18 coups where a real 8-deck shoe runs 80.
    //
    // Not refused, though. Pointing the shared window at another table really
    // does produce a deep reading with nothing in common, and that is a thing
    // people do. So it is offered instead of taken.
    // Never against the seeded example. It is there so the page opens showing
    // what it does, not because anyone collected it, and the first real
    // reading replaces it rather than being compared with it -- which on a
    // first visit is every reading, and would put this warning in front of
    // someone who has done nothing wrong.
    if (!restart && !state.isExample && seq.length > RESTART_DEPTH) {
      setLiveWarn(
        t("live.deepReset", { read: seq.length, cur: current.length }),
        {
          label: t("live.deepResetAccept"),
          run: () => {
            loadAsNewShoe(seq, into);
            setLiveWarn(null);
            liveLog(t("live.logNewShoe", { n: seq.length }), "new");
          },
        });
      return;
    }
    loadAsNewShoe(seq, into);
    liveLog(t("live.logNewShoe", { n: seq.length }), "new");
  }
}

/**
 * Say which table the reader is filling, whenever that is not the one on
 * screen. Without this the coups simply appear somewhere else, and the table
 * being looked at sits still for no visible reason.
 */
function renderLiveBinding() {
  const bar = $("liveBinding");
  if (!bar) return;
  const elsewhere = liveTable && state.tables[liveTable] && liveTable !== state.active;
  bar.hidden = !elsewhere;
  if (!elsewhere) return;
  bar.innerHTML = "";
  bar.appendChild(el("span", null, t("live.otherTable", { table: liveTable })));
  const go = el("button", "btn ghost", t("live.goToTable"));
  go.style.marginLeft = "8px";
  go.onclick = () => {
    state.active = liveTable;
    $("tableSel").value = liveTable;
    invalidate();
    store.save(state, []);
    render();
  };
  bar.appendChild(go);
}

function setLiveWarn(text, action) {
  const box = $("liveWarn");
  if (!text) { box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  box.innerHTML = "";
  // The warnings are i18n strings from this build, and two of them mark the
  // control they are telling you to press, so they carry markup.
  const line = el("span");
  line.innerHTML = text;
  box.appendChild(line);
  if (action) {
    const b = el("button", "btn ghost", action.label);
    b.style.marginLeft = "8px";
    b.onclick = action.run;
    box.appendChild(b);
  }
}

/**
 * Offer the sources this device actually has, and describe the one it will
 * use. A phone has no screen sharing, so telling it about a window picker it
 * will never show is worse than saying nothing.
 */
function renderLiveSources() {
  const screen = LiveWatcher.screenSupported, camera = LiveWatcher.cameraSupported;
  $("liveStart").hidden = !screen;
  $("liveCamera").hidden = !camera;
  $("liveStart").classList.toggle("primary", screen);
  $("liveCamera").classList.toggle("primary", !screen);

  $("liveIdleH").textContent = t(screen ? "live.idleH" : "live.idleHCamera");
  $("liveIdleBody").hidden = !screen;
  // Where both exist the camera note is the secondary explanation; where the
  // camera is the only way in it is the whole explanation. The aiming tip only
  // matters once the camera is the way in, so it rides with the note.
  $("liveCameraBody").hidden = !camera;
  $("liveCameraTip").hidden = !camera;
}

/** The last pin reported, so the log says it once rather than every sample. */
let livePinned = null;
/** Whether the preview is waiting for a box to be dragged on it. */
let livePicking = false;

function onLiveState(st) {
  $("liveIdle").hidden = st.active || !!st.error;
  $("liveActive").hidden = !st.active;
  $("liveError").hidden = !st.error;

  if (st.error) { liveTable = null; renderLiveBinding(); renderLiveError(st.error, st.source); return; }
  if (!st.active) { liveTable = null; renderLiveBinding(); renderLiveSources(); return; }

  // A reader that is running owns a table; one that has just started owns the
  // one that was selected when it did.
  if (!liveTable || !state.tables[liveTable]) liveTable = state.active;
  renderLiveBinding();

  live.drawPreview($("liveCanvas"));

  // An empty strip that is still locked is a shoe change, not a lost screen,
  // and it must not be reported as one: telling someone to check their screen
  // sharing while the table is simply between shoes sends them fixing what is
  // not broken.
  const dot = $("liveDot");
  const found = !!st.board;
  dot.className = "livedot " + (found ? "on" : st.cleared ? "waiting" : "searching");
  const ago = st.lastReadAt ? Math.round((Date.now() - st.lastReadAt) / 1000) : null;
  const via = t(st.source === "camera" ? "live.sourceCamera" : "live.sourceScreen");
  // What the status said before: "finding the region", whenever nothing had
  // been read. That was true of a reader with no idea where to look and of one
  // pinned to the right strip waiting for the first coup of a shoe -- and the
  // second is the ordinary state of a table between shoes. Being told the app
  // is still hunting, while it is not, is what "it is not recognising it" looks
  // like from the outside.
  const pinWord = st.pinned === "manual" ? "live.lockedManual"
    : st.pinned === "grid" ? "live.lockedGrid"
    : st.locked ? "live.locked" : "live.locking";
  const waiting = st.pinned === "manual" ? t("live.waitingManual")
    : st.pinned === "grid" && st.grid
      ? t("live.waitingGrid", { cols: st.grid.cols, rows: st.grid.rows })
      : null;
  $("liveStatus").textContent = found
    ? t("live.reading", { n: st.board.sequence.length, lock: t(pinWord), ago }) + " · " + via
    : st.cleared ? t("live.cleared") + " · " + via
    : waiting ? waiting + " · " + via
    : t("live.searching");

  // Said once, when it happens, because it is the answer to "is it looking at
  // the right place" and the preview outline alone is easy to miss.
  if (st.pinned !== livePinned) {
    if (st.pinned === "grid" && st.grid) {
      liveLog(t("live.logPinned", { cols: st.grid.cols, rows: st.grid.rows }));
    } else if (st.pinned === "manual") {
      liveLog(t("live.logPinnedManual"));
    }
    livePinned = st.pinned;
  }
  $("livePick").textContent = t(st.pinned === "manual" ? "live.unpin"
    : livePicking ? "live.picking" : "live.pick");

  // The gap between a shoe ending and the next one being readable can run to
  // minutes, so the moment itself goes in the log rather than only the status.
  if (st.cleared && !liveCleared) liveLog(t("live.logCleared"), "new");
  liveCleared = st.cleared;
}

function renderLiveError(code, source) {
  const box = $("liveError");
  const own = location.href;
  const camera = source === "camera";
  const bodies = {
    unsupported: `<h3>${t("live.errUnsupportedH")}</h3><p>${t("live.errUnsupportedBody")}</p>`,
    denied: camera
      ? `<h3>${t("live.errCameraDeniedH")}</h3><p>${t("live.errDeniedIntro")}</p>` +
        `<ol><li>${t("live.errCameraDenied1")}</li><li>${t("live.errCameraDenied2")}</li></ol>` +
        `<p style="margin-top:11px"><a href="${own}" target="_blank" rel="noopener">${t("live.errOpenTop")}</a></p>`
      : `<h3>${t("live.errDeniedH")}</h3><p>${t("live.errDeniedIntro")}</p>` +
        `<ol><li>${t("live.errDenied1")}</li><li>${t("live.errDenied2")}</li></ol>` +
        `<p style="margin-top:11px"><a href="${own}" target="_blank" rel="noopener">${t("live.errOpenTop")}</a></p>`,
    nosource: `<h3>${t("live.errNoSourceH")}</h3><p>${t("live.errNoSourceBody")}</p>`,
    failed: `<h3>${t("live.errFailedH")}</h3><p>${t("live.errFailedBody")}</p>`,
  };
  box.innerHTML = (bodies[code] || bodies.failed) +
    `<div class="actions"><button class="btn" id="liveRetry">${t("live.retry")}</button>
     <button class="btn ghost" id="liveToPaste">${t("live.toPaste")}</button></div>`;
  $("liveRetry").onclick = () => {
    live.error = null;
    live._emit();
    if (camera) live.startCamera(); else live.start();
  };
  $("liveToPaste").onclick = () => setMode("paste");
}

function setMode(mode, focus = false) {
  const isLive = mode === "live";
  for (const [id, on] of [["modeLive", isLive], ["modePaste", !isLive]]) {
    const tab = $(id);
    tab.classList.toggle("on", on);
    tab.setAttribute("aria-selected", String(on));
    // Roving tabindex: a tablist is one stop, and the arrow keys move inside
    // it. Leaving both tabs tabbable is what makes a declared tablist behave
    // unlike every other one a screen-reader user has met.
    tab.tabIndex = on ? 0 : -1;
    if (on && focus) tab.focus();
  }
  $("livePane").hidden = !isLive;
  $("pastePane").hidden = isLive;
  if (!isLive && live?.active) live.stop();
}

/* --------------------------------------------------------- batch import */

/* One phone cannot watch another app, so the workflow is: screenshot while
   you play, import the pile afterwards. The shots overlap heavily -- the same
   shoe at twenty lengths -- so they are folded back into shoes rather than
   landing as twenty separate ones. */

let batchShoes = null;
/** Which import is current: an older one that is still decoding stands down. */
let batchRun = 0;

/** Decode one file and read whatever board is in it. */
function readFile(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      try {
        const canvas = document.createElement("canvas");
        const { imageData } = toWorkingImage(img, canvas);
        const { boards } = detectBoards(imageData);
        resolve({ sequence: boards.length ? boards[0].sequence : "", at: file.lastModified || 0 });
      } catch {
        resolve({ sequence: "", at: file.lastModified || 0 });
      }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve({ sequence: "", at: 0 }); };
    img.src = url;
  });
}

async function importPhotos(files) {
  const list = [...files].filter((f) => f.type.startsWith("image/"));
  if (!list.length) return;

  // Decoding a pile takes seconds, and nothing stops a second pick during it.
  // The later pick owns the panel; this one stops touching it.
  const run = ++batchRun;

  setMode("paste");
  shot = null;
  renderShot();
  const box = $("batch");
  box.hidden = false;
  box.innerHTML = `<div class="bsum" id="batchLabel"></div>
                   <div id="batchBar"><i></i></div>`;

  const readings = [];
  for (let i = 0; i < list.length; i++) {
    if (run !== batchRun) return;
    const label = $("batchLabel"), bar = $("batchBar");
    if (label) label.textContent = t("batch.reading", { done: i + 1, total: list.length });
    if (bar) bar.firstElementChild.style.width = ((i + 1) / list.length) * 100 + "%";
    // Yield so the progress actually paints between decodes.
    await new Promise((r) => setTimeout(r, 0));
    readings.push(await readFile(list[i]));
  }
  if (run !== batchRun) return;

  const found = readings.filter((r) => r.sequence.length >= 4);
  batchShoes = groupReadings(found);
  renderBatch(list.length, readings.length - found.length);
}

function renderBatch(photos, skipped) {
  const box = $("batch");
  box.innerHTML = "";
  if (!batchShoes || !batchShoes.length) {
    box.appendChild(el("p", "warn", t("batch.none")));
    return;
  }

  const coups = batchShoes.reduce((a, s) => a + s.sequence.length, 0);
  box.appendChild(el("div", "bsum",
    t("batch.summary", { photos, shoes: batchShoes.length, coups })));
  if (skipped) box.appendChild(el("p", "bnote", t("batch.skipped", { n: skipped })));

  const list = el("div", "blist");
  for (const shoe of batchShoes) {
    const row = el("div", "brow");
    row.appendChild(el("span", "n", t("batch.shoe", { n: shoe.sequence.length, shots: shoe.seen })));
    const strip = el("div", "strip");
    for (const c of shoe.sequence) strip.appendChild(el("i", c));
    row.appendChild(strip);
    list.appendChild(row);
  }
  box.appendChild(list);

  const actions = el("div", "actions");
  const add = el("button", "btn primary", t("batch.add", { n: batchShoes.length }));
  add.onclick = () => {
    beforeWriting();
    const changed = [];
    const shoes_ = shoes();
    const last = shoes_[shoes_.length - 1];
    if (last && !last.o.length) shoes_.pop();
    else if (last && !last.closed) { last.closed = true; changed.push(last.id); }
    // The shoes you screenshotted earlier are over; the one you were watching
    // when you took the last shot may still be running, so it stays open --
    // the quick bar carries it on and the prediction counts its cards. That is
    // what a single pasted capture does too.
    batchShoes.forEach((shoe, i) => {
      const open = i === batchShoes.length - 1;
      const fresh = { id: newShoeId(), o: shoe.sequence, closed: !open, t: shoe.at || Date.now() };
      shoes_.push(fresh);
      changed.push(fresh.id);
    });
    const added = { shoes: batchShoes.length, coups };
    batchShoes = null;
    batchRun += 1;
    $("batch").hidden = true;
    commit(changed);
    $("pickNote").textContent = t("batch.added", added);
  };
  actions.appendChild(add);

  const cancel = el("button", "btn ghost", t("paste.cancel"));
  cancel.onclick = () => { batchShoes = null; batchRun += 1; $("batch").hidden = true; };
  actions.appendChild(cancel);
  box.appendChild(actions);
}

/** Read an image straight off the clipboard, where the browser allows it. */
async function importClipboard() {
  const note = $("pickNote");
  try {
    const items = await navigator.clipboard.read();
    for (const item of items) {
      const type = item.types.find((x) => x.startsWith("image/"));
      if (!type) continue;
      note.textContent = "";
      const blob = await item.getType(type);
      const img = new Image();
      const url = URL.createObjectURL(blob);
      img.onload = () => { setMode("paste"); handleImage(img); URL.revokeObjectURL(url); };
      img.src = url;
      return;
    }
    note.textContent = t("paste.clipboardEmpty");
  } catch {
    note.textContent = t("paste.clipboardDenied");
  }
}

/* --------------------------------------------------------------- analysis */

/**
 * Banker's share of decided coups at this table, with an honest interval.
 *
 * Memoised, because three panels read it and its dispersion term walks the
 * whole corpus. That corpus is meant to reach two thousand shoes -- the
 * collection panel says so -- and recomputing per panel put a keystroke at
 * a third of a second there.
 */
let revision = 0;
let observedCache = null;
let shoeCache = null;          // the per-shoe breakdown, invalidated with it

/** Called wherever the corpus or the selected table changes. */
function invalidate() {
  revision += 1;
  observedCache = null;
  shoeCache = null;
}

/** The pick actually shown: the network's, but only where it has earned it. */
function recommended(p) {
  const l = learned();
  return l.trusted && l.nextPick ? l.nextPick : p.pick;
}

function observed() {
  if (observedCache && observedCache.revision === revision && observedCache.table === state.active) {
    return observedCache.value;
  }
  const value = measure();
  observedCache = { revision, table: state.active, value };
  return value;
}

function measure() {
  const list = shoes().filter((s) => s.o.length);
  let b = 0, n = 0, ties = 0, coups = 0;
  for (const s of list) {
    for (const ch of s.o) {
      coups++;
      if (ch === "T") { ties++; continue; }
      n++; if (ch === "B") b++;
    }
  }
  if (!n) return { n: 0, coups, ties, shoes: list.length, banker: 0, player: 0 };

  const q = b / n;
  // Within-shoe clustering inflates the true standard error above the
  // binomial one, and the dispersion statistic measures exactly that ratio.
  // Only that one statistic is computed: the rest of the battery costs a
  // hundred milliseconds a keystroke at collection scale and says nothing here.
  const disp = list.length >= 5 ? shoeShareDispersion(list.map((s) => s.o)) : NaN;
  const inflate = Number.isFinite(disp) ? Math.sqrt(Math.max(1, disp)) : 1;
  const se = Math.sqrt((q * (1 - q)) / n) * inflate;

  // The interval is Wilson's, on the sample size the clustering leaves.
  //
  // The textbook interval is q +- 1.96 se, and at q = 1 that standard error is
  // zero: a table that has gone Banker thirty times running is reported as
  // 100.00% +- 0.00pp, which reads as certainty and is the opposite of what
  // thirty coups support. It is the same collapse the per-shoe table already
  // avoids by putting the null share in its denominator, and the tile beside
  // it had it still.
  //
  // Wilson does not collapse: it is the set of shares the observed count would
  // not reject, so a run of thirty Bankers comes out at 88.6%-100% rather than
  // a point. It is also the better interval everywhere else -- at a 60/40
  // split over 120 coups the two differ by two hundredths of a point -- so
  // nothing that reads this loses anything by the change.
  //
  // Clustering enters as an effective sample size rather than as a multiplier
  // on the error, which is the same discount `posterior` applies and the only
  // way to apply one to an interval that is not built from a standard error.
  const Z = 1.96;
  const nEff = n / Math.max(1, inflate ** 2);
  const denom = 1 + (Z * Z) / nEff;
  const centre = (q + (Z * Z) / (2 * nEff)) / denom;
  const half = (Z * Math.sqrt((q * (1 - q)) / nEff + (Z * Z) / (4 * nEff * nEff))) / denom;

  return {
    n, coups, ties, shoes: list.length, q, se, inflate, nEff,
    banker: b, player: n - b,
    lo: Math.max(0, centre - half), hi: Math.min(1, centre + half),
  };
}

/* ------------------------------------------------- the prediction log */

/**
 * Write down the recommendation now on screen.
 *
 * The coup it is about is the next one: the shoe in progress holds `n` coups,
 * so this is the prediction for index `n`. A shoe that has not been given an
 * id yet -- the empty one the app shows before anything is entered -- has
 * nothing to key on and nothing to predict about, so it is skipped.
 *
 * Confidence is the distance from the crossover in standard errors, scaled to
 * the 0-100 the log stores. It is deliberately not the probability: a 51%
 * share over forty coups and the same share over four thousand are the same
 * probability and not remotely the same claim.
 */
function logPrediction(p, chosen, worthBacking) {
  const name = state.active;
  if (!name || !state.tables[name] || state.isExample) return;
  const shoe = openShoe(name);
  if (!shoe.id) return;

  const l = learned();
  const usingNet = l.trusted && !!l.nextPick;
  const wrote = recordPrediction(predictionLog, name, {
    shoe: shoe.id,
    index: shoe.o.length,
    player: (1 - p.tie) * (1 - p.q),
    banker: (1 - p.tie) * p.q,
    tie: p.tie,
    pick: chosen,
    backed: worthBacking,
    confidence: confidenceScore(p),
    model: usingNet ? NET_MODEL_VERSION : BASE_MODEL_VERSION,
    features: FEATURE_VERSION,
  });
  if (wrote) {
    store.saveLog(predictionLog);
    sendCall(name, shoe);
  }
}

/* --------------------------------------- the forward record, on a server */

/**
 * Sending the app's own calls to the shared record as they are made.
 *
 * `verify.js` already writes every call down, and that record is honest as far
 * as it goes: it is written before the coup and settled after. What it cannot
 * do is convince anybody else. It lives in this browser, in storage this page
 * can rewrite, so "it was written in advance" rests on the word of the thing
