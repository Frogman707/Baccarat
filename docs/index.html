      const down = ruledRuns(
        rulePeaks(rowProfile(L, w, h, Math.floor(across.from), Math.ceil(across.to) + 1)),
        across.pitch * 0.82, across.pitch * 1.22, 1)[0];
      if (!down || down.cells < GRID_MIN_ROWS) continue;

      // And now the absolute test. Everything above ranked lines against their
      // neighbours; this asks whether they are lines at all, and cuts the box
      // back to the part where they are. Twice, because each axis is judged
      // over the other's extent and the first cut moves it.
      let cols = across.chain, rows = down.chain, ok = true;
      for (let pass = 0; pass < 2 && ok; pass += 1) {
        const jFrom = Math.max(0, Math.round(rows[0]));
        const tall = Math.max(1, Math.min(h - 1 - jFrom, Math.round(rows[rows.length - 1]) - jFrom));
        const downHalf = Math.min(SMOOTH, Math.max(0, (tall >> 1) - 1));
        cols = trimToCrossing(cols, (i) => (i < 1 || i >= w - 2 ? 0
          : runAt((x) => (j) => {
              const [lo, hi] = spanAround(j, tall, downHalf);
              let right = 0, left = 0;
              for (let y = lo; y < hi; y += 1) {
                const at = (jFrom + y) * w + x;
                right += L[at + 1]; left += L[at];
              }
              return (right - left) / (hi - lo);
            }, i, tall) / tall));
        if (cols.length < GRID_MIN_COLS + 1) { ok = false; break; }

        const iFrom = Math.max(0, Math.round(cols[0]));
        const wide = Math.max(1, Math.min(w - 1 - iFrom, Math.round(cols[cols.length - 1]) - iFrom));
        const acrossHalf = Math.min(SMOOTH, Math.max(0, (wide >> 1) - 1));
        rows = trimToCrossing(rows, (j) => (j < 1 || j >= h - 2 ? 0
          : runAt((y) => (i) => {
              const [lo, hi] = spanAround(i, wide, acrossHalf);
              let up = 0, down2 = 0;
              for (let x = lo; x < hi; x += 1) {
                up += L[(y + 1) * w + iFrom + x]; down2 += L[y * w + iFrom + x];
              }
              return (up - down2) / (hi - lo);
            }, j, wide) / wide));
        if (rows.length < GRID_MIN_ROWS + 1) { ok = false; break; }
      }
      if (!ok) continue;

      const pitch = (across.pitch + down.pitch) / 2;
      const lattice = {
        x: x0 + Math.round(cols[0]), y: y0 + Math.round(rows[0]),
        x2: x0 + Math.round(cols[cols.length - 1]), y2: y0 + Math.round(rows[rows.length - 1]),
      };
      const nCols = Math.round((cols[cols.length - 1] - cols[0]) / across.pitch);
      const nRows = Math.round((rows[rows.length - 1] - rows[0]) / down.pitch);
      return {
        box: lattice,
        panel: growToPanel(imageData, lattice, pitch,
          { x: x0, y: y0, x2: x1 - 1, y2: y1 - 1 }),
        pitch,
        cols: nCols,
        rows: nRows,
        solidity: Math.min(across.solidity, down.solidity),
        filled: latticeFill(imageData, lattice, nCols, nRows, pitch),
      };
    }
  }
  return null;
}

/* ------------------------------------------------------------ text input */

/** Every spelling of an outcome this parser accepts, longest match first. */
const TEXT_TOKENS = [
  ["플레이어", "P"], ["뱅커", "B"], ["타이", "T"], ["무승부", "T"],
  ["player", "P"], ["banker", "B"], ["tie", "T"], ["draw", "T"],
  ["閒", "P"], ["莊", "B"], ["和", "T"], ["闲", "P"], ["庄", "B"],
  ["플", "P"], ["뱅", "B"], ["타", "T"],
  ["p", "P"], ["b", "B"], ["t", "T"], ["d", "T"],
];

/**
 * Parse a pasted sequence in whatever shape it arrives: "PBBTP", "P B B T",
 * "플레이어, 뱅커, 타이", one per line, or 莊閒和. Anything unrecognised is
 * skipped rather than guessed at, and reported so a bad paste is visible.
 */
function parseSequenceText(text) {
  const src = String(text || "").toLowerCase();
  const out = [];
  let skipped = 0, i = 0;

  while (i < src.length) {
    const ch = src[i];
    if (/[\s,;|/\-_.\[\](){}"'`\n\r\t0-9#]/.test(ch)) { i++; continue; }
    let matched = null;
    for (const [token, code] of TEXT_TOKENS) {
      if (src.startsWith(token, i)) { matched = [token, code]; break; }
    }
    if (matched) { out.push(matched[1]); i += matched[0].length; }
    else { skipped++; i++; }
  }
  return { sequence: out.join(""), skipped };
}

/* ═══ corpus.js ═══ */
/* Turning the collected shoes into something the desktop package can read.
 *
 * Kept apart from the interface because it is pure: it takes the corpus and
 * returns text, touches no DOM, and is therefore testable in the same place
 * as the rest of the analysis -- which matters, because the CSV it writes is
 * fed straight to `baccarat ingest` and a quoting mistake there corrupts a
 * corpus silently rather than failing.
 */

/**
 * Do two readings of a board describe the same shoe?
 *
 * A bead plate grows from the left, so one reading being a prefix of the other
 * means they are the same shoe seen at two moments. It is the rule the live
 * reader decides by.
 */
function sharePrefix(a, b) {
  return a.startsWith(b) || b.startsWith(a);
}

/** Seconds a coup takes, for spacing the timestamps an export did not record
 *  -- about what a live table takes between results. */
const SECONDS_PER_COUP = 45;

/**
 * The largest instant `new Date(t).toISOString()` will render.
 *
 * Past it the call throws `RangeError` rather than returning anything, and the
 * export built its whole file inside one expression -- so a single shoe with a
 * silly timestamp took the Export button out entirely: no file, no message,
 * an uncaught error in a console nobody at a table is looking at. A stored
 * timestamp reaches here from an older version, a hand-edited mirror or the
 * shared db, none of which this page wrote.
 */
const MAX_TIME = 8.64e15;

/** The columns `baccarat ingest` sniffs for, in the order it expects. */
const COLUMNS = ["outcome", "shoe_id", "game_no", "table_id", "played_at"];

/** One row per coup, across every table. */
function corpusRows(tables) {
  const rows = [];
  for (const [tableId, entry] of Object.entries(tables)) {
    for (const shoe of entry.shoes) {
      if (!shoe.o.length) continue;
      [...shoe.o].forEach((outcome, i) => {
        rows.push({
          outcome,
          shoe_id: shoe.id,
          game_no: i + 1,
          table_id: tableId,
          // Clamped at the sum, not just at `shoe.t`: a shoe that starts on the
          // last renderable day is still valid, and the 45 seconds a coup adds
          // is what carries it past the end.
          played_at: new Date(
            Math.min(MAX_TIME, shoe.t + i * SECONDS_PER_COUP * 1000)).toISOString(),
        });
      });
    }
  }
  return rows;
}

/**
 * A table name a person typed, reduced to something safe to carry.
 *
 * Leading `= + - @` and a leading tab or carriage return are how a spreadsheet
 * decides a cell is a formula, and the export is a file people open in one.
 * The value itself must stay faithful -- it round-trips through
 * `baccarat ingest` -- so the guard belongs where the name is accepted, rather
 * than in the writer where it would corrupt the column.
 *
 * There are two such places, and for a long time this only ran at one of them.
 * Typing a name is the obvious way one arrives; the other is a whole corpus
 * landing at `sanitiseState` -- from an older version's storage, a
 * half-finished sync, or the shared db, which everyone looking at the same
 * tables writes to. Five names in eight went out of the exporter as live
 * formulas by that route.
 */
function cleanTableName(raw) {
  const text = String(raw ?? "").replace(/[\u0000-\u001f\u007f]/g, " ").trim();
  const stripped = text.replace(/^[=+\-@]+/, "").trim();
  return stripped.slice(0, 60);
}

/**
 * RFC 4180 quoting. Table names are typed by hand, so a comma or a quote in
 * one has to survive the round trip rather than shift every later column.
 */
function csvCell(value) {
  const text = String(value ?? "");
  return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

function toCsv(rows) {
  return [
    COLUMNS.join(","),
    ...rows.map((r) => COLUMNS.map((c) => csvCell(r[c])).join(",")),
  ].join("\n") + "\n";
}

/* ═══ predict.js ═══ */
/* The next coup's probabilities, and which of the two wagers is less bad.
 *
 * Kept apart from the interface because it is pure -- numbers in, numbers out,
 * no DOM -- and because it is the arithmetic the whole panel rests on: if it
 * is wrong, every figure a person reads is wrong, and there is no way to see
 * that from the screen. Here it can be checked against the Python engine and
 * against closed-form values in the same test run as the rest of the analysis.
 */


/**
 * Where a Banker bet stops being the better of the two losing wagers.
 *
 * Banker returns 0.95q - (1-q), Player returns (1-q) - q, so Banker is ahead
 * while q > 2/3.95 = 50.6329%. A fresh shoe sits at 50.6825% -- just 0.05pp
 * above the line, which is why the pick is never held with any confidence.
 */
const SIDE_CROSSOVER = 2 / 3.95;

/*
 * The fair-shoe prior, written as a Beta distribution.
 *
 * The estimate used to be a precision-weighted blend of the prior and the
 * observed rate, which needed a thirty-coup gate: the observed standard error
 * is zero when every coup so far went the same way, and the blend divides by
 * it. Below the gate the estimate was frozen at the prior exactly, so the
 * first thirty results changed nothing on screen.
 *
 * A Beta prior removes the gate rather than papering over it. It is conjugate
 * to the coin flip the coups are, so the posterior after any number of them --
 * including none -- is another Beta, in closed form, with no division by an
 * empty sample. It is matched to the same mean and width as the blend it
 * replaces: mean BASE_BANKER_SHARE, standard deviation BANKER_BREAKEVEN_GAP.
 *
 * The two agree to within 0.03pp anywhere a baccarat table can sit -- measured
 * over a Banker share from 45% to 57% and up to twenty thousand coups. They
 * part company only out at shares no shoe produces (0.83pp at 70%), and there
 * the Beta is the exact posterior while the blend was a Gaussian
 * approximation of it. So this is not a looser estimate bought for a livelier
 * screen; it is the same estimate, defined everywhere, moving on every coup.
 */
const PRIOR_STRENGTH =
  (BASE_BANKER_SHARE * (1 - BASE_BANKER_SHARE)) / BANKER_BREAKEVEN_GAP ** 2 - 1;
const PRIOR_A = BASE_BANKER_SHARE * PRIOR_STRENGTH;
const PRIOR_B = PRIOR_STRENGTH - PRIOR_A;

/*
 * The tie rate gets the same treatment, for the same reason.
 *
 * It used to be the constant 9.5156%, which meant a tie -- a real result, one
 * of the three the table produces -- moved nothing on screen at all, and the
 * bar labelled as a probability was not an estimate of anything. Shrunk
 * against a prior of the same strength its width works out to 0.35pp, so a
 * table whose ties ran a point off would be extraordinary, which is the right
 * thing to believe about a fair shoe.
 */
const TIE_PRIOR_A = BASE_TIE * PRIOR_STRENGTH;
const TIE_PRIOR_B = PRIOR_STRENGTH - TIE_PRIOR_A;

/**
 * Can this record be a record of 8-deck baccarat at all?
 *
 * Asked of the tie rate, and only of the tie rate, because that is the one
 * figure a shuffle barely touches. How often three cards make the same total
 * on both sides is a property of the pack -- eight decks, these drawing rules
 * -- and comes out at 9.5156% however the cards are ordered. The Banker share
 * and the streak lengths are what a bad shuffle moves, and moving them is the
 * finding this whole page exists to look for, so neither can be used to
 * dismiss a table.
 *
 * A gap of six standard errors is one chance in a billion, and the error used
 * is the clustered one: coups inside a shoe are not independent draws, and
 * `deff` is the same design effect the Banker share is already discounted by,
 * so a table whose shoes cluster is given the wider error it has earned. What
 * this is meant to catch is a reading -- a board misread, a strip counted
 * twice, a shoe stitched from fragments -- and those move the tie rate by
 * whole points, which no discount reaches.
 *
 * Below `MIN_JUDGED` coups it says nothing: a short table has no business
 * being called impossible.
 */
const TIE_IMPLAUSIBLE_Z = 6;
const MIN_JUDGED = 500;

function tiePlausibility(coups = 0, ties = 0, deff = 1) {
  const spread = Math.max(1, Number.isFinite(deff) ? deff : 1);
  const rate = coups ? ties / coups : NaN;
  const se = coups ? Math.sqrt((BASE_TIE * (1 - BASE_TIE) * spread) / coups) : NaN;
  const z = coups ? (rate - BASE_TIE) / se : NaN;
  return {
    coups, ties, rate, expected: BASE_TIE, z, deff: spread,
    judged: coups >= MIN_JUDGED,
    implausible: coups >= MIN_JUDGED && Math.abs(z) >= TIE_IMPLAUSIBLE_Z,
  };
}

/**
 * How long a real 8-deck shoe runs, measured rather than assumed.
 *
 * 4,000 shoes dealt by the rules engine in this repository: mean 80.27, sd
 * 1.61, and every single one between 75 and 86. The cut card decides it, so
 * the spread is tiny -- far tighter than anything else in this game, which is
 * what makes the length of a shoe worth checking at all.
 *
 * A collected shoe may of course be shorter: a person joins a table mid-shoe
 * and leaves mid-shoe, and both ends are then clipped. Nothing here calls that
 * a fault. What it cannot be is *longer*: a closed shoe past 86 coups is two
 * shoes stitched together, or one strip counted twice, and either way the
 * record is not what it says it is.
 */
const SHOE_MIN = 75;
const SHOE_MAX = 86;
const SHOE_MEAN = 80.27;

/**
 * Shoes longer than a shoe can be, and how short the rest run.
 *
 * Two different things, deliberately reported separately. The long ones are a
 * fault and the trust is withdrawn for them. The short ones are a fact about
 * the record that the person collecting it should see -- a table whose shoes
 * average eighteen coups has not been read as shoes -- and it is stated rather
 * than adjudicated, because a short shoe is also what honest dipping in and
 * out produces.
 *
 * Every shoe that has anything in it counts, the one in progress included.
 * Judging only the closed ones was the first thing tried and it moves the
 * figure at a shoe boundary: the same shoes and the same coups, one of them
 * merely relabelled, and the average jumped from 60 to 51. Nothing about the
 * table changed there, so nothing about the table should have moved.
 */
function shoeShape(lengths = []) {
  const counted = lengths.filter((n) => Number.isFinite(n) && n > 0);
  if (!counted.length) return { counted: 0, mean: NaN, long: 0, whole: 0, fragments: 0 };
  const long = counted.filter((n) => n > SHOE_MAX).length;
  const whole = counted.filter((n) => n >= SHOE_MIN && n <= SHOE_MAX).length;
  return {
    counted: counted.length,
    mean: counted.reduce((a, b) => a + b, 0) / counted.length,
    long,
    whole,
    fragments: counted.length - whole - long,
  };
}

/** Expected value per coup of a flat unit on each side, ties pushing. */
function edges(q, tieP) {
  const decided = 1 - tieP;
  return { B: decided * (q * 0.95 - (1 - q)), P: decided * (1 - 2 * q) };
}

/**
 * Whether this table's own share has cleared a break-even line by more than
 * an honest table reaches when it is read after every coup.
 *
 * Two things on the page said a side was worth money. The badge beside the
 * pick said "worth backing" wherever the estimate's expectation was above
 * zero; the verdict under the scale said "unusual" wherever the share's 95%
 * interval cleared a break-even line. Each is a fair statement at one look,
 * and the page takes a look after every coup. Measured over 300 fair tables
 * read that way: "worth backing" appeared at some point on 13% by 5,000
 * decided coups and 22% by 60,000, and "unusual" on 36% within the first
 * 1,000 and 40% by 60,000 -- a streak early on is enough to clear an
 * interval drawn for one look.
 *
 * So a side counts as clearing only when the table's share is past its line
 * by the always-valid boundary: a Banker win counted against the Banker
 * break-even moves by one or nothing, half of one about its mean, so the
 * count is held to half of `mixtureBoundary`. Where the Banker share is at or
 * below break-even -- which every honest table's is -- the chance of ever
 * reaching it is at most BACKING_ALPHA however long the table is watched;
 * measured, none of the same 300 did. Counts are in effective coups, the
 * same clustering discount `posterior` applies.
 *
 * `bankerAbove` and `bankerBelow` are the Banker shares that would clear the
 * two lines at this many coups, for saying how far off a table is.
 */
const BACKING_ALPHA = 0.025;
const BACKING_RHO = 200;

function backingCleared(n, q, deff = 1) {
  const nEff = n > 0 ? n / Math.max(1, deff) : 0;
  if (!nEff || !Number.isFinite(q)) {
    return { B: false, P: false, bankerAbove: NaN, bankerBelow: NaN };
  }
  const reach = (0.5 * mixtureBoundary(nEff, BACKING_ALPHA, BACKING_RHO)) / nEff;
  return {
    B: q - BANKER_BREAKEVEN >= reach,
    P: PLAYER_BREAKEVEN - q >= reach,
    bankerAbove: BANKER_BREAKEVEN + reach,
    bankerBelow: PLAYER_BREAKEVEN - reach,
  };
}

/**
 * How sure the table's own share is about the side named -- held to the line a
 * table read after every coup is held to, like the badge beside it.
 *
 * It was the estimate's distance from the crossover in its own standard
 * errors, "medium" at one and "high" at two: fair statements at one look, and
 * the page looks after every coup. Measured over 300 fair tables read that
 * way, "high" appeared at some point on 6% by 20,000 decided coups and 17% by
 * 60,000, and "medium or high" on 67% and 88% -- beside a pick whose two sides
 * differ, on a fair table, by a twentieth of a point.
 *
 * So the level is the table's share past the crossover on the named side,
 * counted the way `backingCleared` counts it (a coin against a fixed share,
 * half the mixture boundary, effective coups): "high" at the badge's own
 * CONFIDENCE_ALPHA.high, "medium" at the looser CONFIDENCE_ALPHA.medium, "low"
 * short of both. Measured on the same 300: "high" at some point on 1.3% by
 * 60,000, "medium or high" on 6.3%, where a medium line at 0.25 gave 16%; and
 * a table dealing Banker 53% of decided coups still reaches medium in every
 * one of 40 (median 2,295) and high in every one (median 3,053).
 *
 * The score is the 0-100 figure the log stores: 33 at the
 * medium line and 67 at the high one, straight between, and floored, so the
 * bands the record reads -- `bandOf`, the recent-record words -- fall exactly
 * where the words do.
 */
const CONFIDENCE_ALPHA = { medium: 0.1, high: 0.025 };

function confidenceLines(nEff) {
  return {
    medium: 0.5 * mixtureBoundary(nEff, CONFIDENCE_ALPHA.medium, BACKING_RHO),
    high: 0.5 * mixtureBoundary(nEff, CONFIDENCE_ALPHA.high, BACKING_RHO),
  };
}

function sideConfidence(n, q, deff = 1, pick = "B") {
  const nEff = n > 0 ? n / Math.max(1, deff) : 0;
  if (!nEff || !Number.isFinite(q)) return { level: "low", score: 0 };
  // How far past the crossover, toward the side named, in effective coups.
  const lean = (pick === "P" ? SIDE_CROSSOVER - q : q - SIDE_CROSSOVER) * nEff;
  const { medium, high } = confidenceLines(nEff);
  const raw = lean <= 0 ? 0
    : lean < medium ? (33 * lean) / medium
    : lean < high ? 33 + (34 * (lean - medium)) / (high - medium)
    : 67 + 33 * Math.min(1, (lean - high) / high);
  return {
    level: lean >= high ? "high" : lean >= medium ? "medium" : "low",
    score: Math.min(100, Math.floor(raw)),
  };
}

/**
 * What produced a prediction, written into every logged one.
 *
 * A stored prediction is only re-readable if you know what made it. These are
 * the two things that decide it: `FEATURE_VERSION` covers what goes into the
 * estimate -- the prior's weight, the clustering discount, the crossover --
 * and `BASE_MODEL_VERSION` covers the rule that turns the estimate into a
 * side. The names are spelled out because the page is served as one
 * concatenated scope, where two modules exporting `MODEL_VERSION` collide.
 *
 * Bump one when a change would make the same coups come out differently. The
 * point is not the number; it is that a record spanning a change says which
 * side of it each row is on, so a run of misses under an old rule cannot be
 * quietly averaged into a new rule's score.
 *
 * f2: the confidence stored with each call, and whether backing it was judged
 * worth it, are held to the always-valid line (`sideConfidence`,
 * `backingCleared`). The side named is unchanged, so the model versions -- the
 * ones every stored call is filed under -- are too.
 *
 * base-2: the side is the estimate's better expectation with no margin
 * (`SWITCH_EVIDENCE` 0, was 1). The same coups name a different side, so the
 * calls made under it are filed apart from base-1's. On 2026-10-02 the owner
 * went back to base-1 for a few hours, putting hitting first, and then to
 * this again; each call is filed under the rule that made it.
 *
 * base-3: the side is the shoe's recent run -- whichever came up more in its
 * last six decided coups, the estimate's side where they are level. The
 * owner's choice, 2026-10-04.
 *
 * base-4: the side is the shoe's pattern -- whichever of the readings in
 * `PATTERNS` has called the shoe being dealt best so far, the estimate's side
 * where none names one (`ShoePattern`). The owner's choice, the same day.
 */
const FEATURE_VERSION = "f2";
const BASE_MODEL_VERSION = "base-4";

/**
 * Standard errors of evidence required before the estimate's side leaves
 * Banker for Player.
 *
 * The pick on screen follows the shoe's pattern (`ShoePattern`); the
 * estimate's side is what it takes where no reading of the pattern names one,
 * and the side every expectation and confidence on the page is quoted for.
 * This margin is that side's.
 *
 * None: whichever side the estimate gives the better expectation, at every
 * coup. That was the owner's choice for the pick itself (2026-10-02), made
 * knowing what it costs, after a pick that held Banker almost without
 * exception read as an answer that never changed; it was one standard error
 * before.
 *
 * What it costs was measured before it was chosen. Swept over 600 tables of
 * 3,000 coups each, every rule walking the table coup by coup and predicting
 * from what came before -- hit rate on decided coups, against always backing
 * Banker, at a noise floor of +-0.039pp:
 *
 *     threshold   fair   clustered   B 52%   P 49%   P 47%   P 45%
 *     0 SE       -0.58      +0.03    -0.49   +1.56   +5.57   +9.63
 *     0.5 SE     -0.09      +0.10    -0.02   +0.73   +4.20   +8.21
 *     1 SE       -0.01      +0.05    -0.00   +0.24   +2.80   +6.72
 *     2 SE       +0.00      +0.01    +0.00   +0.00   +0.50   +3.52
 *     3 SE       +0.00      +0.00    +0.00   +0.00   +0.01   +0.73
 *
 * So on a fair table no margin wins about half a point less often than always
 * backing Banker, where one standard error was level with it; on a table
 * genuinely biased to Player it is the quickest to follow. Two days later the
 * owner asked for more again -- a pick that changes with the shoe -- and the
 * pick became the shoe's run, then its pattern (`ShoePattern`), with this as
 * the side where the pattern names none.
 */
const SWITCH_EVIDENCE = 0;

/**
 * The estimate's side: the pick where the shoe's pattern names none
 * (`ShoePattern`), and the side the expectation and the confidence are quoted
 * for.
 *
 * Whichever side the estimate gives the better expectation, from the coups
 * before this one: Banker while the estimate sits above the crossover, Player
 * once it is below it, with `SWITCH_EVIDENCE` standard errors of margin.
 *
 * Worth being plain about what that does on a fair table. The crossover sits
 * 0.05pp under a fresh shoe and the estimate's own error is tenths of a point
 * for thousands of coups, so which side it names there is decided by noise.
 * Measured over six fair tables of 49,000 coups: picking this way won 45.44%
 * of coups and lost 540 units a table; holding Banker until the estimate had
 * cleared the crossover by a standard error won 45.91% and lost 452. On a fair
 * table Banker is simply the side that wins more often -- the pick moves with
 * the table's record, and that is all it does.
 */
function sidePick(q, se) {
  return SIDE_CROSSOVER - q > SWITCH_EVIDENCE * se ? "P" : "B";
}

/**
 * The readings of a shoe's pattern the pick chooses among, in the order a tie
 * between their records is settled in.
 *
 * Each names a side for the next coup from the decided coups of the shoe
 * being dealt, or nothing where it has nothing to go on yet:
 *
 *   roads3    the side most of the three derived roads would mark red -- the
 *             one that keeps the board repeating itself, read off the same
 *             ask roads the board shows beside its counts
 *   beb       the side the big eye boy would mark red
 *   small     the side the small road would mark red
 *   roach     the side the cockroach road would mark red
 *   repeat    what followed, earlier in this shoe, the longest stretch of its
 *             latest coups seen before (up to six), where that is one side
 *             more often than the other
 *   streak    the side of the last decided coup (줄)
 *   chop      the other side (퐁당)
 *   majority  the side that has come up more in this shoe
 *
 * The owner asked, on 2026-10-04, for the pick to read the whole shoe's
 * pattern rather than its last six coups. So it follows whichever of these
 * has called this shoe best so far: each is scored on every decided coup of
 * the shoe it named a side for, from the coups before that one, and the one
 * with the best record -- hits plus one over calls plus two, so a reading
 * with one call is not taken for a sure thing -- names the side. A new shoe
 * starts every record over: the pattern is the shoe's own.
 *
 * What it costs was measured before it shipped, on the page's own simulator,
 * two independent sets of six fair tables of 700 shoes, each coup named from
 * the coups before it (about 305,000 decided coups a set, +-0.09pp):
 *
 *     rule                       right        names Player
 *     the shoe's pattern         49.94-50.05%     48%
 *     each reading alone         49.74-50.39%
 *     the last six (base-3)      50.25-50.30%
 *     always Banker              50.65-50.69%      0%
 *
 * Every reading is right on half the coups it names, as every rule is on a
 * fair table, and choosing among them by their record in the shoe does not
 * change that: on a fair table a shoe's past says nothing about its next coup,
 * and a reading that has called this shoe well has been lucky in it. What the
 * rule does do is name the side the shoe's own pattern points to, as a person
 * reading the roads would -- right about 0.7 points less often than always
 * backing Banker. The page says so in its reasons for the pick
 * (`ai.patternRule`), with figures `tests/test_js_port.py` measures.
 */
const PATTERNS = ["roads3", "beb", "small", "roach", "repeat", "streak", "chop", "majority"];

/** How far back each derived road looks: the big eye boy, the small road, the cockroach road. */
const DERIVED_OFFSETS = [1, 2, 3];

/** The longest stretch of a shoe's latest coups `repeat` looks for earlier in it. */
const REPEAT_REACH = 6;

/**
 * Whether one more coup of `side` would mark a derived road red, from the big
 * road's column lengths and the side of its last column: true for red, false
 * for blue, null where the road has not started. The rules of `derivedRoad`,
 * asked of the one entry the coup would add -- extending the last column at
 * the row its length is, or opening the next one.
 */
function askRed(lengths, last, side, offset) {
  const m = lengths.length;
  const back = m - 1 - offset;
  if (!m || back < 0) return null;
  // Extending: does the column `offset` back reach the row the coup lands on?
  if (side === last) return lengths[back] !== lengths[m - 1];
  // Opening: is the column just closed as long as the one `offset` before it?
  return lengths[m - 1] === lengths[back];
}

/**
 * One shoe's pattern, read coup by coup: what each reading names for the next
 * coup, how each has called the shoe so far, and the side the pick follows.
 *
 * Fed the shoe's coups in order with `add`; a tie settles no call and moves no
 * road. Nothing in it sees a coup before it has named a side for it.
 */
class ShoePattern {
  constructor() {
    this.text = "";                                  // the decided coups, B and P
    this.lengths = [];                               // the big road's columns
    this.last = null;                                // the side of its last column
    this.banker = 0;
    this.record = {};
    for (const k of PATTERNS) this.record[k] = { hits: 0, calls: 0 };
    this.calls = readPattern(this);
  }

  /** The reading with the best record that names a side now, or null for none. */
  get following() {
    let best = null, score = -1;
    for (const k of PATTERNS) {
      if (!this.calls[k]) continue;
      const r = this.record[k], s = (r.hits + 1) / (r.calls + 2);
      if (s > score) { best = k; score = s; }
    }
    return best;
  }

  /** The side the pattern names for the next coup, or `level` where none does. */
  pick(level) {
    const k = this.following;
    return k ? this.calls[k] : level;
  }

  /** One more coup of the shoe: every call made for it is settled, then read again. */
  add(outcome) {
    if (outcome !== "B" && outcome !== "P") return this;
    for (const k of PATTERNS) {
      const call = this.calls[k];
      if (!call) continue;
      this.record[k].calls += 1;
      if (call === outcome) this.record[k].hits += 1;
    }
    this.text += outcome;
    if (outcome === "B") this.banker += 1;
    if (outcome === this.last) this.lengths[this.lengths.length - 1] += 1;
    else { this.lengths.push(1); this.last = outcome; }
    this.calls = readPattern(this);
    return this;
  }
}

/** A shoe's pattern after the coups of `shoe`, for the coup that comes next. */
function shoePattern(shoe = "") {
  const pattern = new ShoePattern();
  for (const o of shoe) pattern.add(o);
  return pattern;
}

/**
 * The side a shoe's pattern named before each of its coups, a character a
 * coup: "B", "P", or "-" where it named none.
 *
 * Every replay of a table -- the bet results, the network's comparison --
 * walks every shoe it holds at every coup, and a finished shoe's answers never
 * change. Kept by the shoe's own string, so the only shoe read again is the
 * one still being dealt, which is a new string with every coup; measured on a
 * table of thirty shoes, reading them all afresh doubled what a coup cost.
 */
const patternMemo = new Map();
const PATTERN_MEMO_MAX = 4096;

function patternSides(shoe) {
  let sides = patternMemo.get(shoe);
  if (sides === undefined) {
    const pattern = new ShoePattern();
    sides = "";
    for (const o of shoe) {
      sides += pattern.pick("-");
      pattern.add(o);
    }
    // A long session leaves a string behind for every coup of every shoe it
    // dealt; dropping them all now and then costs one re-read of each.
    if (patternMemo.size >= PATTERN_MEMO_MAX) patternMemo.clear();
    patternMemo.set(shoe, sides);
  }
  return sides;
}

/** What each reading names for the next coup of a shoe read this far. */
function readPattern({ text, lengths, last, banker }) {
  const n = text.length;
  const calls = {};
  // The derived roads: the side each would mark red. Opening a column and
  // extending one get opposite marks, so the side is the one that gets red.
  let red = 0, blue = 0;
  DERIVED_OFFSETS.forEach((offset, i) => {
    const bankerRed = askRed(lengths, last, "B", offset);
    const call = bankerRed === null ? null : bankerRed ? "B" : "P";
    calls[["beb", "small", "roach"][i]] = call;
    if (call === "B") red += 1;
    else if (call === "P") blue += 1;
  });
  calls.roads3 = red > blue ? "B" : blue > red ? "P" : null;

  calls.repeat = null;
  for (let k = Math.min(REPEAT_REACH, n - 1); k >= 1 && !calls.repeat; k -= 1) {
    const tail = text.slice(n - k);
    let b = 0, p = 0;
    for (let at = text.indexOf(tail); at >= 0 && at + k < n; at = text.indexOf(tail, at + 1)) {
      if (text[at + k] === "B") b += 1; else p += 1;
    }
    if (b !== p) calls.repeat = b > p ? "B" : "P";
  }

  calls.streak = last;
  calls.chop = last ? (last === "B" ? "P" : "B") : null;
  calls.majority = banker * 2 > n ? "B" : banker * 2 < n ? "P" : null;
  return calls;
}

/**
 * The next coup's estimate from what this table has produced so far.
 *
 * `sample` is what `measure()` counts: `n` decided coups of which the Banker
 * share is `q`, `ties` out of `coups` in total, and `inflate` the square root
 * of the shoe-share dispersion. Coups inside one shoe are not independent
 * draws, so each carries less information than a fresh one; dividing the
 * counts by the design effect is what keeps the posterior from believing a
 * clustered sample more than it deserves.
 */
function posterior(sample = {}) {
  const { n = 0, coups = 0, ties = 0, q: qObserved, inflate } = sample;
  const deff = n && Number.isFinite(inflate) ? Math.max(1, inflate ** 2) : 1;

  const nEff = n ? n / deff : 0;
  const qObs = n ? qObserved : 0;              // undefined until a coup decides
  const a = PRIOR_A + qObs * nEff;
  const b = PRIOR_B + (1 - qObs) * nEff;
  const q = a / (a + b);
  const se = Math.sqrt((q * (1 - q)) / (a + b + 1));

  // Ties are counted over every coup, not just the decided ones. The same
  // clustering discount applies: it is measured on the Banker share, but what
  // it measures -- that coups in one shoe are not independent draws -- is a
  // property of the shoe, not of that one rate.
  const coupsEff = coups ? coups / deff : 0;
  const tieObs = coups ? ties / coups : 0;
  const tieA = TIE_PRIOR_A + tieObs * coupsEff;
  const tieB = TIE_PRIOR_B + (1 - tieObs) * coupsEff;
  const tie = tieA / (tieA + tieB);
  const decided = 1 - tie;

  const e = edges(q, tie);
  const pick = sidePick(q, se);
  const z = se > 0 ? Math.abs(q - SIDE_CROSSOVER) / se : 0;
  const sure = sideConfidence(n, qObs, deff, pick);

  return {
    q, se, tie, decided, z, pick, edge: e[pick],
    // The table's own share against the break-even lines, read as often as
    // the page reads it. A positive expectation is not a bet until this says
    // so too: see `backingCleared`.
    cleared: backingCleared(n, qObs, deff),
    informed: n > 0,
    // How much of the estimate is this table's own data rather than the prior.
    // The prior is deliberately heavy -- it is worth about seven thousand
    // coups -- which is why one result moves the number by thousandths of a
    // point. That is the estimate behaving as designed, but on screen it reads
    // as a stuck figure unless the weight behind it is stated.
    weight: nEff / (PRIOR_STRENGTH + nEff),
    n, coups,
    probability: { P: decided * (1 - q), B: decided * q, T: tie },
    // Read as often as the page reads it: see `sideConfidence`. `z` above is
    // the estimate's own distance, which the explanation beside it quotes.
    confidence: sure.level,
    confidenceScore: sure.score,
    moved: Math.abs(q - BASE_BANKER_SHARE),
  };
}

/**
 * What backing the recommendation would actually have come to.
 *
 * Not the probabilities again -- those are the prediction, and showing them a
 * second time relabelled says nothing new. This walks the corpus one coup at a
 * time and settles a wager on each: at every coup the pick is recomputed from
 * the coups *before* it only, a unit goes on that side, and the result is
 * added up. Nothing here sees a coup before betting on it, which is the whole
 * point -- scoring a pick against the data that produced it flatters it.
 *
 * A tie returns the stake, so it is neither a win nor a loss and does not
 * count as a bet. A Banker win pays 0.95 after commission; everything else
 * pays or costs one.
 *
 * `deff` is the clustering discount. It is estimated once over the whole
 * corpus rather than re-estimated at each coup: it says how much a shoe's
 * coups repeat each other, not which side is going to win, so it cannot leak
 * the answer -- and using it keeps this replay on the same footing as the
 * estimate the panel shows live.
 */
function replayPicks(sequences, { deff = 1, commission = 0.05, from = 0 } = {}) {
  const step = 1 / Math.max(1, deff);
  let a = PRIOR_A, b = PRIOR_B;

  // Coups before `from` still train the estimate -- they are what the pick is
  // made of -- but they are not settled. That is the difference between the
  // record of a wager somebody could have placed from a moment onwards and a
  // figure attached to everything a table ever did, and the two are not the
  // same evidence. Because the pick at each coup is computed from the coups
  // before it either way, settling only the tail gives exactly the numbers
  // somebody following the pick from that moment would have.
  let seen = 0;
  let bets = 0, wins = 0, losses = 0, pushes = 0, coups = 0;
  // The coup this replay settled last, so a reader can see what the pick just
  // did rather than only what every pick before it added up to.
  let last = null;
  let units = 0, peak = 0, drawdown = 0, best = 0, worst = 0;
  let bankerBets = 0, playerBets = 0;

  for (const seq of sequences) {
    // The shoe's own pattern before each coup: a sequence here is one shoe.
    const sides = patternSides(seq);
    for (let i = 0; i < seq.length; i += 1) {
      const outcome = seq[i];
      // decide on what was knowable at the time, by the rule the panel uses
      const q = a / (a + b);
      const se = Math.sqrt((q * (1 - q)) / (a + b + 1));
      const pick = sides[i] === "-" ? sidePick(q, se) : sides[i];
      const settling = seen >= from;
      seen += 1;
      if (settling) coups += 1;

      if (!settling) {
        // not ours to settle, but still ours to learn from
      } else if (outcome === "T") {
        pushes += 1;
        last = { pick, outcome, kind: "push", paid: 0, units };
      } else {
        bets += 1;
        if (pick === "B") bankerBets += 1; else playerBets += 1;
        let paid;
        if (outcome === pick) {
          wins += 1;
          paid = pick === "B" ? 1 - commission : 1;
          units += paid;
        } else {
          losses += 1;
          paid = -1;
          units -= 1;
        }
        last = { pick, outcome, kind: paid > 0 ? "win" : "lose", paid, units };
        peak = Math.max(peak, units);
        drawdown = Math.min(drawdown, units - peak);
        best = Math.max(best, units);
        worst = Math.min(worst, units);
      }

      // and only then learn from it
      // A tie decides nothing, so it moves neither side of the Banker share.
      if (outcome !== "T") {
        if (outcome === "B") a += step; else b += step;
      }
    }
  }

  return {
    last,
    from, trained: Math.min(from, seen), faced: seen,
    coups, bets, wins, losses, pushes, units, drawdown, best, worst,
    bankerBets, playerBets,
    winRate: bets ? wins / bets : 0,
    perBet: bets ? units / bets : 0,
  };
}

/**
 * What a stake actually comes to, per hand, per day, per month.
 *
 * The panel above this one reports an edge of a percent or so a hand, and a
 * percent of a hand is not a number anybody can plan against. This turns it
 * into the two things that are: money, and time.
 *
 * The interval is the point of it. A hand of baccarat has an expectation near
 * -0.011 units and a standard deviation near 0.93 -- eighty-seven times the
 * size -- so a day's play is almost entirely noise and a month's is still
 * mostly noise. Quoting the mean alone would turn that into a forecast, and
 * the forecast would be wrong in both directions: it would promise a steady
 * drip of losses to somebody who is about to have a good week, and it would
 * hide that the good week means nothing. The spread is what says how long it
 * takes before the edge is what you are actually seeing.
 *
 * `q` is the Banker share among decided coups and `tieP` the tie rate, both
 * from `posterior`. `side` is what a unit would be going on.
 */
function wagerMoments(q, tieP, side) {
  const decided = 1 - tieP;
  const pB = decided * q, pP = decided * (1 - q);
  // A tie returns the stake: neither a win nor a loss, and no variance either.
  const win = side === "B" ? 1 - BANKER_COMMISSION : 1;
  const pWin = side === "B" ? pB : pP;
  const pLose = side === "B" ? pP : pB;
  const mean = win * pWin - pLose;
  const second = win * win * pWin + pLose;
  return { mean, sd: Math.sqrt(Math.max(0, second - mean * mean)) };
}

/** 1.96 sigma, the same coverage every other interval in this app quotes. */
const Z95 = 1.96;

/**
 * The projection itself, one row per horizon.
 *
 * Hands compound the mean linearly and the spread as a square root, which is
 * the whole reason a losing game can look like a winning one for a month: over
 * n hands the edge grows as n and the noise as sqrt(n), so the noise leads
 * until n is large enough for the edge to overtake it. `breakEvenHands` is
 * where that happens -- where the 95% band finally stops containing zero, and
 * so the first honest answer to "how long until I know".
 */
function projectStake({ q, tieP, side = "B", unit = 1, bankroll = 0,
                               handsPerDay = 0, daysPerMonth = 0 } = {}) {
  const { mean, sd } = wagerMoments(q, tieP, side);
  const row = (hands) => {
    const m = mean * hands * unit;
    const half = Z95 * sd * Math.sqrt(hands) * unit;
    return {
      hands, mean: m, lo: m - half, hi: m + half,
      ofBankroll: bankroll > 0 ? m / bankroll : null,
    };
  };
  const perDay = Math.max(0, Math.round(handsPerDay));
  const perMonth = perDay * Math.max(0, Math.round(daysPerMonth));
  // Where the band stops straddling zero: |mean| n = 1.96 sd sqrt(n).
  const breakEvenHands = mean === 0 ? Infinity
    : Math.ceil((Z95 * sd / Math.abs(mean)) ** 2);
  return {
    perHand: mean * unit, sdPerHand: sd * unit, side, breakEvenHands,
    hand: row(1), day: row(perDay), month: row(perMonth),
  };
}

/**
 * How many more decided coups, at this share, would take the side named to
 * "high" -- on the line `sideConfidence` draws, which is the question the
 * label answers, so the count and the label cannot disagree.
 *
 * "Raise the confidence" has exactly one answer -- collect more -- and the
 * only useful thing the app can add is how much more. The line grows with the
 * count and the share's lead grows faster, so there is one crossing, found by
 * search over effective coups; a clustered record is told what its own coups
 * are worth.
 *
 * Null where the question has no answer: before anything has been decided,
 * for a share on the other side of the crossover from the side named, and
 * for one so near it that no session separates the two.
 */
/**
 * Past this, the answer is "no" rather than a number.
 *
 * The search will happily report that a share sitting a fifteenth of a point
 * off the crossover reaches high confidence in 2,215,028 coups. That is true
 * and it is useless: nobody plays two million hands, and printing the figure
 * dresses "never" up as a plan. The app's own collection panel tops out at
 * 1,178 shoes -- about 95,000 coups -- which is the most it asks anybody to
 * gather, so a count past that horizon is not a count worth quoting.
 */
const PRACTICAL_HORIZON = 100_000;
const SEARCH_CAP = 8_000_000;

function coupsForConfidence(sample = {}, pick = "B") {
  const { n = 0, q: qObserved, inflate } = sample;
  if (!n || !Number.isFinite(qObserved)) return null;
  const deff = Number.isFinite(inflate) ? Math.max(1, inflate ** 2) : 1;
  const lean = pick === "P" ? SIDE_CROSSOVER - qObserved : qObserved - SIDE_CROSSOVER;
  if (!(lean > 0)) return null;

  const reached = (nEff) => lean * nEff >= confidenceLines(nEff).high;
  const have = n / deff;
  if (reached(have)) return 0;
  if (!reached(SEARCH_CAP)) return null;               // never, at this share

  let lo = have, hi = SEARCH_CAP;
  for (let i = 0; i < 60; i += 1) {
    const mid = (lo + hi) / 2;
    if (reached(mid)) hi = mid; else lo = mid;
  }
  // Back out of effective coups into real ones: clustering means a real coup
  // is worth less than one, so more of them are needed.
  const need = Math.ceil((hi - have) * deff);
  return need > PRACTICAL_HORIZON ? null : need;
}

/* ═══ learn.js ═══ */
/* A network that learns from the table in front of it.
 *
 * The estimate this app recommends from is a conjugate posterior over one
 * number: how often this table's Banker side wins. It cannot express "Banker
 * after four Players", because it does not look at order at all. A network
 * can. Whether there is anything in the order to find is a different question,
 * and this file is built so that the answer it gives is trustworthy either way.
 *
 * Three properties make it trustworthy.
 *
 * Every prediction is made before the coup it predicts. The pass below walks
 * the table's coups in order and, at each one, predicts from what came before
 * and only then learns from what happened. Nothing it reports was scored with
 * knowledge of its own answer, which is the failure that makes most published
 * baccarat models look profitable.
 *
 * It is scored against the alternative, not against a coin. Beating 50% means
 * nothing here: always backing Banker wins about 50.7% of decided coups
 * without looking at anything. The pass therefore settles both wagers on the
 * same coups and reports both, so "better" means better than the thing it
 * would replace.
 *
 * And it is only believed when the margin is bigger than the noise. Over a few
 * hundred coups a worthless model beats a good one about half the time. The
 * gate at the bottom asks for a lead that a fair table would produce less than
 * about one time in forty, and for enough coups to ask the question at all.
 *
 * This repository's own backtest of 38 models over 1.6M coups returned no
 * model with positive ROI and none significant after correction, and the best
 * win rate of all of them belonged to always betting Banker. The honest
 * expectation is that the gate below stays shut.
 */



/** Coups of order the network is shown. */
/**
 * The network's own version, for the prediction log.
 *
 * Separate from the estimate's: the two are different rules and a record has
 * to say which one named the side, or a stretch where the network was trusted
 * is indistinguishable from a stretch where it was not.
 */
const NET_MODEL_VERSION = "net-1";

const CONTEXT = 6;
/** Inputs: the context one-hot, then the summaries, then a bias. */
const INPUTS = CONTEXT * 3 + 7;
/** Hidden units. Small on purpose: a few hundred coups cannot train more. */
const HIDDEN = 12;

const OUTCOMES = "PBT";

/**
 * The network's view of the coups before position `i`.
 *
 * Order first -- the last six outcomes, as they came -- then what the shoe has
 * looked like so far. The summaries are centred near zero and scaled to about
 * a unit, which is what keeps a small network's gradients well behaved.
 */
function features(seq, i, out = new Float64Array(INPUTS)) {
  out.fill(0);
  for (let k = 0; k < CONTEXT; k += 1) {
    const at = i - 1 - k;
    if (at < 0) continue;
    const code = OUTCOMES.indexOf(seq[at]);
    if (code >= 0) out[k * 3 + code] = 1;
  }

  let bankers = 0, decided = 0, ties = 0, alternations = 0;
  let last = null, streak = 0, streakSide = 0;
  for (let at = 0; at < i; at += 1) {
    const o = seq[at];
    if (o === "T") { ties += 1; continue; }
    decided += 1;
    if (o === "B") bankers += 1;
    if (last !== null && o !== last) alternations += 1;
    if (o === last) streak += 1; else streak = 1;
    last = o;
    streakSide = o === "B" ? 1 : -1;
  }

  const base = CONTEXT * 3;
  out[base] = Math.min(streak, 8) / 8;                       // how long the run is
  out[base + 1] = streakSide;                                // and whose it is
  out[base + 2] = decided ? (bankers / decided - 0.5) * 4 : 0;
  out[base + 3] = i ? (ties / i - 0.095) * 8 : 0;
  out[base + 4] = decided > 1 ? alternations / (decided - 1) - 0.5 : 0;
  out[base + 5] = Math.min(i, 80) / 80;                      // how deep the shoe is
  out[base + 6] = 1;                                         // bias
  return out;
}

/**
 * One hidden layer, trained by backpropagation, predicting Player or Banker.
 *
 * Ties are not predicted: the wager is settled on the decided coups and a tie
 * returns the stake, so a tie is not a class to choose between -- it is a coup
 * the bet sits out. It still enters the network as context, because the order
 * it appears in is part of what the network is being asked to read.
 */
class Net {
  constructor(seed = 1, { hidden = HIDDEN, decay = 1e-4 } = {}) {
    const rng = makeRng(seed);
    this.hidden = hidden;
    this.decay = decay;
    // Small symmetric weights, scaled by fan-in so the first outputs are near
    // even and the network is not saturated before it has seen anything.
    const spread = (n) => 1 / Math.sqrt(n);
    this.w1 = new Float64Array(INPUTS * hidden);
    this.w2 = new Float64Array(hidden * 2);
    for (let i = 0; i < this.w1.length; i += 1) this.w1[i] = (rng() * 2 - 1) * spread(INPUTS);
    for (let i = 0; i < this.w2.length; i += 1) this.w2[i] = (rng() * 2 - 1) * spread(hidden);
    this.b1 = new Float64Array(hidden);
    this.b2 = new Float64Array(2);
    this.h = new Float64Array(hidden);
    this.p = new Float64Array(2);
  }

  /** P(Player), P(Banker) for one feature vector, remembered for the update. */
  predict(x) {
    const { hidden, w1, w2, b1, b2, h, p } = this;
    for (let j = 0; j < hidden; j += 1) {
      let sum = b1[j];
      for (let i = 0; i < INPUTS; i += 1) sum += x[i] * w1[i * hidden + j];
      h[j] = Math.tanh(sum);
    }
    let a = b2[0], b = b2[1];
    for (let j = 0; j < hidden; j += 1) { a += h[j] * w2[j * 2]; b += h[j] * w2[j * 2 + 1]; }
    // Softmax over two, written as a logistic on the difference so a large
    // logit cannot overflow.
    const pb = 1 / (1 + Math.exp(a - b));
    p[0] = 1 - pb; p[1] = pb;
    return p;
  }

  /** One gradient step on the coup that just happened. `side` is 0 P, 1 B. */
  learn(x, side, lr) {
    const { hidden, w1, w2, b1, b2, h, p, decay } = this;
    const d2 = [p[0] - (side === 0 ? 1 : 0), p[1] - (side === 1 ? 1 : 0)];
    const dh = new Float64Array(hidden);
    for (let j = 0; j < hidden; j += 1) {
      dh[j] = (d2[0] * w2[j * 2] + d2[1] * w2[j * 2 + 1]) * (1 - h[j] * h[j]);
      w2[j * 2] -= lr * (d2[0] * h[j] + decay * w2[j * 2]);
      w2[j * 2 + 1] -= lr * (d2[1] * h[j] + decay * w2[j * 2 + 1]);
    }
    b2[0] -= lr * d2[0];
    b2[1] -= lr * d2[1];
    for (let i = 0; i < INPUTS; i += 1) {
      const xi = x[i];
      if (!xi) continue;
      for (let j = 0; j < hidden; j += 1) {
        const at = i * hidden + j;
        w1[at] -= lr * (dh[j] * xi + decay * w1[at]);
      }
    }
    for (let j = 0; j < hidden; j += 1) b1[j] -= lr * dh[j];
  }
}

/**
 * What one wager did, settled the way the table settles it.
 *
 * The same shape `replayPicks` keeps, because the panel reads whichever of the
 * two is being followed and must not care which one that is.
 */
function settleInto(book, pick, outcome, commission) {
  book.coups += 1;
  if (outcome === "T") {
    book.pushes += 1;
    book.last = { pick, outcome, kind: "push", paid: 0, units: book.units };
    return;
  }
  book.bets += 1;
  if (pick === "B") book.bankerBets += 1; else book.playerBets += 1;
  let paid;
  if (outcome === pick) {
    book.wins += 1;
    paid = pick === "B" ? 1 - commission : 1;
    book.units += paid;
  } else {
    book.losses += 1;
    paid = -1;
    book.units -= 1;
  }
  book.last = { pick, outcome, kind: paid > 0 ? "win" : "lose", paid, units: book.units };
  book.peak = Math.max(book.peak, book.units);
  book.drawdown = Math.min(book.drawdown, book.units - book.peak);
  book.best = Math.max(book.best, book.units);
  book.worst = Math.min(book.worst, book.units);
}

const empty = () => ({
  coups: 0, bets: 0, wins: 0, losses: 0, pushes: 0, units: 0,
  bankerBets: 0, playerBets: 0,
  peak: 0, drawdown: 0, best: 0, worst: 0, last: null,
});
const rate = (b) => (b.bets ? b.wins / b.bets : 0);
const perBet = (b) => (b.bets ? b.units / b.bets : 0);
const finish = (b) => ({ ...b, winRate: rate(b), perBet: perBet(b) });

/**
 * The training half of a walk-forward pass, kept resumable.
 *
 * Every value the loop carries -- the network, its replay buffer, the random
 * stream -- moves forward only, and `features(seq, i)` reads nothing past `i`.
 * So the state after coup n is exactly the state coup n+1 needs, and a corpus
 * that has only gained coups can be continued rather than replayed. That
 * matters because the alternative is what the panel used to do: re-train the
 * whole network on every single coup, which at eight hundred shoes cost three
 * quarters of a second per coup and grew from there without bound.
 *
 * What it produces is the network's pick for each coup, in order, decided
 * before that coup was learned from. The books are settled from that
 * separately, in `settleAll`, because the estimate they are compared against
 * depends on a clustering discount that moves as the corpus grows -- cheap to
 * redo in full, and wrong to freeze into a resumed run.
 */
function newRun({ seed = 7, lr = 0.05, replay = 4 } = {}) {
  return {
    opts: { seed, lr, replay },
    net: new Net(seed),
    rng: makeRng(seed ^ 0x5f3759df),
    past: [],                            // decided coups already seen: shoe, coup, shoe, coup...
    picks: [],                           // the network's pick for each coup, in order
    seen: [],                            // the sequences consumed, as consumed
    lastProbability: null,
    x: new Float64Array(INPUTS),
    mark: null,                          // the run as it stood before the open shoe
  };
}

/**
 * The run as it stands, before the shoe at index `s` is walked.
 *
 * What an undone coup costs is the question this answers. Continuing a run is
 * cheap because the pass only moves forward; anything that is not a pure
 * append -- a coup taken back, a coup corrected, a shoe shifted by one --
 * used to start the network again from nothing and retrain
 * it over the whole record. Measured at the collection panel's own target of
 * 1,178 shoes: 1,605ms for one undo, on a desktop, on the thread that draws
 * the page. A phone is several times slower, and an undo is the most ordinary
 * thing anyone does at a table.
 *
 * Nearly all of those changes land in the shoe being dealt, so one mark is
 * kept, taken as that shoe begins: the weights, where the generator had got
 * to, and how long the append-only lists were. Going back to it and walking
 * forward again touches one shoe instead of the record. About three
 * kilobytes, because the network is small; the lists are cut back rather than
 * copied, since nothing before the mark is ever changed.
 */
function checkpoint(run, s) {
  const { net } = run;
  return {
    s,
    w1: Float64Array.from(net.w1), w2: Float64Array.from(net.w2),
    b1: Float64Array.from(net.b1), b2: Float64Array.from(net.b2),
    rng: run.rng.state(),
    past: run.past.length,
    picks: run.picks.length,
    lastProbability: run.lastProbability,
  };
}

/**
 * Put the run back where `mark` found it, if the record allows.
 *
 * Only when every shoe before the mark is exactly the shoe the run walked:
 * the mark is a promise about everything before it, and a change further back
 * breaks it. Returns whether it went back; the caller starts again from
 * nothing when it did not.
 */
function rewind(run, sequences) {
  const m = run.mark;
  if (!m || sequences.length < m.s) return false;
  for (let i = 0; i < m.s; i += 1) {
    if (sequences[i] !== run.seen[i]) return false;
  }
  const { net } = run;
  net.w1.set(m.w1); net.w2.set(m.w2); net.b1.set(m.b1); net.b2.set(m.b2);
  run.rng.restore(m.rng);
  run.past.length = m.past;
  run.picks.length = m.picks;
  run.seen.length = m.s;
  run.lastProbability = m.lastProbability;
  return true;
}

/** True when `sequences` only adds coups to what `run` has already consumed. */
function extendsRun(run, sequences) {
  if (sequences.length < run.seen.length) return false;
  for (let i = 0; i < run.seen.length; i += 1) {
    const had = run.seen[i];
    const now = sequences[i];
    if (typeof now !== "string") return false;
    // Every shoe but the last is finished and must match exactly; the last one
    // is the open one, and may have grown.
    if (i < run.seen.length - 1 ? now !== had : !now.startsWith(had)) return false;
  }
  return true;
}

/**
 * Walk `run` forward over whatever `sequences` has that it has not seen.
 *
 * The replay buffer holds where each decided coup is -- its shoe and its
 * place in it -- and not a copy of what the network was shown there. It used
 * to hold the copy: a 25-number vector per coup, about 16 KB a shoe measured,
 * so 14 MB for a table of 900 shoes, twice over for the two tables the shelf
 * keeps, on a phone. The vector is a pure function of the shoe up to that
 * coup (`features` reads nothing past `i`), and every shoe the run has seen
 * is kept in `seen` and never changes behind it -- a change sends the run
 * back to its mark or to nothing, and the positions after that go with it.
 * So drawing a coup and computing its vector again gives the same numbers,
 * bit for bit, the network the same steps, and the panel the same answer.
 */
function advance(run, sequences) {
  const { lr, replay } = run.opts;
  const x = run.x;
  for (let s = 0; s < sequences.length; s += 1) {
    const seq = sequences[s];
    const from = s < run.seen.length ? run.seen[s].length : 0;
    // The open shoe, starting: this is where an undo will want to come back to.
    if (s === sequences.length - 1 && from === 0) run.mark = checkpoint(run, s);
    // Before its coups, not after: a replay can draw from the shoe being walked.
    run.seen[s] = seq;
    for (let i = from; i < seq.length; i += 1) {
      features(seq, i, x);
      const p = run.net.predict(x);
      run.picks.push(p[1] >= p[0] ? "B" : "P");
      run.lastProbability = { P: p[0], B: p[1] };

      // Only now may the coup be learned from.
      const outcome = seq[i];
      if (outcome !== "T") {
        run.net.learn(x, outcome === "B" ? 1 : 0, lr);
        run.past.push(s, i);
        const held = run.past.length / 2;
        for (let r = 0; r < replay && held > 1; r += 1) {
          const k = ((run.rng() * held) | 0) * 2;
          const shoe = run.seen[run.past[k]];
          const at = run.past[k + 1];
          // `x` is free again: this coup has been learned from, and the next
          // one fills it afresh.
          features(shoe, at, x);
          run.net.predict(x);
          run.net.learn(x, shoe[at] === "B" ? 1 : 0, lr);
        }
      }
    }
  }
  return run;
}

/**
 * Settle both books over the record, given the picks the network made.
 *
 * The estimate's own pick is recomputed here rather than carried, because the
 * clustering discount it counts with moves as the corpus grows.
 */
function settleAll(sequences, picks, { commission = BANKER_COMMISSION, deff = 1, from = 0 } = {}) {
  const step = 1 / Math.max(1, deff);
  const model = empty(), base = empty();
  let a = PRIOR_A, b = PRIOR_B;
  let coups = 0, agree = 0, decided = 0, split = 0, seen = 0;

  for (const seq of sequences) {
    // The rule the network would replace reads the shoe's own pattern.
    const sides = patternSides(seq);
    for (let i = 0; i < seq.length; i += 1) {
      const modelPick = picks[seen];
      // Coups before the mark are what the two are made of, not what either is
      // judged on. Settling only the tail is the record of following the pick
      // from that moment, which is a different claim from a figure attached to
      // everything the table ever did -- and the stronger one, because nobody
      // was there for the rest of it.
      const settling = seen >= from;
      seen += 1;
      if (settling) coups += 1;

      const q = a / (a + b);
      const se = Math.sqrt((q * (1 - q)) / (a + b + 1));
      const basePick = sides[i] === "-" ? sidePick(q, se) : sides[i];

      const outcome = seq[i];
      if (settling) {
        if (modelPick === basePick) agree += 1;
        // Only a settled coup separates them: on a tie both stakes come back
        // whoever picked what, so it carries no evidence either way.
        else if (outcome !== "T") split += 1;

        settleInto(model, modelPick, outcome, commission);
        settleInto(base, basePick, outcome, commission);
      }

      if (outcome !== "T") {
        // Every decided coup trains, mark or no mark, and `decided` is what
        // the panel means by "trained on". Counting only the settled ones told
        // a table that had just been marked that the network had learned from
        // nothing, while it had in fact learned from all of it.
        decided += 1;
        if (outcome === "B") a += step; else b += step;
      }
    }
  }
  return { model, base, coups, agree, decided, split, from, faced: seen };
}

/** What the panel reads: both books, the comparison, and the coup to come. */
function report(run, sequences,
                { commission = BANKER_COMMISSION, deff = 1, next = null, from = 0 } = {}) {
  const { model, base, coups, agree, decided, split, faced } =
    settleAll(sequences, run.picks, { commission, deff, from });

  // The coup that has not happened yet, which is what the panel recommends on.
  // The last pick in the record is the pick that was made for the coup at the
  // end of it -- a different question, and the one the panel was accidentally
  // asking.
  const upcoming = next === null ? (run.seen[run.seen.length - 1] || "") : next;
  let nextPick = null, nextProbability = null;
  if (coups) {
    features(upcoming, upcoming.length, run.x);
    const p = run.net.predict(run.x);
    nextPick = p[1] >= p[0] ? "B" : "P";
    nextProbability = { P: p[0], B: p[1] };
  }

  return {
    coups, decided, from, faced,
    nextPick, nextProbability,
    model: finish(model),
    base: finish(base),
    agree, agreement: coups ? agree / coups : 0,
    split,
    lastPick: run.picks.length ? run.picks[run.picks.length - 1] : null,
    lastProbability: run.lastProbability,
    ...verdict(model, base, split),
  };
}

/**
 * Walk the table's coups once, learning as it goes, and score the network
 * against the estimate it would replace.
 *
 * At every coup the network predicts from the coups before it, that prediction
 * is settled, and only then does the coup become training data. The posterior
 * it is compared against is advanced on exactly the same coups, so the two
 * books are the same wager placed two ways.
 *
 * `replay` extra gradient steps are taken per coup on coups drawn from the
 * past. A few hundred examples seen once each teach a network almost nothing;
 * drawing from what has already happened is how it gets to see them enough
 * times without ever seeing what has not happened yet.
 */
function walkForward(sequences, {
  seed = 7, lr = 0.05, replay = 4, commission = BANKER_COMMISSION, deff = 1,
  next = null,
} = {}) {
  const run = advance(newRun({ seed, lr, replay }), sequences);
  return report(run, sequences, { commission, deff, next });
}

/**
 * A walk-forward pass that is kept between calls.
 *
 * `update` continues the run when the corpus has only gained coups, and starts
 * over when it has not -- a coup undone, a table switched to, a pile of
 * screenshots imported. The result is the same object `walkForward` returns,
 * because it is built by the same two functions; the test suite pins that by
 * feeding a `Learner` one coup at a time and comparing.
 */
class Learner {
  constructor(options = {}) {
    this.options = options;
    this.run = newRun(options);
    this.restarts = 0;
    this.resumes = 0;
    this.rewinds = 0;
  }

  update(sequences, { commission = BANKER_COMMISSION, deff = 1, next = null, from = 0 } = {}) {
    if (extendsRun(this.run, sequences)) this.resumes += 1;
    // A successful rewind leaves exactly the shoes before the mark, and those
    // are what it checked -- so the run extends to `sequences` by construction
    // and asking `extendsRun` again would only repeat the question.
    else if (rewind(this.run, sequences)) this.rewinds += 1;
    else { this.run = newRun(this.options); this.restarts += 1; }
    advance(this.run, sequences);
    return report(this.run, sequences, { commission, deff, next, from });
  }

  /**
   * Both books settled from coup `from` on, over the record `update` was last
   * given -- the picks are the ones that walk made, so nothing is trained.
   * The ledger on screen can count less of the record than the network is
   * judged on: one shoe of it, while the question of whether the network has
   * earned the wheel is asked over all of it.
   */
  settle(sequences, { commission = BANKER_COMMISSION, deff = 1, from = 0 } = {}) {
    const { model, base, coups } = settleAll(sequences, this.run.picks, { commission, deff, from });
    return { model: finish(model), base: finish(base), coups };
  }
}


/**
 * A learner per table, the most recent few kept.
 *
 * The page kept one learner for whichever table was on screen, so every
 * switch was a record that had not merely grown -- a different record -- and
 * the network was retrained over the whole of it, both ways. Measured at 600
 * shoes a table: 865ms to switch, 743ms to switch back, on a desktop, on the
 * thread that draws the page. Two tables in front of you is the reason the
 * page names for opening a second tab, and one tab with a selector is the
 * other way of doing the same thing.
 *
 * Keeping a learner per table makes a switch back cost nothing, and it is
 * always safe to keep one: `update` compares the record it is given with the
 * record it walked, so a table that changed while it was not on screen -- a
 * live reader bound to it, another tab -- is resumed, rewound or
 * rebuilt exactly as it would be on screen.
 *
 * Two by default, the two tables in front of you. Each learner holds about
 * 1 KB a shoe -- where its replayed coups are, not copies of them; see
 * `advance` -- which at the collection target of over a thousand shoes a
 * table is about a megabyte. The least recently used goes first, and a
 * table it lets go of is simply rebuilt the next time it is shown.
 */
class LearnerShelf {
  constructor(kept = 2, options = {}) {
    this.kept = Math.max(1, kept | 0);
    this.options = options;
    this.byTable = new Map();              // insertion order is recency
  }

  /** The learner for `table`, made if it is not held, and now the most recent. */
  for(table) {
    const key = String(table);
    let held = this.byTable.get(key);
    if (held) this.byTable.delete(key);
    else held = new Learner(this.options);
    this.byTable.set(key, held);
    while (this.byTable.size > this.kept) {
      this.byTable.delete(this.byTable.keys().next().value);
    }
    return held;
  }

  /** A table renamed keeps what it learned; nothing about it changed but a label. */
  rename(from, to) {
    const held = this.byTable.get(String(from));
    if (!held) return;
    this.byTable.delete(String(from));
    this.byTable.set(String(to), held);
  }

  /** A table cleared or deleted takes its learner with it. */
  forget(table) {
    this.byTable.delete(String(table));
  }
}

/**
 * How far ahead the network has to be, over `split` disagreements, before it
 * is trusted.
 *
 * The page asks after every coup, so the question is not whether a lead is
 * unusual at one look but whether a network with no edge would ever reach
 * it. A fixed z of 2.5 -- one time in 160 at a single look -- was reached at
 * some point by a network with no edge in 4.1% of sessions by a thousand
 * disagreements and 8.9% by twenty thousand, measured; and each time, the
 * panel said the network was ahead by more than chance would give.
 *
 * This is Robbins' normal-mixture boundary. For heads minus tails over n fair
 * tosses, the chance it ever reaches sqrt((n + RHO)(2 ln(1/ALPHA) + ln((n +
 * RHO)/RHO))) is at most ALPHA, however long it runs and however often it is
 * looked at (Ville's inequality). Measured, a network with no edge crossed
 * it at some point in 0.37% of sessions by a thousand disagreements, 0.90%
 * by five thousand and 1.07% by twenty thousand -- against 4.1%, 6.6% and
 * 8.9% for the fixed 2.5 on the same kind of walk.
 * RHO sets where it is tightest: it asks for z 4.45 at the floor of 200, 3.32
 * at a thousand, and grows only like a logarithm after that. The price is
 * time -- a network winning 55% of the disagreements is trusted after a
 * median of 913 of them rather than 454 -- and it is the price of the
 * sentence on screen being true. A tie among the disagreements settles
 * neither side and moves nothing, which only makes the walk tamer than the
 * one the bound is for.
 */
const TRUST_ALPHA = 0.025;
const TRUST_RHO = 200;
/** Disagreements below which the question is not asked at all; see `verdict`. */
const TRUST_FLOOR = 200;

function trustBoundary(split) {
  return mixtureBoundary(split, TRUST_ALPHA, TRUST_RHO);
}

/**
 * Whether the network's lead is bigger than the noise it would show anyway.
 *
 * The two bet on the same coups, so the comparison is paired: where they agree
 * they win and lose together and nothing is learned, and where they disagree
 * exactly one of them wins. So the evidence is entirely in the `split` coups
 * they picked differently, and under "the two are equally good" the number the
 * network takes of those is a fair coin -- its win count minus the estimate's
 * is heads minus tails, held to `trustBoundary`.
 *
 * The floor of 200 is there because below it the test has almost no power, and
 * a decision made on less is a coin flip wearing a number.
 */
function verdict(model, base, split = 0) {
  const swing = model.wins - base.wins;
  const z = split > 0 ? swing / Math.sqrt(split) : 0;
  const ahead = model.units > base.units && split >= TRUST_FLOOR && swing >= trustBoundary(split);
  return {
    lead: model.units - base.units,
    z,
    // The z the boundary asks for at this many disagreements, to say beside
    // a lead that has not reached it.
    bar: split > 0 ? trustBoundary(split) / Math.sqrt(split) : NaN,
    trusted: ahead,
    reason: ahead ? "ahead"
      : split < TRUST_FLOOR ? "tooFew"
      : model.units <= base.units ? "behind"
      : "noise",
  };
}

/* ═══ verify.js ═══ */
/* What the app actually said, and whether it was right.
 *
 * The panel above this one already reports a record: it replays the pick rule
 * over the stored sequence, walk-forward, and counts. That is honest and it is
 * not the same thing. A replay is computed by today's code from today's
 * thresholds, so it answers "what would this build have said", and it changes
 * underneath you whenever the build does. It cannot answer "was the thing on
 * my screen last Tuesday right", because nothing on screen last Tuesday was
 * written down.
 *
 * This writes it down. Every recommendation is logged at the moment it is
 * made -- the three probabilities, the side, whether backing it was judged
 * worthwhile, and the versions of the code that produced it -- and it is
 * settled later, when the coup it was about actually arrives. The two events
 * are separate by construction, which is the only structural guarantee against
 * scoring a prediction with the answer already in hand.
 *
 * Nothing here decides anything. It records, it settles, and it counts; the
 * counting is done with proper scoring rules rather than hit rate alone,
 * because hit rate on its own cannot tell a confident model from a lucky one.
 */


/** Storage format. Bumped only when a stored entry would be read wrongly. */
const LOG_VERSION = 1;

/**
 * Entries kept per table before the oldest are rolled into a total.
 *
 * A coup is about a hundred bytes here, so this is a couple of hundred
 * kilobytes at the cap -- room for a season of play in a store that also has
 * to hold the shoes themselves. What is evicted is not lost: its contribution
 * to every figure below is added to `rolled` first, so the totals stay exact
 * and only the coup-by-coup list is finite.
 */
const LOG_CAP = 2000;

/**
 * And the hard limit, past which even unsettled predictions are given up.
 *
 * Twice the cap, which is a backlog no table watched by a person produces:
 * coups arrive, predictions settle, and the list stays at the cap. Reaching
 * this means the coups stopped coming, and the predictions waiting on them are
 * never going to be scored.
 */
const LOG_CEILING = LOG_CAP * 2;

/** Calibration bins: the named side's chance of winning a decided coup. */
const CALIBRATION_BINS = 10;

/** An empty log, which is also the shape `sanitiseLog` returns for rubbish. */
function emptyLog() {
  return { v: LOG_VERSION, tables: {} };
}

/** An empty roll-up: every figure the scorer needs, and nothing else. */
function emptyRoll() {
  return {
    n: 0, settled: 0, decided: 0, hits: 0, baseHits: 0, against: 0,
    backed: 0, backedDecided: 0, backedHits: 0, abstained: 0,
    logLoss: 0, brier: 0,
    // Per tenth of stated probability: how many, how many came in, and the
    // sum of what was stated -- so a bin is held to what it was told rather
    // than to its midpoint. Named `cal`, not the `bins` an older build stored:
    // those were filled from a different probability and cannot be added in.
    cal: Array.from({ length: CALIBRATION_BINS }, () => ({ n: 0, hits: 0, said: 0 })),
  };
}

const tableLog = (log, table) => (log.tables[table] ||= { entries: [], rolled: emptyRoll() });

/**
 * Write down a recommendation, once.
 *
 * Keyed by the coup it is about -- the shoe it belongs to and how many coups
 * that shoe held when it was made -- so the same coup cannot be predicted
 * twice. That matters more than it looks: the panel re-renders on every
 * sample, on every language change, on every window resize, and a log that
 * appended each time would report the same coup dozens of times and weight it
 * accordingly.
 *
 * Returns true when something was written, false when this coup already had a
 * prediction, which is the ordinary case.
 *
 * The name is long because the built page is one concatenated scope: a plain
 * `record`, `settle` or `score` here collides with a module that already has
 * one, and the build refuses rather than let the survivor win silently.
 */
function recordPrediction(log, table, entry) {
  if (!table || !entry || !entry.shoe) return false;
  const t = tableLog(log, table);
  const at = entry.index | 0;
  // Backwards: a re-render is about the coup at the end, which is the one
  // written last.
  for (let i = t.entries.length - 1; i >= 0; i -= 1) {
    const e = t.entries[i];
    if (e.s === entry.shoe && e.i === at) return false;
    // The list is in the order the coups arrived, so once it is behind this
    // shoe there is nothing left to find.
    if (e.s !== entry.shoe) break;
  }
  t.entries.push({
    s: entry.shoe,
    i: at,
    p: [round6(entry.player), round6(entry.banker), round6(entry.tie)],
    k: entry.pick,                    // "B" | "P"
    b: entry.backed ? 1 : 0,          // was backing it judged worth it
    c: Math.round(entry.confidence ?? 0),
    m: String(entry.model || ""),
    f: String(entry.features || ""),
    t: entry.at || Date.now(),
    r: null,                          // the outcome, once it is known
    // The shoe it was made from, up to the coup it is about (see `basisOf`).
    h: typeof entry.basis === "string" ? basisOf(entry.basis) : "",
  });
  trim(t);
  return true;
}

/**
 * A fingerprint of the coups a prediction was made from: the shoe up to the
 * coup it is about.
 *
 * The live reader rewrites what it wrote when the screen says otherwise -- a
 * coup taken back that an ask button only previewed, an end read wrong once
 * and put right -- and the prediction for the coup after it was made from
 * the history that turned out not to be. The log keeps the first prediction
 * for each coup, so that one was the one scored: measured in the page, three
 * ask previews in a shoe left three predictions in the record made from coups
 * that were never dealt, and none of them the one on screen when the coup
 * was decided. With the history it came from fingerprinted, a prediction
 * still waiting for its coup is let go once that history changes, and the
 * page records the one it makes from the shoe as it stands.
 *
 * FNV-1a, 32 bits, in base 36: six or seven characters an entry.
 */
function basisOf(seq) {
  let h = 0x811c9dc5;
  for (let i = 0; i < seq.length; i += 1) {
    h ^= seq.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(36);
}

/** Six places is finer than any figure this shows and keeps the store small. */
const round6 = (x) => (Number.isFinite(x) ? Math.round(x * 1e6) / 1e6 : 0);

/**
 * Bring the log into line with the record: settle what has happened, and let
 * go of what has been taken back.
 *
 * Driven from the shoes rather than from an event, so a reload, a sync from
 * another tab, or an import all settle what they brought with them.
 *
 * The taking-back half is not a nicety. Undo exists because a coup was
 * mistyped or was never dealt, and a prediction settled against a coup that
 * has since been withdrawn is scored against something that did not happen --
 * so it goes, and so does its contribution. Correcting a coup rather than
 * removing it re-settles instead: the prediction was still made before that
 * coup either way, and the outcome it should be scored on is the one that is
 * now in the record.
 *
 * What is never touched is the prediction itself. Only its outcome moves, and
 * only to follow the record.
 *
 * Returns how many entries changed.
 */
/**
 * Move entries back into line when a shoe gains or loses a coup in the middle.
 *
 * A prediction is anchored to a position in a string, and a position is not an
 * identity. While a shoe only ever grows at its end, the two are the same
 * thing; the moment a coup arrives in the middle, every anchor after it points
 * at the coup next door, and `settlePredictions` quietly rescores each of them
 * against a coup it was never about.
 *
 * Measured, on a sixty-coup shoe whose reader later found a coup it had missed
 * at position twelve: thirty-one of the sixty settled predictions had their
 * recorded outcome rewritten, the function reported thirty-one settled, and
 * nothing anywhere said that the score had just changed meaning. The live
 * reader cannot do this -- `diagnose` refuses a reading that does not share a
 * prefix -- but the room this page once had could, and did: it took the
 * room's copy whole, and a room whose other reader dropped a coup handed back
 * a shoe shifted by one. The room is gone; a corpus that arrives from
 * somewhere else, another tab's copy among them, can still do the same.
 *
 * What the log already holds is enough to detect it. Every settled entry
 * records the outcome it was settled to, so the entries *are* the shoe as this
 * device believed it. Where the first settled entry stops matching the
 * sequence at its own index, exactly two single-coup explanations exist, and
 * each is checked against every settled entry rather than the first few: one
 * coup arrived before here, or one went away. If exactly one holds for all of
 * them, the anchors are moved and every prediction stays attached to the coup
 * it was about.
 *
 * It does not guess past that. Two shifts, or a shift tangled with a genuine
 * correction, leaves the entries where they are and the old behaviour applies
