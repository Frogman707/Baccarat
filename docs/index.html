  order.forEach((idx, rank) => {
    running = Math.max(running, (m - rank) * raw[idx]);
    holm[idx] = Math.min(running, 1);
  });

  const bh = new Array(m);
  running = 1;
  for (let rank = m - 1; rank >= 0; rank--) {
    const idx = order[rank];
    running = Math.min(running, (m * raw[idx]) / (rank + 1));
    bh[idx] = Math.min(running, 1);
  }

  names.forEach((name, i) => {
    out[name] = {
      p_raw: raw[i], p_holm: holm[i], p_bh: bh[i],
      significant_holm: holm[i] < alpha, significant_bh: bh[i] < alpha,
    };
  });
  return out;
}

/* ----------------------------------------------------------------- report */

function quantile(sorted, q) {
  if (!sorted.length) return NaN;
  const pos = (sorted.length - 1) * q;
  const lo = Math.floor(pos), hi = Math.ceil(pos);
  return lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
}

/**
 * Whether a verdict already on screen still describes what is on screen.
 *
 * A verdict is about one table's corpus at one moment, and the panel that
 * prints it -- the wording, the seventeen findings, the shoes it covered --
 * names neither. So the question has four answers, not two:
 *
 *   "none"     nothing has been measured yet
 *   "running"  a run is in progress and owns the panel; putting the previous
 *              verdict back would answer the question being asked right now
 *   "other"    measured on a different table: not stale, just not about this
 *              one, and it comes back if that table is selected again
 *   "stale"    this table, further along -- still true of the corpus it
 *              covered, so it is kept and labelled rather than thrown away
 *   "current"  this table, unchanged since
 *
 * Staleness is measured against the table's own corpus, not against a counter
 * of everything the page has done. Those are not the same question: looking at
 * another table and coming back changes the second and not the first, and a
 * verdict marked stale on the way back is telling the viewer their table has
 * moved on when it has not.
 */
function verdictStanding(shown, activeTable, coups, running) {
  if (!shown) return "none";
  if (running) return "running";
  if (shown.table !== activeTable) return "other";
  return shown.coups === coups ? "current" : "stale";
}

/**
 * Test a corpus against honestly simulated shoes of the same shape.
 * `shoes` is an array of "PBT" strings, one per shoe.
 */
function integrityReport(shoes, nullSamples, { alpha = 0.05, nReplicates = 0 } = {}) {
  const nShoes = shoes.length;
  if (nShoes < 3) throw new Error(`the integrity battery needs at least 3 shoes, got ${nShoes}`);

  const observed = computeStatistics(shoes);
  const findings = [];

  for (const [key, value] of Object.entries(observed)) {
    let samples = nullSamples[key];
    if (!samples || !Number.isFinite(value)) continue;
    samples = samples.filter(Number.isFinite);
    if (samples.length < 10) continue;

    // A statistic the shape alone decides comes out the same in every honest
    // corpus of that shape -- coups per shoe, when every shoe is part of one.
    // It is not a test of this record: counting it as one passed would add a
    // check that could not fail. Asked of the values, not of their spread:
    // 50.6 two hundred times over does not average to exactly 50.6, and the
    // sd of that is a rounding error that turns into a z-score.
    if (Math.min(...samples) === Math.max(...samples)) continue;
    const m = mean(samples);
    const variance = samples.reduce((a, x) => a + (x - m) ** 2, 0) / (samples.length - 1);
    const sd = Math.sqrt(variance);
    const z = (value - m) / sd;
    // Empirical two-sided p: how often the null is at least this extreme.
    const extreme = samples.filter((x) => Math.abs(x - m) >= Math.abs(value - m)).length;
    const p = (1 + extreme) / (samples.length + 1);
    const sorted = samples.slice().sort((a, b) => a - b);

    findings.push({
      statistic: key, observed: value, null_mean: m, null_sd: sd, z, p_two_sided: p,
      null_q025: quantile(sorted, 0.025), null_q975: quantile(sorted, 0.975),
    });
  }

  const pmap = {};
  for (const f of findings) pmap[f.statistic] = f.p_two_sided;
  const corrections = adjustPvalues(pmap, alpha);
  const flagged = findings.filter((f) => corrections[f.statistic]?.significant_bh);

  const nCoups = shoes.reduce((a, s) => a + s.length, 0);
  // In whole shoes' worth: a record of pieces has the power of its coups.
  // And at the null's own size, read from the null rather than taken on
  // trust from the caller: 100 replicates is a less sensitive test than 200.
  const worth = wholeShoes(shoes);
  const replicates = Math.max(0, ...Object.values(nullSamples).map((v) => v.length || 0));
  const bias = detectableBias(worth, { replicates });
  const enough = bias <= BANKER_BREAKEVEN_GAP;

  // The verdict is three facts, not a sentence: a deviation was found; or none
  // was and the sample is large enough for that to mean something; or none was
  // and it is not. Which words carry that belongs to the interface layer.
  const kind = flagged.length ? "flag" : enough ? "clean" : "insufficient";

  return {
    n_games: nCoups, n_shoes: nShoes, n_replicates: nReplicates,
    findings: findings.sort((a, b) => Math.abs(b.z || 0) - Math.abs(a.z || 0)),
    corrections,
    verdict_kind: kind,
    flagged: flagged.map((f) => f.statistic),
    detectable_bias: bias,
    sufficient: enough,
    breakeven_gap: BANKER_BREAKEVEN_GAP,
    whole_shoes: worth,
    // In shoes like these, the way the server says it: closing a factor in
    // detectable bias costs its square in shoes. For a record of whole shoes
    // this is `shoesForBias` exactly.
    shoes_needed: Math.ceil(nShoes * (bias / BANKER_BREAKEVEN_GAP) ** 2),
  };
}

/* ═══ shoes.js ═══ */
/* What each shoe did on its own.
 *
 * The aggregate hides the one thing people most want to look at and most
 * often misread: a single shoe. A 68-coup shoe decides about 61 coups, so its
 * Banker share carries a standard error near 6.4 percentage points -- five
 * times the entire dead band between the two break-even lines. A shoe that
 * came in at 60% Banker is a shoe one and a half standard errors from fair,
 * which is to say an ordinary shoe.
 *
 * So this module produces the per-shoe numbers together with the two figures
 * that stop them being misread: how far each shoe sits from fair in standard
 * errors of its own length, and how many shoes an honest table would put past
 * that cut anyway. A table of 40 shoes is expected to show about two outside
 * two sigma. Finding two is not a finding.
 */


/** Standard errors from fair at which a shoe is called out. */
const Z_FLAG = 2;

/**
 * Share of honest shoes landing outside +-Z_FLAG by chance alone: 2(1-Phi(2)).
 * Written out rather than derived so the expectation the interface quotes
 * cannot drift from the cut the rows are marked against.
 */
const FLAG_RATE = 0.04550026389635842;

/** A shoe short of this is not scored: its share is noise at any table. */
const MIN_SHOE_COUPS = 20;
/** Fewer shoes than this and the dispersion ratio means nothing. */
const MIN_SHOES = 5;

/**
 * One shoe's own numbers.
 *
 * `z` uses the null share in its standard error rather than the shoe's own,
 * which is the ordinary score test: it keeps the scale finite for a shoe that
 * went entirely one way, where the observed-share error would be zero and
 * every such shoe would read as infinitely significant.
 */
function shoeRow(sequence, index = 0) {
  const road = new BigRoad();
  let banker = 0, player = 0, ties = 0, changes = 0, last = null;

  for (const ch of sequence) {
    road.add(ch);
    if (ch === "T") { ties += 1; continue; }
    if (ch === "B") banker += 1; else player += 1;
    if (last !== null && ch !== last) changes += 1;
    last = ch;
  }

  const n = banker + player;
  const q = n ? banker / n : NaN;
  const se = n ? Math.sqrt((BASE_BANKER_SHARE * (1 - BASE_BANKER_SHARE)) / n) : NaN;
  const lengths = road.columnLengths;

  return {
    index,
    coups: sequence.length,
    banker, player, ties,
    n, q, se,
    z: n ? (q - BASE_BANKER_SHARE) / se : NaN,
    longest: lengths.length ? Math.max(...lengths) : 0,
    columns: lengths.length,
    chop: n > 1 ? changes / (n - 1) : NaN,
  };
}

/**
 * Spread of the per-shoe shares against the spread honest sampling produces.
 *
 * Deliberately the same arithmetic as `shoeShareDispersion` in integrity.js --
 * the same weighting, the same two thresholds -- so the ratio shown beside the
 * table is the statistic the battery tests, not a second opinion on it. The
 * test suite pins the two against each other.
 */
function spread(rows) {
  const use = rows.filter((r) => r.n >= MIN_SHOE_COUPS);
  if (use.length < MIN_SHOES) {
    return { ratio: NaN, sd: NaN, expected: NaN, mean: NaN, shoes: use.length };
  }
  const wTotal = use.reduce((a, r) => a + r.n, 0);
  const mean = use.reduce((a, r) => a + r.q * r.n, 0) / wTotal;
  const observed = use.reduce((a, r) => a + (r.q - mean) ** 2 * r.n, 0) / wTotal;
  const expected = (mean * (1 - mean)) / (wTotal / use.length);
  return {
    ratio: expected > 0 ? observed / expected : NaN,
    sd: Math.sqrt(observed),
    expected: Math.sqrt(expected),
    mean,
    shoes: use.length,
  };
}

/** What the whole set of shoes says, and what an honest one would have said. */
function summarise(rows) {
  const scored = rows.filter((r) => Number.isFinite(r.z) && r.n >= MIN_SHOE_COUPS);
  const decided = scored.reduce((a, r) => a + r.n, 0);
  const meanDecided = scored.length ? decided / scored.length : NaN;

  return {
    shoes: rows.length,
    coups: rows.reduce((a, r) => a + r.coups, 0),
    scored: scored.length,
    decided,
    meanDecided,
    // The half-width of the band a typical shoe of this table falls inside
    // 95% of the time, when the table is honest.
    bandSe: scored.length
      ? Math.sqrt((BASE_BANKER_SHARE * (1 - BASE_BANKER_SHARE)) / meanDecided)
      : NaN,
    outside: scored.filter((r) => Math.abs(r.z) >= Z_FLAG).length,
    expectedOutside: scored.length * FLAG_RATE,
    longest: rows.reduce((a, r) => Math.max(a, r.longest), 0),
    spread: spread(rows),
  };
}

/** Every shoe in the order it was dealt, with the summary that reads them. */
function shoeTable(sequences) {
  const rows = sequences.map((o, i) => shoeRow(o, i));
  return { rows, summary: summarise(rows) };
}

/** How the table can be ordered. Ties break on shoe order, so it is stable. */
const SORTS = {
  order: (a, b) => a.index - b.index,
  share: (a, b) => (b.q || 0) - (a.q || 0) || a.index - b.index,
  streak: (a, b) => b.longest - a.longest || a.index - b.index,
  chop: (a, b) => (b.chop || 0) - (a.chop || 0) || a.index - b.index,
  coups: (a, b) => b.coups - a.coups || a.index - b.index,
  far: (a, b) => Math.abs(b.z || 0) - Math.abs(a.z || 0) || a.index - b.index,
};

/**
 * `rows` in the requested order.
 *
 * Shoe order runs newest first, because that is the end of the table someone
 * watching a live shoe is looking at; every other order is largest first and
 * already puts what it ranks on at the top.
 */
function sortRows(rows, key = "order") {
  // Resolve the key before deciding on the reverse, or an unrecognised one
  // falls back to the shoe-order comparator and then skips the flip that
  // makes shoe order mean newest first.
  const use = SORTS[key] ? key : "order";
  const out = rows.slice().sort(SORTS[use]);
  return use === "order" ? out.reverse() : out;
}

/* ═══ detect.js ═══ */
/* Read a baccarat board off a screenshot.
 *
 * The bead plate is the easiest thing on a baccarat screen to read mechanically
 * and the most valuable: it is a dense grid of solid coloured circles carrying
 * every coup in order, ties included. Nothing here touches a network or a
 * casino's markup -- it is image analysis of a picture the user already has, so
 * it works on any operator's layout, and on a photo of a screen as readily as
 * on a screen capture.
 *
 * The pipeline is deliberately conventional: classify pixels by hue, label
 * connected components, keep the round ones, fit them to a grid, then pick the
 * densest six-row group. Every stage is exposed on the result so the UI can
 * draw what it found and let a person correct it -- the detector proposes, the
 * operator confirms.
 */

/** Mark codes. 0 is "not a mark". */
const NONE = 0, BANKER = 1, PLAYER = 2, TIE = 3;
const CODE_TO_OUTCOME = { 1: "B", 2: "P", 3: "T" };

/** Longest edge the detector works at. Bigger inputs are scaled down first. */
const WORK_MAX = 1400;

/**
 * Classify one pixel by hue, after rejecting anything too dark or too grey to
 * be a board mark. The three hue windows are wide because operators differ --
 * banker red runs #c62828 to #ff4444, player blue #0d47a1 to #4a9eff -- but
 * they leave orange, purple and yellow unclassified, which keeps chrome,
 * badges and dealer photos out of the grid.
 */
function classifyPixel(r, g, b) {
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  if (max < 55 || d < 38 || d / max < 0.32) return NONE;

  let h;
  if (max === r) h = ((g - b) / d) % 6;
  else if (max === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  h = (h * 60 + 360) % 360;

  if (h < 22 || h >= 336) return BANKER;
  if (h >= 80 && h < 186) return TIE;
  if (h >= 186 && h < 266) return PLAYER;
  return NONE;
}

/**
 * A blob that is several marks run together, judged against the marks that
 * did come through on their own.
 *
 * Solid, at least two marks across in some direction, and no bigger than a
 * board -- so a banner or a border, which is neither a whole number of marks
 * wide nor solid on a grid, is never offered to the split below.
 */
function looksMerged(b, unit) {
  const cols = Math.round(b.w / unit), rows = Math.round(b.h / unit);
  if (cols < 1 || rows < 1 || cols * rows < 2) return false;
  if (cols > 30 || rows > 12) return false;
  // Its sides have to be whole marks, within a fifth of one.
  if (Math.abs(b.w - cols * unit) > unit * 0.45) return false;
  if (Math.abs(b.h - rows * unit) > unit * 0.45) return false;
  // Marks are round, so a row of them cannot fill its own box: the corners
  // between neighbouring circles stay empty however hard they have run
  // together. Measured over 192 merged blobs across every size, gap and
  // softness, none reached 0.90 -- while a solid band of colour, which is what
  // a betting button or a header stripe is, sits at 1.00. Without this the
  // split reads any such band as a row of marks and hands back a board that
  // was never there.
  if (b.n / (b.w * b.h) > 0.9) return false;
  // Loose, because a run of one side is rarely a full rectangle -- six down one
  // column and four down the next fills two thirds of its own box, and that is
  // the ordinary case. Which cells are really marks is settled per cell in the
  // split itself, so this only has to turn away shapes that are not marks at
  // all: a rule, a border, a strip of chrome.
  return b.n / (b.w * b.h) >= 0.3;
}

/**
 * One merged block, cut back into the marks it was, on the grid it must be.
 *
 * A board is a regular grid, so a run of marks that has bled into one shape is
 * as many cells as it is marks wide and tall -- there is no need to find where
 * one ends and the next begins, which is what softness destroys. Everything in
 * the block is one colour, because that is why it merged, so every cell it is
 * cut into carries that colour.
 *
 * A cell is only kept where the block actually covers it: a merge is often
 * ragged rather than a full rectangle, and an empty corner must stay empty.
 */
function unmerge(codes, w, h, blob, unit) {
  const cols = Math.round(blob.w / unit), rows = Math.round(blob.h / unit);
  const cw = blob.w / cols, ch = blob.h / rows;
  const out = [];
  for (let c = 0; c < cols; c += 1) {
    for (let r = 0; r < rows; r += 1) {
      const x0 = Math.round(blob.minX + c * cw), x1 = Math.round(blob.minX + (c + 1) * cw) - 1;
      const y0 = Math.round(blob.minY + r * ch), y1 = Math.round(blob.minY + (r + 1) * ch) - 1;
      let n = 0, sx = 0, sy = 0;
      for (let y = y0; y <= y1; y += 1) {
        for (let x = x0; x <= x1; x += 1) {
          if (codes[y * w + x] !== blob.code) continue;
          n += 1; sx += x; sy += y;
        }
      }
      // Half the cell has to be the mark's own colour to count as one.
      if (n < (x1 - x0 + 1) * (y1 - y0 + 1) * 0.5) continue;
      out.push({
        code: blob.code, n, cx: sx / n, cy: sy / n,
        minX: x0, minY: y0, maxX: x1, maxY: y1,
        w: x1 - x0 + 1, h: y1 - y0 + 1,
      });
    }
  }
  return out.length > 1 ? out : [];
}

/**
 * How much of a line between two marks' worth of a block may be its colour,
 * at most, for the block to be marks that met rather than one mark.
 */
const PINCH = 0.5;

/**
 * Whether a blob two or more marks across narrows where its marks would meet.
 *
 * A block of one side two marks wide and two tall is as round as one mark,
 * and passes for one -- twice the size, so the board throws it out for its
 * size, and three or four coups go with it. Two neighbouring columns of one
 * side over the same rows is the commonest shape on a bead plate. One mark
 * that big is solid through its middle; a block of marks only touches there.
 * Measured on an owner's casino screen: 14% and 18% of the lines between a
 * block's marks were its colour, where one disc twice the size, a letter
 * across it, is 72% and more.
 */
function pinched(codes, w, blob, unit) {
  const cols = Math.round(blob.w / unit), rows = Math.round(blob.h / unit);
  if (cols < 2 && rows < 2) return false;
  const share = (xa, ya, xb, yb) => {
    let n = 0, all = 0;
    for (let y = ya; y <= yb; y += 1) {
      for (let x = xa; x <= xb; x += 1) {
        all += 1;
        if (codes[y * w + x] === blob.code) n += 1;
      }
    }
    return all ? n / all : 1;
  };
  const cw = blob.w / cols, ch = blob.h / rows;
  for (let c = 1; c < cols; c += 1) {
    const x = Math.round(blob.minX + c * cw);
    if (share(Math.max(blob.minX, x - 1), blob.minY,
              Math.min(blob.maxX, x + 1), blob.maxY) > PINCH) return false;
  }
  for (let r = 1; r < rows; r += 1) {
    const y = Math.round(blob.minY + r * ch);
    if (share(blob.minX, Math.max(blob.minY, y - 1),
              blob.maxX, Math.min(blob.maxY, y + 1)) > PINCH) return false;
  }
  return true;
}

/** Connected components over the classified mask, 4-connectivity. */
function labelBlobs(codes, w, h) {
  const seen = new Uint8Array(w * h);
  const stack = new Int32Array(w * h);
  const blobs = [];

  for (let start = 0; start < codes.length; start++) {
    if (seen[start] || codes[start] === NONE) continue;
    const code = codes[start];
    let sp = 0;
    stack[sp++] = start;
    seen[start] = 1;

    let n = 0, sx = 0, sy = 0;
    let minX = w, maxX = -1, minY = h, maxY = -1;

    while (sp > 0) {
      const p = stack[--sp];
      const x = p % w, y = (p / w) | 0;
      n++; sx += x; sy += y;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;

      if (x > 0     && !seen[p - 1] && codes[p - 1] === code) { seen[p - 1] = 1; stack[sp++] = p - 1; }
      if (x < w - 1 && !seen[p + 1] && codes[p + 1] === code) { seen[p + 1] = 1; stack[sp++] = p + 1; }
      if (y > 0     && !seen[p - w] && codes[p - w] === code) { seen[p - w] = 1; stack[sp++] = p - w; }
      if (y < h - 1 && !seen[p + w] && codes[p + w] === code) { seen[p + w] = 1; stack[sp++] = p + w; }
    }

    blobs.push({
      code, n, cx: sx / n, cy: sy / n,
      w: maxX - minX + 1, h: maxY - minY + 1, minX, minY, maxX, maxY,
    });
  }
  return blobs;
}

const median = (xs) => {
  if (!xs.length) return 0;
  const s = xs.slice().sort((a, b) => a - b);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};

/**
 * Keep blobs that look like board marks: roughly square bounding box, big
 * enough to be a cell and small enough not to be a panel, and filling enough
 * of that box to be a disc or a ring rather than a stroke of text.
 */
function keepMarks(blobs, w, h) {
  const area = w * h;
  return blobs.filter((b) => {
    if (b.w < 6 || b.h < 6) return false;
    if (b.w > w * 0.25 || b.h > h * 0.45) return false;
    if (b.n > area * 0.04) return false;
    const aspect = b.w / b.h;
    if (aspect < 0.62 || aspect > 1.62) return false;
    // A filled disc fills 0.79 of its box and a thin ring far less -- the big
    // road is drawn as rings on most tables, so the floor has to clear them
    // while still rejecting glyphs and stray strokes.
    return b.n / (b.w * b.h) >= 0.22;
  });
}

/** Single-linkage 1-D clustering; returns a bin index per input value. */
function binAxis(values, gap) {
  const order = values.map((v, i) => i).sort((a, b) => values[a] - values[b]);
  const bin = new Array(values.length);
  let current = 0;
  bin[order[0]] = 0;
  for (let i = 1; i < order.length; i++) {
    if (values[order[i]] - values[order[i - 1]] > gap) current++;
    bin[order[i]] = current;
  }
  return { bin, count: current + 1 };
}

const size = (m) => Math.max(m.w, m.h);

/**
 * Union-find grouping of blobs into the separate boards on one screenshot.
 *
 * Two marks join only when they are close AND of a similar size. The size test
 * is what makes this work on a real table: the bottom strip carries a large
 * bead plate, a medium big road and a crowd of small derived-road marks, and
 * the small ones outnumber the rest. Grouping on distance alone would let the
 * scales bleed into one blob; a single global size filter would go further and
 * discard the bead plate outright, since the median size belongs to the marks
 * there are most of.
 *
 * Reach scales with the SMALLER of the pair, so a small mark can never reach
 * out and capture a large one.
 */
function groupBlobs(marks, whole = null) {
  // Sorted left to right, so the scan below can stop instead of finishing.
  //
  // Every pair used to be compared, which is a frame's mark count squared, and
  // the mark count is decided by whatever is on the screen rather than by
  // anything here. Measured on a frame packed edge to edge with small round
  // marks -- 16,781 of them, which is what a wall of miniature roads reduces
  // to: 890ms in one pass on a desktop, and a phone's JavaScript is several
  // times slower than that. Run every two seconds on the thread that also
  // draws the page.
  //
  // Reach is `Math.min(a, b) * 2.2`, and a minimum is never more than either
  // of its arguments -- so no mark can join this one from further than its own
  // size by that factor, whatever is out there. In sorted order the marks only
  // get further away, so the scan stops: the same answer, not an approximation
  // of it. `tests/test_js_port.py` reads a real screen through this and gets
  // the same sequences it did before.
  //
  // The bound belongs to the mark and not to the frame, which matters on a
  // real screen: one big blob -- a lit panel, a banner -- would otherwise
  // widen the window for every small mark in the picture and give most of the
  // saving back.
  const by = marks.map((_, i) => i).sort((p, q) => marks[p].cx - marks[q].cx);

  const parent = marks.map((_, i) => i);
  const find = (x) => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };

  for (let oi = 0; oi < by.length; oi++) {
    const i = by[oi], mi = marks[i], a = size(mi), stop = a * 2.2;
    for (let oj = oi + 1; oj < by.length; oj++) {
      const j = by[oj], mj = marks[j];
      const dx = mj.cx - mi.cx;                                 // sorted: never negative
      if (dx > stop) break;                                     // nor can any j after it
      const b = size(mj);
      if (Math.max(a, b) / Math.min(a, b) > 1.8) continue;      // a different board
      const reach = Math.min(a, b) * 2.2;
      const dy = Math.abs(mi.cy - mj.cy);
      if (dx <= reach && dy <= reach) union(i, j);
    }
  }
  // A board already being read is one board, whatever has come between its
  // marks since. A mark hidden in a young shoe's only column leaves a gap
  // nothing bridges, and the column came apart in two: either half read as a
  // shoe of its own -- the lower one, sharing nothing with the shoe, was
  // filed as the next shoe -- and the hole between them was in neither, so
  // nothing said a mark was missing. Held together, the hole is in the board
  // and the board is read as far as it (see `beadPlaces`).
  //
  // Only marks the size of its own, though. The box is where the board was,
  // and what is there now need not be the board -- a window scrolled puts
  // whatever is above or beside it in the same place.
  if (whole && whole.d) {
    let first = -1;
    marks.forEach((m, i) => {
      if (m.cx < whole.x || m.cx > whole.x2 || m.cy < whole.y || m.cy > whole.y2) return;
      if (size(m) < 0.7 * whole.d || size(m) > 1.4 * whole.d) return;
      if (first < 0) first = i;
      else union(first, i);
    });
  }
  const groups = new Map();
  marks.forEach((m, i) => {
    const root = find(i);
    if (!groups.has(root)) groups.set(root, []);
    groups.get(root).push(m);
  });
  return [...groups.values()];
}

/** Fit one group of marks to a grid and read it in column-major order. */
/**
 * Whether a board small enough to be ambiguous is shaped like a road's opening.
 *
 * Every road here fills column-major: mark i sits at column floor(i/6), row
 * i%6. So the first six marks of a bead plate, a big road or a derived road
 * are one column, however the shoe has gone. A board of six marks lying in one
 * *row* across six columns is therefore not a road that has just started -- it
 * is a row of betting chips, which is what sits beside the strip on every
 * screen this reads, at twice the diameter and in the same three colours.
 *
 * That distinction is what lets the search bar drop to a single mark inside
 * the band where the strip lives, which is what makes the first coup of a shoe
 * readable at all. Above six marks the question answers itself -- a road is
 * into its second column by then -- so the rule applies only where it has to,
 * and a full board is never judged by it.
 */
function opensLikeARoad(board) {
  const n = board.cells.length;

  // Every road here is six rows, so a block far taller than that is not a
  // board read badly -- it is not a board. A baccarat table's felt is the same
  // green as a tie, and a video feed full of it came back as one enormous grid
  // spanning the whole frame: nine rows of twenty-four, a hundred and
  // fifty-nine "coups" that were never dealt. Slack for the odd stack of
  // derived roads binned as one block, none for the felt.
  if (board.nRows > 8) return false;

  // And a road stacks downwards before it moves right, so past one column's
  // worth of marks it has more than one row. A line of them lying flat is a
  // menu, a chip tray, or a row of lit buttons -- all of which a casino screen
  // has, all in these same three colours. The cost is a big road in the middle
  // of a long alternation, which is genuinely one row; the bead plate beside
  // it is the board worth reading anyway, and it is never shaped like that.
  if (n > 6 && board.nRows < 2) return false;

  // Ties are under a tenth of the coups a pack produces and they do not
  // streak. A board that is half ties is a green panel -- felt, a Tie betting
  // zone, a lit strip -- and however many cells it splits into, none of them
  // happened. Left alone below eight cells, where a board is too young for the
  // rate to mean anything.
  if (n >= 8) {
    const ties = board.cells.filter((c) => c.outcome === "T").length;
    if (ties * 2 > n) return false;
  }

  if (n > 6) return true;
  // Under one column's worth, only the shape settles it: the first six marks
  // of any road are one column, so six lying in a row are six chips. Six rows
  // as measured: a young plate with a mark covered at the foot of its first
  // column has a row with nothing in it, which a count of rows skips.
  return board.nCols === 1 || board.nRows === 6 || board.rowSpan === 6;
}

/**
 * Whether a board's cells fill it the way a bead plate is filled: column by
 * column from the top, every column but the last full.
 *
 * Bar a cell, and one more for every column's worth of marks. A cell empty
 * above a filled one, or at the foot of a column the next has gone past, is a
 * mark the frame did not show -- a pointer on it -- and a young shoe's plate
 * with one went down as a big road: read as one, the coups after the hole
 * came out shifted, and short of the depth a reset is asked about at, they
 * were filed as the next shoe. A pop-up covers more than a pointer does, and
 * marks too small for the frame they were shrunk with run together and are
 * lost in twos: a 37-coup plate with four marks gone, under 82% full, went
 * down as a big road the same way, and read so on a reader's first look,
 * with nothing yet to hold it against, the coups after the hole were written
 * down shifted, for good. A big road comes no nearer to passing for one: this
 * is only asked of a board that shows a tie as a cell of its own or both
 * sides in one column, and a big road shows neither (see `buildBoard`). Full
 * means the rows the board shows, not six: a pop-up over the foot of a young
 * shoe's column takes those rows out of the board altogether. Kept a bead
 * plate, it is read as far as the first hole (see `beadPlaces`).
 */
function fillsLikeABeadPlate(cells, nCols, nRows) {
  const depth = new Array(nCols).fill(0), foot = new Array(nCols).fill(-1);
  for (const c of cells) {
    depth[c.col] += 1;
    foot[c.col] = Math.max(foot[c.col], c.row);
  }
  let empty = 0;
  for (let col = 0; col < nCols; col += 1) {
    empty += (col < nCols - 1 ? nRows : foot[col] + 1) - depth[col];
  }
  return empty <= Math.max(1, Math.floor(cells.length / 6));
}

/**
 * Whether a bead plate runs off the top or the foot of the frame.
 *
 * A bead plate's columns are six tall, so one that shows fewer rows past its
 * first column has rows out of sight -- the casino's window too short for
 * it, or scrolled. At the foot of the frame those are its last rows, and the
 * plate is read as far as the first of them, as it is past any hole. At the
 * top they are its first: every mark on screen sits lower in its column than
 * it looks, and read as from the top -- measured in the page, a 37-coup plate
 * with its top two rows above the shared window went into the record as four
 * coups from the wrong rows, and stayed -- so nothing on it is read. Within a
 * row of the edge, because a mark the edge cuts across is too flat to be
 * kept as one at all.
 *
 * A young shoe's single column is short of six rows by nature, so against
 * the top it may be whole or cut, and cannot be told. It is taken as cut: a
 * casino's roads sit under its video, and a plate against the top of the
 * shared window is one the window has been scrolled past. In a long sitting,
 * a three-coup shoe scrolled one row above the window read as a two-coup
 * shoe wanting its first coup, and was filed as a new one, a fragment left
 * in the record. At the foot, a single column's top rows are its first
 * coups, rightly read.
 */
function markFrameCut(board, frameH) {
  board.cut = null;
  if (board.kind !== "bead" || board.rowSpan >= 6) return;
  const reach = board.diameter * 1.2;
  if (board.box.y < reach) {
    board.cut = "top";
    board.holed = true;
    board.sequence = "";
  } else if (board.nCols >= 2 && frameH - board.box.y2 < reach) {
    board.cut = "bottom";
  }
}

/** Whether any column holds both sides -- which a big road's columns never do. */
function mixesSides(cells) {
  return mixedColumns(cells) > 0;
}

/** How many columns hold both sides. */
function mixedColumns(cells) {
  const side = new Map(), mixed = new Set();
  for (const c of cells) {
    if (c.outcome === "T") continue;
    const was = side.get(c.col);
    if (was && was !== c.outcome) mixed.add(c.col);
    side.set(c.col, c.outcome);
  }
  return mixed.size;
}

/** How solid a tie's mark must be to be a bead plate's own disc (see `buildBoard`). */
const SOLID_TIE = 0.55;

/**
 * Where a bead plate's reading stops being one -- the first of its cells that
 * is not in the place the next coup would take, or -1 -- and how many rows it
 * spans, measured the same way.
 *
 * A bead plate fills its cells in order, down each column and then the next,
 * so an empty cell before a filled one is a mark the frame did not show -- a
 * pointer resting on it, a tooltip, a mark the detector missed -- and as a
 * reading every coup after it lands one place early. Measured in the page,
 * one mark of a thirty-seven-coup shoe hidden for nine seconds: second or
 * third from the end, and the record was "mended" into the shoe without it
 * until the mark showed again; in the middle, and the reader asked whether
 * the screen showed some other board altogether, one click from filing the
 * shoe again with a coup missing.
 *
 * Measured, not counted: a cell's place is the number of steps from the first
 * row and column, a step being the closest two neighbouring rows or columns
 * are. The bins only number the rows and columns that have a mark in them, so
 * counted, a hole a whole row wide would close up behind itself.
 */
function beadPlaces(cells) {
  if (cells.length < 2) return { hole: -1, rows: cells.length };
  const centres = (bin, at) => {
    const sum = [], n = [];
    for (const c of cells) {
      sum[c[bin]] = (sum[c[bin]] || 0) + c[at];
      n[c[bin]] = (n[c[bin]] || 0) + 1;
    }
    return sum.map((v, i) => v / n[i]);
  };
  const place = (centre) => {
    let step = Infinity;
    for (let i = 1; i < centre.length; i += 1) step = Math.min(step, centre[i] - centre[i - 1]);
    const at = [0];
    for (let i = 1; i < centre.length; i += 1) {
      at.push(at[i - 1] + Math.max(1, Math.round((centre[i] - centre[i - 1]) / step)));
    }
    return at;
  };
  const col = place(centres("col", "cx")), row = place(centres("row", "cy"));
  const rows = row[row.length - 1] + 1;
  for (let k = 0; k < cells.length; k += 1) {
    const c = cells[k];
    if (col[c.col] * 6 + row[c.row] !== k) return { hole: k, rows };
  }
  return { hole: -1, rows };
}

function buildBoard(marks, diameter) {
  const gap = diameter * 0.55;
  const cols = binAxis(marks.map((m) => m.cx), gap);
  const rows = binAxis(marks.map((m) => m.cy), gap);

  const cells = marks.map((m, i) => ({
    col: cols.bin[i], row: rows.bin[i],
    outcome: CODE_TO_OUTCOME[m.code],
    cx: m.cx, cy: m.cy, r: Math.max(m.w, m.h) / 2, fill: m.n / (m.w * m.h),
  }));

  // One mark per grid slot: if two landed in the same slot, keep the larger.
  const slots = new Map();
  for (const c of cells) {
    const key = `${c.col},${c.row}`;
    const prev = slots.get(key);
    if (!prev || c.r > prev.r) slots.set(key, c);
  }
  const unique = [...slots.values()].sort((a, b) => (a.col - b.col) || (a.row - b.row));

  const nRows = rows.count, nCols = cols.count;
  const occupancy = unique.length / Math.max(1, nRows * nCols);
  const hasTie = unique.some((c) => c.outcome === "T");

  // A bead plate is a dense grid at most six rows tall that spells ties as
  // their own cells. Anything taller is a stack of derived roads read as one
  // block; anything sparser is a big road, which marks a tie as a slash across
  // a Player/Banker cell rather than opening one.
  //
  // Sparse is not the whole test, though. A bead plate fills column by column,
  // so a young shoe's second column is nearly empty: seven coups fill seven of
  // twelve cells, and a shoe of seven to nine read as a big road -- the page
  // telling the viewer they were reading the wrong board while they were
  // reading the right one. A board filled the bead plate's way, every column
  // but the last full and the last filled from the top, is a bead plate where
  // it shows what no big road can: a tie as a cell of its own, or both sides
  // in one column.
  //
  // And one that does not fill like one -- a pop-up over a block of a young
  // plate, on a reader's first look, with nothing on record to hold it
  // against: a 20-coup plate with four marks covered went down as a big road
  // and into the record wrong -- is a bead plate still where it shows that
  // past doubt: a tie as a disc of its own, solid and the size of the rest,
  // or both sides in two columns. A big road writes a tie across a mark, as a
  // stroke or a figure: on an owner's screen a green "1", two thirds the size
  // of the rings and 0.44 solid, where every bead plate's ties on record were
  // full size and 0.64 or more. And a big road's column holds one side, but
  // for a long run turned under along its foot -- so its foot is not counted.
  const showsIt = unique.some((c) => c.outcome === "T" && c.fill >= SOLID_TIE && c.r * 2 >= diameter * 0.8)
    || mixedColumns(unique.filter((c) => c.row < nRows - 1)) >= 2;
  const kind = nRows <= 6 && (occupancy >= 0.82
    || (fillsLikeABeadPlate(unique, nCols, nRows) && (hasTie || mixesSides(unique)))
    || (occupancy >= 0.5 && showsIt))
    ? "bead" : "bigroad";
  // A big road is sparse by nature; only a bead plate has holes to find.
  const placed = kind === "bead" ? beadPlaces(unique) : { hole: -1, rows: nRows };
  const hole = placed.hole;

  return {
    kind, cells: unique, nRows, nCols, occupancy, hasTie, diameter,
    // Read as far as the first hole, and said to have one: past it, nothing
    // on screen is in the place it seems to be.
    sequence: (hole < 0 ? unique : unique.slice(0, hole)).map((c) => c.outcome).join(""),
    holed: hole >= 0,
    // The rows it spans, a row a hole has emptied included (see `beadPlaces`).
    rowSpan: placed.rows,
    box: {
      x: Math.min(...marks.map((m) => m.minX)), y: Math.min(...marks.map((m) => m.minY)),
      x2: Math.max(...marks.map((m) => m.maxX)), y2: Math.max(...marks.map((m) => m.maxY)),
    },
    // Cell count alone would hand the pick to the derived roads, which carry
    // far more marks than the bead plate and mean far less. Six rows exactly,
    // ties as their own cells, and the largest marks on screen are what
    // actually identify a bead plate, so those decide it.
    shape: (0.4 + occupancy) * (nRows === 6 ? 3.0 : 0.5) * (hasTie ? 1.5 : 1),
  };
}

/**
 * Undo glare before anything is classified.
 *
 * A screen photographed with a window behind it comes back lifted toward
 * white: every channel is squeezed into the top of its range. Hue survives
 * that, but saturation does not -- and the grey gate above is relative
 * (`d / max`). Green is the least saturated of the three marks to begin with
 * (0.58, against red's 0.77 and blue's 0.87), so under glare the ties fall
 * through the gate first, while red and blue still pass. A dropped tie is not
 * reported as unreadable; it simply is not in the board, and every coup after
 * it shifts up one. That is the one failure worse than reading nothing: it
 * puts a record into the corpus that never happened, and it moves the tie rate,
 * which is one of the seventeen statistics the integrity battery tests.
 *
 * Glare is an affine map on every channel at once (`v -> a + b·v`), so its
 * inverse is one too, and applying the same stretch to all three channels
 * leaves hue exactly where it was. The ends come from percentiles rather than
 * the extremes, so one blown highlight cannot set the scale, and the stretch
 * is skipped unless the range is genuinely squeezed -- a screen capture
 * already fills it, and passes through untouched.
 */
const GLARE_RANGE = 190;     // a spread wider than this needs no help
const GLARE_FLOOR = 80;      // glare leaves nothing dark; a dark board is all dark
const GLARE_MAX_GAIN = 3;    // beyond this the picture is noise, not glare
const GLARE_MIN_MARKS = 4;   // only help a board that is already partly there

function glareStretch(data, stride, x0, y0, w, h) {
  const hist = new Uint32Array(256);
  let n = 0;
  // Every fourth pixel each way: enough for a percentile, a sixteenth of the work.
  const step = 4;
  for (let y = 0; y < h; y += step) {
    for (let x = 0; x < w; x += step) {
      const p = ((y + y0) * stride + (x + x0)) * 4;
      if (data[p + 3] < 128) continue;
      hist[data[p]] += 1; hist[data[p + 1]] += 1; hist[data[p + 2]] += 1;
      n += 3;
    }
  }
  if (n < 300) return null;

  const at = (frac) => {
    let seen = 0, target = frac * n;
    for (let v = 0; v < 256; v += 1) {
      seen += hist[v];
      if (seen >= target) return v;
    }
    return 255;
  };
  const lo = at(0.02), hi = at(0.98);
  const spread = hi - lo;
  if (spread >= GLARE_RANGE || spread < 20) return null;
  // The tell is a lifted *floor*. Glare adds light, so nothing in the picture
  // is dark any more. A board on a dark theme has a squeezed range too, but
  // for the opposite reason -- its background is near black -- and stretching
  // that lifts the background through the gate's absolute terms (`max < 55`,
  // `d < 38`) and invents marks out of it. Measured: a twelve-coup dark board
  // came back as PBTTBPPPPPPP instead of PBTPBTPBTPBT.
  if (lo < GLARE_FLOOR) return null;

  const gain = Math.min(255 / spread, GLARE_MAX_GAIN);
  const lut = new Uint8Array(256);
  for (let v = 0; v < 256; v += 1) {
    lut[v] = Math.max(0, Math.min(255, Math.round((v - lo) * gain)));
  }
  return lut;
}

/**
 * Find every board-shaped grid of coloured marks in an ImageData.
 *
 * Returns `{boards, bounds, diameter}` with boards ordered best-first.
 * `bounds` spans every board found together -- on a live table that is the
 * whole strip of results along the bottom, bead plate through cockroach road.
 * Reading still comes from one board, but locking and previewing the strip is
 * what a person watching the table actually sees, and it keeps the region
 * stable when the derived roads grow into it.
 *
 * A caller that wants only part of the picture passes `region` in pixels,
 * and one already reading a board passes its box as `whole`, with the size of
 * its marks as `d`: every mark that size inside it is that board's (see
 * `groupBlobs`).
 */
function detectBoards(imageData, { region = null, minCells = 8, whole = null } = {}) {
  const { width: W, height: H, data } = imageData;
  const x0 = region ? Math.max(0, Math.round(region.x)) : 0;
  const y0 = region ? Math.max(0, Math.round(region.y)) : 0;
  const x1 = region ? Math.min(W, Math.round(region.x + region.w)) : W;
  const y1 = region ? Math.min(H, Math.round(region.y + region.h)) : H;
  const w = x1 - x0, h = y1 - y0;
  if (w < 20 || h < 20) return { boards: [], bounds: null, diameter: 0 };

  const codes = new Uint8Array(w * h);
  const classify = (lut) => {
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const p = ((y + y0) * W + (x + x0)) * 4;
        codes[y * w + x] = data[p + 3] < 128 ? NONE
          : lut ? classifyPixel(lut[data[p]], lut[data[p + 1]], lut[data[p + 2]])
                : classifyPixel(data[p], data[p + 1], data[p + 2]);
      }
    }
  };

  classify(null);
  let all = labelBlobs(codes, w, h);
  let marks = keepMarks(all, w, h);

  // Undo glare only where there is already a board to help. Under glare the
  // reds and blues still classify and only the greens fall through, so a washed
  // board arrives here with most of its marks and its ties missing -- while a
  // bright noisy patch of screen (a dealer photo, a lit panel) arrives with
  // none. Stretching the first is the fix; stretching the second amplifies its
  // noise until a mark condenses out of it, which is the failure this is
  // supposed to prevent, not cause. Measured: a warm bright panel that read as
  // nothing came back as a one-mark board reading "B".
  if (marks.length >= GLARE_MIN_MARKS) {
    const lut = glareStretch(data, W, x0, y0, w, h);
    if (lut) {
      classify(lut);
      const relabelled = labelBlobs(codes, w, h);
      const recovered = keepMarks(relabelled, w, h);
      if (recovered.length > marks.length) {
        all = relabelled;
        marks = recovered;
      } else {
        classify(null);                       // nothing gained: keep the picture as it came
        all = labelBlobs(codes, w, h);
      }
    }
  }

  // A run of one outcome is the most common thing on a baccarat board and the
  // easiest to lose: screen sharing and camera photos both carry colour at
  // half resolution, so the pixel or two between two marks of the same side
  // bleeds shut and the whole column labels as a single bar. The bar fails the
  // roundness test above, and the streak disappears from the reading. Splitting
  // those bars back apart costs nothing on a clean screenshot, where there are
  // none.
  // Marks that came through alone say how big a mark is here, and that is what
  // says how many marks are inside a blob that did not. A photo soft enough to
  // leave none standing alone still has the blobs themselves to judge by -- a
  // block of marks is one mark across at its narrow end -- but only where more
  // than one side is among them. A board carries two sides at least; a single
  // band of one colour is a betting button or a header stripe, and guessing a
  // scale from it is how a board gets read where there is none.
  let unit = marks.length ? median(marks.map(size)) : 0;
  if (!unit) {
    const solid = all.filter((b) => Math.min(b.w, b.h) >= 6
      && b.n / (b.w * b.h) >= 0.5 && b.n / (b.w * b.h) <= 0.9);
    if (new Set(solid.map((b) => b.code)).size >= 2) {
      unit = median(solid.map((b) => Math.min(b.w, b.h)));
    }
  }
  if (unit >= 6) {
    // A blob that passed for a mark may be marks too: two across and two down
    // is as round as one. How big one mark is has to be asked of the marks
    // around it, not of the frame -- a band holds smaller roads beside the
    // bead plate, and against their size every bead mark is a block.
    const byX = marks.slice().sort((a, b) => a.cx - b.cx);
    const xs = byX.map((m) => m.cx);
    const from = (v) => {
      let lo = 0, hi = xs.length;
      while (lo < hi) { const mid = (lo + hi) >> 1; if (xs[mid] < v) lo = mid + 1; else hi = mid; }
      return lo;
    };
    const around = (b) => {
      const reach = size(b) * 1.5, sizes = [];
      for (let i = from(b.cx - reach); i < byX.length && xs[i] <= b.cx + reach; i += 1) {
        if (byX[i] !== b && Math.abs(byX[i].cy - b.cy) <= reach) sizes.push(size(byX[i]));
      }
      return sizes.length >= 3 ? median(sizes) : 0;
    };
    const split = [], replaced = new Set();
    // Neither a bar nor a block can be smaller than two of the smallest marks,
    // or fill its box less than a ragged run or more than a solid band does --
    // which is most of a noisy frame's blobs, turned away before anything is
    // measured around them.
    const candidate = (b) => size(b) >= 9 && b.n / (b.w * b.h) >= 0.3 && b.n / (b.w * b.h) <= 0.9;
    for (const blob of all) {
      if (!candidate(blob)) continue;
      let u = 0;
      if (!marks.includes(blob)) {
        // A bar is cut by the same measure: its neighbours' size where it has
        // neighbours, the frame's where it has none.
        const near = around(blob), at = near >= 6 ? near : unit;
        if (looksMerged(blob, at)) u = at;
      } else {
        const near = around(blob);
        if (near >= 6 && size(blob) >= near * 1.6 && looksMerged(blob, near)
            && pinched(codes, w, blob, near)) u = near;
      }
      if (!u) continue;
      const parts = unmerge(codes, w, h, blob, u);
      if (!parts.length) continue;
      split.push(...parts);
      replaced.add(blob);
    }
    if (split.length) marks = marks.filter((m) => !replaced.has(m)).concat(split);
  }

  if (marks.length < minCells) return { boards: [], bounds: null, diameter: 0 };

  for (const m of marks) { m.cx += x0; m.cy += y0; m.minX += x0; m.maxX += x0; m.minY += y0; m.maxY += y0; }

  // Size is judged per board, never across the screenshot. A single global
  // median belongs to whichever board has the most marks -- on a real strip,
  // the derived roads -- and filtering against it discards the bead plate,
  // which is both the largest board and the one worth reading.
  const boards = [];
  for (const group of groupBlobs(marks, whole)) {
    if (group.length < minCells) continue;
    const d = median(group.map(size));
    const cells = group.filter((m) => size(m) >= d * 0.55 && size(m) <= d * 1.85);
    if (cells.length < minCells) continue;
    const board = buildBoard(cells, d);
    markFrameCut(board, H);
    if (opensLikeARoad(board)) boards.push(board);
  }

  // Mark size only means something relative to the other boards on the same
  // screen, so it is applied once they are all known.
  const largest = Math.max(...boards.map((b) => b.diameter), 1);
  for (const b of boards) b.score = b.cells.length * b.shape * (b.diameter / largest) ** 1.5;

  // Then the strip is picked as a strip, not as whichever single board shouts
  // loudest.
  //
  // A result strip is several boards in one horizontal band -- the bead plate,
  // the big road, and the derived roads beside them, all at a comparable
  // scale. A betting panel's row of chips is one board on its own, and while a
  // shoe is young it beats the strip outright: six chips at twice the diameter
  // score 6.3 against three coups' 0.77, because the size term is measured
  // against the biggest mark anywhere and a chip is bigger than any coup. So
  // from the first coup to about the eighth -- exactly a new shoe, exactly
  // when it matters -- the reader locked onto the betting panel.
  //
  // Company in the band is what tells them apart, so company decides first and
  // the score decides within it.
  //
  // Within it, and not board by board. Each board's own band is counted from
  // where it stands, and a band of small marks counts as company every stray
  // dot of a derived road that came through on its own -- which a bead disc,
  // four times their size, does not. On an owner's screen with the bead plate
  // full, the counts column and a derived road each had more such company
  // than the bead plate, ranked above it, and the reader read thirty-nine
  // marks of the derived roads as the shoe. So the board with the most
  // company says which band is the strip, and inside it the score decides.
  for (const b of boards) {
    b.band = boards.filter((o) => sharesBand(o, b));
    b.bandScore = b.band.reduce((sum, o) => sum + o.score, 0);
  }
  const byCompany = (a, b) => (b.band.length - a.band.length)
                           || (b.bandScore - a.bandScore)
                           || (b.score - a.score);
  const lead = boards.slice().sort(byCompany)[0];
  const strip = new Set(lead ? lead.band : []);
  boards.sort((a, b) => (strip.has(b) - strip.has(a))
                     || (strip.has(a) ? b.score - a.score : byCompany(a, b)));

  return {
    boards,
    bounds: unionBox(stripBoards(boards)),
    diameter: boards.length ? boards[0].diameter : 0,
  };
}

/**
 * The boards that belong to the same result strip as the best one.
 *
 * A casino screen is not only its strip. A live table carries a video feed and
 * a betting panel, both full of the same reds and blues, and a run of them can
 * pass every test a board has to pass -- a clock face on the felt reads as ten
 * blue marks in a tidy row. Folding those into the strip box drags it up into
 * moving video, and the live watcher then locks its search region onto pixels
 * that change every frame.
 *
 * What actually separates them is layout: a result strip is one horizontal
 * band, with the derived roads beside and below the bead plate at a comparable
 * scale. Anything that shares no vertical band with the best board, or whose
 * marks are a different order of size, is somewhere else on the screen.
 */
function stripBoards(boards) {
  if (!boards.length) return boards;
  const best = boards[0];
  return boards.filter((b) => b === best || sharesBand(b, best));
}

/**
 * Whether two boards sit in the same horizontal band at a comparable scale.
 *
 * The one test behind both "which of these is the strip" and "which of these
 * belong to it": a strip is a row of boards, so its members overlap vertically
 * and their marks are within an order of size of one another. Anything failing
 * either is somewhere else on the screen.
 */
function sharesBand(a, b) {
  if (a === b) return true;
  const overlap = Math.min(a.box.y2, b.box.y2) - Math.max(a.box.y, b.box.y);
  const shorter = Math.min(a.box.y2 - a.box.y, b.box.y2 - b.box.y);
  if (overlap < shorter * 0.25) return false;
  const ratio = Math.max(a.diameter, b.diameter) / Math.min(a.diameter, b.diameter);
  return ratio <= 4;
}

/** The box containing every board found -- the whole result strip. */
function unionBox(boards) {
  if (!boards.length) return null;
  return boards.reduce((acc, b) => ({
    x: Math.min(acc.x, b.box.x), y: Math.min(acc.y, b.box.y),
    x2: Math.max(acc.x2, b.box.x2), y2: Math.max(acc.y2, b.box.y2),
  }), { ...boards[0].box });
}

/* ------------------------------------------------------------ empty grid */

/*
 * Finding the roads before a single coup has been dealt.
 *
 * Everything above this line finds the board by finding its marks, which is
 * the right way round while there are marks. It is exactly the wrong way round
 * at a shoe change, when there are none -- and a shoe change is when the reader
 * has the most to lose, because the region it is holding is the only thing that
 * tells the next coup apart from the table next door.
 *
 * But the roads do not disappear when they empty. The bead plate, the big road
 * and the three derived roads are a printed lattice of cells, drawn on the page
 * whether or not anything has been dealt into them -- that is what the operator
 * clears *to*. So the panel is findable with nothing in it, by its own ruling
 * rather than by its contents, and a region pinned to the ruling stays pinned
 * through a shuffle, a wipe, and the first coup of the next shoe.
 *
 * What is being looked for is periodicity: a run of evenly spaced edges across
 * the frame, and another down it, at the same spacing, because road cells are
 * square. Almost nothing else on a casino screen is periodic in both axes at
 * once -- a betting panel is five wide boxes, a chip tray is one row, and the
 * felt is curves -- which is what makes the test specific enough to act on.
 */

/** Cell spacings worth looking for, in working pixels. */
const GRID_MIN_PITCH = 7;
const GRID_MAX_PITCH = 90;

/**
 * The smallest lattice that is a road rather than a coincidence.
 *
 * A bead plate is six rows deep and runs a dozen columns or more; the big road
 * is six deep and wider still. Four rows is below every layout there is, and
 * demanding six columns of a thing that also has to be periodic down the frame
 * is what keeps a row of buttons and a strip of chrome out.
 */
const GRID_MIN_COLS = 6;
const GRID_MIN_ROWS = 4;

/**
 * How far above the background a rule has to stand to count as one.
 *
 * A share of the profile's own range, so it means the same thing on a dark
 * panel with hairline rules and on a light one with heavy ones. Low, because
 * the run test below is what does the discriminating -- this only has to let
 * the rules through without flooding the list with noise.
 */
const PEAK_FLOOR = 0.22;

/**
 * And the least a rule may be in absolute terms: a share of the line it
 * crosses.
 *
 * The relative floor above ranks lines against the lines around them, which is
 * two kinds of wrong on its own. Where there is one very long edge -- the
 * border of the panel itself -- it sets the bar by that edge and puts the
 * road's own rules, a sixth as long, underneath it: measured, a bead plate
 * covering a seventh of the frame's width produced exactly one peak, its own
 * border. And where there is no structure at all it ranks grain, which always
 * has a first place to give.
 *
 * A floor under both, low enough that a road filling a fifteenth of the frame
 * still clears it.
 */
const PEAK_MIN_SHARE = 0.06;

/**
 * How much of a run has to be rules that are really there.
 *
 * A run is allowed to step over a missing rule, which is what lets a bead
 * sitting on one not break the panel in half. Allowed without limit, that same
 * licence would chain four unrelated bright spots into a "lattice", so most of
 * the run has to be present rather than assumed.
 */
const GRID_MIN_SOLIDITY = 0.75;

/** Luma of a box of the frame, row-major. */
function lumaBox(imageData, x0, y0, w, h) {
  const { width: W, data } = imageData;
  const out = new Float32Array(w * h);
  for (let j = 0; j < h; j += 1) {
    for (let i = 0; i < w; i += 1) {
      const p = ((y0 + j) * W + (x0 + i)) * 4;
      out[j * w + i] = data[p] * 0.299 + data[p + 1] * 0.587 + data[p + 2] * 0.114;
    }
  }
  return out;
}

/**
 * Spread each peak one pixel either way.
 *
 * A rule one pixel wide answers on the two pixels that bound it and nothing in
 * between, and a rule two wide answers on three with a hole in the middle. The
 * comb below samples whole pixels at a whole-pixel spacing, so it would step
 * straight into those holes -- and a real layout makes it worse, because a
 * spacing of 16.8 drifts a pixel every sixth cell and no integer comb can
 * follow it. Widening each answer is what lets one comb match all of them.
 */
function dilate(profile) {
  const n = profile.length, out = new Float32Array(n);
  for (let i = 0; i < n; i += 1) {
    let peak = profile[i];
    if (i > 0 && profile[i - 1] > peak) peak = profile[i - 1];
    if (i < n - 1 && profile[i + 1] > peak) peak = profile[i + 1];
    out[i] = peak;
  }
  return out;
}

/**
 * The luma step that counts as an edge at all, in levels out of 255.
 *
 * Deliberately low. What separates a rule from noise below is not how strong
 * the step is but how far it runs in one direction, so setting this high buys
 * nothing and loses the faint hairline rules some operators draw.
 */
const STEP_FLOOR = 3;

/** Half-width of the average taken along a rule before differencing.
 *
 *  A rule is constant in its own direction and the grain on top of it is not,
 *  so averaging along it is the one filter that costs the signal nothing. Five
 *  pixels either side divides per-pixel noise by about three, which is the
 *  difference between finding the strip on a compressed screen share and not
 *  finding it at all. */
const SMOOTH = 5;

/**
 * How many pixels of nothing a rule may cross and still be one rule.
 *
 * Wide enough for the rules it meets at right angles, which are a pixel or two
 * each and match their own colour above and below, and narrow enough that two
 * unrelated edges are not chained into one.
 */
const RUN_SLACK = 4;

/**
 * How much of a row, and of a column, is one unbroken edge.
 *
 * The statistic is the length of the longest run of consecutive pixels
 * stepping the same way, as a share of the line. That is what a printed rule
 * is -- a step in one direction, held for the whole width of the road -- and
 * it is what almost nothing else on a casino screen is.
 *
 * Summing the edge energy instead, which is the obvious thing and was the
 * first thing tried, fails twice over. It divides a rule by however much of
 * the line is not road, so a bead plate on its own scored below the noise
 * floor while the same plate beside three derived roads passed. And it counts
 * video grain, which has plenty of energy and no direction: measured on a
 * drawn screen, the felt's noise reached 15 where the rules reached 9.7.
 *
 * A run cannot be faked by grain. Four hundred pixels stepping the same way in
 * a row is a rule; random steps agree on a direction for two or three. So the
 * floor above can sit low enough to catch a hairline, and the run length is
 * left to do the discriminating.
 */
function longestRun(read, count, step) {
  let best = 0, sign = 0, from = 0, gap = 0;
  for (let i = 0; i < count; i += 1) {
    const d = read(i);
    const s = d >= step ? 1 : d <= -step ? -1 : 0;
    if (s === 0) {
      // Neutral, and a rule is full of it: every vertical rule the horizontal
      // one crosses matches its own colour above and below, so the step there
      // is nothing at all. Left to break the run, that alone capped every
      // reading at one cell -- measured, a rule running 578 pixels scored 16.
      // So a short neutral stretch is stepped over and a long one is the end.
      gap += 1;
      if (gap > RUN_SLACK) { sign = 0; gap = 0; }
      continue;
    }
    if (s === sign) { gap = 0; if (i - from + 1 > best) best = i - from + 1; continue; }
    sign = s; from = i; gap = 0;
    if (best < 1) best = 1;
  }
  return best;
}

/**
 * The window to average over at `at`, clamped inside `[0, count)`.
 *
 * Returned as a pair rather than computed twice, because all four places that
 * difference across a rule need the same bounds and getting them subtly
 * different in one of them is the kind of thing that only shows up as the
 * reader failing on somebody's screen.
 *
 * Not called `window`. The build concatenates every module into one scope, so
 * a top-level function of that name shadows the browser's own `window` for the
 * whole page -- `store.js` watches `window` for another tab's writes, and that
 * would simply have stopped. The build's duplicate-name check cannot catch it
 * either, because nothing in this repository *declares* `window`; it is only
 * used.
 */
function spanAround(at, count, half) {
  const width = Math.min(count, 2 * half + 1);
  let lo = at - half;
  if (lo < 0) lo = 0;
  let hi = lo + width;
  if (hi > count) { hi = count; lo = hi - width; }
  return [lo, hi];
}

function rowProfile(L, w, h, i0 = 0, i1 = w) {
  const row = new Float32Array(h);
  const span = Math.max(1, i1 - i0);
  const half = Math.min(SMOOTH, Math.max(0, (span >> 1) - 1));
  for (let j = 0; j < h - 1; j += 1) {
    const a = (j + 1) * w + i0, b = j * w + i0;
    row[j] = longestRun((i) => {
      // Averaged along the rule, which is the one direction it does not vary
      // in. A horizontal rule is the same brightness all the way across, so
      // this leaves it untouched and divides the grain by the root of the
      // window -- and grain is what kills this: five grey levels of it on a
      // resampled frame lost the strip completely, and a compressed screen
      // share has more than five.
      const [lo, hi] = spanAround(i, span, half);
      let up = 0, down = 0;
      for (let x = lo; x < hi; x += 1) { up += L[a + x]; down += L[b + x]; }
      return (up - down) / (hi - lo);
    }, span, STEP_FLOOR) / span;
  }
  return dilate(row);
}

function colProfile(L, w, j0, j1) {
  const col = new Float32Array(w);
  const rows = Math.max(1, j1 - j0);
  const half = Math.min(SMOOTH, Math.max(0, (rows >> 1) - 1));
  for (let i = 0; i < w - 1; i += 1) {
    col[i] = longestRun((j) => {
      // The same, down a vertical rule.
      const [lo, hi] = spanAround(j, rows, half);
      let right = 0, left = 0;
      for (let y = lo; y < hi; y += 1) {
        const at = (j0 + y) * w + i;
        right += L[at + 1]; left += L[at];
      }
      return (right - left) / (hi - lo);
    }, rows, STEP_FLOOR) / rows;
  }
  return dilate(col);
}

/**
 * Where the rules are: every run of pixels standing clear of the background.
 *
 * A threshold rather than a strict local maximum, because a rule two pixels
 * wide has no single maximum and a rule under a bead has a flat top. Each run
 * is reported at its centre, which is the rule's own position to within half a
 * pixel.
 */
function rulePeaks(profile) {
  const n = profile.length;
  const sorted = Float32Array.from(profile).sort();
  const median = sorted[Math.floor(n / 2)];
  // A high quantile rather than the maximum, so one very long edge cannot set
  // the bar for every rule beneath it.
  const high = sorted[Math.min(n - 1, Math.floor(n * 0.98))];
  const floor = Math.max(PEAK_MIN_SHARE, median + (high - median) * PEAK_FLOOR);
  const out = [];
  let i = 0;
  while (i < n) {
    if (profile[i] < floor) { i += 1; continue; }
    let j = i;
    while (j + 1 < n && profile[j + 1] >= floor) j += 1;
    out.push((i + j) / 2);
    i = j + 1;
  }
  return out;
}

/**
 * The longest evenly spaced run of rules, and the spacing it runs at.
 *
 * This is the whole test, and it is deliberately local. A comb fitted across
 * the entire frame was the first thing tried and it does not work: the roads
 * cover a fifth of the screen, so most of the comb's teeth land on the betting
 * panel either way, and the fundamental spacing scored *below* three times
 * itself -- a sparser comb has more phases to choose from and fewer teeth to
 * be wrong about, so it wins by overfitting. Measured on a drawn screen the
 * true spacing of 17 came fourth, behind 51, 68 and 34.
 *
 * A run has no such freedom. Twenty rules in a row at one spacing is a ruled
 * panel and nothing else on a casino screen is that, however much else is
 * bright. One missing rule is stepped over -- a bead sitting on a rule hides
 * it -- and counts as the two cells it spans.
 */
function ruledRuns(peaks, minPitch, maxPitch, keep = 5) {
  const found = [];
  const offer = (chain, cells, links) => {
    if (chain.length < 3) return;
    found.push({
      pitch: (chain[chain.length - 1] - chain[0]) / cells,
      from: chain[0], to: chain[chain.length - 1], cells, chain,
      // What share of the rules this run expects are actually there. A panel
      // drawn with every rule scores 1; a run held together by stepping over
      // gaps scores lower, and is worth less.
      solidity: chain.length / (cells + 1),
      links,
    });
  };

  for (let a = 0; a < peaks.length; a += 1) {
    for (let b = a + 1; b < peaks.length && b <= a + 3; b += 1) {
      const pitch = peaks[b] - peaks[a];
      if (pitch < minPitch || pitch > maxPitch) continue;
      const tol = Math.max(1.5, pitch * 0.14);
      const chain = [peaks[a], peaks[b]];
      const links = [1];                       // cells spanned by each link
      let cells = 1, at = peaks[b];
      for (;;) {
        const next = nearestPeak(peaks, at + pitch, tol);
        if (next !== null) { chain.push(next); links.push(1); cells += 1; at = next; continue; }
        const skip = nearestPeak(peaks, at + 2 * pitch, tol);
        if (skip !== null) { chain.push(skip); links.push(2); cells += 2; at = skip; continue; }
        break;
      }
      at = peaks[a];
      for (;;) {
        const prev = nearestPeak(peaks, at - pitch, tol);
        if (prev !== null) { chain.unshift(prev); links.unshift(1); cells += 1; at = prev; continue; }
        const skip = nearestPeak(peaks, at - 2 * pitch, tol);
        if (skip !== null) { chain.unshift(skip); links.unshift(2); cells += 2; at = skip; continue; }
        break;
      }
      offer(chain, cells, links);

      // And every unbroken stretch of it, as a candidate in its own right.
      //
      // Stepping over a missing rule is what lets a bead sitting on one not
      // break a road in half. It is also what lets two roads printed a cell
      // apart -- the bead plate and the big road, side by side at the same
      // spacing -- chain into one run that spans the gap between them. That
      // run passes every test the columns can be given, because both roads
      // really are ruled; it is the *rows* that then fail, because no row rule
      // crosses the gap. Measured on a drawn screen: fourteen columns, a gap,
      // fourteen more, and a lattice reported over all thirty that read
      // nothing.
      //
      // The stretches have no gaps in them by construction, so whichever road
      // is really there is among them.
      if (links.some((n) => n > 1)) {
        let from = 0;
        for (let i = 0; i <= links.length; i += 1) {
          if (i < links.length && links[i] === 1) continue;
          if (i - from >= 2) offer(chain.slice(from, i + 1), i - from, links.slice(from, i));
          from = i + 1;
        }
      }
    }
  }

  // Longest first, and one entry per distinct lattice: the same run is
  // rediscovered from every pair of rules inside it.
  found.sort((x, y) => y.cells - x.cells);
  const out = [];
  for (const run of found) {
    if (run.cells < 3 || run.solidity < GRID_MIN_SOLIDITY) continue;
    const same = out.some((o) => Math.abs(o.pitch - run.pitch) < 1
      && Math.abs(o.from - run.from) < run.pitch && Math.abs(o.to - run.to) < run.pitch);
    if (same) continue;
    out.push(run);
    if (out.length >= keep) break;
  }
  return out;
}

/** The peak nearest `want`, if one is within `tol`. */
function nearestPeak(peaks, want, tol) {
  let found = null, gap = tol;
  for (const p of peaks) {
    const d = Math.abs(p - want);
    if (d <= gap) { gap = d; found = p; }
    else if (p > want + tol) break;
  }
  return found;
}

/**
 * How much of the box a rule has to actually cross.
 *
 * The two searches above are relative: each measures a line against the other
 * lines around it, which is what lets a hairline rule on a dark panel be found
 * at all. Relative tests have no opinion about whether the thing they ranked
 * first is *anything*, and over a few hundred lines of video grain, one of
 * them always ranks first -- measured, white noise with no structure in it
 * produced a 22-by-12 "lattice" that passed every test above.
 *
 * This is the absolute one, and it is only askable at the end, once the box is
 * known: a rule crosses its own panel. Grain does not cross anything.
 */
const GRID_LINE_SPAN = 0.5;

/** The longest run along one line, allowing for the profile's own widening. */
function runAt(read, at, span) {
  let best = 0;
  for (let d = -1; d <= 1; d += 1) {
    const run = longestRun(read(at + d), span, STEP_FLOOR);
    if (run > best) best = run;
  }
  return best;
}

/**
 * Cut a chain back to the part whose rules really do cross the box.
 *
 * Two jobs, and they are the same job. It throws out a lattice that was never
 * there -- grain, which crosses nothing -- and it cuts a chain that ran from
 * one road straight into the next one beside it, which is what the licence to
 * step over a missing rule buys when two roads sit a cell apart. Measured, the
 * bead plate and the big road chained into a single 68-wide "road" whose rules
 * crossed neither of them.
 *
 * A single failing line in the middle is kept: that is a rule under a column of
 * beads, not the end of the panel.
 */
function trimToCrossing(chain, measure) {
  const ok = chain.map((at) => measure(Math.round(at)) >= GRID_LINE_SPAN);
  for (let i = 1; i < ok.length - 1; i += 1) {
    if (!ok[i] && ok[i - 1] && ok[i + 1]) ok[i] = true;
  }
  let best = null, from = -1;
  for (let i = 0; i <= ok.length; i += 1) {
    if (i < ok.length && ok[i]) { if (from < 0) from = i; continue; }
    if (from >= 0 && (!best || i - from > best[1] - best[0])) best = [from, i];
    from = -1;
  }
  return best ? chain.slice(best[0], best[1]) : [];
}

/**
 * How near two colours have to be to count as the same panel, and how much of
 * a line has to be that colour for the line to be inside it.
 */
const PANEL_TOLERANCE = 34;
const PANEL_SHARE = 0.5;
/**
 * A line made almost entirely of mark colours is not a panel.
 *
 * Marks themselves are skipped when judging a line -- a row through a full
 * bead plate is mostly marks, and it is plainly inside the panel -- but a line
 * with almost nothing else left in it is not a road with beads on it. It is
 * the felt, or a betting box: a wall of one saturated colour, which is exactly
 * what a road panel is not.
 */
const PANEL_MIN_PLAIN = 0.25;
/** Lines of something else to cross before deciding the panel has ended. */
const PANEL_PATIENCE = 4;

/**
 * The colour a lattice is drawn on.
 *
 * Taken over the pixels that are not marks, so a bead plate with every cell
 * filled reports the colour of its ruling and its gaps rather than the colour
 * of whichever side happened to win more -- which is what a median over the
 * whole box gives once the board is full, and it would then grow the panel out
 * along everything else red on the screen.
 */
function panelColour(imageData, box, pitch) {
  const { width: W, data } = imageData;
  const step = Math.max(1, Math.round(pitch / 4));
  const r = [], g = [], b = [];
  for (let y = box.y; y <= box.y2; y += step) {
    for (let x = box.x; x <= box.x2; x += step) {
      const p = (y * W + x) * 4;
      if (classifyPixel(data[p], data[p + 1], data[p + 2]) !== NONE) continue;
      r.push(data[p]); g.push(data[p + 1]); b.push(data[p + 2]);
    }
  }
  if (r.length < 8) return null;
  const mid = (xs) => xs.sort((a, c) => a - c)[Math.floor(xs.length / 2)];
  return [mid(r), mid(g), mid(b)];
}

/**
 * Grow a lattice out to the panel it is drawn on, within the region searched.
 *
 * A found lattice is one road. The region worth watching is the whole result
 * strip -- bead plate, big road, and the three small ones -- and on every
 * layout there is they are printed together on one panel of one colour. So the
 * panel is the thing to grow to, and its colour is already known: it is what
 * lies between the marks in the lattice's own cells.
 *
 * Without this the reader pinned whichever single road it happened to find. On
 * a drawn screen that was the cockroach strip, fifty pixels tall, with the
 * bead plate a hundred pixels above it and outside the region entirely.
 *
 * Bounded by the region it was searched in, because the alternative is growing
 * up into the video: a panel that keeps matching for another four hundred rows
 * is not a panel, it is a test that has stopped discriminating.
 */
function growToPanel(imageData, box, pitch, bounds) {
  const { width: W, data } = imageData;
  const colour = panelColour(imageData, box, pitch);
  if (!colour) return box;
  const [cr, cg, cb] = colour;
  const stride = Math.max(1, Math.round(pitch / 3));

  /** How much of one line is panel, ignoring the marks printed on it. */
  const share = (fixed, from, to, horizontal) => {
    let plain = 0, hit = 0, seen = 0;
    for (let v = from; v <= to; v += stride) {
      const x = horizontal ? v : fixed, y = horizontal ? fixed : v;
      const p = (y * W + x) * 4;
      seen += 1;
      if (classifyPixel(data[p], data[p + 1], data[p + 2]) !== NONE) continue;
      plain += 1;
      const dr = data[p] - cr, dg = data[p + 1] - cg, db = data[p + 2] - cb;
      if (dr * dr + dg * dg + db * db <= PANEL_TOLERANCE * PANEL_TOLERANCE) hit += 1;
    }
    if (!seen || plain < seen * PANEL_MIN_PLAIN) return 0;
    return hit / plain;
  };

  const walk = (start, step, limit, test) => {
    let edge = start, patience = PANEL_PATIENCE;
    for (let v = start + step; step < 0 ? v >= limit : v <= limit; v += step) {
      if (test(v) >= PANEL_SHARE) { edge = v; patience = PANEL_PATIENCE; continue; }
      patience -= 1;
      if (patience <= 0) break;
    }
    return edge;
  };

  const out = { ...box };
  out.y = walk(box.y, -1, bounds.y, (y) => share(y, box.x, box.x2, true));
  out.y2 = walk(box.y2, 1, bounds.y2, (y) => share(y, box.x, box.x2, true));
  out.x = walk(box.x, -1, bounds.x, (x) => share(x, out.y, out.y2, false));
  out.x2 = walk(box.x2, 1, bounds.x2, (x) => share(x, out.y, out.y2, false));
  return out;
}

/**
 * The share of a lattice's cells with a mark in them.
 *
 * A ruling runs on through cells with nothing in them: a young shoe is one
 * column of marks in a panel of empty cells, and a long one still has the
 * rest of its roads empty beside it. But marks drawn with no ruling at all
 * make a lattice too -- on a plain background a row of discs is a long edge,
 * and six rows of them at one spacing pass every test a ruling is put to in
 * `detectGrid` below. That lattice lies *between* the marks, so it is a row
 * short at the top and the bottom, and every cell of it is full. Measured:
 * every lattice found on the owner's real strips and on the drawn screens was
 * at most a third full; every one found among plain discs was entirely full.
 *
 * A cell counts as full when most of a small patch at its centre is mark.
 */
function latticeFill(imageData, box, cols, rows, pitch) {
  const { width: W, data } = imageData;
  if (cols < 1 || rows < 1) return 0;
  const cw = (box.x2 - box.x) / cols, ch = (box.y2 - box.y) / rows;
  const reach = pitch * 0.15;
  let full = 0;
  for (let i = 0; i < cols; i += 1) {
    for (let j = 0; j < rows; j += 1) {
      const cx = box.x + (i + 0.5) * cw, cy = box.y + (j + 0.5) * ch;
      let mark = 0;
      for (let a = -1; a <= 1; a += 1) {
        for (let b = -1; b <= 1; b += 1) {
          const p = (Math.round(cy + b * reach) * W + Math.round(cx + a * reach)) * 4;
          if (classifyPixel(data[p], data[p + 1], data[p + 2]) !== NONE) mark += 1;
        }
      }
      if (mark >= 5) full += 1;
    }
  }
  return full / (cols * rows);
}

/**
 * Find a road's cell lattice, with or without anything dealt into it.
 *
 * Returns the box the ruling covers, the cell pitch, and how many cells across
 * and down -- or null where the frame has no lattice specific enough to act on.
 * The box is the ruling itself; callers that want a region to search widen it,
 * because the derived roads sit beside the bead plate rather than inside it.
 */
function detectGrid(imageData, { region = null } = {}) {
  const { width: W, height: H } = imageData;
  const x0 = region ? Math.max(0, Math.round(region.x)) : 0;
  const y0 = region ? Math.max(0, Math.round(region.y)) : 0;
  const x1 = region ? Math.min(W, Math.round(region.x + region.w)) : W;
  const y1 = region ? Math.min(H, Math.round(region.y + region.h)) : H;
  const w = x1 - x0, h = y1 - y0;
  if (w < 40 || h < 30) return null;

  const L = lumaBox(imageData, x0, y0, w, h);

  const maxPitch = Math.min(GRID_MAX_PITCH,
    Math.floor(w / GRID_MIN_COLS), Math.floor(h / GRID_MIN_ROWS));
  if (maxPitch < GRID_MIN_PITCH) return null;

  // Candidates rather than an answer, on both axes. The longest run is usually
  // the road and sometimes is not -- on a strip where the bead plate, the big
  // road and the small roads are all ruled at once, the longest run across is
  // the one that chains straight through the gaps between them. Verifying each
  // in turn costs a few milliseconds and is the difference between finding the
  // roads and finding the space between them.
  const rowRuns = ruledRuns(rulePeaks(rowProfile(L, w, h)), GRID_MIN_PITCH, maxPitch);

  for (const first of rowRuns) {
    if (first.cells < GRID_MIN_ROWS) continue;

    // Across, at the same spacing, because road cells are square. Given a
    // quarter either way: a layout that rounds its cell height and its cell
    // width to different whole pixels is common, a layout that makes them
    // different shapes is not -- and leaving the spacing free here let the
    // columns fit themselves to whatever else was periodic on the screen.
    const col = colProfile(L, w, Math.floor(first.from), Math.ceil(first.to) + 1);
    const colRuns = ruledRuns(rulePeaks(col), first.pitch * 0.78, first.pitch * 1.28, 3);

    for (const across of colRuns) {
      if (across.cells < GRID_MIN_COLS) continue;

      // The rows again, over the columns' own width. Two runs found separately
      // are not a lattice: the first pass reads each row across the whole
      // region, so it is satisfied by a row with a long edge *somewhere*, and
      // the second is then fitted inside rows that may have nothing to do with
      // the columns it finds.
