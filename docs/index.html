/* ------------------------------------------------------------------ state */

const DEFAULT_LANG = "ko";
let lang = DEFAULT_LANG;
let theme = "auto";
const listeners = new Set();

const read = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
const write = (key, value) => { try { localStorage.setItem(key, value); } catch { /* private mode */ } };

/** The stored choice, else the closest match to the browser's own language. */
function detectLang() {
  const stored = read(LANG_KEY);
  if (stored && LANGS.some((l) => l.code === stored)) return stored;

  for (const tag of (typeof navigator !== "undefined" ? navigator.languages || [navigator.language] : [])) {
    if (!tag) continue;
    const lower = String(tag).toLowerCase();
    if (lower.startsWith("ko")) return "ko";
    if (lower.startsWith("zh")) {
      // Script beats region, but region decides when no script is given:
      // zh-TW, zh-HK and zh-MO are traditional, everything else simplified.
      if (lower.includes("hant") || /-(tw|hk|mo)\b/.test(lower)) return "zh-Hant";
      return "zh-Hans";
    }
    if (lower.startsWith("en")) return "en";
  }
  return DEFAULT_LANG;
}

function currentLang() { return lang; }
function currentTheme() { return theme; }

/**
 * Look up `key` in the current language and fill in `{placeholders}`.
 * A missing key returns the key itself, which shows up on screen rather than
 * failing silently -- the point being that it is meant to be noticed.
 */
function t(key, vars) {
  const entry = S[key];
  let text = entry ? (entry[lang] ?? entry[DEFAULT_LANG] ?? key) : key;
  if (vars) {
    for (const [name, value] of Object.entries(vars)) {
      text = text.split(`{${name}}`).join(String(value));
    }
  }
  return text;
}

/** The label for one outcome code, e.g. "뱅커" / "Banker" / "莊". */
const side = (code) => t("side." + code);
/** The short glyph a board cell carries. */
const mark = (code) => t("mark." + code);

function onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); }
const notify = () => { for (const fn of listeners) fn(); };

/* ------------------------------------------------------------------- DOM */

/**
 * Re-label the static markup.
 *
 * `data-i18n` sets text, `data-i18n-html` sets markup (the strings carrying
 * `<b>` emphasis are authored here, never user input), and the rest set the
 * attributes that also reach a reader.
 */
function applyDom(root = document) {
  for (const node of root.querySelectorAll("[data-i18n]")) {
    node.textContent = t(node.dataset.i18n);
  }
  for (const node of root.querySelectorAll("[data-i18n-html]")) {
    node.innerHTML = t(node.dataset.i18nHtml);
  }
  for (const node of root.querySelectorAll("[data-i18n-ph]")) {
    node.placeholder = t(node.dataset.i18nPh);
  }
  for (const node of root.querySelectorAll("[data-i18n-aria]")) {
    node.setAttribute("aria-label", t(node.dataset.i18nAria));
  }
  for (const node of root.querySelectorAll("[data-i18n-title]")) {
    node.title = t(node.dataset.i18nTitle);
  }
  document.documentElement.lang = lang;
  document.title = t("app.title");
}

function setLang(code) {
  if (!LANGS.some((l) => l.code === code)) return;
  lang = code;
  write(LANG_KEY, code);
  applyDom();
  notify();
}

/* ----------------------------------------------------------------- theme */

/**
 * `auto` leaves the root unstamped so `prefers-color-scheme` decides, which is
 * also how an artifact viewer's own theme reaches the page; `light` and `dark`
 * stamp an explicit choice that overrides it in both directions.
 */
function setTheme(next) {
  if (!THEMES.includes(next)) return;
  theme = next;
  write(THEME_KEY, next);
  const root = document.documentElement;
  if (next === "auto") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", next);
  notify();
}

/** Restore both choices. Call once, before the first render. */
function initPreferences() {
  lang = detectLang();
  const storedTheme = read(THEME_KEY);
  // An artifact viewer stamps the root itself; honour that when nothing is stored.
  const stamped = document.documentElement.getAttribute("data-theme");
  theme = THEMES.includes(storedTheme) ? storedTheme : (stamped === "light" || stamped === "dark" ? stamped : "auto");
  setTheme(theme);
  applyDom();
}

/** Every key that is missing a translation, for the port test to assert on. */
function missingTranslations() {
  const gaps = [];
  for (const [key, entry] of Object.entries(S)) {
    for (const { code } of LANGS) {
      if (typeof entry[code] !== "string" || !entry[code].length) gaps.push(`${key}:${code}`);
    }
  }
  return gaps;
}

/** Placeholders that do not appear in every language of the same key. */
function placeholderMismatches() {
  const bad = [];
  const names = (s) => [...s.matchAll(/\{(\w+)\}/g)].map((m) => m[1]).sort().join(",");
  for (const [key, entry] of Object.entries(S)) {
    const want = names(entry[DEFAULT_LANG] || "");
    for (const { code } of LANGS) {
      if (typeof entry[code] === "string" && names(entry[code]) !== want) bad.push(`${key}:${code}`);
    }
  }
  return bad;
}

/* ═══ core.js ═══ */
/* Punto Banco core, ported from the Python package.
 *
 * This is a faithful transcription of baccarat/core/{rules,shoe,simulator}.py
 * and baccarat/features/roads.py. It exists so the browser build can compute
 * the same numbers as the desktop pipeline without a Python install, and
 * tests/test_js_port.py pins the two against each other on fixed sequences.
 *
 * The simulator's shuffle uses a different PRNG from numpy's, so simulated
 * corpora are not coup-for-coup identical to Python's. Nothing depends on
 * that: the null is a distribution, and every deterministic function of a
 * given outcome sequence -- roads, order statistics, corrections -- is
 * identical, which is what the cross-check asserts.
 */

/* ------------------------------------------------------------------ rules */

const PAYOUT_BANKER = 1.0;
const PAYOUT_PLAYER = 1.0;
const PAYOUT_TIE = 8.0;
const BANKER_COMMISSION = 0.05;

/** P(Banker | not tie) a Banker bet must exceed to break even at 5% commission. */
const BANKER_BREAKEVEN = 1.0 / 1.95;          // 0.5128205128
/** P(Banker | not tie) a Player bet must fall below to break even. */
const PLAYER_BREAKEVEN = 0.5;
/** Banker's share of decided coups in a fresh 8-deck shoe. */
const BASE_BANKER_SHARE = 0.5068248295;
/** Tie probability for a fresh 8-deck shoe. */
const BASE_TIE = 0.095156;
/** Distance from a fresh shoe to the Banker break-even: the yardstick for
 *  "a bias big enough to be worth money". */
const BANKER_BREAKEVEN_GAP = BANKER_BREAKEVEN - BASE_BANKER_SHARE;

/** Point values per rank: 10/J/Q/K are four ranks worth 0, A-9 one each. */
const RANKS_PER_VALUE = [4, 1, 1, 1, 1, 1, 1, 1, 1, 1];
const N_VALUES = 10;

/** Composition of a fresh n-deck shoe as counts per point value. */
function valueVector(nDecks = 8) {
  return RANKS_PER_VALUE.map((ranks) => 4 * nDecks * ranks);
}

/** Player draws a third card on 0-5 and stands on 6-7. Naturals resolve first. */
function playerDraws(total) {
  return total <= 5;
}

/** Banker third-card chart, consulted only when the player drew. */
function bankerDraws(bankerTotal, playerThird) {
  if (playerThird === null || playerThird === undefined) return bankerTotal <= 5;
  switch (bankerTotal) {
    case 0: case 1: case 2: return true;
    case 3: return playerThird !== 8;
    case 4: return playerThird >= 2 && playerThird <= 7;
    case 5: return playerThird >= 4 && playerThird <= 7;
    case 6: return playerThird >= 6 && playerThird <= 7;
    default: return false;                      // 7, 8, 9 stand
  }
}

function isNatural(total) {
  return total >= 8;
}

function settle(playerTotal, bankerTotal) {
  if (playerTotal > bankerTotal) return "P";
  if (bankerTotal > playerTotal) return "B";
  return "T";
}

/** Net profit on a `stake` wagered on `side` given `result`. Ties push. */
function profit(side, result, stake = 1.0, commission = BANKER_COMMISSION) {
  if (result === "T") return side === "T" ? stake * PAYOUT_TIE : 0.0;
  if (side === "T") return -stake;
  if (side !== result) return -stake;
  if (side === "B") return stake * PAYOUT_BANKER * (1.0 - commission);
  return stake * PAYOUT_PLAYER;
}

/**
 * Deal a coup from the front of `values` (point values, dealt in order).
 * Returns {player, banker, outcome, used}. Throws if fewer than four cards.
 */
function playOut(values) {
  if (values.length < 4) throw new Error("a coup needs at least four cards");

  const player = [values[0], values[2]];
  const banker = [values[1], values[3]];
  let idx = 4;

  let pTotal = (player[0] + player[1]) % 10;
  let bTotal = (banker[0] + banker[1]) % 10;

  if (isNatural(pTotal) || isNatural(bTotal)) {
    return { player, banker, outcome: settle(pTotal, bTotal), used: 4 };
  }

  let playerThird = null;
  if (playerDraws(pTotal)) {
    if (values.length <= idx) throw new Error("shoe exhausted before the player's third card");
    playerThird = values[idx++];
    player.push(playerThird);
    pTotal = (pTotal + playerThird) % 10;
  }

  if (bankerDraws(bTotal, playerThird)) {
    if (values.length <= idx) throw new Error("shoe exhausted before the banker's third card");
    const third = values[idx++];
    banker.push(third);
    bTotal = (bTotal + third) % 10;
  }

  return { player, banker, outcome: settle(pTotal, bTotal), used: player.length + banker.length };
}

/* -------------------------------------------------------------------- rng */

/** sfc32: small, fast, and statistically adequate for shuffling a shoe. */
function makeRng(seed) {
  let a = 0x9e3779b9, b = seed >>> 0, c = 0x243f6a88, d = 0x0b7285ff;
  for (let i = 0; i < 12; i++) {
    const t = (a + b | 0) + d | 0;
    d = d + 1 | 0; a = b ^ b >>> 9; b = c + (c << 3) | 0;
    c = (c << 21 | c >>> 11); c = c + t | 0;
  }
  return function rng() {
    const t = (a + b | 0) + d | 0;
    d = d + 1 | 0; a = b ^ b >>> 9; b = c + (c << 3) | 0;
    c = (c << 21 | c >>> 11); c = c + t | 0;
    return (t >>> 0) / 4294967296;
  };
}

/* ------------------------------------------------------------------- shoe */

/**
 * One shuffled 8-deck shoe, dealt from the front.
 *
 * Tracks the same two vectors the Python `Shoe` does. `composition` is what is
 * actually left (oracle); `unseen` is the pack minus what anyone at the table
 * has seen, so the burned-but-unexposed cards stay in it. Only `unseen` is
 * legal information.
 */
class Shoe {
  constructor({ nDecks = 8, cutCardDepth = 14, burn = true, seed = 1 } = {}) {
    this.nDecks = nDecks;
    this.cutCardDepth = cutCardDepth;
    const rng = makeRng(seed);

    const pack = [];
    for (let v = 0; v < N_VALUES; v++) {
      const n = 4 * nDecks * RANKS_PER_VALUE[v];
      for (let i = 0; i < n; i++) pack.push(v);
    }
    for (let i = pack.length - 1; i > 0; i--) {          // Fisher-Yates
      const j = Math.floor(rng() * (i + 1));
      const t = pack[i]; pack[i] = pack[j]; pack[j] = t;
    }

    this.cards = pack;
    this.pos = 0;
    this.true_ = valueVector(nDecks);
    this.unseen = valueVector(nDecks);
    this.cutReached = false;
    if (burn) this._burn();
  }

  get totalCards() { return this.cards.length; }
  get remaining() { return this.totalCards - this.pos; }
  get unseenTotal() { return this.unseen.reduce((a, b) => a + b, 0); }
  get cutCardReached() { return this.pos >= this.totalCards - this.cutCardDepth; }
  get finished() { return this.cutReached || this.remaining < 6; }

  _take(n, observed) {
    if (n > this.remaining) throw new Error(`cannot take ${n} cards, only ${this.remaining} remain`);
    for (let i = 0; i < n; i++) {
      const v = this.cards[this.pos + i];
      this.true_[v] -= 1;
      if (observed) this.unseen[v] -= 1;
    }
    this.pos += n;
  }

  /** Expose one card, then discard that many more face-down (a 0 burns ten). */
  _burn() {
    const exposed = this.cards[this.pos];
    this._take(1, true);
    const count = Math.min(exposed === 0 ? 10 : exposed, this.remaining);
    this._take(count, false);
  }

  /** Deal one coup. The unseen vector is snapshotted before a card moves. */
  dealCoup() {
    if (this.finished) throw new Error("shoe is finished");
    const unseenBefore = this.unseen.slice();
    const window = this.cards.slice(this.pos, this.pos + 6);
    const { player, banker, outcome } = playOut(window);
    this._take(player.length + banker.length, true);
    if (this.cutCardReached) this.cutReached = true;
    return { player, banker, outcome, unseenBefore };
  }
}

/** Deal one complete shoe and return its outcomes as a "PBT" string. */
function simulateShoe(seed, { nDecks = 8, cutCardDepth = 14, burn = true } = {}) {
  const shoe = new Shoe({ nDecks, cutCardDepth, burn, seed });
  const out = [];
  while (!shoe.finished) {
    let coup;
    try { coup = shoe.dealCoup(); } catch { break; }
    out.push(coup.outcome);
  }
  return out.join("");
}

/** `nShoes` independent shoes as an array of "PBT" strings. */
function simulate(nShoes, seed = 20240101, opts = {}) {
  const shoes = new Array(nShoes);
  for (let i = 0; i < nShoes; i++) shoes[i] = simulateShoe((seed + 2654435761 * (i + 1)) | 0, opts);
  return shoes;
}

/* ------------------------------------------------------------------ roads */

const RED = "R", BLUE = "B";

/**
 * Incremental Big Road. Columns are kept logically -- a run of nine Bankers is
 * one column of nine, not a six-cell column plus a tail -- because that is the
 * form the derived-road rules are defined on. `grid()` renders the wrapped
 * display board with dragon tails.
 */
class BigRoad {
  constructor() {
    this.columns = [];
    this.tieCounts = new Map();
    this.nEntries = 0;
  }

  /** Record one coup. Returns [column, row], or null for a tie. */
  add(outcome) {
    if (outcome === "T") {
      if (this.columns.length) {
        const key = `${this.columns.length - 1},${this.columns[this.columns.length - 1].length - 1}`;
        this.tieCounts.set(key, (this.tieCounts.get(key) || 0) + 1);
      }
      return null;
    }
    const last = this.columns[this.columns.length - 1];
    if (last && last[last.length - 1] === outcome) last.push(outcome);
    else this.columns.push([outcome]);
    this.nEntries += 1;
    const col = this.columns[this.columns.length - 1];
    return [this.columns.length - 1, col.length - 1];
  }

  get columnLengths() { return this.columns.map((c) => c.length); }
  get currentStreak() { return this.columns.length ? this.columns[this.columns.length - 1].length : 0; }
  get currentSide() { return this.columns.length ? this.columns[this.columns.length - 1][0] : null; }

  /** The wrapped display board: a column deeper than `rows` turns right. */
  grid(rows = 6) {
    const cells = new Map();
    const has = (r, c) => cells.has(`${r},${c}`);
    for (let colIdx = 0; colIdx < this.columns.length; colIdx++) {
      let r = 0, c = colIdx;
      const column = this.columns[colIdx];
      for (let depth = 0; depth < column.length; depth++) {
        if (depth === 0) {
          while (has(r, c)) c += 1;
        } else {
          let nr = r + 1, nc = c;
          if (nr >= rows || has(nr, nc)) {
            nr = r; nc = c + 1;
            while (has(nr, nc)) nc += 1;
          }
          r = nr; c = nc;
        }
        cells.set(`${r},${c}`, column[depth]);
      }
    }
    if (!cells.size) return Array.from({ length: rows }, () => [null]);
    let width = 0;
    for (const key of cells.keys()) width = Math.max(width, Number(key.split(",")[1]) + 1);
    return Array.from({ length: rows }, (_, r) =>
      Array.from({ length: width }, (_, c) => cells.get(`${r},${c}`) ?? null));
  }
}

/**
 * Derive one road from the Big Road's logical columns.
 *
 * An entry opening column `c` compares the lengths of columns `c-offset` and
 * `c-offset-1`: equal means the board is repeating itself (Red), unequal Blue.
 * An entry extending a column at row `r` asks whether column `c-offset` also
 * reached `r`: yes or never reached `r-1` is Red, stopped exactly one short is
 * Blue. Entries too near the left edge produce nothing.
 */
function derivedRoad(columns, offset) {
  if (offset < 1) throw new Error("offset must be at least 1");
  const out = [];
  for (let c = 0; c < columns.length; c++) {
    for (let r = 0; r < columns[c].length; r++) {
      if (r === 0) {
        const a = c - offset, b = c - offset - 1;
        if (b < 0) continue;
        out.push(columns[a].length === columns[b].length ? RED : BLUE);
      } else {
        const a = c - offset;
        if (a < 0) continue;
        out.push(columns[a].length === r ? BLUE : RED);
      }
    }
  }
  return out;
}

function allDerivedRoads(columns) {
  return {
    big_eye_boy: derivedRoad(columns, 1),
    small_road: derivedRoad(columns, 2),
    cockroach_road: derivedRoad(columns, 3),
  };
}

/** The bead plate: every coup in order, ties included, filled top-to-bottom. */
function beadPlate(outcomes, rows = 6) {
  const width = Math.max(1, Math.ceil(outcomes.length / rows));
  const grid = Array.from({ length: rows }, () => new Array(width).fill(null));
  for (let i = 0; i < outcomes.length; i++) grid[i % rows][Math.floor(i / rows)] = outcomes[i];
  return grid;
}

/* ═══ integrity.js ═══ */
/* Shuffle-integrity battery, ported from baccarat/backtest/integrity.py.
 *
 * The highest-value question a result-only corpus can answer, and the reason
 * it is worth collecting one by hand. Under honest 8-deck rules there is no
 * exploitable signal -- the ceiling on perfect card knowledge is +0.0008% per
 * coup -- so a pattern system can only work if the shoes at a particular table
 * are not properly randomised. That is a testable claim, and this is the test.
 *
 * The null matters more than the statistics. A real baccarat sequence is not
 * i.i.d.: dealing without replacement induces a small genuine dependence
 * within a shoe, so testing against "independent draws at 50.68%" would flag
 * an honest table. The null used here is the simulator itself -- corpora of
 * the same shape, same rules -- so anything the simulator reproduces is what
 * an honest shoe does, and only a deviation from that is evidence.
 */


/** Lags at which serial correlation is measured. */
const LAGS = [1, 2, 3, 4, 5, 6, 8, 10];
/** History depths for the conditional-frequency test. */
const CONDITION_DEPTHS = [1, 2, 3];

/**
 * Streak bias detectable at 80% power with 80 shoes.
 *
 * Measured against a 200-replicate null over 80 trials per strength: the
 * threshold sits between 2.2% (73.8% power) and 2.4% (85.0%), interpolating
 * to 2.3%. Python and this port were swept independently and agree.
 */
const MEASURED_ANCHOR = [80, 0.023];

/** Smallest streak bias `nShoes` can detect at 80% power. */
function detectableBias(nShoes) {
  if (nShoes <= 0) return Infinity;
  const [n0, b0] = MEASURED_ANCHOR;
  return b0 * Math.sqrt(n0 / nShoes);
}

/** Shoes needed to detect `bias` at 80% power. Inverse of the above. */
function shoesForBias(bias) {
  if (bias <= 0) return -1;
  const [n0, b0] = MEASURED_ANCHOR;
  return Math.ceil(n0 * (b0 / bias) ** 2);
}

/* ------------------------------------------------------------- statistics */

/**
 * Non-tie outcomes as +1 (Banker) / -1 (Player) with their shoe indices.
 * Ties are dropped rather than encoded: they push, carry no directional
 * information, and would blur every order statistic below.
 */
function pbSequence(shoes) {
  const signs = [], idx = [];
  for (let s = 0; s < shoes.length; s++) {
    for (const ch of shoes[s]) {
      if (ch === "T") continue;
      signs.push(ch === "B" ? 1 : -1);
      idx.push(s);
    }
  }
  return { signs, idx };
}

const mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;

/** Lag-`lag` correlation, computed only within shoes. */
function autocorrelation(signs, idx, lag) {
  if (signs.length <= lag) return NaN;
  const a = [], b = [];
  for (let i = 0; i + lag < signs.length; i++) {
    if (idx[i] !== idx[i + lag]) continue;      // pairs straddling a shuffle
    a.push(signs[i]); b.push(signs[i + lag]);
  }
  if (a.length < 2) return NaN;
  const prod = a.map((x, i) => x * b[i]);
  return mean(prod) - mean(a) * mean(b);
}

/** Runs per decided coup: Wald-Wolfowitz, normalised. */
function runCount(signs, idx) {
  if (signs.length < 2) return NaN;
  let changes = 0, within = 0;
  for (let i = 1; i < signs.length; i++) {
    if (idx[i] !== idx[i - 1]) continue;
    within += 1;
    if (signs[i] !== signs[i - 1]) changes += 1;
  }
  return within ? changes / within : NaN;
}

/** Chi-square of P(next) against the 2**depth preceding histories. */
function conditionalChi2(signs, idx, depth) {
  const n = signs.length;
  if (n <= depth + 1) return NaN;

  const nStates = 2 ** depth;
  const table = new Float64Array(nStates * 2);
  let used = 0;

  for (let i = depth; i < n; i++) {
    let ok = true, key = 0;
    for (let k = 1; k <= depth; k++) {
      if (idx[i - k] !== idx[i]) { ok = false; break; }
      key = key * 2 + (signs[i - k] > 0 ? 1 : 0);
    }
    if (!ok) continue;
    table[key * 2 + (signs[i] > 0 ? 1 : 0)] += 1;
    used += 1;
  }
  if (used < 50) return NaN;

  const row = new Float64Array(nStates);
  const col = new Float64Array(2);
  let total = 0;
  for (let s = 0; s < nStates; s++) {
    for (let t = 0; t < 2; t++) {
      const v = table[s * 2 + t];
      row[s] += v; col[t] += v; total += v;
    }
  }
  let chi2 = 0;
  for (let s = 0; s < nStates; s++) {
    for (let t = 0; t < 2; t++) {
      const expected = (row[s] * col[t]) / total;
      if (expected > 0) chi2 += (table[s * 2 + t] - expected) ** 2 / expected;
    }
  }
  return chi2;
}

/**
 * Variance of the per-shoe Banker share, relative to the binomial value.
 * A ratio near 1 is what independent-within-shoe sampling produces; above 1
 * means shoes cluster, which is what a poorly shuffled pack looks like from
 * the outside.
 *
 * Exported because the interface wants this one statistic on every render, to
 * widen its confidence interval honestly. Running the whole battery for it
 * costs a hundred milliseconds a keystroke at two thousand shoes.
 */
function shoeShareDispersion(shoes) {
  const shares = [], weights = [];
  for (const shoe of shoes) {
    let n = 0, b = 0;
    for (const ch of shoe) {
      if (ch === "T") continue;
      n += 1; if (ch === "B") b += 1;
    }
    if (n < 20) continue;
    shares.push(b / n); weights.push(n);
  }
  if (shares.length < 5) return NaN;

  const wTotal = weights.reduce((a, b) => a + b, 0);
  const m = shares.reduce((acc, s, i) => acc + s * weights[i], 0) / wTotal;
  const observed = shares.reduce((acc, s, i) => acc + (s - m) ** 2 * weights[i], 0) / wTotal;
  const expected = (m * (1 - m)) / (wTotal / weights.length);
  return expected > 0 ? observed / expected : NaN;
}

/** Mean longest Big Road column per shoe -- the 'dragon' statistic. */
function maxColumnLength(shoes) {
  const longest = [];
  for (const shoe of shoes) {
    const road = new BigRoad();
    for (const ch of shoe) road.add(ch);
    const lengths = road.columnLengths;
    if (lengths.length) longest.push(Math.max(...lengths));
  }
  return longest.length ? mean(longest) : NaN;
}

/** Every order statistic the battery tests, from result-only data. */
function computeStatistics(shoes) {
  const { signs, idx } = pbSequence(shoes);
  const nCoups = shoes.reduce((a, s) => a + s.length, 0);
  let ties = 0;
  for (const s of shoes) for (const ch of s) if (ch === "T") ties += 1;

  const stats = {
    banker_share: signs.length ? signs.filter((x) => x > 0).length / signs.length : NaN,
    tie_rate: nCoups ? ties / nCoups : NaN,
    runs_per_coup: runCount(signs, idx),
    shoe_share_dispersion: shoeShareDispersion(shoes),
    mean_longest_streak: maxColumnLength(shoes),
    coups_per_shoe: shoes.length ? nCoups / shoes.length : NaN,
  };
  for (const lag of LAGS) stats[`autocorr_lag${lag}`] = autocorrelation(signs, idx, lag);
  for (const d of CONDITION_DEPTHS) stats[`conditional_chi2_d${d}`] = conditionalChi2(signs, idx, d);
  return stats;
}

/* ------------------------------------------------------------------- null */

/**
 * Null distribution of every statistic, from honest simulated shoes.
 *
 * Each replicate is an independent corpus of `nShoes` shoes, so the spread
 * reflects the sample size actually being tested rather than an asymptotic
 * approximation. That is what makes the battery valid on 20 hand-entered
 * shoes as well as on 20,000 collected ones.
 *
 * Yields to the caller every `chunk` replicates so a browser can run this
 * without freezing; `onProgress` receives (done, total).
 */
async function simulatedNull(nShoes, {
  nReplicates = 200, seed = 20240101, onProgress = null, chunk = 5, shouldStop = null,
} = {}) {
  const samples = {};
  for (let i = 0; i < nReplicates; i++) {
    const corpus = simulate(nShoes, (seed + 1000 * i + 1) | 0);
    const stats = computeStatistics(corpus);
    for (const [k, v] of Object.entries(stats)) (samples[k] ||= []).push(v);
    if ((i + 1) % chunk === 0 || i === nReplicates - 1) {
      if (onProgress) onProgress(i + 1, nReplicates);
      await new Promise((r) => setTimeout(r, 0));
      if (shouldStop && shouldStop()) return null;
    }
  }
  return samples;
}

/* ------------------------------------------------------------ corrections */

/**
 * Holm-Bonferroni (FWER) and Benjamini-Hochberg (FDR) corrections.
 *
 * With seventeen statistics in the battery, an uncorrected 5% threshold is
 * expected to produce roughly one "significant" result from noise alone.
 * Reporting only the uncorrected figure would be the easiest way to
 * manufacture a false finding.
 */
function adjustPvalues(pvalues, alpha = 0.05) {
  const names = Object.keys(pvalues).filter((k) => Number.isFinite(pvalues[k]));
  const out = {};
  if (!names.length) return out;

  const raw = names.map((k) => pvalues[k]);
  const m = raw.length;
  const order = raw.map((_, i) => i).sort((a, b) => raw[a] - raw[b]);

  const holm = new Array(m);
  let running = 0;
  order.forEach((idx, rank) => {
    running = Math.max(running, (m - rank) * raw[idx]);
    holm[idx] = Math.min(running, 1);
  });

  const bh = new Array(m);
  running = 1;
  for (let rank = m - 1; rank >= 0; rank--) {
    const idx = order[rank];
    running = Math.min(running, (m * raw[idx]) / (rank + 1));
    bh[idx] = Math.min(running, 1);
  }

  names.forEach((name, i) => {
    out[name] = {
      p_raw: raw[i], p_holm: holm[i], p_bh: bh[i],
      significant_holm: holm[i] < alpha, significant_bh: bh[i] < alpha,
    };
  });
  return out;
}

/* ----------------------------------------------------------------- report */

function quantile(sorted, q) {
  if (!sorted.length) return NaN;
  const pos = (sorted.length - 1) * q;
  const lo = Math.floor(pos), hi = Math.ceil(pos);
  return lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
}

/**
 * Test a corpus against honestly simulated shoes of the same shape.
 * `shoes` is an array of "PBT" strings, one per shoe.
 */
function integrityReport(shoes, nullSamples, { alpha = 0.05, nReplicates = 0 } = {}) {
  const nShoes = shoes.length;
  if (nShoes < 3) throw new Error(`the integrity battery needs at least 3 shoes, got ${nShoes}`);

  const observed = computeStatistics(shoes);
  const findings = [];

  for (const [key, value] of Object.entries(observed)) {
    let samples = nullSamples[key];
    if (!samples || !Number.isFinite(value)) continue;
    samples = samples.filter(Number.isFinite);
    if (samples.length < 10) continue;

    const m = mean(samples);
    const variance = samples.reduce((a, x) => a + (x - m) ** 2, 0) / (samples.length - 1);
    const sd = Math.sqrt(variance);
    const z = sd > 0 ? (value - m) / sd : NaN;
    // Empirical two-sided p: how often the null is at least this extreme.
    const extreme = samples.filter((x) => Math.abs(x - m) >= Math.abs(value - m)).length;
    const p = (1 + extreme) / (samples.length + 1);
    const sorted = samples.slice().sort((a, b) => a - b);

    findings.push({
      statistic: key, observed: value, null_mean: m, null_sd: sd, z, p_two_sided: p,
      null_q025: quantile(sorted, 0.025), null_q975: quantile(sorted, 0.975),
    });
  }

  const pmap = {};
  for (const f of findings) pmap[f.statistic] = f.p_two_sided;
  const corrections = adjustPvalues(pmap, alpha);
  const flagged = findings.filter((f) => corrections[f.statistic]?.significant_bh);

  const nCoups = shoes.reduce((a, s) => a + s.length, 0);
  const bias = detectableBias(nShoes);
  const enough = bias <= BANKER_BREAKEVEN_GAP;

  // The verdict is three facts, not a sentence: a deviation was found; or none
  // was and the sample is large enough for that to mean something; or none was
  // and it is not. Which words carry that belongs to the interface layer.
  const kind = flagged.length ? "flag" : enough ? "clean" : "insufficient";

  return {
    n_games: nCoups, n_shoes: nShoes, n_replicates: nReplicates,
    findings: findings.sort((a, b) => Math.abs(b.z || 0) - Math.abs(a.z || 0)),
    corrections,
    verdict_kind: kind,
    flagged: flagged.map((f) => f.statistic),
    detectable_bias: bias,
    sufficient: enough,
    breakeven_gap: BANKER_BREAKEVEN_GAP,
    shoes_needed: shoesForBias(BANKER_BREAKEVEN_GAP),
  };
}

/* ═══ detect.js ═══ */
/* Read a baccarat board off a screenshot.
 *
 * The bead plate is the easiest thing on a baccarat screen to read mechanically
 * and the most valuable: it is a dense grid of solid coloured circles carrying
 * every coup in order, ties included. Nothing here touches a network or a
 * casino's markup -- it is image analysis of a picture the user already has, so
 * it works on any operator's layout, and on a photo of a screen as readily as
 * on a screen capture.
 *
 * The pipeline is deliberately conventional: classify pixels by hue, label
 * connected components, keep the round ones, fit them to a grid, then pick the
 * densest six-row group. Every stage is exposed on the result so the UI can
 * draw what it found and let a person correct it -- the detector proposes, the
 * operator confirms.
 */

/** Mark codes. 0 is "not a mark". */
const NONE = 0, BANKER = 1, PLAYER = 2, TIE = 3;
const CODE_TO_OUTCOME = { 1: "B", 2: "P", 3: "T" };

/** Longest edge the detector works at. Bigger inputs are scaled down first. */
const WORK_MAX = 1400;

/**
 * Classify one pixel by hue, after rejecting anything too dark or too grey to
 * be a board mark. The three hue windows are wide because operators differ --
 * banker red runs #c62828 to #ff4444, player blue #0d47a1 to #4a9eff -- but
 * they leave orange, purple and yellow unclassified, which keeps chrome,
 * badges and dealer photos out of the grid.
 */
function classifyPixel(r, g, b) {
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  if (max < 55 || d < 38 || d / max < 0.32) return NONE;

  let h;
  if (max === r) h = ((g - b) / d) % 6;
  else if (max === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  h = (h * 60 + 360) % 360;

  if (h < 22 || h >= 336) return BANKER;
  if (h >= 80 && h < 186) return TIE;
  if (h >= 186 && h < 266) return PLAYER;
  return NONE;
}

/** Connected components over the classified mask, 4-connectivity. */
function labelBlobs(codes, w, h) {
  const seen = new Uint8Array(w * h);
  const stack = new Int32Array(w * h);
  const blobs = [];

  for (let start = 0; start < codes.length; start++) {
    if (seen[start] || codes[start] === NONE) continue;
    const code = codes[start];
    let sp = 0;
    stack[sp++] = start;
    seen[start] = 1;

    let n = 0, sx = 0, sy = 0;
    let minX = w, maxX = -1, minY = h, maxY = -1;

    while (sp > 0) {
      const p = stack[--sp];
      const x = p % w, y = (p / w) | 0;
      n++; sx += x; sy += y;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;

      if (x > 0     && !seen[p - 1] && codes[p - 1] === code) { seen[p - 1] = 1; stack[sp++] = p - 1; }
      if (x < w - 1 && !seen[p + 1] && codes[p + 1] === code) { seen[p + 1] = 1; stack[sp++] = p + 1; }
      if (y > 0     && !seen[p - w] && codes[p - w] === code) { seen[p - w] = 1; stack[sp++] = p - w; }
      if (y < h - 1 && !seen[p + w] && codes[p + w] === code) { seen[p + w] = 1; stack[sp++] = p + w; }
    }

    blobs.push({
      code, n, cx: sx / n, cy: sy / n,
      w: maxX - minX + 1, h: maxY - minY + 1, minX, minY, maxX, maxY,
    });
  }
  return blobs;
}

const median = (xs) => {
  if (!xs.length) return 0;
  const s = xs.slice().sort((a, b) => a - b);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};

/**
 * Keep blobs that look like board marks: roughly square bounding box, big
 * enough to be a cell and small enough not to be a panel, and filling enough
 * of that box to be a disc or a ring rather than a stroke of text.
 */
function keepMarks(blobs, w, h) {
  const area = w * h;
  return blobs.filter((b) => {
    if (b.w < 6 || b.h < 6) return false;
    if (b.w > w * 0.25 || b.h > h * 0.45) return false;
    if (b.n > area * 0.04) return false;
    const aspect = b.w / b.h;
    if (aspect < 0.62 || aspect > 1.62) return false;
    // A filled disc fills 0.79 of its box and a thin ring far less -- the big
    // road is drawn as rings on most tables, so the floor has to clear them
    // while still rejecting glyphs and stray strokes.
    return b.n / (b.w * b.h) >= 0.22;
  });
}

/** Single-linkage 1-D clustering; returns a bin index per input value. */
function binAxis(values, gap) {
  const order = values.map((v, i) => i).sort((a, b) => values[a] - values[b]);
  const bin = new Array(values.length);
  let current = 0;
  bin[order[0]] = 0;
  for (let i = 1; i < order.length; i++) {
    if (values[order[i]] - values[order[i - 1]] > gap) current++;
    bin[order[i]] = current;
  }
  return { bin, count: current + 1 };
}

const size = (m) => Math.max(m.w, m.h);

/**
 * Union-find grouping of blobs into the separate boards on one screenshot.
 *
 * Two marks join only when they are close AND of a similar size. The size test
 * is what makes this work on a real table: the bottom strip carries a large
 * bead plate, a medium big road and a crowd of small derived-road marks, and
 * the small ones outnumber the rest. Grouping on distance alone would let the
 * scales bleed into one blob; a single global size filter would go further and
 * discard the bead plate outright, since the median size belongs to the marks
 * there are most of.
 *
 * Reach scales with the SMALLER of the pair, so a small mark can never reach
 * out and capture a large one.
 */
function groupBlobs(marks) {
  const parent = marks.map((_, i) => i);
  const find = (x) => { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; };
  const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };

  for (let i = 0; i < marks.length; i++) {
    for (let j = i + 1; j < marks.length; j++) {
      const a = size(marks[i]), b = size(marks[j]);
      if (Math.max(a, b) / Math.min(a, b) > 1.8) continue;      // a different board
      const reach = Math.min(a, b) * 2.2;
      const dx = Math.abs(marks[i].cx - marks[j].cx);
      const dy = Math.abs(marks[i].cy - marks[j].cy);
      if (dx <= reach && dy <= reach) union(i, j);
    }
  }
  const groups = new Map();
  marks.forEach((m, i) => {
    const root = find(i);
    if (!groups.has(root)) groups.set(root, []);
    groups.get(root).push(m);
  });
  return [...groups.values()];
}

/** Fit one group of marks to a grid and read it in column-major order. */
function buildBoard(marks, diameter) {
  const gap = diameter * 0.55;
  const cols = binAxis(marks.map((m) => m.cx), gap);
  const rows = binAxis(marks.map((m) => m.cy), gap);

  const cells = marks.map((m, i) => ({
    col: cols.bin[i], row: rows.bin[i],
    outcome: CODE_TO_OUTCOME[m.code],
    cx: m.cx, cy: m.cy, r: Math.max(m.w, m.h) / 2,
  }));

  // One mark per grid slot: if two landed in the same slot, keep the larger.
  const slots = new Map();
  for (const c of cells) {
    const key = `${c.col},${c.row}`;
    const prev = slots.get(key);
    if (!prev || c.r > prev.r) slots.set(key, c);
  }
  const unique = [...slots.values()].sort((a, b) => (a.col - b.col) || (a.row - b.row));

  const nRows = rows.count, nCols = cols.count;
  const occupancy = unique.length / Math.max(1, nRows * nCols);
  const hasTie = unique.some((c) => c.outcome === "T");

  // A bead plate is a dense grid at most six rows tall that spells ties as
  // their own cells. Anything taller is a stack of derived roads read as one
  // block; anything sparser is a big road, which marks a tie as a slash across
  // a Player/Banker cell rather than opening one.
  const kind = nRows <= 6 && occupancy >= 0.82 ? "bead" : "bigroad";

  return {
    kind, cells: unique, nRows, nCols, occupancy, hasTie, diameter,
    sequence: unique.map((c) => c.outcome).join(""),
    box: {
      x: Math.min(...marks.map((m) => m.minX)), y: Math.min(...marks.map((m) => m.minY)),
      x2: Math.max(...marks.map((m) => m.maxX)), y2: Math.max(...marks.map((m) => m.maxY)),
    },
    // Cell count alone would hand the pick to the derived roads, which carry
    // far more marks than the bead plate and mean far less. Six rows exactly,
    // ties as their own cells, and the largest marks on screen are what
    // actually identify a bead plate, so those decide it.
    shape: (0.4 + occupancy) * (nRows === 6 ? 3.0 : 0.5) * (hasTie ? 1.5 : 1),
  };
}

/**
 * Find every board-shaped grid of coloured marks in an ImageData.
 *
 * Returns `{boards, bounds, diameter}` with boards ordered best-first.
 * `bounds` spans every board found together -- on a live table that is the
 * whole strip of results along the bottom, bead plate through cockroach road.
 * Reading still comes from one board, but locking and previewing the strip is
 * what a person watching the table actually sees, and it keeps the region
 * stable when the derived roads grow into it.
 *
 * A caller that wants only part of the picture passes `region` in pixels.
 */
function detectBoards(imageData, { region = null, minCells = 8 } = {}) {
  const { width: W, height: H, data } = imageData;
  const x0 = region ? Math.max(0, Math.round(region.x)) : 0;
  const y0 = region ? Math.max(0, Math.round(region.y)) : 0;
  const x1 = region ? Math.min(W, Math.round(region.x + region.w)) : W;
  const y1 = region ? Math.min(H, Math.round(region.y + region.h)) : H;
  const w = x1 - x0, h = y1 - y0;
  if (w < 20 || h < 20) return { boards: [], bounds: null, diameter: 0 };

  const codes = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const p = ((y + y0) * W + (x + x0)) * 4;
      if (data[p + 3] < 128) continue;
      codes[y * w + x] = classifyPixel(data[p], data[p + 1], data[p + 2]);
    }
  }

  const all = labelBlobs(codes, w, h);
  const marks = keepMarks(all, w, h);
  if (marks.length < minCells) return { boards: [], bounds: null, diameter: 0 };

  for (const m of marks) { m.cx += x0; m.cy += y0; m.minX += x0; m.maxX += x0; m.minY += y0; m.maxY += y0; }

  // Size is judged per board, never across the screenshot. A single global
  // median belongs to whichever board has the most marks -- on a real strip,
  // the derived roads -- and filtering against it discards the bead plate,
  // which is both the largest board and the one worth reading.
  const boards = [];
  for (const group of groupBlobs(marks)) {
    if (group.length < minCells) continue;
    const d = median(group.map(size));
    const cells = group.filter((m) => size(m) >= d * 0.55 && size(m) <= d * 1.85);
    if (cells.length >= minCells) boards.push(buildBoard(cells, d));
  }

  // Mark size only means something relative to the other boards on the same
  // screen, so it is applied once they are all known.
  const largest = Math.max(...boards.map((b) => b.diameter), 1);
  for (const b of boards) b.score = b.cells.length * b.shape * (b.diameter / largest) ** 1.5;
  boards.sort((a, b) => b.score - a.score);

  return {
    boards,
    bounds: unionBox(boards),
    diameter: boards.length ? boards[0].diameter : 0,
  };
}

/** The box containing every board found -- the whole result strip. */
function unionBox(boards) {
  if (!boards.length) return null;
  return boards.reduce((acc, b) => ({
    x: Math.min(acc.x, b.box.x), y: Math.min(acc.y, b.box.y),
    x2: Math.max(acc.x2, b.box.x2), y2: Math.max(acc.y2, b.box.y2),
  }), { ...boards[0].box });
}

/**
 * Draw an image into a canvas at working resolution and return its ImageData
 * plus the scale that maps working pixels back to the original.
 */
function toWorkingImage(source, canvas) {
  const sw = source.naturalWidth || source.width;
  const sh = source.naturalHeight || source.height;
  const scale = Math.min(1, WORK_MAX / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * scale));
  const h = Math.max(1, Math.round(sh * scale));
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.clearRect(0, 0, w, h);
  ctx.drawImage(source, 0, 0, w, h);
  return { imageData: ctx.getImageData(0, 0, w, h), width: w, height: h, scale };
}

/* ------------------------------------------------------------ text input */

/** Every spelling of an outcome this parser accepts, longest match first. */
const TEXT_TOKENS = [
  ["플레이어", "P"], ["뱅커", "B"], ["타이", "T"], ["무승부", "T"],
  ["player", "P"], ["banker", "B"], ["tie", "T"], ["draw", "T"],
  ["閒", "P"], ["莊", "B"], ["和", "T"], ["闲", "P"], ["庄", "B"],
  ["플", "P"], ["뱅", "B"], ["타", "T"],
  ["p", "P"], ["b", "B"], ["t", "T"], ["d", "T"],
];

/**
 * Parse a pasted sequence in whatever shape it arrives: "PBBTP", "P B B T",
 * "플레이어, 뱅커, 타이", one per line, or 莊閒和. Anything unrecognised is
 * skipped rather than guessed at, and reported so a bad paste is visible.
 */
function parseSequenceText(text) {
  const src = String(text || "").toLowerCase();
  const out = [];
  let skipped = 0, i = 0;

  while (i < src.length) {
    const ch = src[i];
    if (/[\s,;|/\-_.\[\](){}"'`\n\r\t0-9#]/.test(ch)) { i++; continue; }
    let matched = null;
    for (const [token, code] of TEXT_TOKENS) {
      if (src.startsWith(token, i)) { matched = [token, code]; break; }
    }
    if (matched) { out.push(matched[1]); i += matched[0].length; }
    else { skipped++; i++; }
  }
  return { sequence: out.join(""), skipped };
}

/* ═══ live.js ═══ */
/* Watch the table's screen live.
 *
 * Two ways in, one pipeline. `getDisplayMedia` asks the browser for a stream
 * of a window or tab the viewer picks -- the same pixels they are already
 * looking at. `getUserMedia` asks for the camera, which is what a phone has
 * instead: point it at the table's screen and the frames read the same way.
 * Either stream feeds the bead-plate detector, so the board is read
 * continuously with no capture step, and still without touching the
 * operator's site, its markup or its credentials.
 *
 * Two things keep a live feed from writing nonsense into the corpus:
 *
 * 1. A frame caught mid-deal can show a half-drawn board, so a reading is only
 *    emitted once consecutive frames agree on it. Growth is confirmed quickly;
 *    a shoe change, which discards the shoe in progress, is held to a stricter
 *    count.
 * 2. Once the board is found its position is locked, and later frames are only
 *    searched there. That is faster, and it stops the detector wandering onto a
 *    different grid on the same screen between frames.
 */


/** Consecutive identical readings required before a change is accepted. */
const CONFIRM_GROWTH = 2;
const CONFIRM_RESET = 3;
/** Failed reads inside the locked region before falling back to a full search. */
const LOCK_PATIENCE = 3;

class LiveWatcher {
  /**
   * @param {object} opts
   * @param {(seq: string, board: object) => void} opts.onRead   confirmed reading
   * @param {(state: object) => void} opts.onState               status for the UI
   * @param {number} opts.intervalMs                             sampling period
   */
  constructor({ onRead, onState, intervalMs = 2000 } = {}) {
    this.onRead = onRead || (() => {});
    this.onState = onState || (() => {});
    this.intervalMs = intervalMs;

    this.stream = null;
    this.video = null;
    this.canvas = null;
    this.timer = null;
    this.region = null;
    this.bounds = null;      // the whole result strip, in frame pixels
    this.anchor = null;      // centre of the board being read, to keep the pick stable
    this.misses = 0;
    this.candidate = null;
    this.repeats = 0;
    this.lastBoard = null;
    this.lastReadAt = 0;
    this.reads = 0;
    this.error = null;
    this.source = null;      // "screen" or "camera", for the error advice
  }

  get active() { return !!this.stream; }

  /** Sharing a window or tab -- desktop browsers only. */
  static get screenSupported() {
    return typeof navigator !== "undefined" && !!navigator.mediaDevices?.getDisplayMedia;
  }

  /** The camera -- what a phone has instead of screen sharing. */
  static get cameraSupported() {
    return typeof navigator !== "undefined" && !!navigator.mediaDevices?.getUserMedia;
  }

  /** Is any live source available at all? */
  static get supported() {
    return LiveWatcher.screenSupported || LiveWatcher.cameraSupported;
  }

  /**
   * Share a window or tab. Desktop browsers only.
   *
   * Reports failure through `onState` rather than rejecting: what goes wrong
   * here is environmental -- a permissions policy, a cancelled picker -- and
   * the interface has to explain it, not catch it.
   */
  async start() {
    return this._begin("screen", () => navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 4 },
      audio: false,
      // Nudges Chrome's picker toward the tab list, which is what a viewer
      // watching a browser-based table almost always wants.
      preferCurrentTab: false,
      selfBrowserSurface: "exclude",
      surfaceSwitching: "include",
    }));
  }

  /**
   * Point the camera at the table's screen.
   *
   * The rear camera at the highest resolution offered: the bead plate has to
   * survive being photographed, and detail is what the detector has to work
   * with. Everything downstream is identical to a shared screen.
   */
  async startCamera() {
    return this._begin("camera", () => navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1920 },
        height: { ideal: 1080 },
      },
      audio: false,
    }));
  }

  async _begin(source, request) {
    if (this.stream) return true;
    const available = source === "camera" ? LiveWatcher.cameraSupported : LiveWatcher.screenSupported;
    if (!available) {
      this.error = "unsupported";
      this.source = source;
      this._emit();
      return false;
    }
    try {
      this.stream = await request();
    } catch (e) {
      // A permissions-policy block inside an iframe and an outright refusal
      // both arrive as NotAllowedError; they need different advice, and the
      // page cannot tell them apart, so the UI offers both.
      this.error = e?.name === "NotAllowedError" ? "denied"
        : e?.name === "NotFoundError" || e?.name === "OverconstrainedError" ? "nosource"
        : "failed";
      this.stream = null;
      this.source = source;
      this._emit();
      return false;
    }

    this.error = null;
    this.source = source;
    this.video = document.createElement("video");
    this.video.srcObject = this.stream;
    this.video.muted = true;
    this.video.playsInline = true;
    await this.video.play().catch(() => {});
    this.canvas = document.createElement("canvas");

    for (const track of this.stream.getVideoTracks()) {
      track.addEventListener("ended", () => this.stop());
    }

    this._reset();
    this.timer = setInterval(() => this._sample(), this.intervalMs);
    this._sample();
    this._emit();
    return true;
  }

  stop() {
    if (this.timer) clearInterval(this.timer);
    this.timer = null;
    if (this.stream) for (const t of this.stream.getTracks()) t.stop();
    this.stream = null;
    if (this.video) { this.video.srcObject = null; this.video = null; }
    this._reset();
    this._emit();
  }

  /** Forget the locked position, e.g. after switching tables. */
  relock() {
    this.region = null;
    this.bounds = null;
    this.anchor = null;
    this.misses = 0;
    this.candidate = null;
    this.repeats = 0;
  }

  /** Named apart from the global `setInterval` it calls, to stay readable. */
  setSampleInterval(ms) {
    this.intervalMs = ms;
    if (this.timer) {
      clearInterval(this.timer);
      this.timer = setInterval(() => this._sample(), this.intervalMs);
    }
  }

  _reset() {
    this.relock();
    this.lastBoard = null;
    this.reads = 0;
  }

  _emit() {
    this.onState({
      active: this.active,
      error: this.error,
      board: this.lastBoard,
      source: this.source,
      bounds: this.bounds,
      locked: !!this.region,
      lastReadAt: this.lastReadAt,
      reads: this.reads,
      candidate: this.candidate,
      repeats: this.repeats,
    });
  }

  /** Grab one frame, read it, and emit only once frames agree. */
  _sample() {
    const v = this.video;
    if (!v || !v.videoWidth) return;

    const scale = Math.min(1, WORK_MAX / Math.max(v.videoWidth, v.videoHeight));
    const w = Math.round(v.videoWidth * scale), h = Math.round(v.videoHeight * scale);
    if (this.canvas.width !== w || this.canvas.height !== h) {
      this.canvas.width = w; this.canvas.height = h;
    }
    const ctx = this.canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(v, 0, 0, w, h);
    const frame = ctx.getImageData(0, 0, w, h);

    const { boards, bounds } = detectBoards(frame, { region: this.region });
    if (!boards.length && this.region) {
      this.misses += 1;
      if (this.misses >= LOCK_PATIENCE) { this.region = null; this.misses = 0; }
      this._emit();
      return;
    }
    if (!boards.length) { this.lastBoard = null; this._emit(); return; }

    // Prefer the board this run has been reading, so a strip that gains a
    // derived road between frames does not move the reading somewhere else.
    const board = this.anchor ? nearestTo(boards, this.anchor) : boards[0];
    this.misses = 0;
    this.bounds = bounds;
    this.lastBoard = { ...board, frameWidth: w, frameHeight: h };
    this.lastReadAt = Date.now();
    this.reads += 1;

    if (board.sequence === this.candidate) this.repeats += 1;
    else { this.candidate = board.sequence; this.repeats = 1; }

    // Lock on once a reading has held still. The locked region is the whole
    // strip, not just the board being read: the derived roads fill in as the
    // shoe goes on, and a box drawn tight around the bead plate would keep
    // cutting them off.
    if (!this.region && this.repeats >= CONFIRM_GROWTH) {
      const pad = Math.max(30, (bounds.x2 - bounds.x) * 0.04);
      this.region = {
        x: bounds.x - pad, y: bounds.y - pad,
        w: bounds.x2 - bounds.x + pad * 2, h: bounds.y2 - bounds.y + pad * 2,
      };
      this.anchor = { x: (board.box.x + board.box.x2) / 2, y: (board.box.y + board.box.y2) / 2 };
    }

    this.onRead(board.sequence, this.lastBoard, this.repeats);
    this._emit();
  }

  /**
   * Paint the most recent frame into `target`: the whole result strip stays
   * lit, everything else dims, and the board being read is outlined with its
   * cells ringed, so it is obvious both what is being watched and what is
   * actually being counted.
   */
  drawPreview(target) {
    const v = this.video, board = this.lastBoard;
    if (!v || !v.videoWidth || !this.canvas) return false;
    const w = this.canvas.width, h = this.canvas.height;
    target.width = w; target.height = h;
    const ctx = target.getContext("2d");
    ctx.drawImage(this.canvas, 0, 0);
    if (!board) return true;
    drawStrip(ctx, this.canvas, this.bounds || board.box, board);
    return true;
  }
}

/**
 * Decide what a fresh reading means for the shoe in progress.
 *
 * Returns one of `same` (nothing changed), `grow` (the board gained coups),
 * `reset` (the board restarted -- a new shoe) or `hold` (a shorter reading
 * that shares a prefix, which is far more likely to be a half-drawn frame than
 * a real event, so it is ignored).
 */
function diagnose(current, incoming) {
  if (incoming === current) return "same";
  if (!current.length) return "grow";
  if (incoming.startsWith(current)) return "grow";
  if (current.startsWith(incoming)) return "hold";
  return "reset";
}


/** The board whose centre is closest to `point`, falling back to the best. */
function nearestTo(boards, point) {
  let best = boards[0], bestD = Infinity;
  for (const b of boards) {
    const cx = (b.box.x + b.box.x2) / 2, cy = (b.box.y + b.box.y2) / 2;
    const d = (cx - point.x) ** 2 + (cy - point.y) ** 2;
    if (d < bestD) { bestD = d; best = b; }
  }
  return best;
}

/**
 * Dim everything outside `bounds`, then mark `board` inside it.
 *
 * Shared by the live preview and the pasted-capture view so both show the same
 * thing: the strip being watched, and the board being counted.
 */
function drawStrip(ctx, source, bounds, board) {
  const css = getComputedStyle(document.documentElement);
  const w = source.width, h = source.height;
  const pad = Math.max(12, (bounds.x2 - bounds.x) * 0.02);
  const bx = Math.max(0, bounds.x - pad), by = Math.max(0, bounds.y - pad);
  const bw = Math.min(w - bx, bounds.x2 - bounds.x + pad * 2);
  const bh = Math.min(h - by, bounds.y2 - bounds.y + pad * 2);

  ctx.save();
  ctx.fillStyle = "rgba(0,0,0,0.6)";
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(source, bx, by, bw, bh, bx, by, bw, bh);

  ctx.strokeStyle = css.getPropertyValue("--accent").trim();
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, bw, bh);

  if (board) {
    const p = 6;
    ctx.setLineDash([5, 4]);
    ctx.lineWidth = 1.5;
    ctx.strokeRect(board.box.x - p, board.box.y - p,
                   board.box.x2 - board.box.x + p * 2, board.box.y2 - board.box.y + p * 2);
    ctx.setLineDash([]);
    ctx.strokeStyle = css.getPropertyValue("--mark-ring").trim() || "#fff";
    ctx.lineWidth = 1.6;
    for (const c of board.cells) {
      ctx.beginPath();
      ctx.arc(c.cx, c.cy, c.r * 1.12, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* ═══ corpus.js ═══ */
/* Turning the collected shoes into something the desktop package can read.
 *
 * Kept apart from the interface because it is pure: it takes the corpus and
 * returns text, touches no DOM, and is therefore testable in the same place
 * as the rest of the analysis -- which matters, because the CSV it writes is
 * fed straight to `baccarat ingest` and a quoting mistake there corrupts a
 * corpus silently rather than failing.
 */

/** Seconds a live table takes per coup, used to space the timestamps. */
const SECONDS_PER_COUP = 45;

/** The columns `baccarat ingest` sniffs for, in the order it expects. */
const COLUMNS = ["outcome", "shoe_id", "game_no", "table_id", "played_at"];

/** One row per coup, across every table. */
function corpusRows(tables) {
  const rows = [];
  for (const [tableId, entry] of Object.entries(tables)) {
    for (const shoe of entry.shoes) {
      if (!shoe.o.length) continue;
      [...shoe.o].forEach((outcome, i) => {
        rows.push({
          outcome,
          shoe_id: shoe.id,
          game_no: i + 1,
          table_id: tableId,
          played_at: new Date(shoe.t + i * SECONDS_PER_COUP * 1000).toISOString(),
        });
      });
    }
  }
  return rows;
}

/**
 * A table name a person typed, reduced to something safe to carry.
 *
 * Leading `= + - @` and a leading tab or carriage return are how a spreadsheet
 * decides a cell is a formula, and the export is a file people open in one.
 * The value itself must stay faithful -- it round-trips through
 * `baccarat ingest` -- so the guard belongs here, where the name is accepted,
 * rather than in the writer where it would corrupt the column.
 */
function cleanTableName(raw) {
  const text = String(raw ?? "").replace(/[\u0000-\u001f\u007f]/g, " ").trim();
  const stripped = text.replace(/^[=+\-@]+/, "").trim();
  return stripped.slice(0, 60);
}

/**
 * RFC 4180 quoting. Table names are typed by hand, so a comma or a quote in
 * one has to survive the round trip rather than shift every later column.
 */
function csvCell(value) {
  const text = String(value ?? "");
  return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}

function toCsv(rows) {
  return [
    COLUMNS.join(","),
    ...rows.map((r) => COLUMNS.map((c) => csvCell(r[c])).join(",")),
  ].join("\n") + "\n";
}

/* ═══ store.js ═══ */
/* Where the collected shoes live.
 *
 * Two backends behind one interface. The artifact `db` capability is the real
 * store: it survives the browser, and the desktop pipeline can read it back
 * out. `localStorage` mirrors it so the page still works when the capability
 * is not granted, and so a reload is instant rather than waiting on a round
 * trip. Writes go to both; reads prefer db and fall back.
 */

const LS_KEY = "baccarat.corpus.v2";
const SHOE_COLLECTION = "shoes";
const META_DOC = "meta/state";

/** Debounce window for writes. Live entry produces a coup every few seconds;
 *  one write per coup would burn the call budget for nothing. */
const FLUSH_MS = 1800;

class Store {
  constructor() {
    this.db = null;
    this.status = "local";            // local | syncing | synced | error
    this.onStatus = () => {};
    this._pending = new Map();        // shoeId -> record
    this._metaDirty = false;
    this._timer = null;
  }

  /** Resolve the db capability if this view has it. Never throws. */
  async connect() {
    try {
      if (typeof window === "undefined" || !window.claude?.use) return;
      const db = await window.claude.use("db");
      if (!db) return;
      this.db = db;
      this._setStatus("synced");
    } catch {
      /* absence is normal: keep the local mirror */
    }
  }

  _setStatus(s) {
    if (this.status === s) return;
    this.status = s;
    this.onStatus(s);
  }

  /* ------------------------------------------------------------- reading */

  readLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }

  /**
   * Load the corpus, preferring the shared store. Returns
   * `{tables, active, isExample}` or null when nothing has been collected.
   */
  async load() {
    const local = this.readLocal();
    if (!this.db) return local;

    try {
      const [snap, meta] = await Promise.all([
        this.db.collection(SHOE_COLLECTION).limit(1000).get(),
        this.db.doc(META_DOC).get(),
      ]);
      const tables = {};
      snap.docs.forEach((d) => {
        const v = d.data();
        // An empty shoe carries nothing and would just accumulate; earlier
        // versions wrote them, so they are skipped on the way in as well.
        if (!v || typeof v.outcomes !== "string" || !v.outcomes.length) return;
        const t = String(v.table || "live");
        (tables[t] ||= { shoes: [] }).shoes.push({
          id: d.id, o: v.outcomes, closed: !!v.closed, t: Number(v.started) || 0,
        });
      });
      for (const t of Object.values(tables)) t.shoes.sort((a, b) => a.t - b.t || a.id.localeCompare(b.id));

      if (!Object.keys(tables).length) return local;
      const m = meta.exists ? meta.data() : {};
      this._setStatus("synced");
      return { tables, active: String(m.active || Object.keys(tables)[0]), isExample: false };
    } catch {
      this._setStatus("error");
      return local;
    }
  }

  /* ------------------------------------------------------------- writing */

  /** Mirror the whole state locally and queue the changed shoes for the db. */
  save(state, changedShoeIds = []) {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
    } catch {
      /* private mode, quota, or a browser blocking site data: db still runs */
    }
    if (!this.db) return;

    for (const id of changedShoeIds) {
      for (const [table, entry] of Object.entries(state.tables)) {
        const shoe = entry.shoes.find((s) => s.id === id);
        if (!shoe) continue;
        // A shoe with no coups is not written: it says nothing, an artifact's
        // database is capped at five thousand documents, and undo can drop one
        // locally at any time -- which would leave the document orphaned.
        if (shoe.o.length) {
          this._pending.set(id, { table, outcomes: shoe.o, closed: shoe.closed, started: shoe.t });
        } else {
          this._pending.delete(id);
        }
        break;
      }
    }
    this._metaDirty = true;
    this._schedule(state);
  }

  _schedule(state) {
    if (this._timer) clearTimeout(this._timer);
    this._timer = setTimeout(() => this._flush(state), FLUSH_MS);
  }

  async _flush(state) {
    if (!this.db) return;
    const writes = [...this._pending.entries()];
    this._pending.clear();
    const metaDirty = this._metaDirty;
    this._metaDirty = false;
    if (!writes.length && !metaDirty) return;

    this._setStatus("syncing");
    try {
      for (const [id, body] of writes) {
        await this.db.collection(SHOE_COLLECTION).doc(id).set(body);
      }
      if (metaDirty) await this.db.doc(META_DOC).set({ active: state.active, updated: Date.now() });
      this._setStatus("synced");
    } catch (e) {
      // quota_exceeded is not transient: surface it rather than retrying.
      this._setStatus(e?.code === "quota_exceeded" ? "full" : "error");
    }
  }

  /** Remove a table's shoes from the shared store. */
  async deleteShoes(ids) {
    if (!this.db) return;
    try {
      for (const id of ids) await this.db.collection(SHOE_COLLECTION).doc(id).delete();
    } catch {
      this._setStatus("error");
    }
  }
}

/* ═══ app.js ═══ */
/* The install-free console.
 *
 * One loop drives this page: capture the table's screen, paste it, and the
 * bead plate becomes data. Everything else -- the roads, the break-even
 * scale, the integrity battery -- is computed from that data in the browser,
 * with the same code the desktop package runs, so no install is needed and
 * nothing about the operator's site is touched.
 */








const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;

};
const pct = (x, d = 1) => (x * 100).toFixed(d) + "%";

/* Sample sizes worth aiming at, from the measured detection power. */
const MILESTONES = [
  { bias: 0.03, key: "ms1" },
  { bias: 0.012, key: "ms2" },
  { bias: BANKER_BREAKEVEN_GAP, key: "ms3" },
].map((m) => ({ ...m, shoes: shoesForBias(m.bias) }));

/** The label and the tooltip for one order statistic, in the current language. */
function statLabel(key) {
  const lag = key.match(/^autocorr_lag(\d+)$/);
  if (lag) return t("stat.autocorr", { lag: lag[1] });
  const d = key.match(/^conditional_chi2_d(\d+)$/);
  if (d) return t("stat.chi2", { d: d[1] });
  return t("stat." + key);
}

function statWhy(key) {
  const lag = key.match(/^autocorr_lag(\d+)$/);
  if (lag) return t("why.autocorr", { lag: lag[1] });
  const d = key.match(/^conditional_chi2_d(\d+)$/);
  if (d) return d[1] === "1" ? t("why.chi2_1") : t("why.chi2_n", { d: d[1] });

}

/* ------------------------------------------------------------------ state */

const store = new Store();
let state = null;

let nullCache = new Map();  // nShoes -> null samples
let integrityRun = null;
let live = null;            // LiveWatcher, created on first use
let lastReport = null;      // kept so a language change can redraw the verdict
let liveHolds = 0;          // consecutive readings shorter than the shoe in progress

const newShoeId = () => "S" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function exampleState() {
  const shoes = simulate(4, 20240101).map((o, i) => ({
    id: `EXAMPLE-${i + 1}`, o, closed: i < 3, t: Date.now() - (4 - i) * 3.6e6,

const table = () => state.tables[state.active] || (state.tables[state.active] = { shoes: [] });

/** The shoe in progress, opening one if the last is closed. Mutates. */
function currentShoe() {
  const list = shoes();
  let last = list[list.length - 1];
  if (!last || last.closed) {
    last = { id: newShoeId(), o: "", closed: false, t: Date.now() };
    list.push(last);
  }
  return last;
}

/** The same shoe for reading only -- render paths must not open one. */
function openShoe() {
  const list = shoes();
  const last = list[list.length - 1];
  return !last || last.closed ? { id: null, o: "", closed: false, t: 0 } : last;

function commit(changedIds) {
  invalidate();
  store.save(state, changedIds);
  render();
}

/* ---------------------------------------------------------------- editing */

function addOutcomes(seq) {
  if (!seq) return;
  clearExample();
  const shoe = currentShoe();
  shoe.o += seq;
  commit([shoe.id]);

function undo() {
  clearExample();
  const list = shoes();
  for (let i = list.length - 1; i >= 0; i--) {
    if (list[i].o.length) {
      list[i].o = list[i].o.slice(0, -1);
      list[i].closed = false;
      commit([list[i].id]);
      return;
    }
    if (i > 0) list.pop();          // drop an empty trailing shoe and try again
  }

}

function newShoe() {
  clearExample();
  const shoe = currentShoe();
  if (!shoe.o.length) return;       // already on a fresh one
  shoe.closed = true;
  const fresh = { id: newShoeId(), o: "", closed: false, t: Date.now() };
  shoes().push(fresh);
  commit([shoe.id, fresh.id]);

/** Replace the shoe in progress with what a screenshot says it contains. */
function replaceCurrentShoe(seq) {
  clearExample();

  shoe.o = seq;

}

function loadAsNewShoe(seq) {

  else if (last && !last.closed) { last.closed = true; changed.push(last.id); }
  const fresh = { id: newShoeId(), o: seq, closed: false, t: Date.now() };
  list.push(fresh);
  changed.push(fresh.id);
  commit(changed);
}

/** The seeded example exists so the page opens showing what it does. The

  state = { tables: { "Table 1": { shoes: [] } }, active: "Table 1", isExample: false };

/* ------------------------------------------------------------ screenshots */

async function handleImage(source) {
  const canvas = document.createElement("canvas");
  const work = toWorkingImage(source, canvas);
  const { boards, bounds } = detectBoards(work.imageData);
  shot = { ...work, canvas, boards, bounds, pick: 0, region: null };
  renderShot();
}

function rerunDetection(region) {
  if (!shot) return;
  const { boards, bounds } = detectBoards(shot.imageData, { region });
  shot.boards = boards;
  shot.bounds = bounds;
  shot.pick = 0;
  shot.region = region;
  renderShot();
}

function renderShot() {
  const wrap = $("shotWrap"), idle = $("dropIdle");
  if (!shot) { wrap.hidden = true; idle.hidden = false; $("readout").hidden = true; return; }
  idle.hidden = true; wrap.hidden = false; $("readout").hidden = false;

  const view = $("shotCanvas");
  view.width = shot.width; view.height = shot.height;
  const ctx = view.getContext("2d");
  ctx.drawImage(shot.canvas, 0, 0);

  const board = shot.boards[shot.pick];
  if (board) {
    // Light the whole strip of results, outline the board being counted.
    drawStrip(ctx, shot.canvas, unionBox(shot.boards) || board.box, board);
  }

  const readout = $("readout");
  readout.innerHTML = "";
  if (!board) {
    readout.appendChild(el("p", "warn", t("paste.notFound")));
    return;
  }

  const seq = board.sequence;
  // The same comparison the live feed uses: a reading that shares a prefix
  // with the shoe in progress is that shoe seen later, not a new one.
  const mode = diagnose(openShoe().o, seq) === "reset" ? "new" : "same";
  const head = el("div", "readhead");
  head.appendChild(el("span", "chip " + (board.kind === "bead" ? "ok" : "warn"),
    t(board.kind === "bead" ? "paste.kindBead" : "paste.kindBigRoad")));
  head.appendChild(el("span", "readnum",
    t("paste.readMeta", { n: seq.length, rows: board.nRows, cols: board.nCols })));
  const counts = { P: 0, B: 0, T: 0 };
  for (const c of seq) counts[c]++;
  const tally = el("span", "tally");
  for (const k of ["P", "B", "T"]) {
    tally.appendChild(el("i", "dot " + k));
    tally.appendChild(el("span", "n", String(counts[k])));
  }
  head.appendChild(tally);
  readout.appendChild(head);

  const strip = el("div", "seqstrip");
  for (const c of seq) strip.appendChild(el("i", "sq " + c, mark(c)));
  readout.appendChild(strip);

  if (board.kind !== "bead") {
    readout.appendChild(el("p", "warn", t("paste.bigRoadWarn")));
  }

  const actions = el("div", "actions");
  const primary = el("button", "btn primary",
    t(mode === "same" ? "paste.applyCurrent" : "paste.applyNew"));
  primary.onclick = () => {
    if (mode === "same") replaceCurrentShoe(seq); else loadAsNewShoe(seq);
    shot = null; renderShot();
  };
  actions.appendChild(primary);

  const other = el("button", "btn",
    t(mode === "same" ? "paste.applyNew" : "paste.applyCurrent"));
  other.onclick = () => {
    if (mode === "same") loadAsNewShoe(seq); else replaceCurrentShoe(seq);
    shot = null; renderShot();
  };
  actions.appendChild(other);

  if (shot.boards.length > 1) {
    const swap = el("button", "btn ghost", t("paste.otherRegion", { i: shot.pick + 1, n: shot.boards.length }));
    swap.onclick = () => { shot.pick = (shot.pick + 1) % shot.boards.length; renderShot(); };
    actions.appendChild(swap);
  }
  if (shot.region) {
    const reset = el("button", "btn ghost", t("paste.resetRegion"));
    reset.onclick = () => rerunDetection(null);
    actions.appendChild(reset);
  }
  const drop = el("button", "btn ghost", t("paste.cancel"));
  drop.onclick = () => { shot = null; renderShot(); };
  actions.appendChild(drop);
  readout.appendChild(actions);

  readout.appendChild(el("p", "hint", t(mode === "same" ? "paste.sameHint" : "paste.newHint")));
}

/* ------------------------------------------------------------ live read */

/* Reading the screen continuously means committing without a human confirming
   each change, so the rules for what a reading is allowed to do are strict:
   growth is applied once frames agree, a board reset needs more agreement
   because it discards the shoe in progress, and a reading shorter than the
   shoe in progress is never applied silently -- that is what a cropped or
   scrolled bead plate looks like, and it would truncate real data. */

function liveLog(text, kind) {
  const box = $("liveLog");
  const row = el("div");
  const now = new Date();
  const stamp = el("time", null,
    `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}:${String(now.getSeconds()).padStart(2, "0")}`);
  row.appendChild(stamp);
  row.appendChild(el("b", kind || null, text));
  box.prepend(row);
  while (box.children.length > 40) box.lastChild.remove();
}

function onLiveRead(seq, board, repeats) {
  const current = openShoe().o;
  const verdict = diagnose(current, seq);

  if (verdict === "same") { liveHolds = 0; setLiveWarn(null); return; }

  if (verdict === "hold") {
    liveHolds += 1;
    if (liveHolds >= 4) {
      setLiveWarn(
        t("live.shortWarn", { read: seq.length, cur: current.length }),
        {
          label: t("live.shortSwap", { n: seq.length }),
          run: () => {
            replaceCurrentShoe(seq);
            liveHolds = 0;
            setLiveWarn(null);
            liveLog(t("live.logManual", { n: seq.length }));
          },
        });
    }
    return;
  }

  liveHolds = 0;
  setLiveWarn(null);

  if (verdict === "grow" && repeats >= CONFIRM_GROWTH) {
    const added = seq.length - current.length;
    replaceCurrentShoe(seq);
    liveLog(t("live.logGrow", {
      n: added, total: seq.length,
      sides: [...seq.slice(current.length)].map(side).join(" "),
    }));
  } else if (verdict === "reset" && repeats >= CONFIRM_RESET) {
    loadAsNewShoe(seq);
    liveLog(t("live.logNewShoe", { n: seq.length }), "new");
  }
}

function setLiveWarn(text, action) {
  const box = $("liveWarn");
  if (!text) { box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  box.innerHTML = "";
  box.appendChild(el("span", null, text));
  if (action) {
    const b = el("button", "btn ghost", action.label);
    b.style.marginLeft = "8px";
    b.onclick = action.run;
    box.appendChild(b);
  }
}

/* --------------------------------------------------------------- analysis */

/**
 * Banker's share of decided coups at this table, with an honest interval.
 *
 * Memoised, because three panels read it and its dispersion term walks the
 * whole corpus. That corpus is meant to reach two thousand shoes -- the
 * collection panel says so -- and recomputing per panel put a keystroke at
 * a third of a second there.
 */
let revision = 0;
let observedCache = null;

/** Called wherever the corpus or the selected table changes. */
function invalidate() {
  revision += 1;
  observedCache = null;
}

function observed() {
  if (observedCache && observedCache.revision === revision && observedCache.table === state.active) {
    return observedCache.value;
  }
  const value = measure();
  observedCache = { revision, table: state.active, value };
  return value;
}

function measure() {
  const list = shoes().filter((s) => s.o.length);
  let b = 0, n = 0, ties = 0, coups = 0;
  for (const s of list) {
    for (const ch of s.o) {
      coups++;
      if (ch === "T") { ties++; continue; }
      n++; if (ch === "B") b++;
    }
  }
  if (!n) return { n: 0, coups, ties, shoes: list.length };

  const q = b / n;
  // Within-shoe clustering inflates the true standard error above the
  // binomial one, and the dispersion statistic measures exactly that ratio.
  // Only that one statistic is computed: the rest of the battery costs a
  // hundred milliseconds a keystroke at collection scale and says nothing here.
  const disp = list.length >= 5 ? shoeShareDispersion(list.map((s) => s.o)) : NaN;
  const inflate = Number.isFinite(disp) ? Math.sqrt(Math.max(1, disp)) : 1;
  const se = Math.sqrt((q * (1 - q)) / n) * inflate;
  return {
    n, coups, ties, shoes: list.length, q, se, inflate,
    lo: Math.max(0, q - 1.96 * se), hi: Math.min(1, q + 1.96 * se),
  };
}

/** Expected value per coup of a flat unit on each side, ties pushing. */
function edges(q, tieP) {
  const decided = 1 - tieP;
  return { B: decided * (q * 0.95 - (1 - q)), P: decided * (1 - 2 * q) };
}

/* ------------------------------------------------------------ prediction */

/**
 * Where a Banker bet stops being the better of the two losing wagers.
 *
 * Banker returns 0.95q - (1-q), Player returns (1-q) - q, so Banker is ahead
 * while q > 2/3.95 = 50.6329%. A fresh shoe sits at 50.6825% -- just 0.05pp
 * above the line, which is why the pick is never held with any confidence.
 */
const SIDE_CROSSOVER = 2 / 3.95;

/** Cards consumed per coup and by the burn, measured over 3,000 simulated shoes. */
const CARDS_PER_COUP = 4.9392;
const MEAN_BURN = 7.518;
const SHOE_CARDS = 416;

/**
 * The next coup's probabilities, as a posterior rather than a raw rate.
 *
 * The prior is a fair shoe, with a width equal to the Banker break-even gap:
 * a deviation smaller than that could not matter, and one much larger would be
 * extraordinary. So a handful of shoes barely moves the estimate -- which is
 * the honest behaviour, since a handful of shoes genuinely says nothing -- and
 * a large, real deviation moves it as far as the evidence warrants.
 */
function predict() {
  const o = observed();
  const q0 = BASE_BANKER_SHARE, s0 = BANKER_BREAKEVEN_GAP;

  let q = q0, se = s0, informed = false;
  if (o.n >= 30) {
    const w0 = 1 / (s0 * s0), w1 = 1 / (o.se * o.se);
    q = (q0 * w0 + o.q * w1) / (w0 + w1);
    se = Math.sqrt(1 / (w0 + w1));
    informed = true;
  }

  const tie = BASE_TIE, decided = 1 - tie;
  const e = edges(q, tie);
  const pick = e.B >= e.P ? "B" : "P";
  const z = se > 0 ? Math.abs(q - SIDE_CROSSOVER) / se : 0;

  return {
    q, se, informed, n: o.n, z, pick, edge: e[pick],
    probability: { P: decided * (1 - q), B: decided * q, T: tie },
    confidence: z >= 2 ? "high" : z >= 1 ? "medium" : "low",
    moved: Math.abs(q - q0),
    cardsLeft: Math.max(0, Math.round(SHOE_CARDS - MEAN_BURN - openShoe().o.length * CARDS_PER_COUP)),
  };
}

function renderPrediction() {
  const p = predict();

  const bars = $("aiBars");
  bars.innerHTML = "";
  for (const code of ["P", "B", "T"]) {
    const row = el("div", "aibar " + code);
    row.appendChild(el("span", "n", side(code)));
    const track = el("div", "track");
    const fill = el("i");
    // Scaled against the largest share so the three bars stay readable.
    fill.style.width = Math.min(100, (p.probability[code] / 0.5) * 100) + "%";
    track.appendChild(fill);
    row.appendChild(track);
    row.appendChild(el("span", "p", pct(p.probability[code], 1)));
    bars.appendChild(row);
  }

  const pick = $("aiSide");
  pick.textContent = side(p.pick);
  pick.className = "v " + p.pick;

  const facts = [
    { k: t("ai.ev"), v: pct(p.edge, 2), sub: t("ai.perCoup"), neg: p.edge < 0 },
    { k: t("ai.confidence"), v: t("ai.conf." + p.confidence) },
    { k: t("ai.margin"), v: "±" + (1.96 * p.se * 100).toFixed(2) + "%p" },
    { k: t("ai.cardsLeft"), v: String(p.cardsLeft), sub: t("ai.estimated") },
  ];
  const grid = $("aiFacts");
  grid.innerHTML = "";
  for (const f of facts) {
    const row = el("div", "aifact");
    row.appendChild(el("span", "k", f.k));
    const v = el("span", "v" + (f.neg ? " neg" : ""), f.v);
    if (f.sub) v.appendChild(el("small", null, f.sub));
    row.appendChild(v);
    grid.appendChild(row);
  }

  const why = [t("ai.whyBase")];
  if (!p.informed || p.moved < 0.0002) why.push(t("ai.whyThin", { n: p.n }));
  else why.push(t("ai.whyMoved", { n: p.n, delta: (p.moved * 100).toFixed(2) }));
  why.push(t("ai.crossover", { q: pct(SIDE_CROSSOVER, 4), z: p.z.toFixed(1) }));
  $("aiWhy").textContent = why.join(" ");
  $("aiDisclaimer").textContent = t("ai.disclaimer");
}
